<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="变压器：原副线圈结构、电压与匝数关系、理想变压器能量守恒">
<style>
[data-scene="ps-94"] .s94-s1,[data-scene="ps-94"] .s94-s2,[data-scene="ps-94"] .s94-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-94"].s1 .s94-s1,[data-scene="ps-94"].s2 .s94-s2,[data-scene="ps-94"].s3 .s94-s3{opacity:1;visibility:visible}
@keyframes s94fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s94pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s94flow{to{stroke-dashoffset:-40}}
@keyframes s94pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s94glow{0%,100%{stroke-width:2}50%{stroke-width:4}}
[data-scene="ps-94"].s1 .s94-flux{stroke-dasharray:8 7;animation:s94flow 1.2s linear infinite}
[data-scene="ps-94"].s1 .s94-coil{transform-box:fill-box;transform-origin:center;animation:s94pop .55s ease both}
[data-scene="ps-94"].s1 .s94-coil2{animation-delay:.18s}
[data-scene="ps-94"].s1 .s94-bulb{animation:s94pulse 1.8s ease-in-out infinite}
[data-scene="ps-94"].s2 .s94-formula{transform-box:fill-box;transform-origin:center;animation:s94pop .55s ease .15s both}
[data-scene="ps-94"].s2 .s94-case{animation:s94fade .5s ease both}
[data-scene="ps-94"].s2 .s94-case2{animation-delay:.18s}
[data-scene="ps-94"].s3 .s94-arrow{stroke-dasharray:7 6;animation:s94flow 1.1s linear infinite}
[data-scene="ps-94"].s3 .s94-flow{animation:s94fade .5s ease .4s both}
[data-scene="ps-94"].s3 .s94-eq{transform-box:fill-box;transform-origin:center;animation:s94pop .5s ease .2s both}
[data-scene="ps-94"].s3 .s94-bar{animation:s94glow 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">变压器：改变交流电压，传递电能</text>

<!-- 第一步：原线圈和副线圈 -->
<g class="s94-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">变压器由闭合铁芯和绕在铁芯上的原线圈、副线圈组成</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="154" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">变压器的结构</text>

  <text x="296" y="160" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">闭合铁芯</text>
  <rect x="195" y="168" width="200" height="202" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="255" y="222" width="80" height="94" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <g class="s94-flux">
    <line x1="210" y1="342" x2="380" y2="342" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  </g>
  <text x="296" y="334" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">Φ</text>

  <g class="s94-coil">
    <rect x="173" y="210" width="48" height="106" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <g stroke="#d97706" stroke-width="1.4">
      <line x1="178" y1="228" x2="216" y2="228"/>
      <line x1="178" y1="247" x2="216" y2="247"/>
      <line x1="178" y1="266" x2="216" y2="266"/>
      <line x1="178" y1="285" x2="216" y2="285"/>
      <line x1="178" y1="304" x2="216" y2="304"/>
    </g>
  </g>
  <g class="s94-coil s94-coil2">
    <rect x="367" y="210" width="48" height="106" rx="5" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <g stroke="#d97706" stroke-width="1.4">
      <line x1="372" y1="228" x2="410" y2="228"/>
      <line x1="372" y1="247" x2="410" y2="247"/>
      <line x1="372" y1="266" x2="410" y2="266"/>
      <line x1="372" y1="285" x2="410" y2="285"/>
      <line x1="372" y1="304" x2="410" y2="304"/>
    </g>
  </g>

  <circle cx="95" cy="262" r="21" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M84 262 C88 250 92 250 95 262 C98 274 102 274 106 262" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
  <line x1="95" y1="241" x2="95" y2="192" stroke="#475569" stroke-width="2"/>
  <line x1="95" y1="192" x2="173" y2="192" stroke="#475569" stroke-width="2"/>
  <line x1="173" y1="192" x2="173" y2="212" stroke="#475569" stroke-width="2"/>
  <line x1="95" y1="283" x2="95" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="95" y1="330" x2="173" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="173" y1="314" x2="173" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="95" y="362" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">交流电源</text>

  <line x1="415" y1="192" x2="520" y2="192" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="192" x2="520" y2="240" stroke="#475569" stroke-width="2"/>
  <line x1="415" y1="314" x2="415" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="415" y1="330" x2="520" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="520" y1="278" x2="520" y2="330" stroke="#475569" stroke-width="2"/>
  <g class="s94-bulb">
    <circle cx="520" cy="259" r="19" fill="#fef9c3" stroke="#b45309" stroke-width="2.5"/>
    <line x1="508" y1="247" x2="532" y2="271" stroke="#b45309" stroke-width="2"/>
    <line x1="532" y1="247" x2="508" y2="271" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="520" y="306" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">负载</text>

  <rect x="150" y="380" width="100" height="26" rx="13" fill="#fef3c7"/>
  <text x="200" y="398" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">原线圈 n₁</text>
  <rect x="348" y="380" width="100" height="26" rx="13" fill="#fef3c7"/>
  <text x="398" y="398" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">副线圈 n₂</text>
  <text x="296" y="424" font-size="11" fill="#64748b" text-anchor="middle">原线圈接交流，副线圈接负载</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">变压器的工作原理</text>

  <circle cx="610" cy="174" r="12" fill="#dbeafe"/>
  <text x="610" y="179" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="632" y="179" font-size="11.5" font-weight="700" fill="#334155">原线圈接交变电流</text>

  <circle cx="610" cy="216" r="12" fill="#dbeafe"/>
  <text x="610" y="221" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="632" y="221" font-size="11.5" font-weight="700" fill="#334155">铁芯中产生交变磁通量</text>

  <circle cx="610" cy="258" r="12" fill="#dbeafe"/>
  <text x="610" y="263" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="632" y="263" font-size="11.5" font-weight="700" fill="#334155">副线圈发生互感</text>

  <circle cx="610" cy="300" r="12" fill="#dbeafe"/>
  <text x="610" y="305" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="632" y="305" font-size="11.5" font-weight="700" fill="#334155">产生感应电动势</text>

  <rect x="596" y="326" width="248" height="58" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="348" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">铁芯增强磁联系，减少漏磁</text>
  <text x="720" y="370" font-size="11" fill="#92400e" text-anchor="middle">只能改变交流电压</text>
  <text x="720" y="404" font-size="11" fill="#64748b" text-anchor="middle">直流电产生恒定磁场，副线圈无电动势</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">原线圈的电能通过铁芯中的交变磁场传到副线圈，这就是互感</text>
</g>

<!-- 第二步：电压与匝数关系 -->
<g class="s94-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">理想变压器：原、副线圈的电压之比等于它们的匝数之比</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压比与匝数比</text>

  <g class="s94-formula">
    <rect x="76" y="152" width="440" height="58" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="296" y="190" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">U₁ / U₂ = n₁ / n₂</text>
  </g>

  <text x="296" y="238" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">匝数多的一侧电压高，匝数少的一侧电压低</text>

  <g class="s94-case">
    <rect x="56" y="258" width="236" height="150" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="174" y="282" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">升压变压器</text>
    <rect x="90" y="304" width="64" height="66" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#b45309" stroke-width="2">
      <line x1="80" y1="316" x2="94" y2="316"/>
      <line x1="80" y1="330" x2="94" y2="330"/>
      <line x1="80" y1="344" x2="94" y2="344"/>
    </g>
    <g stroke="#b45309" stroke-width="2">
      <line x1="150" y1="310" x2="164" y2="310"/>
      <line x1="150" y1="322" x2="164" y2="322"/>
      <line x1="150" y1="334" x2="164" y2="334"/>
      <line x1="150" y1="346" x2="164" y2="346"/>
      <line x1="150" y1="358" x2="164" y2="358"/>
    </g>
    <text x="88" y="398" font-size="11" font-weight="700" fill="#334155">n₁ 少</text>
    <text x="154" y="398" font-size="11" font-weight="700" fill="#334155">n₂ 多</text>
    <text x="216" y="336" font-size="12" font-weight="900" fill="#1e40af">U₂ &gt; U₁</text>
    <text x="216" y="362" font-size="11" fill="#475569">n₂ &gt; n₁</text>
  </g>

  <g class="s94-case s94-case2">
    <rect x="308" y="258" width="236" height="150" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="426" y="282" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">降压变压器</text>
    <rect x="342" y="304" width="64" height="66" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#b45309" stroke-width="2">
      <line x1="332" y1="310" x2="346" y2="310"/>
      <line x1="332" y1="322" x2="346" y2="322"/>
      <line x1="332" y1="334" x2="346" y2="334"/>
      <line x1="332" y1="346" x2="346" y2="346"/>
      <line x1="332" y1="358" x2="346" y2="358"/>
    </g>
    <g stroke="#b45309" stroke-width="2">
      <line x1="402" y1="316" x2="416" y2="316"/>
      <line x1="402" y1="330" x2="416" y2="330"/>
      <line x1="402" y1="344" x2="416" y2="344"/>
    </g>
    <text x="340" y="398" font-size="11" font-weight="700" fill="#334155">n₁ 多</text>
    <text x="406" y="398" font-size="11" font-weight="700" fill="#334155">n₂ 少</text>
    <text x="468" y="336" font-size="12" font-weight="900" fill="#047857">U₂ &lt; U₁</text>
    <text x="468" y="362" font-size="11" fill="#475569">n₂ &lt; n₁</text>
  </g>

  <text x="296" y="428" font-size="11" fill="#64748b" text-anchor="middle">电压比由匝数比决定，与负载大小无关</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压关系的理解</text>

  <text x="598" y="176" font-size="11.5" font-weight="700" fill="#334155">· 电压比等于匝数比</text>
  <text x="598" y="202" font-size="11.5" font-weight="700" fill="#334155">· 匝数多 → 电压高</text>
  <text x="598" y="228" font-size="11.5" font-weight="700" fill="#334155">· 匝数少 → 电压低</text>
  <text x="598" y="254" font-size="11.5" font-weight="700" fill="#334155">· 只适用于理想变压器</text>

  <rect x="596" y="272" width="248" height="54" rx="10" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="720" y="294" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">若 n₂ = 2n₁</text>
  <text x="720" y="314" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">则 U₂ = 2U₁</text>

  <text x="598" y="352" font-size="11.5" font-weight="700" fill="#dc2626">不能改变直流电压</text>
  <text x="598" y="376" font-size="11" fill="#64748b">直流磁场不变化，副线圈无感应</text>
  <text x="598" y="400" font-size="11.5" font-weight="700" fill="#059669">不改变交变电流的频率</text>
  <text x="598" y="424" font-size="11" fill="#64748b">频率由发电机决定，变压器不改变</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">U₁/U₂ = n₁/n₂：匝数多的一侧电压高，升压用 n₂ &gt; n₁</text>
</g>

<!-- 第三步：能量守恒 -->
<g class="s94-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">理想变压器不消耗能量：输入功率等于输出功率</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量的传递</text>

  <rect x="66" y="164" width="132" height="84" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="132" y="192" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">输入功率 P₁</text>
  <text x="132" y="216" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">P₁ = U₁I₁</text>
  <text x="132" y="237" font-size="11" fill="#64748b" text-anchor="middle">原线圈</text>

  <rect x="258" y="176" width="84" height="60" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="284" y="196" width="32" height="20" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <g stroke="#b45309" stroke-width="2">
    <line x1="250" y1="186" x2="260" y2="186"/>
    <line x1="250" y1="198" x2="260" y2="198"/>
    <line x1="250" y1="210" x2="260" y2="210"/>
    <line x1="250" y1="222" x2="260" y2="222"/>
    <line x1="340" y1="186" x2="350" y2="186"/>
    <line x1="340" y1="198" x2="350" y2="198"/>
    <line x1="340" y1="210" x2="350" y2="210"/>
    <line x1="340" y1="222" x2="350" y2="222"/>
  </g>
  <text x="300" y="258" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">铁芯</text>

  <rect x="390" y="164" width="132" height="84" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="456" y="192" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">输出功率 P₂</text>
  <text x="456" y="216" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">P₂ = U₂I₂</text>
  <text x="456" y="237" font-size="11" fill="#64748b" text-anchor="middle">副线圈</text>

  <line class="s94-arrow" x1="198" y1="206" x2="252" y2="206" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <line class="s94-arrow" x1="348" y1="206" x2="390" y2="206" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <g class="s94-flow">
    <rect x="66" y="286" width="456" height="22" rx="11" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect class="s94-bar" x="66" y="286" width="456" height="22" rx="11" fill="#93c5fd" opacity=".55"/>
    <text x="294" y="302" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量全部传递，没有损耗</text>
  </g>

  <g class="s94-eq">
    <rect x="86" y="326" width="416" height="52" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="294" y="360" font-size="21" font-weight="900" fill="#047857" text-anchor="middle">P₁ = P₂</text>
  </g>
  <text x="294" y="404" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">即 U₁I₁ = U₂I₂，传递能量但不会创造能量</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电流与功率关系</text>

  <rect x="596" y="158" width="248" height="50" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="190" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">U₁I₁ = U₂I₂</text>

  <text x="598" y="238" font-size="11.5" font-weight="700" fill="#334155">只有一个副线圈时：</text>
  <rect x="596" y="250" width="248" height="42" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="277" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">I₁ / I₂ = n₂ / n₁</text>

  <text x="598" y="318" font-size="11.5" font-weight="700" fill="#334155">· 高压侧电流小</text>
  <text x="598" y="342" font-size="11.5" font-weight="700" fill="#334155">· 可用较细的导线</text>
  <text x="598" y="366" font-size="11.5" font-weight="700" fill="#334155">· 不改变交变电流频率</text>

  <rect x="596" y="384" width="248" height="38" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="720" y="408" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">实际变压器 P₂ &lt; P₁（有铜损、铁损）</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">理想变压器 P₁ = P₂，U₁I₁ = U₂I₂，所以高压线圈中电流较小</text>
</g>
</svg>
