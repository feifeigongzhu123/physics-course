<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="越来越宽的信息之路：微波中继、卫星通信、光纤与互联网">
<style>
.p81-s1,.p81-s2,.p81-s3{opacity:0;visibility:hidden}
.p81-s1{opacity:1;visibility:visible}
[data-scene="pj-81"] .p81-s1,[data-scene="pj-81"] .p81-s2,[data-scene="pj-81"] .p81-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-81"].s1 .p81-s1,[data-scene="pj-81"].s2 .p81-s2,[data-scene="pj-81"].s3 .p81-s3{opacity:1;visibility:visible}
@keyframes p81pop{0%{transform:scale(.84);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p81flow{to{stroke-dashoffset:-46}}
@keyframes p81draw{to{stroke-dashoffset:0}}
@keyframes p81beam{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes p81pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes p81spin{to{transform:rotate(360deg)}}
[data-scene="pj-81"].s1 .p81-beam{stroke-dasharray:9 7;animation:p81flow 1.2s linear infinite}
[data-scene="pj-81"].s1 .p81-tower{transform-box:fill-box;transform-origin:bottom center;animation:p81pop .5s ease both}
[data-scene="pj-81"].s1 .p81-tower2{animation-delay:.1s}
[data-scene="pj-81"].s1 .p81-tower3{animation-delay:.2s}
[data-scene="pj-81"].s1 .p81-dish{animation:p81beam 1.8s ease-in-out infinite}
[data-scene="pj-81"].s2 .p81-sat{transform-box:fill-box;transform-origin:center;animation:p81pop .6s ease both}
[data-scene="pj-81"].s2 .p81-link{stroke-dasharray:8 7;animation:p81flow 1.3s linear infinite}
[data-scene="pj-81"].s2 .p81-cover{animation:p81pulse 2.4s ease-in-out infinite}
[data-scene="pj-81"].s3 .p81-fiber{transform-box:fill-box;transform-origin:left center;animation:p81draw .8s ease both}
[data-scene="pj-81"].s3 .p81-laser{stroke-dasharray:420;stroke-dashoffset:420;animation:p81draw 1.3s ease .15s forwards}
[data-scene="pj-81"].s3 .p81-net{animation:p81pulse 2.2s ease-in-out infinite}
[data-scene="pj-81"].s3 .p81-node{transform-box:fill-box;transform-origin:center;animation:p81pop .5s ease both}
[data-scene="pj-81"].s3 .p81-node2{animation-delay:.1s}
[data-scene="pj-81"].s3 .p81-node3{animation-delay:.2s}
[data-scene="pj-81"].s3 .p81-node4{animation-delay:.3s}
</style>
<defs>
  <linearGradient id="p81earth" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#60a5fa"/>
  </linearGradient>
  <radialGradient id="p81globe" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#93c5fd"/>
  </radialGradient>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">越来越宽的信息之路：微波、卫星与光纤</text>

<!-- 第一步：微波中继 -->
<g class="p81-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">微波大致沿直线传播，需要一站一站地中继转发</text>

  <rect x="54" y="108" width="332" height="66" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="74" y="134" font-size="12.5" font-weight="800" fill="#1e3a8a">微波：频率比无线电波高</text>
  <text x="74" y="158" font-size="11.5" fill="#475569">频率越高，能传递的信息越多</text>
  <rect x="514" y="108" width="332" height="66" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="534" y="134" font-size="12.5" font-weight="800" fill="#b45309">微波近似沿直线传播</text>
  <text x="534" y="158" font-size="11.5" fill="#7c5a30">地球表面是弯曲的，远了就“看不见”</text>

  <path d="M30 436 Q450 402 870 436" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="806" y="448" font-size="11.5" fill="#64748b" text-anchor="end">地球表面</text>

  <g class="p81-tower">
    <line x1="180" y1="286" x2="180" y2="420" stroke="#475569" stroke-width="3"/>
    <line x1="180" y1="286" x2="156" y2="420" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="286" x2="204" y2="420" stroke="#475569" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="164" y1="330" x2="196" y2="330"/><line x1="160" y1="366" x2="200" y2="366"/><line x1="156" y1="402" x2="204" y2="402"/>
    </g>
    <circle cx="180" cy="286" r="4" fill="#dc2626"/>
    <path class="p81-dish" d="M168 284 A14 14 0 0 1 192 280" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="180" y1="296" x2="180" y2="306" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <g class="p81-tower p81-tower2">
    <line x1="450" y1="266" x2="450" y2="398" stroke="#475569" stroke-width="3"/>
    <line x1="450" y1="266" x2="426" y2="398" stroke="#475569" stroke-width="2"/>
    <line x1="450" y1="266" x2="474" y2="398" stroke="#475569" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="434" y1="310" x2="466" y2="310"/><line x1="430" y1="346" x2="470" y2="346"/><line x1="426" y1="382" x2="474" y2="382"/>
    </g>
    <circle cx="450" cy="266" r="4" fill="#dc2626"/>
    <path class="p81-dish" d="M438 264 A14 14 0 0 1 462 260" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="450" y1="276" x2="450" y2="286" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <g class="p81-tower p81-tower3">
    <line x1="720" y1="286" x2="720" y2="420" stroke="#475569" stroke-width="3"/>
    <line x1="720" y1="286" x2="696" y2="420" stroke="#475569" stroke-width="2"/>
    <line x1="720" y1="286" x2="744" y2="420" stroke="#475569" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.5">
      <line x1="704" y1="330" x2="736" y2="330"/><line x1="700" y1="366" x2="740" y2="366"/><line x1="696" y1="402" x2="744" y2="402"/>
    </g>
    <circle cx="720" cy="286" r="4" fill="#dc2626"/>
    <path class="p81-dish" d="M708 284 A14 14 0 0 1 732 280" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="720" y1="296" x2="720" y2="306" stroke="#1d4ed8" stroke-width="2"/>
  </g>

  <g class="p81-beam" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)">
    <line x1="186" y1="284" x2="442" y2="268"/>
    <line x1="456" y1="268" x2="714" y2="284"/>
  </g>
  <g font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">
    <text x="315" y="262">微波波束</text><text x="585" y="262">微波波束</text>
    <text x="315" y="244">约 50 km</text><text x="585" y="244">约 50 km</text>
  </g>
  <g font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">
    <text x="180" y="444">中继站</text><text x="450" y="444">中继站</text><text x="720" y="444">中继站</text>
  </g>
  <text x="450" y="462" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">微波中继：把信息一站一站传向远方</text>
</g>

<!-- 第二步：卫星通信 -->
<g class="p81-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">通信卫星覆盖范围大，可以实现全球通信</text>

  <path d="M80 430 Q470 40 840 280" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="300" cy="610" r="270" fill="url(#p81earth)" stroke="#60a5fa" stroke-width="3"/>
  <path d="M120 392 Q180 356 236 380 Q210 408 156 414 Z" fill="#86efac" opacity=".75"/>
  <path d="M310 380 Q376 348 430 382 Q404 408 336 406 Z" fill="#86efac" opacity=".75"/>
  <text x="300" y="416" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">地球</text>

  <ellipse class="p81-cover" cx="300" cy="368" rx="182" ry="34" fill="#93c5fd" opacity=".55"/>

  <g stroke="#475569" stroke-width="2.5">
    <line x1="154" y1="386" x2="154" y2="414"/>
    <line x1="146" y1="414" x2="162" y2="414"/>
  </g>
  <path d="M136 374 A22 22 0 0 1 172 362" fill="none" stroke="#1e3a8a" stroke-width="4"/>
  <circle cx="154" cy="376" r="4" fill="#1e3a8a"/>
  <text x="154" y="436" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">地面站</text>

  <g class="p81-sat">
    <rect x="610" y="168" width="46" height="30" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="620" y1="168" x2="620" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="632" y1="168" x2="632" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="644" y1="168" x2="644" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="723" y="168" width="46" height="30" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="733" y1="168" x2="733" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="745" y1="168" x2="745" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <line x1="757" y1="168" x2="757" y2="198" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="660" y="160" width="60" height="46" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="690" y="188" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">卫星</text>
    <path d="M676 206 A18 18 0 0 0 704 206" fill="none" stroke="#1e3a8a" stroke-width="3"/>
    <line x1="690" y1="206" x2="690" y2="218" stroke="#1e3a8a" stroke-width="2.5"/>
    <circle cx="690" cy="221" r="3" fill="#dc2626"/>
  </g>

  <g class="p81-link" stroke="#d97706" stroke-width="2.4" marker-end="url(#arrAmber)">
    <path d="M668 206 Q430 250 178 364" fill="none"/>
  </g>
  <g class="p81-link" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)">
    <path d="M178 350 Q430 220 650 196" fill="none"/>
  </g>
  <text x="382" y="268" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">下行</text>
  <text x="382" y="238" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">上行</text>

  <rect x="596" y="292" width="250" height="126" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.8" filter="url(#softShadow)"/>
  <text x="721" y="318" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">卫星通信的优点</text>
  <text x="612" y="344" font-size="11.5" fill="#334155">① 覆盖范围大，可全球通信</text>
  <text x="612" y="368" font-size="11.5" fill="#334155">② 通信容量大</text>
  <text x="612" y="392" font-size="11.5" fill="#334155">③ 信号质量好</text>

  <text x="450" y="453" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">卫星通信覆盖广、容量大，适合远距离和全球通信</text>
</g>

<!-- 第三步：光纤与互联网 -->
<g class="p81-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">光纤利用激光传递信息，容量大、抗干扰能力强</text>

  <rect x="34" y="104" width="456" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="54" y="120" width="160" height="28" rx="14" fill="#e8effc"/>
  <text x="134" y="139" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光纤的结构</text>

  <circle cx="140" cy="210" r="64" fill="#cbd5e1"/>
  <circle cx="140" cy="210" r="46" fill="#93c5fd"/>
  <circle cx="140" cy="210" r="23" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="204" y1="180" x2="226" y2="180"/>
    <line x1="186" y1="210" x2="226" y2="210"/>
    <line x1="163" y1="210" x2="226" y2="240"/>
  </g>
  <g font-size="11.5" fill="#334155">
    <text x="232" y="184">涂覆层</text>
    <text x="232" y="214">包层</text>
    <text x="232" y="244" fill="#92400e" font-weight="700">纤芯</text>
  </g>

  <rect x="44" y="326" width="32" height="28" rx="4" fill="#dc2626"/>
  <text x="60" y="318" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">激光</text>
  <rect x="80" y="318" width="370" height="44" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <rect x="80" y="330" width="370" height="20" fill="#fef3c7"/>
  <g stroke="#bfdbfe" stroke-width="1">
    <line x1="120" y1="318" x2="120" y2="362"/><line x1="160" y1="318" x2="160" y2="362"/>
    <line x1="200" y1="318" x2="200" y2="362"/><line x1="240" y1="318" x2="240" y2="362"/>
    <line x1="280" y1="318" x2="280" y2="362"/><line x1="320" y1="318" x2="320" y2="362"/>
    <line x1="360" y1="318" x2="360" y2="362"/><line x1="400" y1="318" x2="400" y2="362"/>
  </g>
  <path class="p81-laser" d="M84 340 L112 330 L140 350 L168 330 L196 350 L224 330 L252 350 L280 330 L308 350 L336 330 L364 350 L392 330 L420 350 L446 334" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="265" y="390" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">激光在纤芯与包层界面不断全反射</text>
  <text x="265" y="412" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">容量大 · 抗干扰 · 传输距离远</text>

  <rect x="510" y="104" width="356" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="530" y="120" width="132" height="28" rx="14" fill="#e8effc"/>
  <text x="596" y="139" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">互联网</text>

  <circle cx="690" cy="226" r="70" fill="url(#p81globe)" stroke="#1d4ed8" stroke-width="2.5"/>
  <g fill="none" stroke="#60a5fa" stroke-width="1.4">
    <ellipse cx="690" cy="226" rx="30" ry="70"/>
    <ellipse cx="690" cy="226" rx="55" ry="70"/>
    <ellipse cx="690" cy="226" rx="70" ry="22"/>
    <ellipse cx="690" cy="226" rx="70" ry="50"/>
  </g>
  <text x="690" y="230" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">全球互联</text>

  <g class="p81-node">
    <circle cx="800" cy="146" r="9" fill="#1d4ed8"/>
    <text x="800" y="130" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">学校</text>
    <line x1="792" y1="152" x2="738" y2="186" stroke="#60a5fa" stroke-width="1.8"/>
  </g>
  <g class="p81-node p81-node2">
    <circle cx="570" cy="152" r="9" fill="#1d4ed8"/>
    <text x="570" y="136" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">家庭</text>
    <line x1="578" y1="158" x2="634" y2="190" stroke="#60a5fa" stroke-width="1.8"/>
  </g>
  <g class="p81-node p81-node3">
    <circle cx="806" cy="300" r="9" fill="#1d4ed8"/>
    <text x="818" y="304" font-size="11.5" font-weight="700" fill="#1e3a8a">医院</text>
    <line x1="798" y1="294" x2="748" y2="264" stroke="#60a5fa" stroke-width="1.8"/>
  </g>
  <g class="p81-node p81-node4">
    <circle cx="568" cy="300" r="9" fill="#1d4ed8"/>
    <text x="556" y="304" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="end">手机</text>
    <line x1="576" y1="294" x2="628" y2="264" stroke="#60a5fa" stroke-width="1.8"/>
  </g>

  <text x="688" y="378" font-size="11.5" fill="#475569" text-anchor="middle">服务器、学校、医院、手机都接入网络</text>
  <text x="688" y="410" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">互联网把全世界的信息连接在一起</text>
</g>
</svg>
