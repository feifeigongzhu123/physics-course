<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验探究平抛运动：斜槽末端水平、描迹方法、水平匀速与竖直自由落体">
<style>
[data-scene="ps-25"] .s25-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-25"].s1 .s25-step1,[data-scene="ps-25"].s2 .s25-step2,[data-scene="ps-25"].s3 .s25-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s25drop{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes s25draw{to{stroke-dashoffset:0}}
@keyframes s25pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s25grow{from{opacity:0}to{opacity:1}}
@keyframes s25pulse{0%,100%{opacity:.45}50%{opacity:1}}
[data-scene="ps-25"].s1 .s25-ball{transform-box:fill-box;transform-origin:center;animation:s25drop .7s ease .2s both}
[data-scene="ps-25"].s1 .s25-level{animation:s25pulse 1.5s ease-in-out infinite}
[data-scene="ps-25"].s2 .s25-curve{stroke-dasharray:620;stroke-dashoffset:620;animation:s25draw 1.3s ease .3s both}
[data-scene="ps-25"].s2 .s25-point{transform-box:fill-box;transform-origin:center;animation:s25pop .35s ease both}
[data-scene="ps-25"].s3 .s25-mark{animation:s25grow .5s ease both}
[data-scene="ps-25"].s3 .s25-dec{animation:s25pop .5s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：探究平抛运动的特点</text>

<!-- 第一步：实验装置 -->
<g class="s25-step s25-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">实验装置：斜槽末端调水平，同一位置由静止释放</text>

  <rect x="70" y="458" width="770" height="16" rx="4" fill="#94a3b8"/>
  <rect x="110" y="474" width="14" height="24" fill="#64748b"/>
  <rect x="780" y="474" width="14" height="24" fill="#64748b"/>

  <rect x="150" y="136" width="16" height="322" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="116" y="452" width="90" height="12" rx="3" fill="#64748b"/>
  <rect x="404" y="268" width="10" height="190" fill="#94a3b8"/>

  <polyline points="190,180 520,320 660,320" fill="none" stroke="#64748b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="190,180 520,320 660,320" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="236" font-size="12.5" font-weight="800" fill="#334155" text-anchor="middle">斜槽</text>

  <g class="s25-ball">
    <circle cx="197" cy="169" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  </g>
  <line x1="178" y1="142" x2="216" y2="142" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="5 4"/>
  <text x="220" y="146" font-size="12" font-weight="800" fill="#b91c1c">释放点 P（每次相同）</text>

  <circle cx="600" cy="313" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>

  <g class="s25-level">
    <line x1="668" y1="320" x2="842" y2="320" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  </g>
  <text x="760" y="308" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">末端切线水平 → v₀ 水平</text>
  <line x1="660" y1="328" x2="660" y2="452" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="672" y="400" font-size="11.5" fill="#64748b">重垂线</text>

  <line x1="826" y1="320" x2="826" y2="458" stroke="#475569" stroke-width="1.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="838" y="394" font-size="12.5" font-weight="800" fill="#334155">h</text>

  <rect x="594" y="92" width="276" height="158" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="732" y="120" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">两个必须</text>
  <text x="614" y="150" font-size="12" fill="#334155">① 斜槽末端切线水平</text>
  <text x="614" y="172" font-size="11.5" fill="#64748b">保证初速度沿水平方向</text>
  <text x="614" y="200" font-size="12" fill="#334155">② 每次从同一位置静止释放</text>
  <text x="614" y="222" font-size="11.5" fill="#64748b">保证初速度大小相同</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">斜槽末端不水平，小球离开时的速度不水平，轨迹就不是平抛运动</text>
</g>

<!-- 第二步：描迹方法 -->
<g class="s25-step s25-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">描迹：白纸加复写纸，记录多个位置后连成平滑曲线</text>

  <rect x="140" y="98" width="640" height="360" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="158" y="116" width="604" height="324" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="746" y="108" font-size="11.5" font-weight="800" fill="#64748b" text-anchor="end">竖直木板</text>

  <line x1="230" y1="160" x2="726" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="230" y1="160" x2="230" y2="436" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="734" y="176" font-size="12.5" font-weight="800" fill="#475569">x</text>
  <text x="214" y="438" font-size="12.5" font-weight="800" fill="#475569" text-anchor="end">y</text>
  <text x="218" y="152" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="end">抛出点 O</text>

  <path class="s25-curve" d="M230 160 Q470 160 700 430" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>

  <g stroke="#dc2626" stroke-width="2.2">
    <line x1="304" y1="168" x2="316" y2="168"/><line x1="310" y1="162" x2="310" y2="174"/>
    <line x1="384" y1="191" x2="396" y2="191"/><line x1="390" y1="185" x2="390" y2="197"/>
    <line x1="464" y1="230" x2="476" y2="230"/><line x1="470" y1="224" x2="470" y2="236"/>
    <line x1="544" y1="285" x2="556" y2="285"/><line x1="550" y1="279" x2="550" y2="291"/>
    <line x1="624" y1="355" x2="636" y2="355"/><line x1="630" y1="349" x2="630" y2="361"/>
    <line x1="694" y1="430" x2="706" y2="430"/><line x1="700" y1="424" x2="700" y2="436"/>
  </g>
  <g class="s25-point" fill="#dc2626">
    <circle cx="310" cy="168" r="3"/>
    <circle cx="390" cy="191" r="3"/>
    <circle cx="470" cy="230" r="3"/>
    <circle cx="550" cy="285" r="3"/>
    <circle cx="630" cy="355" r="3"/>
    <circle cx="700" cy="430" r="3"/>
  </g>
  <text x="576" y="326" font-size="12" font-weight="800" fill="#b91c1c">描迹点</text>
  <text x="470" y="410" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">用平滑曲线连接各点</text>

  <rect x="482" y="126" width="266" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
  <text x="615" y="148" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">白纸 + 复写纸固定在竖直板上</text>
  <text x="615" y="170" font-size="11.5" fill="#7c5a30" text-anchor="middle">小球滚过时在白纸上留下痕迹</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">记录的点越多轨迹越准确，但点不能太密，以免痕迹重叠</text>
</g>

<!-- 第三步：水平匀速 + 竖直自由落体 -->
<g class="s25-step s25-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">数据处理：水平方向匀速，竖直方向自由落体</text>

  <g class="s25-mark" stroke="#dc2626" stroke-width="2.2" marker-start="url(#arrRed)" marker-end="url(#arrRed)">
    <line x1="150" y1="112" x2="270" y2="112"/>
    <line x1="270" y1="112" x2="390" y2="112"/>
    <line x1="390" y1="112" x2="510" y2="112"/>
    <line x1="510" y1="112" x2="630" y2="112"/>
    <line x1="630" y1="112" x2="750" y2="112"/>
  </g>
  <text x="450" y="102" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">相等时间间隔，水平位移相等</text>

  <path d="M150 140 Q430 140 750 430" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#1d4ed8">
    <circle cx="150" cy="140" r="5"/>
    <circle cx="270" cy="152" r="5"/>
    <circle cx="390" cy="188" r="5"/>
    <circle cx="510" cy="248" r="5"/>
    <circle cx="630" cy="332" r="5"/>
    <circle cx="750" cy="430" r="5"/>
  </g>
  <g font-size="11.5" font-weight="800" fill="#047857" text-anchor="end">
    <text x="142" y="150">1</text>
    <text x="142" y="174">3</text>
    <text x="142" y="222">5</text>
    <text x="142" y="294">7</text>
    <text x="142" y="385">9</text>
  </g>
  <text x="126" y="250" font-size="11.5" font-weight="800" fill="#047857" text-anchor="end">竖直位移比</text>

  <g class="s25-dec">
    <line x1="510" y1="248" x2="590" y2="248" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <line x1="510" y1="248" x2="510" y2="318" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <line x1="510" y1="248" x2="590" y2="318" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="596" y="242" font-size="12.5" font-weight="900" fill="#b91c1c">vx</text>
    <text x="520" y="314" font-size="12.5" font-weight="900" fill="#047857">vy</text>
    <text x="598" y="326" font-size="12.5" font-weight="900" fill="#6d28d9">v</text>
  </g>

  <rect x="628" y="206" width="242" height="108" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="749" y="232" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">平抛运动规律</text>
  <text x="749" y="258" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">水平：x = v₀t（匀速）</text>
  <text x="749" y="282" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">竖直：y = ½gt²（自由落体）</text>
  <text x="749" y="306" font-size="11" fill="#64748b" text-anchor="middle">相邻相等时间内 Δy = gT² 恒定</text>

  <rect x="70" y="404" width="430" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.8"/>
  <text x="285" y="427" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">由竖直位移求时间 t，再由水平位移求 v₀</text>
  <text x="285" y="450" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">v₀ = x / t = x · √(g / 2y)</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">竖直方向用相邻相等时间位移差是否恒定，可检验数据是否可靠</text>
</g>
</svg>
