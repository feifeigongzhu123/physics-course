<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电场与电场强度：电场的基本性质、E 等于 F 除以 q、电场线的疏密">
<style>
[data-scene="ps-42"] .s42-step1,[data-scene="ps-42"] .s42-step2,[data-scene="ps-42"] .s42-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-42"].s1 .s42-step1,[data-scene="ps-42"].s2 .s42-step2,[data-scene="ps-42"].s3 .s42-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s42draw{to{stroke-dashoffset:0}}
@keyframes s42pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s42pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s42fade{from{opacity:0}to{opacity:1}}
[data-scene="ps-42"].s1 .s42-line{stroke-dasharray:110;stroke-dashoffset:110;animation:s42draw .8s ease .25s forwards}
[data-scene="ps-42"].s1 .s42-fld{animation:s42fade .7s ease .6s both}
[data-scene="ps-42"].s1 .s42-card{transform-box:fill-box;transform-origin:center;animation:s42pop .5s ease .2s both}
[data-scene="ps-42"].s1 .s42-probe{animation:s42pulse 1.8s ease-in-out infinite}
[data-scene="ps-42"].s2 .s42-vec{stroke-dasharray:170;stroke-dashoffset:170;animation:s42draw .7s ease .25s forwards}
[data-scene="ps-42"].s2 .s42-card{transform-box:fill-box;transform-origin:center;animation:s42pop .5s ease .15s both}
[data-scene="ps-42"].s3 .s42-card{transform-box:fill-box;transform-origin:center;animation:s42pop .5s ease .15s both}
[data-scene="ps-42"].s3 .s42-fl{stroke-dasharray:160;stroke-dashoffset:160;animation:s42draw .8s ease .2s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电场 电场强度：用试探电荷描述看不见的场</text>

<!-- 第一步：电场 -->
<g class="s42-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 电场：电荷周围存在的特殊物质</text>

  <circle class="s42-probe" cx="170" cy="290" r="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="170" y="301" font-size="30" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>

  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line class="s42-line" x1="205.4" y1="254.6" x2="251" y2="209"/>
    <line class="s42-line" x1="170" y1="240" x2="170" y2="175"/>
    <line class="s42-line" x1="134.6" y1="254.6" x2="89" y2="209"/>
    <line class="s42-line" x1="120" y1="290" x2="55" y2="290"/>
    <line class="s42-line" x1="134.6" y1="325.4" x2="89" y2="371"/>
    <line class="s42-line" x1="170" y1="340" x2="170" y2="405"/>
    <line class="s42-line" x1="205.4" y1="325.4" x2="251" y2="371"/>
  </g>

  <text x="170" y="452" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">场源电荷 +Q</text>

  <line class="s42-fld" x1="222" y1="290" x2="396" y2="290" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrBlue)"/>
  <text x="292" y="272" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">电场</text>

  <circle class="s42-probe" cx="420" cy="290" r="13" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="420" y="295" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">q₀</text>
  <text x="420" y="342" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">试探电荷 q₀</text>
  <text x="420" y="364" font-size="11.5" fill="#64748b" text-anchor="middle">电荷量很小、线度很小</text>

  <line x1="436" y1="290" x2="520" y2="290" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="478" y="274" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F = q₀E</text>

  <g class="s42-card">
    <rect x="580" y="110" width="250" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="705" y="144" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场</text>
    <line x1="600" y1="160" x2="810" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="705" y="190">电场是电荷周围存在的</text>
      <text x="705" y="214">一种特殊物质</text>
      <text x="705" y="238">看不见、摸不着</text>
      <text x="705" y="262">但客观存在</text>
    </g>
    <line x1="600" y1="282" x2="810" y2="282" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="705" y="310">基本性质：对放入其中的</text>
      <text x="705" y="334">电荷有力的作用</text>
      <text x="705" y="360">电荷间的相互作用</text>
      <text x="705" y="384">通过电场传递</text>
      <text x="705" y="408">不需直接接触</text>
    </g>
    <text x="705" y="430" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">电场具有能量</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场的基本性质是对放入其中的电荷有力的作用</text>
</g>

<!-- 第二步：电场强度 -->
<g class="s42-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 电场强度：E = F/q，矢量</text>

  <text x="250" y="140" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">正电荷：F 与 E 同向</text>
  <circle cx="150" cy="210" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="150" y="220" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <line class="s42-vec" x1="182" y1="190" x2="348" y2="190" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="330" y="178" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">E</text>
  <line class="s42-vec" x1="182" y1="230" x2="348" y2="230" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="330" y="252" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>

  <text x="250" y="310" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">负电荷：F 与 E 反向</text>
  <circle cx="150" cy="380" r="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="150" y="390" font-size="22" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
  <line class="s42-vec" x1="182" y1="360" x2="348" y2="360" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="330" y="348" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">E</text>
  <line class="s42-vec" x1="118" y1="400" x2="42" y2="400" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="80" y="388" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="250" y="450" font-size="11.5" fill="#64748b" text-anchor="middle">负电荷受力方向与场强方向相反</text>

  <g class="s42-card">
    <rect x="470" y="110" width="360" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场强度的定义</text>
    <text x="650" y="192" font-size="22" font-weight="900" fill="#b45309" text-anchor="middle">E = F/q</text>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="650" y="226">F：试探电荷所受的电场力</text>
      <text x="650" y="250">q：试探电荷的电荷量</text>
      <text x="650" y="274">E：电场强度，单位 N/C</text>
      <text x="650" y="298">1 N/C = 1 V/m</text>
    </g>
    <line x1="495" y1="316" x2="805" y2="316" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="650" y="344">矢量：方向为正电荷受力方向</text>
      <text x="650" y="370">由电场本身决定</text>
      <text x="650" y="396">与试探电荷 q₀ 无关</text>
      <text x="650" y="422">同一位置 E 是唯一的</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场强度是矢量，方向规定为正电荷在该点受力的方向</text>
</g>

<!-- 第三步：电场线 -->
<g class="s42-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 电场线：疏密表示强弱，切线表示方向</text>

  <g class="s42-card">
    <rect x="70" y="118" width="350" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="86" y="142" font-size="12.5" font-weight="800" fill="#1e3a8a">点电荷的电场</text>
    <circle cx="200" cy="280" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="200" y="290" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
    <g class="s42-fl" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
      <line x1="234" y1="280" x2="308" y2="280"/>
      <line x1="224" y1="256" x2="276" y2="204"/>
      <line x1="200" y1="246" x2="200" y2="172"/>
      <line x1="176" y1="256" x2="124" y2="204"/>
      <line x1="166" y1="280" x2="92" y2="280"/>
      <line x1="176" y1="304" x2="124" y2="356"/>
      <line x1="200" y1="314" x2="200" y2="388"/>
      <line x1="224" y1="304" x2="276" y2="356"/>
    </g>
    <text x="245" y="404" font-size="11.5" fill="#64748b" text-anchor="middle">越靠近电荷，电场线越密</text>
  </g>

  <g class="s42-card">
    <rect x="440" y="118" width="390" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="456" y="142" font-size="12.5" font-weight="800" fill="#1e3a8a">匀强电场的电场线</text>
    <rect x="500" y="180" width="270" height="8" rx="3" fill="#94a3b8"/>
    <rect x="500" y="360" width="270" height="8" rx="3" fill="#94a3b8"/>
    <text x="635" y="170" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">上极板 +</text>
    <text x="635" y="386" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">下极板 −</text>
    <g class="s42-fl" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
      <line x1="535" y1="196" x2="535" y2="346"/>
      <line x1="585" y1="196" x2="585" y2="346"/>
      <line x1="635" y1="196" x2="635" y2="346"/>
      <line x1="685" y1="196" x2="685" y2="346"/>
      <line x1="735" y1="196" x2="735" y2="346"/>
    </g>
    <text x="758" y="274" font-size="13" font-weight="900" fill="#1d4ed8">E</text>
    <text x="635" y="410" font-size="11.5" fill="#64748b" text-anchor="middle">疏密均匀，各点场强相同</text>
  </g>

  <rect x="70" y="440" width="760" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="464" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场线上某点的切线方向，就是该点的电场强度方向</text>
  <text x="450" y="488" font-size="11.5" fill="#1e3a8a" text-anchor="middle">电场线是假想曲线，实际不存在，任意两条电场线不相交</text>
</g>
</svg>
