<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="磁场对运动电荷的作用力：左手定则、洛伦兹力 F=qvB、不做功">
<style>
[data-scene="ps-85"] .s85-s1,[data-scene="ps-85"] .s85-s2,[data-scene="ps-85"] .s85-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-85"].s1 .s85-s1,[data-scene="ps-85"].s2 .s85-s2,[data-scene="ps-85"].s3 .s85-s3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s85pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s85pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s85draw{to{stroke-dashoffset:0}}
@keyframes s85blink{0%,100%{opacity:1}50%{opacity:.35}}
[data-scene="ps-85"].s1 .s85-field{animation:s85pulse 3s ease-in-out infinite}
[data-scene="ps-85"].s1 .s85-q{transform-box:fill-box;transform-origin:center;animation:s85pop .55s ease both}
[data-scene="ps-85"].s1 .s85-q2{animation-delay:.15s}
[data-scene="ps-85"].s1 .s85-v{stroke-dasharray:140;stroke-dashoffset:140;animation:s85draw .7s ease .5s both}
[data-scene="ps-85"].s1 .s85-f{stroke-dasharray:110;stroke-dashoffset:110;animation:s85draw .6s ease .9s both}
[data-scene="ps-85"].s1 .s85-f2{animation-delay:1.1s}
[data-scene="ps-85"].s2 .s85-card{transform-box:fill-box;transform-origin:center;animation:s85pop .5s ease both}
[data-scene="ps-85"].s2 .s85-c2{animation-delay:.12s}
[data-scene="ps-85"].s2 .s85-c3{animation-delay:.24s}
[data-scene="ps-85"].s2 .s85-formula{transform-box:fill-box;transform-origin:center;animation:s85pop .55s ease both}
[data-scene="ps-85"].s3 .s85-orbit{stroke-dasharray:400;stroke-dashoffset:400;animation:s85draw 1.2s ease .2s both}
[data-scene="ps-85"].s3 .s85-f{animation:s85blink 1.8s ease-in-out infinite}
[data-scene="ps-85"].s3 .s85-q{transform-box:fill-box;transform-origin:center;animation:s85pop .5s ease both}
</style>

<defs>
  <pattern id="s85cross" width="60" height="50" patternUnits="userSpaceOnUse">
    <g stroke="#93c5fd" stroke-width="2" opacity=".8">
      <line x1="26" y1="21" x2="34" y2="29"/>
      <line x1="34" y1="21" x2="26" y2="29"/>
    </g>
  </pattern>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">洛伦兹力：磁场对运动电荷的作用力</text>

<!-- 第一步：左手定则 -->
<g class="s85-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">洛伦兹力用左手定则判断，正负电荷的受力方向相反</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">正负电荷在磁场中</text>

  <rect class="s85-field" x="76" y="150" width="464" height="250" fill="url(#s85cross)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="500" y="168" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">B 垂直纸面向里（×）</text>

  <g class="s85-q">
    <circle cx="210" cy="215" r="13" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
    <text x="210" y="221" font-size="16" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  </g>
  <text x="192" y="219" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">正电荷</text>
  <line class="s85-v" x1="223" y1="215" x2="350" y2="215" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="300" y="202" font-size="12.5" font-weight="900" fill="#b91c1c">v</text>
  <line class="s85-f" x1="210" y1="202" x2="210" y2="150" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="222" y="172" font-size="12.5" font-weight="900" fill="#1e40af">F</text>

  <g class="s85-q s85-q2">
    <circle cx="210" cy="345" r="13" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="210" y="351" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">−</text>
  </g>
  <text x="192" y="349" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">负电荷</text>
  <line class="s85-v" x1="223" y1="345" x2="350" y2="345" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="300" y="332" font-size="12.5" font-weight="900" fill="#b91c1c">v</text>
  <line class="s85-f s85-f2" x1="210" y1="358" x2="210" y2="410" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="222" y="404" font-size="12.5" font-weight="900" fill="#1e40af">F</text>

  <text x="296" y="420" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">正电荷受力向上，负电荷受力向下</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">左手定则</text>

  <circle cx="612" cy="174" r="11" fill="#dbeafe"/>
  <text x="612" y="178" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="634" y="178" font-size="11.5" font-weight="700" fill="#334155">让磁感线垂直穿入手心</text>

  <circle cx="612" cy="210" r="11" fill="#dbeafe"/>
  <text x="612" y="214" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="634" y="214" font-size="11.5" font-weight="700" fill="#334155">四指指向正电荷运动方向</text>

  <circle cx="612" cy="246" r="11" fill="#dbeafe"/>
  <text x="612" y="250" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="634" y="250" font-size="11.5" font-weight="700" fill="#334155">负电荷：四指指向 v 的反方向</text>

  <circle cx="612" cy="282" r="11" fill="#dbeafe"/>
  <text x="612" y="286" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="634" y="286" font-size="11.5" font-weight="700" fill="#334155">拇指指向洛伦兹力的方向</text>

  <rect x="596" y="304" width="248" height="40" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="330" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">F 同时垂直于 v 和 B</text>

  <rect x="596" y="356" width="248" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="379" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">正电荷：四指指向 v</text>
  <text x="720" y="402" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">负电荷：四指指向 v 的反方向</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">正电荷四指指 v，负电荷四指指 v 的反方向，拇指所指就是洛伦兹力 F</text>
</g>

<!-- 第二步：洛伦兹力的大小 -->
<g class="s85-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">洛伦兹力的大小：v⊥B 时 F=qvB，v∥B 或电荷静止时为零</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">三种情形</text>

  <rect class="s85-formula" x="120" y="152" width="360" height="48" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="300" y="185" font-size="23" font-weight="900" fill="#1e3a8a" text-anchor="middle">F = qvB</text>

  <g class="s85-card">
    <rect x="80" y="214" width="150" height="68" fill="url(#s85cross)" stroke="#bfdbfe" stroke-width="1.2" stroke-dasharray="6 5"/>
    <circle cx="110" cy="264" r="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <line x1="118" y1="264" x2="192" y2="264" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <line x1="110" y1="256" x2="110" y2="226" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="250" y="240" font-size="12" font-weight="800" fill="#1e3a8a">v⊥B</text>
    <text x="250" y="264" font-size="11.5" font-weight="700" fill="#334155">F = qvB，安培力最大</text>
    <text x="250" y="284" font-size="11" fill="#64748b">速度与磁场垂直</text>
  </g>

  <g class="s85-card s85-c2">
    <rect x="80" y="292" width="150" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="92" y1="322" x2="218" y2="322" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="132" cy="322" r="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <line x1="140" y1="322" x2="196" y2="322" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="250" y="316" font-size="12" font-weight="800" fill="#1e3a8a">v∥B</text>
    <text x="250" y="340" font-size="11.5" font-weight="700" fill="#334155">F = 0，不受洛伦兹力</text>
  </g>

  <g class="s85-card s85-c3">
    <rect x="80" y="362" width="150" height="54" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="132" cy="389" r="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="393" font-size="12" font-weight="800" fill="#b91c1c">v = 0</text>
    <text x="250" y="386" font-size="12" font-weight="800" fill="#1e3a8a">电荷静止</text>
    <text x="250" y="408" font-size="11.5" font-weight="700" fill="#334155">F = 0</text>
  </g>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">公式与说明</text>

  <rect x="596" y="156" width="248" height="54" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="192" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">F = qvB</text>

  <text x="610" y="240" font-size="11.5" font-weight="700" fill="#334155">q 取绝对值，方向另由左手定则判断</text>
  <text x="610" y="268" font-size="11.5" font-weight="700" fill="#334155">v⊥B 时，洛伦兹力最大</text>
  <text x="610" y="296" font-size="11.5" font-weight="700" fill="#334155">v∥B 时，洛伦兹力为零</text>
  <text x="610" y="324" font-size="11.5" font-weight="700" fill="#334155">静止电荷不受洛伦兹力</text>

  <rect x="596" y="344" width="248" height="76" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="610" y="366" font-size="11" font-weight="800" fill="#b45309">电场力 F=qE：与速度无关</text>
  <text x="610" y="386" font-size="11" font-weight="800" fill="#b45309">洛伦兹力 F=qvB：与速度有关</text>
  <text x="610" y="406" font-size="11" fill="#92400e">两者方向的判断方法不同</text>

  <text x="720" y="432" font-size="11" fill="#64748b" text-anchor="middle">v 与 B 成 θ 角时，F = qvB sinθ</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F=qvB 只适用于 v⊥B；v 与 B 平行或电荷静止时，洛伦兹力为零</text>
</g>

<!-- 第三步：洛伦兹力不做功 -->
<g class="s85-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">洛伦兹力始终垂直于速度，只改变速度方向，不做功</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">速度方向不断改变</text>

  <rect x="76" y="150" width="464" height="250" fill="url(#s85cross)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="500" y="168" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">B 垂直纸面向里（×）</text>

  <path class="s85-orbit" d="M180 270 C180 336 234 390 300 390 C366 390 420 336 420 270" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="300" y1="270" x2="180" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="300" y1="270" x2="300" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="300" cy="270" r="4" fill="#334155"/>
  <text x="308" y="262" font-size="11.5" font-weight="800" fill="#334155">O</text>

  <g class="s85-q">
    <circle cx="180" cy="270" r="9" fill="#fecaca" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <line x1="180" y1="279" x2="180" y2="338" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line class="s85-f" x1="189" y1="270" x2="248" y2="270" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="192" y="322" font-size="12" font-weight="900" fill="#b91c1c">v</text>
  <text x="222" y="260" font-size="12" font-weight="900" fill="#1e40af">F</text>

  <g class="s85-q">
    <circle cx="300" cy="390" r="9" fill="#fecaca" stroke="#dc2626" stroke-width="2.2"/>
  </g>
  <line x1="309" y1="390" x2="368" y2="390" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line class="s85-f" x1="300" y1="381" x2="300" y2="322" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="340" y="378" font-size="12" font-weight="900" fill="#b91c1c">v</text>
  <text x="312" y="350" font-size="12" font-weight="900" fill="#1e40af">F</text>

  <text x="296" y="420" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">F 始终指向圆心，速率和动能都不变</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么不做功</text>

  <circle cx="612" cy="174" r="11" fill="#dbeafe"/>
  <text x="612" y="178" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="634" y="178" font-size="11.5" font-weight="700" fill="#334155">F 始终垂直于速度 v</text>

  <circle cx="612" cy="210" r="11" fill="#dbeafe"/>
  <text x="612" y="214" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="634" y="214" font-size="11.5" font-weight="700" fill="#334155">W = Fs cos90° = 0</text>

  <circle cx="612" cy="246" r="11" fill="#dbeafe"/>
  <text x="612" y="250" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="634" y="250" font-size="11.5" font-weight="700" fill="#334155">速率不变，动能不变</text>

  <circle cx="612" cy="282" r="11" fill="#dbeafe"/>
  <text x="612" y="286" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="634" y="286" font-size="11.5" font-weight="700" fill="#334155">只改变速度的方向</text>

  <rect x="596" y="304" width="248" height="50" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="326" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">洛伦兹力不做功</text>
  <text x="720" y="346" font-size="11" fill="#475569" text-anchor="middle">磁场力不会改变粒子的速率</text>

  <text x="720" y="380" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">大量定向移动电荷受洛伦兹力</text>
  <text x="720" y="404" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">宏观上表现为安培力</text>
  <text x="720" y="428" font-size="11" fill="#64748b" text-anchor="middle">洛伦兹力是安培力的微观本质</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F⊥v，洛伦兹力不做功，只改变速度方向，不改变速度大小</text>
</g>
</svg>
