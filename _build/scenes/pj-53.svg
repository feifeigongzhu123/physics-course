<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="能量的转化和守恒：各种能量转化、能量守恒定律、永动机不可能">
<style>
.p53-s1,.p53-s2,.p53-s3{opacity:0;visibility:hidden}
.p53-s1{opacity:1;visibility:visible}
[data-scene="pj-53"] .p53-s1,[data-scene="pj-53"] .p53-s2,[data-scene="pj-53"] .p53-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-53"].s1 .p53-s1,[data-scene="pj-53"].s2 .p53-s2,[data-scene="pj-53"].s3 .p53-s3{opacity:1;visibility:visible}
@keyframes p53spin{to{transform:rotate(360deg)}}
@keyframes p53flow{to{stroke-dashoffset:-42}}
@keyframes p53pop{0%{transform:scale(.82);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p53pulse{0%,100%{opacity:.4}50%{opacity:1}}
[data-scene="pj-53"].s1 .p53-cell{transform-box:fill-box;transform-origin:center;animation:p53pop .5s ease both}
[data-scene="pj-53"].s1 .p53-cell:nth-of-type(2){animation-delay:.08s}
[data-scene="pj-53"].s1 .p53-cell:nth-of-type(3){animation-delay:.16s}
[data-scene="pj-53"].s1 .p53-cell:nth-of-type(4){animation-delay:.24s}
[data-scene="pj-53"].s1 .p53-cell:nth-of-type(5){animation-delay:.32s}
[data-scene="pj-53"].s1 .p53-cell:nth-of-type(6){animation-delay:.4s}
[data-scene="pj-53"].s1 .p53-flow{stroke-dasharray:8 6;animation:p53flow 1s linear infinite}
[data-scene="pj-53"].s2 .p53-law{transform-box:fill-box;transform-origin:center;animation:p53pop .55s ease both}
[data-scene="pj-53"].s2 .p53-flow{stroke-dasharray:10 8;animation:p53flow 1.2s linear infinite}
[data-scene="pj-53"].s2 .p53-eq{animation:p53pulse 2.4s ease-in-out infinite}
[data-scene="pj-53"].s3 .p53-wheel{transform-box:fill-box;transform-origin:center;animation:p53spin 16s linear infinite}
[data-scene="pj-53"].s3 .p53-x{animation:p53pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">能量的转化和守恒：总量保持不变</text>

<!-- 第一步：各种能量转化 -->
<g class="p53-s1" data-zone="1">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="216" height="30" rx="15" fill="#dbeafe"/>
  <text x="164" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 各种形式的能量转化</text>
  <text x="292" y="100" font-size="13" font-weight="800" fill="#1e3a8a">能量可以从一种形式转化为另一种形式</text>

  <g class="p53-cell">
    <rect x="52" y="112" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="176" y="140" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">摩擦生热</text>
    <rect x="80" y="158" width="78" height="28" rx="8" fill="#e8effc"/>
    <text x="119" y="177" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">机械能</text>
    <line class="p53-flow" x1="160" y1="172" x2="190" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <rect x="194" y="158" width="78" height="28" rx="8" fill="#fee2e2"/>
    <text x="233" y="177" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">内能</text>
    <text x="176" y="208" font-size="11" fill="#64748b" text-anchor="middle">搓手、钻木取火</text>
  </g>

  <g class="p53-cell">
    <rect x="322" y="112" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="446" y="140" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">燃料燃烧</text>
    <rect x="350" y="158" width="78" height="28" rx="8" fill="#fef3c7"/>
    <text x="389" y="177" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">化学能</text>
    <line class="p53-flow" x1="430" y1="172" x2="460" y2="172" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <rect x="464" y="158" width="78" height="28" rx="8" fill="#fee2e2"/>
    <text x="503" y="177" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">内能</text>
    <text x="446" y="208" font-size="11" fill="#64748b" text-anchor="middle">烧水、取暖</text>
  </g>

  <g class="p53-cell">
    <rect x="592" y="112" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="716" y="140" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">发电机</text>
    <rect x="620" y="158" width="78" height="28" rx="8" fill="#e8effc"/>
    <text x="659" y="177" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">机械能</text>
    <line class="p53-flow" x1="700" y1="172" x2="730" y2="172" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <rect x="734" y="158" width="78" height="28" rx="8" fill="#fef3c7"/>
    <text x="773" y="177" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">电能</text>
    <text x="716" y="208" font-size="11" fill="#64748b" text-anchor="middle">水电站、风力发电</text>
  </g>

  <g class="p53-cell">
    <rect x="52" y="236" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="176" y="264" font-size="13" font-weight="800" fill="#0f766e" text-anchor="middle">电动机</text>
    <rect x="80" y="282" width="78" height="28" rx="8" fill="#fef3c7"/>
    <text x="119" y="301" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">电能</text>
    <line class="p53-flow" x1="160" y1="296" x2="190" y2="296" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <rect x="194" y="282" width="78" height="28" rx="8" fill="#e8effc"/>
    <text x="233" y="301" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">机械能</text>
    <text x="176" y="332" font-size="11" fill="#64748b" text-anchor="middle">电动车、电风扇</text>
  </g>

  <g class="p53-cell">
    <rect x="322" y="236" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="446" y="264" font-size="13" font-weight="800" fill="#15803d" text-anchor="middle">光合作用</text>
    <rect x="350" y="282" width="78" height="28" rx="8" fill="#fef9c3"/>
    <text x="389" y="301" font-size="11" font-weight="800" fill="#854d0e" text-anchor="middle">光能</text>
    <line class="p53-flow" x1="430" y1="296" x2="460" y2="296" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrAmber)"/>
    <rect x="464" y="282" width="78" height="28" rx="8" fill="#dcfce7"/>
    <text x="503" y="301" font-size="11" font-weight="800" fill="#166534" text-anchor="middle">化学能</text>
    <text x="446" y="332" font-size="11" fill="#64748b" text-anchor="middle">植物储存能量</text>
  </g>

  <g class="p53-cell">
    <rect x="592" y="236" width="248" height="108" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="716" y="264" font-size="13" font-weight="800" fill="#6d28d9" text-anchor="middle">电池充电</text>
    <rect x="620" y="282" width="78" height="28" rx="8" fill="#fef3c7"/>
    <text x="659" y="301" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">电能</text>
    <line class="p53-flow" x1="700" y1="296" x2="730" y2="296" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <rect x="734" y="282" width="78" height="28" rx="8" fill="#ede9fe"/>
    <text x="773" y="301" font-size="11" font-weight="800" fill="#5b21b6" text-anchor="middle">化学能</text>
    <text x="716" y="332" font-size="11" fill="#64748b" text-anchor="middle">手机充电</text>
  </g>

  <text x="450" y="388" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">同种能量可以转化，不同能量之间也能相互转化</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#eef6ff"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量既可以从一种形式转化为另一种形式，也可以发生转移</text>
</g>

<!-- 第二步：能量守恒定律 -->
<g class="p53-s2" data-zone="2">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="136" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 能量守恒定律</text>

  <rect class="p53-law" x="80" y="112" width="740" height="116" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="150" font-size="16" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量既不会凭空消灭，也不会凭空产生，</text>
  <text x="450" y="180" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">它只会从一种形式转化为其他形式，或者从一个物体转移到另一个物体，</text>
  <text x="450" y="210" font-size="16" font-weight="800" fill="#1e3a8a" text-anchor="middle">而能的总量保持不变。</text>

  <rect x="110" y="266" width="190" height="86" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="205" y="298" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">一种形式的能</text>
  <text x="205" y="324" font-size="11.5" fill="#475569" text-anchor="middle">或一个物体</text>
  <rect x="600" y="266" width="190" height="86" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="695" y="298" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">另一种形式的能</text>
  <text x="695" y="324" font-size="11.5" fill="#475569" text-anchor="middle">或另一个物体</text>

  <line class="p53-flow" x1="306" y1="309" x2="594" y2="309" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <text x="450" y="296" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">转化 / 转移</text>
  <text x="450" y="334" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">能量的形式变了，总量不变</text>

  <rect class="p53-eq" x="250" y="362" width="400" height="32" rx="10" fill="#f0fdf4"/>
  <text x="450" y="384" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">E总 = 常量（能量总量保持不变）</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#eef6ff"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量守恒定律：能量不会消灭，也不会创生，总量保持不变</text>
</g>

<!-- 第三步：永动机不可能 -->
<g class="p53-s3" data-zone="3">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="136" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 永动机不可能</text>

  <rect x="52" y="120" width="420" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="262" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">设想中的永动机</text>

  <g class="p53-wheel">
    <circle cx="262" cy="258" r="92" fill="#ffffff" stroke="#64748b" stroke-width="5"/>
    <circle cx="262" cy="258" r="70" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="262" y1="258" x2="350" y2="258"/>
      <line x1="262" y1="258" x2="324" y2="196"/>
      <line x1="262" y1="258" x2="262" y2="170"/>
      <line x1="262" y1="258" x2="200" y2="196"/>
      <line x1="262" y1="258" x2="174" y2="258"/>
      <line x1="262" y1="258" x2="200" y2="320"/>
      <line x1="262" y1="258" x2="262" y2="346"/>
      <line x1="262" y1="258" x2="324" y2="320"/>
    </g>
    <circle cx="346" cy="258" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="321" cy="317" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="262" cy="342" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="203" cy="317" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="178" cy="258" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="203" cy="199" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="262" cy="174" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="321" cy="199" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <circle cx="262" cy="258" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  </g>

  <g class="p53-x" stroke="#dc2626" stroke-width="7" stroke-linecap="round" opacity=".82">
    <line x1="200" y1="196" x2="324" y2="320"/>
    <line x1="324" y1="196" x2="200" y2="320"/>
  </g>

  <text x="262" y="384" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">不需要消耗能量，却能不断对外做功</text>

  <rect x="492" y="120" width="356" height="278" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么不可能？</text>
  <rect x="510" y="160" width="320" height="66" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="187" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">① 能量不能凭空产生</text>
  <text x="670" y="211" font-size="11.5" fill="#7f1d1d" text-anchor="middle">必须消耗能量才能对外做功</text>
  <rect x="510" y="236" width="320" height="66" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="263" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">② 摩擦把机械能变成内能</text>
  <text x="670" y="287" font-size="11.5" fill="#7f1d1d" text-anchor="middle">内能无法自动全部变回机械能</text>
  <rect x="510" y="312" width="320" height="42" rx="10" fill="#fee2e2"/>
  <text x="670" y="339" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">③ 违背能量守恒定律</text>
  <text x="670" y="380" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">所以永动机不可能制成</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#fef2f2"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">永动机违背能量守恒定律，不可能制成</text>
</g>
</svg>
