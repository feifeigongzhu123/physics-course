<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电磁振荡：LC振荡电路的充放电过程、电场能与磁场能转化、振荡周期">
<style>
[data-scene="ps-96"] .s96-s1,[data-scene="ps-96"] .s96-s2,[data-scene="ps-96"] .s96-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-96"].s1 .s96-s1,[data-scene="ps-96"].s2 .s96-s2,[data-scene="ps-96"].s3 .s96-s3{opacity:1;visibility:visible}
@keyframes s96fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s96draw{to{stroke-dashoffset:0}}
@keyframes s96pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s96flow{to{stroke-dashoffset:-40}}
@keyframes s96pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s96grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
[data-scene="ps-96"].s1 .s96-current{stroke-dasharray:8 7;animation:s96flow 1.1s linear infinite}
[data-scene="ps-96"].s1 .s96-plate{animation:s96pulse 1.6s ease-in-out infinite}
[data-scene="ps-96"].s1 .s96-coil{transform-box:fill-box;transform-origin:center;animation:s96pop .55s ease .2s both}
[data-scene="ps-96"].s2 .s96-bar{transform-box:fill-box;transform-origin:center bottom;animation:s96grow .8s ease both}
[data-scene="ps-96"].s2 .s96-bar2{animation-delay:.15s}
[data-scene="ps-96"].s2 .s96-bar3{animation-delay:.3s}
[data-scene="ps-96"].s2 .s96-bar4{animation-delay:.45s}
[data-scene="ps-96"].s2 .s96-bar5{animation-delay:.6s}
[data-scene="ps-96"].s2 .s96-bar6{animation-delay:.75s}
[data-scene="ps-96"].s3 .s96-damped{stroke-dasharray:520;stroke-dashoffset:520;animation:s96draw 1.5s ease .2s forwards}
[data-scene="ps-96"].s3 .s96-formula{transform-box:fill-box;transform-origin:center;animation:s96pop .55s ease .2s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电磁振荡：LC 电路中的充放电与能量转化</text>

<!-- 第一步：振荡过程 -->
<g class="s96-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电容器和电感线圈组成振荡电路，充放电反复进行</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">LC 振荡电路</text>

  <line x1="200" y1="225" x2="200" y2="180" stroke="#475569" stroke-width="2.5"/>
  <line x1="200" y1="295" x2="200" y2="350" stroke="#475569" stroke-width="2.5"/>
  <line class="s96-plate" x1="186" y1="222" x2="186" y2="298" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <line class="s96-plate" x1="214" y1="222" x2="214" y2="298" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/>
  <text x="178" y="244" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">+</text>
  <text x="222" y="286" font-size="13" font-weight="900" fill="#1e3a8a">−</text>
  <text x="164" y="266" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">C</text>

  <line x1="200" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="2.5"/>
  <line x1="350" y1="180" x2="460" y2="180" stroke="#475569" stroke-width="2.5"/>
  <line x1="300" y1="180" x2="344" y2="160" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="180" r="3.5" fill="#475569"/>
  <circle cx="350" cy="180" r="3.5" fill="#475569"/>
  <text x="322" y="152" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">S</text>

  <line x1="460" y1="180" x2="460" y2="244" stroke="#475569" stroke-width="2.5"/>
  <g class="s96-coil">
    <path d="M460 244 C478 244 478 266 460 266 C478 266 478 288 460 288 C478 288 478 310 460 310" fill="none" stroke="#b45309" stroke-width="3"/>
  </g>
  <line x1="460" y1="310" x2="460" y2="350" stroke="#475569" stroke-width="2.5"/>
  <line x1="460" y1="350" x2="200" y2="350" stroke="#475569" stroke-width="2.5"/>
  <text x="490" y="282" font-size="12" font-weight="900" fill="#92400e" text-anchor="middle">L</text>

  <line class="s96-current" x1="250" y1="350" x2="360" y2="350" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="300" y="372" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">放电电流 I</text>

  <text x="296" y="400" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">电容器充电后闭合开关，电荷通过线圈放电</text>
  <text x="296" y="424" font-size="11" fill="#64748b" text-anchor="middle">线圈的自感作用使电流不能突变，充放电往复进行</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">振荡是怎样形成的</text>

  <circle cx="610" cy="172" r="12" fill="#dbeafe"/>
  <text x="610" y="177" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="632" y="177" font-size="11" font-weight="700" fill="#334155">电容器充电，电场能最大</text>

  <circle cx="610" cy="212" r="12" fill="#dbeafe"/>
  <text x="610" y="217" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="632" y="217" font-size="11" font-weight="700" fill="#334155">闭合开关，电容器放电</text>

  <circle cx="610" cy="252" r="12" fill="#dbeafe"/>
  <text x="610" y="257" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="632" y="257" font-size="11" font-weight="700" fill="#334155">电流增大，电荷减少</text>

  <circle cx="610" cy="292" r="12" fill="#dbeafe"/>
  <text x="610" y="297" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="632" y="297" font-size="11" font-weight="700" fill="#334155">放电完毕：I 最大，q = 0</text>

  <circle cx="610" cy="332" r="12" fill="#dbeafe"/>
  <text x="610" y="337" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">5</text>
  <text x="632" y="337" font-size="11" font-weight="700" fill="#334155">自感继续供电，反向充电</text>

  <rect x="596" y="358" width="248" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="382" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">充放电反复进行</text>
  <text x="720" y="404" font-size="11" fill="#92400e" text-anchor="middle">形成大小、方向周期性变化的电流</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电容器放电、充电反复进行，电路中形成周期性的振荡电流</text>
</g>

<!-- 第二步：能量转化 -->
<g class="s96-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电场能和磁场能相互转化，理想电路中总能量保持不变</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量的转化过程</text>

  <rect x="56" y="156" width="150" height="196" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="131" y="180" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 电荷最多</text>
  <rect class="s96-bar" x="82" y="210" width="30" height="120" rx="4" fill="#3b82f6"/>
  <rect class="s96-bar s96-bar2" x="132" y="328" width="30" height="2" rx="1" fill="#f59e0b"/>
  <text x="97" y="348" font-size="11" fill="#1e40af" text-anchor="middle">E电</text>
  <text x="147" y="348" font-size="11" fill="#b45309" text-anchor="middle">E磁</text>

  <rect x="216" y="156" width="150" height="196" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="291" y="180" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 放电中</text>
  <rect class="s96-bar s96-bar3" x="242" y="270" width="30" height="60" rx="4" fill="#3b82f6"/>
  <rect class="s96-bar s96-bar4" x="292" y="270" width="30" height="60" rx="4" fill="#f59e0b"/>
  <text x="257" y="348" font-size="11" fill="#1e40af" text-anchor="middle">E电</text>
  <text x="307" y="348" font-size="11" fill="#b45309" text-anchor="middle">E磁</text>

  <rect x="376" y="156" width="150" height="196" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="451" y="180" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 电流最大</text>
  <rect class="s96-bar s96-bar5" x="402" y="328" width="30" height="2" rx="1" fill="#3b82f6"/>
  <rect class="s96-bar s96-bar6" x="452" y="210" width="30" height="120" rx="4" fill="#f59e0b"/>
  <text x="417" y="348" font-size="11" fill="#1e40af" text-anchor="middle">E电</text>
  <text x="467" y="348" font-size="11" fill="#b45309" text-anchor="middle">E磁</text>

  <text x="296" y="386" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">放电：电场能 → 磁场能</text>
  <text x="296" y="410" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">充电：磁场能 → 电场能</text>
  <text x="296" y="432" font-size="11" fill="#64748b" text-anchor="middle">此消彼长，循环往复</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量的存在形式</text>

  <circle cx="611" cy="174" r="11" fill="#dbeafe"/>
  <text x="611" y="178" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">C</text>
  <text x="632" y="178" font-size="11.5" font-weight="700" fill="#334155">电场能集中在电容器</text>

  <circle cx="611" cy="214" r="11" fill="#fef3c7"/>
  <text x="611" y="218" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">L</text>
  <text x="632" y="218" font-size="11.5" font-weight="700" fill="#334155">磁场能集中在线圈</text>

  <text x="598" y="254" font-size="11.5" font-weight="700" fill="#334155">· 电荷最多时，电场能最大</text>
  <text x="598" y="278" font-size="11.5" font-weight="700" fill="#334155">· 电流最大时，磁场能最大</text>
  <text x="598" y="302" font-size="11.5" font-weight="700" fill="#334155">· 理想电路没有能量损耗</text>

  <rect x="596" y="320" width="248" height="48" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="720" y="350" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">E电 + E磁 = 常量</text>

  <text x="598" y="392" font-size="11" fill="#64748b">能量在电场和磁场之间转移</text>
  <text x="598" y="414" font-size="11" fill="#64748b">振荡电流也按周期性规律变化</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">放电时电场能转化为磁场能，充电时磁场能转化为电场能，总量守恒</text>
</g>

<!-- 第三步：周期和频率 -->
<g class="s96-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">振荡周期由电感 L 和电容 C 决定，与电荷量、电流大小无关</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">LC 振荡的周期</text>

  <g class="s96-formula">
    <rect x="76" y="158" width="440" height="66" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="296" y="198" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = 2π√(LC)</text>
  </g>
  <rect x="136" y="238" width="320" height="44" rx="10" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="296" y="266" font-size="16" font-weight="900" fill="#475569" text-anchor="middle">f = 1 / T</text>

  <text x="80" y="312" font-size="11.5" font-weight="700" fill="#334155">L 越大，周期越长，频率越低</text>
  <text x="80" y="336" font-size="11.5" font-weight="700" fill="#334155">C 越大，周期越长，频率越低</text>
  <text x="80" y="360" font-size="11.5" font-weight="700" fill="#334155">改变 L 或 C，就能改变振荡频率</text>
  <text x="80" y="384" font-size="11" fill="#64748b">与电容器所带电荷量、电流大小无关</text>
  <text x="80" y="408" font-size="11" fill="#64748b">收音机调谐就是调节电容改变频率</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">阻尼振荡</text>

  <line x1="612" y1="300" x2="612" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="600" y1="280" x2="846" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <text x="602" y="186" font-size="11.5" font-weight="800" fill="#475569">i</text>
  <text x="840" y="300" font-size="11.5" font-weight="800" fill="#475569">t</text>

  <path class="s96-damped" d="M620 280 C638 222 658 222 676 280 C694 330 712 330 730 280 C744 242 762 242 776 280 C786 306 800 306 810 280 C817 261 827 261 834 280" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <text x="720" y="330" font-size="11" fill="#64748b" text-anchor="middle">实际电路存在电阻，能量逐渐损耗</text>

  <text x="598" y="356" font-size="11.5" font-weight="700" fill="#334155">· 振幅逐渐减小 → 阻尼振荡</text>
  <text x="598" y="380" font-size="11.5" font-weight="700" fill="#334155">· 能量转化为内能</text>
  <text x="598" y="404" font-size="11.5" font-weight="700" fill="#334155">· 理想无阻尼时等幅振荡</text>
  <text x="598" y="426" font-size="11" fill="#64748b">实际电路要不断补充能量</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">T = 2π√(LC)：L、C 越大周期越长；实际电路因电阻而成为阻尼振荡</text>
</g>
</svg>
