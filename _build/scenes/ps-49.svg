<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="导体的电阻：电阻概念、电阻定律与材料长度横截面积温度四个因素">
<style>
[data-scene="ps-49"] .s49-step1,[data-scene="ps-49"] .s49-step2,[data-scene="ps-49"] .s49-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-49"].s1 .s49-step1,[data-scene="ps-49"].s2 .s49-step2,[data-scene="ps-49"].s3 .s49-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s49flow{to{stroke-dashoffset:-40}}
@keyframes s49pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s49draw{to{stroke-dashoffset:0}}
@keyframes s49widen{0%{transform:scaleX(.7);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes s49heat{0%,100%{opacity:.55}50%{opacity:1}}
[data-scene="ps-49"].s1 .s49-flow{stroke-dasharray:10 10;animation:s49flow 1.4s linear infinite}
[data-scene="ps-49"].s1 .s49-card{transform-box:fill-box;transform-origin:center;animation:s49pop .5s ease both}
[data-scene="ps-49"].s1 .s49-r{animation:s49heat 2s ease-in-out infinite}
[data-scene="ps-49"].s2 .s49-card{transform-box:fill-box;transform-origin:center;animation:s49pop .5s ease both}
[data-scene="ps-49"].s2 .s49-dim{stroke-dasharray:560;stroke-dashoffset:560;animation:s49draw 1s ease .2s forwards}
[data-scene="ps-49"].s2 .s49-stretch{transform-box:fill-box;transform-origin:left center;animation:s49widen .8s ease .5s both}
[data-scene="ps-49"].s3 .s49-card1{transform-box:fill-box;transform-origin:center;animation:s49pop .45s ease both}
[data-scene="ps-49"].s3 .s49-card2{transform-box:fill-box;transform-origin:center;animation:s49pop .45s ease .1s both}
[data-scene="ps-49"].s3 .s49-card3{transform-box:fill-box;transform-origin:center;animation:s49pop .45s ease .2s both}
[data-scene="ps-49"].s3 .s49-card4{transform-box:fill-box;transform-origin:center;animation:s49pop .45s ease .3s both}
[data-scene="ps-49"].s3 .s49-heat{animation:s49heat 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">导体的电阻：R = U/I 与电阻定律 R = ρL/S</text>

<!-- 第一步：电阻概念 -->
<g class="s49-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 电阻：导体对电流的阻碍作用</text>

  <g class="s49-card">
    <rect x="50" y="104" width="420" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="260" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">一段导体接在电路中</text>

    <path class="s49-flow" d="M90 180 H390 V380 H90 Z" fill="none" stroke="#1d4ed8" stroke-width="7" opacity=".18"/>
    <path d="M90 180 H180 M270 180 H390 V380 H90 V180" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <rect class="s49-r" x="180" y="168" width="90" height="24" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="225" y="156" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">R</text>

    <line x1="228" y1="362" x2="228" y2="398" stroke="#334155" stroke-width="5"/>
    <line x1="244" y1="368" x2="244" y2="392" stroke="#334155" stroke-width="5"/>
    <text x="300" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">电源</text>

    <polygon points="330,174 342,180 330,186" fill="#1d4ed8"/>
    <polygon points="384,270 390,282 396,270" fill="#1d4ed8"/>
    <polygon points="150,374 138,380 150,386" fill="#1d4ed8"/>
    <polygon points="84,270 90,258 96,270" fill="#1d4ed8"/>
    <text x="345" y="164" font-size="12" font-weight="800" fill="#b91c1c">I</text>
    <text x="150" y="240" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">导体对电流有阻碍</text>
  </g>

  <g class="s49-card">
    <rect x="480" y="104" width="370" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="140" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻的定义式</text>
    <text x="665" y="200" font-size="30" font-weight="900" fill="#b45309" text-anchor="middle">R = U / I</text>
    <text x="665" y="228" font-size="11.5" fill="#64748b" text-anchor="middle">（量度式）</text>
    <line x1="510" y1="250" x2="820" y2="250" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="665" y="280" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">单位：欧姆（Ω）</text>
    <text x="665" y="306" font-size="12" fill="#334155" text-anchor="middle">1 kΩ = 10³ Ω</text>
    <text x="665" y="332" font-size="12" fill="#334155" text-anchor="middle">1 MΩ = 10⁶ Ω</text>
    <line x1="510" y1="352" x2="820" y2="352" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="665" y="380" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻由导体本身决定</text>
    <text x="665" y="404" font-size="11.5" fill="#334155" text-anchor="middle">与 U、I 无关，U/I 只是量度方式</text>
    <text x="665" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">同一导体，温度变化不大时 R 不变</text>
  </g>

  <rect x="50" y="468" width="800" height="40" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="493" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻是导体本身的性质：不能说“U 越大 R 越大”或“I 越大 R 越小”</text>

  <text x="80" y="576" font-size="12" fill="#64748b">电阻器在电路图中的符号是一个矩形，R 是它的阻值</text>
</g>

<!-- 第二步：电阻定律 -->
<g class="s49-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 电阻定律：R 与 L、S、材料的关系</text>

  <g class="s49-card">
    <rect x="170" y="96" width="560" height="78" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="132" font-size="24" font-weight="900" fill="#b45309" text-anchor="middle">R = ρ L / S</text>
    <text x="450" y="160" font-size="11.5" fill="#64748b" text-anchor="middle">ρ：电阻率，反映材料导电性能，单位 Ω·m</text>
  </g>

  <text x="400" y="192" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">原导线：长度 L，横截面积 S，电阻 R</text>
  <rect x="120" y="200" width="560" height="60" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <line x1="150" y1="230" x2="250" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="262" y="235" font-size="12" font-weight="800" fill="#b91c1c">I</text>

  <line class="s49-dim" x1="120" y1="288" x2="680" y2="288" stroke="#475569" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="400" y="308" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">L</text>

  <line x1="400" y1="318" x2="400" y2="350" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="414" y="340" font-size="11.5" font-weight="800" fill="#6d28d9">均匀拉长</text>

  <rect class="s49-stretch" x="200" y="362" width="380" height="36" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="600" y="378" font-size="12" font-weight="800" fill="#1e3a8a">拉长到 2L，S 变为 S/2</text>
  <text x="600" y="402" font-size="15" font-weight="900" fill="#b91c1c">R′ = 4R</text>
  <text x="200" y="424" font-size="11" fill="#64748b">体积不变：长度变为 2 倍，横截面积就变为一半</text>

  <rect x="50" y="452" width="800" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="476" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">同种材料、温度一定：L 越长 R 越大，S 越大 R 越小</text>
  <text x="450" y="498" font-size="11.5" fill="#1e3a8a" text-anchor="middle">R 与 L 成正比，与 S 成反比</text>

  <text x="80" y="576" font-size="12" fill="#64748b">电阻率 ρ 由材料和温度决定，与导线的 L、S 无关</text>
</g>

<!-- 第三步：四个因素 -->
<g class="s49-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 决定电阻的四个因素</text>

  <g class="s49-card1">
    <rect x="48" y="108" width="190" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="143" y="146" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">材料</text>
    <text x="143" y="186" font-size="12" fill="#334155" text-anchor="middle">ρ 越小，导电越好</text>
    <text x="143" y="214" font-size="11.5" fill="#047857" text-anchor="middle">银 &lt; 铜 &lt; 铝</text>
    <line x1="78" y1="234" x2="208" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="143" y="260" font-size="11" fill="#64748b" text-anchor="middle">导线常用铜或铝</text>
    <text x="143" y="284" font-size="11" fill="#64748b" text-anchor="middle">电阻率由材料决定</text>
    <text x="143" y="316" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">ρ</text>
  </g>

  <g class="s49-card2">
    <rect x="262" y="108" width="190" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="357" y="146" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">长度 L</text>
    <text x="357" y="186" font-size="12" fill="#334155" text-anchor="middle">L 越长，R 越大</text>
    <text x="357" y="214" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">R ∝ L</text>
    <line x1="292" y1="234" x2="422" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="357" y="260" font-size="11" fill="#64748b" text-anchor="middle">长度加倍，电阻加倍</text>
    <text x="357" y="284" font-size="11" fill="#64748b" text-anchor="middle">几段导体串联起来</text>
    <text x="357" y="312" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">L ↑ ⇒ R ↑</text>
  </g>

  <g class="s49-card3">
    <rect x="476" y="108" width="190" height="236" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="571" y="146" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">横截面积 S</text>
    <text x="571" y="186" font-size="12" fill="#334155" text-anchor="middle">S 越大，R 越小</text>
    <text x="571" y="214" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">R ∝ 1/S</text>
    <line x1="506" y1="234" x2="636" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="571" y="260" font-size="11" fill="#64748b" text-anchor="middle">导线越粗，越容易导电</text>
    <text x="571" y="284" font-size="11" fill="#64748b" text-anchor="middle">几段导体并联起来</text>
    <text x="571" y="312" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">S ↑ ⇒ R ↓</text>
  </g>

  <g class="s49-card4">
    <rect x="690" y="108" width="190" height="236" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
    <text x="785" y="146" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">温度</text>
    <text x="785" y="186" font-size="11.5" fill="#334155" text-anchor="middle">金属：温度升高 R 变大</text>
    <text x="785" y="212" font-size="11.5" fill="#334155" text-anchor="middle">半导体：温度升高 R 变小</text>
    <line x1="720" y1="232" x2="850" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="785" y="260" font-size="11" fill="#64748b" text-anchor="middle">灯丝正常发光时</text>
    <text x="785" y="284" font-size="11" fill="#64748b" text-anchor="middle">温度很高，电阻变大</text>
    <text x="785" y="312" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">t ↑ ⇒ 金属 R ↑</text>
  </g>

  <g class="s49-card1">
    <rect x="48" y="364" width="832" height="86" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="464" y="394" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">例：同种导线拉长到 2L，横截面积变为 S/2</text>
    <text x="464" y="424" font-size="13.5" font-weight="900" fill="#b45309" text-anchor="middle">R′ = ρ(2L)/(S/2) = 4ρL/S = 4R</text>
    <text x="464" y="444" font-size="11" fill="#7c5a30" text-anchor="middle">长度变长、变细，两个因素都使电阻变大</text>
  </g>

  <text x="80" y="576" font-size="12" fill="#64748b">判断电阻变化：先看材料，再看 L 和 S，最后考虑温度影响</text>
</g>
</svg>
