<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="温度和温标：热平衡、摄氏温标与热力学温标">
<style>
[data-scene="ps-106"] .s106-s1,[data-scene="ps-106"] .s106-s2,[data-scene="ps-106"] .s106-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-106"].s1 .s106-s1,[data-scene="ps-106"].s2 .s106-s2,[data-scene="ps-106"].s3 .s106-s3{opacity:1;visibility:visible}
@keyframes s106fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s106draw{to{stroke-dashoffset:0}}
@keyframes s106pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s106pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s106flow{to{stroke-dashoffset:-36}}
@keyframes s106grow{from{transform:scaleX(.15);opacity:0}to{transform:scaleX(1);opacity:1}}
[data-scene="ps-106"].s1 .s106-arrow{stroke-dasharray:8 7;animation:s106flow 1s linear infinite}
[data-scene="ps-106"].s1 .s106-hotbox{animation:s106pulse 2.4s ease-in-out infinite}
[data-scene="ps-106"].s1 .s106-card{transform-box:fill-box;transform-origin:center;animation:s106pop .5s ease .2s both}
[data-scene="ps-106"].s2 .s106-scale{stroke-dasharray:210;stroke-dashoffset:210;animation:s106draw 1s ease .2s forwards}
[data-scene="ps-106"].s2 .s106-link{stroke-dasharray:8 6;animation:s106flow 1.2s linear infinite}
[data-scene="ps-106"].s2 .s106-card{transform-box:fill-box;transform-origin:center;animation:s106pop .5s ease .4s both}
[data-scene="ps-106"].s3 .s106-formula{transform-box:fill-box;transform-origin:center;animation:s106pop .55s ease .2s both}
[data-scene="ps-106"].s3 .s106-row{transform-box:fill-box;transform-origin:left center;animation:s106grow .6s ease both}
[data-scene="ps-106"].s3 .s106-row2{animation-delay:.15s}
[data-scene="ps-106"].s3 .s106-row3{animation-delay:.3s}
[data-scene="ps-106"].s3 .s106-card{transform-box:fill-box;transform-origin:center;animation:s106pop .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">温度和温标：热平衡、摄氏温标与热力学温标</text>

<!-- 第一步：热平衡 -->
<g class="s106-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">两个系统接触后达到热平衡，温度相同</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="300" height="28" rx="14" fill="#e8effc"/>
  <text x="206" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个系统的热接触</text>

  <g class="s106-card">
    <rect class="s106-hotbox" x="70" y="180" width="190" height="150" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.8"/>
    <text x="165" y="208" font-size="13" font-weight="900" fill="#991b1b" text-anchor="middle">系统 A</text>
    <text x="165" y="244" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">80 °C</text>
    <text x="165" y="270" font-size="11" fill="#b91c1c" text-anchor="middle">高温物体</text>
    <g opacity=".5">
      <circle cx="120" cy="300" r="5" fill="#dc2626"/>
      <circle cx="160" cy="312" r="5" fill="#dc2626"/>
      <circle cx="200" cy="300" r="5" fill="#dc2626"/>
    </g>
  </g>

  <rect x="260" y="180" width="40" height="150" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="280" y="262" font-size="11" fill="#475569" text-anchor="middle" transform="rotate(-90 280 262)">接触</text>

  <g class="s106-card">
    <rect x="300" y="180" width="190" height="150" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.8"/>
    <text x="395" y="208" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">系统 B</text>
    <text x="395" y="244" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">20 °C</text>
    <text x="395" y="270" font-size="11" fill="#1e40af" text-anchor="middle">低温物体</text>
    <g opacity=".5">
      <circle cx="350" cy="300" r="5" fill="#1d4ed8"/>
      <circle cx="390" cy="312" r="5" fill="#1d4ed8"/>
      <circle cx="430" cy="300" r="5" fill="#1d4ed8"/>
    </g>
  </g>

  <line class="s106-arrow" x1="200" y1="344" x2="360" y2="344" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="280" y="366" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">热传递：高温 → 低温</text>

  <text x="280" y="390" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">热的系统温度下降，冷的系统温度上升</text>
  <text x="280" y="414" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">经过一段时间，两个系统温度相同</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热平衡定律</text>

  <circle cx="612" cy="170" r="4" fill="#1d4ed8"/>
  <text x="628" y="174" font-size="11.5" fill="#334155">两个系统相互接触，发生热传递</text>
  <circle cx="612" cy="198" r="4" fill="#1d4ed8"/>
  <text x="628" y="202" font-size="11.5" fill="#334155">状态不再变化时，达到热平衡</text>

  <g class="s106-card">
    <rect x="596" y="220" width="248" height="66" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="246" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">处于热平衡的系统温度相同</text>
    <text x="720" y="270" font-size="11" fill="#475569" text-anchor="middle">温度是热平衡的共同标志</text>
  </g>

  <text x="610" y="310" font-size="11.5" font-weight="800" fill="#1d4ed8">热平衡定律（热力学第零定律）</text>
  <text x="610" y="334" font-size="11" fill="#475569">若 A 与 B 热平衡，B 与 C 热平衡，</text>
  <text x="610" y="354" font-size="11" fill="#475569">则 A 与 C 也必然热平衡。</text>

  <g class="s106-card">
    <rect x="596" y="370" width="248" height="52" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="392" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">平衡态是一种动态平衡</text>
    <text x="720" y="411" font-size="11" fill="#92400e" text-anchor="middle">分子仍然在不停地运动</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个系统接触达到热平衡时温度相同，这就是热平衡定律</text>
</g>

<!-- 第二步：摄氏温标与热力学温标 -->
<g class="s106-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">摄氏温标以冰点和沸点定标，热力学温标用开尔文</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="300" height="28" rx="14" fill="#e8effc"/>
  <text x="206" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两种温标的刻度对照</text>

  <text x="200" y="158" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">摄氏温标 / °C</text>
  <text x="400" y="158" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">热力学温标 / K</text>

  <line class="s106-scale" x1="200" y1="180" x2="200" y2="380" stroke="#1d4ed8" stroke-width="3"/>
  <line class="s106-scale" x1="400" y1="180" x2="400" y2="380" stroke="#d97706" stroke-width="3"/>

  <g stroke="#1d4ed8" stroke-width="1.8">
    <line x1="190" y1="180" x2="210" y2="180"/><line x1="190" y1="220" x2="210" y2="220"/>
    <line x1="190" y1="260" x2="210" y2="260"/><line x1="190" y1="300" x2="210" y2="300"/>
    <line x1="190" y1="340" x2="210" y2="340"/><line x1="190" y1="380" x2="210" y2="380"/>
  </g>
  <g fill="#1e3a8a" font-size="11" text-anchor="end">
    <text x="182" y="184">100</text><text x="182" y="224">80</text><text x="182" y="264">60</text>
    <text x="182" y="304">40</text><text x="182" y="344">20</text><text x="182" y="384">0</text>
  </g>

  <g stroke="#d97706" stroke-width="1.8">
    <line x1="390" y1="180" x2="410" y2="180"/><line x1="390" y1="220" x2="410" y2="220"/>
    <line x1="390" y1="260" x2="410" y2="260"/><line x1="390" y1="300" x2="410" y2="300"/>
    <line x1="390" y1="340" x2="410" y2="340"/><line x1="390" y1="380" x2="410" y2="380"/>
  </g>
  <g fill="#b45309" font-size="11" text-anchor="start">
    <text x="418" y="184">373</text><text x="418" y="224">353</text><text x="418" y="264">333</text>
    <text x="418" y="304">313</text><text x="418" y="344">293</text><text x="418" y="384">273</text>
  </g>

  <line class="s106-link" x1="214" y1="180" x2="386" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <line class="s106-link" x1="214" y1="380" x2="386" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="300" y="200" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">373 K = 100 °C</text>
  <text x="300" y="370" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">273 K = 0 °C</text>

  <text x="120" y="196" font-size="11" fill="#64748b" text-anchor="middle">沸水</text>
  <text x="120" y="372" font-size="11" fill="#64748b" text-anchor="middle">冰水混合物</text>
  <text x="306" y="412" font-size="11" fill="#64748b" text-anchor="middle">两种温标每一格表示的温差相同</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">温标的规定</text>

  <text x="610" y="168" font-size="11.5" font-weight="800" fill="#1e3a8a">摄氏温标 t</text>
  <text x="610" y="190" font-size="11" fill="#475569">单位：摄氏度（°C）</text>
  <text x="610" y="212" font-size="11" fill="#475569">标准大气压下：</text>
  <text x="610" y="234" font-size="11" fill="#475569">冰水混合物为 0 °C</text>
  <text x="610" y="256" font-size="11" fill="#475569">沸水为 100 °C</text>

  <line x1="610" y1="272" x2="830" y2="272" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="610" y="296" font-size="11.5" font-weight="800" fill="#b45309">热力学温标 T</text>
  <text x="610" y="318" font-size="11" fill="#475569">单位：开尔文（K）</text>
  <text x="610" y="340" font-size="11" fill="#475569">0 K 叫绝对零度</text>
  <text x="610" y="362" font-size="11" fill="#475569">约等于 -273.15 °C</text>

  <g class="s106-card">
    <rect x="596" y="382" width="248" height="40" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="407" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">国际单位制中温度单位是开尔文</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">摄氏温标用冰点和沸点定标，热力学温标以开尔文为单位</text>
</g>

<!-- 第三步：T = t + 273 -->
<g class="s106-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">热力学温度与摄氏温度的换算关系</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="300" height="28" rx="14" fill="#e8effc"/>
  <text x="206" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">温度换算</text>

  <g class="s106-formula">
    <rect x="90" y="158" width="400" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="290" y="198" font-size="26" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = t + 273.15</text>
    <text x="290" y="228" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">计算中常取 T = t + 273（K）</text>
  </g>

  <g class="s106-row">
    <rect x="90" y="272" width="400" height="42" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="290" y="299" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">0 °C  →  T = 273 K</text>
  </g>
  <g class="s106-row s106-row2">
    <rect x="90" y="322" width="400" height="42" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="290" y="349" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">27 °C  →  T = 300 K</text>
  </g>
  <g class="s106-row s106-row3">
    <rect x="90" y="372" width="400" height="42" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="290" y="399" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">-73 °C  →  T = 200 K</text>
  </g>

  <text x="290" y="430" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">ΔT = Δt：温度变化 1 °C 等于 1 K</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">换算要点</text>

  <circle cx="612" cy="170" r="4" fill="#1d4ed8"/>
  <text x="628" y="174" font-size="11.5" fill="#334155">T：热力学温度，单位 K</text>
  <circle cx="612" cy="198" r="4" fill="#1d4ed8"/>
  <text x="628" y="202" font-size="11.5" fill="#334155">t：摄氏温度，单位 °C</text>
  <circle cx="612" cy="226" r="4" fill="#1d4ed8"/>
  <text x="628" y="230" font-size="11.5" fill="#334155">计算时常用 T = t + 273</text>
  <circle cx="612" cy="254" r="4" fill="#1d4ed8"/>
  <text x="628" y="258" font-size="11.5" fill="#334155">热力学温度不能取负值</text>

  <g class="s106-card">
    <rect x="596" y="280" width="248" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="306" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">气体实验定律中的 T</text>
    <text x="720" y="326" font-size="11.5" font-weight="900" fill="#b45309" text-anchor="middle">必须用热力学温度</text>
    <text x="720" y="344" font-size="11" fill="#92400e" text-anchor="middle">不能用摄氏温度代入</text>
  </g>

  <text x="610" y="382" font-size="11.5" font-weight="800" fill="#1e3a8a">温度变化量：</text>
  <text x="610" y="406" font-size="12" font-weight="800" fill="#1e3a8a">ΔT = Δt</text>
  <text x="610" y="426" font-size="11" fill="#64748b">升高 1 °C 就是升高 1 K</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">T = t + 273.15 K；计算时常取 T = t + 273，且 ΔT = Δt</text>
</g>
</svg>
