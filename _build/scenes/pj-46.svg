<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="滑轮：定滑轮、动滑轮、滑轮组及其拉力与距离关系">
  <style>
    .p46-s1,.p46-s2,.p46-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    .p46-s1{opacity:1;visibility:visible}
    [data-scene="pj-46"] .p46-s1,[data-scene="pj-46"] .p46-s2,[data-scene="pj-46"] .p46-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-46"].s1 .p46-s1,[data-scene="pj-46"].s2 .p46-s2,[data-scene="pj-46"].s3 .p46-s3{opacity:1;visibility:visible}
    @keyframes p46pop{0%{transform:scale(.78);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p46pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes p46spin{to{transform:rotate(360deg)}}
    @keyframes p46lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes p46flow{to{stroke-dashoffset:-36}}
    [data-scene="pj-46"].s1 .p46-spin{transform-box:fill-box;transform-origin:center;animation:p46spin 6s linear infinite}
    [data-scene="pj-46"].s1 .p46-force{animation:p46pulse 1.6s ease-in-out infinite}
    [data-scene="pj-46"].s1 .p46-pop{transform-box:fill-box;transform-origin:center;animation:p46pop .5s ease both}
    [data-scene="pj-46"].s2 .p46-spin{transform-box:fill-box;transform-origin:center;animation:p46spin 5s linear infinite}
    [data-scene="pj-46"].s2 .p46-lift{transform-box:fill-box;transform-origin:center;animation:p46lift 2.2s ease-in-out infinite}
    [data-scene="pj-46"].s2 .p46-force{animation:p46pulse 1.7s ease-in-out infinite}
    [data-scene="pj-46"].s2 .p46-pop{transform-box:fill-box;transform-origin:center;animation:p46pop .5s ease both}
    [data-scene="pj-46"].s3 .p46-spin{transform-box:fill-box;transform-origin:center;animation:p46spin 5.5s linear infinite}
    [data-scene="pj-46"].s3 .p46-lift{transform-box:fill-box;transform-origin:center;animation:p46lift 2.4s ease-in-out infinite}
    [data-scene="pj-46"].s3 .p46-force{animation:p46pulse 1.7s ease-in-out infinite}
    [data-scene="pj-46"].s3 .p46-pop{transform-box:fill-box;transform-origin:center;animation:p46pop .5s ease both}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">滑轮：定滑轮、动滑轮与滑轮组</text>

  <!-- 第一步：定滑轮 -->
  <g class="p46-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">定滑轮：轴固定不动，不省力，但能改变力的方向</text>

    <rect x="60" y="114" width="540" height="14" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="100" y1="128" x2="84" y2="142"/><line x1="160" y1="128" x2="144" y2="142"/>
      <line x1="220" y1="128" x2="204" y2="142"/><line x1="280" y1="128" x2="264" y2="142"/>
      <line x1="520" y1="128" x2="504" y2="142"/>
    </g>
    <path d="M278 365 L278 210 A52 52 0 0 1 382 210 L382 402" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" marker-end="url(#arrAmber)"/>
    <line x1="330" y1="128" x2="330" y2="163" stroke="#64748b" stroke-width="8"/>
    <g class="p46-spin">
      <circle cx="330" cy="215" r="52" fill="#f8fafc" stroke="#475569" stroke-width="6"/>
      <circle cx="330" cy="215" r="16" fill="#94a3b8"/>
      <circle cx="330" cy="215" r="4" fill="#475569"/>
      <line x1="330" y1="163" x2="330" y2="190" stroke="#64748b" stroke-width="2"/>
    </g>

    <rect x="248" y="365" width="60" height="52" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="278" y="398" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">G</text>
    <line class="p46-force" x1="406" y1="330" x2="406" y2="404" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="420" y="396" font-size="13" font-weight="800" fill="#1e40af">F</text>
    <text x="402" y="174" font-size="11.5" font-weight="700" fill="#64748b">轴固定</text>

    <g class="p46-pop">
      <rect x="610" y="130" width="250" height="270" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="630" y="144" width="150" height="26" rx="13" fill="#e8effc"/>
      <text x="705" y="162" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">实质：等臂杠杆</text>
      <rect x="655" y="254" width="160" height="12" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
      <polygon points="735,266 712,302 758,302" fill="#64748b"/>
      <circle cx="735" cy="260" r="4" fill="#334155"/>
      <line x1="675" y1="200" x2="675" y2="256" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
      <line x1="795" y1="200" x2="795" y2="256" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
      <line x1="675" y1="326" x2="735" y2="326" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="735" y1="326" x2="795" y2="326" stroke="#1d4ed8" stroke-width="2"/>
      <text x="705" y="320" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">l1</text>
      <text x="765" y="320" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">l2</text>
      <text x="735" y="358" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">l1 = l2 → F = G</text>
      <text x="735" y="384" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">s = h</text>
    </g>
    <text x="450" y="448" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">绳端移动距离等于物体上升高度（s = h），拉力等于物重（F = G）</text>
  </g>

  <!-- 第二步：动滑轮 -->
  <g class="p46-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">动滑轮：轴随物体移动，省一半力，费一倍距离</text>

    <rect x="120" y="118" width="660" height="14" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="360" cy="132" r="5" fill="#475569"/>
    <path d="M360 132 L370 330 A50 50 0 0 0 470 330 L495 190 A45 45 0 0 1 585 190 L585 408" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" marker-end="url(#arrAmber)"/>

    <line x1="540" y1="132" x2="540" y2="160" stroke="#64748b" stroke-width="8"/>
    <g class="p46-spin">
      <circle cx="540" cy="190" r="45" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
      <circle cx="540" cy="190" r="14" fill="#94a3b8"/>
      <line x1="540" y1="160" x2="540" y2="176" stroke="#64748b" stroke-width="2"/>
    </g>
    <g class="p46-lift">
      <g class="p46-spin">
        <circle cx="420" cy="330" r="50" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
        <circle cx="420" cy="330" r="15" fill="#94a3b8"/>
        <circle cx="420" cy="330" r="4" fill="#475569"/>
      </g>
      <line x1="420" y1="380" x2="420" y2="400" stroke="#475569" stroke-width="3"/>
      <rect x="382" y="400" width="76" height="52" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <text x="420" y="432" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">G</text>
    </g>

    <text x="352" y="300" font-size="11.5" font-weight="800" fill="#334155" text-anchor="end">动滑轮</text>
    <text x="352" y="318" font-size="11" fill="#64748b" text-anchor="end">轴随物体移动</text>
    <line class="p46-force" x1="612" y1="344" x2="612" y2="414" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="626" y="404" font-size="13" font-weight="800" fill="#1e40af">F</text>

    <g class="p46-pop">
      <rect x="620" y="140" width="240" height="250" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="640" y="154" width="150" height="26" rx="13" fill="#e8effc"/>
      <text x="715" y="172" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">动滑轮的特点</text>
      <text x="660" y="208" font-size="12.5" font-weight="700" fill="#334155">实质：l1 = 2·l2</text>
      <text x="660" y="242" font-size="19" font-weight="900" fill="#1e3a8a">F = G/2</text>
      <text x="660" y="278" font-size="19" font-weight="900" fill="#1e3a8a">s = 2h</text>
      <text x="660" y="312" font-size="11.5" fill="#64748b">省一半力，费一倍距离</text>
      <text x="660" y="338" font-size="11.5" fill="#64748b">不能改变力的方向</text>
      <text x="660" y="364" font-size="11.5" fill="#64748b">不计摩擦和动滑轮重</text>
    </g>
    <text x="450" y="448" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">动滑轮：省一半力，费一倍距离，不能改变力的方向</text>
  </g>

  <!-- 第三步：滑轮组 -->
  <g class="p46-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">滑轮组：定滑轮和动滑轮组合，F = G/n，s = n·h</text>

    <rect x="100" y="118" width="680" height="14" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="362" cy="132" r="5" fill="#475569"/>
    <path d="M362 132 L362 345 A38 38 0 0 0 438 345 L482 185 A38 38 0 0 1 558 185 L558 425" fill="none" stroke="#b45309" stroke-width="4" stroke-linecap="round" marker-end="url(#arrAmber)"/>

    <line x1="520" y1="132" x2="520" y2="147" stroke="#64748b" stroke-width="8"/>
    <g class="p46-spin">
      <circle cx="520" cy="185" r="38" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
      <circle cx="520" cy="185" r="12" fill="#94a3b8"/>
      <line x1="520" y1="147" x2="520" y2="173" stroke="#64748b" stroke-width="2"/>
    </g>
    <g class="p46-lift">
      <g class="p46-spin">
        <circle cx="400" cy="345" r="38" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
        <circle cx="400" cy="345" r="12" fill="#94a3b8"/>
        <circle cx="400" cy="345" r="3.5" fill="#475569"/>
      </g>
      <line x1="400" y1="383" x2="400" y2="400" stroke="#475569" stroke-width="3"/>
      <rect x="362" y="400" width="76" height="50" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <text x="400" y="432" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">G</text>
    </g>

    <text x="330" y="330" font-size="11.5" font-weight="800" fill="#334155" text-anchor="end">动滑轮</text>
    <text x="566" y="164" font-size="11.5" font-weight="800" fill="#334155">定滑轮</text>
    <line class="p46-force" x1="586" y1="330" x2="586" y2="420" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="600" y="410" font-size="13" font-weight="800" fill="#1e40af">F</text>

    <g class="p46-pop">
      <rect x="620" y="140" width="250" height="280" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="640" y="154" width="150" height="26" rx="13" fill="#e8effc"/>
      <text x="715" y="172" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">滑轮组</text>
      <text x="660" y="208" font-size="12.5" font-weight="700" fill="#334155">n = 2 段绳子承担物重</text>
      <text x="660" y="246" font-size="20" font-weight="900" fill="#1e3a8a">F = G/n</text>
      <text x="660" y="286" font-size="20" font-weight="900" fill="#1e3a8a">s = n·h</text>
      <text x="660" y="320" font-size="12.5" font-weight="800" fill="#047857">本例：F = G/2，s = 2h</text>
      <text x="660" y="350" font-size="11.5" fill="#64748b">有几段绳子承担物重，</text>
      <text x="660" y="370" font-size="11.5" fill="#64748b">拉力就是物重的几分之一</text>
      <text x="660" y="396" font-size="11.5" fill="#64748b">不计摩擦和动滑轮重</text>
    </g>
    <text x="450" y="458" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">绳端移动距离是物体上升高度的 n 倍：s = n·h</text>
  </g>
</svg>
