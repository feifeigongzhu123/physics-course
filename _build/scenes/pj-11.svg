<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="噪声的危害和控制：噪声、分贝等级与三条控制途径">
  <style>
    .p11-s1,.p11-s2,.p11-s3{opacity:0;visibility:hidden}
    .p11-s1{opacity:1;visibility:visible}
    [data-scene="pj-11"] .p11-s1,[data-scene="pj-11"] .p11-s2,[data-scene="pj-11"] .p11-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-11"].s1 .p11-s1,[data-scene="pj-11"].s2 .p11-s2,[data-scene="pj-11"].s3 .p11-s3{opacity:1;visibility:visible}
    @keyframes p11jac{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes p11dash{to{stroke-dashoffset:-44}}
    @keyframes p11pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes p11blink{0%,100%{opacity:.55}50%{opacity:1}}
    [data-scene="pj-11"].s1 .p11-noiseWave{animation:p11jac .8s ease-in-out infinite}
    [data-scene="pj-11"].s1 .p11-snd{animation:p11pulse 1.1s ease-in-out infinite}
    [data-scene="pj-11"].s1 .p11-snd:nth-of-type(2){animation-delay:.2s}
    [data-scene="pj-11"].s2 .p11-ptr{animation:p11blink 1.2s ease-in-out infinite}
    [data-scene="pj-11"].s3 .p11-flow{animation:p11dash 1s linear infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">噪声的危害和控制：从声源到人耳</text>

  <!-- ========== 第一步：什么是噪声 ========== -->
  <g class="p11-s1" data-zone="1">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="180" height="30" rx="15" fill="#e8effc"/>
    <text x="146" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 什么是噪声</text>

    <!-- 乐音 -->
    <rect x="52" y="112" width="390" height="222" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="247" y="142" font-size="15" font-weight="800" fill="#047857" text-anchor="middle">乐音：振动规则</text>
    <g fill="#16a34a">
      <ellipse cx="90" cy="184" rx="7" ry="5" transform="rotate(-20 90 184)"/>
      <line x1="96" y1="183" x2="96" y2="158" stroke="#16a34a" stroke-width="2.5"/>
      <path d="M96 158 q10 2 8 12" fill="none" stroke="#16a34a" stroke-width="2.5"/>
      <ellipse cx="120" cy="203" rx="6" ry="4.5" transform="rotate(-20 120 203)"/>
      <line x1="125" y1="202" x2="125" y2="180" stroke="#16a34a" stroke-width="2.5"/>
      <path d="M125 180 q9 2 7 11" fill="none" stroke="#16a34a" stroke-width="2.5"/>
    </g>
    <line x1="76" y1="225" x2="414" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path d="M80 225 q20.6 -60 41.25 0 q20.6 60 41.25 0 q20.6 -60 41.25 0 q20.6 60 41.25 0 q20.6 -60 41.25 0 q20.6 60 41.25 0 q20.6 -60 41.25 0 q20.6 60 41.25 0" fill="none" stroke="#059669" stroke-width="3"/>
    <text x="247" y="288" font-size="12.5" font-weight="700" fill="#047857" text-anchor="middle">波形整齐、有规律</text>

    <!-- 噪声 -->
    <rect x="458" y="112" width="390" height="222" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="653" y="142" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="middle">噪声：振动无规则</text>
    <rect x="490" y="196" width="24" height="38" rx="3" fill="#f87171"/>
    <polygon points="514,196 534,180 534,250 514,234" fill="#ef4444"/>
    <path class="p11-snd" d="M542 198 q10 22 0 44" fill="none" stroke="#fca5a5" stroke-width="2.5"/>
    <path class="p11-snd" d="M552 188 q16 32 0 64" fill="none" stroke="#fca5a5" stroke-width="2.5"/>
    <polyline class="p11-noiseWave" points="560,220 572,196 582,244 594,204 604,252 616,188 626,236 638,200 648,250 660,190 670,242 682,206 692,248 704,194 714,238 726,202 736,246 748,192 758,236 770,210" fill="none" stroke="#dc2626" stroke-width="2.8" stroke-linejoin="round"/>
    <g>
      <circle cx="800" cy="200" r="14" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
      <path d="M786 216 Q800 208 814 216 L820 258 H780 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
      <circle cx="783" cy="200" r="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
      <circle cx="817" cy="200" r="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    </g>
    <text x="620" y="288" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">波形杂乱、无规律</text>

    <!-- 两个角度 -->
    <rect x="52" y="346" width="796" height="100" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.5"/>
    <circle cx="74" cy="374" r="4" fill="#dc2626"/>
    <text x="88" y="379" font-size="13" font-weight="800" fill="#b91c1c">物理学角度：发声体做无规则振动</text>
    <circle cx="74" cy="404" r="4" fill="#dc2626"/>
    <text x="88" y="409" font-size="12.5" font-weight="800" fill="#b91c1c">环境保护角度：妨碍休息、学习、工作，干扰要听的声音</text>
    <text x="88" y="432" font-size="11.5" fill="#64748b">乐音在特定场合也可能成为噪声</text>
  </g>

  <!-- ========== 第二步：噪声等级 ========== -->
  <g class="p11-s2" data-zone="2">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="226" height="30" rx="15" fill="#fef3c7"/>
    <text x="169" y="100" font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">② 噪声等级 · 分贝 dB</text>

    <!-- 分贝柱 -->
    <rect x="150" y="116" width="48" height="282" rx="24" fill="#eef2f7" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="158" y="280" width="32" height="112" rx="5" fill="#4ade80"/>
    <rect x="158" y="186" width="32" height="92" rx="5" fill="#facc15"/>
    <rect x="158" y="118" width="32" height="66" rx="5" fill="#fb923c"/>
    <g font-size="11.5" font-weight="800" fill="#334155" text-anchor="end">
      <text x="140" y="122">120</text>
      <text x="140" y="191">90</text>
      <text x="140" y="284">50</text>
      <text x="140" y="400">0</text>
    </g>
    <line x1="150" y1="186" x2="250" y2="186" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="150" y1="280" x2="250" y2="280" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line class="p11-ptr" x1="256" y1="198" x2="202" y2="198" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="262" y="192" font-size="16" font-weight="900" fill="#dc2626">85 dB</text>
    <text x="262" y="212" font-size="11" fill="#64748b">当前</text>

    <!-- 声级计 -->
    <rect x="324" y="122" width="150" height="112" rx="12" fill="#334155"/>
    <rect x="334" y="132" width="130" height="48" rx="6" fill="#dcfce7"/>
    <text x="399" y="166" font-size="20" font-weight="900" fill="#166534" text-anchor="middle">85 dB</text>
    <circle cx="399" cy="198" r="7" fill="#94a3b8"/>
    <text x="399" y="220" font-size="11" fill="#e2e8f0" text-anchor="middle">声级计</text>

    <!-- 读数卡 -->
    <rect x="500" y="112" width="340" height="76" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="520" y="142" font-size="20" font-weight="900" fill="#b45309">90 dB</text>
    <text x="520" y="168" font-size="12" font-weight="700" fill="#92400e">保护听力：声音不超过 90 dB</text>
    <rect x="500" y="200" width="340" height="76" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <text x="520" y="230" font-size="20" font-weight="900" fill="#a16207">50 dB</text>
    <text x="520" y="256" font-size="12" font-weight="700" fill="#854d0e">保证休息和睡眠：不超过 50 dB</text>
    <rect x="500" y="288" width="340" height="76" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="520" y="318" font-size="20" font-weight="900" fill="#047857">0 dB</text>
    <text x="520" y="344" font-size="12" font-weight="700" fill="#065f46">人刚能听到的最微弱声音</text>
    <rect x="500" y="376" width="340" height="34" rx="10" fill="#fff7ed"/>
    <text x="670" y="398" font-size="12" font-weight="700" fill="#9a3412" text-anchor="middle">120 dB 是痛阈：耳朵会感到疼痛</text>

    <rect x="52" y="416" width="796" height="34" rx="10" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="450" y="438" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">0 dB 不是没有声音，而是人刚能听到的声音</text>
  </g>

  <!-- ========== 第三步：控制噪声 ========== -->
  <g class="p11-s3" data-zone="3">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="226" height="30" rx="15" fill="#e8effc"/>
    <text x="169" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 控制噪声的三条途径</text>

    <!-- 声源处 -->
    <rect x="52" y="118" width="252" height="264" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="78" cy="144" r="13" fill="#dbeafe"/>
    <text x="78" y="149" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="98" y="150" font-size="15" font-weight="800" fill="#1e3a8a">声源处</text>
    <rect x="118" y="172" width="60" height="22" rx="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <line x1="148" y1="194" x2="148" y2="204" stroke="#475569" stroke-width="4"/>
    <line x1="180" y1="166" x2="230" y2="158" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="234" y="162" font-size="11" font-weight="700" fill="#475569">消声器</text>
    <rect x="90" y="204" width="116" height="82" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
    <circle cx="148" cy="245" r="21" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
    <path d="M148 234 v22 M137 245 h22 M140 237 l16 16 M156 237 l-16 16" stroke="#94a3b8" stroke-width="1.5"/>
    <path class="p11-snd" d="M224 228 q14 17 0 34" fill="none" stroke="#f87171" stroke-width="2.5" opacity=".5"/>
    <path class="p11-snd" d="M236 218 q20 27 0 54" fill="none" stroke="#f87171" stroke-width="2.5" opacity=".35"/>
    <text x="178" y="316" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">加消声器</text>
    <text x="178" y="340" font-size="11.5" fill="#64748b" text-anchor="middle">减弱声源的振动</text>

    <!-- 传播中 -->
    <rect x="324" y="118" width="252" height="264" rx="14" fill="#f8fbff" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="350" cy="144" r="13" fill="#dcfce7"/>
    <text x="350" y="149" font-size="12" font-weight="900" fill="#15803d" text-anchor="middle">2</text>
    <text x="370" y="150" font-size="15" font-weight="800" fill="#166534">传播过程中</text>
    <rect x="344" y="310" width="212" height="30" fill="#e2e8f0"/>
    <line x1="344" y1="325" x2="556" y2="325" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
    <rect x="362" y="282" width="58" height="24" rx="6" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="374" y="270" width="32" height="14" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="378" cy="308" r="6" fill="#334155"/><circle cx="408" cy="308" r="6" fill="#334155"/>
    <rect x="470" y="208" width="20" height="104" fill="#a8a29e" stroke="#57534e" stroke-width="2"/>
    <path d="M470 226 l20 10 M470 250 l20 10 M470 274 l20 10 M470 298 l20 10" stroke="#78716c" stroke-width="1.5"/>
    <rect x="464" y="202" width="32" height="8" rx="3" fill="#78716c"/>
    <line x1="520" y1="300" x2="520" y2="258" stroke="#92400e" stroke-width="4"/>
    <circle cx="520" cy="244" r="18" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <circle cx="534" cy="252" r="13" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <path class="p11-flow" d="M424 276 Q444 268 462 276" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 5"/>
    <path d="M496 272 Q508 268 518 272" fill="none" stroke="#f87171" stroke-width="2" opacity=".25"/>
    <text x="450" y="362" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">隔音墙 · 绿化带</text>

    <!-- 人耳处 -->
    <rect x="596" y="118" width="252" height="264" rx="14" fill="#f8fbff" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="622" cy="144" r="13" fill="#fef3c7"/>
    <text x="622" y="149" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">3</text>
    <text x="642" y="150" font-size="15" font-weight="800" fill="#92400e">人耳处</text>
    <path class="p11-snd" d="M654 206 q-14 20 0 40" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <path class="p11-snd" d="M666 196 q-20 30 0 60" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <circle cx="730" cy="226" r="34" fill="#fde68a" stroke="#92400e" stroke-width="2.5"/>
    <ellipse cx="762" cy="226" rx="8" ry="14" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <rect x="760" y="219" width="9" height="14" rx="4" fill="#dc2626"/>
    <path d="M700 212 Q730 176 760 212" fill="none" stroke="#475569" stroke-width="5"/>
    <rect x="692" y="206" width="14" height="26" rx="7" fill="#64748b"/>
    <rect x="756" y="206" width="14" height="26" rx="7" fill="#64748b"/>
    <circle cx="720" cy="226" r="2.5" fill="#92400e"/>
    <text x="722" y="316" font-size="13.5" font-weight="800" fill="#92400e" text-anchor="middle">戴耳塞、耳罩</text>
    <text x="722" y="340" font-size="11.5" fill="#64748b" text-anchor="middle">在人耳处减弱</text>

    <line x1="306" y1="250" x2="322" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <line x1="578" y1="250" x2="594" y2="250" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <rect x="52" y="394" width="796" height="52" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="450" y="426" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">声源处 → 传播过程中 → 人耳处：越早控制越有效</text>
  </g>
</svg>
