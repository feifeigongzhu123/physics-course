<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="浮力：竖直向上的托力、上下表面压力差、称重法测浮力">
<style>
[data-scene="pj-38"] .p38-step1,[data-scene="pj-38"] .p38-step2,[data-scene="pj-38"] .p38-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="pj-38"].s1 .p38-step1,[data-scene="pj-38"].s2 .p38-step2,[data-scene="pj-38"].s3 .p38-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes p38bob{from{transform:translateY(2px)}to{transform:translateY(-3px)}}
@keyframes p38pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p38pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes p38draw{to{stroke-dashoffset:0}}
[data-scene="pj-38"].s1 .p38-block{transform-box:fill-box;transform-origin:center;animation:p38bob 2s ease-in-out infinite alternate}
[data-scene="pj-38"].s1 .p38-farrow{animation:p38pulse 1.8s ease-in-out infinite}
[data-scene="pj-38"].s2 .p38-press{animation:p38pulse 1.6s ease-in-out infinite}
[data-scene="pj-38"].s2 .p38-card{transform-box:fill-box;transform-origin:center;animation:p38pop .45s ease both}
[data-scene="pj-38"].s3 .p38-setup{transform-box:fill-box;transform-origin:center;animation:p38pop .45s ease both}
[data-scene="pj-38"].s3 .p38-farrow{animation:p38pulse 1.8s ease-in-out infinite}
[data-scene="pj-38"].s3 .p38-formula{stroke-dasharray:240;stroke-dashoffset:240;animation:p38draw .9s ease .4s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">浮力：方向、产生原因与称重法</text>

<!-- 第一步：浮力的方向 -->
<g class="p38-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">浸在液体或气体中的物体，受到竖直向上的托力</text>

  <rect x="250" y="200" width="340" height="240" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="4"/>
  <rect x="254" y="260" width="332" height="176" fill="#bfdbfe" opacity=".6"/>
  <line x1="254" y1="260" x2="586" y2="260" stroke="#60a5fa" stroke-width="3"/>

  <g class="p38-block">
    <rect x="340" y="225" width="170" height="90" rx="8" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <line x1="340" y1="260" x2="510" y2="260" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="7 5"/>
  </g>
  <text x="425" y="240" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">木块</text>

  <line class="p38-farrow" x1="470" y1="272" x2="470" y2="182" stroke="#059669" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="456" y="218" font-size="15" font-weight="900" fill="#047857" text-anchor="end">F浮</text>
  <line x1="470" y1="316" x2="470" y2="402" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="484" y="386" font-size="15" font-weight="900" fill="#b91c1c">G</text>

  <ellipse cx="320" cy="372" rx="30" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="292,372 272,358 272,386" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="336" cy="368" r="2.5" fill="#334155"/>
  <text x="320" y="402" font-size="11" fill="#64748b" text-anchor="middle">水中的鱼</text>

  <ellipse cx="130" cy="206" rx="36" ry="44" fill="#f87171" stroke="#b91c1c" stroke-width="2"/>
  <path d="M130 250 Q118 280 132 300" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="120" y="300" width="24" height="18" rx="3" fill="#b45309"/>
  <text x="130" y="342" font-size="11.5" fill="#64748b" text-anchor="middle">气体中的气球</text>

  <rect x="640" y="110" width="200" height="212" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="740" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">浮力三要点</text>
  <g font-size="11.5" fill="#334155">
    <text x="658" y="176">① 方向：竖直向上</text>
    <text x="658" y="206">② 施力物体：液体或气体</text>
    <text x="658" y="236">③ 漂浮、悬浮、下沉</text>
    <text x="676" y="256">都受到浮力</text>
  </g>
  <line x1="660" y1="272" x2="820" y2="272" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="740" y="296" font-size="11" fill="#64748b" text-anchor="middle">浮力方向与运动方向无关</text>

  <text x="450" y="470" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">浮力的施力物体是液体或气体，受力物体是浸在其中的物体</text>
</g>

<!-- 第二步：浮力产生的原因 -->
<g class="p38-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">下表面受到的向上压力大于上表面受到的向下压力</text>

  <path d="M170 180 V450 H620 V180" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
  <rect x="174" y="240" width="442" height="206" fill="#bfdbfe" opacity=".6"/>
  <line x1="174" y1="240" x2="616" y2="240" stroke="#60a5fa" stroke-width="3"/>
  <text x="210" y="232" font-size="11.5" font-weight="700" fill="#1e40af">液面</text>

  <rect x="330" y="290" width="140" height="120" fill="#93c5fd" stroke="#1e40af" stroke-width="2.5"/>
  <text x="400" y="356" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">物体</text>

  <line x1="300" y1="240" x2="300" y2="290" stroke="#334155" stroke-width="1.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="292" y1="240" x2="308" y2="240" stroke="#334155" stroke-width="1.5"/>
  <line x1="292" y1="290" x2="308" y2="290" stroke="#334155" stroke-width="1.5"/>
  <text x="286" y="270" font-size="12" font-weight="800" fill="#334155" text-anchor="end">h₁</text>
  <line x1="310" y1="290" x2="310" y2="410" stroke="#334155" stroke-width="1.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="296" y="352" font-size="12" font-weight="800" fill="#334155" text-anchor="end">h₂ − h₁</text>

  <line class="p38-press" x1="400" y1="244" x2="400" y2="288" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="386" y="262" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">F向下</text>
  <line class="p38-press" x1="400" y1="446" x2="400" y2="412" stroke="#059669" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="414" y="440" font-size="11.5" font-weight="800" fill="#047857">F向上</text>
  <text x="320" y="430" font-size="11.5" fill="#1e40af" text-anchor="end">左右侧面的压力相互抵消</text>

  <g class="p38-card">
    <rect x="630" y="130" width="210" height="260" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="735" y="162" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">浮力 = 压力差</text>
    <text x="648" y="202" font-size="12.5" font-weight="800" fill="#1e3a8a">F浮 = F向上 − F向下</text>
    <text x="648" y="238" font-size="12" fill="#334155">= ρ液 g (h₂ − h₁) S</text>
    <text x="648" y="278" font-size="15" font-weight="900" fill="#b45309">= ρ液 g V排</text>
    <line x1="650" y1="298" x2="820" y2="298" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="648" y="324" font-size="11.5" fill="#64748b">下表面没有液体时，</text>
    <text x="648" y="344" font-size="11.5" fill="#64748b">物体就不受浮力</text>
    <text x="648" y="370" font-size="11" fill="#b45309">例：桥墩底部埋在土里</text>
  </g>

  <rect x="70" y="455" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="479" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">桥墩底部埋在河床里，下表面不受液体压力，所以桥墩不受浮力</text>
</g>

<!-- 第三步：称重法 -->
<g class="p38-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">称重法：空气中测 G，浸入液体读 F示，相减得 F浮</text>

  <g class="p38-setup">
    <rect x="95" y="462" width="190" height="10" rx="4" fill="#64748b"/>
    <rect x="100" y="120" width="10" height="344" fill="#94a3b8"/>
    <rect x="100" y="120" width="130" height="10" fill="#94a3b8"/>
    <rect x="195" y="130" width="34" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="200" y1="150" x2="212" y2="150"/><line x1="200" y1="168" x2="212" y2="168"/><line x1="200" y1="186" x2="212" y2="186"/>
    </g>
    <line x1="212" y1="220" x2="212" y2="250" stroke="#475569" stroke-width="1.5"/>
    <rect x="187" y="250" width="50" height="46" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <rect x="240" y="140" width="100" height="36" rx="8" fill="#e8effc"/>
    <text x="290" y="163" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">G = 4.0 N</text>
    <text x="212" y="318" font-size="11.5" fill="#64748b" text-anchor="middle">空气中</text>
  </g>

  <g class="p38-setup">
    <rect x="365" y="462" width="195" height="10" rx="4" fill="#64748b"/>
    <rect x="370" y="120" width="10" height="344" fill="#94a3b8"/>
    <rect x="370" y="120" width="140" height="10" fill="#94a3b8"/>
    <rect x="455" y="130" width="34" height="90" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="460" y1="150" x2="472" y2="150"/><line x1="460" y1="168" x2="472" y2="168"/><line x1="460" y1="186" x2="472" y2="186"/>
    </g>
    <rect x="400" y="270" width="145" height="180" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
    <rect x="404" y="300" width="137" height="146" fill="#bfdbfe" opacity=".65"/>
    <line x1="404" y1="300" x2="541" y2="300" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="472" y1="220" x2="472" y2="310" stroke="#475569" stroke-width="1.5"/>
    <rect x="447" y="310" width="50" height="50" rx="4" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
    <rect x="498" y="150" width="96" height="34" rx="8" fill="#e8effc"/>
    <text x="546" y="172" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F示 = 3.0 N</text>
    <line class="p38-farrow" x1="515" y1="350" x2="515" y2="304" stroke="#059669" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <text x="524" y="338" font-size="11.5" font-weight="800" fill="#047857">F浮</text>
    <text x="420" y="340" font-size="11" fill="#1e40af">水</text>
  </g>

  <rect x="600" y="120" width="240" height="335" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">称重法</text>
  <text x="720" y="196" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">F浮 = G − F示</text>
  <text x="720" y="236" font-size="12.5" fill="#334155" text-anchor="middle">G = 4.0 N（空气中）</text>
  <text x="720" y="264" font-size="12.5" fill="#334155" text-anchor="middle">F示 = 3.0 N（浸入液体中）</text>
  <line x1="630" y1="286" x2="810" y2="286" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="318" font-size="12.5" fill="#334155" text-anchor="middle">F浮 = 4.0 N − 3.0 N</text>
  <text x="720" y="352" font-size="19" font-weight="900" fill="#b45309" text-anchor="middle">= 1.0 N</text>
  <g font-size="11.5" fill="#64748b">
    <text x="630" y="388">① 在空气中测出重力 G</text>
    <text x="630" y="410">② 浸入液体读出 F示</text>
    <text x="630" y="432">③ 两次示数相减得浮力</text>
  </g>

  <text x="450" y="490" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">物体要浸在液体中，且不接触容器底和侧壁</text>
</g>
</svg>
