<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="光电效应：入射光频率与截止频率、遏止电压和最大初动能、爱因斯坦光电方程">
<style>
[data-scene="ps-116"] .s116-s1,[data-scene="ps-116"] .s116-s2,[data-scene="ps-116"] .s116-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-116"].s1 .s116-s1,[data-scene="ps-116"].s2 .s116-s2,[data-scene="ps-116"].s3 .s116-s3{opacity:1;visibility:visible}
@keyframes s116fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s116draw{to{stroke-dashoffset:0}}
@keyframes s116pop{0%{transform:scale(.88);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s116flow{to{stroke-dashoffset:-32}}
@keyframes s116rise{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(44px,-14px);opacity:0}}
@keyframes s116fall{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
[data-scene="ps-116"].s1 .s116-ray{stroke-dasharray:8 6;animation:s116flow 1s linear infinite}
[data-scene="ps-116"].s1 .s116-electron{transform-box:fill-box;animation:s116rise 2.2s ease-in-out infinite}
[data-scene="ps-116"].s1 .s116-electron2{animation-delay:.5s}
[data-scene="ps-116"].s1 .s116-electron3{animation-delay:1s}
[data-scene="ps-116"].s1 .s116-card{transform-box:fill-box;transform-origin:center;animation:s116pop .55s ease .4s both}
[data-scene="ps-116"].s2 .s116-curve{stroke-dasharray:520;stroke-dashoffset:520;animation:s116draw 1.2s ease .2s forwards}
[data-scene="ps-116"].s2 .s116-curve2{animation-delay:.4s}
[data-scene="ps-116"].s2 .s116-card{animation:s116fade .5s ease .5s both}
[data-scene="ps-116"].s3 .s116-photon{stroke-dasharray:9 7;animation:s116flow 1.1s linear infinite}
[data-scene="ps-116"].s3 .s116-bar{transform-box:fill-box;transform-origin:center;animation:s116pop .55s ease .3s both}
[data-scene="ps-116"].s3 .s116-eq{transform-box:fill-box;transform-origin:center;animation:s116pop .6s ease .5s both}
[data-scene="ps-116"].s3 .s116-card{animation:s116fade .5s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">光电效应：光子把电子从金属中打出来</text>

<!-- 第一步：现象与截止频率 -->
<g class="s116-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">光电效应：只有入射光频率不低于截止频率，才有光电子逸出</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光照射金属表面</text>

  <rect x="250" y="180" width="18" height="170" rx="3" fill="#94a3b8"/>
  <text x="259" y="172" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">金属板</text>

  <g class="s116-ray" stroke="#d97706" stroke-width="2.5">
    <line x1="70" y1="210" x2="238" y2="210" marker-end="url(#arrAmber)"/>
    <line x1="70" y1="246" x2="238" y2="246" marker-end="url(#arrAmber)"/>
    <line x1="70" y1="282" x2="238" y2="282" marker-end="url(#arrAmber)"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="100" cy="210" r="4"/>
    <circle cx="140" cy="210" r="4"/>
    <circle cx="180" cy="210" r="4"/>
    <circle cx="115" cy="246" r="4"/>
    <circle cx="155" cy="246" r="4"/>
    <circle cx="195" cy="246" r="4"/>
    <circle cx="100" cy="282" r="4"/>
    <circle cx="140" cy="282" r="4"/>
    <circle cx="180" cy="282" r="4"/>
  </g>
  <text x="100" y="194" font-size="11.5" font-weight="800" fill="#b45309">入射光（光子）</text>

  <g stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)">
    <line x1="272" y1="210" x2="410" y2="188"/>
    <line x1="272" y1="246" x2="420" y2="246"/>
    <line x1="272" y1="282" x2="414" y2="304"/>
  </g>
  <g class="s116-electron" fill="#dc2626">
    <circle cx="300" cy="204" r="5"/>
    <text x="312" y="200" font-size="11" font-weight="800">e⁻</text>
  </g>
  <g class="s116-electron s116-electron2" fill="#dc2626">
    <circle cx="330" cy="246" r="5"/>
    <text x="342" y="242" font-size="11" font-weight="800">e⁻</text>
  </g>
  <g class="s116-electron s116-electron3" fill="#dc2626">
    <circle cx="352" cy="290" r="5"/>
    <text x="364" y="286" font-size="11" font-weight="800">e⁻</text>
  </g>

  <text x="296" y="376" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">光照射金属表面，电子从表面逸出</text>
  <text x="296" y="400" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">逸出的电子叫光电子</text>
  <text x="296" y="426" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">ν ≥ νc 才有光电子逸出</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">现象与截止频率</text>

  <g class="s116-card">
    <rect x="590" y="156" width="260" height="82" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="720" y="180" font-size="11.5" fill="#1e40af" text-anchor="middle">光照射金属表面，电子逸出</text>
    <text x="720" y="204" font-size="12.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">这种现象叫光电效应</text>
    <text x="720" y="226" font-size="11" fill="#475569" text-anchor="middle">逸出的电子叫光电子</text>
  </g>

  <rect x="590" y="254" width="260" height="86" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="278" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">截止频率 νc</text>
  <text x="610" y="302" font-size="11.5" font-weight="800" fill="#047857">ν ≥ νc：发生光电效应</text>
  <text x="610" y="326" font-size="11.5" font-weight="800" fill="#b91c1c">ν &lt; νc：光再强也不发生</text>

  <text x="720" y="368" font-size="11" fill="#475569" text-anchor="middle">不同金属的截止频率不同</text>
  <text x="720" y="392" font-size="11" fill="#475569" text-anchor="middle">νc 由金属本身决定</text>
  <text x="720" y="420" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">光电效应说明光具有粒子性</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">只有入射光频率不低于截止频率，才会发生光电效应</text>
</g>

<!-- 第二步：遏止电压 -->
<g class="s116-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">遏止电压：使光电流恰好为零的反向电压 eUc = Ekmax</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光电流与电压的关系</text>

  <line x1="110" y1="380" x2="510" y2="380" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="220" y1="380" x2="220" y2="160" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="514" y="384" font-size="12" font-weight="800" fill="#475569">U</text>
  <text x="228" y="156" font-size="12" font-weight="800" fill="#475569">I</text>
  <text x="220" y="398" font-size="11" fill="#64748b" text-anchor="middle">0</text>

  <path class="s116-curve" d="M170 380 C200 380 214 330 238 300 C270 268 320 254 500 252" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path class="s116-curve s116-curve2" d="M170 380 C200 380 214 345 238 325 C270 305 320 298 500 298" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <line x1="170" y1="380" x2="170" y2="250" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="170" y="402" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">−Uc</text>
  <line x1="242" y1="252" x2="504" y2="252" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="424" y="244" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">强光饱和电流</text>
  <line x1="242" y1="298" x2="504" y2="298" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="424" y="314" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">弱光饱和电流</text>

  <text x="296" y="424" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">同一金属 Uc 相同，光强越大饱和电流越大</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">遏止电压与最大初动能</text>

  <g class="s116-card">
    <rect x="590" y="156" width="260" height="68" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="720" y="192" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">eUc = Ekmax</text>
    <text x="720" y="214" font-size="11" fill="#475569" text-anchor="middle">电场力做功恰好抵消最大初动能</text>
  </g>

  <text x="596" y="258" font-size="11.5" fill="#334155">Uc：使光电流为零的反向电压</text>
  <text x="596" y="284" font-size="11.5" fill="#334155">Ekmax：光电子的最大初动能</text>
  <text x="596" y="310" font-size="11.5" fill="#334155">最大初动能随频率增大而增大</text>
  <text x="596" y="336" font-size="11.5" fill="#334155">与入射光强无关</text>

  <rect x="590" y="354" width="260" height="64" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="378" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">频率越高，遏止电压越大</text>
  <text x="720" y="400" font-size="11" fill="#92400e" text-anchor="middle">光电效应几乎是瞬时发生的</text>

  <text x="720" y="430" font-size="11" fill="#64748b" text-anchor="middle">Uc 由频率决定，与光强无关</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">遏止电压 Uc 满足 eUc = Ekmax，它由入射光的频率决定</text>
</g>

<!-- 第三步：爱因斯坦光电方程 -->
<g class="s116-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">爱因斯坦光电方程：Ekmax = hν − W₀，光能一份一份被吸收</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量的分配</text>

  <line class="s116-photon" x1="70" y1="190" x2="500" y2="190" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="180" y="178" font-size="11.5" font-weight="800" fill="#b45309">一个光子的能量 hν</text>

  <g class="s116-bar">
    <rect x="100" y="226" width="400" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="100" y="226" width="160" height="40" rx="8" fill="#f59e0b"/>
    <rect x="260" y="226" width="240" height="40" rx="8" fill="#3b82f6"/>
    <text x="180" y="251" font-size="11.5" font-weight="900" fill="#78350f" text-anchor="middle">逸出功 W₀</text>
    <text x="380" y="251" font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle">最大初动能 Ekmax</text>
  </g>

  <g class="s116-eq">
    <text x="296" y="330" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">hν = W₀ + Ekmax</text>
  </g>

  <text x="296" y="368" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">W₀ = hνc，逸出功由金属本身决定</text>
  <text x="296" y="392" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Ekmax = hν − W₀</text>
  <text x="296" y="416" font-size="11" fill="#64748b" text-anchor="middle">频率越高，光电子最大初动能越大</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">方程与解释</text>

  <g class="s116-card">
    <text x="720" y="188" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">Ekmax = hν − W₀</text>
    <text x="720" y="212" font-size="11" fill="#64748b" text-anchor="middle">爱因斯坦光电效应方程</text>

    <line x1="590" y1="230" x2="834" y2="230" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="596" y="256" font-size="11.5" fill="#334155">hν：一个光子的能量</text>
    <text x="596" y="282" font-size="11.5" fill="#334155">W₀：金属的逸出功</text>
    <text x="596" y="308" font-size="11.5" fill="#334155">Ekmax：光电子的最大初动能</text>
    <text x="596" y="334" font-size="11.5" fill="#334155">νc = W₀ / h：截止频率</text>
  </g>

  <rect x="590" y="352" width="260" height="64" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="720" y="376" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">光的能量量子化</text>
  <text x="720" y="398" font-size="11" fill="#065f46" text-anchor="middle">成功解释全部实验规律</text>

  <text x="720" y="430" font-size="11" fill="#64748b" text-anchor="middle">光强只影响光子数，不影响每个光子的能量</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">爱因斯坦光电方程 Ekmax = hν − W₀，成功解释了光电效应的所有规律</text>
</g>
</svg>
