<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="测量物质的密度：天平测质量，量筒测体积，固体排水法与液体质量差法">
  <style>
    [data-scene="pj-26"] .p26-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
    [data-scene="pj-26"].s1 .p26-step1,
    [data-scene="pj-26"].s2 .p26-step2,
    [data-scene="pj-26"].s3 .p26-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
    @keyframes p26draw{to{stroke-dashoffset:0}}
    @keyframes p26pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p26fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p26pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes p26rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes p26drop{0%{transform:translateY(-10px);opacity:0}25%{opacity:1}100%{transform:translateY(14px);opacity:0}}
    [data-scene="pj-26"].s1 .p26-formula{transform-box:fill-box;transform-origin:center;animation:p26pop .55s ease .15s both}
    [data-scene="pj-26"].s1 .p26-tool{animation:p26fade .5s ease both}
    [data-scene="pj-26"].s1 .p26-t2{animation-delay:.1s}
    [data-scene="pj-26"].s1 .p26-arrow{stroke-dasharray:60;stroke-dashoffset:60;animation:p26draw .6s ease .5s forwards}
    [data-scene="pj-26"].s1 .p26-chip{animation:p26fade .4s ease both}
    [data-scene="pj-26"].s1 .p26-ch2{animation-delay:.06s}
    [data-scene="pj-26"].s1 .p26-ch3{animation-delay:.12s}
    [data-scene="pj-26"].s1 .p26-ch4{animation-delay:.18s}
    [data-scene="pj-26"].s1 .p26-ch5{animation-delay:.24s}
    [data-scene="pj-26"].s1 .p26-ch6{animation-delay:.3s}
    [data-scene="pj-26"].s2 .p26-glass{animation:p26fade .5s ease both}
    [data-scene="pj-26"].s2 .p26-water{transform-box:fill-box;transform-origin:bottom;animation:p26rise .9s ease .2s both}
    [data-scene="pj-26"].s2 .p26-eye{animation:p26pulse 2s ease-in-out infinite}
    [data-scene="pj-26"].s2 .p26-call{animation:p26fade .45s ease both}
    [data-scene="pj-26"].s2 .p26-ca2{animation-delay:.1s}
    [data-scene="pj-26"].s2 .p26-ca3{animation-delay:.2s}
    [data-scene="pj-26"].s2 .p26-ca4{animation-delay:.3s}
    [data-scene="pj-26"].s3 .p26-panel{transform-box:fill-box;transform-origin:center;animation:p26pop .55s ease both}
    [data-scene="pj-26"].s3 .p26-p2{animation-delay:.15s}
    [data-scene="pj-26"].s3 .p26-row{animation:p26fade .4s ease both}
    [data-scene="pj-26"].s3 .p26-r2{animation-delay:.1s}
    [data-scene="pj-26"].s3 .p26-r3{animation-delay:.2s}
    [data-scene="pj-26"].s3 .p26-r4{animation-delay:.3s}
    [data-scene="pj-26"].s3 .p26-stone{animation:p26drop 1.4s ease .8s both}
    [data-scene="pj-26"].s3 .p26-drop{animation:p26drop 1.4s ease 1.1s infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">测量物质的密度：天平测质量，量筒测体积</text>

  <!-- 第一步：实验原理 -->
  <g class="p26-step p26-step1" data-zone="1">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">实验原理：ρ = m / V，先测质量再测体积</text>

    <g class="p26-tool p26-t1">
      <rect x="55" y="120" width="250" height="250" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="180" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">天平：测质量 m</text>
      <rect x="90" y="330" width="180" height="10" rx="5" fill="#64748b"/>
      <rect x="171" y="245" width="10" height="85" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <rect x="108" y="240" width="134" height="6" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1.2"/>
      <line x1="125" y1="246" x2="125" y2="285" stroke="#64748b" stroke-width="1.8"/>
      <ellipse cx="125" cy="290" rx="32" ry="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <line x1="225" y1="246" x2="225" y2="285" stroke="#64748b" stroke-width="1.8"/>
      <ellipse cx="225" cy="290" rx="30" ry="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
      <polygon points="108,288 113,270 130,266 145,278 141,288" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
      <rect x="205" y="272" width="14" height="16" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
      <rect x="223" y="272" width="14" height="16" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
      <text x="180" y="362" font-size="11.5" fill="#64748b" text-anchor="middle">读数 = 砝码总质量 + 游码示数</text>
    </g>

    <g class="p26-tool p26-t2">
      <rect x="595" y="120" width="250" height="250" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="720" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">量筒：测体积 V</text>
      <rect x="680" y="180" width="80" height="150" rx="8" fill="url(#gGlass)" stroke="#38bdf8" stroke-width="3"/>
      <ellipse cx="720" cy="180" rx="40" ry="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <path d="M684 215 L684 322 Q684 328 690 328 L750 328 Q756 328 756 322 L756 215 Z" fill="#bfdbfe" opacity=".8"/>
      <g stroke="#1d4ed8" stroke-width="1.6">
        <line x1="680" y1="200" x2="704" y2="200"/>
        <line x1="680" y1="230" x2="704" y2="230"/>
        <line x1="680" y1="260" x2="704" y2="260"/>
        <line x1="680" y1="290" x2="704" y2="290"/>
        <line x1="680" y1="320" x2="704" y2="320"/>
      </g>
      <text x="712" y="204" font-size="11" fill="#1e40af">50</text>
      <text x="712" y="234" font-size="11" fill="#1e40af">40</text>
      <text x="712" y="264" font-size="11" fill="#1e40af">30</text>
      <text x="712" y="294" font-size="11" fill="#1e40af">20</text>
      <text x="712" y="324" font-size="11" fill="#1e40af">10</text>
      <text x="720" y="362" font-size="11.5" fill="#64748b" text-anchor="middle">1 mL = 1 cm³</text>
    </g>

    <line class="p26-arrow" x1="305" y1="245" x2="348" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="326" y="235" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">m</text>
    <line class="p26-arrow" x1="595" y1="245" x2="552" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="573" y="235" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">V</text>

    <g class="p26-formula">
      <rect x="350" y="145" width="200" height="195" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="178" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">密度公式</text>
      <text x="450" y="238" font-size="30" font-weight="900" fill="#1e3a8a" text-anchor="middle">ρ = m / V</text>
      <text x="450" y="272" font-size="11.5" fill="#64748b" text-anchor="middle">m 用天平测量</text>
      <text x="450" y="294" font-size="11.5" fill="#64748b" text-anchor="middle">V 用量筒测量</text>
      <text x="450" y="320" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">代入公式计算</text>
    </g>

    <g class="p26-chip p26-ch1">
      <rect x="55" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="115" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">天平</text>
    </g>
    <g class="p26-chip p26-ch2">
      <rect x="190" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="250" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">量筒</text>
    </g>
    <g class="p26-chip p26-ch3">
      <rect x="325" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="385" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">水</text>
    </g>
    <g class="p26-chip p26-ch4">
      <rect x="460" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="520" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">细线</text>
    </g>
    <g class="p26-chip p26-ch5">
      <rect x="595" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="655" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">烧杯</text>
    </g>
    <g class="p26-chip p26-ch6">
      <rect x="730" y="400" width="120" height="38" rx="12" fill="#e8effc"/>
      <text x="790" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">被测物体</text>
    </g>

    <text x="450" y="474" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">测量前要看清天平和量筒的量程与分度值</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验器材：天平、量筒、水、细线、烧杯、被测物体</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">测固体先测质量，再排水测体积；测液体用质量差法</text>
    </g>
  </g>

  <!-- 第二步：量筒的使用 -->
  <g class="p26-step p26-step2" data-zone="2">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">量筒：水平放置，平视凹液面最低处</text>

    <g class="p26-glass">
      <rect x="345" y="130" width="110" height="270" rx="10" fill="url(#gGlass)" stroke="#38bdf8" stroke-width="3"/>
      <ellipse cx="400" cy="130" rx="55" ry="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2.5"/>
      <path class="p26-water" d="M348 206 Q400 222 452 206 L452 392 Q452 400 444 400 L356 400 Q348 400 348 392 Z" fill="#bfdbfe" opacity=".8"/>
      <path d="M348 206 Q400 222 452 206" fill="none" stroke="#1d4ed8" stroke-width="2.2"/>
      <g stroke="#1d4ed8" stroke-width="1.8">
        <line x1="425" y1="166" x2="455" y2="166"/>
        <line x1="425" y1="206" x2="455" y2="206"/>
        <line x1="425" y1="246" x2="455" y2="246"/>
        <line x1="425" y1="286" x2="455" y2="286"/>
        <line x1="425" y1="326" x2="455" y2="326"/>
        <line x1="425" y1="366" x2="455" y2="366"/>
      </g>
      <g font-size="11" fill="#1e40af" text-anchor="start">
        <text x="462" y="170">50</text>
        <text x="462" y="210">40</text>
        <text x="462" y="250">30</text>
        <text x="462" y="290">20</text>
        <text x="462" y="330">10</text>
        <text x="462" y="370">0 mL</text>
      </g>
      <text x="520" y="214" font-size="13" font-weight="900" fill="#1e3a8a">40 mL</text>
    </g>

    <g class="p26-eye">
      <path d="M500 178 Q522 160 544 178 Q522 196 500 178 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
      <circle cx="522" cy="178" r="5.5" fill="#1e3a8a"/>
    </g>
    <line x1="510" y1="194" x2="408" y2="220" stroke="#1e3a8a" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="530" y="160" font-size="11.5" font-weight="700" fill="#1e3a8a">平视</text>
    <text x="472" y="270" font-size="11.5" font-weight="700" fill="#1d4ed8">凹液面最低处</text>
    <line x1="474" y1="266" x2="412" y2="222" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>

    <rect x="320" y="405" width="160" height="9" rx="4" fill="#94a3b8"/>
    <text x="400" y="438" font-size="11.5" fill="#475569" text-anchor="middle">放在水平桌面上</text>

    <rect x="585" y="105" width="260" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="138" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">量筒使用要点</text>
    <g class="p26-call p26-ca1">
      <rect x="602" y="158" width="226" height="52" rx="10" fill="#e8effc"/>
      <text x="618" y="180" font-size="11.5" font-weight="800" fill="#1e3a8a">① 放在水平桌面上</text>
      <text x="618" y="199" font-size="11" fill="#475569">读数时量筒不能晃动</text>
    </g>
    <g class="p26-call p26-ca2">
      <rect x="602" y="222" width="226" height="52" rx="10" fill="#e8effc"/>
      <text x="618" y="244" font-size="11.5" font-weight="800" fill="#1e3a8a">② 视线与凹液面最低处相平</text>
      <text x="618" y="263" font-size="11" fill="#475569">仰视偏小，俯视偏大</text>
    </g>
    <g class="p26-call p26-ca3">
      <rect x="602" y="286" width="226" height="52" rx="10" fill="#e8effc"/>
      <text x="618" y="308" font-size="11.5" font-weight="800" fill="#1e3a8a">③ 读数要带单位</text>
      <text x="618" y="327" font-size="11" fill="#475569">1 mL = 1 cm³</text>
    </g>
    <g class="p26-call p26-ca4">
      <rect x="602" y="350" width="226" height="52" rx="10" fill="#fff7ed"/>
      <text x="618" y="372" font-size="11.5" font-weight="800" fill="#b45309">④ 不能测温度过高的液体</text>
      <text x="618" y="391" font-size="11" fill="#7c5a30">防止量筒受热变形、破裂</text>
    </g>

    <text x="450" y="474" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">读数时视线要与液面最低处相平，并把单位写在结果后面</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">量筒读数：先看量程和分度值，再平视凹液面最低处</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">1 mL = 1 cm³；仰视读数偏小，俯视读数偏大</text>
    </g>
  </g>

  <!-- 第三步：测量步骤 -->
  <g class="p26-step p26-step3" data-zone="3">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">测量步骤：固体排水法，液体质量差法</text>

    <g class="p26-panel p26-p1">
      <rect x="50" y="105" width="390" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="245" y="136" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">固体：排水法</text>
      <g class="p26-row p26-r1">
        <text x="70" y="175" font-size="12" font-weight="700" fill="#334155">① 用天平测质量 m</text>
      </g>
      <g class="p26-row p26-r2">
        <text x="70" y="222" font-size="12" font-weight="700" fill="#334155">② 量筒装水，读 V₁</text>
      </g>
      <g class="p26-row p26-r3">
        <text x="70" y="269" font-size="12" font-weight="700" fill="#334155">③ 放入物体，读 V₂</text>
      </g>
      <g class="p26-row p26-r4">
        <text x="70" y="316" font-size="12" font-weight="700" fill="#334155">④ 物体体积 V = V₂ − V₁</text>
      </g>

      <rect x="300" y="164" width="62" height="154" rx="7" fill="url(#gGlass)" stroke="#38bdf8" stroke-width="2.5"/>
      <ellipse cx="331" cy="164" rx="31" ry="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <path d="M303 205 L303 311 Q303 317 309 317 L353 317 Q359 317 359 311 L359 205 Z" fill="#bfdbfe" opacity=".8"/>
      <line x1="303" y1="230" x2="359" y2="230" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5 4"/>
      <line x1="303" y1="200" x2="359" y2="200" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="5 4"/>
      <polygon class="p26-stone" points="316,296 324,276 340,272 348,288 342,302 324,304" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="370" y="234" font-size="11.5" font-weight="800" fill="#1d4ed8">V₁</text>
      <text x="370" y="204" font-size="11.5" font-weight="800" fill="#1d4ed8">V₂</text>

      <rect x="65" y="340" width="360" height="44" rx="12" fill="#e8effc"/>
      <text x="245" y="368" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">ρ = m / (V₂ − V₁)</text>
    </g>

    <g class="p26-panel p26-p2">
      <rect x="460" y="105" width="390" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="655" y="136" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">液体：质量差法</text>
      <g class="p26-row p26-r1">
        <text x="480" y="175" font-size="12" font-weight="700" fill="#334155">① 测烧杯和液体总质量 m₁</text>
      </g>
      <g class="p26-row p26-r2">
        <text x="480" y="222" font-size="12" font-weight="700" fill="#334155">② 倒出部分液体，读体积 V</text>
      </g>
      <g class="p26-row p26-r3">
        <text x="480" y="269" font-size="12" font-weight="700" fill="#334155">③ 测烧杯和剩余液体 m₂</text>
      </g>
      <g class="p26-row p26-r4">
        <text x="480" y="316" font-size="12" font-weight="700" fill="#334155">④ 倒出液体质量 m = m₁ − m₂</text>
      </g>

      <path d="M690 190 L690 300 Q690 310 700 310 L740 310 Q750 310 750 300 L750 190" fill="url(#gGlass)" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M694 230 L694 300 Q694 306 700 306 L740 306 Q746 306 746 300 L746 230 Z" fill="#bae6fd" opacity=".85"/>
      <line x1="690" y1="230" x2="750" y2="230" stroke="#1d4ed8" stroke-width="1.6"/>
      <line x1="756" y1="245" x2="774" y2="245" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
      <rect x="778" y="212" width="42" height="92" rx="6" fill="url(#gGlass)" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M781 244 L781 300 Q781 304 785 304 L813 304 Q817 304 817 300 L817 244 Z" fill="#bae6fd" opacity=".85"/>
      <text x="720" y="330" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">m₁</text>
      <text x="799" y="322" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">V</text>
      <circle class="p26-drop" cx="765" cy="252" r="3" fill="#60a5fa"/>

      <rect x="475" y="340" width="360" height="44" rx="12" fill="#e8effc"/>
      <text x="655" y="368" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">ρ = (m₁ − m₂) / V</text>
    </g>

    <text x="450" y="478" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">固体先测质量再测体积，避免沾水后质量偏大；液体用质量差，减小残留误差</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">顺序不能反：固体先质量后体积；液体先总质量，再倒出测体积，最后测剩余质量</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">量筒中液体倒不干净时，用质量差法可以减小误差</text>
    </g>
  </g>
</svg>
