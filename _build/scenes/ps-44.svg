<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电势能和电势：电场力做功、电势的定义、等势面">
<style>
[data-scene="ps-44"] .s44-step1,[data-scene="ps-44"] .s44-step2,[data-scene="ps-44"] .s44-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-44"].s1 .s44-step1,[data-scene="ps-44"].s2 .s44-step2,[data-scene="ps-44"].s3 .s44-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s44draw{to{stroke-dashoffset:0}}
@keyframes s44pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s44pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s44fade{from{opacity:0}to{opacity:1}}
[data-scene="ps-44"].s1 .s44-fl{stroke-dasharray:120;stroke-dashoffset:120;animation:s44draw .7s ease .2s forwards}
[data-scene="ps-44"].s1 .s44-path{animation:s44fade .8s ease .45s both}
[data-scene="ps-44"].s1 .s44-card{transform-box:fill-box;transform-origin:center;animation:s44pop .5s ease .25s both}
[data-scene="ps-44"].s2 .s44-fl{stroke-dasharray:360;stroke-dashoffset:360;animation:s44draw .9s ease .2s forwards}
[data-scene="ps-44"].s2 .s44-card{transform-box:fill-box;transform-origin:center;animation:s44pop .5s ease .3s both}
[data-scene="ps-44"].s2 .s44-point{animation:s44pulse 1.8s ease-in-out infinite}
[data-scene="ps-44"].s3 .s44-card{transform-box:fill-box;transform-origin:center;animation:s44pop .5s ease .15s both}
[data-scene="ps-44"].s3 .s44-eq{animation:s44fade 1s ease .35s both}
[data-scene="ps-44"].s3 .s44-fl{stroke-dasharray:160;stroke-dashoffset:160;animation:s44draw .8s ease .2s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电势能和电势：电场力做功与能量的描述</text>

<!-- 第一步：电场力做功与电势能 -->
<g class="s44-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 电场力做功与电势能的变化</text>

  <rect x="70" y="118" width="440" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line class="s44-fl" x1="90" y1="150" x2="486" y2="150"/>
    <line class="s44-fl" x1="90" y1="390" x2="486" y2="390"/>
    <line class="s44-fl" x1="90" y1="265" x2="145" y2="265"/>
    <line class="s44-fl" x1="455" y1="265" x2="500" y2="265"/>
  </g>

  <circle cx="170" cy="265" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="170" y="270" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <circle cx="420" cy="265" r="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="420" y="270" font-size="13" font-weight="900" fill="#6d28d9" text-anchor="middle">+</text>
  <text x="170" y="308" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">A</text>
  <text x="420" y="308" font-size="13" font-weight="900" fill="#6d28d9" text-anchor="middle">B</text>

  <line class="s44-path" x1="186" y1="265" x2="404" y2="265" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <text x="322" y="254" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">W_AB &gt; 0</text>

  <line x1="190" y1="238" x2="282" y2="238" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="236" y="224" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F = qE</text>

  <text x="290" y="345" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">电场力做正功，电势能减少</text>
  <text x="290" y="372" font-size="12" fill="#334155" text-anchor="middle">E_pA − E_pB = W_AB &gt; 0</text>

  <g class="s44-card">
    <rect x="530" y="110" width="300" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="680" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场力做功与电势能</text>
    <text x="680" y="190" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">W_AB = E_pA − E_pB</text>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="680" y="224">电场力做正功，电势能减少</text>
      <text x="680" y="250">电场力做负功，电势能增加</text>
    </g>
    <text x="680" y="280" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">ΔE_p = −W_AB</text>
    <line x1="555" y1="298" x2="805" y2="298" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="680" y="326">电势能的变化量</text>
      <text x="680" y="350">等于电场力做功的负值</text>
    </g>
    <g fill="#64748b" font-size="11.5" text-anchor="middle">
      <text x="680" y="380">电势能由电荷和电场共同具有</text>
      <text x="680" y="404">通常说电荷具有电势能</text>
      <text x="680" y="428">零势能点可以任意选取</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场力做功只与初末位置有关，与移动路径无关</text>
</g>

<!-- 第二步：电势 -->
<g class="s44-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 电势：φ = E_p/q，沿电场线降低</text>

  <rect x="70" y="118" width="400" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <line class="s44-fl" x1="100" y1="230" x2="446" y2="230" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <circle class="s44-point" cx="170" cy="230" r="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/>
  <circle class="s44-point" cx="300" cy="230" r="8" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <circle class="s44-point" cx="400" cy="230" r="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="170" y="206" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">φA = 30 V</text>
  <text x="300" y="206" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">φB = 15 V</text>
  <text x="400" y="206" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">φC = 5 V</text>

  <text x="270" y="290" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">沿电场线方向，电势逐渐降低</text>
  <text x="270" y="322" font-size="12" fill="#334155" text-anchor="middle">φ 由电场本身决定</text>
  <text x="270" y="346" font-size="12" fill="#334155" text-anchor="middle">与放入的试探电荷无关</text>
  <text x="270" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">电势高低与零电势点选取有关</text>
  <text x="270" y="404" font-size="11.5" fill="#64748b" text-anchor="middle">常取无穷远处或大地电势为零</text>

  <g class="s44-card">
    <rect x="500" y="110" width="330" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电势 φ</text>
    <text x="665" y="192" font-size="22" font-weight="900" fill="#b45309" text-anchor="middle">φ = E_p/q</text>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="665" y="224">单位：伏特（V）</text>
      <text x="665" y="248">1 V = 1 J/C</text>
    </g>
    <line x1="525" y1="268" x2="805" y2="268" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="665" y="296">标量，有正负</text>
      <text x="665" y="322">沿电场线方向电势降低</text>
      <text x="665" y="348">由电场本身决定</text>
      <text x="665" y="374">与试探电荷无关</text>
    </g>
    <line x1="525" y1="392" x2="805" y2="392" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#64748b" font-size="11.5" text-anchor="middle">
      <text x="665" y="416">高低与零势点选取有关</text>
      <text x="665" y="432">常取无穷远或大地为零</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电势是描述电场能的性质的物理量，沿电场线逐渐降低</text>
</g>

<!-- 第三步：等势面 -->
<g class="s44-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 等势面：与电场线处处垂直</text>

  <g class="s44-card">
    <rect x="70" y="118" width="350" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="86" y="142" font-size="12.5" font-weight="800" fill="#1e3a8a">点电荷的等势面</text>

    <circle class="s44-eq" cx="210" cy="285" r="45" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 5"/>
    <circle class="s44-eq" cx="210" cy="285" r="85" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 5"/>
    <circle class="s44-eq" cx="210" cy="285" r="110" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 5"/>

    <g class="s44-fl" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
      <line x1="235" y1="285" x2="325" y2="285"/>
      <line x1="228" y1="268" x2="298" y2="198"/>
      <line x1="210" y1="260" x2="210" y2="170"/>
      <line x1="192" y1="268" x2="122" y2="198"/>
      <line x1="185" y1="285" x2="95" y2="285"/>
      <line x1="192" y1="302" x2="122" y2="372"/>
      <line x1="210" y1="310" x2="210" y2="395"/>
      <line x1="228" y1="302" x2="298" y2="372"/>
    </g>

    <circle cx="210" cy="285" r="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="210" y="293" font-size="20" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
    <text x="245" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">等势面与电场线处处垂直</text>
  </g>

  <g class="s44-card">
    <rect x="440" y="118" width="390" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="456" y="142" font-size="12.5" font-weight="800" fill="#1e3a8a">匀强电场中的等势面</text>
    <rect x="500" y="190" width="270" height="8" rx="3" fill="#94a3b8"/>
    <rect x="500" y="360" width="270" height="8" rx="3" fill="#94a3b8"/>
    <g class="s44-fl" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
      <line x1="540" y1="204" x2="540" y2="346"/>
      <line x1="590" y1="204" x2="590" y2="346"/>
      <line x1="640" y1="204" x2="640" y2="346"/>
      <line x1="690" y1="204" x2="690" y2="346"/>
      <line x1="740" y1="204" x2="740" y2="346"/>
    </g>
    <g class="s44-eq" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 5">
      <line x1="500" y1="225" x2="770" y2="225"/>
      <line x1="500" y1="270" x2="770" y2="270"/>
      <line x1="500" y1="315" x2="770" y2="315"/>
    </g>
    <text x="780" y="229" font-size="11.5" fill="#6d28d9">φ1</text>
    <text x="780" y="274" font-size="11.5" fill="#6d28d9">φ2</text>
    <text x="780" y="319" font-size="11.5" fill="#6d28d9">φ3</text>
    <text x="635" y="404" font-size="11.5" fill="#64748b" text-anchor="middle">相邻等势面间距相等，为匀强电场</text>
  </g>

  <rect x="70" y="440" width="760" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="464" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">在同一等势面上移动电荷，电场力不做功</text>
  <text x="450" y="488" font-size="11.5" fill="#1e3a8a" text-anchor="middle">等势面越密的地方电场越强，与电场线的疏密一致</text>
</g>
</svg>
