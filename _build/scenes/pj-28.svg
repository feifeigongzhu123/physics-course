<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="力：物体对物体的作用，力的三要素与力的示意图">
  <style>
    [data-scene="pj-28"] .p28-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
    [data-scene="pj-28"].s1 .p28-step1,
    [data-scene="pj-28"].s2 .p28-step2,
    [data-scene="pj-28"].s3 .p28-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
    @keyframes p28draw{to{stroke-dashoffset:0}}
    @keyframes p28pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p28fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p28pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes p28dash{to{stroke-dashoffset:-30}}
    @keyframes p28stretch{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.18)}}
    [data-scene="pj-28"].s1 .p28-block{transform-box:fill-box;transform-origin:center;animation:p28pop .5s ease both}
    [data-scene="pj-28"].s1 .p28-blockB{animation-delay:.15s}
    [data-scene="pj-28"].s1 .p28-force{stroke-dasharray:70;stroke-dashoffset:70;animation:p28draw .6s ease .45s forwards}
    [data-scene="pj-28"].s1 .p28-forceB{animation-delay:.7s}
    [data-scene="pj-28"].s1 .p28-cardR{animation:p28fade .5s ease .2s both}
    [data-scene="pj-28"].s2 .p28-panel{transform-box:fill-box;transform-origin:center;animation:p28pop .55s ease both}
    [data-scene="pj-28"].s2 .p28-p2{animation-delay:.12s}
    [data-scene="pj-28"].s2 .p28-p3{animation-delay:.24s}
    [data-scene="pj-28"].s2 .p28-arrowPulse{animation:p28pulse 1.8s ease-in-out infinite}
    [data-scene="pj-28"].s2 .p28-effect{animation:p28fade .45s ease both}
    [data-scene="pj-28"].s2 .p28-eff2{animation-delay:.15s}
    [data-scene="pj-28"].s2 .p28-ball{animation:p28stretch 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    [data-scene="pj-28"].s3 .p28-obj{animation:p28fade .45s ease both}
    [data-scene="pj-28"].s3 .p28-forceArrow{stroke-dasharray:200;stroke-dashoffset:200;animation:p28draw .7s ease forwards}
    [data-scene="pj-28"].s3 .p28-fN{animation-delay:.2s}
    [data-scene="pj-28"].s3 .p28-fG{animation-delay:.45s}
    [data-scene="pj-28"].s3 .p28-fF{animation-delay:.7s}
    [data-scene="pj-28"].s3 .p28-note{animation:p28fade .45s ease .9s both}
    [data-scene="pj-28"].s3 .p28-flow{stroke-dasharray:8 6;animation:p28dash 1.3s linear infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">力：物体对物体的作用</text>

  <!-- 第一步：力的概念 -->
  <g class="p28-step p28-step1" data-zone="1">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">力不能离开物体单独存在，物体间力的作用是相互的</text>

    <rect x="50" y="105" width="500" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="300" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">A 推 B 时，B 也推 A</text>

    <g class="p28-block p28-blockA">
      <rect x="210" y="240" width="90" height="90" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
      <text x="255" y="298" font-size="27" font-weight="900" fill="#1e3a8a" text-anchor="middle">A</text>
    </g>
    <g class="p28-block p28-blockB">
      <rect x="340" y="240" width="90" height="90" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
      <text x="385" y="298" font-size="27" font-weight="900" fill="#92400e" text-anchor="middle">B</text>
    </g>

    <line class="p28-force p28-forceA" x1="300" y1="273" x2="338" y2="273" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <text x="320" y="260" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">F₁</text>
    <line class="p28-force p28-forceB" x1="340" y1="307" x2="302" y2="307" stroke="#b45309" stroke-width="4" stroke-linecap="round" marker-end="url(#arrAmber)"/>
    <text x="320" y="328" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">F₂</text>

    <text x="300" y="196" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">A 对 B 的力 F₁ 与 B 对 A 的力 F₂</text>
    <text x="300" y="372" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">两个力同时存在，方向相反</text>
    <rect x="190" y="392" width="220" height="34" rx="17" fill="#e8effc"/>
    <text x="300" y="414" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">施力物体同时是受力物体</text>
    <text x="300" y="440" font-size="11.5" fill="#64748b" text-anchor="middle">力不能离开物体单独存在</text>

    <g class="p28-cardR">
      <rect x="570" y="105" width="270" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="705" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">力的基本认识</text>
      <g>
        <rect x="588" y="158" width="234" height="54" rx="10" fill="#e8effc"/>
        <text x="705" y="182" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">力是物体对物体的作用</text>
        <text x="705" y="201" font-size="11" fill="#475569" text-anchor="middle">一个力涉及两个物体</text>
      </g>
      <g>
        <rect x="588" y="220" width="234" height="54" rx="10" fill="#e8effc"/>
        <text x="705" y="244" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">力不能离开物体单独存在</text>
        <text x="705" y="263" font-size="11" fill="#475569" text-anchor="middle">有受力物体必有施力物体</text>
      </g>
      <g>
        <rect x="588" y="282" width="234" height="54" rx="10" fill="#e8effc"/>
        <text x="705" y="306" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">单位：牛顿，符号 N</text>
        <text x="705" y="325" font-size="11" fill="#475569" text-anchor="middle">1 N 的力大约有多大</text>
      </g>
      <g>
        <rect x="588" y="344" width="234" height="54" rx="10" fill="#fff7ed"/>
        <text x="705" y="368" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">托起两个鸡蛋约 1 N</text>
        <text x="705" y="387" font-size="11" fill="#7c5a30" text-anchor="middle">质量约 100 g</text>
      </g>
      <text x="705" y="428" font-size="11.5" fill="#64748b" text-anchor="middle">力的三要素：大小、方向、作用点</text>
    </g>

    <text x="450" y="478" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">一个物体既是施力物体，也是受力物体</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">力是物体对物体的作用；力不能脱离物体存在</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">物体间力的作用是相互的；单位是牛顿（N）</text>
    </g>
  </g>

  <!-- 第二步：力的三要素 -->
  <g class="p28-step p28-step2" data-zone="2">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">力的三要素：大小、方向、作用点</text>

    <g class="p28-panel p28-p1">
      <rect x="50" y="105" width="270" height="215" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="185" y="139" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 大小</text>
      <rect x="140" y="178" width="70" height="38" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
      <line class="p28-arrowPulse" x1="92" y1="197" x2="134" y2="197" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
      <text x="100" y="187" font-size="11" fill="#b91c1c" text-anchor="middle">力小</text>
      <rect x="140" y="238" width="70" height="38" rx="5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
      <line class="p28-arrowPulse" x1="72" y1="257" x2="134" y2="257" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
      <text x="96" y="247" font-size="11" fill="#b91c1c" text-anchor="middle">力大</text>
      <text x="185" y="303" font-size="11.5" fill="#64748b" text-anchor="middle">力越大，作用效果越明显</text>
    </g>

    <g class="p28-panel p28-p2">
      <rect x="330" y="105" width="270" height="215" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="465" y="139" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 方向</text>
      <rect x="425" y="200" width="80" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <line class="p28-arrowPulse" x1="465" y1="230" x2="398" y2="230" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
      <line class="p28-arrowPulse" x1="465" y1="230" x2="532" y2="230" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
      <text x="400" y="214" font-size="11" font-weight="700" fill="#1e40af">向左</text>
      <text x="512" y="214" font-size="11" font-weight="700" fill="#b91c1c">向右</text>
      <text x="465" y="303" font-size="11.5" fill="#64748b" text-anchor="middle">方向不同，作用效果不同</text>
    </g>

    <g class="p28-panel p28-p3">
      <rect x="610" y="105" width="270" height="215" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="745" y="139" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 作用点</text>
      <rect x="690" y="172" width="110" height="110" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="690" cy="227" r="5" fill="#475569"/>
      <line class="p28-arrowPulse" x1="700" y1="200" x2="742" y2="200" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
      <text x="700" y="190" font-size="11" font-weight="700" fill="#b91c1c">A 靠近铰链</text>
      <line class="p28-arrowPulse" x1="700" y1="262" x2="780" y2="262" stroke="#059669" stroke-width="4" marker-end="url(#arrGreen)"/>
      <text x="700" y="284" font-size="11" font-weight="700" fill="#047857">B 远离铰链</text>
      <text x="745" y="307" font-size="11.5" fill="#64748b" text-anchor="middle">作用点不同，转动效果不同</text>
    </g>

    <g class="p28-effect p28-eff1">
      <rect x="50" y="335" width="390" height="85" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="70" y="366" font-size="13" font-weight="800" fill="#1e3a8a">效果一：改变物体的形状</text>
      <text x="70" y="392" font-size="11.5" fill="#64748b">力使物体发生形变，如压弯、拉伸</text>
      <ellipse class="p28-ball" cx="380" cy="377" rx="22" ry="14" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
    </g>
    <g class="p28-effect p28-eff2">
      <rect x="460" y="335" width="390" height="85" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="480" y="366" font-size="13" font-weight="800" fill="#1e3a8a">效果二：改变物体的运动状态</text>
      <text x="480" y="392" font-size="11.5" fill="#64748b">速度大小改变或运动方向改变</text>
      <circle cx="760" cy="377" r="12" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
      <line class="p28-flow" x1="780" y1="377" x2="822" y2="377" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    </g>

    <text x="450" y="448" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">运动状态改变包括：速度大小改变、运动方向改变</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">力的三要素都会影响力的作用效果</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">运动状态不变：静止或匀速直线运动；任一改变都叫运动状态改变</text>
    </g>
  </g>

  <!-- 第三步：力的示意图 -->
  <g class="p28-step p28-step3" data-zone="3">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">力的示意图：一条带箭头的线段</text>

    <g class="p28-obj">
      <rect x="50" y="105" width="520" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="310" y="135" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">受力示意图</text>

      <line x1="100" y1="180" x2="240" y2="180" stroke="#059669" stroke-width="4" stroke-linecap="round" marker-end="url(#arrGreen)"/>
      <text x="170" y="166" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">F = 10 N</text>
      <line x1="100" y1="192" x2="240" y2="192" stroke="#94a3b8" stroke-width="1.4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
      <text x="170" y="210" font-size="11" fill="#64748b" text-anchor="middle">线段长短表示力的大小</text>

      <line x1="80" y1="390" x2="540" y2="390" stroke="#94a3b8" stroke-width="2.5"/>
      <rect x="240" y="310" width="120" height="80" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <circle cx="300" cy="350" r="5" fill="#1e3a8a"/>

      <line class="p28-forceArrow p28-fN" x1="300" y1="350" x2="300" y2="255" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrBlue)"/>
      <text x="316" y="272" font-size="13" font-weight="800" fill="#1e40af">N</text>
      <line class="p28-forceArrow p28-fG" x1="300" y1="350" x2="300" y2="445" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
      <text x="316" y="438" font-size="13" font-weight="800" fill="#b91c1c">G</text>
      <line class="p28-forceArrow p28-fF" x1="300" y1="350" x2="430" y2="350" stroke="#059669" stroke-width="4" stroke-linecap="round" marker-end="url(#arrGreen)"/>
      <text x="404" y="336" font-size="13" font-weight="800" fill="#047857">F</text>

      <text x="235" y="334" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="end">作用点 O</text>
      <line x1="242" y1="336" x2="294" y2="348" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="448" y="316" font-size="11.5" font-weight="700" fill="#047857">箭头 → 方向</text>
      <line x1="446" y1="322" x2="428" y2="346" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="450" y="402" font-size="11.5" fill="#64748b">线段越长，力越大</text>
    </g>

    <rect x="590" y="105" width="250" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="138" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">画图四步</text>
    <g>
      <rect x="606" y="158" width="218" height="46" rx="10" fill="#e8effc"/>
      <text x="622" y="186" font-size="12" font-weight="800" fill="#1e3a8a">① 确定作用点</text>
    </g>
    <g>
      <rect x="606" y="214" width="218" height="46" rx="10" fill="#e8effc"/>
      <text x="622" y="242" font-size="12" font-weight="800" fill="#1e3a8a">② 沿力的方向画线段</text>
    </g>
    <g>
      <rect x="606" y="270" width="218" height="46" rx="10" fill="#e8effc"/>
      <text x="622" y="298" font-size="12" font-weight="800" fill="#1e3a8a">③ 线段末端画箭头</text>
    </g>
    <g>
      <rect x="606" y="326" width="218" height="46" rx="10" fill="#e8effc"/>
      <text x="622" y="354" font-size="12" font-weight="800" fill="#1e3a8a">④ 标出力的大小和符号</text>
    </g>
    <text x="715" y="404" font-size="11.5" fill="#64748b" text-anchor="middle">同一图中，线段越长，力越大</text>
    <text x="715" y="428" font-size="11.5" fill="#64748b" text-anchor="middle">作用点画在受力物体上</text>

    <g class="p28-note">
      <text x="450" y="478" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">力的示意图 = 作用点 + 方向（箭头）+ 大小（线段长短或标值）</text>
    </g>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">规范：箭头画在线段末端，标度要统一，重力作用点画在重心</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">先找作用点，再定方向，最后按大小画线段并标符号</text>
    </g>
  </g>
</svg>
