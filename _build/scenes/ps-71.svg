<svg class="s71-root" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验：用单摆测量重力加速度，摆长测量、多次全振动计时与T方L图像">
<style>
[data-scene="ps-71"] .s71-s1,[data-scene="ps-71"] .s71-s2,[data-scene="ps-71"] .s71-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-71"].s1 .s71-s1,[data-scene="ps-71"].s2 .s71-s2,[data-scene="ps-71"].s3 .s71-s3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s71fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s71pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s71draw{to{stroke-dashoffset:0}}
@keyframes s71swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes s71pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s71hand{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
[data-scene="ps-71"].s1 .s71-dim{stroke-dasharray:190;stroke-dashoffset:190;animation:s71draw .9s ease .3s forwards}
[data-scene="ps-71"].s1 .s71-dim2{stroke-dasharray:40;stroke-dashoffset:40;animation:s71draw .5s ease .8s forwards}
[data-scene="ps-71"].s1 .s71-box{transform-box:fill-box;transform-origin:center;animation:s71pop .5s ease .2s both}
[data-scene="ps-71"].s2 .s71-pend{transform-box:view-box;transform-origin:180px 180px;animation:s71swing 3s ease-in-out infinite}
[data-scene="ps-71"].s2 .s71-watch{transform-box:view-box;transform-origin:430px 260px;animation:s71pulse 1.6s ease-in-out infinite}
[data-scene="ps-71"].s2 .s71-hand{transform-box:view-box;transform-origin:430px 260px;animation:s71hand 2.4s ease-in-out infinite}
[data-scene="ps-71"].s2 .s71-item{animation:s71fade .5s ease both}
[data-scene="ps-71"].s2 .s71-i2{animation-delay:.1s}
[data-scene="ps-71"].s2 .s71-i3{animation-delay:.2s}
[data-scene="ps-71"].s2 .s71-i4{animation-delay:.3s}
[data-scene="ps-71"].s3 .s71-line{stroke-dasharray:420;stroke-dashoffset:420;animation:s71draw 1.2s ease .25s forwards}
[data-scene="ps-71"].s3 .s71-pt{transform-box:fill-box;transform-origin:center;animation:s71pop .4s ease both}
[data-scene="ps-71"].s3 .s71-p2{animation-delay:.1s}
[data-scene="ps-71"].s3 .s71-p3{animation-delay:.2s}
[data-scene="ps-71"].s3 .s71-p4{animation-delay:.3s}
[data-scene="ps-71"].s3 .s71-p5{animation-delay:.4s}
[data-scene="ps-71"].s3 .s71-tri{animation:s71fade .5s ease .8s both}
[data-scene="ps-71"].s3 .s71-row{animation:s71fade .45s ease both}
[data-scene="ps-71"].s3 .s71-r2{animation-delay:.1s}
[data-scene="ps-71"].s3 .s71-r3{animation-delay:.2s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：用单摆测量重力加速度</text>

<!-- 第一步：实验原理 -->
<g class="s71-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">实验原理：测出摆长 L 和周期 T，代入周期公式求 g</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">摆长的测量</text>

  <line x1="120" y1="144" x2="420" y2="144" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="140" y1="144" x2="128" y2="156"/>
    <line x1="180" y1="144" x2="168" y2="156"/>
    <line x1="220" y1="144" x2="208" y2="156"/>
    <line x1="260" y1="144" x2="248" y2="156"/>
    <line x1="300" y1="144" x2="288" y2="156"/>
    <line x1="340" y1="144" x2="328" y2="156"/>
    <line x1="380" y1="144" x2="368" y2="156"/>
  </g>
  <circle cx="260" cy="144" r="5" fill="#334155"/>

  <line x1="260" y1="144" x2="260" y2="334" stroke="#475569" stroke-width="2.5"/>
  <circle cx="260" cy="350" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="254" cy="344" r="4" fill="#fde68a"/>

  <g class="s71-dim" stroke="#1d4ed8" stroke-width="1.6">
    <line x1="208" y1="144" x2="208" y2="334"/>
    <line x1="202" y1="144" x2="214" y2="144"/>
    <line x1="202" y1="334" x2="214" y2="334"/>
  </g>
  <text x="196" y="246" font-size="12.5" font-weight="900" fill="#1e40af" text-anchor="end">l</text>

  <g class="s71-dim2" stroke="#dc2626" stroke-width="1.6">
    <line x1="310" y1="334" x2="310" y2="350"/>
    <line x1="304" y1="334" x2="316" y2="334"/>
    <line x1="304" y1="350" x2="316" y2="350"/>
  </g>
  <text x="322" y="348" font-size="11.5" font-weight="800" fill="#b91c1c">r</text>

  <text x="386" y="244" font-size="13" font-weight="900" fill="#1e3a8a">L = l + r</text>
  <text x="386" y="268" font-size="11.5" fill="#64748b">悬点到球心</text>

  <rect class="s71-box" x="56" y="370" width="480" height="52" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="296" y="404" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">摆长一定要量到摆球球心</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">测量原理</text>

  <rect class="s71-box" x="596" y="150" width="248" height="66" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="720" y="192" font-size="18" font-weight="900" fill="#6d28d9" text-anchor="middle">g = 4π²L / T²</text>

  <text x="606" y="246" font-size="12" fill="#334155">• 由 T = 2π√(L/g) 平方变形</text>
  <text x="606" y="276" font-size="12" fill="#334155">• 只需测出摆长 L 和周期 T</text>
  <text x="606" y="306" font-size="12" fill="#334155">• L 等于悬线长加摆球半径</text>
  <text x="606" y="336" font-size="12" fill="#334155">• L 用 m，T 用 s，g 用 m/s²</text>

  <rect x="596" y="354" width="248" height="62" rx="11" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="378" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">最容易出错的地方</text>
  <text x="720" y="400" font-size="11.5" fill="#92400e" text-anchor="middle">摆长漏掉球半径，g 会偏小</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验的核心：把测 g 转化为测摆长 L 和周期 T 两个量</text>
</g>

<!-- 第二步：实验操作 -->
<g class="s71-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">实验操作：长约 1 m 的细线，小摆角，测多次全振动的时间</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">实验装置</text>

  <rect x="70" y="410" width="180" height="12" rx="4" fill="#94a3b8"/>
  <rect x="80" y="140" width="12" height="274" fill="#cbd5e1"/>
  <rect x="92" y="170" width="100" height="10" rx="3" fill="#64748b"/>
  <circle cx="180" cy="180" r="4" fill="#334155"/>

  <g class="s71-pend">
    <line x1="180" y1="180" x2="180" y2="360" stroke="#475569" stroke-width="2.5"/>
    <circle cx="180" cy="376" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  </g>

  <rect x="236" y="196" width="30" height="220" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <g stroke="#92400e" stroke-width="1.2">
    <line x1="236" y1="216" x2="256" y2="216"/>
    <line x1="236" y1="236" x2="250" y2="236"/>
    <line x1="236" y1="256" x2="256" y2="256"/>
    <line x1="236" y1="276" x2="250" y2="276"/>
    <line x1="236" y1="296" x2="256" y2="296"/>
    <line x1="236" y1="316" x2="250" y2="316"/>
    <line x1="236" y1="336" x2="256" y2="336"/>
    <line x1="236" y1="356" x2="250" y2="356"/>
    <line x1="236" y1="376" x2="256" y2="376"/>
    <line x1="236" y1="396" x2="250" y2="396"/>
  </g>
  <text x="251" y="430" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">米尺</text>
  <text x="180" y="430" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">铁架台</text>

  <g class="s71-watch">
    <circle cx="430" cy="260" r="42" fill="#e8effc" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="430" cy="260" r="34" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <line class="s71-hand" x1="430" y1="260" x2="430" y2="232" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <circle cx="430" cy="260" r="3" fill="#1e3a8a"/>
  </g>
  <text x="430" y="326" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">停表</text>
  <text x="430" y="208" font-size="11.5" fill="#64748b" text-anchor="middle">测总时间 t</text>

  <rect x="336" y="348" width="188" height="54" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="430" y="372" font-size="13" font-weight="900" fill="#166534" text-anchor="middle">T = t / n</text>
  <text x="430" y="392" font-size="11" fill="#166534" text-anchor="middle">n 为全振动次数</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">操作要点</text>

  <g class="s71-item">
    <circle cx="606" cy="172" r="11" fill="#dbeafe"/>
    <text x="606" y="176" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="628" y="176" font-size="12" font-weight="700" fill="#334155">细线长约 1 m，选密度大的金属球</text>
  </g>
  <g class="s71-item s71-i2">
    <circle cx="606" cy="218" r="11" fill="#dbeafe"/>
    <text x="606" y="222" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="628" y="222" font-size="12" font-weight="700" fill="#334155">摆角小于 5°，在同一竖直平面内</text>
  </g>
  <g class="s71-item s71-i3">
    <circle cx="606" cy="264" r="11" fill="#dbeafe"/>
    <text x="606" y="268" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="628" y="268" font-size="12" font-weight="700" fill="#334155">从最低点开始计时和停止计时</text>
  </g>
  <g class="s71-item s71-i4">
    <circle cx="606" cy="310" r="11" fill="#dbeafe"/>
    <text x="606" y="314" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
    <text x="628" y="314" font-size="12" font-weight="700" fill="#334155">测 30～50 次全振动的总时间 t</text>
  </g>

  <rect x="596" y="334" width="248" height="82" rx="11" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="358" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">为什么在最低点计时</text>
  <text x="720" y="380" font-size="11.5" fill="#92400e" text-anchor="middle">最低点速度最大，位置变化快</text>
  <text x="720" y="400" font-size="11.5" fill="#92400e" text-anchor="middle">计时起止的误差最小</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">摆线要长、摆球要重、摆角要小、不能做圆锥摆，这样测得才准确</text>
</g>

<!-- 第三步：数据处理与误差 -->
<g class="s71-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">数据处理：作 T²–L 图像，用斜率求重力加速度</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">T²–L 图像是一条过原点的直线</text>

  <line x1="110" y1="380" x2="504" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="380" x2="110" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="510" y="386" font-size="12" fill="#64748b">L</text>
  <text x="94" y="160" font-size="12" fill="#64748b">T²</text>
  <text x="96" y="398" font-size="11" fill="#94a3b8">O</text>

  <line class="s71-line" x1="110" y1="380" x2="450" y2="180" stroke="#1d4ed8" stroke-width="3.2"/>
  <circle class="s71-pt" cx="170" cy="345" r="5" fill="#1d4ed8"/>
  <circle class="s71-pt s71-p2" cx="230" cy="310" r="5" fill="#1d4ed8"/>
  <circle class="s71-pt s71-p3" cx="290" cy="274" r="5" fill="#1d4ed8"/>
  <circle class="s71-pt s71-p4" cx="350" cy="239" r="5" fill="#1d4ed8"/>
  <circle class="s71-pt s71-p5" cx="410" cy="204" r="5" fill="#1d4ed8"/>

  <g class="s71-tri" stroke="#dc2626" stroke-width="1.8" fill="none">
    <line x1="300" y1="268" x2="400" y2="268"/>
    <line x1="400" y1="268" x2="400" y2="209"/>
    <line x1="300" y1="268" x2="400" y2="209" stroke-dasharray="4 4"/>
  </g>
  <text x="350" y="286" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">ΔL</text>
  <text x="408" y="242" font-size="11.5" font-weight="800" fill="#b91c1c">ΔT²</text>

  <text x="296" y="330" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">斜率 k = ΔT² / ΔL = 4π² / g</text>
  <text x="296" y="360" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">所以 g = 4π² / k</text>
  <text x="296" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">直线过原点，说明 T² 与 L 成正比</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">记录与处理数据</text>

  <rect x="596" y="146" width="248" height="30" rx="6" fill="#e8effc"/>
  <text x="636" y="166" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">L / m</text>
  <text x="712" y="166" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">T / s</text>
  <text x="790" y="166" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">T² / s²</text>

  <g class="s71-row">
    <line x1="596" y1="188" x2="844" y2="188" stroke="#e5e7ef"/>
    <text x="636" y="206" font-size="11.5" fill="#334155" text-anchor="middle">0.40</text>
    <text x="712" y="206" font-size="11.5" fill="#334155" text-anchor="middle">1.27</text>
    <text x="790" y="206" font-size="11.5" fill="#334155" text-anchor="middle">1.61</text>
  </g>
  <g class="s71-row s71-r2">
    <line x1="596" y1="218" x2="844" y2="218" stroke="#e5e7ef"/>
    <text x="636" y="236" font-size="11.5" fill="#334155" text-anchor="middle">0.60</text>
    <text x="712" y="236" font-size="11.5" fill="#334155" text-anchor="middle">1.55</text>
    <text x="790" y="236" font-size="11.5" fill="#334155" text-anchor="middle">2.41</text>
  </g>
  <g class="s71-row s71-r3">
    <line x1="596" y1="248" x2="844" y2="248" stroke="#e5e7ef"/>
    <text x="636" y="266" font-size="11.5" fill="#334155" text-anchor="middle">0.80</text>
    <text x="712" y="266" font-size="11.5" fill="#334155" text-anchor="middle">1.79</text>
    <text x="790" y="266" font-size="11.5" fill="#334155" text-anchor="middle">3.21</text>
  </g>

  <text x="606" y="300" font-size="11.5" fill="#334155">• 多次改变摆长，多测几组数据</text>
  <text x="606" y="326" font-size="11.5" fill="#334155">• 用图像斜率求 g，不用逐组计算</text>
  <text x="606" y="352" font-size="11.5" fill="#334155">• 图像法可以减小偶然误差</text>
  <rect x="596" y="370" width="248" height="48" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="720" y="400" font-size="14" font-weight="900" fill="#6d28d9" text-anchor="middle">g = 4π² / k</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">用 T²–L 图像的斜率求 g，比逐组代入计算更可靠，误差更小</text>
</g>
</svg>
