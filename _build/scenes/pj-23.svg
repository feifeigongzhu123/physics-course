<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="显微镜和望远镜：显微镜两次放大、望远镜视角放大及两者区别">
<style>
[data-scene="pj-23"] .p23-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="pj-23"].s1 .p23-step1,
[data-scene="pj-23"].s2 .p23-step2,
[data-scene="pj-23"].s3 .p23-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes p23draw{to{stroke-dashoffset:0}}
@keyframes p23pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.07);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p23pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
@keyframes p23fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[data-scene="pj-23"].s1 .p23-objRay{stroke-dasharray:420;stroke-dashoffset:420;animation:p23draw 1s ease .15s forwards}
[data-scene="pj-23"].s1 .p23-mid{transform-box:fill-box;transform-origin:top center;animation:p23pop .5s ease 1.1s both}
[data-scene="pj-23"].s1 .p23-eyeRay{stroke-dasharray:340;stroke-dashoffset:340;animation:p23draw 1s ease 1.35s forwards}
[data-scene="pj-23"].s1 .p23-final{transform-box:fill-box;transform-origin:top center;animation:p23pop .6s ease 2.15s both}
[data-scene="pj-23"].s1 .p23-back{stroke-dasharray:450;stroke-dashoffset:450;animation:p23draw 1s ease 2.35s forwards}
[data-scene="pj-23"].s2 .p23-ray{stroke-dasharray:560;stroke-dashoffset:560;animation:p23draw 1.2s ease .15s forwards}
[data-scene="pj-23"].s2 .p23-angle{stroke-dasharray:140;stroke-dashoffset:140;animation:p23draw .8s ease 1.1s forwards}
[data-scene="pj-23"].s2 .p23-card{transform-box:fill-box;transform-origin:center;animation:p23pop .55s ease .5s both}
[data-scene="pj-23"].s2 .p23-card2{animation-delay:.65s}
[data-scene="pj-23"].s3 .p23-panel{transform-box:fill-box;transform-origin:center;animation:p23pop .55s ease both}
[data-scene="pj-23"].s3 .p23-panel2{animation-delay:.12s}
[data-scene="pj-23"].s3 .p23-row{animation:p23fade .4s ease both}
[data-scene="pj-23"].s3 .p23-row:nth-of-type(2){animation-delay:.18s}
[data-scene="pj-23"].s3 .p23-row:nth-of-type(3){animation-delay:.26s}
[data-scene="pj-23"].s3 .p23-spot{animation:p23pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">显微镜和望远镜：两次放大与视角放大</text>

<!-- 第一步：显微镜两次放大 -->
<g class="p23-step p23-step1" data-zone="1">
  <line x1="70" y1="330" x2="840" y2="330" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="10 7"/>

  <line x1="355" y1="330" x2="355" y2="310" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <polygon points="348,315 362,315 355,303" fill="#dc2626"/>
  <text x="355" y="354" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">微小物体</text>

  <rect x="404" y="262" width="32" height="70" rx="4" fill="#475569"/>
  <ellipse cx="420" cy="330" rx="9" ry="42" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3"/>
  <text x="420" y="248" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">物镜（f 短）</text>

  <g class="p23-objRay" fill="none" stroke-width="3">
    <polyline points="355,310 420,310 540,354" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <polyline points="355,310 420,330 540,354" stroke="#d97706" marker-end="url(#arrAmber)"/>
  </g>

  <g class="p23-mid">
    <line x1="540" y1="330" x2="540" y2="354" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrBlue)"/>
    <text x="540" y="382" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">第一次放大：实像</text>
  </g>
  <text x="480" y="292" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">第一次放大</text>

  <rect x="624" y="228" width="32" height="62" rx="4" fill="#334155"/>
  <ellipse cx="640" cy="330" rx="10" ry="50" fill="url(#gGlass)" stroke="#047857" stroke-width="3"/>
  <text x="640" y="214" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">目镜</text>

  <g class="p23-eyeRay" fill="none" stroke="#047857" stroke-width="2.8">
    <polyline points="540,354 640,310 770,290" marker-end="url(#arrGreen)"/>
    <polyline points="540,354 640,350 770,350" marker-end="url(#arrGreen)"/>
  </g>

  <g class="p23-final">
    <line x1="245" y1="330" x2="245" y2="410" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrBlue)"/>
    <text x="245" y="434" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">第二次放大：虚像</text>
  </g>
  <text x="700" y="292" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">第二次放大</text>

  <g class="p23-back" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7 6" opacity=".55">
    <line x1="640" y1="310" x2="245" y2="410"/>
    <line x1="640" y1="350" x2="245" y2="410"/>
  </g>

  <g>
    <path d="M760 330 Q785 312 810 330 Q785 348 760 330 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <circle cx="785" cy="330" r="8" fill="#334155"/>
    <text x="785" y="364" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">眼睛</text>
  </g>

  <rect x="270" y="452" width="360" height="38" rx="12" fill="#e8effc"/>
  <text x="450" y="477" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">放大倍数 = 物镜倍数 × 目镜倍数</text>
</g>

<!-- 第二步：望远镜视角放大 -->
<g class="p23-step p23-step2" data-zone="2">
  <g>
    <rect x="78" y="210" width="34" height="55" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <polygon points="72,210 95,188 118,210" fill="#64748b"/>
    <rect x="88" y="224" width="10" height="12" fill="#e2e8f0"/>
    <rect x="88" y="244" width="10" height="12" fill="#e2e8f0"/>
    <text x="95" y="292" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">远处物体</text>
  </g>

  <rect x="292" y="200" width="266" height="100" rx="12" fill="none" stroke="#334155" stroke-width="2"/>
  <ellipse cx="300" cy="250" rx="8" ry="50" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3"/>
  <ellipse cx="550" cy="250" rx="8" ry="40" fill="url(#gGlass)" stroke="#047857" stroke-width="3"/>
  <line x1="430" y1="215" x2="430" y2="285" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="430" y="205" font-size="11" fill="#64748b" text-anchor="middle">焦平面</text>
  <text x="300" y="186" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">物镜（f 长）</text>
  <text x="550" y="186" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">目镜（f 短）</text>

  <g class="p23-ray" fill="none" stroke="#dc2626" stroke-width="2.8">
    <polyline points="115,220 300,220 430,250 550,230 735,220" marker-end="url(#arrRed)"/>
    <polyline points="115,250 300,250 430,250 550,250 735,250" marker-end="url(#arrRed)"/>
    <polyline points="115,280 300,280 430,250 550,270 735,280" marker-end="url(#arrRed)"/>
  </g>

  <g>
    <path d="M735 250 Q760 232 785 250 Q760 268 735 250 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <circle cx="760" cy="250" r="8" fill="#334155"/>
    <text x="760" y="284" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">眼睛</text>
  </g>

  <g class="p23-card">
    <rect x="55" y="315" width="380" height="160" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="245" y="342" font-size="12.5" font-weight="800" fill="#64748b" text-anchor="middle">肉眼：视角 α 小</text>
    <g>
      <path d="M92 410 Q114 396 136 410 Q114 424 92 410 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <circle cx="114" cy="410" r="6" fill="#334155"/>
      <line x1="114" y1="410" x2="330" y2="380" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="114" y1="410" x2="330" y2="440" stroke="#94a3b8" stroke-width="1.8"/>
      <polygon points="322,376 334,378 326,388" fill="#64748b"/>
      <polygon points="322,444 334,442 326,432" fill="#64748b"/>
      <line x1="330" y1="378" x2="330" y2="442" stroke="#475569" stroke-width="3"/>
    </g>
    <path class="p23-angle" d="M159 404 A45 45 0 0 0 159 416" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="168" y="416" font-size="13" font-weight="800" fill="#475569">α</text>
  </g>

  <g class="p23-card p23-card2">
    <rect x="465" y="315" width="380" height="160" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="655" y="342" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">望远镜：视角 β 大</text>
    <g>
      <path d="M492 410 Q514 396 536 410 Q514 424 492 410 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
      <circle cx="514" cy="410" r="6" fill="#334155"/>
      <line x1="514" y1="410" x2="730" y2="360" stroke="#94a3b8" stroke-width="1.8"/>
      <line x1="514" y1="410" x2="730" y2="460" stroke="#94a3b8" stroke-width="1.8"/>
      <polygon points="722,356 734,358 726,368" fill="#047857"/>
      <polygon points="722,464 734,462 726,452" fill="#047857"/>
      <line x1="730" y1="358" x2="730" y2="462" stroke="#047857" stroke-width="3"/>
    </g>
    <path class="p23-angle" d="M568 398 A55 55 0 0 0 568 422" fill="none" stroke="#047857" stroke-width="2"/>
    <text x="578" y="416" font-size="13" font-weight="800" fill="#047857">β</text>
  </g>
</g>

<!-- 第三步：显微镜和望远镜的区别 -->
<g class="p23-step p23-step3" data-zone="3">
  <g class="p23-panel">
    <rect x="40" y="85" width="400" height="220" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="130" y="272" width="190" height="12" rx="6" fill="#475569"/>
    <path d="M305 272 L305 155 Q305 132 282 132 L262 132" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <rect x="160" y="222" width="150" height="9" rx="3" fill="#64748b"/>
    <rect x="168" y="214" width="12" height="12" fill="#94a3b8"/>
    <rect x="292" y="214" width="12" height="12" fill="#94a3b8"/>
    <rect x="218" y="172" width="26" height="50" rx="4" fill="#64748b"/>
    <ellipse cx="231" cy="222" rx="15" ry="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="216" y="118" width="30" height="54" rx="4" fill="#334155"/>
    <ellipse cx="231" cy="116" rx="17" ry="6" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
    <circle cx="303" cy="205" r="11" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <line x1="205" y1="250" x2="245" y2="268" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <text x="231" y="103" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">显微镜</text>
    <text x="240" y="300" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">看微小物体 · 物镜 f 短</text>
  </g>

  <g class="p23-panel p23-panel2">
    <rect x="460" y="85" width="400" height="220" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <g stroke="#475569" stroke-width="5" stroke-linecap="round">
      <line x1="660" y1="282" x2="620" y2="228"/>
      <line x1="660" y1="282" x2="700" y2="228"/>
      <line x1="660" y1="282" x2="660" y2="242"/>
    </g>
    <g transform="rotate(-12 670 195)">
      <rect x="560" y="170" width="220" height="48" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <ellipse cx="580" cy="194" rx="8" ry="14" fill="#cbd5e1"/>
      <ellipse cx="760" cy="194" rx="8" ry="20" fill="#93c5fd"/>
      <line x1="600" y1="170" x2="600" y2="218" stroke="#94a3b8" stroke-width="2"/>
      <line x1="735" y1="170" x2="735" y2="218" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <circle cx="660" cy="222" r="12" fill="#64748b"/>
    <text x="670" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">望远镜</text>
    <text x="660" y="300" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">看远处物体 · 物镜 f 长</text>
  </g>

  <rect x="40" y="315" width="820" height="160" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <g font-size="12" fill="#334155">
    <rect x="60" y="330" width="120" height="28" rx="6" fill="#eef2f7"/>
    <text x="120" y="349" font-weight="800" text-anchor="middle">项目</text>
    <rect x="300" y="330" width="260" height="28" rx="6" fill="#e8effc"/>
    <text x="430" y="349" font-weight="800" fill="#1e3a8a" text-anchor="middle">显微镜</text>
    <rect x="610" y="330" width="230" height="28" rx="6" fill="#e6f7f1"/>
    <text x="725" y="349" font-weight="800" fill="#047857" text-anchor="middle">望远镜</text>

    <line x1="60" y1="364" x2="840" y2="364" stroke="#e2e8f0"/>
    <line x1="60" y1="400" x2="840" y2="400" stroke="#e2e8f0"/>
    <line x1="60" y1="436" x2="840" y2="436" stroke="#e2e8f0"/>
    <line x1="300" y1="330" x2="300" y2="470" stroke="#e2e8f0"/>
    <line x1="610" y1="330" x2="610" y2="470" stroke="#e2e8f0"/>

    <g class="p23-row">
      <text x="120" y="388" text-anchor="middle">观察对象</text>
      <text x="430" y="388" text-anchor="middle">微小物体</text>
      <text x="725" y="388" text-anchor="middle">远处物体</text>
    </g>
    <g class="p23-row">
      <text x="120" y="424" text-anchor="middle">物镜焦距</text>
      <text x="430" y="424" text-anchor="middle">短</text>
      <text x="725" y="424" text-anchor="middle">长</text>
    </g>
    <g class="p23-row">
      <text x="120" y="460" text-anchor="middle">最终像</text>
      <text x="430" y="460" text-anchor="middle">放大虚像</text>
      <text x="725" y="460" text-anchor="middle">放大虚像（可能倒立）</text>
    </g>
  </g>
</g>
</svg>
