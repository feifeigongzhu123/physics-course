<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="运动的描述：机械运动、参照物与运动的相对性">
  <style>
    [data-scene="pj-5"] .p5-step1,[data-scene="pj-5"] .p5-step2,[data-scene="pj-5"] .p5-step3{display:none}
    [data-scene="pj-5"].s1 .p5-step1,[data-scene="pj-5"].s2 .p5-step2,[data-scene="pj-5"].s3 .p5-step3{display:block;animation:p5in .45s ease both}
    @keyframes p5in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p5flow{to{stroke-dashoffset:-40}}
    @keyframes p5bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    [data-scene="pj-5"] .p5-move{stroke-dasharray:9 7;animation:p5flow 1.2s linear infinite}
    [data-scene="pj-5"] .p5-card{transform-box:fill-box;transform-origin:center;animation:popIn .45s ease both}
    [data-scene="pj-5"] .p5-hose{stroke-dasharray:6 5;animation:p5flow 1.6s linear infinite}
    [data-scene="pj-5"] .p5-ghost{opacity:.35}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">运动的描述：选好参照物，动与静是相对的</text>

  <!-- 第一步：机械运动 -->
  <g class="p5-step1" data-zone="1">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">物体位置随时间变化，就是机械运动</text>

    <rect x="0" y="400" width="900" height="55" fill="#e8eef5"/>
    <line x1="0" y1="400" x2="900" y2="400" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="455" x2="900" y2="455" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="30" y1="428" x2="870" y2="428" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="18 14"/>

    <g transform="translate(764,300)">
      <rect x="0" y="0" width="14" height="100" rx="4" fill="#92400e"/>
      <circle cx="-22" cy="-12" r="28" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
      <circle cx="30" cy="-12" r="28" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
      <circle cx="4" cy="-34" r="34" fill="#4ade80" stroke="#16a34a" stroke-width="2"/>
    </g>
    <text x="771" y="478" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">树（参照物）</text>

    <g class="p5-ghost" transform="translate(140,0)">
      <rect x="0" y="356" width="110" height="40" rx="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
      <path d="M26 356 L36 334 H74 L88 356 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <rect x="44" y="338" width="18" height="14" rx="3" fill="#e0f2fe"/>
      <rect x="66" y="338" width="14" height="14" rx="3" fill="#e0f2fe"/>
      <circle cx="24" cy="398" r="10" fill="#334155"/><circle cx="24" cy="398" r="4" fill="#cbd5e1"/>
      <circle cx="86" cy="398" r="10" fill="#334155"/><circle cx="86" cy="398" r="4" fill="#cbd5e1"/>
    </g>
    <g transform="translate(510,0)">
      <rect x="0" y="356" width="110" height="40" rx="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
      <path d="M26 356 L36 334 H74 L88 356 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <rect x="44" y="338" width="18" height="14" rx="3" fill="#e0f2fe"/>
      <rect x="66" y="338" width="14" height="14" rx="3" fill="#e0f2fe"/>
      <circle cx="24" cy="398" r="10" fill="#334155"/><circle cx="24" cy="398" r="4" fill="#cbd5e1"/>
      <circle cx="86" cy="398" r="10" fill="#334155"/><circle cx="86" cy="398" r="4" fill="#cbd5e1"/>
    </g>

    <line class="p5-move" x1="282" y1="318" x2="492" y2="318" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>
    <text x="388" y="302" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">位置改变 → 机械运动</text>
    <text x="195" y="478" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">t₁ 时刻</text>
    <text x="565" y="478" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">t₂ 时刻</text>
  </g>

  <!-- 第二步：参照物 -->
  <g class="p5-step2" data-zone="2">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">判断动与静：看相对参照物的位置有没有改变</text>

    <g class="p5-card">
      <rect x="60" y="100" width="380" height="370" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="250" y="130" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">以树为参照物</text>
      <text x="250" y="152" font-size="11.5" fill="#64748b" text-anchor="middle">看小车相对树的位置是否改变</text>
      <line x1="80" y1="380" x2="420" y2="380" stroke="#cbd5e1" stroke-width="2"/>

      <g transform="translate(344,300)">
        <rect x="0" y="0" width="12" height="80" rx="3" fill="#92400e"/>
        <circle cx="-20" cy="-10" r="22" fill="#4ade80" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="24" cy="-10" r="22" fill="#4ade80" stroke="#16a34a" stroke-width="1.8"/>
        <circle cx="2" cy="-28" r="26" fill="#4ade80" stroke="#16a34a" stroke-width="1.8"/>
      </g>
      <text x="290" y="322" font-size="11.5" font-weight="700" fill="#475569" text-anchor="end">树</text>

      <g transform="translate(110,0)">
        <rect x="0" y="336" width="110" height="40" rx="12" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
        <path d="M26 336 L36 314 H74 L88 336 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
        <rect x="44" y="318" width="18" height="14" rx="3" fill="#e0f2fe"/>
        <rect x="66" y="318" width="14" height="14" rx="3" fill="#e0f2fe"/>
        <circle cx="24" cy="378" r="10" fill="#334155"/><circle cx="24" cy="378" r="4" fill="#cbd5e1"/>
        <circle cx="86" cy="378" r="10" fill="#334155"/><circle cx="86" cy="378" r="4" fill="#cbd5e1"/>
      </g>
      <text x="160" y="300" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">小车</text>

      <line class="p5-move" x1="226" y1="356" x2="336" y2="356" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
      <text x="282" y="346" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">距离变大</text>

      <rect x="95" y="398" width="310" height="44" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
      <text x="250" y="425" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">位置改变 → 运动</text>
    </g>

    <g class="p5-card">
      <rect x="460" y="100" width="380" height="370" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="650" y="130" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">以车厢为参照物</text>
      <text x="650" y="152" font-size="11.5" fill="#64748b" text-anchor="middle">看乘客相对车厢的位置是否改变</text>

      <rect x="495" y="210" width="310" height="178" rx="20" fill="#dbeafe" stroke="#1e3a8a" stroke-width="2"/>
      <rect x="582" y="230" width="198" height="92" rx="10" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
      <rect x="505" y="330" width="92" height="14" rx="5" fill="#94a3b8"/>
      <circle cx="548" cy="278" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <path d="M548 291 V330" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
      <path d="M548 302 L522 316" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
      <path d="M548 330 L528 350 M548 330 L568 350" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
      <text x="548" y="368" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">乘客</text>
      <rect x="500" y="252" width="80" height="104" rx="10" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="7 5"/>

      <rect x="520" y="398" width="260" height="44" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="650" y="425" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">位置不变 → 静止</text>
    </g>
    <text x="450" y="489" font-size="12" fill="#64748b" text-anchor="middle">参照物不能选研究对象本身；选不同参照物，运动描述可能不同</text>
  </g>

  <!-- 第三步：运动的相对性 -->
  <g class="p5-step3" data-zone="3">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">同一物体，选不同参照物，运动描述可能不同</text>

    <g class="p5-card">
      <rect x="60" y="100" width="380" height="360" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="250" y="128" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">空中加油：同步飞行</text>
      <text x="250" y="148" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">以受油机为参照：加油机静止</text>

      <ellipse cx="120" cy="186" rx="30" ry="11" fill="#e2e8f0"/>
      <ellipse cx="355" cy="166" rx="36" ry="13" fill="#e2e8f0"/>
      <ellipse cx="290" cy="208" rx="24" ry="9" fill="#eef2f7"/>

      <g transform="translate(190,236)">
        <ellipse cx="0" cy="0" rx="58" ry="14" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
        <path d="M-14 -8 L-48 -36 L-30 -38 L10 -12 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
        <path d="M-14 8 L-48 36 L-30 38 L10 12 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
        <path d="M-54 -2 L-76 -18 L-62 2 Z" fill="#64748b"/>
        <path d="M54 0 L76 0 L56 -8 Z" fill="#475569"/>
        <ellipse cx="26" cy="-4" rx="9" ry="4" fill="#e0f2fe"/>
      </g>
      <text x="168" y="312" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">加油机</text>

      <g transform="translate(320,334) scale(.6)">
        <ellipse cx="0" cy="0" rx="58" ry="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
        <path d="M-14 -8 L-48 -36 L-30 -38 L10 -12 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
        <path d="M-14 8 L-48 36 L-30 38 L10 12 Z" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
        <path d="M-54 -2 L-76 -18 L-62 2 Z" fill="#64748b"/>
        <path d="M54 0 L76 0 L56 -8 Z" fill="#1e40af"/>
        <ellipse cx="26" cy="-4" rx="9" ry="4" fill="#eff6ff"/>
      </g>
      <text x="336" y="382" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">受油机</text>

      <path class="p5-hose" d="M128 240 Q250 252 356 330" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle cx="354" cy="329" r="7" fill="none" stroke="#dc2626" stroke-width="2"/>
      <text x="252" y="266" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">加油管</text>

      <text x="250" y="412" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">以受油机为参照：位置不变 → 静止</text>
      <text x="250" y="438" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">以地面为参照：位置改变 → 运动</text>
    </g>

    <g class="p5-card">
      <rect x="460" y="100" width="380" height="360" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="650" y="128" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">列车里的乘客</text>
      <text x="650" y="148" font-size="11.5" fill="#64748b" text-anchor="middle">分别以车厢、路边的树为参照</text>

      <rect x="480" y="170" width="340" height="228" rx="18" fill="#e0f2fe" stroke="#1e3a8a" stroke-width="2"/>
      <rect x="600" y="195" width="190" height="105" rx="10" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
      <g transform="translate(746,265)">
        <rect x="-4" y="0" width="8" height="30" fill="#92400e"/>
        <circle cx="0" cy="-12" r="18" fill="#4ade80" stroke="#16a34a" stroke-width="1.5"/>
      </g>
      <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5">
        <line x1="615" y1="238" x2="665" y2="238"/>
        <line x1="615" y1="253" x2="670" y2="253"/>
        <line x1="615" y1="268" x2="665" y2="268"/>
      </g>
      <text x="700" y="318" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">窗外的树</text>

      <rect x="505" y="330" width="95" height="13" rx="5" fill="#94a3b8"/>
      <circle cx="548" cy="278" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <path d="M548 291 V330" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
      <path d="M548 302 L522 316" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
      <path d="M548 330 L528 350 M548 330 L568 350" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
      <text x="548" y="368" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">乘客</text>

      <text x="650" y="412" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">以车厢为参照：位置不变 → 静止</text>
      <text x="650" y="438" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">以树为参照：位置改变 → 运动</text>
    </g>
  </g>
</svg>
