<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电势差与电场强度的关系：U 等于 Ed、场强指向电势降低最快的方向、φ-x 图像的斜率">
<style>
[data-scene="ps-46"] .s46-step1,[data-scene="ps-46"] .s46-step2,[data-scene="ps-46"] .s46-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-46"].s1 .s46-step1,[data-scene="ps-46"].s2 .s46-step2,[data-scene="ps-46"].s3 .s46-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s46draw{to{stroke-dashoffset:0}}
@keyframes s46pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s46pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s46fade{from{opacity:0}to{opacity:1}}
[data-scene="ps-46"].s1 .s46-axis{stroke-dasharray:420;stroke-dashoffset:420;animation:s46draw 1s ease .2s forwards}
[data-scene="ps-46"].s1 .s46-dim{stroke-dasharray:100;stroke-dashoffset:100;animation:s46draw .6s ease .6s forwards}
[data-scene="ps-46"].s1 .s46-card{transform-box:fill-box;transform-origin:center;animation:s46pop .5s ease .25s both}
[data-scene="ps-46"].s2 .s46-eq{animation:s46fade .8s ease .25s both}
[data-scene="ps-46"].s2 .s46-vec{stroke-dasharray:200;stroke-dashoffset:200;animation:s46draw .8s ease .4s forwards}
[data-scene="ps-46"].s2 .s46-card{transform-box:fill-box;transform-origin:center;animation:s46pop .5s ease .3s both}
[data-scene="ps-46"].s3 .s46-plot{stroke-dasharray:400;stroke-dashoffset:400;animation:s46draw 1.1s ease .25s forwards}
[data-scene="ps-46"].s3 .s46-card{transform-box:fill-box;transform-origin:center;animation:s46pop .5s ease .35s both}
[data-scene="ps-46"].s3 .s46-guide{animation:s46fade .7s ease .8s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电势差与电场强度：U = Ed 与 φ-x 图像</text>

<!-- 第一步：U = Ed -->
<g class="s46-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 关系式：U_AB = Ed</text>

  <rect x="70" y="118" width="450" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line x1="90" y1="160" x2="496" y2="160"/>
    <line x1="90" y1="380" x2="496" y2="380"/>
  </g>
  <text x="300" y="142" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">沿电场方向考察一段距离 d</text>

  <line class="s46-axis" x1="100" y1="260" x2="500" y2="260" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g stroke="#475569" stroke-width="2">
    <line x1="140" y1="252" x2="140" y2="268"/>
    <line x1="240" y1="252" x2="240" y2="268"/>
    <line x1="340" y1="252" x2="340" y2="268"/>
    <line x1="440" y1="252" x2="440" y2="268"/>
  </g>
  <g font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">
    <text x="140" y="238">30 V</text>
    <text x="240" y="238">20 V</text>
    <text x="340" y="238">10 V</text>
    <text x="440" y="238">0 V</text>
  </g>

  <line class="s46-dim" x1="140" y1="300" x2="240" y2="300" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line class="s46-dim" x1="240" y1="300" x2="340" y2="300" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line class="s46-dim" x1="340" y1="300" x2="440" y2="300" stroke="#64748b" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <g font-size="12" font-weight="800" fill="#475569" text-anchor="middle">
    <text x="190" y="320">d</text>
    <text x="290" y="320">d</text>
    <text x="390" y="320">d</text>
  </g>

  <text x="300" y="350" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">沿电场方向相同距离，电势差相同</text>
  <text x="300" y="374" font-size="12" fill="#334155" text-anchor="middle">每前进 d，电势降低 10 V</text>

  <g class="s46-card">
    <rect x="540" y="110" width="290" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="685" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">匀强电场中的关系</text>
    <text x="685" y="190" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">U_AB = Ed</text>
    <text x="685" y="218" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">E = U/d</text>
    <text x="685" y="246" font-size="12" fill="#334155" text-anchor="middle">1 V/m = 1 N/C</text>
    <line x1="565" y1="266" x2="805" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="685" y="294">沿电场方向相同距离</text>
      <text x="685" y="318">电势差相同</text>
      <text x="685" y="346" font-weight="800" fill="#b45309">只对匀强电场成立</text>
      <text x="685" y="372">非匀强电场只能粗略分析</text>
      <text x="685" y="398">E 越大，电势降落越快</text>
      <text x="685" y="422">U 与 d 成正比是有条件的</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">U = Ed 只适用于匀强电场，d 为沿场强方向的距离</text>
</g>

<!-- 第二步：场强方向 -->
<g class="s46-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 方向：场强指向电势降低最快的方向</text>

  <rect x="70" y="118" width="450" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g class="s46-eq" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 5">
    <line x1="170" y1="165" x2="170" y2="395"/>
    <line x1="290" y1="165" x2="290" y2="395"/>
    <line x1="410" y1="165" x2="410" y2="395"/>
  </g>
  <g font-size="11.5" font-weight="800" fill="#6d28d9" text-anchor="middle">
    <text x="170" y="152">30 V</text>
    <text x="290" y="152">20 V</text>
    <text x="410" y="152">10 V</text>
  </g>
  <text x="466" y="156" font-size="11.5" fill="#6d28d9" text-anchor="middle">等势面</text>

  <line class="s46-vec" x1="140" y1="280" x2="464" y2="280" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="452" y="264" font-size="13" font-weight="900" fill="#1d4ed8">E</text>

  <line class="s46-vec" x1="250" y1="330" x2="360" y2="330" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line class="s46-vec" x1="250" y1="330" x2="340" y2="260" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrRed)"/>
  <circle cx="250" cy="330" r="4" fill="#334155"/>
  <text x="310" y="348" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">沿 E</text>
  <text x="348" y="246" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">斜向</text>

  <text x="300" y="382" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">沿电场线方向，电势降低最快</text>

  <g class="s46-card">
    <rect x="540" y="110" width="290" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="685" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">场强方向与电势</text>
    <text x="685" y="178" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">E 指向电势降低最快的方向</text>
    <line x1="565" y1="198" x2="805" y2="198" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="685" y="226">沿电场线：电势降低最快</text>
      <text x="685" y="252">垂直电场线：电势不变</text>
      <text x="685" y="278">沿其他方向：介于两者之间</text>
    </g>
    <line x1="565" y1="298" x2="805" y2="298" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="685" y="326" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">E = 0 处，φ 不一定为零</text>
    <g fill="#64748b" font-size="11.5" text-anchor="middle">
      <text x="685" y="352">如等量同种电荷连线中点</text>
      <text x="685" y="378">E 大处，电势降落快</text>
      <text x="685" y="404">E 与 φ 无直接大小关系</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场强度的方向就是电势降低最快的方向</text>
</g>

<!-- 第三步：φ-x 图像 -->
<g class="s46-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · φ-x 图像：斜率的绝对值等于场强</text>

  <rect x="70" y="118" width="450" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="300" y="142" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电势 φ 随位置 x 的变化</text>

  <line x1="110" y1="390" x2="110" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="390" x2="482" y2="390" stroke="#334155" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="96" y="160" font-size="14" font-weight="900" fill="#334155">φ</text>
  <text x="492" y="404" font-size="14" font-weight="900" fill="#334155">x</text>
  <text x="100" y="408" font-size="11" fill="#64748b">O</text>

  <line class="s46-guide" x1="270" y1="320" x2="270" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line class="s46-guide" x1="440" y1="356" x2="440" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <polyline class="s46-plot" points="140,180 270,320 440,356" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <line x1="300" y1="236" x2="222" y2="252" stroke="#b45309" stroke-width="1.5"/>
  <text x="312" y="232" font-size="11.5" font-weight="800" fill="#b45309">斜率大，E 大</text>
  <line x1="392" y1="330" x2="362" y2="344" stroke="#047857" stroke-width="1.5"/>
  <text x="352" y="316" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">斜率小，E 小</text>

  <text x="300" y="412" font-size="11.5" fill="#64748b" text-anchor="middle">直线段表示匀强电场，斜率绝对值等于场强</text>

  <g class="s46-card">
    <rect x="540" y="110" width="290" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="685" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">φ-x 图像的斜率</text>
    <text x="685" y="182" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">k = Δφ/Δx</text>
    <text x="685" y="218" font-size="22" font-weight="900" fill="#b45309" text-anchor="middle">|k| = E</text>
    <line x1="565" y1="238" x2="805" y2="238" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="685" y="266">直线段 → 匀强电场</text>
      <text x="685" y="292">斜率越大 → 电场越强</text>
      <text x="685" y="318">斜率为零 → E = 0</text>
      <text x="685" y="344">斜率为正 → φ 随 x 升高</text>
    </g>
    <line x1="565" y1="362" x2="805" y2="362" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#64748b" font-size="11.5" text-anchor="middle">
      <text x="685" y="390">斜率正负只表示 φ 的升降</text>
      <text x="685" y="416">场强大小只看斜率的绝对值</text>
    </g>
  </g>

  <rect x="70" y="440" width="760" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="464" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">φ-x 图线某点斜率的绝对值，等于该处的电场强度大小</text>
  <text x="450" y="488" font-size="11.5" fill="#1e3a8a" text-anchor="middle">斜率越大场强越大；图线为直线时，电场是匀强电场</text>
</g>
</svg>
