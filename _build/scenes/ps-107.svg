<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="气体的等温变化：等温过程、玻意耳定律与p-V图像">
<style>
[data-scene="ps-107"] .s107-s1,[data-scene="ps-107"] .s107-s2,[data-scene="ps-107"] .s107-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-107"].s1 .s107-s1,[data-scene="ps-107"].s2 .s107-s2,[data-scene="ps-107"].s3 .s107-s3{opacity:1;visibility:visible}
@keyframes s107fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s107draw{to{stroke-dashoffset:0}}
@keyframes s107pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s107flow{to{stroke-dashoffset:-30}}
@keyframes s107pulse{0%,100%{opacity:.45}50%{opacity:1}}
[data-scene="ps-107"].s1 .s107-g1{animation:s107fade .5s ease .12s both}
[data-scene="ps-107"].s1 .s107-gas{animation:s107pulse 2.2s ease-in-out infinite}
[data-scene="ps-107"].s1 .s107-push{stroke-dasharray:8 7;animation:s107flow 1s linear infinite}
[data-scene="ps-107"].s1 .s107-badge{animation:s107fade .5s ease .45s both}
[data-scene="ps-107"].s1 .s107-card{animation:s107fade .5s ease .3s both}
[data-scene="ps-107"].s2 .s107-c1{transform-box:fill-box;transform-origin:center;animation:s107pop .5s ease .1s both}
[data-scene="ps-107"].s2 .s107-c2{transform-box:fill-box;transform-origin:center;animation:s107pop .5s ease .3s both}
[data-scene="ps-107"].s2 .s107-formula{transform-box:fill-box;transform-origin:center;animation:s107pop .55s ease .5s both}
[data-scene="ps-107"].s2 .s107-arr{stroke-dasharray:8 7;animation:s107flow 1.1s linear infinite}
[data-scene="ps-107"].s2 .s107-card{animation:s107fade .5s ease .25s both}
[data-scene="ps-107"].s3 .s107-curve1{stroke-dasharray:620;stroke-dashoffset:620;animation:s107draw 1.4s ease .2s forwards}
[data-scene="ps-107"].s3 .s107-curve2{stroke-dasharray:620;stroke-dashoffset:620;animation:s107draw 1.4s ease .5s forwards}
[data-scene="ps-107"].s3 .s107-guide{animation:s107fade .5s ease .9s both}
[data-scene="ps-107"].s3 .s107-miniline{stroke-dasharray:240;stroke-dashoffset:240;animation:s107draw 1s ease .5s forwards}
[data-scene="ps-107"].s3 .s107-tag{transform-box:fill-box;transform-origin:center;animation:s107pop .5s ease 1.1s both}
[data-scene="ps-107"].s3 .s107-card{animation:s107fade .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">气体的等温变化：玻意耳定律与 p-V 图像</text>

<!-- 第一步：等温变化过程 -->
<g class="s107-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">等温变化：质量一定、温度不变，压强随体积变化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="230" height="28" rx="14" fill="#e8effc"/>
  <text x="171" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">注射器内封闭的气体</text>

  <g class="s107-g1">
    <rect x="150" y="215" width="270" height="85" rx="8" fill="#f8fbff" stroke="#1d4ed8" stroke-width="2.4"/>
    <rect x="266" y="221" width="148" height="73" rx="4" fill="#dbeafe" class="s107-gas"/>
    <circle cx="292" cy="258" r="3.2" fill="#1d4ed8"/>
    <circle cx="316" cy="278" r="3.2" fill="#1d4ed8"/>
    <circle cx="342" cy="248" r="3.2" fill="#1d4ed8"/>
    <circle cx="368" cy="280" r="3.2" fill="#1d4ed8"/>
    <circle cx="392" cy="252" r="3.2" fill="#1d4ed8"/>
    <circle cx="404" cy="276" r="3.2" fill="#1d4ed8"/>
    <circle cx="352" cy="268" r="3.2" fill="#1d4ed8"/>
    <text x="340" y="240" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">封闭气体</text>
    <rect x="420" y="248" width="28" height="19" rx="3" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.8"/>
    <rect x="254" y="212" width="12" height="91" rx="2" fill="#475569"/>
    <rect x="120" y="251" width="134" height="12" rx="3" fill="#94a3b8"/>
    <rect x="108" y="231" width="13" height="52" rx="4" fill="#64748b"/>
    <text x="262" y="326" font-size="11" fill="#475569" text-anchor="middle">活塞</text>
    <text x="470" y="262" font-size="11" fill="#475569">注射器</text>
  </g>

  <line class="s107-push" x1="64" y1="257" x2="102" y2="257" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <text x="82" y="243" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
  <line x1="300" y1="186" x2="376" y2="186" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <text x="338" y="174" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">压缩</text>

  <g class="s107-badge">
    <rect x="60" y="344" width="228" height="36" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="174" y="367" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">温度 T 保持不变</text>
  </g>

  <text x="60" y="404" font-size="11.5" font-weight="700" fill="#334155">缓慢推入活塞：V 减小、p 增大</text>
  <text x="60" y="428" font-size="11.5" fill="#64748b">过程足够慢，气体与外界充分交换热量</text>

  <g class="s107-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等温变化的条件</text>

    <rect x="596" y="158" width="248" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="183" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">m 一定　T 不变</text>
    <text x="720" y="205" font-size="11" fill="#475569" text-anchor="middle">p、V 可以改变</text>

    <text x="610" y="244" font-size="11.5" fill="#334155">缓慢推拉注射器活塞</text>
    <text x="610" y="270" font-size="11.5" fill="#334155">缓慢挤压或拉大气球</text>
    <text x="610" y="296" font-size="11.5" fill="#334155">气体与外界充分交换热量</text>
    <text x="610" y="322" font-size="11.5" fill="#334155">每一时刻温度都相同</text>

    <rect x="596" y="340" width="248" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="366" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">推入活塞：V 减小、p 增大</text>
    <text x="720" y="392" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">拉出活塞：V 增大、p 减小</text>
    <text x="720" y="428" font-size="11" fill="#64748b" text-anchor="middle">等温线上 p 与 V 同时变化</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等温变化：气体质量一定、温度不变，压强与体积同时发生变化</text>
</g>

<!-- 第二步：玻意耳定律 -->
<g class="s107-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">玻意耳定律：温度不变时，p 与 V 成反比</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">同一气体、同一温度的两个状态</text>

  <g class="s107-c1">
    <rect x="90" y="195" width="140" height="155" rx="6" fill="#f8fbff" stroke="#475569" stroke-width="2.4"/>
    <rect x="94" y="252" width="132" height="94" fill="#dbeafe"/>
    <circle cx="120" cy="278" r="3.2" fill="#1d4ed8"/>
    <circle cx="150" cy="300" r="3.2" fill="#1d4ed8"/>
    <circle cx="182" cy="276" r="3.2" fill="#1d4ed8"/>
    <circle cx="206" cy="308" r="3.2" fill="#1d4ed8"/>
    <circle cx="132" cy="326" r="3.2" fill="#1d4ed8"/>
    <circle cx="190" cy="330" r="3.2" fill="#1d4ed8"/>
    <rect x="84" y="238" width="152" height="14" rx="2" fill="#64748b"/>
    <rect x="112" y="208" width="96" height="30" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <text x="160" y="228" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">p₁</text>
    <line x1="244" y1="252" x2="244" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="252" x2="248" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="240" y1="346" x2="248" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="256" y="304" font-size="12" font-weight="900" fill="#1e40af">V₁</text>
    <text x="160" y="176" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">状态 1：V 大、p 小</text>
  </g>

  <g class="s107-c2">
    <rect x="320" y="195" width="140" height="155" rx="6" fill="#f8fbff" stroke="#475569" stroke-width="2.4"/>
    <rect x="324" y="302" width="132" height="44" fill="#dbeafe"/>
    <circle cx="350" cy="316" r="3.2" fill="#1d4ed8"/>
    <circle cx="382" cy="330" r="3.2" fill="#1d4ed8"/>
    <circle cx="414" cy="318" r="3.2" fill="#1d4ed8"/>
    <circle cx="440" cy="334" r="3.2" fill="#1d4ed8"/>
    <rect x="314" y="288" width="152" height="14" rx="2" fill="#64748b"/>
    <rect x="342" y="208" width="96" height="80" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <line x1="342" y1="248" x2="438" y2="248" stroke="#475569" stroke-width="1.5"/>
    <text x="390" y="232" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">p₂</text>
    <line x1="474" y1="302" x2="474" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="470" y1="302" x2="478" y2="302" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="470" y1="346" x2="478" y2="346" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="486" y="330" font-size="12" font-weight="900" fill="#b91c1c">V₂</text>
    <text x="390" y="176" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">状态 2：V 小、p 大</text>
  </g>

  <line class="s107-arr" x1="270" y1="200" x2="306" y2="200" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <g class="s107-formula">
    <rect x="120" y="372" width="340" height="52" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="290" y="406" font-size="21" font-weight="900" fill="#b91c1c" text-anchor="middle">p₁V₁ = p₂V₂ = C</text>
  </g>

  <g class="s107-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">玻意耳定律</text>

    <text x="720" y="186" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">pV = C</text>
    <text x="720" y="210" font-size="11" fill="#475569" text-anchor="middle">C 由气体质量和温度决定</text>
    <line x1="596" y1="226" x2="844" y2="226" stroke="#e8eef7" stroke-width="1.5"/>

    <text x="720" y="258" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">p₁V₁ = p₂V₂</text>
    <text x="610" y="288" font-size="11.5" fill="#334155">适用：m 一定、T 不变的气体</text>
    <text x="610" y="312" font-size="11.5" fill="#334155">p 与 V 成反比：V 减半，p 加倍</text>
    <text x="610" y="336" font-size="11.5" fill="#334155">p-V 图像上是一条双曲线</text>

    <rect x="596" y="352" width="248" height="62" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="376" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">温度改变，常量 C 随之改变</text>
    <text x="720" y="398" font-size="11" fill="#92400e" text-anchor="middle">不同温度对应不同等温线</text>
    <text x="720" y="428" font-size="11" fill="#64748b" text-anchor="middle">同一等温线上任意点 pV 相同</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">玻意耳定律：一定质量的气体在温度不变时 p₁V₁ = p₂V₂，pV 为常量</text>
</g>

<!-- 第三步：p-V 图像 -->
<g class="s107-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">p-V 图像是双曲线，p-1/V 图像是过原点的直线</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="110" y1="372" x2="500" y2="372" stroke="#475569" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="372" x2="110" y2="138" stroke="#475569" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="102" y="150" font-size="12" font-weight="900" fill="#475569" text-anchor="end">p</text>
  <text x="508" y="378" font-size="12" font-weight="900" fill="#475569">V</text>
  <text x="98" y="390" font-size="11" fill="#64748b">O</text>

  <g class="s107-guide">
    <rect x="110" y="252" width="186" height="120" fill="#dbeafe" opacity="0.55"/>
    <rect x="110" y="252" width="186" height="120" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="203" y="312" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">p₀V₀ = 常量</text>
    <text x="100" y="256" font-size="11" fill="#475569" text-anchor="end">p₀</text>
    <text x="296" y="392" font-size="11" fill="#475569" text-anchor="middle">V₀</text>
  </g>

  <path class="s107-curve1" d="M 140 360 C 180 330 230 288 296 252 C 340 228 400 202 485 186" fill="none" stroke="#1d4ed8" stroke-width="3.4"/>
  <path class="s107-curve2" d="M 170 330 C 205 302 250 272 290 252 C 335 228 405 200 488 176" fill="none" stroke="#dc2626" stroke-width="3.4"/>

  <text x="300" y="146" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">T₂ 大于 T₁：离原点越远，温度越高</text>
  <text class="s107-tag" x="480" y="208" font-size="12" font-weight="900" fill="#1e40af">T₁</text>
  <text x="480" y="166" font-size="12" font-weight="900" fill="#b91c1c">T₂</text>

  <text x="296" y="420" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">等温线上任意点的 pV 乘积都相等</text>

  <g class="s107-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">图像与微观解释</text>

    <text x="720" y="166" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">p-1/V 图像：过原点的直线</text>
    <line x1="640" y1="296" x2="806" y2="296" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <line x1="640" y1="296" x2="640" y2="178" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <text x="630" y="188" font-size="11" font-weight="900" fill="#475569" text-anchor="end">p</text>
    <text x="800" y="316" font-size="11" font-weight="900" fill="#475569">1/V</text>
    <path class="s107-miniline" d="M 646 290 L 792 184" fill="none" stroke="#059669" stroke-width="3"/>
    <text x="722" y="332" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">斜率 = pV</text>

    <line x1="596" y1="344" x2="844" y2="344" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="610" y="366" font-size="11" fill="#334155">T 不变：分子平均动能不变</text>
    <text x="610" y="390" font-size="11" fill="#334155">V 减小：单位体积分子数增多</text>
    <text x="610" y="414" font-size="11" fill="#334155">撞壁更频繁，压强增大</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等温线是双曲线；p-1/V 图像为过原点直线，斜率就是 pV 的常量值</text>
</g>
</svg>
