<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="自由落体运动：定义、运动规律、重力加速度与质量无关">
<style>
[data-scene="ps-11"] .s11-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-11"].s1 .s11-step1,[data-scene="ps-11"].s2 .s11-step2,[data-scene="ps-11"].s3 .s11-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s11draw{to{stroke-dashoffset:0}}
@keyframes s11pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes s11grow{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes s11fall{0%{transform:translateY(0)}70%,100%{transform:translateY(255px)}}
@keyframes s11pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s11flow{to{stroke-dashoffset:-26}}
[data-scene="ps-11"].s1 .s11-g{transform-box:fill-box;transform-origin:center;animation:s11pop .5s ease both}
[data-scene="ps-11"].s1 .s11-g2{animation-delay:.25s}
[data-scene="ps-11"].s1 .s11-g3{animation-delay:.5s}
[data-scene="ps-11"].s1 .s11-g4{animation-delay:.75s}
[data-scene="ps-11"].s1 .s11-g5{animation-delay:1s}
[data-scene="ps-11"].s1 .s11-card{animation:s11grow .5s ease .2s both}
[data-scene="ps-11"].s1 .s11-card2{animation-delay:.4s}
[data-scene="ps-11"].s2 .s11-line{stroke-dasharray:360;stroke-dashoffset:360;animation:s11draw 1.1s ease .1s both}
[data-scene="ps-11"].s2 .s11-area{opacity:0;animation:s11grow .6s ease .7s both}
[data-scene="ps-11"].s2 .s11-card{animation:s11grow .5s ease .2s both}
[data-scene="ps-11"].s2 .s11-card2{animation-delay:.4s}
[data-scene="ps-11"].s2 .s11-row{opacity:0;animation:s11grow .4s ease both}
[data-scene="ps-11"].s2 .s11-r1{animation-delay:.5s}
[data-scene="ps-11"].s2 .s11-r2{animation-delay:.65s}
[data-scene="ps-11"].s2 .s11-r3{animation-delay:.8s}
[data-scene="ps-11"].s3 .s11-fall{animation:s11fall 3.2s ease-in infinite}
[data-scene="ps-11"].s3 .s11-arrow{stroke-dasharray:12 8;animation:s11flow 1.2s linear infinite}
[data-scene="ps-11"].s3 .s11-card{animation:s11grow .5s ease .2s both}
[data-scene="ps-11"].s3 .s11-tag{transform-box:fill-box;transform-origin:center;animation:s11pop .5s ease 1s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">自由落体运动：初速度为 0，加速度为 g</text>

<!-- 第一步：什么是自由落体 -->
<g class="s11-step s11-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">只受重力、从静止开始下落的运动</text>

  <line x1="240" y1="105" x2="240" y2="522" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 6"/>
  <g class="s11-g"><circle cx="240" cy="122" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/></g>
  <g class="s11-g s11-g2"><circle cx="240" cy="150" r="10" fill="#f97316" opacity=".8"/></g>
  <g class="s11-g s11-g3"><circle cx="240" cy="228" r="10" fill="#f97316" opacity=".65"/></g>
  <g class="s11-g s11-g4"><circle cx="240" cy="356" r="10" fill="#f97316" opacity=".5"/></g>
  <g class="s11-g s11-g5"><circle cx="240" cy="532" r="10" fill="#f97316"/></g>

  <g font-size="12" font-weight="800" fill="#047857">
    <text x="262" y="142">1</text>
    <text x="262" y="194">3</text>
    <text x="262" y="297">5</text>
    <text x="262" y="450">7</text>
  </g>
  <g font-size="12" font-weight="800" fill="#64748b" text-anchor="end">
    <text x="218" y="126">0</text>
    <text x="218" y="154">T</text>
    <text x="218" y="232">2T</text>
    <text x="218" y="360">3T</text>
    <text x="218" y="536">4T</text>
  </g>
  <line x1="205" y1="128" x2="205" y2="205" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="190" y="192" font-size="14" font-weight="900" fill="#6d28d9">G</text>
  <text x="300" y="130" font-size="12.5" font-weight="800" fill="#b91c1c">v₀ = 0</text>

  <g class="s11-card">
    <rect x="330" y="95" width="520" height="195" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="330" y="95" width="520" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="590" y="128" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">自由落体运动</text>
    <text x="352" y="158" font-size="12.5" fill="#334155">· 只受重力作用（忽略空气阻力）</text>
    <text x="352" y="184" font-size="12.5" fill="#334155">· 从静止开始下落，初速度 v₀ = 0</text>
    <text x="352" y="210" font-size="12.5" fill="#334155">· 加速度 a = g，方向竖直向下</text>
    <text x="590" y="244" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">本质：初速度为 0 的匀加速直线运动</text>
    <text x="590" y="272" font-size="11.5" fill="#64748b" text-anchor="middle">速度越来越大，相同时间内下落越来越远</text>
  </g>

  <g class="s11-card s11-card2">
    <rect x="330" y="310" width="520" height="190" rx="16" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="590" y="340" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">连续相等时间内的位移比</text>
    <text x="590" y="386" font-size="24" font-weight="900" fill="#047857" text-anchor="middle">1 ∶ 3 ∶ 5 ∶ 7 ∶ …</text>
    <text x="590" y="418" font-size="12" fill="#475569" text-anchor="middle">从静止开始，相邻相等时间 T 内的位移之比为奇数比</text>
    <text x="590" y="446" font-size="12" fill="#475569" text-anchor="middle">这也说明自由落体是匀加速直线运动</text>
    <text x="590" y="476" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">位置越往下，圆点间距越大</text>
  </g>
</g>

<!-- 第二步：运动规律 -->
<g class="s11-step s11-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">运动规律：v = gt，h = ½gt²</text>

  <line x1="110" y1="450" x2="405" y2="450" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="450" x2="110" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="414" y="455" font-size="14" font-weight="800" fill="#475569">t</text>
  <text x="102" y="126" font-size="14" font-weight="800" fill="#475569" text-anchor="end">v</text>
  <text x="94" y="469" font-size="12" font-weight="700" fill="#64748b">O</text>

  <polygon class="s11-area" points="110,450 360,180 360,450" fill="#dbeafe" opacity=".6"/>
  <line class="s11-line" x1="110" y1="450" x2="360" y2="180" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="285" y="220" font-size="13" font-weight="900" fill="#1d4ed8">v = gt</text>
  <text x="285" y="244" font-size="11.5" font-weight="700" fill="#64748b">斜率 = g</text>
  <text x="260" y="415" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">面积 = h</text>

  <g class="s11-card">
    <rect x="450" y="95" width="410" height="112" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="450" y="95" width="7" height="112" rx="3.5" fill="#1d4ed8"/>
    <text x="475" y="128" font-size="14" font-weight="900" fill="#1e3a8a">速度公式</text>
    <text x="700" y="140" font-size="24" font-weight="900" fill="#1d4ed8" text-anchor="middle">v = g t</text>
    <text x="475" y="166" font-size="12" fill="#475569">速度与下落时间成正比</text>
    <text x="475" y="190" font-size="11.5" fill="#64748b">方向与重力方向相同，竖直向下</text>
  </g>

  <g class="s11-card s11-card2">
    <rect x="450" y="225" width="410" height="112" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="450" y="225" width="7" height="112" rx="3.5" fill="#059669"/>
    <text x="475" y="258" font-size="14" font-weight="900" fill="#1e3a8a">高度公式</text>
    <text x="700" y="270" font-size="24" font-weight="900" fill="#047857" text-anchor="middle">h = ½ g t²</text>
    <text x="475" y="296" font-size="12" fill="#475569">下落高度与时间的平方成正比</text>
    <text x="475" y="320" font-size="11.5" fill="#64748b">h 是从释放点算起的竖直距离</text>
  </g>

  <g class="s11-card" transform="translate(0,0)">
    <rect x="450" y="355" width="410" height="160" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="655" y="381" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">取 g = 10 m/s² 估算</text>
    <line x1="475" y1="394" x2="835" y2="394" stroke="#cbd5e1" stroke-width="1.2"/>
    <g font-size="12" fill="#334155" text-anchor="middle">
      <text x="525" y="416" font-weight="800">t / s</text>
      <text x="655" y="416" font-weight="800">v / (m/s)</text>
      <text x="785" y="416" font-weight="800">h / m</text>
    </g>
    <line x1="475" y1="424" x2="835" y2="424" stroke="#cbd5e1" stroke-width="1.2"/>
    <g class="s11-row s11-r1" font-size="12.5" fill="#334155" text-anchor="middle">
      <text x="525" y="444">1</text><text x="655" y="444">10</text><text x="785" y="444">5</text>
    </g>
    <g class="s11-row s11-r2" font-size="12.5" fill="#334155" text-anchor="middle">
      <text x="525" y="466">2</text><text x="655" y="466">20</text><text x="785" y="466">20</text>
    </g>
    <g class="s11-row s11-r3" font-size="12.5" fill="#334155" text-anchor="middle">
      <text x="525" y="488">3</text><text x="655" y="488">30</text><text x="785" y="488">45</text>
    </g>
    <line x1="475" y1="498" x2="835" y2="498" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>

  <text x="255" y="490" font-size="12" fill="#64748b" text-anchor="middle">v-t 图线过原点，斜率恒为 g</text>
</g>

<!-- 第三步：重力加速度与质量无关 -->
<g class="s11-step s11-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">同一地点，所有物体的重力加速度都相同</text>

  <rect x="120" y="95" width="240" height="410" rx="42" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2.5"/>
  <rect x="155" y="103" width="170" height="12" rx="6" fill="#bae6fd"/>
  <text x="240" y="132" font-size="11.5" font-weight="800" fill="#0369a1" text-anchor="middle">真空管</text>
  <line x1="240" y1="105" x2="240" y2="495" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g class="s11-fall">
    <path d="M178 170 Q200 150 218 168 Q208 178 218 188 Q200 178 178 186 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <text x="205" y="206" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">羽毛</text>
    <circle cx="278" cy="178" r="17" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="278" y="212" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">铁球</text>
  </g>

  <line x1="382" y1="180" x2="382" y2="280" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="396" y="240" font-size="15" font-weight="900" fill="#6d28d9">g</text>
  <text x="360" y="310" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">加速度相同</text>

  <g class="s11-tag">
    <rect x="132" y="520" width="216" height="30" rx="9" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="240" y="540" font-size="12.5" font-weight="900" fill="#047857" text-anchor="middle">真空中同时落地</text>
  </g>

  <g class="s11-card">
    <rect x="430" y="95" width="420" height="390" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="430" y="95" width="420" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="640" y="132" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">重力加速度 g</text>
    <text x="640" y="172" font-size="24" font-weight="900" fill="#1d4ed8" text-anchor="middle">g ≈ 9.8 m/s²</text>
    <text x="640" y="202" font-size="12.5" fill="#334155" text-anchor="middle">方向：竖直向下</text>
    <text x="640" y="228" font-size="12.5" fill="#334155" text-anchor="middle">粗略计算可取 g = 10 m/s²</text>
    <line x1="458" y1="246" x2="822" y2="246" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="640" y="280" font-size="18" font-weight="900" fill="#b91c1c" text-anchor="middle">与物体质量无关</text>
    <text x="458" y="310" font-size="12" fill="#475569">同一地点，所有物体自由下落的加速度相同。</text>
    <text x="458" y="336" font-size="12" fill="#475569">真空中，羽毛与铁球下落得一样快。</text>
    <text x="458" y="362" font-size="12" fill="#475569">空气中轻物体受阻力影响明显，下落更慢。</text>
    <rect x="458" y="382" width="364" height="76" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4"/>
    <text x="640" y="406" font-size="11.5" font-weight="800" fill="#7c5a30" text-anchor="middle">g 随纬度升高略微增大</text>
    <text x="640" y="428" font-size="11.5" fill="#7c5a30" text-anchor="middle">随海拔升高略微减小</text>
    <text x="640" y="448" font-size="11" fill="#92400e" text-anchor="middle">通常认为同一地点 g 为定值</text>
  </g>
</g>
</svg>
