<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电流与电压、电阻的关系：控制变量法、I-U 正比图像、I-R 反比图像">
<style>
.p62-s1,.p62-s2,.p62-s3{opacity:0;visibility:hidden}
.p62-s1{opacity:1;visibility:visible}
[data-scene="pj-62"] .p62-s1,[data-scene="pj-62"] .p62-s2,[data-scene="pj-62"] .p62-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-62"].s1 .p62-s1,[data-scene="pj-62"].s2 .p62-s2,[data-scene="pj-62"].s3 .p62-s3{opacity:1;visibility:visible}
@keyframes p62flow{to{stroke-dashoffset:-42}}
@keyframes p62pop{0%{transform:scale(.8);opacity:0}72%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p62draw{to{stroke-dashoffset:0}}
@keyframes p62pulse{0%,100%{opacity:.4}50%{opacity:1}}
[data-scene="pj-62"].s1 .p62-flow{stroke-dasharray:11 8;animation:p62flow 1.3s linear infinite}
[data-scene="pj-62"].s1 .p62-panel{transform-box:fill-box;transform-origin:center;animation:p62pop .55s ease both}
[data-scene="pj-62"].s2 .p62-line{stroke-dasharray:420;stroke-dashoffset:420;animation:p62draw 1.3s ease .2s forwards}
[data-scene="pj-62"].s2 .p62-dot{transform-box:fill-box;transform-origin:center;animation:p62pop .5s ease both}
[data-scene="pj-62"].s2 .p62-dot2{animation-delay:.35s}
[data-scene="pj-62"].s2 .p62-dot3{animation-delay:.5s}
[data-scene="pj-62"].s2 .p62-eq{transform-box:fill-box;transform-origin:center;animation:p62pop .55s ease .5s both}
[data-scene="pj-62"].s3 .p62-curve{stroke-dasharray:420;stroke-dashoffset:420;animation:p62draw 1.3s ease .2s forwards}
[data-scene="pj-62"].s3 .p62-dot{transform-box:fill-box;transform-origin:center;animation:p62pop .5s ease both}
[data-scene="pj-62"].s3 .p62-dot2{animation-delay:.35s}
[data-scene="pj-62"].s3 .p62-dot3{animation-delay:.5s}
[data-scene="pj-62"].s3 .p62-eq{transform-box:fill-box;transform-origin:center;animation:p62pop .55s ease .5s both}
[data-scene="pj-62"].s3 .p62-label{animation:p62pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电流与电压、电阻的关系：控制变量，再看图像</text>

<!-- 第一步：控制变量法 -->
<g class="p62-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">研究两个量的关系时，只改变一个量，保持其他量不变</text>

  <rect x="36" y="100" width="400" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="230" height="28" rx="14" fill="#e8effc"/>
  <text x="171" y="135" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">探究 I 与 U：控制 R 不变</text>

  <path d="M70 200 H400 V340 H70 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path class="p62-flow" d="M70 200 H400 V340 H70 Z" fill="none" stroke="#1d4ed8" stroke-width="5" opacity=".9"/>

  <rect x="190" y="187" width="80" height="26" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="230" y="178" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">定值电阻 R</text>

  <circle cx="330" cy="200" r="18" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <text x="330" y="206" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">A</text>

  <line x1="200" y1="213" x2="200" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="200" y1="285" x2="212" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="260" y1="213" x2="260" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="260" y1="285" x2="248" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="230" cy="285" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="230" y="291" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">V</text>
  <text x="290" y="290" font-size="12" font-weight="800" fill="#1d4ed8">U</text>
  <text x="330" y="242" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">I</text>

  <line x1="170" y1="326" x2="170" y2="354" stroke="#334155" stroke-width="4"/>
  <line x1="184" y1="332" x2="184" y2="348" stroke="#334155" stroke-width="4"/>
  <text x="177" y="372" font-size="11" fill="#64748b" text-anchor="middle">电源</text>
  <circle cx="300" cy="340" r="4" fill="#334155"/>
  <circle cx="330" cy="340" r="4" fill="#334155"/>
  <line x1="300" y1="340" x2="328" y2="326" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="315" y="320" font-size="11.5" font-weight="800" fill="#64748b">S</text>

  <text x="235" y="396" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">改变电源电压，记录多组 U 和 I</text>

  <rect x="464" y="100" width="400" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="484" y="116" width="230" height="28" rx="14" fill="#e6f7f1"/>
  <text x="599" y="135" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">探究 I 与 R：控制 U 不变</text>

  <path d="M498 200 H828 V340 H498 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path class="p62-flow" d="M498 200 H828 V340 H498 Z" fill="none" stroke="#059669" stroke-width="5" opacity=".85"/>

  <rect x="618" y="187" width="80" height="26" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/>
  <text x="658" y="178" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">更换电阻</text>

  <circle cx="758" cy="200" r="18" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <text x="758" y="206" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">A</text>

  <line x1="628" y1="213" x2="628" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="628" y1="285" x2="640" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="688" y1="213" x2="688" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="688" y1="285" x2="676" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="658" cy="285" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="658" y="291" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">V</text>

  <rect x="580" y="326" width="90" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <path d="M590 340 l9 -8 l9 16 l9 -16 l9 16 l9 -16 l9 16 l9 -8" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="625" y="320" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">滑动变阻器</text>

  <line x1="530" y1="326" x2="530" y2="354" stroke="#334155" stroke-width="4"/>
  <line x1="544" y1="332" x2="544" y2="348" stroke="#334155" stroke-width="4"/>
  <text x="537" y="372" font-size="11" fill="#64748b" text-anchor="middle">电源</text>
  <circle cx="770" cy="340" r="4" fill="#334155"/>
  <circle cx="800" cy="340" r="4" fill="#334155"/>
  <line x1="770" y1="340" x2="798" y2="326" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="785" y="320" font-size="11.5" font-weight="800" fill="#64748b">S</text>

  <text x="663" y="396" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">换不同电阻，调滑片使电压表示数不变</text>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">控制变量法：研究 I 与 U 时保持 R 不变；研究 I 与 R 时保持 U 不变</text>
</g>

<!-- 第二步：I-U 正比 -->
<g class="p62-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电阻一定时，电流跟电压成正比，I-U 图像是过原点的直线</text>

  <rect x="36" y="100" width="470" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">I-U 图像（R = 5 Ω）</text>

  <line x1="105" y1="370" x2="438" y2="370" stroke="#64748b" stroke-width="2"/>
  <polygon points="438,366 450,370 438,374" fill="#64748b"/>
  <line x1="105" y1="370" x2="105" y2="136" stroke="#64748b" stroke-width="2"/>
  <polygon points="101,136 105,124 109,136" fill="#64748b"/>
  <text x="452" y="394" font-size="12" font-weight="800" fill="#475569" text-anchor="end">U/V</text>
  <text x="88" y="134" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">I/A</text>

  <g stroke="#e2e8f0" stroke-width="1.2">
    <line x1="180" y1="370" x2="180" y2="160"/>
    <line x1="255" y1="370" x2="255" y2="160"/>
    <line x1="330" y1="370" x2="330" y2="160"/>
    <line x1="405" y1="370" x2="405" y2="160"/>
    <line x1="105" y1="320" x2="430" y2="320"/>
    <line x1="105" y1="270" x2="430" y2="270"/>
    <line x1="105" y1="220" x2="430" y2="220"/>
    <line x1="105" y1="170" x2="430" y2="170"/>
  </g>
  <g font-size="11" fill="#64748b">
    <text x="180" y="388" text-anchor="middle">1</text>
    <text x="255" y="388" text-anchor="middle">2</text>
    <text x="330" y="388" text-anchor="middle">3</text>
    <text x="405" y="388" text-anchor="middle">4</text>
    <text x="96" y="324" text-anchor="end">0.2</text>
    <text x="96" y="274" text-anchor="end">0.4</text>
    <text x="96" y="224" text-anchor="end">0.6</text>
  </g>

  <line class="p62-line" x1="105" y1="370" x2="405" y2="170" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#1d4ed8">
    <circle class="p62-dot" cx="180" cy="320" r="5"/>
    <circle class="p62-dot p62-dot2" cx="255" cy="270" r="5"/>
    <circle class="p62-dot p62-dot3" cx="330" cy="220" r="5"/>
  </g>
  <text x="270" y="150" font-size="12" font-weight="800" fill="#1e40af">直线过原点</text>

  <text x="271" y="394" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">R 一定时，U 越大，I 越大，且 U/I 为定值</text>

  <rect x="516" y="100" width="348" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="536" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="626" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验数据</text>

  <rect x="536" y="158" width="308" height="30" fill="#e8effc"/>
  <text x="586" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">U/V</text>
  <text x="681" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">I/A</text>
  <text x="784" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">U/I</text>

  <rect x="536" y="188" width="308" height="32" fill="#f8fbff"/>
  <text x="586" y="209" font-size="12" fill="#334155" text-anchor="middle">1.0</text>
  <text x="681" y="209" font-size="12" fill="#334155" text-anchor="middle">0.2</text>
  <text x="784" y="209" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">5</text>

  <rect x="536" y="220" width="308" height="32" fill="#ffffff"/>
  <text x="586" y="241" font-size="12" fill="#334155" text-anchor="middle">2.0</text>
  <text x="681" y="241" font-size="12" fill="#334155" text-anchor="middle">0.4</text>
  <text x="784" y="241" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">5</text>

  <rect x="536" y="252" width="308" height="32" fill="#f8fbff"/>
  <text x="586" y="273" font-size="12" fill="#334155" text-anchor="middle">3.0</text>
  <text x="681" y="273" font-size="12" fill="#334155" text-anchor="middle">0.6</text>
  <text x="784" y="273" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">5</text>

  <g class="p62-eq">
    <text x="690" y="316" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">U / I = R = 5 Ω</text>
  </g>
  <text x="690" y="344" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">比值不变 → I 与 U 成正比</text>
  <text x="690" y="370" font-size="11.5" fill="#64748b" text-anchor="middle">图像斜率表示 1/R</text>
  <text x="690" y="392" font-size="11" fill="#64748b" text-anchor="middle">R 越大，直线越平缓</text>
</g>

<!-- 第三步：I-R 反比 -->
<g class="p62-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电压一定时，电流跟电阻成反比，I-R 图像是双曲线的一支</text>

  <rect x="36" y="100" width="470" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="230" height="28" rx="14" fill="#e6f7f1"/>
  <text x="171" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">I-R 图像（U = 3 V）</text>

  <line x1="105" y1="370" x2="438" y2="370" stroke="#64748b" stroke-width="2"/>
  <polygon points="438,366 450,370 438,374" fill="#64748b"/>
  <line x1="105" y1="370" x2="105" y2="136" stroke="#64748b" stroke-width="2"/>
  <polygon points="101,136 105,124 109,136" fill="#64748b"/>
  <text x="452" y="394" font-size="12" font-weight="800" fill="#475569" text-anchor="end">R/Ω</text>
  <text x="88" y="134" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">I/A</text>

  <g stroke="#e2e8f0" stroke-width="1.2">
    <line x1="180" y1="370" x2="180" y2="160"/>
    <line x1="255" y1="370" x2="255" y2="160"/>
    <line x1="330" y1="370" x2="330" y2="160"/>
    <line x1="405" y1="370" x2="405" y2="160"/>
    <line x1="105" y1="325" x2="430" y2="325"/>
    <line x1="105" y1="280" x2="430" y2="280"/>
    <line x1="105" y1="235" x2="430" y2="235"/>
    <line x1="105" y1="190" x2="430" y2="190"/>
  </g>
  <g font-size="11" fill="#64748b">
    <text x="180" y="388" text-anchor="middle">5</text>
    <text x="255" y="388" text-anchor="middle">10</text>
    <text x="330" y="388" text-anchor="middle">15</text>
    <text x="405" y="388" text-anchor="middle">20</text>
    <text x="96" y="329" text-anchor="end">0.15</text>
    <text x="96" y="284" text-anchor="end">0.3</text>
    <text x="96" y="239" text-anchor="end">0.45</text>
    <text x="96" y="194" text-anchor="end">0.6</text>
  </g>

  <path class="p62-curve" d="M145 150 C160 170 168 182 180 190 C200 250 225 275 255 280 C300 290 355 320 405 325"
        fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#059669">
    <circle class="p62-dot" cx="180" cy="190" r="5"/>
    <circle class="p62-dot p62-dot2" cx="255" cy="280" r="5"/>
    <circle class="p62-dot p62-dot3" cx="405" cy="325" r="5"/>
  </g>
  <text class="p62-label" x="250" y="160" font-size="12" font-weight="800" fill="#047857">R 增大，I 迅速减小</text>

  <text x="271" y="394" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">U 一定时，R 越大，I 越小，且 I×R 为定值</text>

  <rect x="516" y="100" width="348" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="536" y="116" width="180" height="28" rx="14" fill="#e6f7f1"/>
  <text x="626" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">实验数据</text>

  <rect x="536" y="158" width="308" height="30" fill="#e6f7f1"/>
  <text x="586" y="178" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">R/Ω</text>
  <text x="681" y="178" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">I/A</text>
  <text x="784" y="178" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">I×R</text>

  <rect x="536" y="188" width="308" height="32" fill="#f8fbff"/>
  <text x="586" y="209" font-size="12" fill="#334155" text-anchor="middle">5</text>
  <text x="681" y="209" font-size="12" fill="#334155" text-anchor="middle">0.6</text>
  <text x="784" y="209" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">3</text>

  <rect x="536" y="220" width="308" height="32" fill="#ffffff"/>
  <text x="586" y="241" font-size="12" fill="#334155" text-anchor="middle">10</text>
  <text x="681" y="241" font-size="12" fill="#334155" text-anchor="middle">0.3</text>
  <text x="784" y="241" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">3</text>

  <rect x="536" y="252" width="308" height="32" fill="#f8fbff"/>
  <text x="586" y="273" font-size="12" fill="#334155" text-anchor="middle">20</text>
  <text x="681" y="273" font-size="12" fill="#334155" text-anchor="middle">0.15</text>
  <text x="784" y="273" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">3</text>

  <g class="p62-eq">
    <text x="690" y="316" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">I × R = U = 3 V</text>
  </g>
  <text x="690" y="344" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">乘积不变 → I 与 R 成反比</text>
  <text x="690" y="370" font-size="11.5" fill="#64748b" text-anchor="middle">图像是双曲线的一支</text>
  <text x="690" y="392" font-size="11" fill="#b45309" text-anchor="middle">反比的前提：U 保持不变</text>
</g>
</svg>
