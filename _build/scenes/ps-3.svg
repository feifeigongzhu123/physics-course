<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="带电粒子在平行板电场中的偏转：类平抛与示波管">
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">带电粒子的偏转：电场里的“类平抛”</text>

  <!-- 电子枪 -->
  <g class="ps3-gun">
    <rect x="80" y="270" width="100" height="60" rx="10" fill="#334155"/>
    <rect x="94" y="284" width="46" height="32" rx="5" fill="#0f172a"/>
    <text x="117" y="305" font-size="11" font-weight="800" fill="#86efac" text-anchor="middle">e⁻</text>
    <text x="130" y="352" font-size="12" fill="#64748b" text-anchor="middle">电子枪</text>
    <line x1="180" y1="300" x2="350" y2="300" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="245" y="288" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">v₀</text>
  </g>

  <!-- 平行板 -->
  <g class="ps3-plates">
    <rect x="350" y="210" width="200" height="10" rx="3" fill="#94a3b8"/>
    <rect x="350" y="380" width="200" height="10" rx="3" fill="#94a3b8"/>
    <text x="560" y="218" font-size="16" font-weight="900" fill="#dc2626">+</text>
    <text x="560" y="394" font-size="18" font-weight="900" fill="#1d4ed8">−</text>
    <text x="450" y="196" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">上极板</text>
    <text x="450" y="416" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">下极板</text>
    <text x="572" y="300" font-size="13" font-weight="800" fill="#1e3a8a">E = U/d</text>
    <text x="572" y="322" font-size="11.5" fill="#64748b">板间为匀强电场</text>
  </g>

  <!-- 电场线 -->
  <g class="ps3-field" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 6">
    <line x1="386" y1="224" x2="386" y2="374" marker-end="url(#arrBlue)"/>
    <line x1="450" y1="224" x2="450" y2="374" marker-end="url(#arrBlue)"/>
    <line x1="514" y1="224" x2="514" y2="374" marker-end="url(#arrBlue)"/>
  </g>

  <!-- 荧光屏 -->
  <g class="ps3-screen">
    <rect x="784" y="140" width="12" height="360" rx="6" fill="#334155"/>
    <rect x="786" y="142" width="8" height="356" rx="4" fill="#22c55e" opacity=".55"/>
    <text x="790" y="126" font-size="12.5" font-weight="800" fill="#15803d" text-anchor="middle">荧光屏</text>
    <text x="812" y="176" font-size="11.5" fill="#64748b">亮点</text>
  </g>

  <!-- 第一步：受力 -->
  <g class="ps3-force" data-zone="1">
    <circle cx="418" cy="300" r="7" fill="#dc2626"/>
    <line x1="418" y1="300" x2="418" y2="242" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="432" y="252" font-size="13" font-weight="800" fill="#b91c1c">F = qE</text>
    <text x="410" y="345" font-size="12" font-weight="700" fill="#b91c1c">电子带负电，受力与场强反向</text>
  </g>

  <!-- 第二步：偏转轨迹 -->
  <g class="ps3-deflect" data-zone="2">
    <line x1="350" y1="300" x2="790" y2="300" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>
    <path class="ps3-path" d="M350 300 Q450 300 550 265 L790 181" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="550" cy="265" r="6" fill="#7c3aed"/>
    <text x="538" y="252" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="end">出板点</text>
    <text x="620" y="132" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="middle">偏转后沿直线飞向荧光屏</text>
    <circle class="ps3-spot" cx="790" cy="181" r="7" fill="#22c55e"/>
    <circle class="ps3-spotGlow" cx="790" cy="181" r="17" fill="#22c55e" opacity=".28"/>
    <circle class="ps3-electron" r="5" fill="#dc2626">
      <animateMotion dur="3s" repeatCount="indefinite" path="M180 300 L350 300 Q450 300 550 265 L790 181"/>
    </circle>
  </g>

  <!-- 第三步：出射速度分解（放在出板后的直线段上） -->
  <g class="ps3-decomp" data-zone="3">
    <circle cx="640" cy="233" r="6" fill="#334155"/>
    <line x1="640" y1="233" x2="712" y2="233" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <line x1="640" y1="233" x2="640" y2="161" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <line x1="640" y1="233" x2="712" y2="208" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <path d="M688 233 A48 48 0 0 1 683 221" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="676" y="254" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">vx = v₀</text>
    <text x="652" y="184" font-size="12.5" font-weight="800" fill="#047857">vy = at</text>
    <text x="720" y="204" font-size="13" font-weight="900" fill="#6d28d9">v</text>
    <text x="694" y="226" font-size="13" font-weight="900" fill="#6d28d9">θ</text>

    <g>
      <rect x="590" y="356" width="274" height="128" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="727" y="382" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">示波管的偏转规律</text>
      <text x="727" y="408" font-size="12.5" fill="#334155" text-anchor="middle">tanθ = vy / vx = at / v₀</text>
      <text x="727" y="432" font-size="12.5" fill="#334155" text-anchor="middle">y = ½at² = qUL²/(2mdv₀²)</text>
      <text x="727" y="458" font-size="11.5" fill="#64748b" text-anchor="middle">y 与 U 成正比，与 v₀² 成反比</text>
    </g>
  </g>
</svg>
