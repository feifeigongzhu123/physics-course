<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电路中的能量转化：电功与电热、纯电阻与非纯电阻电路、电动机的能量分配">
<style>
[data-scene="ps-53"] .s53-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-53"].s1 .s53-step1,[data-scene="ps-53"].s2 .s53-step2,[data-scene="ps-53"].s3 .s53-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s53draw{to{stroke-dashoffset:0}}
@keyframes s53pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s53rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes s53grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes s53pulse{0%,100%{opacity:.45}50%{opacity:1}}
[data-scene="ps-53"].s1 .s53-loop{stroke-dasharray:1000;stroke-dashoffset:1000;animation:s53draw 1.1s ease .1s both}
[data-scene="ps-53"].s1 .s53-chip{animation:s53rise .5s ease both}
[data-scene="ps-53"].s1 .s53-f1{animation-delay:.35s}
[data-scene="ps-53"].s1 .s53-f2{animation-delay:.5s}
[data-scene="ps-53"].s1 .s53-flow{animation:s53rise .5s ease .6s both}
[data-scene="ps-53"].s2 .s53-col{transform-box:fill-box;transform-origin:center;animation:s53rise .5s ease both}
[data-scene="ps-53"].s2 .s53-col2{animation-delay:.15s}
[data-scene="ps-53"].s3 .s53-motor{transform-box:fill-box;transform-origin:center;animation:s53pop .55s ease both}
[data-scene="ps-53"].s3 .s53-bar{transform-box:fill-box;transform-origin:left center;animation:s53grow .8s ease .3s both}
[data-scene="ps-53"].s3 .s53-spark{animation:s53pulse 1.5s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电路中的能量转化：电功与电热</text>

<!-- 第一步：电功和电热 -->
<g class="s53-step s53-step1" data-zone="1">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 电流做功与电流发热</text>

  <rect x="46" y="100" width="520" height="330" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <path class="s53-loop" d="M110 320 V160 H480 V220 M480 280 V320 H346 M330 320 H110" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <rect x="468" y="220" width="24" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <line x1="330" y1="302" x2="330" y2="338" stroke="#334155" stroke-width="4"/>
  <line x1="346" y1="308" x2="346" y2="332" stroke="#334155" stroke-width="4"/>
  <line x1="240" y1="160" x2="290" y2="160" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrBlue)"/>
  <text x="265" y="148" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">I</text>
  <text x="500" y="254" font-size="13" font-weight="800" fill="#92400e" text-anchor="start">R</text>

  <g class="s53-chip s53-f1">
    <rect x="140" y="204" width="230" height="42" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="255" y="232" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">W = UIt</text>
  </g>
  <g class="s53-chip s53-f2">
    <rect x="140" y="258" width="230" height="42" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="255" y="286" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">Q = I²Rt</text>
  </g>
  <text x="255" y="378" font-size="12" fill="#64748b" text-anchor="middle">电流通过电阻，电能转化为内能</text>

  <rect x="586" y="100" width="264" height="330" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="602" y="128" font-size="13.5" font-weight="800" fill="#1e3a8a">两个概念</text>
  <text x="602" y="160" font-size="13" font-weight="900" fill="#1d4ed8">电功 W</text>
  <text x="602" y="184" font-size="11.5" fill="#475569">电能 → 其他形式的能</text>
  <text x="602" y="210" font-size="13" font-weight="800" fill="#1e3a8a">W = UIt</text>
  <text x="602" y="234" font-size="11.5" fill="#475569">单位：焦耳（J）</text>
  <line x1="602" y1="250" x2="834" y2="250" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="602" y="276" font-size="13" font-weight="900" fill="#b45309">电热 Q</text>
  <text x="602" y="300" font-size="11.5" fill="#475569">电流的热效应</text>
  <text x="602" y="326" font-size="13" font-weight="800" fill="#b45309">Q = I²Rt</text>
  <text x="602" y="350" font-size="11.5" fill="#475569">焦耳定律，单位 J</text>
  <text x="602" y="384" font-size="11.5" font-weight="800" fill="#b91c1c">W 与 Q 不一定相等</text>

  <g class="s53-flow">
    <rect x="50" y="446" width="150" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="125" y="472" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">电能</text>
    <text x="125" y="492" font-size="11" fill="#1e40af" text-anchor="middle">W = UIt</text>
    <line x1="200" y1="476" x2="250" y2="476" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>

    <rect x="254" y="446" width="180" height="60" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <text x="344" y="472" font-size="14" font-weight="900" fill="#334155" text-anchor="middle">用电器 R</text>
    <text x="344" y="492" font-size="11" fill="#64748b" text-anchor="middle">电流通过</text>

    <path d="M434 476 H560 V457 H596" fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrAmber)"/>
    <path d="M560 476 V512 H596" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
    <rect x="600" y="440" width="250" height="34" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="725" y="462" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">内能 Q = I²Rt</text>
    <rect x="600" y="490" width="250" height="34" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="725" y="512" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">其他形式的能</text>
  </g>
</g>

<!-- 第二步：纯电阻与非纯电阻 -->
<g class="s53-step s53-step2" data-zone="2">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 纯电阻电路与非纯电阻电路</text>

  <g class="s53-col">
    <rect x="46" y="100" width="378" height="396" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="46" y="100" width="378" height="48" rx="16" fill="#dcfce7"/>
    <text x="64" y="131" font-size="16" font-weight="900" fill="#047857">纯电阻电路</text>
    <text x="406" y="131" font-size="13" font-weight="900" fill="#047857" text-anchor="end">W = Q</text>

    <g font-size="12.5" fill="#334155">
      <text x="64" y="184">只有电阻元件</text>
      <text x="64" y="216">电能全部转化为内能</text>
      <text x="64" y="256" font-weight="800" fill="#047857">欧姆定律成立：U = IR</text>
      <text x="64" y="296" font-weight="800">W = Q = UIt = I²Rt</text>
      <text x="64" y="336" font-weight="800">P = UI = I²R = U²/R</text>
    </g>
    <line x1="64" y1="354" x2="406" y2="354" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="64" y="384" font-size="12" fill="#475569">白炽灯、电炉、电饭锅</text>
    <text x="64" y="412" font-size="12" fill="#475569">电烙铁、电热水器</text>

    <rect x="64" y="432" width="342" height="46" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="235" y="460" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">电能 → 内能（100%）</text>
  </g>

  <g class="s53-col s53-col2">
    <rect x="472" y="100" width="378" height="396" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="472" y="100" width="378" height="48" rx="16" fill="#fef3c7"/>
    <text x="490" y="131" font-size="16" font-weight="900" fill="#b45309">非纯电阻电路</text>
    <text x="832" y="131" font-size="13" font-weight="900" fill="#b45309" text-anchor="end">W &gt; Q</text>

    <g font-size="12.5" fill="#334155">
      <text x="490" y="184">含电动机、电解槽等</text>
      <text x="490" y="216">电能只有一部分转化为内能</text>
      <text x="490" y="256" font-weight="800" fill="#b91c1c">欧姆定律不成立：U &gt; IR</text>
      <text x="490" y="296" font-weight="800">P电 = UI，P热 = I²R</text>
      <text x="490" y="336" font-weight="800">P其他 = UI − I²R</text>
    </g>
    <line x1="490" y1="354" x2="832" y2="354" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="490" y="384" font-size="12" fill="#475569">电动机、电解槽</text>
    <text x="490" y="412" font-size="12" fill="#475569">充电电池、电风扇</text>

    <rect x="490" y="432" width="342" height="46" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="661" y="460" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">电能 → 内能 + 机械能等</text>
  </g>

  <rect x="46" y="506" width="804" height="26" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="524" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">先判断电路类型再选公式：纯电阻可互换，非纯电阻只用 P电 = UI、P热 = I²R</text>
</g>

<!-- 第三步：电动机 -->
<g class="s53-step s53-step3" data-zone="3">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 电动机：电能去了哪里</text>

  <rect x="46" y="100" width="392" height="330" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <g class="s53-motor">
    <circle cx="180" cy="240" r="76" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <circle cx="180" cy="240" r="60" fill="#ffffff" stroke="#bae6fd" stroke-width="3"/>
    <text x="180" y="254" font-size="34" font-weight="900" fill="#0369a1" text-anchor="middle">M</text>
  </g>
  <path d="M150 300 L158 292 L168 300 L178 292 L188 300 L198 292 L206 300" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="222" y="302" font-size="11.5" font-weight="800" fill="#b45309">r</text>
  <line x1="256" y1="240" x2="326" y2="240" stroke="#64748b" stroke-width="7"/>
  <rect x="304" y="224" width="22" height="32" rx="3" fill="#94a3b8"/>
  <line x1="54" y1="240" x2="98" y2="240" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="60" y="222" font-size="14" font-weight="900" fill="#b91c1c">U</text>
  <text x="286" y="214" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">I</text>
  <text x="180" y="352" font-size="11.5" fill="#64748b" text-anchor="middle">转子里有内阻 r，线圈也会发热</text>
  <text x="180" y="384" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">输入电能 = 机械能 + 内能</text>

  <rect x="470" y="100" width="380" height="200" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="486" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">例题：U = 220 V，I = 5 A，r = 2 Ω</text>
  <g font-size="13" fill="#334155">
    <text x="486" y="166">P总 = UI = 1100 W</text>
    <text x="486" y="196">P热 = I²r = 50 W</text>
    <text x="486" y="226" font-weight="800" fill="#047857">P机 = P总 − P热 = 1050 W</text>
    <text x="486" y="258" font-weight="800" fill="#1e3a8a">η = 1050 / 1100 ≈ 95.5%</text>
  </g>

  <rect x="470" y="316" width="380" height="170" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="486" y="344" font-size="13.5" font-weight="800" fill="#1e3a8a">能量流向</text>
  <rect class="s53-bar" x="486" y="360" width="348" height="24" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="660" y="377" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">P总 = 1100 W</text>
  <rect class="s53-bar" x="486" y="404" width="16" height="26" rx="4" fill="#fca5a5"/>
  <rect class="s53-bar" x="502" y="404" width="332" height="26" rx="4" fill="#86efac"/>
  <text x="560" y="448" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">热 50 W</text>
  <text x="700" y="448" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">机械 1050 W</text>
  <text x="660" y="474" font-size="11.5" fill="#475569" text-anchor="middle">η = P机 / P总 × 100%</text>

  <rect x="46" y="500" width="804" height="30" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="450" y="520" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">电动机正常工作时 U &gt; Ir：不能用 U = IR 求电流，机械功率只能用 UI − I²r</text>
</g>
</svg>
