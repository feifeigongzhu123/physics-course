<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="能量守恒定律：各种形式的能量相互转化或转移，总量保持不变，第一类永动机不可能">
<style>
[data-scene="ps-113"] .s113-s1,[data-scene="ps-113"] .s113-s2,[data-scene="ps-113"] .s113-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-113"].s1 .s113-s1,[data-scene="ps-113"].s2 .s113-s2,[data-scene="ps-113"].s3 .s113-s3{opacity:1;visibility:visible}
@keyframes s113fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s113pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s113pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s113flow{to{stroke-dashoffset:-36}}
@keyframes s113spin{to{transform:rotate(360deg)}}
[data-scene="ps-113"].s1 .s113-flow{stroke-dasharray:7 6;animation:s113flow 1s linear infinite}
[data-scene="ps-113"].s1 .s113-core{animation:s113pulse 2.2s ease-in-out infinite}
[data-scene="ps-113"].s1 .s113-card{transform-box:fill-box;transform-origin:center;animation:s113pop .55s ease .4s both}
[data-scene="ps-113"].s2 .s113-row{animation:s113fade .45s ease both}
[data-scene="ps-113"].s2 .s113-row2{animation-delay:.1s}
[data-scene="ps-113"].s2 .s113-row3{animation-delay:.2s}
[data-scene="ps-113"].s2 .s113-row4{animation-delay:.3s}
[data-scene="ps-113"].s2 .s113-row5{animation-delay:.4s}
[data-scene="ps-113"].s2 .s113-row6{animation-delay:.5s}
[data-scene="ps-113"].s2 .s113-chip{transform-box:fill-box;transform-origin:center;animation:s113pop .5s ease .45s both}
[data-scene="ps-113"].s3 .s113-gear{transform-box:fill-box;transform-origin:center;animation:s113spin 7s linear infinite}
[data-scene="ps-113"].s3 .s113-top{transform-box:fill-box;transform-origin:center;animation:s113pop .55s ease .25s both}
[data-scene="ps-113"].s3 .s113-bottom{animation:s113fade .5s ease .55s both}
[data-scene="ps-113"].s3 .s113-card{animation:s113fade .5s ease .7s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">能量守恒定律：转化与转移中的总量不变</text>

<!-- 第一步：定律内容 -->
<g class="s113-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">能量守恒定律：能量不会凭空产生，也不会凭空消失</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">转化与转移中的能量</text>

  <rect x="80" y="150" width="130" height="46" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="179" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">机械能</text>
  <rect x="382" y="150" width="130" height="46" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="447" y="179" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">内能</text>
  <rect x="80" y="356" width="130" height="46" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="145" y="385" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">电能</text>
  <rect x="382" y="356" width="130" height="46" rx="10" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="447" y="385" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">化学能</text>

  <line class="s113-flow" x1="145" y1="198" x2="222" y2="246" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line class="s113-flow" x1="447" y1="198" x2="370" y2="246" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line class="s113-flow" x1="145" y1="354" x2="222" y2="314" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line class="s113-flow" x1="447" y1="354" x2="370" y2="314" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>

  <g class="s113-core">
    <rect x="196" y="250" width="200" height="60" rx="30" fill="#1d4ed8"/>
    <text x="296" y="278" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">总量保持不变</text>
    <text x="296" y="298" font-size="11" fill="#dbeafe" text-anchor="middle">E 总 = 常量</text>
  </g>

  <text x="296" y="426" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">一种形式减少多少，另一种形式就增加多少</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">转化和转移</text>

  <g class="s113-card">
    <rect x="596" y="156" width="248" height="86" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="610" y="180" font-size="12.5" font-weight="900" fill="#b45309">转化</text>
    <text x="610" y="204" font-size="11" fill="#92400e">一种形式的能 → 另一种形式的能</text>
    <text x="610" y="228" font-size="11" fill="#92400e">例：摩擦生热、燃料燃烧</text>

    <rect x="596" y="254" width="248" height="86" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="610" y="278" font-size="12.5" font-weight="900" fill="#1e3a8a">转移</text>
    <text x="610" y="302" font-size="11" fill="#1e40af">能量从一个物体 → 另一个物体</text>
    <text x="610" y="326" font-size="11" fill="#1e40af">例：热传递、碰撞传能</text>
  </g>

  <text x="720" y="370" font-size="11.5" fill="#334155" text-anchor="middle">转化和转移中，能量总量保持不变</text>
  <text x="720" y="394" font-size="11" fill="#64748b" text-anchor="middle">这就是能量守恒定律的核心</text>
  <text x="720" y="422" font-size="17" font-weight="900" fill="#1d4ed8" text-anchor="middle">E 总 = 常量</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量既不会凭空产生，也不会凭空消失，转化和转移中总量保持不变</text>
</g>

<!-- 第二步：普遍性 -->
<g class="s113-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">普遍性：机械能、内能、电能、化学能、核能之间都能相互转化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">各种形式的能量转化</text>

  <g class="s113-row">
    <rect x="56" y="148" width="500" height="31" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="169" font-size="11.5" font-weight="800" fill="#334155">摩擦生热</text>
    <text x="250" y="169" font-size="11.5" font-weight="700" fill="#b45309">机械能 → 内能</text>
  </g>
  <g class="s113-row s113-row2">
    <rect x="56" y="186" width="500" height="31" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="207" font-size="11.5" font-weight="800" fill="#334155">燃料燃烧</text>
    <text x="250" y="207" font-size="11.5" font-weight="700" fill="#b45309">化学能 → 内能</text>
  </g>
  <g class="s113-row s113-row3">
    <rect x="56" y="224" width="500" height="31" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="245" font-size="11.5" font-weight="800" fill="#334155">发电机</text>
    <text x="250" y="245" font-size="11.5" font-weight="700" fill="#1e40af">机械能 → 电能</text>
  </g>
  <g class="s113-row s113-row4">
    <rect x="56" y="262" width="500" height="31" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="283" font-size="11.5" font-weight="800" fill="#334155">电动机</text>
    <text x="250" y="283" font-size="11.5" font-weight="700" fill="#1e40af">电能 → 机械能</text>
  </g>
  <g class="s113-row s113-row5">
    <rect x="56" y="300" width="500" height="31" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="321" font-size="11.5" font-weight="800" fill="#334155">核反应</text>
    <text x="250" y="321" font-size="11.5" font-weight="700" fill="#b91c1c">核能 → 内能</text>
  </g>
  <g class="s113-row s113-row6">
    <rect x="56" y="338" width="500" height="31" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="68" y="359" font-size="11.5" font-weight="800" fill="#334155">光合作用</text>
    <text x="250" y="359" font-size="11.5" font-weight="700" fill="#047857">光能 → 化学能</text>
  </g>

  <text x="296" y="396" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">不同形式的能量之间可以相互转化</text>
  <text x="296" y="420" font-size="11" fill="#64748b" text-anchor="middle">任何转化过程中，能量总量都保持不变</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">普遍性与统一性</text>

  <g class="s113-chip">
    <rect x="596" y="156" width="118" height="40" rx="9" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="655" y="181" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">机械能</text>
    <rect x="726" y="156" width="118" height="40" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="785" y="181" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">内能</text>
    <rect x="596" y="204" width="118" height="40" rx="9" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="655" y="229" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">电能</text>
    <rect x="726" y="204" width="118" height="40" rx="9" fill="#f3e8ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="785" y="229" font-size="11.5" font-weight="800" fill="#6d28d9" text-anchor="middle">化学能</text>
    <rect x="596" y="252" width="118" height="40" rx="9" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
    <text x="655" y="277" font-size="11.5" font-weight="800" fill="#a16207" text-anchor="middle">光能</text>
    <rect x="726" y="252" width="118" height="40" rx="9" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="785" y="277" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">核能</text>
  </g>

  <line x1="590" y1="312" x2="834" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="336" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">自然界最普遍、最重要的</text>
  <text x="720" y="358" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">基本定律之一</text>
  <text x="720" y="384" font-size="11" fill="#475569" text-anchor="middle">一切自然过程都遵守能量守恒</text>
  <text x="720" y="408" font-size="11" fill="#475569" text-anchor="middle">不同运动形式通过能量相互联系</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">机械能、内能、电能、化学能、核能……各种能量在转化中总量守恒</text>
</g>

<!-- 第三步：意义 -->
<g class="s113-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">意义：能量守恒把各种自然现象联系起来，第一类永动机不可能</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么永动机不可能</text>

  <g class="s113-top">
    <rect x="56" y="150" width="480" height="108" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <g class="s113-gear">
      <circle cx="110" cy="204" r="30" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
      <circle cx="110" cy="204" r="8" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
      <line x1="140" y1="204" x2="148" y2="204" stroke="#b91c1c" stroke-width="3"/>
      <line x1="131" y1="183" x2="137" y2="177" stroke="#b91c1c" stroke-width="3"/>
      <line x1="110" y1="174" x2="110" y2="166" stroke="#b91c1c" stroke-width="3"/>
      <line x1="89" y1="183" x2="83" y2="177" stroke="#b91c1c" stroke-width="3"/>
      <line x1="80" y1="204" x2="72" y2="204" stroke="#b91c1c" stroke-width="3"/>
      <line x1="89" y1="225" x2="83" y2="231" stroke="#b91c1c" stroke-width="3"/>
      <line x1="110" y1="234" x2="110" y2="242" stroke="#b91c1c" stroke-width="3"/>
      <line x1="131" y1="225" x2="137" y2="231" stroke="#b91c1c" stroke-width="3"/>
    </g>
    <text x="165" y="180" font-size="11.5" font-weight="800" fill="#991b1b">设想：不消耗能量，却能不断对外做功</text>
    <text x="165" y="212" font-size="13" font-weight="900" fill="#b91c1c">违背能量守恒定律</text>
    <text x="165" y="238" font-size="11.5" fill="#991b1b">所以第一类永动机不可能制成</text>
    <line x1="450" y1="182" x2="486" y2="218" stroke="#dc2626" stroke-width="4"/>
    <line x1="486" y1="182" x2="450" y2="218" stroke="#dc2626" stroke-width="4"/>
  </g>

  <g class="s113-bottom">
    <rect x="56" y="278" width="480" height="112" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="296" y="318" font-size="17" font-weight="900" fill="#047857" text-anchor="middle">输入能量 = 输出能量</text>
    <text x="296" y="346" font-size="11.5" fill="#065f46" text-anchor="middle">能量只能转化或转移，不能凭空创生</text>
    <text x="296" y="370" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">总量始终保持不变</text>
    <polyline points="480,338 492,350 514,326" fill="none" stroke="#059669" stroke-width="4"/>
  </g>

  <text x="296" y="424" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">第一类永动机不可能制成</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">定律的意义</text>

  <g class="s113-card">
    <circle cx="610" cy="176" r="12" fill="#dbeafe"/>
    <text x="610" y="181" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="632" y="181" font-size="11.5" font-weight="800" fill="#334155">为科学研究提供重要依据</text>
    <text x="632" y="202" font-size="11" fill="#64748b">分析能量问题时必须遵守</text>

    <circle cx="610" cy="236" r="12" fill="#fef3c7"/>
    <text x="610" y="241" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">2</text>
    <text x="632" y="241" font-size="11.5" font-weight="800" fill="#334155">把各种自然现象联系起来</text>
    <text x="632" y="262" font-size="11" fill="#64748b">力、热、电、光统一于能量</text>

    <circle cx="610" cy="296" r="12" fill="#dbeafe"/>
    <text x="610" y="301" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="632" y="301" font-size="11.5" font-weight="800" fill="#334155">指导能源利用与节能</text>
    <text x="632" y="322" font-size="11" fill="#64748b">能量总量有限，要节约使用</text>
  </g>

  <rect x="590" y="338" width="260" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="362" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="middle">第一类永动机</text>
  <text x="720" y="384" font-size="11" fill="#991b1b" text-anchor="middle">违背能量守恒，不可能制成</text>

  <text x="720" y="424" font-size="11" fill="#64748b" text-anchor="middle">能量守恒是自然界最基本的规律之一</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">第一类永动机违背能量守恒定律，永远不可能制成</text>
</g>
</svg>
