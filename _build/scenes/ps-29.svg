<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="生活中的圆周运动：火车转弯、汽车过拱桥与离心运动">
<style>
[data-scene="ps-29"] .s29-step1,[data-scene="ps-29"] .s29-step2,[data-scene="ps-29"] .s29-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-29"].s1 .s29-step1,[data-scene="ps-29"].s2 .s29-step2,[data-scene="ps-29"].s3 .s29-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s29draw{to{stroke-dashoffset:0}}
@keyframes s29pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s29pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes s29drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}
[data-scene="ps-29"].s1 .s29-f{animation:s29pulse 1.9s ease-in-out infinite}
[data-scene="ps-29"].s3 .s29-orbit{stroke-dasharray:8 6;stroke-dashoffset:700;animation:s29draw 1.4s ease forwards}
[data-scene="ps-29"].s3 .s29-ball{transform-box:fill-box;transform-origin:center;animation:s29drift 2.4s ease-in-out infinite}
[data-scene="ps-29"].s2 .s29-card,[data-scene="ps-29"].s3 .s29-card{transform-box:fill-box;transform-origin:center;animation:s29pop .45s ease both}
[data-scene="ps-29"].s3 .s29-card2{animation-delay:.1s}
[data-scene="ps-29"].s3 .s29-card3{animation-delay:.2s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="560" width="900" height="60" fill="url(#gBench)"/>
<line x1="0" y1="560" x2="900" y2="560" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">生活中的圆周运动：转弯、拱桥与离心</text>

<!-- 第一步：火车转弯 -->
<g class="s29-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">火车转弯：外轨略高于内轨，重力和支持力的合力提供向心力</text>

  <polygon points="160,420 570,360 570,440 160,440" fill="#e8eef7"/>
  <line x1="160" y1="420" x2="570" y2="360" stroke="#94a3b8" stroke-width="3"/>
  <line x1="90" y1="440" x2="600" y2="440" stroke="#cbd5e1" stroke-width="3"/>

  <g transform="rotate(-8.3 400 328)">
    <rect x="310" y="304" width="180" height="48" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <rect x="326" y="314" width="34" height="20" rx="4" fill="#93c5fd"/>
    <rect x="382" y="314" width="34" height="20" rx="4" fill="#93c5fd"/>
    <rect x="438" y="314" width="34" height="20" rx="4" fill="#93c5fd"/>
  </g>
  <circle cx="345" cy="366" r="9" fill="#475569"/>
  <circle cx="470" cy="348" r="9" fill="#475569"/>

  <line x1="300" y1="392" x2="300" y2="404" stroke="#334155" stroke-width="9"/>
  <line x1="480" y1="366" x2="480" y2="378" stroke="#334155" stroke-width="9"/>
  <text x="300" y="428" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">内轨</text>
  <text x="480" y="404" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">外轨</text>
  <line x1="300" y1="388" x2="480" y2="388" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <line x1="480" y1="388" x2="480" y2="368" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="490" y="382" font-size="11.5" font-weight="700" fill="#475569">h</text>

  <line x1="400" y1="328" x2="400" y2="250" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5"/>
  <g class="s29-f" stroke-width="3">
    <line x1="400" y1="328" x2="400" y2="414" stroke="#dc2626" marker-end="url(#arrRed)"/>
    <line x1="400" y1="328" x2="388" y2="246" stroke="#059669" marker-end="url(#arrGreen)"/>
    <line x1="400" y1="328" x2="322" y2="328" stroke="#d97706" marker-end="url(#arrAmber)"/>
  </g>
  <text x="388" y="414" font-size="12.5" font-weight="800" fill="#b91c1c">mg</text>
  <text x="366" y="262" font-size="12.5" font-weight="800" fill="#047857">N</text>
  <text x="346" y="318" font-size="12.5" font-weight="800" fill="#b45309">F合</text>
  <text x="394" y="276" font-size="12" font-weight="800" fill="#475569">θ</text>
  <text x="400" y="466" font-size="12" fill="#475569" text-anchor="middle">圆心在弯道内侧（左侧）</text>

  <g class="s29-card">
    <rect x="590" y="110" width="250" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">规定速度 v₀</text>
    <g font-size="12.5" fill="#334155">
      <text x="610" y="180">外轨高于内轨，倾角为 θ</text>
      <text x="610" y="212">mg tanθ = m v₀² / r</text>
      <text x="610" y="244">v₀ = √(g r tanθ)</text>
      <text x="610" y="276">tanθ ≈ h / L</text>
    </g>
    <line x1="610" y1="296" x2="820" y2="296" stroke="#e2e8f0" stroke-width="1.5"/>
    <g font-size="12.5" fill="#334155">
      <text x="610" y="324">v ＞ v₀：外轨受挤压</text>
      <text x="610" y="354">v ＜ v₀：内轨受挤压</text>
      <text x="610" y="384" fill="#b45309" font-weight="800">v = v₀：轮缘不挤压轨道</text>
    </g>
  </g>

  <rect x="70" y="478" width="760" height="60" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="505" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">当 v = v₀ 时，重力和支持力的合力恰好提供向心力</text>
  <text x="450" y="528" font-size="12" fill="#475569" text-anchor="middle">此时轮缘与内外轨都不挤压，轨道磨损最小</text>
</g>

<!-- 第二步：汽车过拱桥 -->
<g class="s29-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">汽车过拱桥最高点：重力和支持力的合力提供向心力</text>

  <path d="M100 430 Q300 250 500 430" fill="none" stroke="#cbd5e1" stroke-width="14"/>
  <path d="M100 430 Q300 250 500 430" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="274" y="313" width="52" height="20" rx="6" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  <circle cx="286" cy="337" r="5" fill="#1e293b"/><circle cx="314" cy="337" r="5" fill="#1e293b"/>

  <line x1="300" y1="335" x2="300" y2="420" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="300" y1="313" x2="300" y2="247" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
  <line x1="300" y1="345" x2="300" y2="430" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="286" y="410" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="end">mg</text>
  <text x="312" y="268" font-size="12.5" font-weight="800" fill="#047857">N</text>
  <text x="312" y="396" font-size="12" font-weight="700" fill="#475569">r</text>

  <g class="s29-card">
    <rect x="560" y="110" width="280" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="700" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">最高点的受力</text>
    <text x="700" y="184" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">mg − N = m v² / r</text>
    <text x="700" y="222" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">N = mg − m v² / r</text>
    <g font-size="12.5" fill="#334155">
      <text x="580" y="262">v 越大，支持力 N 越小</text>
      <text x="580" y="292">N = 0 时，v = √(gr)</text>
      <text x="580" y="322">此时汽车将腾空</text>
      <text x="580" y="352" fill="#b45309" font-weight="800">所以拱桥必须限速</text>
      <text x="580" y="386" fill="#b91c1c">凹形桥相反：N ＞ mg</text>
    </g>
  </g>

  <rect x="70" y="468" width="760" height="70" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="496" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">过拱桥：支持力小于重力，汽车处于失重状态，速度越大越“轻”</text>
  <text x="450" y="522" font-size="12.5" fill="#7c5a30" text-anchor="middle">过凹形桥：支持力大于重力，汽车处于超重状态</text>
</g>

<!-- 第三步：离心运动 -->
<g class="s29-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">外界提供的向心力不足时，物体做逐渐远离圆心的离心运动</text>

  <circle class="s29-orbit" cx="300" cy="310" r="110" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="300" cy="310" r="4.5" fill="#334155"/>
  <text x="300" y="336" font-size="12" fill="#475569" text-anchor="middle">O</text>

  <g class="s29-ball">
    <circle cx="410" cy="310" r="10" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  </g>
  <line x1="400" y1="310" x2="360" y2="310" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="386" y="300" font-size="12" font-weight="800" fill="#b91c1c">F</text>
  <line x1="410" y1="340" x2="410" y2="282" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="420" y="292" font-size="12" font-weight="800" fill="#1d4ed8">v</text>

  <path d="M410 310 C460 272 500 240 525 192" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
  <line x1="410" y1="310" x2="458" y2="188" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
  <text x="516" y="334" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">F 不足 → 离心</text>
  <text x="444" y="174" font-size="12" font-weight="800" fill="#047857" text-anchor="end">F = 0 → 沿切线飞出</text>
  <text x="300" y="455" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">维持圆周运动需要 Fₙ = mv²/r</text>

  <g class="s29-card">
    <rect x="560" y="110" width="270" height="95" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="560" y="110" width="6" height="95" rx="3" fill="#059669"/>
    <text x="582" y="140" font-size="13.5" font-weight="800" fill="#047857">洗衣机脱水（利用）</text>
    <text x="582" y="166" font-size="11.5" fill="#334155">水滴需要的向心力不足</text>
    <text x="582" y="188" font-size="11.5" fill="#334155">从筒壁小孔飞出</text>
  </g>
  <g class="s29-card s29-card2">
    <rect x="560" y="218" width="270" height="95" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="560" y="218" width="6" height="95" rx="3" fill="#059669"/>
    <text x="582" y="248" font-size="13.5" font-weight="800" fill="#047857">离心分离器（利用）</text>
    <text x="582" y="274" font-size="11.5" fill="#334155">密度不同的物质</text>
    <text x="582" y="296" font-size="11.5" fill="#334155">离心程度不同而分离</text>
  </g>
  <g class="s29-card s29-card3">
    <rect x="560" y="326" width="270" height="95" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="560" y="326" width="6" height="95" rx="3" fill="#dc2626"/>
    <text x="582" y="356" font-size="13.5" font-weight="800" fill="#b91c1c">汽车转弯侧滑（防止）</text>
    <text x="582" y="382" font-size="11.5" fill="#334155">速度过大，静摩擦力</text>
    <text x="582" y="404" font-size="11.5" fill="#334155">不足以提供向心力</text>
  </g>

  <rect x="70" y="470" width="760" height="65" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="498" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断依据：外界提供的合力 F 能否满足 F = mv²/r</text>
  <text x="450" y="523" font-size="12" fill="#475569" text-anchor="middle">F 恰好满足 → 圆周；F 不足 → 离心；F = 0 → 沿切线飞出</text>
</g>
</svg>
