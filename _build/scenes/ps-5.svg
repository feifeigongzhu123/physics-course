<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="时间与位移：时刻和时间间隔、位移和路程、单向直线运动">
<style>
[data-scene="ps-5"] .s5-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-5"].s1 .s5-step1,[data-scene="ps-5"].s2 .s5-step2,[data-scene="ps-5"].s3 .s5-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s5pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s5grow{from{opacity:0}to{opacity:1}}
@keyframes s5move{from{transform:translateX(0)}to{transform:translateX(520px)}}
[data-scene="ps-5"].s1 .s5-span1{transform-box:fill-box;transform-origin:left center;animation:s5grow .6s ease .2s both}
[data-scene="ps-5"].s1 .s5-span2{transform-box:fill-box;transform-origin:left center;animation:s5grow .6s ease .5s both}
[data-scene="ps-5"].s1 .s5-mark{animation:s5pop .5s ease .8s both}
[data-scene="ps-5"].s2 .s5-path{animation:s5grow 1s ease .1s both}
[data-scene="ps-5"].s2 .s5-disp{animation:s5grow .5s ease .9s both}
[data-scene="ps-5"].s3 .s5-ball{transform-box:view-box;animation:s5move 3s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">时间 位移：时刻与时间间隔，位移与路程</text>

<!-- 第一步：时刻与时间间隔 -->
<g class="s5-step s5-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">时刻是时间轴上的一个点，时间间隔是一段</text>

  <rect x="560" y="98" width="290" height="32" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="705" y="119" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">时刻：时间轴上的一个点</text>
  <rect x="560" y="138" width="290" height="32" rx="9" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <text x="705" y="159" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">时间间隔：时间轴上的一段</text>

  <line x1="110" y1="330" x2="830" y2="330" stroke="#334155" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <g stroke="#64748b" stroke-width="1.8">
    <line x1="140" y1="324" x2="140" y2="336"/>
    <line x1="270" y1="324" x2="270" y2="336"/>
    <line x1="400" y1="324" x2="400" y2="336"/>
    <line x1="530" y1="324" x2="530" y2="336"/>
    <line x1="660" y1="324" x2="660" y2="336"/>
    <line x1="790" y1="324" x2="790" y2="336"/>
  </g>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="140" y="356">0</text>
    <text x="270" y="356">1</text>
    <text x="400" y="356">2</text>
    <text x="530" y="356">3</text>
    <text x="660" y="356">4</text>
    <text x="790" y="356">5</text>
  </g>
  <text x="838" y="316" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">t/s</text>

  <line x1="400" y1="240" x2="400" y2="322" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/>
  <g class="s5-mark">
    <circle cx="400" cy="330" r="6.5" fill="#dc2626"/>
    <text x="400" y="226" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">第 2 s 末（时刻）</text>
  </g>

  <rect class="s5-span1" x="140" y="372" width="260" height="10" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.2"/>
  <line x1="140" y1="368" x2="140" y2="386" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="400" y1="368" x2="400" y2="386" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="270" y="404" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">前 2 s 内（时间间隔）</text>

  <rect class="s5-span2" x="400" y="422" width="130" height="10" rx="5" fill="#bbf7d0" stroke="#059669" stroke-width="1.2"/>
  <line x1="400" y1="418" x2="400" y2="436" stroke="#059669" stroke-width="1.5"/>
  <line x1="530" y1="418" x2="530" y2="436" stroke="#059669" stroke-width="1.5"/>
  <text x="465" y="454" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">第 3 s 内</text>
  <text x="610" y="452" font-size="12" fill="#64748b">第 3 s 初 = 第 2 s 末，是同一时刻</text>
</g>

<!-- 第二步：位移与路程 -->
<g class="s5-step s5-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">位移是矢量：有向线段；路程是标量：轨迹长度</text>

  <path class="s5-path" d="M150 360 C290 150 610 150 750 360" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 6" opacity=".85"/>
  <text x="450" y="128" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">路程：轨迹的实际长度（标量）</text>

  <g class="s5-disp">
    <line x1="164" y1="360" x2="736" y2="360" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrBlue)"/>
    <text x="450" y="342" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">位移：由初位置指向末位置的有向线段（矢量）</text>
  </g>
  <circle cx="150" cy="360" r="7" fill="#1d4ed8"/>
  <circle cx="750" cy="360" r="7" fill="#dc2626"/>
  <text x="150" y="388" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">A</text>
  <text x="750" y="388" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">B</text>

  <rect x="60" y="404" width="370" height="80" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="245" y="428" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">位移（矢量）</text>
  <text x="245" y="452" font-size="12" fill="#334155" text-anchor="middle">大小：A、B 两点间的直线距离</text>
  <text x="245" y="474" font-size="12" fill="#334155" text-anchor="middle">方向：由 A 指向 B</text>

  <rect x="470" y="404" width="370" height="80" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="655" y="428" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">路程（标量）</text>
  <text x="655" y="452" font-size="12" fill="#334155" text-anchor="middle">只有大小，没有方向</text>
  <text x="655" y="474" font-size="12" fill="#334155" text-anchor="middle">与走过的具体路径有关</text>
</g>

<!-- 第三步：单向直线运动 -->
<g class="s5-step s5-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">单向直线运动：位移的大小等于路程</text>

  <text x="180" y="286" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">x = 0</text>
  <text x="700" y="286" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">x = 5 m</text>

  <line x1="180" y1="260" x2="700" y2="260" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrBlue)"/>
  <text x="440" y="246" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">位移 Δx = +5 m（方向向右）</text>

  <line x1="180" y1="310" x2="700" y2="310" stroke="#059669" stroke-width="3.5" stroke-dasharray="9 7"/>
  <text x="440" y="338" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">路程 s = 5 m</text>

  <circle cx="180" cy="310" r="7" fill="#1d4ed8"/>
  <circle cx="700" cy="310" r="7" fill="#dc2626"/>
  <g class="s5-ball"><circle cx="180" cy="310" r="8" fill="#f97316" stroke="#c2410c" stroke-width="1.6"/></g>
  <text x="180" y="362" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">A</text>
  <text x="700" y="362" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">B</text>

  <rect x="60" y="372" width="370" height="112" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="245" y="396" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">单向直线运动</text>
  <text x="245" y="420" font-size="12" fill="#334155" text-anchor="middle">位移大小 = 路程 = 5 m</text>
  <text x="245" y="444" font-size="12" fill="#334155" text-anchor="middle">位移方向沿运动方向（向右）</text>
  <text x="245" y="468" font-size="11.5" fill="#64748b" text-anchor="middle">规定正方向后，位移用正、负数表示</text>

  <rect x="470" y="372" width="370" height="112" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="655" y="396" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">若是往返运动（A → B → A）</text>
  <text x="655" y="420" font-size="12" fill="#334155" text-anchor="middle">位移 = 0，路程 = 10 m</text>
  <text x="655" y="444" font-size="12" fill="#334155" text-anchor="middle">一般情况：位移大小 ≤ 路程</text>
  <text x="655" y="468" font-size="11.5" fill="#475569" text-anchor="middle">只有在单向直线运动中两者大小相等</text>
</g>
</svg>
