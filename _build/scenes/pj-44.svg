<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="机械能及其转化：动能与势能、单摆与滚摆的转化、机械能守恒">
  <style>
    .p44-s1,.p44-s2,.p44-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    .p44-s1{opacity:1;visibility:visible}
    [data-scene="pj-44"] .p44-s1,[data-scene="pj-44"] .p44-s2,[data-scene="pj-44"] .p44-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-44"].s1 .p44-s1,[data-scene="pj-44"].s2 .p44-s2,[data-scene="pj-44"].s3 .p44-s3{opacity:1;visibility:visible}
    @keyframes p44bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes p44pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes p44pop{0%{transform:scale(.78);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p44flow{to{stroke-dashoffset:-40}}
    @keyframes p44heat{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:.9;transform:translateY(-5px)}}
    [data-scene="pj-44"].s1 .p44-ball{transform-box:fill-box;transform-origin:center;animation:p44bob 2.1s ease-in-out infinite}
    [data-scene="pj-44"].s1 .p44-pop{transform-box:fill-box;transform-origin:center;animation:p44pop .5s ease both}
    [data-scene="pj-44"].s1 .p44-arrow{animation:p44pulse 1.6s ease-in-out infinite}
    [data-scene="pj-44"].s2 .p44-bob{transform-box:fill-box;transform-origin:center;animation:p44bob 2.4s ease-in-out infinite}
    [data-scene="pj-44"].s2 .p44-roll{transform-box:fill-box;transform-origin:center;animation:p44bob 1.9s ease-in-out infinite}
    [data-scene="pj-44"].s2 .p44-conv{stroke-dasharray:7 6;animation:p44flow 1.4s linear infinite}
    [data-scene="pj-44"].s2 .p44-pop{transform-box:fill-box;transform-origin:center;animation:p44pop .5s ease both}
    [data-scene="pj-44"].s3 .p44-pop{transform-box:fill-box;transform-origin:center;animation:p44pop .5s ease both}
    [data-scene="pj-44"].s3 .p44-heat{animation:p44heat 1.8s ease-in-out infinite}
    [data-scene="pj-44"].s3 .p44-arrow{animation:p44pulse 1.7s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">机械能及其转化：动能与势能相互转化</text>

  <!-- 第一步：机械能 -->
  <g class="p44-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">机械能：动能和势能统称为机械能</text>

    <g class="p44-pop">
      <rect x="50" y="108" width="240" height="174" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="70" y="122" width="120" height="26" rx="13" fill="#e8effc"/>
      <text x="130" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">动能 Ek</text>
      <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
        <line x1="96" y1="188" x2="124" y2="188"/>
        <line x1="90" y1="205" x2="124" y2="205"/>
        <line x1="96" y1="222" x2="124" y2="222"/>
      </g>
      <g class="p44-ball">
        <circle cx="160" cy="205" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
        <circle cx="155" cy="200" r="4" fill="#fef3c7"/>
      </g>
      <text x="170" y="252" font-size="11.5" fill="#64748b" text-anchor="middle">运动的物体</text>
      <text x="170" y="275" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">Ek = mv²/2</text>
    </g>

    <g class="p44-pop">
      <rect x="330" y="108" width="240" height="174" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="350" y="122" width="150" height="26" rx="13" fill="#e8effc"/>
      <text x="425" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">重力势能 Ep</text>
      <line x1="368" y1="258" x2="508" y2="258" stroke="#94a3b8" stroke-width="2.5"/>
      <g class="p44-ball">
        <circle cx="425" cy="212" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      </g>
      <line x1="470" y1="212" x2="470" y2="258" stroke="#1d4ed8" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
      <text x="484" y="240" font-size="13" font-weight="800" fill="#1e40af">h</text>
      <text x="450" y="252" font-size="11.5" fill="#64748b" text-anchor="middle">被举高</text>
      <text x="450" y="278" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">Ep = mgh</text>
    </g>

    <g class="p44-pop">
      <rect x="610" y="108" width="240" height="174" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="630" y="122" width="120" height="26" rx="13" fill="#e8effc"/>
      <text x="690" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">弹性势能</text>
      <rect x="632" y="196" width="12" height="72" rx="2" fill="#64748b"/>
      <path d="M644 232 l8 -14 l12 28 l12 -28 l12 28 l12 -28 l12 28 l8 -14" fill="none" stroke="#059669" stroke-width="3"/>
      <rect x="724" y="212" width="30" height="40" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <line x1="758" y1="232" x2="796" y2="232" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
      <text x="730" y="252" font-size="11.5" fill="#64748b" text-anchor="middle">形变</text>
      <text x="730" y="278" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">形变越大，Ep 越大</text>
    </g>

    <g stroke="#94a3b8" stroke-width="2">
      <line x1="170" y1="288" x2="370" y2="342"/>
      <line x1="450" y1="288" x2="450" y2="342"/>
      <line x1="730" y1="288" x2="530" y2="342"/>
    </g>
    <g class="p44-pop">
      <rect x="310" y="340" width="280" height="56" rx="28" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="450" y="374" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">机械能 E = Ek + Ep</text>
    </g>
    <text x="450" y="438" font-size="12.5" fill="#334155" text-anchor="middle">动能和势能统称为机械能；一个物体可以同时具有动能和势能</text>
  </g>

  <!-- 第二步：动能与势能的转化 -->
  <g class="p44-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">动能与势能可以相互转化：下降时 Ep→Ek，上升时 Ek→Ep</text>

    <rect x="40" y="108" width="400" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="122" width="120" height="26" rx="13" fill="#e8effc"/>
    <text x="120" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">单摆</text>

    <line x1="150" y1="152" x2="330" y2="152" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <path d="M108 300 Q240 438 372 300" fill="none" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="7 6"/>
    <circle cx="108" cy="300" r="11" fill="#fbbf24" opacity=".4"/>
    <circle cx="372" cy="300" r="11" fill="#fbbf24" opacity=".4"/>
    <line x1="240" y1="152" x2="240" y2="342" stroke="#475569" stroke-width="2.5"/>
    <circle cx="240" cy="152" r="5" fill="#334155"/>
    <g class="p44-bob">
      <circle cx="240" cy="360" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
      <circle cx="234" cy="354" r="5" fill="#fef3c7"/>
    </g>
    <text x="70" y="236" font-size="11.5" font-weight="800" fill="#1e3a8a">最高点：v = 0</text>
    <text x="70" y="254" font-size="11.5" fill="#64748b">Ep 最大，Ek 为 0</text>
    <text x="410" y="236" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="end">最高点：v = 0</text>
    <text x="410" y="254" font-size="11.5" fill="#64748b" text-anchor="end">Ep 最大，Ek 为 0</text>
    <line class="p44-conv" x1="150" y1="316" x2="196" y2="350" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <line class="p44-conv" x1="330" y1="316" x2="284" y2="350" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <text x="112" y="354" font-size="11.5" font-weight="800" fill="#047857">Ep→Ek</text>
    <text x="368" y="354" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">Ek→Ep</text>
    <text x="240" y="402" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">最低点：Ek 最大，Ep 最小</text>

    <rect x="460" y="108" width="400" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="122" width="110" height="26" rx="13" fill="#e8effc"/>
    <text x="535" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">滚摆</text>

    <rect x="540" y="150" width="180" height="10" rx="5" fill="#94a3b8"/>
    <line x1="630" y1="195" x2="630" y2="408" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <g class="p44-roll">
      <line x1="562" y1="160" x2="620" y2="272" stroke="#475569" stroke-width="2"/>
      <line x1="698" y1="160" x2="640" y2="272" stroke="#475569" stroke-width="2"/>
      <circle cx="630" cy="278" r="34" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
      <circle cx="630" cy="278" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
      <line x1="604" y1="278" x2="656" y2="278" stroke="#92400e" stroke-width="1.5"/>
    </g>
    <line x1="780" y1="228" x2="780" y2="382" stroke="#1d4ed8" stroke-width="2.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="794" y="292" font-size="11.5" font-weight="800" fill="#1e40af">下降</text>
    <text x="794" y="330" font-size="11.5" font-weight="800" fill="#1e40af">上升</text>
    <text x="630" y="402" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">下降 Ep→Ek；上升 Ek→Ep</text>
  </g>

  <!-- 第三步：机械能守恒 -->
  <g class="p44-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">只有动能和势能相互转化、没有摩擦时，机械能总量不变</text>

    <rect x="40" y="108" width="400" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="122" width="150" height="26" rx="13" fill="#e8effc"/>
    <text x="135" y="140" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">理想：机械能守恒</text>

    <line x1="110" y1="190" x2="400" y2="190" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="396" y="184" font-size="11" fill="#1e40af" text-anchor="end">总量不变</text>
    <text x="170" y="172" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">高处</text>
    <text x="320" y="172" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">低处</text>
    <g class="p44-pop">
      <rect x="130" y="190" width="80" height="110" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="130" y="300" width="80" height="60" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <text x="170" y="250" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">Ep</text>
      <text x="170" y="336" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Ek</text>
    </g>
    <g class="p44-pop">
      <rect x="280" y="190" width="80" height="60" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="280" y="250" width="80" height="110" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <text x="320" y="226" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">Ep</text>
      <text x="320" y="312" font-size="12" font-weight="800" fill="#78350f" text-anchor="middle">Ek</text>
    </g>
    <line x1="130" y1="360" x2="360" y2="360" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="240" y="396" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">动能减少多少，势能就增加多少</text>

    <rect x="460" y="108" width="400" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="122" width="160" height="26" rx="13" fill="#fff7ed"/>
    <text x="560" y="140" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">实际：有摩擦，机械能减少</text>

    <rect x="520" y="190" width="70" height="170" rx="4" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="555" y="382" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">原来</text>
    <line x1="602" y1="275" x2="678" y2="275" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="640" y="262" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">摩擦</text>
    <rect x="700" y="190" width="70" height="50" rx="4" fill="#fed7aa" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="700" y="240" width="70" height="120" rx="4" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="735" y="180" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">→ 内能</text>
    <text x="735" y="382" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">后来</text>
    <g class="p44-heat" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M672 340 q8 -10 0 -20 q-8 -10 0 -20"/>
      <path d="M690 348 q8 -10 0 -20 q-8 -10 0 -20"/>
    </g>
    <text x="660" y="405" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">减少的机械能转化为内能</text>

    <rect x="80" y="426" width="740" height="38" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="450" y="451" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">有摩擦时机械能减少，但能量的总量守恒</text>
  </g>
</svg>
