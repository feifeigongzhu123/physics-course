<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="家庭电路中电流过大的原因：短路、总功率过大与保险丝熔断">
<style>
.p71-s1,.p71-s2,.p71-s3{opacity:0;visibility:hidden}
.p71-s1{opacity:1;visibility:visible}
[data-scene="pj-71"] .p71-s1,[data-scene="pj-71"] .p71-s2,[data-scene="pj-71"] .p71-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-71"].s1 .p71-s1,[data-scene="pj-71"].s2 .p71-s2,[data-scene="pj-71"].s3 .p71-s3{opacity:1;visibility:visible}
@keyframes p71pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p71flow{to{stroke-dashoffset:-44}}
@keyframes p71flash{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes p71rise{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
[data-scene="pj-71"].s1 .p71-card{transform-box:fill-box;transform-origin:center;animation:p71pop .55s ease both}
[data-scene="pj-71"].s1 .p71-card2{animation-delay:.15s}
[data-scene="pj-71"].s2 .p71-flow{stroke-dasharray:12 9;animation:p71flow 1s linear infinite}
[data-scene="pj-71"].s2 .p71-spark{transform-box:fill-box;transform-origin:center;animation:p71flash .9s ease-in-out infinite}
[data-scene="pj-71"].s2 .p71-hit{transform-box:fill-box;transform-origin:center;animation:p71pop .5s ease both}
[data-scene="pj-71"].s2 .p71-hit2{animation-delay:.12s}
[data-scene="pj-71"].s3 .p71-spark{transform-box:fill-box;transform-origin:center;animation:p71flash 1.1s ease-in-out infinite}
[data-scene="pj-71"].s3 .p71-smoke{animation:p71rise 1.8s ease-in-out infinite}
[data-scene="pj-71"].s3 .p71-smoke2{animation-delay:.5s}
[data-scene="pj-71"].s3 .p71-row{transform-box:fill-box;transform-origin:left center;animation:p71pop .5s ease both}
[data-scene="pj-71"].s3 .p71-row2{animation-delay:.12s}
[data-scene="pj-71"].s3 .p71-row3{animation-delay:.24s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">家庭电路中电流过大的原因：短路与总功率过大</text>

<!-- 第一步：两个原因 -->
<g class="p71-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电流过大的两个原因：一是短路，二是用电器总功率过大</text>

  <g class="p71-card">
    <rect x="36" y="100" width="400" height="196" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="56" y="116" width="180" height="28" rx="14" fill="#fee2e2"/>
    <text x="146" y="135" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">原因一：短路</text>

    <line x1="80" y1="190" x2="392" y2="190" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="225" x2="392" y2="225" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <line x1="340" y1="190" x2="340" y2="225" stroke="#334155" stroke-width="5"/>
    <g fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5">
      <polygon points="340,196 347,204 357,205 349,213 351,223 340,217 329,223 331,213 323,205 333,204"/>
    </g>
    <text x="340" y="180" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">短路点</text>
    <text x="84" y="184" font-size="11" font-weight="700" fill="#b91c1c">L 火线</text>
    <text x="84" y="243" font-size="11" font-weight="700" fill="#1e40af">N 零线</text>

    <text x="236" y="258" font-size="12" fill="#334155" text-anchor="middle">火线和零线不经过用电器直接连通</text>
    <text x="236" y="282" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">电阻很小 → 电流很大</text>
  </g>

  <g class="p71-card p71-card2">
    <rect x="464" y="100" width="400" height="196" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="484" y="116" width="220" height="28" rx="14" fill="#fff7ed"/>
    <text x="594" y="135" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">原因二：总功率过大</text>

    <rect x="540" y="200" width="250" height="22" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
      <rect x="558" y="204" width="18" height="12" rx="2"/>
      <rect x="606" y="204" width="18" height="12" rx="2"/>
      <rect x="654" y="204" width="18" height="12" rx="2"/>
      <rect x="702" y="204" width="18" height="12" rx="2"/>
    </g>
    <g>
      <rect x="548" y="158" width="46" height="34" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <path d="M571 166 l-7 10 h8 l-4 10" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="571" y1="192" x2="571" y2="200" stroke="#475569" stroke-width="2"/>
      <rect x="610" y="158" width="46" height="34" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <path d="M633 166 l-7 10 h8 l-4 10" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="633" y1="192" x2="633" y2="200" stroke="#475569" stroke-width="2"/>
      <rect x="672" y="158" width="46" height="34" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <path d="M695 166 l-7 10 h8 l-4 10" fill="none" stroke="#b45309" stroke-width="2"/>
      <line x1="695" y1="192" x2="695" y2="200" stroke="#475569" stroke-width="2"/>
    </g>

    <text x="664" y="258" font-size="12" fill="#334155" text-anchor="middle">多个大功率用电器同时工作</text>
    <text x="664" y="282" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">I总 = P总 / U → 电流过大</text>
  </g>

  <rect x="36" y="316" width="828" height="88" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="342" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么电流会过大？</text>
  <text x="250" y="372" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">短路：I = U / R，R 很小 → I 很大</text>
  <text x="650" y="372" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">总功率过大：I = P总 / U，P总 很大 → I 很大</text>
  <text x="450" y="396" font-size="11.5" fill="#64748b" text-anchor="middle">结果：导线急剧发热，保险装置动作，严重时引起火灾</text>
</g>

<!-- 第二步：短路 -->
<g class="p71-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">短路：火线与零线直接连通，电阻很小，电流极大</text>

  <rect x="36" y="100" width="480" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#fee2e2"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">短路时电流很大</text>

  <line x1="80" y1="190" x2="456" y2="190" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="340" x2="456" y2="340" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <path d="M456 190 V238 M456 290 V340" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="456" cy="264" r="26" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="443" y1="251" x2="469" y2="277" stroke="#d97706" stroke-width="2"/>
  <line x1="469" y1="251" x2="443" y2="277" stroke="#d97706" stroke-width="2"/>

  <line x1="300" y1="190" x2="300" y2="340" stroke="#334155" stroke-width="5"/>
  <g class="p71-spark" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5">
    <polygon points="300,238 308,252 323,254 311,266 315,281 300,272 285,281 289,266 277,254 292,252"/>
  </g>
  <text x="300" y="228" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">短路点</text>

  <path class="p71-flow" d="M100 190 H300 V340 H100" fill="none" stroke="#dc2626" stroke-width="4" opacity=".75"/>
  <polygon points="300,286 290,300 310,300" fill="#dc2626"/>
  <text x="90" y="180" font-size="11.5" font-weight="700" fill="#b91c1c">火线 L</text>
  <text x="90" y="362" font-size="11.5" font-weight="700" fill="#1e40af">零线 N</text>
  <text x="456" y="316" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">用电器被短路</text>

  <text x="276" y="394" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">短路处电阻几乎为零，电流极大，用电器不能工作</text>

  <rect x="536" y="100" width="328" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="556" y="116" width="210" height="28" rx="14" fill="#fff7ed"/>
  <text x="661" y="135" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">短路的危害与原因</text>

  <g class="p71-hit">
    <circle cx="558" cy="168" r="5" fill="#dc2626"/>
    <text x="574" y="173" font-size="11.5" font-weight="700" fill="#334155">导线急剧发热，可能烧毁</text>
  </g>
  <g class="p71-hit p71-hit2">
    <circle cx="558" cy="210" r="5" fill="#dc2626"/>
    <text x="574" y="215" font-size="11.5" font-weight="700" fill="#334155">保险丝熔断或空气开关跳闸</text>
  </g>
  <g>
    <circle cx="558" cy="252" r="5" fill="#dc2626"/>
    <text x="574" y="257" font-size="11.5" font-weight="700" fill="#334155">严重时引发火灾</text>
    <circle cx="558" cy="294" r="5" fill="#dc2626"/>
    <text x="574" y="299" font-size="11.5" font-weight="700" fill="#334155">绝缘层破损、进水导致短路</text>
    <circle cx="558" cy="336" r="5" fill="#dc2626"/>
    <text x="574" y="341" font-size="11.5" font-weight="700" fill="#334155">用电器或插座内部短路</text>
  </g>
  <text x="700" y="384" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">发现短路要及时断电检修</text>
</g>

<!-- 第三步：保险丝 -->
<g class="p71-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">保险丝：电阻较大、熔点较低的铅锑合金，电流过大时熔断</text>

  <rect x="36" y="100" width="480" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="260" height="28" rx="14" fill="#e8effc"/>
  <text x="186" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">保险丝：电流过大时熔断</text>

  <rect x="90" y="160" width="300" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="170" width="26" height="44" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="364" y="170" width="26" height="44" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <line x1="116" y1="192" x2="364" y2="192" stroke="#b45309" stroke-width="3"/>
  <line x1="206" y1="192" x2="274" y2="192" stroke="#f59e0b" stroke-width="5"/>
  <text x="240" y="246" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">正常：电流通过，电路接通</text>

  <rect x="90" y="286" width="300" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="90" y="296" width="26" height="44" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <rect x="364" y="296" width="26" height="44" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  <line x1="116" y1="318" x2="212" y2="318" stroke="#b45309" stroke-width="3"/>
  <line x1="268" y1="318" x2="364" y2="318" stroke="#b45309" stroke-width="3"/>
  <g class="p71-spark" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5">
    <polygon points="240,306 245,315 256,316 248,324 250,335 240,329 230,335 232,324 224,316 235,315"/>
  </g>
  <circle cx="226" cy="326" r="3" fill="#b45309"/>
  <circle cx="254" cy="328" r="3" fill="#b45309"/>
  <text class="p71-smoke" x="222" y="306" font-size="11" fill="#94a3b8">～</text>
  <text class="p71-smoke p71-smoke2" x="258" y="302" font-size="11" fill="#94a3b8">～</text>
  <text x="240" y="372" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">电流过大：保险丝熔断，电路断开</text>

  <rect x="536" y="100" width="328" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="556" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="666" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">材料、作用与选用</text>

  <g class="p71-row">
    <text x="556" y="170" font-size="11.5" font-weight="800" fill="#1e3a8a">材料：电阻较大、熔点较低</text>
    <text x="556" y="192" font-size="11.5" fill="#475569">常用铅锑合金制成</text>
  </g>
  <g class="p71-row p71-row2">
    <text x="556" y="228" font-size="11.5" font-weight="800" fill="#1e3a8a">作用：电流过大时熔断</text>
    <text x="556" y="250" font-size="11.5" fill="#475569">自动切断电路，保护电路</text>
  </g>
  <g class="p71-row p71-row3">
    <text x="556" y="286" font-size="11.5" font-weight="800" fill="#1e3a8a">选用：额定电流略大于</text>
    <text x="556" y="308" font-size="11.5" fill="#475569">电路最大正常工作电流</text>
  </g>

  <rect x="556" y="330" width="288" height="58" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="700" y="352" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">不能用铜丝、铁丝代替保险丝</text>
  <text x="700" y="374" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">熔点高，电流过大时不易熔断</text>
</g>
</svg>
