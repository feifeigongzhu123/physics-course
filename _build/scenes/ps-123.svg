<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="核裂变与核聚变：裂变链式反应、聚变条件、核能应用与前景">
<style>
[data-scene="ps-123"] .s123-step1,[data-scene="ps-123"] .s123-step2,[data-scene="ps-123"] .s123-step3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-123"].s1 .s123-step1,[data-scene="ps-123"].s2 .s123-step2,[data-scene="ps-123"].s3 .s123-step3{opacity:1;visibility:visible}
@keyframes s123fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s123draw{to{stroke-dashoffset:0}}
@keyframes s123pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s123pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s123flow{to{stroke-dashoffset:-36}}
[data-scene="ps-123"].s1 .s123-in{stroke-dasharray:6 4;animation:s123flow 1s linear infinite}
[data-scene="ps-123"].s1 .s123-u{transform-box:fill-box;transform-origin:center;animation:s123pulse 1.8s ease-in-out infinite}
[data-scene="ps-123"].s1 .s123-frag{transform-box:fill-box;transform-origin:center;animation:s123pop .6s ease .3s both}
[data-scene="ps-123"].s1 .s123-frag2{animation-delay:.45s}
[data-scene="ps-123"].s1 .s123-neu{animation:s123pop .5s ease .55s both}
[data-scene="ps-123"].s1 .s123-chain{transform-box:fill-box;transform-origin:center;animation:s123pop .45s ease both}
[data-scene="ps-123"].s1 .s123-chain2{animation-delay:.15s}
[data-scene="ps-123"].s1 .s123-chain3{animation-delay:.3s}
[data-scene="ps-123"].s1 .s123-link{stroke-dasharray:7 5;animation:s123flow 1.2s linear infinite}
[data-scene="ps-123"].s2 .s123-nuc{transform-box:fill-box;transform-origin:center;animation:s123pop .55s ease both}
[data-scene="ps-123"].s2 .s123-nuc2{animation-delay:.15s}
[data-scene="ps-123"].s2 .s123-join{stroke-dasharray:56;stroke-dashoffset:56;animation:s123draw .7s ease .35s forwards}
[data-scene="ps-123"].s2 .s123-heat{animation:s123pulse 1.6s ease-in-out infinite}
[data-scene="ps-123"].s3 .s123-box{transform-box:fill-box;transform-origin:center;animation:s123pop .5s ease both}
[data-scene="ps-123"].s3 .s123-box2{animation-delay:.12s}
[data-scene="ps-123"].s3 .s123-box3{animation-delay:.24s}
[data-scene="ps-123"].s3 .s123-loop{stroke-dasharray:7 5;animation:s123flow 1.1s linear infinite}
[data-scene="ps-123"].s3 .s123-tok{animation:s123pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">核裂变与核聚变</text>

<!-- 第一步：核裂变与链式反应 -->
<g class="s123-step1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 重核裂变放出能量和更多中子</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="260" height="28" rx="14" fill="#e8effc"/>
  <text x="186" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">核裂变：重核分裂并放出中子</text>

  <text x="296" y="176" font-size="14.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">²³⁵U + n → ¹⁴¹Ba + ⁹²Kr + 3n + 能量</text>

  <circle cx="84" cy="260" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
  <text x="84" y="264" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
  <line class="s123-in" x1="96" y1="260" x2="146" y2="260" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <circle class="s123-u" cx="190" cy="260" r="36" fill="#fff7ed" stroke="#d97706" stroke-width="2.5"/>
  <text x="190" y="257" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">²³⁵U</text>
  <text x="190" y="275" font-size="11" fill="#92400e" text-anchor="middle">铀核</text>

  <line x1="226" y1="248" x2="334" y2="214" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="226" y1="272" x2="334" y2="306" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>

  <circle class="s123-frag" cx="370" cy="205" r="30" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="370" y="210" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">¹⁴¹Ba</text>

  <circle class="s123-frag s123-frag2" cx="370" cy="315" r="30" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="370" y="320" font-size="12.5" font-weight="900" fill="#4338ca" text-anchor="middle">⁹²Kr</text>

  <line class="s123-in" x1="222" y1="238" x2="316" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line class="s123-in" x1="228" y1="260" x2="426" y2="260" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line class="s123-in" x1="222" y1="282" x2="316" y2="360" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>

  <g class="s123-neu">
    <circle cx="330" cy="150" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <text x="330" y="154" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="440" cy="260" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <text x="440" y="264" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="330" cy="370" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <text x="330" y="374" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
  </g>

  <text x="296" y="408" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">一个铀核裂变约释放 200 MeV 能量</text>
  <text x="296" y="430" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">同时放出 2～3 个中子，可继续引发裂变</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">链式反应与临界体积</text>

  <text x="606" y="178" font-size="11" fill="#64748b">第1代</text>
  <text x="606" y="254" font-size="11" fill="#64748b">第2代</text>
  <text x="606" y="334" font-size="11" fill="#64748b">第3代</text>

  <g class="s123-chain">
    <circle cx="740" cy="174" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="740" y="178" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
  </g>

  <line class="s123-link" x1="740" y1="188" x2="702" y2="236" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <line class="s123-link" x1="740" y1="188" x2="778" y2="236" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <circle cx="724" cy="208" r="3.5" fill="#3b82f6"/>
  <circle cx="756" cy="208" r="3.5" fill="#3b82f6"/>

  <g class="s123-chain s123-chain2">
    <circle cx="700" cy="250" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="700" y="254" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
    <circle cx="780" cy="250" r="13" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <text x="780" y="254" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
  </g>

  <line class="s123-link" x1="700" y1="263" x2="672" y2="316" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <line class="s123-link" x1="700" y1="263" x2="728" y2="316" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <line class="s123-link" x1="780" y1="263" x2="752" y2="316" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <line class="s123-link" x1="780" y1="263" x2="808" y2="316" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <circle cx="712" cy="292" r="3.5" fill="#3b82f6"/>
  <circle cx="768" cy="292" r="3.5" fill="#3b82f6"/>

  <g class="s123-chain s123-chain3">
    <circle cx="660" cy="330" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="660" y="334" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
    <circle cx="720" cy="330" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="720" y="334" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
    <circle cx="760" cy="330" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="760" y="334" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
    <circle cx="810" cy="330" r="11" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
    <text x="810" y="334" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">U</text>
  </g>

  <text x="720" y="374" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">每个裂变放出 2～3 个中子</text>

  <rect x="596" y="386" width="248" height="48" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="407" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">临界体积：铀块要足够大</text>
  <text x="720" y="426" font-size="11" fill="#92400e" text-anchor="middle">中子不易逃逸，反应才能持续</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">重核裂变放出能量，再生中子使链式反应持续；铀块要达到临界体积</text>
</g>

<!-- 第二步：核聚变的条件 -->
<g class="s123-step2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 轻核聚变需要极高的温度</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="240" height="28" rx="14" fill="#e8effc"/>
  <text x="176" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">核聚变：轻核结合成重核</text>

  <text x="296" y="176" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">²H + ³H → ⁴He + n + 17.6 MeV</text>

  <text x="175" y="222" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">需克服库仑斥力</text>
  <line x1="175" y1="258" x2="158" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="175" y1="258" x2="192" y2="258" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>

  <g class="s123-nuc">
    <circle cx="135" cy="260" r="25" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <text x="135" y="264" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">²H</text>
  </g>
  <g class="s123-nuc s123-nuc2">
    <circle cx="215" cy="260" r="25" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <text x="215" y="264" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">³H</text>
  </g>

  <line class="s123-join" x1="242" y1="260" x2="306" y2="260" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text class="s123-heat" x="274" y="244" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">高温</text>

  <circle cx="360" cy="260" r="32" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="360" y="265" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">⁴He</text>

  <line x1="388" y1="242" x2="436" y2="222" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <circle cx="450" cy="218" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
  <text x="450" y="222" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>

  <text x="360" y="322" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">释放 17.6 MeV</text>

  <text x="56" y="404" font-size="11.5" font-weight="800" fill="#334155">聚变按质量平均释放的能量比裂变更大</text>
  <text x="56" y="428" font-size="11.5" fill="#475569">太阳内部：4 个氢核聚变成 1 个氦核</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">聚变条件：极高的温度</text>

  <rect x="596" y="158" width="248" height="78" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="188" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">T ≈ 10⁸ K</text>
  <text x="720" y="214" font-size="11" fill="#92400e" text-anchor="middle">上亿开尔文的超高温</text>

  <rect x="596" y="250" width="248" height="92" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="278" font-size="11.5" fill="#334155">高温使原子核有足够动能</text>
  <text x="610" y="302" font-size="11.5" fill="#334155">克服核与核之间的库仑斥力</text>
  <text x="610" y="326" font-size="11.5" fill="#334155">轻核才能靠近并聚合</text>

  <rect x="596" y="356" width="248" height="66" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="720" y="382" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">所以聚变又叫热核反应</text>
  <text x="720" y="404" font-size="11" fill="#065f46" text-anchor="middle">氢弹就是不可控的聚变</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">轻核聚变要克服库仑斥力，需要上亿度高温，因此又叫热核反应</text>
</g>

<!-- 第三步：核能的应用和前景 -->
<g class="s123-step3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 核电站与可控聚变的前景</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="270" height="28" rx="14" fill="#e8effc"/>
  <text x="191" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">核电站：可控的链式反应</text>

  <g class="s123-box">
    <rect x="48" y="176" width="126" height="104" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <rect x="58" y="192" width="7" height="64" fill="#f59e0b"/>
    <rect x="74" y="192" width="7" height="64" fill="#f59e0b"/>
    <rect x="90" y="192" width="7" height="64" fill="#f59e0b"/>
    <rect x="106" y="192" width="7" height="64" fill="#f59e0b"/>
    <rect x="122" y="192" width="7" height="64" fill="#f59e0b"/>
    <rect x="66" y="184" width="7" height="80" fill="#334155"/>
    <rect x="98" y="184" width="7" height="80" fill="#334155"/>
    <rect x="130" y="184" width="7" height="80" fill="#334155"/>
    <text x="111" y="274" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">反应堆</text>
  </g>

  <line class="s123-loop" x1="176" y1="228" x2="216" y2="228" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrAmber)"/>
  <text x="196" y="218" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">蒸汽</text>

  <g class="s123-box s123-box2">
    <rect x="220" y="176" width="110" height="104" rx="12" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="275" cy="226" r="23" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="275" y1="203" x2="275" y2="249" stroke="#1d4ed8" stroke-width="1.6"/>
    <line x1="252" y1="226" x2="298" y2="226" stroke="#1d4ed8" stroke-width="1.6"/>
    <line x1="259" y1="210" x2="291" y2="242" stroke="#1d4ed8" stroke-width="1.6"/>
    <line x1="291" y1="210" x2="259" y2="242" stroke="#1d4ed8" stroke-width="1.6"/>
    <text x="275" y="274" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">汽轮机</text>
  </g>

  <line class="s123-loop" x1="332" y1="228" x2="372" y2="228" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="352" y="218" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">机械能</text>

  <g class="s123-box s123-box3">
    <rect x="376" y="176" width="110" height="104" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="431" cy="226" r="23" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
    <text x="431" y="233" font-size="18" font-weight="900" fill="#047857" text-anchor="middle">G</text>
    <text x="431" y="274" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">发电机</text>
  </g>

  <line class="s123-loop" x1="488" y1="228" x2="540" y2="228" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="516" y="218" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">电能</text>

  <rect x="48" y="310" width="496" height="52" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="296" y="333" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">控制棒吸收中子，慢化剂降低中子速度</text>
  <text x="296" y="353" font-size="11" fill="#475569" text-anchor="middle">反应快慢可控，链式反应不会失控</text>

  <text x="296" y="390" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">核能 → 内能 → 机械能 → 电能</text>
  <text x="296" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">核电站把核能转化为电能</text>
  <text x="296" y="432" font-size="11" fill="#64748b" text-anchor="middle">安全壳防止放射性物质外泄</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">聚变能源：理想的未来能源</text>

  <g class="s123-tok">
    <ellipse cx="720" cy="208" rx="92" ry="44" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <ellipse cx="720" cy="208" rx="40" ry="18" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <ellipse cx="720" cy="208" rx="68" ry="30" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
