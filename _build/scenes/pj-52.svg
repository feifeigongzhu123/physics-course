<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="热机效率：有用功与燃料放热、能量损失、提高效率">
<style>
.p52-s1,.p52-s2,.p52-s3{opacity:0;visibility:hidden}
.p52-s1{opacity:1;visibility:visible}
[data-scene="pj-52"] .p52-s1,[data-scene="pj-52"] .p52-s2,[data-scene="pj-52"] .p52-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-52"].s1 .p52-s1,[data-scene="pj-52"].s2 .p52-s2,[data-scene="pj-52"].s3 .p52-s3{opacity:1;visibility:visible}
@keyframes p52grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes p52rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes p52flow{to{stroke-dashoffset:-42}}
@keyframes p52pop{0%{transform:scale(.84);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p52pulse{0%,100%{opacity:.45}50%{opacity:1}}
[data-scene="pj-52"].s1 .p52-seg{transform-box:fill-box;transform-origin:left center;animation:p52grow .7s ease both}
[data-scene="pj-52"].s1 .p52-segB{animation-delay:.12s}
[data-scene="pj-52"].s1 .p52-segC{animation-delay:.24s}
[data-scene="pj-52"].s1 .p52-segD{animation-delay:.36s}
[data-scene="pj-52"].s1 .p52-frac{transform-box:fill-box;transform-origin:center;animation:p52pop .55s ease both}
[data-scene="pj-52"].s2 .p52-flow{stroke-dasharray:9 7;animation:p52flow 1.1s linear infinite}
[data-scene="pj-52"].s2 .p52-row{transform-box:fill-box;transform-origin:center;animation:p52pop .45s ease both}
[data-scene="pj-52"].s2 .p52-rowB{animation-delay:.1s}
[data-scene="pj-52"].s2 .p52-rowC{animation-delay:.2s}
[data-scene="pj-52"].s2 .p52-rowD{animation-delay:.3s}
[data-scene="pj-52"].s3 .p52-vbar{transform-box:fill-box;transform-origin:center bottom;animation:p52rise .8s ease both}
[data-scene="pj-52"].s3 .p52-vbarB{animation-delay:.15s}
[data-scene="pj-52"].s3 .p52-note{animation:p52pulse 2.2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">热机效率：有用功占燃料放热的比例</text>

<!-- 第一步：有用功与燃料放热 -->
<g class="p52-s1" data-zone="1">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="206" height="30" rx="15" fill="#dbeafe"/>
  <text x="159" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 有用功与燃料放热</text>

  <rect x="52" y="120" width="430" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="267" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">热机效率的定义</text>
  <text x="100" y="240" font-size="18" font-weight="800" fill="#334155">η =</text>
  <g class="p52-frac">
    <rect x="140" y="182" width="250" height="48" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="265" y="214" font-size="22" font-weight="800" fill="#1e40af" text-anchor="middle">W有用</text>
    <line x1="135" y1="242" x2="400" y2="242" stroke="#334155" stroke-width="3"/>
    <rect x="140" y="252" width="250" height="48" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="265" y="284" font-size="22" font-weight="800" fill="#92400e" text-anchor="middle">Q放</text>
  </g>
  <text x="410" y="238" font-size="15" font-weight="800" fill="#334155">×100%</text>
  <text x="267" y="326" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">W有用：用来做有用功的能量</text>
  <text x="267" y="350" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Q放：燃料完全燃烧放出的能量</text>
  <rect x="197" y="362" width="140" height="30" rx="15" fill="#fee2e2"/>
  <text x="267" y="382" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">η 总小于 1</text>

  <rect x="492" y="120" width="356" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="670" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">燃料的能量分配</text>
  <text x="670" y="174" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">燃料完全燃烧放出的能量 100%</text>
  <rect class="p52-seg" x="520" y="186" width="90" height="46" fill="#2563eb"/>
  <rect class="p52-seg p52-segB" x="610" y="186" width="99" height="46" fill="#f59e0b"/>
  <rect class="p52-seg p52-segC" x="709" y="186" width="75" height="46" fill="#ef4444"/>
  <rect class="p52-seg p52-segD" x="784" y="186" width="36" height="46" fill="#94a3b8"/>
  <rect x="520" y="186" width="300" height="46" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="565" y="215" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">30%</text>
  <text x="659" y="215" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">33%</text>
  <text x="746" y="215" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">25%</text>

  <rect x="530" y="248" width="12" height="12" fill="#2563eb"/>
  <text x="550" y="259" font-size="12" font-weight="700" fill="#334155">有用功 30%</text>
  <rect x="530" y="276" width="12" height="12" fill="#f59e0b"/>
  <text x="550" y="287" font-size="12" font-weight="700" fill="#334155">废气带走 33%</text>
  <rect x="530" y="304" width="12" height="12" fill="#ef4444"/>
  <text x="550" y="315" font-size="12" font-weight="700" fill="#334155">冷却散热 25%</text>
  <rect x="530" y="332" width="12" height="12" fill="#94a3b8"/>
  <text x="550" y="343" font-size="12" font-weight="700" fill="#334155">摩擦等其他 12%</text>
  <text x="670" y="378" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">有用功只占燃料能量的一小部分</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#fef3c7"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">η = W有用 / Q放 × 100%，热机效率总小于 1</text>
</g>

<!-- 第二步：能量损失 -->
<g class="p52-s2" data-zone="2">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="206" height="30" rx="15" fill="#dbeafe"/>
  <text x="159" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 能量损失去向</text>

  <rect x="52" y="120" width="430" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="267" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热机中的能量损失</text>
  <rect x="180" y="236" width="120" height="84" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
  <text x="240" y="284" font-size="15" font-weight="800" fill="#475569" text-anchor="middle">热机</text>

  <line class="p52-flow" x1="240" y1="236" x2="240" y2="202" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="240" y="186" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">废气带走热量（最多）</text>

  <line class="p52-flow" x1="178" y1="278" x2="122" y2="278" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="66" y="268" font-size="12" font-weight="800" fill="#b45309">燃料未完全燃烧</text>

  <line class="p52-flow" x1="302" y1="278" x2="362" y2="278" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="374" y="268" font-size="12" font-weight="800" fill="#b45309">散热损失</text>

  <line class="p52-flow" x1="240" y1="322" x2="240" y2="354" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="240" y="380" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">摩擦消耗</text>

  <rect x="492" y="120" width="356" height="278" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量损失的主要途径</text>
  <rect class="p52-row" x="510" y="164" width="320" height="48" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="193" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">① 废气带走的热量最多</text>
  <rect class="p52-row p52-rowB" x="510" y="220" width="320" height="48" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="249" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">② 冷却水带走热量</text>
  <rect class="p52-row p52-rowC" x="510" y="276" width="320" height="48" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="305" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">③ 克服摩擦消耗能量</text>
  <rect class="p52-row p52-rowD" x="510" y="332" width="320" height="42" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
  <text x="670" y="359" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">④ 燃料未完全燃烧</text>
  <text x="670" y="392" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">损失不可避免，η 总小于 1</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#fef2f2"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">废气带走的热量最多，其次是散热和摩擦损失</text>
</g>

<!-- 第三步：提高效率 -->
<g class="p52-s3" data-zone="3">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="136" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 提高热机效率</text>

  <rect x="52" y="120" width="380" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="242" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">改进前后对比</text>
  <line x1="90" y1="350" x2="390" y2="350" stroke="#94a3b8" stroke-width="2"/>
  <rect class="p52-vbar" x="130" y="258" width="80" height="92" rx="4" fill="#94a3b8"/>
  <text x="170" y="246" font-size="12.5" font-weight="800" fill="#475569" text-anchor="middle">η ≈ 30%</text>
  <text x="170" y="372" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">普通热机</text>
  <rect class="p52-vbar p52-vbarB" x="280" y="214" width="80" height="136" rx="4" fill="#2563eb"/>
  <text x="320" y="202" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">η ≈ 40%</text>
  <text x="320" y="372" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">改进后</text>
  <line x1="236" y1="310" x2="272" y2="256" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="252" y="330" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">提高</text>
  <text x="242" y="392" font-size="11.5" fill="#475569" text-anchor="middle">减少损失，效率提高</text>

  <rect x="452" y="120" width="396" height="278" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="650" y="146" font-size="13.5" font-weight="800" fill="#047857" text-anchor="middle">提高效率的方法</text>
  <rect x="472" y="162" width="356" height="48" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="650" y="191" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">① 使燃料充分燃烧</text>
  <rect x="472" y="216" width="356" height="48" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="650" y="245" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">② 减少废气带走的热量</text>
  <rect x="472" y="270" width="356" height="48" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="650" y="299" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">③ 减小摩擦</text>
  <rect x="472" y="324" width="356" height="44" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="650" y="352" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">④ 改进结构，利用余热</text>
  <text x="650" y="390" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">好处：节约能源，减少污染</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#f0fdf4"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">提高效率：充分燃烧、减少废气带走热量、减小摩擦</text>
</g>
</svg>
