<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电势差：U 等于 φA 减 φB、电场力做功 W 等于 qU、匀强电场 U 等于 Ed">
<style>
[data-scene="ps-45"] .s45-step1,[data-scene="ps-45"] .s45-step2,[data-scene="ps-45"] .s45-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-45"].s1 .s45-step1,[data-scene="ps-45"].s2 .s45-step2,[data-scene="ps-45"].s3 .s45-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s45draw{to{stroke-dashoffset:0}}
@keyframes s45pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s45pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s45fade{from{opacity:0}to{opacity:1}}
[data-scene="ps-45"].s1 .s45-dim{stroke-dasharray:190;stroke-dashoffset:190;animation:s45draw .9s ease .35s forwards}
[data-scene="ps-45"].s1 .s45-card{transform-box:fill-box;transform-origin:center;animation:s45pop .5s ease .2s both}
[data-scene="ps-45"].s2 .s45-path{animation:s45fade .8s ease .35s both}
[data-scene="ps-45"].s2 .s45-card{transform-box:fill-box;transform-origin:center;animation:s45pop .5s ease .2s both}
[data-scene="ps-45"].s2 .s45-charge{animation:s45pulse 1.8s ease-in-out infinite}
[data-scene="ps-45"].s3 .s45-card{transform-box:fill-box;transform-origin:center;animation:s45pop .5s ease .2s both}
[data-scene="ps-45"].s3 .s45-fl{stroke-dasharray:180;stroke-dashoffset:180;animation:s45draw .8s ease .2s forwards}
[data-scene="ps-45"].s3 .s45-dim{stroke-dasharray:180;stroke-dashoffset:180;animation:s45draw .8s ease .45s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电势差：两点电势之差与电场力做功</text>

<!-- 第一步：电势差 -->
<g class="s45-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 电势差：U_AB = φA − φB</text>

  <rect x="70" y="118" width="430" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line x1="90" y1="170" x2="476" y2="170"/>
    <line x1="90" y1="330" x2="476" y2="330"/>
  </g>

  <text x="190" y="208" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">φA = 20 V</text>
  <circle cx="190" cy="240" r="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="190" y="266" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">A</text>

  <text x="390" y="208" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">φB = 5 V</text>
  <circle cx="390" cy="240" r="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="390" y="266" font-size="12.5" font-weight="900" fill="#1d4ed8" text-anchor="middle">B</text>

  <line class="s45-dim" x1="200" y1="292" x2="380" y2="292" stroke="#64748b" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="290" y="316" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">U_AB = 15 V</text>

  <text x="285" y="352" font-size="12" fill="#334155" text-anchor="middle">A、B 两点电势的差值</text>
  <text x="285" y="380" font-size="11.5" fill="#334155" text-anchor="middle">U_AB = φA − φB = 20 − 5 = 15 V</text>
  <text x="285" y="404" font-size="11.5" fill="#334155" text-anchor="middle">U_BA = φB − φA = −15 V</text>

  <g class="s45-card">
    <rect x="520" y="110" width="310" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="675" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电势差（电压）</text>
    <text x="675" y="188" font-size="18" font-weight="900" fill="#b45309" text-anchor="middle">U_AB = φA − φB</text>
    <text x="675" y="216" font-size="12" fill="#334155" text-anchor="middle">单位：伏特（V）</text>
    <line x1="545" y1="236" x2="805" y2="236" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="675" y="264">标量，有正负</text>
      <text x="675" y="290">正负表示两点电势的高低</text>
      <text x="675" y="318" font-size="14" font-weight="800" fill="#1e3a8a">U_AB = −U_BA</text>
      <text x="675" y="346">与零电势点选取无关</text>
    </g>
    <line x1="545" y1="366" x2="805" y2="366" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#64748b" font-size="11.5" text-anchor="middle">
      <text x="675" y="394">A → B：U_AB = 15 V</text>
      <text x="675" y="418">B → A：U_BA = −15 V</text>
    </g>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电势差由电场中两点的位置决定，与零电势点的选取无关</text>
</g>

<!-- 第二步：W = qU -->
<g class="s45-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 电场力做功：W_AB = qU_AB</text>

  <rect x="70" y="118" width="430" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line x1="90" y1="150" x2="476" y2="150"/>
    <line x1="90" y1="390" x2="476" y2="390"/>
  </g>

  <circle class="s45-charge" cx="150" cy="270" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="150" y="275" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">q</text>
  <text x="150" y="312" font-size="11.5" fill="#64748b" text-anchor="middle">正电荷</text>

  <line class="s45-path" x1="166" y1="270" x2="384" y2="270" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <line x1="168" y1="240" x2="258" y2="240" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="214" y="226" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="280" y="252" font-size="11.5" font-weight="800" fill="#6d28d9" text-anchor="middle">U_AB</text>
  <circle cx="400" cy="270" r="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="300" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">B</text>

  <text x="270" y="344" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">W_AB = qU_AB</text>
  <text x="270" y="372" font-size="11.5" fill="#334155" text-anchor="middle">电荷量 q 要带正负号代入</text>
  <text x="270" y="398" font-size="11.5" fill="#334155" text-anchor="middle">W 的正负对应电势能的增减</text>

  <g class="s45-card">
    <rect x="520" y="110" width="310" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="675" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场力做功与电势差</text>
    <text x="675" y="188" font-size="18" font-weight="900" fill="#b45309" text-anchor="middle">W_AB = qU_AB</text>
    <text x="675" y="214" font-size="12.5" fill="#334155" text-anchor="middle">W_AB = q(φA − φB)</text>
    <line x1="545" y1="234" x2="805" y2="234" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="675" y="262">q 取正负号代入</text>
      <text x="675" y="288">W &gt; 0：电势能减少</text>
      <text x="675" y="314">W &lt; 0：电势能增加</text>
    </g>
    <line x1="545" y1="332" x2="805" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="675" y="360" font-size="11.5" fill="#64748b" text-anchor="middle">例：q = +2 C，U_AB = 15 V</text>
    <text x="675" y="388" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">W_AB = 2 × 15 = 30 J</text>
    <text x="675" y="412" font-size="11.5" fill="#047857" text-anchor="middle">电势能减少 30 J</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电场力做功 W_AB = qU_AB，只与两点的电势差有关</text>
</g>

<!-- 第三步：U = Ed -->
<g class="s45-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 匀强电场：U_AB = Ed</text>

  <rect x="70" y="118" width="380" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="260" y="144" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">平行板间的匀强电场</text>

  <rect x="140" y="170" width="270" height="10" rx="3" fill="#94a3b8"/>
  <rect x="140" y="360" width="270" height="10" rx="3" fill="#94a3b8"/>
  <text x="275" y="162" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">+ 极板</text>
  <text x="275" y="382" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">− 极板</text>

  <g class="s45-fl" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line x1="180" y1="184" x2="180" y2="356"/>
    <line x1="230" y1="184" x2="230" y2="356"/>
    <line x1="280" y1="184" x2="280" y2="356"/>
    <line x1="330" y1="184" x2="330" y2="356"/>
    <line x1="380" y1="184" x2="380" y2="356"/>
  </g>

  <line class="s45-dim" x1="430" y1="182" x2="430" y2="358" stroke="#64748b" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="440" y="274" font-size="14" font-weight="900" fill="#475569">d</text>

  <text x="112" y="262" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">U</text>
  <text x="112" y="286" font-size="11" fill="#64748b" text-anchor="middle">电压</text>

  <text x="260" y="404" font-size="11.5" fill="#64748b" text-anchor="middle">d 为两点沿场强方向的距离</text>

  <g class="s45-card">
    <rect x="470" y="110" width="360" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">匀强电场中 U = Ed</text>
    <text x="650" y="190" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">U_AB = Ed</text>
    <text x="650" y="218" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">E = U/d</text>
    <text x="650" y="246" font-size="12" fill="#334155" text-anchor="middle">单位：V/m = N/C</text>
    <line x1="495" y1="266" x2="805" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12" text-anchor="middle">
      <text x="650" y="294">d 是沿电场方向的距离</text>
      <text x="650" y="320">不是两点间的直线距离</text>
      <text x="650" y="346">有夹角时取投影 d = Lcosθ</text>
      <text x="650" y="372" font-size="13" font-weight="800" fill="#1e3a8a">U_AB = E·Lcosθ</text>
    </g>
    <text x="650" y="408" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">仅适用于匀强电场</text>
  </g>

  <rect x="70" y="440" width="760" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="464" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">在匀强电场中，两点间的电势差 U_AB = Ed</text>
  <text x="450" y="488" font-size="11.5" fill="#1e3a8a" text-anchor="middle">d 必须是沿电场方向的距离，不是两点的直线距离</text>
</g>
</svg>
