<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="比热容：水与油加热对比、比热容与 Q=cmΔt、水作冷却剂">
<style>
.p50-s1,.p50-s2,.p50-s3{opacity:0;visibility:hidden}
.p50-s1{opacity:1;visibility:visible}
[data-scene="pj-50"] .p50-s1,[data-scene="pj-50"] .p50-s2,[data-scene="pj-50"] .p50-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-50"].s1 .p50-s1,[data-scene="pj-50"].s2 .p50-s2,[data-scene="pj-50"].s3 .p50-s3{opacity:1;visibility:visible}
@keyframes p50flame{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.18) scaleX(.94)}}
@keyframes p50bubble{0%{transform:translateY(0);opacity:.1}30%{opacity:.85}100%{transform:translateY(-38px);opacity:0}}
@keyframes p50flow{to{stroke-dashoffset:-46}}
@keyframes p50pop{0%{transform:scale(.82);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
[data-scene="pj-50"].s1 .p50-flame{transform-box:fill-box;transform-origin:center bottom;animation:p50flame .62s ease-in-out infinite}
[data-scene="pj-50"].s1 .p50-bub{animation:p50bubble 2.4s ease-in infinite}
[data-scene="pj-50"].s1 .p50-bub:nth-of-type(2){animation-delay:-.8s}
[data-scene="pj-50"].s1 .p50-bub:nth-of-type(3){animation-delay:-1.6s}
[data-scene="pj-50"].s1 .p50-bub:nth-of-type(4){animation-delay:-1.1s}
[data-scene="pj-50"].s2 .p50-formula{transform-box:fill-box;transform-origin:center;animation:p50pop .55s ease both}
[data-scene="pj-50"].s2 .p50-chip{transform-box:fill-box;transform-origin:center;animation:p50pop .45s ease both}
[data-scene="pj-50"].s2 .p50-chipB{animation-delay:.1s}
[data-scene="pj-50"].s2 .p50-chipC{animation-delay:.2s}
[data-scene="pj-50"].s2 .p50-chipD{animation-delay:.3s}
[data-scene="pj-50"].s3 .p50-flow{stroke-dasharray:9 7;animation:p50flow 1.1s linear infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">比热容：质量相同，水升温比油慢</text>

<!-- 第一步：水与油的加热对比 -->
<g class="p50-s1" data-zone="1">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="206" height="30" rx="15" fill="#dbeafe"/>
  <text x="159" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 水与油的加热对比</text>

  <rect x="52" y="120" width="440" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="272" y="146" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">相同质量、相同热源、加热相同时间</text>

  <rect x="100" y="190" width="140" height="140" rx="8" fill="#f8fbff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="106" y="252" width="128" height="72" fill="#bfdbfe"/>
  <line x1="114" y1="258" x2="114" y2="318" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/>
  <text x="146" y="308" font-size="14" font-weight="800" fill="#1e40af">水</text>
  <circle class="p50-bub" cx="130" cy="314" r="3.2" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <circle class="p50-bub" cx="162" cy="316" r="2.6" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <circle class="p50-bub" cx="188" cy="312" r="3" fill="#ffffff" stroke="#60a5fa" stroke-width="1"/>
  <rect x="201" y="150" width="10" height="145" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="203" y="210" width="6" height="82" fill="#ef4444"/>
  <circle cx="206" cy="300" r="10" fill="#ef4444" stroke="#64748b" stroke-width="1.5"/>
  <line x1="214" y1="230" x2="220" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="214" y1="250" x2="220" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="214" y1="270" x2="220" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="150" y="172" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">水温 30 ℃</text>

  <g class="p50-flame" fill="#f97316">
    <path d="M138 350 q10 -24 20 0 q-10 9 -20 0 Z"/>
    <path d="M164 350 q13 -32 26 0 q-13 10 -26 0 Z" fill="#fbbf24"/>
    <path d="M194 350 q10 -24 20 0 q-10 9 -20 0 Z"/>
  </g>
  <rect x="132" y="354" width="76" height="8" rx="4" fill="#64748b"/>

  <rect x="310" y="190" width="140" height="140" rx="8" fill="#fffdf5" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="316" y="252" width="128" height="72" fill="#fde68a"/>
  <line x1="324" y1="258" x2="324" y2="318" stroke="#fffbeb" stroke-width="4" stroke-linecap="round"/>
  <text x="356" y="308" font-size="14" font-weight="800" fill="#92400e">油</text>
  <circle class="p50-bub" cx="340" cy="314" r="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <circle class="p50-bub" cx="372" cy="316" r="2.6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <circle class="p50-bub" cx="398" cy="312" r="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1"/>
  <rect x="411" y="150" width="10" height="145" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="413" y="190" width="6" height="102" fill="#ef4444"/>
  <circle cx="416" cy="300" r="10" fill="#ef4444" stroke="#64748b" stroke-width="1.5"/>
  <line x1="424" y1="210" x2="430" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="424" y1="230" x2="430" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="424" y1="250" x2="430" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="172" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">油温 50 ℃</text>

  <g class="p50-flame" fill="#f97316">
    <path d="M348 350 q10 -24 20 0 q-10 9 -20 0 Z"/>
    <path d="M374 350 q13 -32 26 0 q-13 10 -26 0 Z" fill="#fbbf24"/>
    <path d="M404 350 q10 -24 20 0 q-10 9 -20 0 Z"/>
  </g>
  <rect x="342" y="354" width="76" height="8" rx="4" fill="#64748b"/>
  <text x="272" y="392" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">初温相同：水升温 10 ℃，油升温 30 ℃</text>

  <rect x="512" y="120" width="336" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="680" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验现象与结论</text>
  <text x="680" y="176" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">升高的温度 ΔT</text>
  <line x1="540" y1="296" x2="812" y2="296" stroke="#94a3b8" stroke-width="2"/>
  <rect x="570" y="252" width="70" height="44" rx="4" fill="#93c5fd"/>
  <rect x="690" y="208" width="70" height="88" rx="4" fill="#fbbf24"/>
  <text x="605" y="318" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">水 ΔT 小</text>
  <text x="725" y="318" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">油 ΔT 大</text>
  <text x="680" y="348" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">吸收相同的热量，水升温少</text>
  <text x="680" y="370" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">说明水的比热容比油大</text>
  <text x="680" y="392" font-size="12.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">c水 &gt; c油</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#eef6ff"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量相同、吸热相同时，水升高的温度小 —— 水的比热容大</text>
</g>

<!-- 第二步：比热容与热量公式 -->
<g class="p50-s2" data-zone="2">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="210" height="30" rx="15" fill="#dbeafe"/>
  <text x="161" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 比热容与 Q = cmΔt</text>

  <rect x="52" y="120" width="380" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="242" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">比热容 c：物质的特性</text>
  <text x="242" y="174" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">单位质量某种物质温度升高 1 ℃</text>
  <text x="242" y="194" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">所吸收的热量</text>
  <rect class="p50-formula" x="132" y="208" width="220" height="48" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="242" y="240" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle">c = Q / (m·Δt)</text>
  <text x="242" y="278" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">单位：J/(kg·℃)</text>
  <text x="242" y="300" font-size="11.5" fill="#64748b" text-anchor="middle">读作：焦每千克摄氏度</text>
  <rect x="82" y="314" width="320" height="64" rx="10" fill="#dbeafe"/>
  <text x="242" y="340" font-size="14.5" font-weight="900" fill="#1e40af" text-anchor="middle">水 c = 4.2×10³ J/(kg·℃)</text>
  <text x="242" y="362" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">比热容较大，升温慢、降温也慢</text>

  <rect x="452" y="120" width="396" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="650" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热量计算公式</text>
  <rect class="p50-formula" x="502" y="162" width="296" height="60" rx="12" fill="#1d4ed8"/>
  <text x="650" y="202" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">Q = c m Δt</text>

  <rect class="p50-chip" x="490" y="238" width="160" height="44" rx="9" fill="#e8effc"/>
  <text x="570" y="265" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Q：热量（J）</text>
  <rect class="p50-chip p50-chipB" x="660" y="238" width="178" height="44" rx="9" fill="#e8effc"/>
  <text x="749" y="265" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">c：比热容</text>
  <rect class="p50-chip p50-chipC" x="490" y="290" width="160" height="44" rx="9" fill="#e8effc"/>
  <text x="570" y="317" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">m：质量（kg）</text>
  <rect class="p50-chip p50-chipD" x="660" y="290" width="178" height="44" rx="9" fill="#e8effc"/>
  <text x="749" y="317" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Δt：温度变化（℃）</text>

  <rect x="482" y="342" width="336" height="46" rx="10" fill="#f0fdf4"/>
  <text x="650" y="361" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">例：2 kg 的水升温 10 ℃</text>
  <text x="650" y="380" font-size="11.5" font-weight="800" fill="#065f46" text-anchor="middle">Q = 4.2×10³×2×10 = 8.4×10⁴ J</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#f0fdf4"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">c 由物质的种类和状态决定，与质量、温度变化无关</text>
</g>

<!-- 第三步：水作冷却剂 -->
<g class="p50-s3" data-zone="3">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="136" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 水作冷却剂</text>

  <rect x="52" y="120" width="430" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="267" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">汽车发动机的水冷循环</text>

  <rect x="86" y="196" width="150" height="110" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <rect x="96" y="208" width="36" height="86" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="142" y="208" width="36" height="86" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="188" y="208" width="36" height="86" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="92" y="202" width="138" height="98" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="161" y="326" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">发动机（水套）</text>

  <rect x="330" y="184" width="74" height="136" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="342" y1="196" x2="342" y2="308"/>
    <line x1="354" y1="196" x2="354" y2="308"/>
    <line x1="366" y1="196" x2="366" y2="308"/>
    <line x1="378" y1="196" x2="378" y2="308"/>
    <line x1="390" y1="196" x2="390" y2="308"/>
  </g>
  <text x="367" y="342" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">散热器</text>

  <line x1="236" y1="210" x2="330" y2="210" stroke="#93c5fd" stroke-width="9" stroke-linecap="round" opacity=".6"/>
  <line x1="330" y1="300" x2="236" y2="300" stroke="#93c5fd" stroke-width="9" stroke-linecap="round" opacity=".6"/>
  <line class="p50-flow" x1="248" y1="210" x2="324" y2="210" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <line class="p50-flow" x1="318" y1="300" x2="244" y2="300" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <text x="283" y="198" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">热水</text>
  <text x="283" y="320" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">冷水</text>
  <text x="267" y="380" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">水吸热 → 散热器放热 → 循环流动</text>

  <rect x="498" y="120" width="350" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="673" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">为什么都用水？</text>

  <circle cx="520" cy="182" r="13" fill="#1d4ed8"/>
  <text x="520" y="187" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
  <text x="546" y="180" font-size="12.5" font-weight="800" fill="#1e3a8a">发动机冷却剂</text>
  <text x="546" y="200" font-size="11.5" fill="#475569">吸热多、升温少，保护发动机</text>

  <circle cx="520" cy="244" r="13" fill="#1d4ed8"/>
  <text x="520" y="249" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
  <text x="546" y="242" font-size="12.5" font-weight="800" fill="#1e3a8a">暖气取暖介质</text>
  <text x="546" y="262" font-size="11.5" fill="#475569">放热多，房间暖得均匀</text>

  <circle cx="520" cy="306" r="13" fill="#1d4ed8"/>
  <text x="520" y="311" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <text x="546" y="304" font-size="12.5" font-weight="800" fill="#1e3a8a">沿海昼夜温差小</text>
  <text x="546" y="324" font-size="11.5" fill="#475569">海水吸放热多，调节气温</text>

  <text x="673" y="370" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">水的比热容大 → 吸放热本领强</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#eef6ff"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">水的比热容大，常用作冷却剂和取暖介质</text>
</g>
</svg>
