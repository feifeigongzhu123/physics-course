<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="基本粒子：强子与轻子、夸克与标准模型、四种基本相互作用与宇宙线">
<style>
[data-scene="ps-124"] .s124-step1,[data-scene="ps-124"] .s124-step2,[data-scene="ps-124"] .s124-step3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-124"].s1 .s124-step1,[data-scene="ps-124"].s2 .s124-step2,[data-scene="ps-124"].s3 .s124-step3{opacity:1;visibility:visible}
@keyframes s124fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s124draw{to{stroke-dashoffset:0}}
@keyframes s124pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s124pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s124flow{to{stroke-dashoffset:-36}}
@keyframes s124drift{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(8px,18px);opacity:0}}
[data-scene="ps-124"].s1 .s124-node{transform-box:fill-box;transform-origin:center;animation:s124pop .5s ease both}
[data-scene="ps-124"].s1 .s124-node2{animation-delay:.12s}
[data-scene="ps-124"].s1 .s124-node3{animation-delay:.24s}
[data-scene="ps-124"].s1 .s124-line{stroke-dasharray:48;stroke-dashoffset:48;animation:s124draw .6s ease .25s forwards}
[data-scene="ps-124"].s2 .s124-q{transform-box:fill-box;transform-origin:center;animation:s124pop .5s ease both}
[data-scene="ps-124"].s2 .s124-q2{animation-delay:.08s}
[data-scene="ps-124"].s2 .s124-q3{animation-delay:.16s}
[data-scene="ps-124"].s2 .s124-q4{animation-delay:.24s}
[data-scene="ps-124"].s2 .s124-q5{animation-delay:.32s}
[data-scene="ps-124"].s2 .s124-q6{animation-delay:.4s}
[data-scene="ps-124"].s2 .s124-comp{animation:s124fade .5s ease .45s both}
[data-scene="ps-124"].s3 .s124-force{transform-box:fill-box;transform-origin:center;animation:s124pop .5s ease both}
[data-scene="ps-124"].s3 .s124-force2{animation-delay:.1s}
[data-scene="ps-124"].s3 .s124-force3{animation-delay:.2s}
[data-scene="ps-124"].s3 .s124-force4{animation-delay:.3s}
[data-scene="ps-124"].s3 .s124-ray{stroke-dasharray:6 5;animation:s124flow 1s linear infinite}
[data-scene="ps-124"].s3 .s124-shower{animation:s124pulse 1.6s ease-in-out infinite}
[data-scene="ps-124"].s3 .s124-earth{animation:s124pulse 2.2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">“基本”粒子</text>

<!-- 第一步：粒子的分类 -->
<g class="s124-step1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 粒子分强子和轻子</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">粒子分类：强子与轻子</text>

  <rect class="s124-node" x="230" y="148" width="132" height="36" rx="10" fill="#1d4ed8"/>
  <text x="296" y="172" font-size="13.5" font-weight="900" fill="#ffffff" text-anchor="middle">粒子</text>

  <line class="s124-line" x1="296" y1="184" x2="172" y2="212" stroke="#94a3b8" stroke-width="1.8"/>
  <line class="s124-line" x1="296" y1="184" x2="420" y2="212" stroke="#94a3b8" stroke-width="1.8"/>

  <rect class="s124-node s124-node2" x="66" y="214" width="208" height="42" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.8"/>
  <text x="170" y="240" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">强子：参与强相互作用</text>

  <rect class="s124-node s124-node2" x="318" y="214" width="208" height="42" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.8"/>
  <text x="422" y="240" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">轻子：不参与强相互作用</text>

  <line class="s124-line" x1="170" y1="256" x2="110" y2="288" stroke="#94a3b8" stroke-width="1.8"/>
  <line class="s124-line" x1="170" y1="256" x2="230" y2="288" stroke="#94a3b8" stroke-width="1.8"/>
  <line class="s124-line" x1="422" y1="256" x2="422" y2="288" stroke="#94a3b8" stroke-width="1.8"/>

  <rect class="s124-node s124-node3" x="56" y="290" width="108" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="110" y="313" font-size="12" font-weight="900" fill="#92400e" text-anchor="middle">重子</text>
  <text x="110" y="335" font-size="11" fill="#92400e" text-anchor="middle">质子、中子</text>

  <rect class="s124-node s124-node3" x="176" y="290" width="108" height="58" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="230" y="313" font-size="12" font-weight="900" fill="#92400e" text-anchor="middle">介子</text>
  <text x="230" y="335" font-size="11" fill="#92400e" text-anchor="middle">π 介子、K 介子</text>

  <rect class="s124-node s124-node3" x="308" y="290" width="218" height="58" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="417" y="313" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电子、μ 子、τ 子</text>
  <text x="417" y="335" font-size="11" fill="#475569" text-anchor="middle">都带负电</text>

  <rect class="s124-node s124-node3" x="308" y="358" width="218" height="50" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="417" y="381" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">中微子 ν</text>
  <text x="417" y="400" font-size="11" fill="#475569" text-anchor="middle">不带电，质量极小</text>

  <text x="296" y="430" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">强子有内部结构，轻子目前认为没有</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">轻子与宇宙线</text>

  <rect x="596" y="158" width="248" height="104" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="184" font-size="12.5" font-weight="900" fill="#1e3a8a">轻子家族</text>
  <text x="610" y="210" font-size="11" fill="#334155">电子 e⁻、μ 子、τ 子</text>
  <text x="610" y="234" font-size="11" fill="#334155">三种中微子 ν</text>
  <text x="610" y="256" font-size="11" fill="#475569">不参与强相互作用</text>

  <rect x="596" y="272" width="248" height="80" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="610" y="298" font-size="12.5" font-weight="900" fill="#b45309">宇宙线</text>
  <text x="610" y="322" font-size="11" fill="#92400e">来自宇宙的高能粒子流</text>
  <text x="610" y="344" font-size="11" fill="#92400e">主要成分是高能质子</text>

  <rect x="596" y="362" width="248" height="66" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="610" y="386" font-size="12" font-weight="900" fill="#047857">天然粒子源</text>
  <text x="610" y="406" font-size="11" fill="#065f46">正电子、μ 子等由此发现</text>
  <text x="610" y="424" font-size="11" fill="#065f46">进入大气会产生粒子簇射</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">粒子分强子和轻子；强子参与强相互作用，轻子不参与</text>
</g>

<!-- 第二步：夸克模型与标准模型 -->
<g class="s124-step2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 夸克模型与标准模型</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="260" height="28" rx="14" fill="#e8effc"/>
  <text x="186" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">夸克模型：强子的内部结构</text>

  <g class="s124-q">
    <rect x="56" y="162" width="140" height="64" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="72" y="192" font-size="20" font-weight="900" fill="#1e3a8a">u</text>
    <text x="104" y="186" font-size="12" font-weight="900" fill="#1e3a8a">上夸克</text>
    <text x="104" y="208" font-size="11" fill="#475569">电荷 +2/3 e</text>
  </g>
  <g class="s124-q s124-q2">
    <rect x="206" y="162" width="140" height="64" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="222" y="192" font-size="20" font-weight="900" fill="#1e3a8a">c</text>
    <text x="254" y="186" font-size="12" font-weight="900" fill="#1e3a8a">粲夸克</text>
    <text x="254" y="208" font-size="11" fill="#475569">电荷 +2/3 e</text>
  </g>
  <g class="s124-q s124-q3">
    <rect x="356" y="162" width="140" height="64" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="372" y="192" font-size="20" font-weight="900" fill="#1e3a8a">t</text>
    <text x="404" y="186" font-size="12" font-weight="900" fill="#1e3a8a">顶夸克</text>
    <text x="404" y="208" font-size="11" fill="#475569">电荷 +2/3 e</text>
  </g>

  <g class="s124-q s124-q4">
    <rect x="56" y="236" width="140" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="72" y="266" font-size="20" font-weight="900" fill="#b45309">d</text>
    <text x="104" y="260" font-size="12" font-weight="900" fill="#b45309">下夸克</text>
    <text x="104" y="282" font-size="11" fill="#92400e">电荷 −1/3 e</text>
  </g>
  <g class="s124-q s124-q5">
    <rect x="206" y="236" width="140" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="222" y="266" font-size="20" font-weight="900" fill="#b45309">s</text>
    <text x="254" y="260" font-size="12" font-weight="900" fill="#b45309">奇夸克</text>
    <text x="254" y="282" font-size="11" fill="#92400e">电荷 −1/3 e</text>
  </g>
  <g class="s124-q s124-q6">
    <rect x="356" y="236" width="140" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="372" y="266" font-size="20" font-weight="900" fill="#b45309">b</text>
    <text x="404" y="260" font-size="12" font-weight="900" fill="#b45309">底夸克</text>
    <text x="404" y="282" font-size="11" fill="#92400e">电荷 −1/3 e</text>
  </g>

  <line x1="56" y1="314" x2="496" y2="314" stroke="#e2e8f0" stroke-width="1.5"/>

  <g class="s124-comp">
    <text x="56" y="338" font-size="13" font-weight="900" fill="#1e3a8a">质子 = u + u + d</text>
    <text x="250" y="338" font-size="11.5" fill="#475569">+2/3 + 2/3 − 1/3 = +1</text>
    <text x="56" y="364" font-size="13" font-weight="900" fill="#1e3a8a">中子 = u + d + d</text>
    <text x="250" y="364" font-size="11.5" fill="#475569">+2/3 − 1/3 − 1/3 = 0</text>
    <text x="56" y="392" font-size="11.5" fill="#334155">重子由 3 个夸克组成，介子由 1 个夸克和 1 个反夸克组成</text>
    <text x="56" y="416" font-size="11.5" font-weight="800" fill="#1d4ed8">夸克带分数电荷，不能单独存在</text>
  </g>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">标准模型：物质的基本组成</text>

  <rect x="596" y="156" width="248" height="82" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="178" font-size="12.5" font-weight="900" fill="#1e3a8a">三代夸克</text>
  <text x="610" y="202" font-size="12" fill="#334155">u  c  t（+2/3 e）</text>
  <text x="610" y="226" font-size="12" fill="#334155">d  s  b（−1/3 e）</text>

  <rect x="596" y="246" width="248" height="82" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="610" y="268" font-size="12.5" font-weight="900" fill="#b45309">三代轻子</text>
  <text x="610" y="292" font-size="12" fill="#334155">e  μ  τ（带电）</text>
  <text x="610" y="316" font-size="12" fill="#334155">νe  νμ  ντ（中微子）</text>

  <rect x="596" y="336" width="248" height="88" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="610" y="358" font-size="12.5" font-weight="900" fill="#047857">传递相互作用的玻色子</text>
  <text x="610" y="382" font-size="12" fill="#334155">光子 γ、胶子 g</text>
  <text x="610" y="402" font-size="12" fill="#334155">W±、Z⁰ 玻色子</text>
  <text x="610" y="420" font-size="11" fill="#065f46">希格斯粒子赋予质量</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">强子由夸克组成；标准模型用 6 种夸克和 6 种轻子描述物质世界</text>
</g>

<!-- 第三步：四种基本相互作用与宇宙线 -->
<g class="s124-step3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 四种基本相互作用与宇宙线</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="210" height="28" rx="14" fill="#e8effc"/>
  <text x="161" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">四种基本相互作用</text>

  <g class="s124-force">
    <rect x="56" y="152" width="238" height="112" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
    <text x="70" y="178" font-size="14" font-weight="900" fill="#334155">引力</text>
    <text x="70" y="202" font-size="11" fill="#475569">任意有质量物体之间</text>
    <text x="70" y="224" font-size="11" fill="#475569">作用距离无限远</text>
    <text x="70" y="246" font-size="11" fill="#475569">四种力中最弱</text>
  </g>

  <g class="s124-force s124-force2">
    <rect x="302" y="152" width="238" height="112" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="316" y="178" font-size="14" font-weight="900" fill="#1e3a8a">电磁力</text>
    <text x="316" y="202" font-size="11" fill="#475569">电荷之间的相互作用</text>
    <text x="316" y="224" font-size="11" fill="#475569">作用距离无限远</text>
    <text x="316" y="246" font-size="11" fill="#475569">比引力强得多</text>
  </g>

  <g class="s124-force s124-force3">
    <rect x="56" y="276" width="238" height="112" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
    <text x="70" y="302" font-size="14" font-weight="900" fill="#b45309">强相互作用</text>
    <text x="70" y="326" font-size="11" fill="#92400e">束缚夸克和核子</text>
    <text x="70" y="348" font-size="11" fill="#92400e">作用范围约 10⁻¹⁵ m</text>
    <text x="70" y="370" font-size="11" fill="#92400e">四种力中最强</text>
  </g>

  <g class="s124-force s124-force4">
    <rect x="302" y="276" width="238" height="112" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.6"/>
    <text x="316" y="302" font-size="14" font-weight="900" fill="#047857">弱相互作用</text>
    <text x="316" y="326" font-size="11" fill="#065f46">引起 β 衰变</text>
    <text x="316" y="348" font-size="11" fill="#065f46">作用范围约 10⁻¹⁸ m</text>
    <text x="316" y="370" font-size="11" fill="#065f46">中微子参与其中</text>
  </g>

  <text x="296" y="410" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">标准模型统一描述电磁、强、弱三种相互作用</text>
  <text x="296" y="432" font-size="11" fill="#64748b" text-anchor="middle">引力和暗物质、暗能量仍是未解之谜</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">宇宙线：天然高能实验室</text>

  <circle class="s124-earth" cx="720" cy="300" r="46" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="720" cy="300" r="64" fill="none" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="720" y="305" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">地球大气</text>

  <text x="618" y="150" font-size="11.5" font-weight="800" fill="#b91c1c">宇宙线</text>
  <line class="s124-ray" x1="626" y1="158" x2="686" y2="232" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>

  <g class="s124-shower">
    <line x1="688" y1="232" x2="660" y2="268" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="688" y1="232" x2="690" y2="282" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="688" y1="232" x2="720" y2="264" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="688" y1="232" x2="748" y2="280" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="660" cy="268" r="3.5" fill="#3b82f6"/>
    <circle cx="690" cy="282" r="3.5" fill="#3b82f6"/>
    <circle cx="720" cy="264" r="3.5" fill="#3b82f6"/>
    <circle cx="748" cy="280" r="3.5" fill="#3b82f6"/>
  </g>
  <text x="720" y="218" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">大气簇射</text>

  <text x="720" y="390" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">宇宙线主要是高能质子</text>
  <text x="720" y="410" font-size="11.5" fill="#475569" text-anchor="middle">进入大气产生粒子簇射</text>
  <text x="720" y="430" font-size="11.5" fill="#475569" text-anchor="middle">曾帮助发现正电子、μ 子</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
