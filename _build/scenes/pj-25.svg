<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="密度：同体积不同物质质量不同，密度公式与鉴别物质">
  <style>
    [data-scene="pj-25"] .p25-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
    [data-scene="pj-25"].s1 .p25-step1,
    [data-scene="pj-25"].s2 .p25-step2,
    [data-scene="pj-25"].s3 .p25-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
    @keyframes p25draw{to{stroke-dashoffset:0}}
    @keyframes p25pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p25fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p25pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes p25float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    [data-scene="pj-25"].s1 .p25-cube{transform-box:fill-box;transform-origin:bottom center;animation:p25pop .5s ease both}
    [data-scene="pj-25"].s1 .p25-c2{animation-delay:.1s}
    [data-scene="pj-25"].s1 .p25-c3{animation-delay:.2s}
    [data-scene="pj-25"].s1 .p25-bracket{stroke-dasharray:400;stroke-dashoffset:400;animation:p25draw .8s ease .1s forwards}
    [data-scene="pj-25"].s1 .p25-formula{animation:p25fade .55s ease .2s both}
    [data-scene="pj-25"].s2 .p25-line{stroke-dasharray:400;stroke-dashoffset:400;animation:p25draw 1s ease forwards}
    [data-scene="pj-25"].s2 .p25-lineB{animation-delay:.2s}
    [data-scene="pj-25"].s2 .p25-dot{transform-box:fill-box;transform-origin:center;animation:p25pop .5s ease 1.1s both}
    [data-scene="pj-25"].s2 .p25-cardR{animation:p25fade .5s ease both}
    [data-scene="pj-25"].s2 .p25-r2{animation-delay:.12s}
    [data-scene="pj-25"].s2 .p25-r3{animation-delay:.24s}
    [data-scene="pj-25"].s3 .p25-panel{transform-box:fill-box;transform-origin:center;animation:p25pop .55s ease both}
    [data-scene="pj-25"].s3 .p25-p2{animation-delay:.12s}
    [data-scene="pj-25"].s3 .p25-p3{animation-delay:.24s}
    [data-scene="pj-25"].s3 .p25-ring{animation:p25pulse 2s ease-in-out infinite}
    [data-scene="pj-25"].s3 .p25-ice{animation:p25float 2.4s ease-in-out infinite}
    [data-scene="pj-25"].s3 .p25-crack{animation:p25pulse 1.5s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">密度：质量与体积之比，物质的特性</text>

  <!-- 第一步：密度概念与公式 -->
  <g class="p25-step p25-step1" data-zone="1">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">体积相同的不同物质，质量不同</text>
    <text x="70" y="120" font-size="13" font-weight="700" fill="#334155">取体积都是 1 cm³ 的铝、铁、铜，比较它们的质量</text>

    <path class="p25-bracket" d="M95 218 L95 208 L449 208 L449 218 M270 208 L270 222" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="270" y="200" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">V = 1 cm³</text>

    <g class="p25-cube p25-c1">
      <rect x="105" y="250" width="84" height="84" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/>
      <rect x="111" y="256" width="72" height="14" rx="4" fill="#f8fafc"/>
      <text x="147" y="304" font-size="20" font-weight="900" fill="#334155" text-anchor="middle">铝</text>
      <text x="147" y="360" font-size="14" font-weight="900" fill="#475569" text-anchor="middle">2.7 g</text>
    </g>
    <g class="p25-cube p25-c2">
      <rect x="235" y="250" width="84" height="84" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
      <rect x="241" y="256" width="72" height="14" rx="4" fill="#cbd5e1"/>
      <text x="277" y="304" font-size="20" font-weight="900" fill="#f8fafc" text-anchor="middle">铁</text>
      <text x="277" y="360" font-size="14" font-weight="900" fill="#334155" text-anchor="middle">7.9 g</text>
    </g>
    <g class="p25-cube p25-c3">
      <rect x="365" y="250" width="84" height="84" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="2.5"/>
      <rect x="371" y="256" width="72" height="14" rx="4" fill="#fde68a"/>
      <text x="407" y="304" font-size="20" font-weight="900" fill="#78350f" text-anchor="middle">铜</text>
      <text x="407" y="360" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">8.9 g</text>
    </g>

    <text x="277" y="414" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">同体积 → 质量越大，密度越大</text>

    <g class="p25-formula">
      <rect x="500" y="105" width="340" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="670" y="138" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">密度公式</text>
      <text x="670" y="198" font-size="30" font-weight="900" fill="#1e3a8a" text-anchor="middle">ρ = m / V</text>
      <text x="670" y="226" font-size="11.5" fill="#64748b" text-anchor="middle">密度 = 质量 ÷ 体积</text>
      <line x1="520" y1="244" x2="820" y2="244" stroke="#e2e8f0" stroke-width="1.5"/>
      <g font-size="12" fill="#334155">
        <text x="520" y="270">ρ：密度（kg/m³）</text>
        <text x="520" y="294">m：质量（kg）</text>
        <text x="520" y="318">V：体积（m³）</text>
      </g>
      <line x1="520" y1="334" x2="820" y2="334" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="670" y="360" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">1 g/cm³ = 1×10³ kg/m³</text>
      <text x="670" y="386" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">水的密度：1.0×10³ kg/m³</text>
      <text x="670" y="408" font-size="11.5" fill="#64748b" text-anchor="middle">= 1.0 g/cm³（4℃ 时）</text>
    </g>

    <text x="450" y="468" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">同种物质的质量与体积之比是一个定值，这个比值叫密度</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">密度的国际单位：kg/m³　·　常用单位：g/cm³</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">1 g/cm³ = 1000 kg/m³　·　1 kg/m³ = 10⁻³ g/cm³</text>
    </g>
  </g>

  <!-- 第二步：密度的特性 -->
  <g class="p25-step p25-step2" data-zone="2">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">密度的特性：m-V 图像是一条过原点的直线</text>

    <rect x="55" y="105" width="440" height="345" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="275" y="135" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">同种物质：m 与 V 成正比</text>

    <line x1="130" y1="410" x2="455" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#arrBlue)"/>
    <line x1="130" y1="410" x2="130" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrBlue)"/>
    <text x="438" y="434" font-size="12" font-weight="700" fill="#475569" text-anchor="end">V/cm³</text>
    <text x="112" y="152" font-size="12" font-weight="700" fill="#475569" text-anchor="end">m/g</text>

    <line class="p25-line p25-lineA" x1="130" y1="410" x2="420" y2="290" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>
    <line class="p25-line p25-lineB" x1="130" y1="410" x2="420" y2="190" stroke="#b45309" stroke-width="3.5" stroke-linecap="round"/>
    <text x="430" y="288" font-size="12" font-weight="800" fill="#475569" text-anchor="end">铝（ρ 小）</text>
    <text x="430" y="186" font-size="12" font-weight="800" fill="#b45309" text-anchor="end">铁（ρ 大）</text>

    <line x1="340" y1="410" x2="340" y2="246" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
    <line x1="130" y1="251" x2="340" y2="251" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
    <line x1="130" y1="323" x2="340" y2="323" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
    <circle class="p25-dot" cx="340" cy="251" r="5" fill="#b45309"/>
    <circle class="p25-dot" cx="340" cy="323" r="5" fill="#64748b"/>
    <text x="350" y="246" font-size="11.5" font-weight="700" fill="#b45309">m铁</text>
    <text x="350" y="318" font-size="11.5" font-weight="700" fill="#475569">m铝</text>
    <text x="235" y="392" font-size="11.5" fill="#64748b">相同体积，铁的质量更大</text>

    <text x="275" y="438" font-size="11.5" fill="#64748b" text-anchor="middle">直线的斜率就是密度：斜率越大，密度越大</text>

    <g class="p25-cardR p25-r1">
      <rect x="515" y="105" width="330" height="100" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="535" y="133" font-size="13.5" font-weight="800" fill="#1e3a8a">同种物质</text>
      <text x="535" y="158" font-size="11.5" fill="#334155">状态一定时，ρ 与 m、V 无关</text>
      <text x="535" y="182" font-size="11.5" fill="#64748b">一杯水倒掉一半，密度不变</text>
    </g>
    <g class="p25-cardR p25-r2">
      <rect x="515" y="218" width="330" height="100" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="535" y="246" font-size="13.5" font-weight="800" fill="#1e3a8a">不同物质</text>
      <text x="535" y="271" font-size="11.5" fill="#334155">密度一般不同</text>
      <text x="535" y="295" font-size="11.5" fill="#b45309" font-weight="700">→ 可以用密度鉴别物质</text>
    </g>
    <g class="p25-cardR p25-r3">
      <rect x="515" y="331" width="330" height="100" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="535" y="359" font-size="13.5" font-weight="800" fill="#1e3a8a">水的密度</text>
      <text x="535" y="384" font-size="12" font-weight="700" fill="#334155">1.0×10³ kg/m³ = 1.0 g/cm³</text>
      <text x="535" y="408" font-size="11.5" fill="#64748b">4℃ 时水的密度最大</text>
    </g>

    <text x="450" y="476" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">密度是物质的特性：同种物质密度相同，与质量、体积无关</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">易错：ρ = m/V 是计算式，不能说 ρ 与 m 成正比、与 V 成反比</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">同种物质 m 与 V 成正比，比值 ρ 保持不变</text>
    </g>
  </g>

  <!-- 第三步：密度的应用 -->
  <g class="p25-step p25-step3" data-zone="3">
    <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">密度的应用：鉴别物质、冰浮水面、水管防冻</text>

    <g class="p25-panel p25-p1">
      <rect x="50" y="105" width="270" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="185" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 鉴别物质</text>
      <g class="p25-ring">
        <circle cx="185" cy="245" r="40" fill="none" stroke="#d97706" stroke-width="18"/>
        <circle cx="185" cy="245" r="40" fill="none" stroke="#fbbf24" stroke-width="4"/>
      </g>
      <path d="M185 205 l10 -16 l10 16 l-10 12 z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="185" y="316" font-size="12.5" fill="#334155" text-anchor="middle">测得 ρ = 19.3 g/cm³</text>
      <text x="185" y="340" font-size="12.5" fill="#334155" text-anchor="middle">正好等于金的密度</text>
      <rect x="90" y="360" width="190" height="34" rx="17" fill="#e8effc"/>
      <text x="185" y="382" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">→ 可判断是纯金</text>
      <text x="185" y="422" font-size="11.5" fill="#64748b" text-anchor="middle">密度是鉴别物质的重要依据</text>
    </g>

    <g class="p25-panel p25-p2">
      <rect x="330" y="105" width="270" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="465" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 冰浮水面</text>
      <path d="M390 205 L390 372 Q390 388 406 388 L524 388 Q540 388 540 372 L540 205" fill="#ffffff" stroke="#38bdf8" stroke-width="3"/>
      <path d="M394 255 L394 372 Q394 384 406 384 L524 384 Q536 384 536 372 L536 255 Z" fill="#bfdbfe" opacity=".85"/>
      <path d="M394 255 Q465 266 536 255" fill="none" stroke="#1d4ed8" stroke-width="2"/>
      <g class="p25-ice">
        <rect x="438" y="228" width="54" height="54" rx="5" fill="#e0f2fe" stroke="#60a5fa" stroke-width="2.5"/>
        <path d="M446 236 L458 236 L450 250 L446 250 Z" fill="#ffffff"/>
      </g>
      <text x="465" y="272" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">冰</text>
      <text x="465" y="324" font-size="11.5" fill="#334155" text-anchor="middle">ρ冰 = 0.9×10³ kg/m³</text>
      <text x="465" y="346" font-size="11.5" fill="#334155" text-anchor="middle">ρ水 = 1.0×10³ kg/m³</text>
      <text x="465" y="376" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">ρ冰 小于 ρ水 → 冰浮水面</text>
      <text x="465" y="422" font-size="11.5" fill="#64748b" text-anchor="middle">冰山露出水面约十分之一</text>
    </g>

    <g class="p25-panel p25-p3">
      <rect x="610" y="105" width="270" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="745" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 水结冰胀裂水管</text>
      <rect x="650" y="230" width="190" height="72" rx="14" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
      <rect x="660" y="240" width="170" height="52" rx="9" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
      <path class="p25-crack" d="M710 241 L700 262 L716 272 L704 291 M760 240 L772 260 L756 272 L768 292" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <g fill="#60a5fa">
        <circle cx="704" cy="300" r="3.5"/>
        <circle cx="770" cy="302" r="3.5"/>
      </g>
      <text x="745" y="336" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">水结冰后体积变大</text>
      <text x="745" y="360" font-size="11.5" fill="#334155" text-anchor="middle">密度变小，可能把水管胀裂</text>
      <rect x="660" y="380" width="170" height="34" rx="17" fill="#fff7ed"/>
      <text x="745" y="402" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">V冰 大于 V水</text>
      <text x="745" y="428" font-size="11.5" fill="#64748b" text-anchor="middle">冬天要给室外水管保温</text>
    </g>

    <text x="450" y="478" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">应用：鉴别物质　·　计算质量或体积　·　解释冰浮水面与水管防冻</text>

    <g>
      <rect x="60" y="512" width="780" height="74" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="541" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">用密度鉴别物质：测出 ρ，再对照密度表；注意物质状态和温度</text>
      <text x="450" y="565" font-size="11.5" fill="#64748b" text-anchor="middle">水的反常膨胀：4℃ 密度最大，结冰后密度变小、体积变大</text>
    </g>
  </g>
</svg>
