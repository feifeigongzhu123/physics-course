<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="机械效率：有用功额外功总功、机械效率公式、提高机械效率的方法">
  <style>
    .p47-s1,.p47-s2,.p47-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    .p47-s1{opacity:1;visibility:visible}
    [data-scene="pj-47"] .p47-s1,[data-scene="pj-47"] .p47-s2,[data-scene="pj-47"] .p47-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-47"].s1 .p47-s1,[data-scene="pj-47"].s2 .p47-s2,[data-scene="pj-47"].s3 .p47-s3{opacity:1;visibility:visible}
    @keyframes p47pop{0%{transform:scale(.78);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p47pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes p47grow{from{transform:scaleX(.2);opacity:.3}to{transform:scaleX(1);opacity:1}}
    @keyframes p47rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    [data-scene="pj-47"].s1 .p47-pop{transform-box:fill-box;transform-origin:center;animation:p47pop .5s ease both}
    [data-scene="pj-47"].s1 .p47-bar{transform-box:fill-box;transform-origin:left center;animation:p47grow .7s ease both}
    [data-scene="pj-47"].s1 .p47-force{animation:p47pulse 1.6s ease-in-out infinite}
    [data-scene="pj-47"].s2 .p47-pop{transform-box:fill-box;transform-origin:center;animation:p47pop .5s ease both}
    [data-scene="pj-47"].s2 .p47-ring{transform-box:fill-box;transform-origin:center;animation:p47pulse 2s ease-in-out infinite}
    [data-scene="pj-47"].s3 .p47-pop{transform-box:fill-box;transform-origin:center;animation:p47pop .5s ease both}
    [data-scene="pj-47"].s3 .p47-up{transform-box:fill-box;transform-origin:center;animation:p47rise 2s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">机械效率：有用功、额外功与总功</text>

  <!-- 第一步：三种功 -->
  <g class="p47-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">有用功 + 额外功 = 总功</text>

    <rect x="40" y="110" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="124" width="150" height="26" rx="13" fill="#e8effc"/>
    <text x="135" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">提升物体</text>

    <line x1="70" y1="158" x2="410" y2="158" stroke="#94a3b8" stroke-width="5"/>
    <line x1="240" y1="158" x2="240" y2="172" stroke="#64748b" stroke-width="7"/>
    <path d="M206 190 L206 320" stroke="#b45309" stroke-width="4" fill="none"/>
    <path d="M274 190 L274 330" stroke="#b45309" stroke-width="4" fill="none" marker-end="url(#arrAmber)"/>
    <circle cx="240" cy="190" r="34" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
    <circle cx="240" cy="190" r="9" fill="#94a3b8"/>
    <rect x="176" y="320" width="60" height="52" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="206" y="352" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">G</text>
    <text x="300" y="330" font-size="13" font-weight="800" fill="#1e40af">F</text>

    <line class="p47-force" x1="150" y1="368" x2="150" y2="298" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <text x="206" y="398" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">W有 = Gh</text>
    <text x="282" y="178" font-size="11" fill="#64748b">W额：克服摩擦和动滑轮重</text>

    <rect x="460" y="110" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="124" width="170" height="26" rx="13" fill="#e8effc"/>
    <text x="565" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">三种功的关系</text>

    <g class="p47-bar">
      <rect x="530" y="170" width="240" height="42" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="650" y="197" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">W有 = 400 J</text>
      <rect x="530" y="225" width="62" height="42" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <text x="606" y="252" font-size="12" font-weight="800" fill="#92400e">W额 = 100 J</text>
      <rect x="530" y="280" width="302" height="42" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="770" y="280" width="62" height="42" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
      <text x="650" y="307" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">W总 = 500 J</text>
    </g>
    <line x1="518" y1="170" x2="518" y2="322" stroke="#94a3b8" stroke-width="2"/>
    <line x1="512" y1="170" x2="524" y2="170" stroke="#94a3b8" stroke-width="2"/>
    <line x1="512" y1="322" x2="524" y2="322" stroke="#94a3b8" stroke-width="2"/>
    <text x="735" y="354" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">W总 = W有 + W额</text>

    <rect x="60" y="416" width="780" height="42" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="450" y="442" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">W有：为达到目的必须做的功　·　W额：不需要但不得不做的功　·　W总 = W有 + W额</text>
  </g>

  <!-- 第二步：机械效率 -->
  <g class="p47-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">机械效率：有用功跟总功的比值，总小于 1</text>

    <rect x="40" y="110" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="124" width="130" height="26" rx="13" fill="#e8effc"/>
    <text x="125" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">占比示意</text>

    <circle cx="240" cy="250" r="72" fill="none" stroke="#fbbf24" stroke-width="30"/>
    <g class="p47-ring">
      <path d="M240 178 A72 72 0 1 1 171.5 227.8" fill="none" stroke="#1d4ed8" stroke-width="30" stroke-linecap="butt"/>
    </g>
    <text x="240" y="246" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">η = 80%</text>
    <text x="240" y="272" font-size="11.5" fill="#64748b" text-anchor="middle">有用功占 80%</text>
    <rect x="96" y="356" width="16" height="16" rx="3" fill="#1d4ed8"/>
    <text x="120" y="370" font-size="11.5" font-weight="700" fill="#334155">W有 400 J</text>
    <rect x="248" y="356" width="16" height="16" rx="3" fill="#fbbf24"/>
    <text x="272" y="370" font-size="11.5" font-weight="700" fill="#334155">W额 100 J</text>

    <rect x="460" y="110" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="124" width="120" height="26" rx="13" fill="#e8effc"/>
    <text x="540" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">算一算</text>
    <text x="485" y="184" font-size="12.5" font-weight="700" fill="#334155">W有 = 400 J</text>
    <text x="485" y="212" font-size="12.5" font-weight="700" fill="#334155">W额 = 100 J</text>
    <text x="485" y="240" font-size="12.5" font-weight="700" fill="#334155">W总 = W有 + W额 = 500 J</text>
    <text x="660" y="300" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">η = 400/500 = 80%</text>
    <line x1="485" y1="266" x2="835" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="485" y="336" font-size="11.5" fill="#64748b">η 是比值，没有单位</text>
    <text x="485" y="360" font-size="11.5" fill="#64748b">额外功总存在，所以 η 总小于 1</text>
    <text x="485" y="384" font-size="11.5" fill="#64748b">机械效率不可能达到 100%</text>

    <g class="p47-pop" font-size="12" font-weight="800">
      <rect x="60" y="416" width="380" height="42" rx="12" fill="#dcfce7"/>
      <text x="250" y="442" fill="#047857" text-anchor="middle">W有 越大、W额 越小 → η 越高</text>
      <rect x="460" y="416" width="380" height="42" rx="12" fill="#e8effc"/>
      <text x="650" y="442" fill="#1e3a8a" text-anchor="middle">机械效率是比值，通常用百分数表示</text>
    </g>
  </g>

  <!-- 第三步：提高机械效率 -->
  <g class="p47-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">提高机械效率：减小额外功，提高有用功占比</text>

    <g class="p47-pop">
      <rect x="40" y="110" width="240" height="190" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="60" y="124" width="200" height="26" rx="13" fill="#e8effc"/>
      <text x="160" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 减轻动滑轮重</text>
      <circle cx="140" cy="205" r="30" fill="#f8fafc" stroke="#475569" stroke-width="5"/>
      <circle cx="140" cy="205" r="9" fill="#94a3b8"/>
      <line x1="140" y1="170" x2="140" y2="185" stroke="#64748b" stroke-width="6"/>
      <text x="140" y="212" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">轻</text>
      <line x1="205" y1="232" x2="205" y2="180" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
      <text x="160" y="272" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">减小额外功 W额</text>
      <text x="160" y="292" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">→ η 提高</text>
    </g>

    <g class="p47-pop">
      <rect x="330" y="110" width="240" height="190" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="350" y="124" width="200" height="26" rx="13" fill="#dcfce7"/>
      <text x="450" y="142" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">② 减小摩擦</text>
      <circle cx="430" cy="205" r="30" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
      <circle cx="430" cy="205" r="10" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>
      <g stroke="#64748b" stroke-width="3">
        <line x1="430" y1="169" x2="430" y2="177"/><line x1="430" y1="233" x2="430" y2="241"/>
        <line x1="394" y1="205" x2="402" y2="205"/><line x1="458" y1="205" x2="466" y2="205"/>
      </g>
      <path d="M492 220 q-12 14 0 24 q12 -10 0 -24 z" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
      <text x="450" y="272" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">减小克服摩擦做的功</text>
      <text x="450" y="292" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">→ η 提高</text>
    </g>

    <g class="p47-pop">
      <rect x="620" y="110" width="240" height="190" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="640" y="124" width="200" height="26" rx="13" fill="#fef3c7"/>
      <text x="740" y="142" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">③ 增大物重</text>
      <rect x="715" y="180" width="50" height="50" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <text x="740" y="212" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
      <line x1="795" y1="220" x2="795" y2="168" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
      <text x="810" y="200" font-size="12" font-weight="800" fill="#047857">+G</text>
      <text x="740" y="272" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">增大有用功占比</text>
      <text x="740" y="292" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">→ η 提高</text>
    </g>

    <rect x="60" y="320" width="780" height="130" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="348" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">同一滑轮组：提升的物重越大，机械效率越高</text>
    <text x="120" y="386" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">G 较小</text>
    <rect x="140" y="368" width="200" height="24" rx="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="354" y="386" font-size="11.5" font-weight="800" fill="#1e40af">η = 70%</text>
    <text x="120" y="423" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">G 较大</text>
    <rect x="140" y="405" width="260" height="24" rx="6" fill="#1d4ed8"/>
    <text x="414" y="423" font-size="11.5" font-weight="800" fill="#1e40af">η = 85%</text>
    <g class="p47-up">
      <line x1="510" y1="420" x2="510" y2="362" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    </g>
    <text x="528" y="396" font-size="12" font-weight="800" fill="#047857">η 提高</text>
    <text x="650" y="396" font-size="11.5" fill="#64748b">有用功占总功的比例变大</text>
  </g>
</svg>
