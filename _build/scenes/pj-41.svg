<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="功：推箱子做功、W等于Fs、不做功的三种情况">
<style>
.p41-s1,.p41-s2,.p41-s3{opacity:0;visibility:hidden}
.p41-s1{opacity:1;visibility:visible}
[data-scene="pj-41"] .p41-s1,[data-scene="pj-41"] .p41-s2,[data-scene="pj-41"] .p41-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-41"].s1 .p41-s1,[data-scene="pj-41"].s2 .p41-s2,[data-scene="pj-41"].s3 .p41-s3{opacity:1;visibility:visible}
@keyframes p41push{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes p41pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes p41pop{0%{transform:scale(.76);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p41flow{to{stroke-dashoffset:-36}}
@keyframes p41slide{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(46px);opacity:0}}
[data-scene="pj-41"].s1 .p41-arrow{animation:p41pulse 1.7s ease-in-out infinite}
[data-scene="pj-41"].s1 .p41-box{transform-box:fill-box;transform-origin:center;animation:p41push 2.2s ease-in-out infinite}
[data-scene="pj-41"].s2 .p41-card{transform-box:fill-box;transform-origin:center;animation:p41pop .5s ease both}
[data-scene="pj-41"].s2 .p41-card:nth-of-type(2){animation-delay:.14s}
[data-scene="pj-41"].s2 .p41-dash{stroke-dasharray:8 6;animation:p41flow 1.4s linear infinite}
[data-scene="pj-41"].s3 .p41-slide{animation:p41slide 2.4s ease-in-out infinite}
[data-scene="pj-41"].s3 .p41-mark{animation:p41pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">功：力与物体沿力的方向通过距离的乘积</text>

<!-- 第一步：推箱子做功 -->
<g class="p41-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">推着箱子前进：力 F 与位移 s 同方向，力对箱子做了功</text>

  <line x1="40" y1="404" x2="560" y2="404" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- 人 -->
  <circle cx="190" cy="258" r="17" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <line x1="190" y1="276" x2="190" y2="330" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <line x1="190" y1="292" x2="294" y2="338" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="190" y1="330" x2="165" y2="404" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="190" y1="330" x2="215" y2="404" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- 箱子 -->
  <g class="p41-box">
    <rect x="300" y="310" width="100" height="94" rx="8" fill="#fcd34d" stroke="#b45309" stroke-width="2.5"/>
    <line x1="300" y1="350" x2="400" y2="350" stroke="#b45309" stroke-width="1.5" opacity=".5"/>
    <text x="350" y="368" font-size="14" font-weight="800" fill="#78350f" text-anchor="middle">箱子</text>
  </g>

  <!-- F 与 s -->
  <line class="p41-arrow" x1="258" y1="362" x2="296" y2="362" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="262" y="352" font-size="13" font-weight="800" fill="#b91c1c">F</text>
  <line x1="300" y1="292" x2="478" y2="292" stroke="#059669" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="390" y="282" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">s</text>
  <line class="p41-dash" x1="480" y1="292" x2="480" y2="404" stroke="#86efac" stroke-width="2" opacity=".9"/>
  <rect x="480" y="310" width="98" height="94" rx="6" fill="none" stroke="#86efac" stroke-width="2" stroke-dasharray="6 5" opacity=".85"/>

  <!-- 公式面板 -->
  <rect x="580" y="100" width="280" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="600" y="116" width="90" height="28" rx="14" fill="#e8effc"/>
  <text x="645" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">功的计算</text>
  <text x="720" y="194" font-size="28" font-weight="900" fill="#1e3a8a" text-anchor="middle">W = F s</text>
  <text x="600" y="232" font-size="11.5" fill="#334155">W —— 功，单位 焦耳（J）</text>
  <text x="600" y="256" font-size="11.5" fill="#334155">F —— 力，单位 牛顿（N）</text>
  <text x="600" y="280" font-size="11.5" fill="#334155">s —— 沿力的方向的距离（m）</text>
  <rect x="600" y="296" width="240" height="46" rx="10" fill="#e8effc"/>
  <text x="720" y="325" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">1 J = 1 N · 1 m</text>
  <text x="720" y="364" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">F 与 s 必须同方向</text>
  <text x="720" y="382" font-size="11" fill="#64748b" text-anchor="middle">力越大、距离越长，做功越多</text>
</g>

<!-- 第二步：做功的条件 -->
<g class="p41-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">做功的条件：有力，并且沿力的方向通过距离，缺一不可</text>

  <g class="p41-card">
    <rect x="60" y="100" width="350" height="110" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="84" y="132" width="42" height="34" rx="4" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <line x1="130" y1="148" x2="170" y2="148" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <text x="192" y="146" font-size="14" font-weight="800" fill="#1e3a8a">有力：F ≠ 0</text>
    <text x="192" y="170" font-size="11.5" fill="#64748b">力作用在物体上</text>
  </g>

  <circle cx="450" cy="155" r="20" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="161" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">且</text>

  <g class="p41-card">
    <rect x="490" y="100" width="350" height="110" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <line x1="514" y1="160" x2="606" y2="160" stroke="#059669" stroke-width="4" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <text x="620" y="146" font-size="14" font-weight="800" fill="#1e3a8a">有距离：s ≠ 0</text>
    <text x="620" y="170" font-size="11.5" fill="#64748b">沿力的方向通过一段距离</text>
  </g>

  <!-- 同时满足示例 -->
  <rect x="60" y="232" width="780" height="112" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="110" y="264" width="76" height="58" rx="6" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
  <line x1="66" y1="292" x2="104" y2="292" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="72" y="282" font-size="12" font-weight="800" fill="#b91c1c">F</text>
  <line x1="110" y1="256" x2="300" y2="256" stroke="#059669" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="205" y="246" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">s</text>
  <text x="340" y="288" font-size="14" font-weight="800" fill="#1e3a8a">两个条件同时满足</text>
  <text x="340" y="312" font-size="12.5" fill="#334155">这个力才对物体做了功</text>
  <text x="620" y="300" font-size="22" font-weight="900" fill="#047857" text-anchor="middle">W = F s</text>

  <!-- 判断矩阵 -->
  <rect x="60" y="370" width="248" height="46" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="184" y="399" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">有力 √　有距离 √ → 做功</text>
  <rect x="326" y="370" width="248" height="46" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="399" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">有力 √　无距离 × → 不做功</text>
  <rect x="592" y="370" width="248" height="46" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="716" y="399" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">无力 ×　有距离 √ → 不做功</text>
</g>

<!-- 第三步：不做功的三种情况 -->
<g class="p41-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">不做功的三种情况：缺力、缺距离、力与距离垂直</text>

  <!-- 有力无距离 -->
  <rect x="36" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="80" y="112" width="172" height="30" rx="15" fill="#fee2e2"/>
  <text x="166" y="132" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">① 有力，但没有距离</text>

  <rect x="110" y="278" width="104" height="44" rx="7" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <path d="M122 278 L132 254 H192 L202 278 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <circle cx="132" cy="330" r="10" fill="#475569"/>
  <circle cx="192" cy="330" r="10" fill="#475569"/>
  <text x="162" y="306" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">小车</text>

  <circle cx="90" cy="246" r="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <line x1="90" y1="258" x2="90" y2="296" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="270" x2="110" y2="288" stroke="#1e3a8a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="290" x2="84" y2="290" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="58" y="280" font-size="12" font-weight="800" fill="#b91c1c">F</text>

  <text x="166" y="352" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">车没动，s = 0</text>
  <text x="166" y="380" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">W = 0</text>

  <!-- 有距离无力 -->
  <rect x="320" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="364" y="112" width="172" height="30" rx="15" fill="#fef3c7"/>
  <text x="450" y="132" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">② 有距离，但没有力</text>

  <line x1="346" y1="318" x2="554" y2="318" stroke="#93c5fd" stroke-width="3"/>
  <text x="548" y="338" font-size="11" fill="#0369a1" text-anchor="end">光滑冰面</text>
  <circle cx="382" cy="300" r="16" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <line class="p41-slide" x1="404" y1="300" x2="448" y2="300" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <path d="M370 300 H466" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>

  <circle cx="450" cy="220" r="22" fill="#f8fafc" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="450" y="226" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">F=0</text>
  <text x="450" y="258" font-size="11" fill="#64748b" text-anchor="middle">靠惯性继续运动</text>

  <text x="450" y="352" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">有距离，但没有力</text>
  <text x="450" y="380" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">W = 0</text>

  <!-- 力与距离垂直 -->
  <rect x="604" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="648" y="112" width="172" height="30" rx="15" fill="#dbeafe"/>
  <text x="734" y="132" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">③ 力与距离垂直</text>

  <circle cx="676" cy="236" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <line x1="676" y1="249" x2="676" y2="300" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="676" y1="264" x2="712" y2="288" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="676" y1="300" x2="656" y2="348" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="676" y1="300" x2="696" y2="348" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>

  <rect x="712" y="288" width="26" height="28" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <path d="M712 300 Q725 288 738 300" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <text x="754" y="308" font-size="11" font-weight="700" fill="#0369a1">水桶</text>

  <line x1="725" y1="288" x2="725" y2="238" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <text x="735" y="234" font-size="12" font-weight="800" fill="#1e40af">F</text>
  <line x1="650" y1="364" x2="770" y2="364" stroke="#059669" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="658" y="356" font-size="12" font-weight="800" fill="#047857">s</text>
  <path d="M725 300 h-14 v14" fill="none" stroke="#dc2626" stroke-width="2" class="p41-mark"/>

  <text x="734" y="350" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">提着水桶水平走</text>
  <text x="734" y="394" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F ⊥ s，W = 0</text>
</g>

<rect x="60" y="418" width="780" height="38" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="450" y="443" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断口诀：有力、有距离、且力与距离同方向 —— 三者同时满足才做功</text>
</svg>
