<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="功、热和内能的改变：做功、传热与W、Q、ΔU的关系">
<style>
[data-scene="ps-111"] .s111-s1,[data-scene="ps-111"] .s111-s2,[data-scene="ps-111"] .s111-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-111"].s1 .s111-s1,[data-scene="ps-111"].s2 .s111-s2,[data-scene="ps-111"].s3 .s111-s3{opacity:1;visibility:visible}
@keyframes s111fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s111draw{to{stroke-dashoffset:0}}
@keyframes s111pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s111flash{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes s111flow{to{stroke-dashoffset:-30}}
@keyframes s111heat{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="ps-111"].s1 .s111-piston{animation:s111fade .5s ease .12s both}
[data-scene="ps-111"].s1 .s111-flash{transform-box:fill-box;transform-origin:center;animation:s111flash 1.4s ease-in-out .5s infinite}
[data-scene="ps-111"].s1 .s111-press{stroke-dasharray:8 6;animation:s111flow 1s linear infinite}
[data-scene="ps-111"].s1 .s111-card{animation:s111fade .5s ease .3s both}
[data-scene="ps-111"].s2 .s111-block{animation:s111fade .5s ease .12s both}
[data-scene="ps-111"].s2 .s111-arrow{stroke-dasharray:8 7;animation:s111flow 1.1s linear infinite}
[data-scene="ps-111"].s2 .s111-equal{animation:s111heat 2.2s ease-in-out infinite}
[data-scene="ps-111"].s2 .s111-card{animation:s111fade .5s ease .3s both}
[data-scene="ps-111"].s3 .s111-eq{transform-box:fill-box;transform-origin:center;animation:s111pop .55s ease .2s both}
[data-scene="ps-111"].s3 .s111-core{animation:s111fade .5s ease .35s both}
[data-scene="ps-111"].s3 .s111-w{stroke-dasharray:150;stroke-dashoffset:150;animation:s111draw .9s ease .5s forwards}
[data-scene="ps-111"].s3 .s111-q{stroke-dasharray:130;stroke-dashoffset:130;animation:s111draw .9s ease .8s forwards}
[data-scene="ps-111"].s3 .s111-card{animation:s111fade .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">功、热和内能的改变：做功与传热</text>

<!-- 第一步：做功改变内能 -->
<g class="s111-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">外界对物体做功，物体的内能增加、温度升高</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="s111-piston">
    <rect x="170" y="170" width="140" height="170" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.6"/>
    <rect x="186" y="186" width="108" height="142" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="188" y="278" width="104" height="44" fill="#dbeafe"/>
    <circle cx="205" cy="294" r="3" fill="#1d4ed8"/>
    <circle cx="230" cy="306" r="3" fill="#1d4ed8"/>
    <circle cx="256" cy="290" r="3" fill="#1d4ed8"/>
    <circle cx="276" cy="308" r="3" fill="#1d4ed8"/>
    <circle cx="214" cy="316" r="3" fill="#1d4ed8"/>
    <circle cx="284" cy="292" r="3" fill="#1d4ed8"/>
    <rect x="182" y="208" width="116" height="20" rx="2" fill="#64748b"/>
    <rect x="234" y="130" width="12" height="78" fill="#94a3b8"/>
    <rect x="198" y="114" width="84" height="16" rx="6" fill="#475569"/>
    <path class="s111-flash" d="M 240 292 L 248 304 L 262 302 L 251 312 L 257 326 L 240 318 L 223 326 L 229 312 L 218 302 L 232 304 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.4"/>
    <circle cx="221" cy="322" r="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="259" cy="322" r="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="140" y="120" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">下压</text>
    <line class="s111-press" x1="310" y1="130" x2="310" y2="204" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  </g>

  <text x="330" y="170" font-size="11" fill="#475569">压缩引火仪</text>

  <rect x="330" y="286" width="200" height="46" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="430" y="306" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">迅速压缩：气体被压缩</text>
  <text x="430" y="324" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">温度升高，棉花被点燃</text>

  <text x="60" y="388" font-size="11.5" font-weight="700" fill="#334155">外界对气体做功，气体内能增加、温度升高</text>
  <text x="60" y="412" font-size="11.5" fill="#64748b">棉花燃烧说明：做功可以改变物体的内能</text>

  <g class="s111-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">做功改变内能</text>

    <rect x="596" y="158" width="248" height="62" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="182" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">W 大于 0 → 内能增加</text>
    <text x="720" y="206" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">W 小于 0 → 内能减少</text>

    <text x="610" y="246" font-size="11.5" fill="#334155">压缩气体：外界对气体做功</text>
    <text x="610" y="270" font-size="11.5" fill="#334155">气体内能增加，温度升高</text>
    <text x="610" y="294" font-size="11.5" fill="#334155">气体膨胀：气体对外界做功</text>
    <text x="610" y="318" font-size="11.5" fill="#334155">气体内能减少，温度降低</text>

    <rect x="596" y="332" width="248" height="58" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="720" y="356" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">绝热过程：Q = 0，ΔU = W</text>
    <text x="720" y="378" font-size="11" fill="#065f46" text-anchor="middle">内能的改变完全由做功决定</text>

    <text x="610" y="412" font-size="11.5" fill="#334155">搓手取暖、钻木取火</text>
    <text x="610" y="432" font-size="11" fill="#64748b">本质：机械能转化为内能</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">外界对物体做功，内能增加；物体对外界做功，内能减少</text>
</g>

<!-- 第二步：热传递 -->
<g class="s111-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">热传递：内能从高温物体转移到低温物体</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">温度不同的两个物体相互接触</text>

  <g class="s111-block">
    <text x="155" y="188" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">放出热量</text>
    <text x="345" y="188" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">吸收热量</text>
    <rect x="100" y="200" width="110" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.6"/>
    <text x="155" y="248" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="middle">高温物体</text>
    <text x="155" y="280" font-size="15" font-weight="900" fill="#991b1b" text-anchor="middle">80 ℃</text>

    <rect x="290" y="200" width="110" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.6"/>
    <text x="345" y="248" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">低温物体</text>
    <text x="345" y="280" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">20 ℃</text>
  </g>

  <line class="s111-arrow" x1="216" y1="260" x2="284" y2="260" stroke="#dc2626" stroke-width="3.6" marker-end="url(#arrRed)"/>
  <text x="250" y="246" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">Q</text>
  <text x="250" y="286" font-size="11" fill="#b91c1c" text-anchor="middle">传热</text>

  <rect class="s111-equal" x="170" y="350" width="240" height="44" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="290" y="377" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">热平衡：温度相同，净传热为零</text>

  <text x="60" y="420" font-size="11.5" font-weight="700" fill="#334155">热传递使内能发生转移，能量的总量保持不变</text>

  <g class="s111-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热传递</text>

    <text x="610" y="170" font-size="12" font-weight="900" fill="#1e3a8a">条件与方向</text>
    <text x="610" y="194" font-size="11.5" fill="#334155">两物体之间存在温度差</text>
    <text x="610" y="218" font-size="11.5" fill="#334155">自发地从高温物体传到低温物体</text>

    <text x="610" y="248" font-size="12" font-weight="900" fill="#1e3a8a">方式</text>
    <text x="610" y="272" font-size="11.5" fill="#334155">传导、对流、辐射</text>

    <text x="610" y="302" font-size="12" font-weight="900" fill="#1e3a8a">热量 Q</text>
    <text x="610" y="326" font-size="11.5" fill="#334155">过程量：吸热为正，放热为负</text>
    <text x="610" y="350" font-size="11.5" fill="#334155">只能说吸收或放出多少热量</text>

    <rect x="596" y="366" width="248" height="56" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="390" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">本质：内能在物体间转移</text>
    <text x="720" y="410" font-size="11" fill="#92400e" text-anchor="middle">不是内能与其他形式能的转化</text>

    <text x="720" y="432" font-size="11" fill="#64748b" text-anchor="middle">热平衡时温度相同</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热传递的方向总是从高温物体到低温物体，直到温度相同</text>
</g>

<!-- 第三步：W、Q 与 ΔU -->
<g class="s111-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">做功和传热都能改变内能，ΔU = W + Q</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="s111-eq">
    <rect x="60" y="116" width="470" height="94" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="295" y="142" font-size="11.5" fill="#92400e" text-anchor="middle">例：外界压缩气体做功 200 J，同时气体吸热 100 J</text>
    <text x="295" y="172" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">ΔU = W + Q = 200 + 100 = 300 J</text>
    <text x="295" y="196" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">气体内能增加了 300 J</text>
  </g>

  <g class="s111-core">
    <rect x="210" y="256" width="170" height="88" rx="14" fill="#e8effc" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="295" y="288" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">物体内能 U</text>
    <text x="295" y="316" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">ΔU</text>
    <text x="295" y="334" font-size="11" fill="#475569" text-anchor="middle">内能的变化</text>
  </g>

  <line class="s111-w" x1="70" y1="300" x2="206" y2="300" stroke="#1d4ed8" stroke-width="3.4" marker-end="url(#arrBlue)"/>
  <text x="126" y="288" font-size="14" font-weight="900" fill="#1e40af" text-anchor="middle">W</text>
  <text x="126" y="322" font-size="11" fill="#1e40af" text-anchor="middle">外界对物体做功</text>

  <line class="s111-q" x1="295" y1="430" x2="295" y2="348" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <text x="312" y="404" font-size="14" font-weight="900" fill="#b91c1c">Q</text>
  <text x="312" y="424" font-size="11" fill="#b91c1c">物体吸热</text>

  <text x="60" y="432" font-size="11" fill="#64748b">吸收热量 Q 为正，放出热量 Q 为负</text>

  <g class="s111-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">W、Q 与 ΔU 的关系</text>

    <text x="720" y="182" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle">ΔU = W + Q</text>
    <line x1="596" y1="196" x2="844" y2="196" stroke="#e8eef7" stroke-width="1.5"/>

    <text x="608" y="222" font-size="11.5" fill="#334155">W 大于 0：外界对物体做功</text>
    <text x="608" y="246" font-size="11.5" fill="#334155">W 小于 0：物体对外界做功</text>
    <text x="608" y="270" font-size="11.5" fill="#334155">Q 大于 0：物体吸收热量</text>
    <text x="608" y="294" font-size="11.5" fill="#334155">Q 小于 0：物体放出热量</text>
    <text x="608" y="318" font-size="11.5" fill="#334155">ΔU 大于 0：内能增加</text>
    <text x="608" y="342" font-size="11.5" fill="#334155">ΔU 小于 0：内能减少</text>

    <rect x="596" y="356" width="248" height="56" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="720" y="380" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">绝热：Q = 0，ΔU = W</text>
    <text x="720" y="400" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">不做功：W = 0，ΔU = Q</text>

    <text x="720" y="430" font-size="11" fill="#64748b" text-anchor="middle">做功是转化，传热是转移</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">ΔU = W + Q：做功和传热是改变内能的两种等效方式</text>
</g>
</svg>
