    <rect x="70" y="236" width="28" height="34" rx="3" fill="#1d4ed8"/>
    <rect x="98" y="236" width="28" height="34" rx="3" fill="#dc2626"/>
    <text x="84" y="259" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <text x="112" y="259" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    <line x1="66" y1="224" x2="126" y2="224" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrAmber)"/>
    <text x="96" y="216" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">靠近</text>

    <ellipse cx="164" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="176" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="188" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>

    <line class="s88-arrow" x1="132" y1="233" x2="222" y2="233" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
    <text x="206" y="225" font-size="11" font-weight="800" fill="#1d4ed8">B原</text>
    <line class="s88-arrow" x1="222" y1="291" x2="132" y2="291" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="206" y="311" font-size="11" font-weight="800" fill="#b91c1c">B感</text>

    <text x="170" y="338" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">感应磁场与原磁场反向</text>
    <text x="170" y="366" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">增反</text>
  </g>

  <g class="s88-panel s88-panel2">
    <rect x="308" y="154" width="228" height="238" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="422" y="180" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">磁通量减小</text>
    <text x="422" y="200" font-size="11" fill="#64748b" text-anchor="middle">磁体远离线圈</text>

    <rect x="322" y="236" width="28" height="34" rx="3" fill="#1d4ed8"/>
    <rect x="350" y="236" width="28" height="34" rx="3" fill="#dc2626"/>
    <text x="336" y="259" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <text x="364" y="259" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    <line x1="382" y1="224" x2="322" y2="224" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrAmber)"/>
    <text x="352" y="216" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">远离</text>

    <ellipse cx="416" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="428" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="440" cy="252" rx="7" ry="34" fill="none" stroke="#b45309" stroke-width="2.5"/>

    <line class="s88-arrow" x1="384" y1="233" x2="474" y2="233" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
    <text x="458" y="225" font-size="11" font-weight="800" fill="#1d4ed8">B原</text>
    <line class="s88-arrow" x1="384" y1="291" x2="474" y2="291" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="458" y="311" font-size="11" font-weight="800" fill="#b91c1c">B感</text>

    <text x="422" y="338" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">感应磁场与原磁场同向</text>
    <text x="422" y="366" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">减同</text>
  </g>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">增反减同</text>

  <rect x="596" y="158" width="248" height="58" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="720" y="182" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Φ 增加</text>
  <text x="720" y="203" font-size="11.5" fill="#334155" text-anchor="middle">B感 与 B原 反向</text>

  <rect x="596" y="224" width="248" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="248" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Φ 减小</text>
  <text x="720" y="269" font-size="11.5" fill="#334155" text-anchor="middle">B感 与 B原 同向</text>

  <rect x="596" y="290" width="248" height="46" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="318" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">阻碍不是阻止</text>

  <text x="720" y="366" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断口诀：增反减同</text>
  <text x="720" y="392" font-size="11" fill="#475569" text-anchor="middle">先判断 Φ 增减，再定 B感 方向</text>
  <text x="720" y="416" font-size="11" fill="#64748b" text-anchor="middle">阻碍只延缓变化，不改变趋势</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">增反减同：原磁通量增加则感应磁场反向，减小则同向</text>
</g>

<!-- 第三步：来拒去留 -->
<g class="s88-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">来拒去留：感应电流的磁场阻碍磁体与线圈的相对运动</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="s88-panel">
    <rect x="56" y="154" width="228" height="238" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="170" y="180" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">磁体靠近（来）</text>

    <g class="s88-magnet2">
      <rect x="68" y="224" width="28" height="34" rx="3" fill="#1d4ed8"/>
      <rect x="96" y="224" width="28" height="34" rx="3" fill="#dc2626"/>
      <text x="82" y="247" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
      <text x="110" y="247" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    </g>
    <line x1="62" y1="212" x2="122" y2="212" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrAmber)"/>
    <text x="92" y="204" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">靠近</text>

    <ellipse cx="176" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="190" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="204" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="166" y="248" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="end">N</text>

    <line class="s88-force" x1="110" y1="292" x2="60" y2="292" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="92" y="312" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">斥力</text>

    <text x="170" y="340" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">感应磁场把磁体往外推</text>
    <text x="170" y="366" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">来拒</text>
  </g>

  <g class="s88-panel s88-panel2">
    <rect x="308" y="154" width="228" height="238" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="422" y="180" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">磁体远离（去）</text>

    <g class="s88-magnet2">
      <rect x="320" y="224" width="28" height="34" rx="3" fill="#1d4ed8"/>
      <rect x="348" y="224" width="28" height="34" rx="3" fill="#dc2626"/>
      <text x="334" y="247" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
      <text x="362" y="247" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    </g>
    <line x1="382" y1="212" x2="322" y2="212" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrAmber)"/>
    <text x="352" y="204" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">远离</text>

    <ellipse cx="428" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="442" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="456" cy="241" rx="7" ry="30" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <text x="418" y="248" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="end">S</text>

    <line class="s88-force" x1="338" y1="292" x2="388" y2="292" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="362" y="312" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">引力</text>

    <text x="422" y="340" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">感应磁场把磁体往回拉</text>
    <text x="422" y="366" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">去留</text>
  </g>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">来拒去留</text>

  <text x="720" y="172" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">从力的角度看</text>
  <text x="720" y="196" font-size="11.5" fill="#334155" text-anchor="middle">感应电流的磁场阻碍</text>
  <text x="720" y="218" font-size="11.5" fill="#334155" text-anchor="middle">磁体与线圈的相对运动</text>

  <rect x="596" y="238" width="248" height="36" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="720" y="261" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">来 → 拒（排斥）</text>
  <rect x="596" y="282" width="248" height="36" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="305" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">去 → 留（吸引）</text>
  <rect x="596" y="326" width="248" height="36" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="349" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">阻碍相对运动，不是阻止</text>

  <text x="600" y="390" font-size="11" fill="#334155">应用：电磁阻尼、电磁制动</text>
  <text x="600" y="414" font-size="11" fill="#64748b">本质：机械能与电能的转化</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">来拒去留：感应电流的磁场总是阻碍磁体与线圈的相对运动</text>
