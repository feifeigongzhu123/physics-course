<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="测量小灯泡的电功率：实验电路、调节额定电压、读电压电流计算功率">
<style>
.p68-s1,.p68-s2,.p68-s3{opacity:0;visibility:hidden}
.p68-s1{opacity:1;visibility:visible}
[data-scene="pj-68"] .p68-s1,[data-scene="pj-68"] .p68-s2,[data-scene="pj-68"] .p68-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-68"].s1 .p68-s1,[data-scene="pj-68"].s2 .p68-s2,[data-scene="pj-68"].s3 .p68-s3{opacity:1;visibility:visible}
@keyframes p68pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p68draw{to{stroke-dashoffset:0}}
@keyframes p68pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p68slide{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes p68rise{0%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
[data-scene="pj-68"].s1 .p68-wire{stroke-dasharray:1100;stroke-dashoffset:1100;animation:p68draw 1.3s ease .1s forwards}
[data-scene="pj-68"].s1 .p68-lamp{transform-box:fill-box;transform-origin:center;animation:p68pulse 1.8s ease-in-out infinite}
[data-scene="pj-68"].s1 .p68-plate{transform-box:fill-box;transform-origin:center;animation:p68pop .55s ease .8s both}
[data-scene="pj-68"].s2 .p68-meter{transform-box:fill-box;transform-origin:center;animation:p68pop .55s ease both}
[data-scene="pj-68"].s2 .p68-fill{transform-box:fill-box;transform-origin:left center;animation:p68rise .9s ease .4s both}
[data-scene="pj-68"].s2 .p68-slider{animation:p68pulse 1.8s ease-in-out infinite}
[data-scene="pj-68"].s3 .p68-row{animation:p68slide .5s ease both}
[data-scene="pj-68"].s3 .p68-row2{animation-delay:.12s}
[data-scene="pj-68"].s3 .p68-row3{animation-delay:.24s}
[data-scene="pj-68"].s3 .p68-result{transform-box:fill-box;transform-origin:center;animation:p68pop .55s ease .4s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">测量小灯泡的电功率：P = UI，调额定电压，读数计算</text>

<!-- 第一步：实验电路 -->
<g class="p68-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">原理 P = UI：电压表并联测 U，电流表串联测 I，滑动变阻器串联调压</text>

  <rect x="36" y="100" width="540" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="210" height="28" rx="14" fill="#e8effc"/>
  <text x="161" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">测量小灯泡电功率</text>

  <path class="p68-wire" d="M90 220 H500 V360 H90 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>

  <g class="p68-lamp">
    <circle cx="203" cy="220" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <line x1="189" y1="206" x2="217" y2="234" stroke="#d97706" stroke-width="2"/>
    <line x1="217" y1="206" x2="189" y2="234" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="275" y="225" font-size="11.5" font-weight="800" fill="#92400e">小灯泡 L</text>

  <line x1="183" y1="200" x2="183" y2="165" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="183" y1="165" x2="223" y2="165" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="223" y1="165" x2="223" y2="200" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="203" cy="165" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="203" y="171" font-size="12.5" font-weight="900" fill="#1e40af" text-anchor="middle">V</text>
  <text x="253" y="169" font-size="11.5" font-weight="700" fill="#1d4ed8">电压表并联</text>

  <circle cx="395" cy="220" r="19" fill="#ffffff" stroke="#059669" stroke-width="2.5"/>
  <text x="395" y="226" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">A</text>
  <text x="395" y="256" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">电流表串联</text>

  <line x1="200" y1="346" x2="200" y2="374" stroke="#334155" stroke-width="4"/>
  <line x1="214" y1="352" x2="214" y2="368" stroke="#334155" stroke-width="4"/>
  <text x="207" y="392" font-size="11" fill="#64748b" text-anchor="middle">电源</text>

  <g class="p68-slider">
    <rect x="260" y="348" width="100" height="24" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <line x1="274" y1="342" x2="348" y2="342" stroke="#b45309" stroke-width="2"/>
    <polygon points="348,342 338,337 338,347" fill="#b45309"/>
  </g>
  <text x="310" y="334" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">滑动变阻器</text>

  <circle cx="420" cy="360" r="4" fill="#334155"/>
  <circle cx="452" cy="360" r="4" fill="#334155"/>
  <line x1="420" y1="360" x2="446" y2="346" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="436" y="338" font-size="11.5" font-weight="800" fill="#64748b" text-anchor="middle">S</text>

  <text x="306" y="396" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电流表串联 · 电压表并联 · 滑动变阻器串联</text>

  <rect x="596" y="100" width="268" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="616" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="691" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">连接要点</text>

  <rect x="616" y="158" width="228" height="50" rx="9" fill="#e8effc"/>
  <text x="632" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a">电流表：串联</text>
  <text x="632" y="198" font-size="11" fill="#334155">测通过灯泡的电流</text>

  <rect x="616" y="218" width="228" height="50" rx="9" fill="#e6f7f1"/>
  <text x="632" y="238" font-size="11.5" font-weight="800" fill="#047857">电压表：并联</text>
  <text x="632" y="258" font-size="11" fill="#334155">测灯泡两端的电压</text>

  <rect x="616" y="278" width="228" height="50" rx="9" fill="#fff7ed"/>
  <text x="632" y="298" font-size="11.5" font-weight="800" fill="#b45309">滑动变阻器：串联</text>
  <text x="632" y="318" font-size="11" fill="#334155">改变灯泡两端电压</text>

  <g class="p68-plate">
    <rect x="616" y="340" width="228" height="46" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="730" y="369" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">原理：P = UI</text>
  </g>
</g>

<!-- 第二步：调节额定电压 -->
<g class="p68-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">调节滑动变阻器，使电压表示数达到额定电压 2.5 V</text>

  <rect x="36" y="100" width="520" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">调节额定电压</text>

  <g class="p68-meter">
    <rect x="70" y="150" width="300" height="110" rx="10" fill="#f8fbff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="220" y="174" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">电压表</text>
    <text x="220" y="226" font-size="44" font-weight="900" fill="#1e3a8a" text-anchor="middle">2.5 V</text>
    <text x="220" y="248" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">额定电压</text>

    <rect x="90" y="264" width="260" height="10" rx="5" fill="#e2e8f0"/>
    <rect class="p68-fill" x="90" y="264" width="216" height="10" rx="5" fill="#1d4ed8"/>
    <text x="90" y="292" font-size="11" fill="#64748b" text-anchor="middle">0</text>
    <text x="350" y="292" font-size="11" fill="#64748b" text-anchor="middle">3 V</text>
  </g>

  <text x="286" y="318" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">移动滑片，眼睛注视电压表</text>

  <line x1="90" y1="352" x2="500" y2="352" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <rect x="250" y="342" width="100" height="20" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <line x1="330" y1="334" x2="330" y2="342" stroke="#b45309" stroke-width="2"/>
  <polygon points="330,328 322,336 338,336" fill="#b45309"/>
  <text x="240" y="340" font-size="11" font-weight="800" fill="#92400e" text-anchor="end">滑片</text>

  <text x="286" y="380" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">滑片向右移 → 接入电阻变小 → 灯泡电压变大</text>
  <text x="286" y="400" font-size="11" fill="#64748b" text-anchor="middle">示数达到 2.5 V 时停止移动滑片</text>

  <rect x="556" y="100" width="308" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="576" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="651" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">操作步骤</text>

  <rect x="576" y="156" width="268" height="44" rx="9" fill="#e8effc"/>
  <text x="592" y="183" font-size="11.5" font-weight="700" fill="#1e3a8a">① 开关断开，滑片调到最大阻值</text>
  <rect x="576" y="208" width="268" height="44" rx="9" fill="#e6f7f1"/>
  <text x="592" y="235" font-size="11.5" font-weight="700" fill="#047857">② 闭合开关，移动滑片</text>
  <rect x="576" y="260" width="268" height="44" rx="9" fill="#fff7ed"/>
  <text x="592" y="287" font-size="11.5" font-weight="700" fill="#b45309">③ 电压表示数为 2.5 V</text>
  <rect x="576" y="312" width="268" height="44" rx="9" fill="#f3e8ff"/>
  <text x="592" y="339" font-size="11.5" font-weight="700" fill="#7e22ce">④ 读出电流表示数并记录</text>

  <rect x="576" y="364" width="268" height="32" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="710" y="385" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">电压不能超过额定电压过多</text>
</g>

<!-- 第三步：读数计算 -->
<g class="p68-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">读出 U 和 I，用 P = UI 算出功率；额定电压下的功率才是额定功率</text>

  <rect x="36" y="100" width="520" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">记录与计算</text>

  <rect x="60" y="158" width="472" height="30" fill="#e8effc"/>
  <text x="82" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">次数</text>
  <text x="172" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">U/V</text>
  <text x="272" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">I/A</text>
  <text x="362" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">P/W</text>
  <text x="452" y="178" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">发光</text>

  <g class="p68-row">
    <rect x="60" y="188" width="472" height="32" fill="#f8fbff"/>
    <text x="82" y="209" font-size="12" fill="#334155" text-anchor="middle">1</text>
    <text x="172" y="209" font-size="12" fill="#334155" text-anchor="middle">2.0</text>
    <text x="272" y="209" font-size="12" fill="#334155" text-anchor="middle">0.26</text>
    <text x="362" y="209" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">0.52</text>
    <text x="452" y="209" font-size="11.5" fill="#64748b" text-anchor="middle">较暗</text>
  </g>

  <g class="p68-row p68-row2">
    <rect x="60" y="220" width="472" height="32" fill="#e6f7f1"/>
    <text x="82" y="241" font-size="12" fill="#334155" text-anchor="middle">2</text>
    <text x="172" y="241" font-size="12" fill="#334155" text-anchor="middle">2.5</text>
    <text x="272" y="241" font-size="12" fill="#334155" text-anchor="middle">0.30</text>
    <text x="362" y="241" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">0.75</text>
    <text x="452" y="241" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">正常</text>
  </g>

  <g class="p68-row p68-row3">
    <rect x="60" y="252" width="472" height="32" fill="#f8fbff"/>
    <text x="82" y="273" font-size="12" fill="#334155" text-anchor="middle">3</text>
    <text x="172" y="273" font-size="12" fill="#334155" text-anchor="middle">2.8</text>
    <text x="272" y="273" font-size="12" fill="#334155" text-anchor="middle">0.32</text>
    <text x="362" y="273" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">0.90</text>
    <text x="452" y="273" font-size="11.5" fill="#64748b" text-anchor="middle">较亮</text>
  </g>

  <g class="p68-result">
    <rect x="60" y="296" width="472" height="54" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="296" y="320" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">P额 = U额 × I额 = 2.5 V × 0.30 A</text>
    <text x="296" y="341" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">P额 = 0.75 W</text>
  </g>

  <text x="296" y="374" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">每一行的 P 都由该行的 U 和 I 相乘得到</text>
  <text x="296" y="396" font-size="11" fill="#64748b" text-anchor="middle">电压不同，实际功率不同，灯的亮度也不同</text>

  <rect x="556" y="100" width="308" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="576" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="651" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">结论与注意</text>

  <text x="710" y="172" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">额定电压下的功率才是额定功率</text>
  <text x="710" y="198" font-size="13" font-weight="900" fill="#047857" text-anchor="middle">P额 = 0.75 W</text>

  <rect x="576" y="214" width="268" height="34" rx="8" fill="#f8fbff"/>
  <text x="590" y="236" font-size="11" fill="#334155">电压低于额定：功率偏小，灯较暗</text>
  <rect x="576" y="252" width="268" height="34" rx="8" fill="#f8fbff"/>
  <text x="590" y="274" font-size="11" fill="#334155">电压高于额定：功率偏大，灯较亮</text>
  <rect x="576" y="290" width="268" height="34" rx="8" fill="#e6f7f1"/>
  <text x="590" y="312" font-size="11" fill="#047857">灯丝电阻随温度升高而变大</text>
  <rect x="576" y="328" width="268" height="34" rx="8" fill="#fff7ed"/>
  <text x="590" y="350" font-size="11" fill="#b45309">三次电阻不同，不能求平均电阻</text>
  <rect x="576" y="366" width="268" height="34" rx="8" fill="#fef2f2"/>
  <text x="590" y="388" font-size="11" font-weight="700" fill="#b91c1c">三次功率也不能求平均作额定功率</text>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">测量小灯泡电功率：调额定电压 → 读 U、I → 用 P=UI 算出额定功率</text>
</g>
</svg>
