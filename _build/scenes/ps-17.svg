<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="牛顿第一定律：惯性定律、惯性只与质量有关、力改变运动状态">
<style>
[data-scene="ps-17"] .s17-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-17"].s1 .s17-step1,[data-scene="ps-17"].s2 .s17-step2,[data-scene="ps-17"].s3 .s17-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s17draw{to{stroke-dashoffset:0}}
@keyframes s17pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s17grow{from{opacity:0}to{opacity:1}}
@keyframes s17pulse{0%,100%{opacity:.45}50%{opacity:1}}
[data-scene="ps-17"].s1 .s17-law{transform-box:fill-box;transform-origin:center;animation:s17pop .5s ease .1s both}
[data-scene="ps-17"].s1 .s17-ball{transform-box:fill-box;transform-origin:center;animation:s17pop .4s ease .5s both}
[data-scene="ps-17"].s1 .s17-a1{stroke-dasharray:100;stroke-dashoffset:100;animation:s17draw .5s ease .8s forwards}
[data-scene="ps-17"].s1 .s17-a2{stroke-dasharray:160;stroke-dashoffset:160;animation:s17draw .5s ease 1.1s forwards}
[data-scene="ps-17"].s1 .s17-a3{stroke-dasharray:230;stroke-dashoffset:230;animation:s17draw .5s ease 1.4s forwards}
[data-scene="ps-17"].s1 .s17-a4{animation:s17grow .7s ease 1.7s both}
[data-scene="ps-17"].s2 .s17-row{animation:s17grow .45s ease both}
[data-scene="ps-17"].s2 .s17-row2{animation-delay:.2s}
[data-scene="ps-17"].s2 .s17-dv{stroke-dasharray:160;stroke-dashoffset:160;animation:s17draw .6s ease .5s forwards}
[data-scene="ps-17"].s2 .s17-dv2{animation-delay:.8s}
[data-scene="ps-17"].s2 .s17-card{transform-box:fill-box;transform-origin:center;animation:s17pop .5s ease .3s both}
[data-scene="ps-17"].s3 .s17-v{stroke-dasharray:140;stroke-dashoffset:140;animation:s17draw .5s ease .3s forwards}
[data-scene="ps-17"].s3 .s17-force{animation:s17pulse 1.5s ease-in-out .8s infinite}
[data-scene="ps-17"].s3 .s17-curve{animation:s17grow .8s ease 1.2s both}
[data-scene="ps-17"].s3 .s17-card{transform-box:fill-box;transform-origin:center;animation:s17pop .5s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">牛顿第一定律：力是改变运动状态的原因</text>

<!-- 第一步：定律内容 -->
<g class="s17-step s17-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 一切物体总保持原来的运动状态</text>

  <g class="s17-law">
    <rect x="70" y="96" width="760" height="92" rx="14" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="450" y="122" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">牛顿第一定律（惯性定律）</text>
    <text x="450" y="148" font-size="13" fill="#1e293b" text-anchor="middle">一切物体总保持匀速直线运动状态或静止状态，直到有外力迫使它改变这种状态为止。</text>
    <text x="450" y="174" font-size="11.5" fill="#475569" text-anchor="middle">定律不能直接由实验得出，它是在大量实验的基础上推理概括出来的</text>
  </g>

  <polygon points="100,400 100,268 210,400" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.2"/>
  <line x1="60" y1="268" x2="248" y2="268" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="256" y="264" font-size="11.5" fill="#64748b">同一高度释放</text>
  <circle class="s17-ball" cx="139" cy="293" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="520" y="238" font-size="12.5" fill="#475569" text-anchor="middle">推理：若水平面绝对光滑，小球将永远做匀速直线运动</text>

  <line x1="100" y1="400" x2="840" y2="400" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="240" y1="408" x2="240" y2="496" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="5 5"/>

  <line class="s17-a1" x1="240" y1="428" x2="340" y2="428" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <text x="348" y="432" font-size="11.5" font-weight="800" fill="#b91c1c">毛巾 s₁</text>
  <line class="s17-a2" x1="240" y1="448" x2="400" y2="448" stroke="#d97706" stroke-width="3.4" marker-end="url(#arrAmber)"/>
  <text x="408" y="452" font-size="11.5" font-weight="800" fill="#b45309">棉布 s₂</text>
  <line class="s17-a3" x1="240" y1="468" x2="470" y2="468" stroke="#059669" stroke-width="3.4" marker-end="url(#arrGreen)"/>
  <text x="478" y="472" font-size="11.5" font-weight="800" fill="#047857">木板 s₃</text>
  <line class="s17-a4" x1="240" y1="488" x2="820" y2="488" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrBlue)"/>
  <text x="700" y="512" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">理想光滑面：一直运动下去</text>

  <text x="330" y="512" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">s₁ ＜ s₂ ＜ s₃</text>
</g>

<!-- 第二步：惯性只与质量有关 -->
<g class="s17-step s17-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 惯性：保持原来运动状态的性质</text>

  <text x="250" y="122" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">用相同大小的力 F 推</text>

  <g class="s17-row">
    <rect x="110" y="190" width="130" height="90" rx="8" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.2"/>
    <text x="175" y="244" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">2m</text>
    <line x1="240" y1="220" x2="320" y2="220" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
    <text x="330" y="214" font-size="12.5" font-weight="800" fill="#b91c1c">F</text>
    <line class="s17-dv" x1="130" y1="300" x2="170" y2="300" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
    <text x="180" y="304" font-size="11.5" font-weight="800" fill="#047857">Δv 小：运动状态难改变</text>
  </g>

  <g class="s17-row s17-row2">
    <rect x="110" y="358" width="90" height="72" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
    <text x="155" y="400" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">m</text>
    <line x1="200" y1="390" x2="280" y2="390" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
    <text x="290" y="384" font-size="12.5" font-weight="800" fill="#b91c1c">F</text>
    <line class="s17-dv s17-dv2" x1="130" y1="452" x2="250" y2="452" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
    <text x="260" y="456" font-size="11.5" font-weight="800" fill="#047857">Δv 大：运动状态易改变</text>
  </g>

  <rect class="s17-card" x="480" y="110" width="370" height="360" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="480" y="110" width="370" height="8" rx="4" fill="#1d4ed8"/>
  <text x="665" y="156" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">惯性</text>
  <text x="665" y="182" font-size="11.5" fill="#64748b" text-anchor="middle">物体保持原来运动状态不变的性质</text>
  <line x1="505" y1="200" x2="825" y2="200" stroke="#e8eef7" stroke-width="1.5"/>
  <text x="505" y="228" font-size="12.5" font-weight="900" fill="#b91c1c">惯性大小只由质量决定</text>
  <circle cx="512" cy="256" r="3.6" fill="#1d4ed8"/>
  <text x="526" y="261" font-size="12.5" fill="#334155">质量越大，惯性越大</text>
  <circle cx="512" cy="286" r="3.6" fill="#1d4ed8"/>
  <text x="526" y="291" font-size="12.5" fill="#334155">与速度大小无关</text>
  <circle cx="512" cy="316" r="3.6" fill="#1d4ed8"/>
  <text x="526" y="321" font-size="12.5" fill="#334155">与受力情况无关</text>
  <line x1="505" y1="344" x2="825" y2="344" stroke="#e8eef7" stroke-width="1.5"/>
  <text x="505" y="374" font-size="12" font-weight="800" fill="#b45309">惯性不是力，是物体的固有属性</text>
  <text x="505" y="400" font-size="11.5" fill="#475569">不能说“物体受到惯性作用”</text>
  <text x="505" y="424" font-size="11.5" fill="#475569">不能说“惯性力”“惯性作用”</text>
  <text x="665" y="454" font-size="11.5" fill="#64748b" text-anchor="middle">牛顿第一定律又叫惯性定律</text>
</g>

<!-- 第三步：力改变运动状态 -->
<g class="s17-step s17-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 力不是维持运动的原因，而是改变运动状态的原因</text>

  <text x="250" y="120" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">不受外力</text>
  <text x="250" y="240" font-size="12" fill="#475569" text-anchor="middle">速度的大小和方向都不变</text>
  <line x1="110" y1="330" x2="420" y2="330" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="150" y="270" width="90" height="60" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2.2"/>
  <rect x="330" y="270" width="90" height="60" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
  <line class="s17-v" x1="240" y1="300" x2="370" y2="300" stroke="#7c3aed" stroke-width="3.6" marker-end="url(#arrBlue)"/>
  <text x="380" y="294" font-size="13.5" font-weight="900" fill="#6d28d9">v</text>
  <text x="250" y="384" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">静止或匀速直线运动</text>

  <line x1="440" y1="140" x2="440" y2="410" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="660" y="120" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">受到外力</text>

  <circle cx="520" cy="210" r="13" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <line class="s17-v" x1="533" y1="216" x2="610" y2="216" stroke="#7c3aed" stroke-width="3.4" marker-end="url(#arrBlue)"/>
  <line class="s17-force" x1="533" y1="196" x2="596" y2="196" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <text x="616" y="210" font-size="11.5" font-weight="800" fill="#6d28d9">v</text>
  <text x="604" y="190" font-size="11.5" font-weight="800" fill="#b91c1c">F</text>
  <text x="650" y="216" font-size="12.5" font-weight="800" fill="#334155">F 与 v 同向：加速</text>

  <circle cx="520" cy="285" r="13" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <line class="s17-v" x1="533" y1="291" x2="610" y2="291" stroke="#7c3aed" stroke-width="3.4" marker-end="url(#arrBlue)"/>
  <line class="s17-force" x1="600" y1="270" x2="540" y2="270" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <text x="650" y="291" font-size="12.5" font-weight="800" fill="#334155">F 与 v 反向：减速</text>

  <circle cx="520" cy="360" r="13" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <line class="s17-v" x1="533" y1="366" x2="610" y2="366" stroke="#7c3aed" stroke-width="3.4" marker-end="url(#arrBlue)"/>
  <line class="s17-force" x1="520" y1="345" x2="520" y2="292" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
  <path class="s17-curve" d="M533 366 Q612 356 642 306" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-dasharray="7 6"/>
  <text x="532" y="288" font-size="11.5" font-weight="800" fill="#b91c1c">F</text>
  <text x="650" y="366" font-size="12.5" font-weight="800" fill="#334155">F 与 v 不共线：转弯</text>

  <rect class="s17-card" x="70" y="428" width="760" height="76" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="454" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">力不是维持运动的原因，而是改变物体运动状态的原因</text>
  <text x="450" y="476" font-size="12" fill="#7c5a30" text-anchor="middle">运动状态改变：速度大小改变，或速度方向改变，或两者都改变</text>
  <text x="450" y="496" font-size="11.5" fill="#64748b" text-anchor="middle">没有力，物体仍能保持原来的运动状态——这正是惯性的表现</text>
</g>
</svg>
