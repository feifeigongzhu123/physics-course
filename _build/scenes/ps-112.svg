<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="热力学第一定律：内能增量等于吸收的热量与外界做功之和，符号规定，绝热与等温过程">
<style>
[data-scene="ps-112"] .s112-s1,[data-scene="ps-112"] .s112-s2,[data-scene="ps-112"] .s112-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-112"].s1 .s112-s1,[data-scene="ps-112"].s2 .s112-s2,[data-scene="ps-112"].s3 .s112-s3{opacity:1;visibility:visible}
@keyframes s112fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s112draw{to{stroke-dashoffset:0}}
@keyframes s112pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s112pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s112flow{to{stroke-dashoffset:-36}}
[data-scene="ps-112"].s1 .s112-eq{transform-box:fill-box;transform-origin:center;animation:s112pop .6s ease .3s both}
[data-scene="ps-112"].s1 .s112-sys{animation:s112pulse 2.4s ease-in-out infinite}
[data-scene="ps-112"].s1 .s112-arrow{stroke-dasharray:8 6;animation:s112flow 1s linear infinite}
[data-scene="ps-112"].s2 .s112-row{animation:s112fade .45s ease both}
[data-scene="ps-112"].s2 .s112-row2{animation-delay:.12s}
[data-scene="ps-112"].s2 .s112-row3{animation-delay:.24s}
[data-scene="ps-112"].s2 .s112-ex{transform-box:fill-box;transform-origin:center;animation:s112pop .55s ease .45s both}
[data-scene="ps-112"].s3 .s112-panel{transform-box:fill-box;transform-origin:center;animation:s112pop .55s ease .2s both}
[data-scene="ps-112"].s3 .s112-panel2{animation-delay:.35s}
[data-scene="ps-112"].s3 .s112-piston{animation:s112pulse 2s ease-in-out infinite}
[data-scene="ps-112"].s3 .s112-card{animation:s112fade .5s ease .55s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">热力学第一定律：内能变化等于吸热与做功之和</text>

<!-- 第一步：定律内容 -->
<g class="s112-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">热力学第一定律：ΔU = Q + W，是能量守恒定律在热现象中的体现</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">内能变化的两种方式</text>

  <g class="s112-sys">
    <rect x="186" y="186" width="220" height="132" rx="14" fill="#e8effc" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="296" y="216" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热力学系统</text>
    <text x="296" y="252" font-size="19" font-weight="900" fill="#1d4ed8" text-anchor="middle">ΔU = Q + W</text>
    <text x="296" y="280" font-size="11.5" fill="#475569" text-anchor="middle">内能增量</text>
    <text x="296" y="302" font-size="11" fill="#64748b" text-anchor="middle">吸热与外界做功共同决定</text>
  </g>

  <line class="s112-arrow" x1="96" y1="252" x2="180" y2="252" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="138" y="236" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Q（吸热）</text>

  <line class="s112-arrow" x1="296" y1="400" x2="296" y2="322" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="310" y="378" font-size="11.5" font-weight="800" fill="#1d4ed8">W（外界做功）</text>

  <text x="296" y="424" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">传热与做功都能单独改变物体的内能</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">定律的表述</text>

  <g class="s112-eq">
    <text x="720" y="204" font-size="23" font-weight="900" fill="#1e3a8a" text-anchor="middle">ΔU = Q + W</text>
    <text x="720" y="230" font-size="11" fill="#64748b" text-anchor="middle">内能增量 = 吸收热量 + 外界做功</text>
  </g>

  <line x1="590" y1="248" x2="834" y2="248" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="596" y="274" font-size="11.5" fill="#334155">ΔU：系统内能的变化量</text>
  <text x="596" y="300" font-size="11.5" fill="#334155">Q：系统从外界吸收的热量</text>
  <text x="596" y="326" font-size="11.5" fill="#334155">W：外界对系统做的功</text>

  <rect x="590" y="344" width="260" height="72" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="368" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量守恒定律在热现象中的体现</text>
  <text x="720" y="390" font-size="11" fill="#475569" text-anchor="middle">内能的改变可由做功和传热共同完成</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">ΔU = Q + W：内能增量等于系统吸收的热量与外界对它做功之和</text>
</g>

<!-- 第二步：符号规定 -->
<g class="s112-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">符号规定：吸热、外界做功取正；放热、系统对外做功取负</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">先定正负，再代入公式</text>

  <g class="s112-row">
    <rect x="56" y="158" width="236" height="66" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="68" y="184" font-size="13" font-weight="900" fill="#047857">吸热：Q &gt; 0</text>
    <text x="68" y="210" font-size="11" fill="#065f46">系统从外界吸收热量</text>
  </g>
  <g class="s112-row s112-row2">
    <rect x="300" y="158" width="236" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="312" y="184" font-size="13" font-weight="900" fill="#b91c1c">放热：Q &lt; 0</text>
    <text x="312" y="210" font-size="11" fill="#991b1b">系统向外界放出热量</text>
  </g>

  <g class="s112-row">
    <rect x="56" y="232" width="236" height="66" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="68" y="258" font-size="13" font-weight="900" fill="#1e40af">外界做功：W &gt; 0</text>
    <text x="68" y="284" font-size="11" fill="#1e3a8a">外界对系统做功</text>
  </g>
  <g class="s112-row s112-row3">
    <rect x="300" y="232" width="236" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="312" y="258" font-size="13" font-weight="900" fill="#b45309">对外做功：W &lt; 0</text>
    <text x="312" y="284" font-size="11" fill="#92400e">系统对外界做功</text>
  </g>

  <g class="s112-row s112-row2">
    <rect x="56" y="306" width="236" height="66" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="68" y="332" font-size="13" font-weight="900" fill="#047857">内能增加：ΔU &gt; 0</text>
    <text x="68" y="358" font-size="11" fill="#065f46">系统内能增大</text>
  </g>
  <g class="s112-row s112-row3">
    <rect x="300" y="306" width="236" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="312" y="332" font-size="13" font-weight="900" fill="#b91c1c">内能减少：ΔU &lt; 0</text>
    <text x="312" y="358" font-size="11" fill="#991b1b">系统内能减小</text>
  </g>

  <text x="296" y="400" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">Q、W、ΔU 的正负由具体过程决定</text>
  <text x="296" y="424" font-size="11" fill="#64748b" text-anchor="middle">代入公式前，先判断每个量的正负</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">符号示例</text>

  <g class="s112-ex">
    <rect x="596" y="158" width="248" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="610" y="182" font-size="11.5" font-weight="900" fill="#b45309">吸热 300 J，对外做功 100 J</text>
    <text x="610" y="206" font-size="11.5" fill="#92400e">Q = +300 J，W = −100 J</text>
    <text x="610" y="230" font-size="11.5" font-weight="800" fill="#92400e">ΔU = +300 − 100 = +200 J</text>
    <text x="610" y="248" font-size="11" fill="#92400e">内能增加 200 J</text>
  </g>

  <g class="s112-ex">
    <rect x="596" y="268" width="248" height="96" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="610" y="292" font-size="11.5" font-weight="900" fill="#1e3a8a">放热 50 J，外界对它做功 80 J</text>
    <text x="610" y="316" font-size="11.5" fill="#334155">Q = −50 J，W = +80 J</text>
    <text x="610" y="340" font-size="11.5" font-weight="800" fill="#1e3a8a">ΔU = −50 + 80 = +30 J</text>
    <text x="610" y="358" font-size="11" fill="#475569">内能增加 30 J</text>
  </g>

  <text x="720" y="394" font-size="11" fill="#475569" text-anchor="middle">结果为正，说明内能增加</text>
  <text x="720" y="418" font-size="11" fill="#475569" text-anchor="middle">结果为负，说明内能减少</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">吸热、外界做功取正；放热、对外做功取负，再代入 ΔU = Q + W</text>
</g>

<!-- 第三步：绝热与等温 -->
<g class="s112-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">绝热过程 Q = 0，等温过程 ΔU = 0，第一类永动机不可能制成</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">绝热与等温过程</text>

  <g class="s112-panel">
    <rect x="56" y="150" width="480" height="118" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="74" y="172" font-size="11" font-weight="800" fill="#b91c1c">Q = 0</text>
    <rect x="78" y="180" width="84" height="64" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="106" y="174" width="10" height="76" fill="#64748b"/>
    <line x1="116" y1="212" x2="170" y2="212" stroke="#475569" stroke-width="3"/>
    <line class="s112-piston" x1="192" y1="212" x2="126" y2="212" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="210" y="180" font-size="12.5" font-weight="800" fill="#1e3a8a">绝热过程：Q = 0</text>
    <text x="210" y="208" font-size="15" font-weight="900" fill="#1d4ed8">ΔU = W</text>
    <text x="210" y="234" font-size="11" fill="#334155">外界做功全部转化为内能</text>
    <text x="210" y="258" font-size="11" fill="#64748b">如压缩绝热汽缸中的气体</text>
  </g>

  <g class="s112-panel s112-panel2">
    <rect x="56" y="280" width="480" height="118" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="74" y="302" font-size="11" font-weight="800" fill="#047857">T 不变</text>
    <rect x="78" y="310" width="84" height="62" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <path d="M88 386 q9 -9 18 0 t18 0 t18 0 t18 0" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="210" y="310" font-size="12.5" font-weight="800" fill="#047857">等温过程：ΔU = 0</text>
    <text x="210" y="338" font-size="15" font-weight="900" fill="#047857">Q = −W</text>
    <text x="210" y="364" font-size="11" fill="#334155">吸收的热量全部用来对外做功</text>
    <text x="210" y="388" font-size="11" fill="#64748b">如缓慢压缩气缸中的气体</text>
  </g>

  <text x="296" y="424" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">绝热与等温过程中，Q、W 中至少有一个为零</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">应用与意义</text>

  <g class="s112-card">
    <circle cx="610" cy="176" r="12" fill="#dbeafe"/>
    <text x="610" y="181" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="632" y="181" font-size="11.5" font-weight="800" fill="#334155">判吸热还是放热：定 Q</text>

    <circle cx="610" cy="216" r="12" fill="#fef3c7"/>
    <text x="610" y="221" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">2</text>
    <text x="632" y="221" font-size="11.5" font-weight="800" fill="#334155">判谁对谁做功：定 W</text>

    <circle cx="610" cy="256" r="12" fill="#dbeafe"/>
    <text x="610" y="261" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="632" y="261" font-size="11.5" font-weight="800" fill="#334155">代入 ΔU = Q + W 求内能变化</text>
  </g>

  <line x1="590" y1="282" x2="834" y2="282" stroke="#e2e8f0" stroke-width="1.5"/>

  <rect x="590" y="296" width="260" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="720" y="320" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="middle">第一类永动机不可能</text>
  <text x="720" y="342" font-size="11" fill="#991b1b" text-anchor="middle">不消耗能量却不断对外做功</text>
  <text x="720" y="356" font-size="11" fill="#991b1b" text-anchor="middle">违背能量守恒定律</text>

  <text x="720" y="392" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量守恒是热力学的基石</text>
  <text x="720" y="416" font-size="11" fill="#64748b" text-anchor="middle">内能变化必须由 Q 或 W 提供</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">绝热过程 Q = 0，等温过程 ΔU = 0；第一类永动机违背能量守恒</text>
</g>
</svg>
