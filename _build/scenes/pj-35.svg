<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="液体的压强：侧壁小孔喷水、p 等于 rho g h、连通器与船闸">
<style>
[data-scene="pj-35"] .p35-step1,[data-scene="pj-35"] .p35-step2,[data-scene="pj-35"] .p35-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="pj-35"].s1 .p35-step1,[data-scene="pj-35"].s2 .p35-step2,[data-scene="pj-35"].s3 .p35-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes p35flow{to{stroke-dashoffset:-46}}
@keyframes p35pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p35pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes p35draw{to{stroke-dashoffset:0}}
[data-scene="pj-35"].s1 .p35-jet{stroke-dasharray:16 10;animation:p35flow 1.1s linear infinite}
[data-scene="pj-35"].s1 .p35-jet3{animation-duration:.8s}
[data-scene="pj-35"].s1 .p35-hole{animation:p35pulse 1.6s ease-in-out infinite}
[data-scene="pj-35"].s2 .p35-card{transform-box:fill-box;transform-origin:center;animation:p35pop .45s ease both}
[data-scene="pj-35"].s2 .p35-wave{animation:p35pulse 2.2s ease-in-out infinite}
[data-scene="pj-35"].s3 .p35-arrow{stroke-dasharray:80;stroke-dashoffset:80;animation:p35draw .8s ease .2s forwards}
[data-scene="pj-35"].s3 .p35-level{animation:p35pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">液体的压强：深度越深，压强越大</text>

<!-- 第一步：液体压强的特点 -->
<g class="p35-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">容器侧壁开三个小孔：越深的水喷得越远</text>

  <text x="70" y="160" font-size="13.5" font-weight="800" fill="#1e3a8a">液体</text>
  <text x="70" y="184" font-size="11.5" fill="#475569">受重力、能流动，</text>
  <text x="70" y="204" font-size="11.5" fill="#475569">所以对底部、侧壁</text>
  <text x="70" y="224" font-size="11.5" fill="#475569">和内部各个方向</text>
  <text x="70" y="244" font-size="11.5" fill="#475569">都有压强。</text>

  <rect x="202" y="200" width="356" height="216" fill="#bfdbfe" opacity=".55"/>
  <line x1="202" y1="200" x2="558" y2="200" stroke="#60a5fa" stroke-width="2.5"/>
  <path d="M200 140 V420 H560 V140" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/>
  <line x1="200" y1="140" x2="200" y2="156" stroke="#64748b" stroke-width="5"/>
  <line x1="560" y1="140" x2="560" y2="156" stroke="#64748b" stroke-width="5"/>
  <text x="380" y="130" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">开口容器</text>

  <line x1="182" y1="200" x2="182" y2="380" stroke="#1e3a8a" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="174" y1="200" x2="190" y2="200" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="174" y1="250" x2="190" y2="250" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="174" y1="315" x2="190" y2="315" stroke="#1e3a8a" stroke-width="1.5"/>
  <line x1="174" y1="380" x2="190" y2="380" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="164" y="300" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle" transform="rotate(-90 164 300)">深度 h</text>

  <path class="p35-jet" d="M560 250 C606 252 640 268 668 298" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round"/>
  <path class="p35-jet" d="M560 315 C622 320 666 352 696 398" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round"/>
  <path class="p35-jet p35-jet3" d="M560 380 C636 390 696 424 736 462" fill="none" stroke="#3b82f6" stroke-width="4.5" stroke-linecap="round"/>
  <circle class="p35-hole" cx="560" cy="250" r="5" fill="#1e40af"/>
  <circle class="p35-hole" cx="560" cy="315" r="5" fill="#1e40af"/>
  <circle class="p35-hole" cx="560" cy="380" r="5" fill="#1e40af"/>
  <text x="678" y="290" font-size="11.5" font-weight="700" fill="#1d4ed8">p 小</text>
  <text x="706" y="390" font-size="11.5" font-weight="700" fill="#1d4ed8">p 较大</text>
  <text x="746" y="456" font-size="11.5" font-weight="800" fill="#1d4ed8">p 大</text>

  <line x1="300" y1="392" x2="300" y2="414" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="380" y1="392" x2="380" y2="414" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="460" y1="392" x2="460" y2="414" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="380" y="444" font-size="11.5" fill="#1e40af" text-anchor="middle">对容器底部也有压强</text>

  <text x="450" y="472" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">同种液体中，深度越深，压强越大；同一深度各方向压强相等</text>
  <text x="450" y="492" font-size="11.5" fill="#64748b" text-anchor="middle">液体压强还跟液体的密度有关：密度越大，压强越大</text>
</g>

<!-- 第二步：液体压强公式 -->
<g class="p35-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">p = ρgh：只由液体密度和深度决定</text>

  <g class="p35-card">
    <rect x="70" y="110" width="380" height="360" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="260" y="142" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">液体压强公式</text>
    <text x="260" y="198" font-size="34" font-weight="900" fill="#1e3a8a" text-anchor="middle">p = ρgh</text>
    <line x1="100" y1="220" x2="420" y2="220" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="95" y="250" font-size="12.5" font-weight="700" fill="#334155">ρ：液体密度，单位 kg/m³</text>
    <text x="95" y="280" font-size="12.5" font-weight="700" fill="#334155">g = 9.8 N/kg（计算常取 10 N/kg）</text>
    <text x="95" y="310" font-size="12.5" font-weight="700" fill="#334155">h：深度，从液面竖直向下量（m）</text>
    <rect x="90" y="328" width="340" height="122" rx="10" fill="#e8effc"/>
    <text x="110" y="354" font-size="12.5" font-weight="800" fill="#1e3a8a">水，h = 10 m 时：</text>
    <text x="110" y="380" font-size="12.5" fill="#334155">p = 1.0×10³ × 10 × 10</text>
    <text x="110" y="410" font-size="15" font-weight="900" fill="#b45309">= 1.0×10⁵ Pa</text>
    <text x="110" y="438" font-size="11.5" fill="#64748b">深度不是“到容器底的距离”</text>
  </g>

  <text x="545" y="150" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">形状不同，深度相同</text>
  <line x1="470" y1="220" x2="820" y2="220" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="490" y="220" width="90" height="158" fill="#bfdbfe" opacity=".6" stroke="#64748b" stroke-width="3"/>
  <line x1="490" y1="220" x2="580" y2="220" stroke="#60a5fa" stroke-width="3"/>
  <rect x="620" y="220" width="70" height="158" fill="#bfdbfe" opacity=".6" stroke="#64748b" stroke-width="3"/>
  <line x1="620" y1="220" x2="690" y2="220" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="740,220 790,220 810,378 720,378" fill="#bfdbfe" opacity=".6" stroke="#64748b" stroke-width="3"/>
  <line x1="740" y1="220" x2="790" y2="220" stroke="#60a5fa" stroke-width="3"/>

  <line class="p35-arrow" x1="535" y1="386" x2="535" y2="404" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line class="p35-arrow" x1="655" y1="386" x2="655" y2="404" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line class="p35-arrow" x1="765" y1="386" x2="765" y2="404" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="645" y="432" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">底部压强相同</text>
  <text x="645" y="458" font-size="11.5" fill="#64748b" text-anchor="middle">液体压强与容器形状、液体质量无关</text>
</g>

<!-- 第三步：连通器与船闸 -->
<g class="p35-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">连通器：同种液体静止时，各容器液面相平</text>

  <rect x="60" y="110" width="290" height="360" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="205" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">拦河大坝</text>
  <polygon points="85,215 225,215 225,420 85,420" fill="#bfdbfe" opacity=".65"/>
  <line x1="85" y1="215" x2="225" y2="215" stroke="#60a5fa" stroke-width="3"/>
  <polygon points="225,420 250,175 305,175 345,420" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/>
  <line x1="196" y1="270" x2="228" y2="270" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <line x1="186" y1="330" x2="232" y2="330" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <line x1="176" y1="390" x2="236" y2="390" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrBlue)"/>
  <text x="132" y="270" font-size="11.5" fill="#1e40af" text-anchor="end">浅</text>
  <text x="132" y="330" font-size="11.5" fill="#1e40af" text-anchor="end">较深</text>
  <text x="132" y="390" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">最深</text>
  <text x="205" y="448" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">上窄下宽，坝底更厚</text>
  <text x="205" y="466" font-size="11" fill="#64748b" text-anchor="middle">潜水员要穿抗压潜水服</text>

  <rect x="380" y="110" width="460" height="190" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="610" y="134" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">连通器</text>
  <rect x="430" y="145" width="36" height="130" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="434" y="163" width="28" height="108" fill="#60a5fa"/>
  <rect x="754" y="145" width="36" height="130" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="758" y="163" width="28" height="108" fill="#60a5fa"/>
  <rect x="448" y="240" width="324" height="35" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <rect x="466" y="244" width="288" height="27" fill="#60a5fa"/>
  <line class="p35-level" x1="430" y1="163" x2="790" y2="163" stroke="#1e3a8a" stroke-width="1.8" stroke-dasharray="8 6"/>
  <line x1="790" y1="163" x2="800" y2="163" stroke="#1e3a8a" stroke-width="2"/>
  <text x="610" y="291" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">静止时两边液面相平</text>

  <rect x="380" y="320" width="460" height="150" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="630" y="346" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">船闸：连通器原理的应用</text>
  <rect x="400" y="360" width="420" height="82" fill="#bfdbfe" opacity=".65" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="374" x2="545" y2="374" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="555" y1="392" x2="830" y2="392" stroke="#60a5fa" stroke-width="2.5"/>
  <rect x="545" y="358" width="8" height="94" fill="#64748b"/>
  <rect x="670" y="358" width="8" height="94" fill="#64748b"/>
  <polygon points="430,404 520,404 505,430 445,430" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <rect x="455" y="384" width="40" height="20" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <line x1="475" y1="384" x2="475" y2="366" stroke="#78350f" stroke-width="3"/>
  <line x1="590" y1="400" x2="640" y2="400" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <text x="615" y="390" font-size="11" fill="#1d4ed8" text-anchor="middle">放水</text>
  <text x="480" y="456" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">上游</text>
  <text x="752" y="456" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">下游</text>
  <text x="750" y="410" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">开闸放水</text>
  <text x="750" y="430" font-size="11.5" fill="#475569" text-anchor="middle">水面相平后通行</text>
</g>
</svg>
