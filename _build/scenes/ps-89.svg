<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="法拉第电磁感应定律：感应电动势与磁通量变化率的关系、导体棒切割磁感线的电动势与感应电流方向">
<style>
[data-scene="ps-89"] .s89-s1,[data-scene="ps-89"] .s89-s2,[data-scene="ps-89"] .s89-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-89"].s1 .s89-s1,[data-scene="ps-89"].s2 .s89-s2,[data-scene="ps-89"].s3 .s89-s3{opacity:1;visibility:visible}
@keyframes s89fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s89draw{to{stroke-dashoffset:0}}
@keyframes s89pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s89flow{to{stroke-dashoffset:-42}}
@keyframes s89pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s89slide{0%{transform:translateX(-16px);opacity:0}100%{transform:translateX(0);opacity:1}}
[data-scene="ps-89"].s1 .s89-magnet{animation:s89slide .6s ease .2s both}
[data-scene="ps-89"].s1 .s89-coil{transform-box:fill-box;transform-origin:center;animation:s89pop .5s ease both}
[data-scene="ps-89"].s1 .s89-coil2{animation-delay:.1s}
[data-scene="ps-89"].s1 .s89-coil3{animation-delay:.2s}
[data-scene="ps-89"].s1 .s89-coil4{animation-delay:.3s}
[data-scene="ps-89"].s1 .s89-flux{stroke-dasharray:8 6;animation:s89flow 1.2s linear infinite}
[data-scene="ps-89"].s1 .s89-curve{stroke-dasharray:220;stroke-dashoffset:220;animation:s89draw 1s ease .35s forwards}
[data-scene="ps-89"].s1 .s89-curve2{stroke-dasharray:240;stroke-dashoffset:240;animation:s89draw 1s ease .6s forwards}
[data-scene="ps-89"].s2 .s89-rod{animation:s89pop .55s ease .25s both}
[data-scene="ps-89"].s2 .s89-current{stroke-dasharray:8 6;animation:s89flow 1.1s linear infinite}
[data-scene="ps-89"].s2 .s89-varr{animation:s89pulse 1.5s ease-in-out infinite}
[data-scene="ps-89"].s2 .s89-len{animation:s89pulse 1.8s ease-in-out infinite}
[data-scene="ps-89"].s3 .s89-rod{animation:s89pop .55s ease .25s both}
[data-scene="ps-89"].s3 .s89-current{stroke-dasharray:8 6;animation:s89flow 1.1s linear infinite}
[data-scene="ps-89"].s3 .s89-varr{animation:s89pulse 1.5s ease-in-out infinite}
[data-scene="ps-89"].s3 .s89-badge{animation:s89fade .5s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">法拉第电磁感应定律：感应电动势与磁通量的变化率成正比</text>

<!-- 第一步：定律 -->
<g class="s89-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">E = nΔΦ/Δt：磁通量变化越快，感应电动势越大</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="264" height="28" rx="14" fill="#e8effc"/>
  <text x="188" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">磁通量变化 → 感应电动势</text>

  <g class="s89-magnet">
    <rect x="64" y="206" width="46" height="48" rx="4" fill="#1d4ed8"/>
    <rect x="110" y="206" width="46" height="48" rx="4" fill="#dc2626"/>
    <text x="87" y="237" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <text x="133" y="237" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
  </g>
  <line x1="58" y1="190" x2="150" y2="190" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="104" y="182" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">靠近</text>

  <line class="s89-flux" x1="158" y1="230" x2="344" y2="230" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="352" y="226" font-size="11.5" font-weight="800" fill="#1d4ed8">B</text>

  <ellipse class="s89-coil" cx="232" cy="230" rx="8.5" ry="50" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s89-coil s89-coil2" cx="252" cy="230" rx="8.5" ry="50" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s89-coil s89-coil3" cx="272" cy="230" rx="8.5" ry="50" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s89-coil s89-coil4" cx="292" cy="230" rx="8.5" ry="50" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="262" y="300" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">n 匝线圈</text>

  <line x1="96" y1="398" x2="330" y2="398" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="96" y1="398" x2="96" y2="308" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="86" y="310" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="end">Φ</text>
  <text x="336" y="414" font-size="11.5" font-weight="800" fill="#475569">t</text>
  <path class="s89-curve" d="M104 392 C150 384 190 350 250 314" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path class="s89-curve2" d="M104 392 C180 390 260 380 310 366" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="346" y="344" font-size="11" font-weight="800" fill="#b91c1c">陡：变化快，E 大</text>
  <text x="346" y="370" font-size="11" font-weight="800" fill="#1d4ed8">缓：变化慢，E 小</text>
  <text x="296" y="430" font-size="11" fill="#64748b" text-anchor="middle">Φ–t 图像的斜率就是磁通量的变化率 ΔΦ/Δt</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">法拉第电磁感应定律</text>

  <rect x="596" y="158" width="248" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="197" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">E = n·ΔΦ/Δt</text>

  <text x="598" y="242" font-size="11.5" font-weight="700" fill="#334155">E：感应电动势，单位 V</text>
  <text x="598" y="268" font-size="11.5" font-weight="700" fill="#334155">n：线圈的匝数</text>
  <text x="598" y="294" font-size="11.5" font-weight="700" fill="#334155">ΔΦ：磁通量的变化量（Wb）</text>
  <text x="598" y="320" font-size="11.5" font-weight="700" fill="#334155">Δt：变化所用的时间（s）</text>

  <rect x="596" y="334" width="248" height="44" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="362" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">变化率 ≠ 变化量</text>
  <text x="720" y="400" font-size="11" fill="#475569" text-anchor="middle">Φ 很大时，E 也可能为零</text>
  <text x="720" y="422" font-size="11" fill="#1d4ed8" text-anchor="middle">决定 E 的是 Φ 变化的快慢</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">闭合电路中感应电动势的大小，跟穿过这一电路的磁通量的变化率成正比</text>
</g>

<!-- 第二步：导体棒切割磁感线 -->
<g class="s89-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">导体棒垂直切割磁感线：感应电动势 E = BLv</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">导体棒在匀强磁场中平动切割</text>

  <rect x="84" y="164" width="392" height="184" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
  <text x="380" y="184" font-size="11" fill="#64748b">B 垂直纸面向里</text>

  <g fill="#93c5fd" font-size="12.5" text-anchor="middle">
    <text x="130" y="232">×</text><text x="170" y="232">×</text><text x="210" y="232">×</text>
    <text x="250" y="232">×</text><text x="290" y="232">×</text><text x="330" y="232">×</text>
    <text x="130" y="272">×</text><text x="170" y="272">×</text><text x="210" y="272">×</text>
    <text x="250" y="272">×</text><text x="290" y="272">×</text><text x="330" y="272">×</text>
    <text x="130" y="312">×</text><text x="170" y="312">×</text><text x="210" y="312">×</text>
    <text x="250" y="312">×</text><text x="290" y="312">×</text><text x="330" y="312">×</text>
  </g>

  <line x1="100" y1="196" x2="476" y2="196" stroke="#475569" stroke-width="3"/>
  <line x1="100" y1="336" x2="476" y2="336" stroke="#475569" stroke-width="3"/>
  <line x1="100" y1="196" x2="100" y2="244" stroke="#475569" stroke-width="3"/>
  <line x1="100" y1="288" x2="100" y2="336" stroke="#475569" stroke-width="3"/>
  <rect x="92" y="244" width="16" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="100" y="271" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">R</text>

  <line class="s89-rod" x1="356" y1="196" x2="356" y2="336" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

  <line class="s89-varr" x1="366" y1="176" x2="440" y2="176" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="452" y="181" font-size="12" font-weight="900" fill="#b45309">v</text>
  <line class="s89-len" x1="378" y1="206" x2="378" y2="326" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 4" marker-start="url(#arrAmber)" marker-end="url(#arrAmber)"/>
  <text x="392" y="270" font-size="12" font-weight="900" fill="#b45309">L</text>

  <line class="s89-current" x1="340" y1="196" x2="250" y2="196" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="296" y="186" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">I</text>
  <line class="s89-current" x1="250" y1="336" x2="340" y2="336" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="296" y="356" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">I</text>

  <text x="296" y="390" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">棒垂直切割磁感线，产生感应电动势</text>
  <text x="296" y="418" font-size="11" fill="#64748b" text-anchor="middle">导体棒相当于电源，L 为棒在磁场中的有效长度</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">导体切割磁感线</text>

  <rect x="596" y="158" width="248" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="198" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle">E = BLv</text>

  <text x="598" y="246" font-size="11.5" font-weight="700" fill="#334155">· B、L、v 两两垂直</text>
  <text x="598" y="274" font-size="11.5" font-weight="700" fill="#334155">· L 为有效长度（垂直 B 的分量）</text>
  <text x="598" y="302" font-size="11.5" font-weight="700" fill="#334155">· v 为垂直 B 的速度分量</text>
  <text x="598" y="330" font-size="11.5" font-weight="700" fill="#334155">· 适用于匀强磁场、平动切割</text>

  <rect x="596" y="346" width="248" height="42" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="373" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">不垂直时：E = BLv sinθ</text>
  <text x="720" y="412" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">转动切割：E = ½BL²ω</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">导体棒垂直切割磁感线时，感应电动势 E = BLv，棒相当于电源</text>
</g>

<!-- 第三步：感应电流的大小与方向 -->
<g class="s89-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">感应电流的大小与方向：闭合电路欧姆定律与右手定则</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">由电动势求感应电流</text>

  <rect x="94" y="164" width="378" height="184" rx="8" fill="#eff6ff" stroke="#dbeafe" stroke-width="1.5"/>
  <g fill="#93c5fd" font-size="12.5" text-anchor="middle">
    <text x="150" y="232">×</text><text x="190" y="232">×</text><text x="230" y="232">×</text>
    <text x="270" y="232">×</text><text x="310" y="232">×</text>
    <text x="150" y="272">×</text><text x="190" y="272">×</text><text x="230" y="272">×</text>
    <text x="270" y="272">×</text><text x="310" y="272">×</text>
    <text x="150" y="312">×</text><text x="190" y="312">×</text><text x="230" y="312">×</text>
    <text x="270" y="312">×</text><text x="310" y="312">×</text>
  </g>

  <line x1="110" y1="196" x2="470" y2="196" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="336" x2="470" y2="336" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="196" x2="110" y2="244" stroke="#475569" stroke-width="3"/>
  <line x1="110" y1="288" x2="110" y2="336" stroke="#475569" stroke-width="3"/>
  <rect x="102" y="244" width="16" height="44" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="110" y="271" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">R</text>

  <line class="s89-rod" x1="350" y1="196" x2="350" y2="336" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <line class="s89-varr" x1="358" y1="176" x2="430" y2="176" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="442" y="181" font-size="12" font-weight="900" fill="#b45309">v</text>

  <line class="s89-current" x1="336" y1="196" x2="250" y2="196" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="292" y="186" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">I</text>
  <line class="s89-current" x1="250" y1="336" x2="336" y2="336" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <text x="292" y="356" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">I</text>

  <g class="s89-badge">
    <rect x="366" y="250" width="88" height="30" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="410" y="270" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">棒是电源</text>
  </g>

  <text x="296" y="390" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">E = BLv　　I = E / (R + r)</text>
  <text x="296" y="418" font-size="11" fill="#64748b" text-anchor="middle">棒内电流由负极流向正极，棒两端电压为外电压</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">方向判断与电荷量</text>

  <rect x="596" y="158" width="248" height="86" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="182" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">右手定则</text>
  <text x="720" y="206" font-size="11.5" fill="#92400e" text-anchor="middle">磁感线穿入掌心，</text>
  <text x="720" y="228" font-size="11.5" fill="#92400e" text-anchor="middle">拇指指 v，四指指感应电流 I</text>

  <rect x="596" y="256" width="248" height="42" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="283" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = E / (R + r)</text>

  <rect x="596" y="308" width="248" height="44" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="336" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">q = nΔΦ / (R + r)</text>

  <text x="720" y="374" font-size="11" fill="#475569" text-anchor="middle">电荷量只与 ΔΦ 有关，与时间无关</text>
  <text x="598" y="402" font-size="11" font-weight="700" fill="#334155">判断电势高低：把切割棒看成电源，</text>
  <text x="598" y="424" font-size="11" font-weight="700" fill="#334155">电源内部电流由负极流向正极</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">先求电动势 E，再由 I = E/(R+r) 求电流，用右手定则判断方向</text>
</g>
</svg>
