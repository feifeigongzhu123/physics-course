<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="原子的核式结构模型：α 粒子散射、卢瑟福核式模型、原子核的大小">
<style>
[data-scene="ps-117"] .s117-step1,[data-scene="ps-117"] .s117-step2,[data-scene="ps-117"] .s117-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-117"].s1 .s117-step1,[data-scene="ps-117"].s2 .s117-step2,[data-scene="ps-117"].s3 .s117-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s117fade{from{opacity:0}to{opacity:1}}
@keyframes s117pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s117draw{to{stroke-dashoffset:0}}
@keyframes s117pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes s117spin{to{transform:rotate(360deg)}}
[data-scene="ps-117"].s1 .s117-beam{stroke-dasharray:220;stroke-dashoffset:220;animation:s117draw .8s ease .2s forwards}
[data-scene="ps-117"].s1 .s117-foil{transform-box:fill-box;transform-origin:center;animation:s117pop .5s ease .2s both}
[data-scene="ps-117"].s1 .s117-traj{opacity:0;animation:s117fade .45s ease forwards}
[data-scene="ps-117"].s1 .s117-t1{animation-delay:.5s}
[data-scene="ps-117"].s1 .s117-t2{animation-delay:.65s}
[data-scene="ps-117"].s1 .s117-t3{animation-delay:.8s}
[data-scene="ps-117"].s1 .s117-t4{animation-delay:.95s}
[data-scene="ps-117"].s1 .s117-t5{animation-delay:1.1s}
[data-scene="ps-117"].s1 .s117-card{transform-box:fill-box;transform-origin:center;animation:s117pop .5s ease .3s both}
[data-scene="ps-117"].s2 .s117-orbit{transform-box:fill-box;transform-origin:center;animation:s117spin 7s linear infinite}
[data-scene="ps-117"].s2 .s117-orbit2{animation-duration:9s;animation-direction:reverse}
[data-scene="ps-117"].s2 .s117-orbit3{animation-duration:11s}
[data-scene="ps-117"].s2 .s117-nucleus{animation:s117pulse 2s ease-in-out infinite}
[data-scene="ps-117"].s2 .s117-card{transform-box:fill-box;transform-origin:center;animation:s117pop .5s ease .3s both}
[data-scene="ps-117"].s3 .s117-atom{transform-box:fill-box;transform-origin:center;animation:s117pop .55s ease .2s both}
[data-scene="ps-117"].s3 .s117-nuc{transform-box:fill-box;transform-origin:center;animation:s117pop .55s ease .7s both}
[data-scene="ps-117"].s3 .s117-card{transform-box:fill-box;transform-origin:center;animation:s117pop .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">原子的核式结构模型</text>

<!-- 第一步：α 粒子散射 -->
<g class="s117-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · α 粒子散射：大多数直穿，少数偏转</text>

  <text x="70" y="126" font-size="12" fill="#475569">α 粒子束轰击金箔，观察散射方向</text>

  <rect x="66" y="240" width="66" height="58" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="99" y="274" font-size="13" font-weight="800" fill="#4338ca" text-anchor="middle">α 源</text>
  <text x="99" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">放射源</text>

  <line class="s117-beam" x1="134" y1="269" x2="348" y2="269" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>

  <g class="s117-foil">
    <rect x="350" y="158" width="15" height="238" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <line x1="357" y1="166" x2="357" y2="388" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 5"/>
  </g>
  <text x="357" y="420" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">金箔</text>

  <line class="s117-traj s117-t1" x1="367" y1="269" x2="500" y2="269" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s117-traj s117-t2" x1="367" y1="269" x2="472" y2="226" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s117-traj s117-t3" x1="367" y1="269" x2="472" y2="312" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s117-traj s117-t4" x1="367" y1="269" x2="422" y2="164" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s117-traj s117-t5" x1="367" y1="269" x2="302" y2="230" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>

  <text x="424" y="294" font-size="11" font-weight="700" fill="#047857">大多数：方向不变</text>
  <text x="376" y="146" font-size="11" font-weight="700" fill="#b45309">少数：大角度偏转</text>
  <text x="200" y="220" font-size="11" font-weight="700" fill="#b91c1c">极少数：被反弹</text>

  <g class="s117-card">
    <rect x="540" y="110" width="300" height="336" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="690" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验现象</text>
    <circle cx="558" cy="176" r="4" fill="#dc2626"/>
    <text x="570" y="180" font-size="12" fill="#334155">绝大多数穿过金箔，</text>
    <text x="570" y="198" font-size="12" fill="#334155">方向几乎不变</text>
    <circle cx="558" cy="228" r="4" fill="#d97706"/>
    <text x="570" y="232" font-size="12" fill="#334155">少数发生较大角度偏转</text>
    <circle cx="558" cy="262" r="4" fill="#b91c1c"/>
    <text x="570" y="266" font-size="12" fill="#334155">极少数被反弹回来</text>
    <line x1="558" y1="286" x2="822" y2="286" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="558" y="314" font-size="12.5" font-weight="800" fill="#1e3a8a">结论</text>
    <text x="558" y="340" font-size="11.5" fill="#334155">原子内部大部分是空的</text>
    <text x="558" y="364" font-size="11.5" fill="#334155">正电荷和几乎全部质量</text>
    <text x="558" y="386" font-size="11.5" fill="#334155">集中在很小的原子核上</text>
    <rect x="558" y="400" width="264" height="32" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="690" y="421" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">汤姆孙“枣糕模型”被否定</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">散射实验说明：原子的正电荷和几乎全部质量集中在一个很小的核上</text>
</g>

<!-- 第二步：卢瑟福核式结构模型 -->
<g class="s117-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 卢瑟福的核式结构模型</text>

  <g class="s117-orbit">
    <ellipse cx="300" cy="280" rx="185" ry="62" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 6"/>
    <circle cx="485" cy="280" r="9" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g class="s117-orbit s117-orbit2">
    <g transform="rotate(62 300 280)">
      <ellipse cx="300" cy="280" rx="185" ry="62" fill="none" stroke="#bfdbfe" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="485" cy="280" r="9" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>
  <g class="s117-orbit s117-orbit3">
    <g transform="rotate(-58 300 280)">
      <ellipse cx="300" cy="280" rx="185" ry="62" fill="none" stroke="#dbeafe" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="485" cy="280" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <circle class="s117-nucleus" cx="300" cy="280" r="27" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="300" y="291" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>

  <line x1="283" y1="262" x2="176" y2="206" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="60" y="180" font-size="13" font-weight="800" fill="#b91c1c">原子核</text>
  <text x="60" y="200" font-size="11.5" fill="#475569">带正电，集中</text>
  <text x="60" y="218" font-size="11.5" fill="#475569">几乎全部质量</text>

  <text x="300" y="448" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">电子在核外空间绕核运动</text>

  <g class="s117-card">
    <rect x="540" y="110" width="300" height="336" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="690" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">核式结构模型要点</text>
    <circle cx="560" cy="178" r="10" fill="#dbeafe"/>
    <text x="560" y="182" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="578" y="176" font-size="12" fill="#334155">原子中心有一个带正电</text>
    <text x="578" y="194" font-size="12" fill="#334155">的原子核</text>
    <circle cx="560" cy="236" r="10" fill="#dbeafe"/>
    <text x="560" y="240" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="578" y="234" font-size="12" fill="#334155">核集中了原子的</text>
    <text x="578" y="252" font-size="12" fill="#334155">几乎全部质量</text>
    <circle cx="560" cy="294" r="10" fill="#dbeafe"/>
    <text x="560" y="298" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="578" y="292" font-size="12" fill="#334155">电子在核外空间</text>
    <text x="578" y="310" font-size="12" fill="#334155">绕核运动</text>
    <line x1="558" y1="332" x2="822" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="690" y="358" font-size="12" fill="#334155" text-anchor="middle">核电荷数 = 核外电子数</text>
    <text x="690" y="382" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">原子整体呈电中性</text>
    <text x="690" y="414" font-size="11" fill="#64748b" text-anchor="middle">电子绕核运动，核位于中心</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">原子 = 带正电的原子核 + 核外绕核运动的电子</text>
</g>

<!-- 第三步：原子核的大小 -->
<g class="s117-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 原子核到底有多小</text>

  <g class="s117-atom">
    <circle cx="180" cy="255" r="100" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="180" cy="255" r="3.5" fill="#dc2626"/>
  </g>
  <text x="180" y="390" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">原子半径 r ≈ 10⁻¹⁰ m</text>

  <line x1="296" y1="255" x2="398" y2="255" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="347" y="238" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">放大 10⁵ 倍</text>

  <g class="s117-nuc">
    <circle cx="465" cy="255" r="52" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="448" cy="242" r="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
    <circle cx="478" cy="240" r="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5"/>
    <circle cx="493" cy="266" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="460" cy="274" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="437" cy="264" r="9" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="465" y="390" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">原子核半径 R ≈ 10⁻¹⁵ m</text>

  <g class="s117-card">
    <rect x="590" y="110" width="270" height="336" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="725" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">大小对比</text>
    <text x="608" y="182" font-size="12" fill="#334155">原子半径 r ≈ 10⁻¹⁰ m</text>
    <text x="608" y="208" font-size="12" fill="#334155">原子核半径 R ≈ 10⁻¹⁵ m</text>
    <text x="608" y="240" font-size="14" font-weight="900" fill="#b45309">R / r ≈ 10⁻⁵</text>
    <line x1="608" y1="262" x2="842" y2="262" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="608" y="290" font-size="11.5" fill="#334155">若把原子放大到足球场大小，</text>
    <text x="608" y="312" font-size="11.5" fill="#334155">原子核只有一颗绿豆大小</text>
    <line x1="608" y1="334" x2="842" y2="334" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="608" y="362" font-size="12" font-weight="800" fill="#047857">原子内部十分空旷</text>
    <text x="608" y="390" font-size="11.5" fill="#334155">质量却几乎全集中在核上</text>
    <text x="608" y="418" font-size="11" fill="#64748b">核外电子质量可以忽略</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">原子核极小，却集中了原子的几乎全部质量</text>
</g>
</svg>
