<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="长度和时间的测量：单位换算、刻度尺读数、停表与误差">
  <style>
    [data-scene="pj-4"] .p4-step1,[data-scene="pj-4"] .p4-step2,[data-scene="pj-4"] .p4-step3{display:none}
    [data-scene="pj-4"].s1 .p4-step1,[data-scene="pj-4"].s2 .p4-step2,[data-scene="pj-4"].s3 .p4-step3{display:block;animation:p4in .45s ease both}
    @keyframes p4in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p4flow{to{stroke-dashoffset:-44}}
    @keyframes p4draw{to{stroke-dashoffset:0}}
    @keyframes p4pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    [data-scene="pj-4"] .p4-flow{stroke-dasharray:8 6;animation:p4flow 1.3s linear infinite}
    [data-scene="pj-4"] .p4-sight{stroke-dasharray:7 6;animation:p4flow 1.6s linear infinite}
    [data-scene="pj-4"] .p4-pop{transform-box:fill-box;transform-origin:center;animation:popIn .45s ease both}
    [data-scene="pj-4"] .p4-hand{stroke-dasharray:110;stroke-dashoffset:110;animation:p4draw .9s ease .15s forwards}
    [data-scene="pj-4"] .p4-beat{animation:p4pulse 1.8s ease-in-out infinite}
    [data-scene="pj-4"] .p4-eye{animation:p4pulse 2.2s ease-in-out infinite}
  </style>
  <defs>
    <pattern id="p4cmPat" x="90" y="300" width="7.2" height="22" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#b45309" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">长度和时间的测量：看清刻度，读准时间</text>

  <!-- 第一步：长度的单位 -->
  <g class="p4-step1" data-zone="1">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">长度单位：先看单位大小，再移动小数点</text>

    <g>
      <rect x="70" y="150" width="120" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="130" y="178" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">千米</text>
      <text x="130" y="198" font-size="11" fill="#64748b" text-anchor="middle">km</text>
      <rect x="230" y="150" width="120" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="290" y="178" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">米</text>
      <text x="290" y="198" font-size="11" fill="#64748b" text-anchor="middle">m（基本单位）</text>
      <rect x="390" y="150" width="120" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="450" y="178" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">分米</text>
      <text x="450" y="198" font-size="11" fill="#64748b" text-anchor="middle">dm</text>
      <rect x="550" y="150" width="120" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="610" y="178" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">厘米</text>
      <text x="610" y="198" font-size="11" fill="#64748b" text-anchor="middle">cm</text>
      <rect x="710" y="150" width="120" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="770" y="178" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">毫米</text>
      <text x="770" y="198" font-size="11" fill="#64748b" text-anchor="middle">mm</text>
    </g>
    <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
      <line x1="194" y1="180" x2="226" y2="180"/>
      <line x1="354" y1="180" x2="386" y2="180"/>
      <line x1="514" y1="180" x2="546" y2="180"/>
      <line x1="674" y1="180" x2="706" y2="180"/>
    </g>
    <g font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">
      <text x="210" y="168">×1000</text>
      <text x="370" y="168">×10</text>
      <text x="530" y="168">×10</text>
      <text x="690" y="168">×10</text>
    </g>

    <text x="100" y="290" font-size="11.5" font-weight="700" fill="#64748b">刻度尺（1 m 分成 10 个 dm，每个 dm 再分成 10 个 cm）</text>
    <rect x="90" y="300" width="720" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="90" y="300" width="720" height="22" fill="url(#p4cmPat)"/>
    <g stroke="#92400e" stroke-width="2">
      <line x1="90" y1="300" x2="90" y2="330"/><line x1="162" y1="300" x2="162" y2="330"/>
      <line x1="234" y1="300" x2="234" y2="330"/><line x1="306" y1="300" x2="306" y2="330"/>
      <line x1="378" y1="300" x2="378" y2="330"/><line x1="450" y1="300" x2="450" y2="330"/>
      <line x1="522" y1="300" x2="522" y2="330"/><line x1="594" y1="300" x2="594" y2="330"/>
      <line x1="666" y1="300" x2="666" y2="330"/><line x1="738" y1="300" x2="738" y2="330"/>
      <line x1="810" y1="300" x2="810" y2="330"/>
    </g>
    <g font-size="12" fill="#78350f" text-anchor="middle">
      <text x="90" y="370">0</text><text x="162" y="370">1</text><text x="234" y="370">2</text>
      <text x="306" y="370">3</text><text x="378" y="370">4</text><text x="450" y="370">5</text>
      <text x="522" y="370">6</text><text x="594" y="370">7</text><text x="666" y="370">8</text>
      <text x="738" y="370">9</text><text x="810" y="370">10 dm</text>
    </g>
    <line class="p4-flow" x1="94" y1="396" x2="806" y2="396" stroke="#1d4ed8" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="450" y="388" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">1 m</text>

    <text x="450" y="430" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">1 m = 10 dm = 100 cm = 1000 mm</text>
    <text x="450" y="456" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">换算示例：1.72 m = 172 cm = 1720 mm</text>
    <text x="450" y="478" font-size="12" fill="#64748b" text-anchor="middle">1 km = 1000 m　·　1 mm = 1000 μm　·　1 nm = 10⁻⁹ m</text>
  </g>

  <!-- 第二步：刻度尺的使用 -->
  <g class="p4-step2" data-zone="2">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">刻度尺：看零刻度、量程、分度值，视线要垂直</text>

    <g class="p4-pop">
      <rect x="620" y="108" width="230" height="138" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="735" y="136" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">分度值：1 mm</text>
      <text x="735" y="156" font-size="11.5" fill="#64748b" text-anchor="middle">放大 2.0~2.2 cm</text>
      <rect x="640" y="170" width="180" height="32" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <g stroke="#92400e" stroke-width="1.4">
        <line x1="640" y1="170" x2="640" y2="202"/><line x1="649" y1="180" x2="649" y2="202"/>
        <line x1="658" y1="180" x2="658" y2="202"/><line x1="667" y1="180" x2="667" y2="202"/>
        <line x1="676" y1="180" x2="676" y2="202"/><line x1="685" y1="180" x2="685" y2="202"/>
        <line x1="694" y1="180" x2="694" y2="202"/><line x1="703" y1="180" x2="703" y2="202"/>
        <line x1="712" y1="180" x2="712" y2="202"/><line x1="721" y1="180" x2="721" y2="202"/>
        <line x1="730" y1="170" x2="730" y2="202"/><line x1="739" y1="180" x2="739" y2="202"/>
        <line x1="748" y1="180" x2="748" y2="202"/><line x1="757" y1="180" x2="757" y2="202"/>
        <line x1="766" y1="180" x2="766" y2="202"/><line x1="775" y1="180" x2="775" y2="202"/>
        <line x1="784" y1="180" x2="784" y2="202"/><line x1="793" y1="180" x2="793" y2="202"/>
        <line x1="802" y1="180" x2="802" y2="202"/><line x1="811" y1="180" x2="811" y2="202"/>
        <line x1="820" y1="170" x2="820" y2="202"/>
      </g>
      <g font-size="11" fill="#78350f" text-anchor="middle">
        <text x="640" y="222">2.0</text><text x="730" y="222">2.1</text><text x="820" y="222">2.2</text>
      </g>
    </g>

    <g class="p4-pop">
      <rect x="100" y="256" width="164" height="26" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <text x="182" y="248" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">被测物体</text>
    </g>

    <g class="p4-eye">
      <path d="M238 166 Q264 146 290 166 Q264 186 238 166 Z" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
      <circle cx="264" cy="166" r="5.5" fill="#1e3a8a"/>
    </g>
    <line class="p4-sight" x1="264.5" y1="184" x2="264.5" y2="310" stroke="#1e3a8a" stroke-width="1.7"/>
    <text x="300" y="172" font-size="12" font-weight="700" fill="#1e3a8a">视线与尺面垂直</text>

    <rect x="100" y="310" width="700" height="50" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <g stroke="#92400e" stroke-width="2">
      <line x1="100" y1="310" x2="100" y2="334"/><line x1="170" y1="310" x2="170" y2="334"/>
      <line x1="240" y1="310" x2="240" y2="334"/><line x1="310" y1="310" x2="310" y2="334"/>
      <line x1="380" y1="310" x2="380" y2="334"/><line x1="450" y1="310" x2="450" y2="334"/>
      <line x1="520" y1="310" x2="520" y2="334"/><line x1="590" y1="310" x2="590" y2="334"/>
      <line x1="660" y1="310" x2="660" y2="334"/><line x1="730" y1="310" x2="730" y2="334"/>
      <line x1="800" y1="310" x2="800" y2="334"/>
    </g>
    <g stroke="#b45309" stroke-width="1.2">
      <line x1="135" y1="310" x2="135" y2="324"/><line x1="205" y1="310" x2="205" y2="324"/>
      <line x1="275" y1="310" x2="275" y2="324"/><line x1="345" y1="310" x2="345" y2="324"/>
      <line x1="415" y1="310" x2="415" y2="324"/><line x1="485" y1="310" x2="485" y2="324"/>
      <line x1="555" y1="310" x2="555" y2="324"/><line x1="625" y1="310" x2="625" y2="324"/>
      <line x1="695" y1="310" x2="695" y2="324"/><line x1="765" y1="310" x2="765" y2="324"/>
    </g>
    <g font-size="12" fill="#78350f" text-anchor="middle">
      <text x="100" y="382">0</text><text x="170" y="382">1</text><text x="240" y="382">2</text>
      <text x="310" y="382">3</text><text x="380" y="382">4</text><text x="450" y="382">5</text>
      <text x="520" y="382">6</text><text x="590" y="382">7</text><text x="660" y="382">8</text>
      <text x="730" y="382">9</text><text x="800" y="382">10 cm</text>
    </g>

    <g class="p4-pop">
      <rect x="90" y="404" width="200" height="34" rx="10" fill="#e8effc"/>
      <text x="190" y="426" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 零刻度线对齐</text>
      <rect x="310" y="404" width="230" height="34" rx="10" fill="#e8effc"/>
      <text x="425" y="426" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 量程 0~10 cm</text>
      <rect x="560" y="404" width="260" height="34" rx="10" fill="#e8effc"/>
      <text x="690" y="426" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 分度值 = 1 mm</text>
    </g>
    <text x="450" y="462" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">读数 = 2.35 cm（2.3 为准确值，0.05 为估读值，结果必须带单位）</text>
  </g>

  <!-- 第三步：时间与误差 -->
  <g class="p4-step3" data-zone="3">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">停表读数：先小表盘，后大表盘；误差不是错误</text>

    <text x="175" y="192" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">小表盘（分）</text>
    <circle cx="175" cy="265" r="60" fill="#ffffff" stroke="#475569" stroke-width="5"/>
    <circle cx="175" cy="265" r="52" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
    <g stroke="#475569" stroke-width="1.6">
      <line x1="175" y1="205" x2="175" y2="211"/><line x1="205" y1="213" x2="202" y2="218"/>
      <line x1="227" y1="235" x2="222" y2="238"/><line x1="235" y1="265" x2="229" y2="265"/>
      <line x1="227" y1="295" x2="222" y2="292"/><line x1="205" y1="317" x2="202" y2="312"/>
      <line x1="175" y1="325" x2="175" y2="319"/><line x1="145" y1="317" x2="148" y2="312"/>
      <line x1="123" y1="295" x2="128" y2="292"/><line x1="115" y1="265" x2="121" y2="265"/>
      <line x1="123" y1="235" x2="128" y2="238"/><line x1="145" y1="213" x2="148" y2="218"/>
    </g>
    <g font-size="11" fill="#475569" text-anchor="middle">
      <text x="175" y="225">0</text><text x="215" y="252">3</text><text x="200" y="299">6</text>
      <text x="150" y="299">9</text><text x="135" y="252">12</text>
    </g>
    <line x1="175" y1="265" x2="199" y2="233" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <circle cx="175" cy="265" r="5" fill="#334155"/>

    <text x="450" y="150" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">大表盘（秒）</text>
    <circle cx="450" cy="280" r="118" fill="#ffffff" stroke="#475569" stroke-width="6"/>
    <circle class="p4-beat" cx="450" cy="280" r="126" fill="none" stroke="#dc2626" stroke-width="2"/>
    <g stroke="#475569" stroke-width="2">
      <line x1="450" y1="168" x2="450" y2="182"/><line x1="506" y1="183" x2="499" y2="195"/>
      <line x1="547" y1="224" x2="535" y2="231"/><line x1="562" y1="280" x2="548" y2="280"/>
      <line x1="547" y1="336" x2="535" y2="329"/><line x1="506" y1="377" x2="499" y2="365"/>
      <line x1="450" y1="392" x2="450" y2="378"/><line x1="394" y1="377" x2="401" y2="365"/>
      <line x1="353" y1="336" x2="365" y2="329"/><line x1="338" y1="280" x2="352" y2="280"/>
      <line x1="353" y1="224" x2="365" y2="231"/><line x1="394" y1="183" x2="401" y2="195"/>
    </g>
    <g font-size="11" fill="#64748b" text-anchor="middle">
      <text x="450" y="206">0</text><text x="487" y="216">5</text><text x="514" y="243">10</text>
      <text x="524" y="280">15</text><text x="514" y="317">20</text><text x="487" y="344">25</text>
      <text x="450" y="354">30</text><text x="413" y="344">35</text><text x="386" y="317">40</text>
      <text x="376" y="280">45</text><text x="386" y="243">50</text><text x="413" y="216">55</text>
    </g>
    <line class="p4-hand" x1="450" y1="280" x2="426" y2="369" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <circle cx="450" cy="280" r="6" fill="#334155"/>

    <g class="p4-pop">
      <rect x="610" y="110" width="240" height="262" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="730" y="140" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">停表读数</text>
      <text x="632" y="172" font-size="12.5" font-weight="700" fill="#334155">① 小表盘：1 min</text>
      <text x="632" y="192" font-size="11.5" fill="#64748b">（指针在 1 与 2 之间，取 1）</text>
      <text x="632" y="224" font-size="12.5" font-weight="700" fill="#334155">② 大表盘：32.5 s</text>
      <text x="632" y="244" font-size="11.5" fill="#64748b">（估读到 0.1 s）</text>
      <line x1="630" y1="262" x2="830" y2="262" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="730" y="300" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">t = 92.5 s</text>
      <text x="730" y="326" font-size="12" fill="#64748b" text-anchor="middle">1 min 32.5 s = 60 s + 32.5 s</text>
    </g>

    <rect x="60" y="412" width="790" height="74" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="450" y="440" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">误差 = 测量值 − 真实值；误差不可避免，不是错误</text>
    <text x="450" y="466" font-size="12.5" fill="#7c5a30" text-anchor="middle">减小误差：多次测量取平均值　·　选用更精密的仪器</text>
  </g>
</svg>
