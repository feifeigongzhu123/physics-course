<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电磁波的发现及应用：麦克斯韦预言、赫兹实验与电磁波谱">
<style>
[data-scene="ps-60"] .s60-s1,[data-scene="ps-60"] .s60-s2,[data-scene="ps-60"] .s60-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-60"].s1 .s60-s1,[data-scene="ps-60"].s2 .s60-s2,[data-scene="ps-60"].s3 .s60-s3{opacity:1;visibility:visible}
@keyframes s60fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s60draw{to{stroke-dashoffset:0}}
@keyframes s60pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s60pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s60wave{to{stroke-dashoffset:-48}}
@keyframes s60spark{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
[data-scene="ps-60"].s1 .s60-e{stroke-dasharray:480;stroke-dashoffset:480;animation:s60draw 1.3s ease .2s forwards}
[data-scene="ps-60"].s1 .s60-b{stroke-dasharray:440;stroke-dashoffset:440;animation:s60draw 1.3s ease .45s forwards}
[data-scene="ps-60"].s1 .s60-card{transform-box:fill-box;transform-origin:center;animation:s60pop .55s ease .3s both}
[data-scene="ps-60"].s2 .s60-wave{stroke-dasharray:8 7;animation:s60wave 1s linear infinite}
[data-scene="ps-60"].s2 .s60-spark{transform-box:fill-box;transform-origin:center;animation:s60spark 1.1s ease-in-out infinite}
[data-scene="ps-60"].s2 .s60-set{animation:s60fade .55s ease both}
[data-scene="ps-60"].s2 .s60-set2{animation-delay:.2s}
[data-scene="ps-60"].s2 .s60-card{transform-box:fill-box;transform-origin:center;animation:s60pop .55s ease .4s both}
[data-scene="ps-60"].s3 .s60-band{transform-box:fill-box;transform-origin:center;animation:s60pop .45s ease both}
[data-scene="ps-60"].s3 .s60-band2{animation-delay:.08s}
[data-scene="ps-60"].s3 .s60-band3{animation-delay:.16s}
[data-scene="ps-60"].s3 .s60-band4{animation-delay:.24s}
[data-scene="ps-60"].s3 .s60-band5{animation-delay:.32s}
[data-scene="ps-60"].s3 .s60-band6{animation-delay:.4s}
[data-scene="ps-60"].s3 .s60-use{animation:s60fade .5s ease both}
[data-scene="ps-60"].s3 .s60-use2{animation-delay:.1s}
[data-scene="ps-60"].s3 .s60-use3{animation-delay:.2s}
[data-scene="ps-60"].s3 .s60-use4{animation-delay:.3s}
[data-scene="ps-60"].s3 .s60-use5{animation-delay:.4s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电磁波的发现及应用：从预言到通信</text>

<!-- 第一步：麦克斯韦的理论 -->
<g class="s60-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">麦克斯韦预言：变化的电场和磁场交替产生，在空间中形成电磁波</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="226" height="28" rx="14" fill="#e8effc"/>
  <text x="169" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电磁波的传播</text>

  <path class="s60-b" d="M110 240 C130 185 155 185 175 240 C195 295 220 295 240 240 C260 185 285 185 305 240 C325 295 350 295 370 240 C390 185 415 185 435 240 C450 275 462 275 470 252" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <path class="s60-e" d="M110 320 C130 274 160 274 180 320 C200 366 230 366 250 320 C270 274 300 274 320 320 C340 366 370 366 390 320 C410 274 440 274 460 320" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <line x1="90" y1="320" x2="500" y2="320" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="505" y="325" font-size="11.5" font-weight="800" fill="#475569">传播方向</text>

  <text x="104" y="216" font-size="13" font-weight="900" fill="#1d4ed8">B</text>
  <text x="104" y="300" font-size="13" font-weight="900" fill="#b91c1c">E</text>

  <line x1="470" y1="252" x2="470" y2="320" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="486" y="290" font-size="11" fill="#64748b">二者垂直</text>

  <text x="296" y="386" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">E 与 B 互相垂直，且都垂直于传播方向</text>
  <text x="296" y="412" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">所以电磁波是横波</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">麦克斯韦的预言</text>

  <text x="720" y="166" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">1864 年 · 英国物理学家麦克斯韦</text>

  <g class="s60-card">
    <rect x="596" y="184" width="248" height="46" rx="10" fill="#e8effc"/>
    <text x="720" y="212" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">变化的磁场 → 电场</text>
    <rect x="596" y="240" width="248" height="46" rx="10" fill="#e8effc"/>
    <text x="720" y="268" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">变化的电场 → 磁场</text>
    <rect x="596" y="296" width="248" height="46" rx="10" fill="#e8effc"/>
    <text x="720" y="324" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">交替变化 → 向外传播</text>
  </g>

  <text x="720" y="372" font-size="11.5" fill="#334155" text-anchor="middle">电磁波可以在真空中传播</text>
  <text x="720" y="396" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">真空速度 c = 3.0×10⁸ m/s</text>
  <text x="720" y="420" font-size="11.5" fill="#334155" text-anchor="middle">光也是一种电磁波</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">这个预言把电、磁、光统一起来，是物理学史上的一次大综合</text>
</g>

<!-- 第二步：赫兹的实验 -->
<g class="s60-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">赫兹实验：1887 年用火花实验证实了电磁波的存在</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="226" height="28" rx="14" fill="#e8effc"/>
  <text x="169" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">火花发生器与接收环</text>

  <g class="s60-set">
    <line x1="56" y1="250" x2="88" y2="250" stroke="#94a3b8" stroke-width="4"/>
    <circle cx="104" cy="250" r="15" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="148" cy="250" r="15" fill="#fde68a" stroke="#b45309" stroke-width="2.5"/>
    <line x1="164" y1="250" x2="196" y2="250" stroke="#94a3b8" stroke-width="4"/>
    <polyline class="s60-spark" points="119,250 123,240 127,260 131,244 135,256" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="126" y="300" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">发射器</text>
    <text x="126" y="322" font-size="11" fill="#64748b" text-anchor="middle">电火花产生高频振荡</text>
  </g>

  <g class="s60-set s60-set2">
    <path class="s60-wave" d="M220 190 A60 60 0 0 1 220 310" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <path class="s60-wave" d="M252 180 A70 70 0 0 1 252 320" fill="none" stroke="#1d4ed8" stroke-width="2" opacity=".8"/>
    <path class="s60-wave" d="M284 170 A80 80 0 0 1 284 330" fill="none" stroke="#1d4ed8" stroke-width="2" opacity=".6"/>

    <ellipse cx="470" cy="250" rx="42" ry="50" fill="none" stroke="#475569" stroke-width="4"/>
    <rect x="499" y="238" width="18" height="24" fill="#ffffff"/>
    <polyline class="s60-spark" points="508,240 512,247 516,242 520,252 524,246" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="470" y="322" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">接收器</text>
    <text x="470" y="344" font-size="11" fill="#64748b" text-anchor="middle">带缺口的金属环</text>
  </g>

  <text x="296" y="386" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">在远处接收环的缺口之间看到了电火花</text>
  <text x="296" y="412" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">说明电磁波确实能在空间中传播</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验的意义</text>

  <g class="s60-card">
    <circle cx="610" cy="176" r="12" fill="#dbeafe"/>
    <text x="610" y="181" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="632" y="181" font-size="11.5" font-weight="700" fill="#334155">证实电磁波存在</text>

    <circle cx="610" cy="222" r="12" fill="#dbeafe"/>
    <text x="610" y="227" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="632" y="227" font-size="11.5" font-weight="700" fill="#334155">电磁波能在空间传播</text>

    <circle cx="610" cy="268" r="12" fill="#dbeafe"/>
    <text x="610" y="273" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="632" y="273" font-size="11.5" font-weight="700" fill="#334155">为无线电通信奠基</text>

    <circle cx="610" cy="314" r="12" fill="#dbeafe"/>
    <text x="610" y="319" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
    <text x="632" y="319" font-size="11.5" font-weight="700" fill="#334155">支持麦克斯韦理论</text>
  </g>

  <rect x="590" y="342" width="260" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="366" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">从“预言”到“证实”</text>
  <text x="720" y="388" font-size="11" fill="#92400e" text-anchor="middle">理论预言 + 实验验证</text>
  <text x="720" y="404" font-size="11" fill="#92400e" text-anchor="middle">是物理学研究的典范</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">赫兹的实验让电磁波从理论预言变成可观测、可使用的现实</text>
</g>

<!-- 第三步：电磁波谱 -->
<g class="s60-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电磁波谱：按频率从低到高排列，不同频率用途不同</text>

  <g class="s60-band">
    <rect x="40" y="140" width="210" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="145" y="176" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">无线电波</text>
  </g>
  <g class="s60-band s60-band2">
    <rect x="250" y="140" width="120" height="60" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="310" y="176" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">红外线</text>
  </g>
  <g class="s60-band s60-band3">
    <rect x="370" y="140" width="110" height="60" rx="6" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
    <text x="425" y="176" font-size="12" font-weight="800" fill="#9d174d" text-anchor="middle">可见光</text>
  </g>
  <g class="s60-band s60-band4">
    <rect x="480" y="140" width="120" height="60" rx="6" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="540" y="176" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">紫外线</text>
  </g>
  <g class="s60-band s60-band5">
    <rect x="600" y="140" width="130" height="60" rx="6" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="665" y="176" font-size="12" font-weight="800" fill="#3730a3" text-anchor="middle">伦琴射线</text>
  </g>
  <g class="s60-band s60-band6">
    <rect x="730" y="140" width="130" height="60" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="795" y="176" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">γ 射线</text>
  </g>

  <line x1="40" y1="226" x2="860" y2="226" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="450" y="252" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">频率升高、波长减小 →</text>

  <g class="s60-use">
    <rect x="36" y="272" width="156" height="108" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="114" y="298" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">无线电波</text>
    <text x="114" y="324" font-size="11" fill="#334155" text-anchor="middle">通信、广播</text>
    <text x="114" y="346" font-size="11" fill="#64748b" text-anchor="middle">手机信号</text>
    <text x="114" y="368" font-size="11" fill="#64748b" text-anchor="middle">微波炉</text>
  </g>
  <g class="s60-use s60-use2">
    <rect x="204" y="272" width="156" height="108" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="282" y="298" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">红外线</text>
    <text x="282" y="324" font-size="11" fill="#334155" text-anchor="middle">遥控、遥感</text>
    <text x="282" y="346" font-size="11" fill="#64748b" text-anchor="middle">加热、测温</text>
    <text x="282" y="368" font-size="11" fill="#64748b" text-anchor="middle">夜视仪</text>
  </g>
  <g class="s60-use s60-use3">
    <rect x="372" y="272" width="156" height="108" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="450" y="298" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">紫外线</text>
    <text x="450" y="324" font-size="11" fill="#334155" text-anchor="middle">杀菌消毒</text>
    <text x="450" y="346" font-size="11" fill="#64748b" text-anchor="middle">防伪验钞</text>
    <text x="450" y="368" font-size="11" fill="#64748b" text-anchor="middle">促进合成维生素 D</text>
  </g>
  <g class="s60-use s60-use4">
    <rect x="540" y="272" width="156" height="108" rx="12" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="618" y="298" font-size="12" font-weight="800" fill="#3730a3" text-anchor="middle">伦琴射线</text>
    <text x="618" y="324" font-size="11" fill="#334155" text-anchor="middle">医学透视</text>
    <text x="618" y="346" font-size="11" fill="#64748b" text-anchor="middle">安检成像</text>
    <text x="618" y="368" font-size="11" fill="#64748b" text-anchor="middle">晶体结构分析</text>
  </g>
  <g class="s60-use s60-use5">
    <rect x="708" y="272" width="156" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="786" y="298" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">γ 射线</text>
    <text x="786" y="324" font-size="11" fill="#334155" text-anchor="middle">治疗肿瘤</text>
    <text x="786" y="346" font-size="11" fill="#64748b" text-anchor="middle">工业探伤</text>
    <text x="786" y="368" font-size="11" fill="#64748b" text-anchor="middle">杀菌保鲜</text>
  </g>

  <rect x="36" y="394" width="828" height="94" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="422" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电磁波谱是一个连续的“家族”，各波段之间没有严格界限</text>
  <text x="450" y="448" font-size="11.5" fill="#334155" text-anchor="middle">无线电波、红外线、可见光、紫外线、伦琴射线、γ 射线，频率依次升高</text>
  <text x="450" y="472" font-size="11" fill="#64748b" text-anchor="middle">它们在真空中的传播速度相同，都是 c = 3.0×10⁸ m/s</text>
</g>
</svg>
