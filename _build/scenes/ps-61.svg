<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="能量量子化：黑体辐射与能量子、光子与光电效应、能级跃迁">
<style>
[data-scene="ps-61"] .s61-s1,[data-scene="ps-61"] .s61-s2,[data-scene="ps-61"] .s61-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-61"].s1 .s61-s1,[data-scene="ps-61"].s2 .s61-s2,[data-scene="ps-61"].s3 .s61-s3{opacity:1;visibility:visible}
@keyframes s61fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s61draw{to{stroke-dashoffset:0}}
@keyframes s61pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s61pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s61flow{to{stroke-dashoffset:-28}}
@keyframes s61rise{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(46px,-18px);opacity:0}}
@keyframes s61fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(12px);opacity:0}}
@keyframes s61needle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
[data-scene="ps-61"].s1 .s61-curve{stroke-dasharray:420;stroke-dashoffset:420;animation:s61draw 1.3s ease .2s forwards}
[data-scene="ps-61"].s1 .s61-curve2{animation-delay:.35s}
[data-scene="ps-61"].s1 .s61-curve3{animation-delay:.5s}
[data-scene="ps-61"].s1 .s61-card{transform-box:fill-box;transform-origin:center;animation:s61pop .55s ease .45s both}
[data-scene="ps-61"].s1 .s61-photon{animation:s61pulse 1.8s ease-in-out infinite}
[data-scene="ps-61"].s2 .s61-ray{stroke-dasharray:9 7;animation:s61flow 1.1s linear infinite}
[data-scene="ps-61"].s2 .s61-electron{transform-box:fill-box;animation:s61rise 2.2s ease-in-out infinite}
[data-scene="ps-61"].s2 .s61-electron2{animation-delay:.5s}
[data-scene="ps-61"].s2 .s61-electron3{animation-delay:1s}
[data-scene="ps-61"].s2 .s61-needle{transform-box:fill-box;transform-origin:0 100%;animation:s61needle 2.4s ease-in-out infinite}
[data-scene="ps-61"].s2 .s61-plate{transform-box:fill-box;transform-origin:center;animation:s61pop .5s ease both}
[data-scene="ps-61"].s2 .s61-card{transform-box:fill-box;transform-origin:center;animation:s61pop .55s ease .4s both}
[data-scene="ps-61"].s3 .s61-level{stroke-dasharray:320;stroke-dashoffset:320;animation:s61draw .8s ease both}
[data-scene="ps-61"].s3 .s61-level2{animation-delay:.1s}
[data-scene="ps-61"].s3 .s61-level3{animation-delay:.2s}
[data-scene="ps-61"].s3 .s61-level4{animation-delay:.3s}
[data-scene="ps-61"].s3 .s61-jump{stroke-dasharray:160;stroke-dashoffset:160;animation:s61draw .7s ease .5s forwards}
[data-scene="ps-61"].s3 .s61-jump2{animation-delay:.7s}
[data-scene="ps-61"].s3 .s61-jump3{animation-delay:.9s}
[data-scene="ps-61"].s3 .s61-photon{animation:s61fall 1.8s ease-in-out infinite}
[data-scene="ps-61"].s3 .s61-card{transform-box:fill-box;transform-origin:center;animation:s61pop .55s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">能量量子化：一份一份的能量</text>

<!-- 第一步：黑体辐射与能量子 -->
<g class="s61-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">黑体辐射的规律：经典理论无法解释，普朗克提出能量量子化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="226" height="28" rx="14" fill="#e8effc"/>
  <text x="169" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">黑体辐射的强度分布</text>

  <line x1="90" y1="390" x2="510" y2="390" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="390" x2="90" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="514" y="394" font-size="12" font-weight="800" fill="#475569">λ</text>
  <text x="96" y="146" font-size="11.5" font-weight="800" fill="#475569">辐射强度</text>

  <path class="s61-curve" d="M100 390 C150 380 180 330 205 250 C220 205 240 205 255 250 C280 330 320 365 380 378 L480 386" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path class="s61-curve s61-curve2" d="M100 390 C160 382 200 345 235 300 C260 270 280 285 300 320 C330 360 380 378 440 384" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <path class="s61-curve s61-curve3" d="M100 390 C170 384 230 365 275 340 C305 322 325 335 345 355 C375 378 420 384 470 387" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <text x="440" y="246" font-size="11" font-weight="800" fill="#b91c1c">T₃</text>
  <text x="392" y="296" font-size="11" font-weight="800" fill="#b45309">T₂</text>
  <text x="430" y="344" font-size="11" font-weight="800" fill="#1d4ed8">T₁</text>
  <text x="330" y="168" font-size="11" fill="#64748b">T₁ &lt; T₂ &lt; T₃</text>

  <line x1="225" y1="390" x2="225" y2="214" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="225" y="408" font-size="11" fill="#64748b" text-anchor="middle">峰值波长</text>
  <text x="296" y="426" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">温度越高，辐射强度越大，峰值波长越短</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">普朗克的能量子</text>

  <text x="720" y="168" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">1900 年 · 普朗克</text>
  <text x="720" y="200" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">ε = hν</text>
  <text x="720" y="224" font-size="11" fill="#64748b" text-anchor="middle">h = 6.63×10⁻³⁴ J·s（普朗克常量）</text>

  <line x1="590" y1="240" x2="834" y2="240" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="596" y="264" font-size="11.5" fill="#334155">能量只能一份一份地吸收和辐射</text>
  <text x="596" y="288" font-size="11.5" fill="#334155">每一份能量叫能量子</text>
  <text x="596" y="312" font-size="11.5" fill="#334155">能量子的能量与频率成正比</text>
  <text x="596" y="336" font-size="11.5" fill="#334155">频率越高，能量子能量越大</text>

  <rect x="590" y="356" width="260" height="62" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="378" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">成功解释了黑体辐射的规律</text>
  <text x="720" y="400" font-size="11" fill="#475569" text-anchor="middle">能量量子化：能量不是连续的</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量量子化突破了“能量连续变化”的经典观念</text>
</g>

<!-- 第二步：光子 -->
<g class="s61-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">光子：光本身就是一份一份的能量子，光电效应是重要证据</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="226" height="28" rx="14" fill="#e8effc"/>
  <text x="169" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光电效应</text>

  <rect class="s61-plate" x="230" y="170" width="16" height="170" rx="3" fill="#94a3b8"/>
  <text x="238" y="166" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">金属板</text>

  <g class="s61-ray" stroke="#d97706" stroke-width="2.5">
    <line x1="70" y1="196" x2="214" y2="196" marker-end="url(#arrAmber)"/>
    <line x1="70" y1="232" x2="214" y2="232" marker-end="url(#arrAmber)"/>
    <line x1="70" y1="268" x2="214" y2="268" marker-end="url(#arrAmber)"/>
  </g>
  <g fill="#f59e0b">
    <circle cx="96" cy="196" r="4"/>
    <circle cx="130" cy="196" r="4"/>
    <circle cx="164" cy="196" r="4"/>
    <circle cx="110" cy="232" r="4"/>
    <circle cx="144" cy="232" r="4"/>
    <circle cx="178" cy="232" r="4"/>
    <circle cx="96" cy="268" r="4"/>
    <circle cx="130" cy="268" r="4"/>
    <circle cx="164" cy="268" r="4"/>
  </g>
  <text x="110" y="180" font-size="11.5" font-weight="800" fill="#b45309">光（光子）</text>

  <g stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)">
    <line x1="252" y1="200" x2="404" y2="174"/>
    <line x1="252" y1="240" x2="412" y2="240"/>
    <line x1="252" y1="280" x2="410" y2="306"/>
  </g>
  <g class="s61-electron" fill="#dc2626">
    <circle cx="292" cy="196" r="5"/>
    <text x="304" y="192" font-size="11" font-weight="800">e⁻</text>
  </g>
  <g class="s61-electron s61-electron2" fill="#dc2626">
    <circle cx="330" cy="240" r="5"/>
    <text x="342" y="236" font-size="11" font-weight="800">e⁻</text>
  </g>
  <g class="s61-electron s61-electron3" fill="#dc2626">
    <circle cx="360" cy="290" r="5"/>
    <text x="372" y="286" font-size="11" font-weight="800">e⁻</text>
  </g>

  <rect x="430" y="180" width="12" height="150" rx="3" fill="#cbd5e1"/>
  <text x="436" y="354" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">收集极</text>

  <path d="M238 340 L238 390 L300 390" fill="none" stroke="#475569" stroke-width="2.5"/>
  <circle cx="320" cy="390" r="19" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <text x="320" y="395" font-size="11" font-weight="900" fill="#b91c1c" text-anchor="middle">μA</text>
  <path d="M340 390 L436 390 L436 330" fill="none" stroke="#475569" stroke-width="2.5"/>

  <text x="296" y="424" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">光照射金属板，电子逸出形成光电流</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">爱因斯坦光子说</text>

  <text x="720" y="170" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">E = hν</text>
  <text x="720" y="192" font-size="11" fill="#64748b" text-anchor="middle">h 为普朗克常量</text>

  <line x1="590" y1="208" x2="834" y2="208" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="596" y="232" font-size="11.5" fill="#334155">光由一份一份的光子组成</text>
  <text x="596" y="256" font-size="11.5" fill="#334155">光子能量 E = hν</text>
  <text x="596" y="280" font-size="11.5" fill="#334155">频率越高，单个光子能量越大</text>
  <text x="596" y="304" font-size="11.5" fill="#334155">光的强弱由单位时间光子数决定</text>
  <text x="596" y="328" font-size="11.5" fill="#334155">电子吸收一个光子后逸出</text>

  <rect x="590" y="348" width="260" height="70" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="370" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">光子说成功解释了光电效应</text>
  <text x="720" y="390" font-size="11" fill="#92400e" text-anchor="middle">存在截止频率：光子能量不足以</text>
  <text x="720" y="406" font-size="11" fill="#92400e" text-anchor="middle">克服逸出功时，无论光多强都不行</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光的能量量子化：光既有波动性，又有粒子性</text>
</g>

<!-- 第三步：能级 -->
<g class="s61-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">能级：原子能量量子化，跃迁时吸收或放出光子</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="226" height="28" rx="14" fill="#e8effc"/>
  <text x="169" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">氢原子的能级图</text>

  <line class="s61-level" x1="110" y1="360" x2="420" y2="360" stroke="#1d4ed8" stroke-width="3"/>
  <line class="s61-level s61-level2" x1="110" y1="300" x2="420" y2="300" stroke="#1d4ed8" stroke-width="3"/>
  <line class="s61-level s61-level3" x1="110" y1="250" x2="420" y2="250" stroke="#1d4ed8" stroke-width="3"/>
  <line class="s61-level s61-level4" x1="110" y1="215" x2="420" y2="215" stroke="#1d4ed8" stroke-width="3"/>

  <text x="432" y="365" font-size="12" font-weight="800" fill="#1e3a8a">E₁</text>
  <text x="432" y="305" font-size="12" font-weight="800" fill="#1e3a8a">E₂</text>
  <text x="432" y="255" font-size="12" font-weight="800" fill="#1e3a8a">E₃</text>
  <text x="432" y="220" font-size="12" font-weight="800" fill="#1e3a8a">E₄</text>

  <line class="s61-jump" x1="180" y1="250" x2="180" y2="360" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="196" y="312" font-size="11.5" font-weight="800" fill="#b91c1c">放出光子</text>
  <text x="196" y="332" font-size="11" fill="#b91c1c">hν = E₃ − E₁</text>

  <line class="s61-jump s61-jump2" x1="300" y1="215" x2="300" y2="300" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>
  <text x="316" y="266" font-size="11.5" font-weight="800" fill="#b45309">hν = E₄ − E₂</text>

  <line class="s61-jump s61-jump3" x1="390" y1="360" x2="390" y2="250" stroke="#059669" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrGreen)"/>
  <text x="404" y="330" font-size="11.5" font-weight="800" fill="#047857">吸收光子</text>

  <text x="296" y="394" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">跃迁时吸收或放出的光子能量，必须等于两能级之差</text>
  <text x="296" y="420" font-size="11" fill="#64748b" text-anchor="middle">原子只能处于一系列不连续的能量状态</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能级与跃迁</text>

  <g class="s61-card">
    <circle cx="610" cy="176" r="12" fill="#dbeafe"/>
    <text x="610" y="181" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="632" y="181" font-size="11.5" font-weight="700" fill="#334155">原子能量不连续，叫能级</text>

    <circle cx="610" cy="216" r="12" fill="#fef3c7"/>
    <text x="610" y="221" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">2</text>
    <text x="632" y="221" font-size="11.5" font-weight="700" fill="#334155">高能级 → 低能级：放出光子</text>

    <circle cx="610" cy="256" r="12" fill="#fef3c7"/>
    <text x="610" y="261" font-size="11" font-weight="900" fill="#92400e" text-anchor="middle">3</text>
    <text x="632" y="261" font-size="11.5" font-weight="700" fill="#334155">低能级 → 高能级：吸收光子</text>

    <circle cx="610" cy="296" r="12" fill="#dbeafe"/>
    <text x="610" y="301" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
    <text x="632" y="301" font-size="11.5" font-weight="700" fill="#334155">吸收的光子能量必须恰好等于能级差</text>
  </g>

  <text x="596" y="336" font-size="11.5" font-weight="800" fill="#1e3a8a">跃迁发出的光形成线状光谱</text>
  <text x="596" y="360" font-size="11.5" fill="#334155">不同原子能级不同</text>
  <text x="596" y="384" font-size="11.5" fill="#334155">光谱线位置也不同</text>

  <rect x="590" y="402" width="260" height="20" rx="8" fill="#e8effc"/>
  <text x="720" y="417" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量量子化贯穿微观世界</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">从黑体辐射到原子能级，能量量子化揭开了微观世界的新篇章</text>
</g>
</svg>
