<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="变阻器：滑动变阻器一上一下接法、保护电路、电阻箱读数">
<style>
.p61-s1,.p61-s2,.p61-s3{opacity:0;visibility:hidden}
.p61-s1{opacity:1;visibility:visible}
[data-scene="pj-61"] .p61-s1,[data-scene="pj-61"] .p61-s2,[data-scene="pj-61"] .p61-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-61"].s1 .p61-s1,[data-scene="pj-61"].s2 .p61-s2,[data-scene="pj-61"].s3 .p61-s3{opacity:1;visibility:visible}
@keyframes p61slide{0%,100%{transform:translateX(0)}50%{transform:translateX(-16px)}}
@keyframes p61flow{to{stroke-dashoffset:-42}}
@keyframes p61pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p61glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p61turn{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}}
[data-scene="pj-61"].s1 .p61-slider{transform-box:fill-box;transform-origin:center;animation:p61slide 2.6s ease-in-out infinite}
[data-scene="pj-61"].s1 .p61-accent{animation:p61glow 1.8s ease-in-out infinite}
[data-scene="pj-61"].s2 .p61-flow{stroke-dasharray:11 8;animation:p61flow 1.3s linear infinite}
[data-scene="pj-61"].s2 .p61-protect{transform-box:fill-box;transform-origin:center;animation:p61pop .55s ease both}
[data-scene="pj-61"].s2 .p61-protect2{animation-delay:.12s}
[data-scene="pj-61"].s2 .p61-protect3{animation-delay:.24s}
[data-scene="pj-61"].s3 .p61-dial{transform-box:fill-box;transform-origin:center;animation:p61pop .5s ease both}
[data-scene="pj-61"].s3 .p61-dial2{animation-delay:.1s}
[data-scene="pj-61"].s3 .p61-dial3{animation-delay:.2s}
[data-scene="pj-61"].s3 .p61-dial4{animation-delay:.3s}
[data-scene="pj-61"].s3 .p61-pointer{transform-box:view-box;transform-origin:140px 232px;animation:p61turn 3s ease-in-out infinite}
[data-scene="pj-61"].s3 .p61-read{transform-box:fill-box;transform-origin:center;animation:p61pop .6s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">变阻器：一上一下，移动滑片改变电阻</text>

<!-- 第一步：滑动变阻器的接法 -->
<g class="p61-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">滑动变阻器：上、下各接一个接线柱，电阻才能改变</text>

  <rect x="36" y="100" width="540" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="246" height="28" rx="14" fill="#e8effc"/>
  <text x="179" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">滑动变阻器的结构</text>

  <!-- 金属杆与上接线柱 -->
  <line x1="100" y1="170" x2="500" y2="170" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
  <circle cx="100" cy="170" r="7" fill="#475569"/>
  <circle cx="500" cy="170" r="7" fill="#475569"/>
  <text x="100" y="152" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">C</text>
  <text x="500" y="152" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">D</text>

  <!-- 瓷筒与电阻丝 -->
  <rect x="90" y="222" width="420" height="66" rx="33" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <path d="M108 255 l12 -14 l12 28 l12 -28 l12 28 l12 -28 l12 28 l12 -28 l12 28 l12 -28 l12 28 l12 -28 l12 28 l12 -28 l12 28 l12 -28 l12 28"
        fill="none" stroke="#b45309" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 滑片 -->
  <g class="p61-slider">
    <line x1="330" y1="170" x2="330" y2="222" stroke="#1d4ed8" stroke-width="5"/>
    <polygon points="322,222 338,222 330,212" fill="#1d4ed8"/>
    <rect x="314" y="144" width="32" height="22" rx="5" fill="#1d4ed8"/>
    <text x="330" y="138" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">滑片 P</text>
  </g>
  <line x1="360" y1="160" x2="404" y2="160" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <line x1="300" y1="160" x2="256" y2="160" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>

  <!-- 下接线柱 -->
  <line x1="100" y1="288" x2="100" y2="318" stroke="#334155" stroke-width="4"/>
  <line x1="500" y1="288" x2="500" y2="318" stroke="#334155" stroke-width="4"/>
  <circle cx="100" cy="320" r="7" fill="#475569"/>
  <circle cx="500" cy="320" r="7" fill="#475569"/>
  <text x="100" y="344" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">A</text>
  <text x="500" y="344" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">B</text>

  <!-- 接入部分标注 -->
  <g class="p61-accent" stroke="#dc2626" stroke-width="2.5" fill="none">
    <line x1="108" y1="306" x2="330" y2="306"/>
    <line x1="108" y1="300" x2="108" y2="312"/>
    <line x1="330" y1="300" x2="330" y2="312"/>
  </g>
  <text x="219" y="330" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">接入部分：A 到 P 之间的电阻丝</text>

  <text x="306" y="372" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">移动滑片，接入电路的电阻丝长度改变</text>
  <text x="306" y="394" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">接入长度变短，电阻变小；变长，电阻变大</text>

  <rect x="596" y="100" width="268" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="616" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="706" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">接线口诀</text>

  <text x="730" y="184" font-size="23" font-weight="900" fill="#1e3a8a" text-anchor="middle">一上一下</text>
  <text x="730" y="208" font-size="11.5" fill="#64748b" text-anchor="middle">上、下各接一个接线柱</text>

  <rect x="612" y="222" width="236" height="66" rx="10" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="730" y="244" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">正确接法</text>
  <text x="730" y="268" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">A+D、A+C、B+C、B+D</text>

  <rect x="612" y="298" width="236" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="730" y="320" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">错误接法</text>
  <text x="730" y="342" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">C+D 同上：R = 0，短路</text>
  <text x="730" y="364" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">A+B 同下：R 最大且不变</text>

  <text x="730" y="396" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">闭合开关前，滑片移到最大阻值端</text>
</g>

<!-- 第二步：保护电路 -->
<g class="p61-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">滑动变阻器串联在电路中，起到限流保护作用</text>

  <rect x="36" y="100" width="430" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="210" height="28" rx="14" fill="#fff7ed"/>
  <text x="161" y="135" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">限流保护电路</text>

  <path d="M80 190 H400 V340 H80 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path class="p61-flow" d="M80 190 H400 V340 H80 Z" fill="none" stroke="#1d4ed8" stroke-width="5" opacity=".9"/>

  <circle cx="160" cy="190" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="149" y1="179" x2="171" y2="201" stroke="#d97706" stroke-width="2"/>
  <line x1="171" y1="179" x2="149" y2="201" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="156" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">L</text>

  <rect x="260" y="206" width="100" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
  <path d="M270 230 l10 -10 l10 20 l10 -20 l10 20 l10 -20 l10 20 l10 -20 l10 20 l10 -20 l10 20"
        fill="none" stroke="#b45309" stroke-width="3"/>
  <line x1="310" y1="190" x2="310" y2="206" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="310" y="200" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">P</text>
  <text x="310" y="274" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">R滑</text>

  <line x1="200" y1="326" x2="200" y2="354" stroke="#334155" stroke-width="4"/>
  <line x1="214" y1="332" x2="214" y2="348" stroke="#334155" stroke-width="4"/>
  <text x="207" y="372" font-size="11" fill="#64748b" text-anchor="middle">电源</text>
  <circle cx="320" cy="340" r="4" fill="#334155"/>
  <circle cx="350" cy="340" r="4" fill="#334155"/>
  <line x1="320" y1="340" x2="348" y2="326" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="335" y="320" font-size="11.5" font-weight="800" fill="#64748b">S</text>

  <text x="250" y="394" font-size="11.5" fill="#64748b" text-anchor="middle">滑动变阻器与灯泡串联，限制通过电路的电流</text>

  <rect x="486" y="100" width="378" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="506" y="116" width="190" height="28" rx="14" fill="#e8effc"/>
  <text x="601" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">保护电路三步</text>

  <g class="p61-protect">
    <circle cx="552" cy="178" r="13" fill="#e8effc"/>
    <text x="552" y="183" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="576" y="183" font-size="12" font-weight="700" fill="#334155">连接电路时，开关必须断开</text>
  </g>
  <g class="p61-protect p61-protect2">
    <circle cx="552" cy="224" r="13" fill="#e8effc"/>
    <text x="552" y="229" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="576" y="229" font-size="12" font-weight="700" fill="#334155">滑片移到阻值最大位置</text>
  </g>
  <g class="p61-protect p61-protect3">
    <circle cx="552" cy="270" r="13" fill="#e8effc"/>
    <text x="552" y="275" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="576" y="275" font-size="12" font-weight="700" fill="#334155">闭合开关后，慢慢移动滑片</text>
  </g>

  <rect x="510" y="296" width="330" height="72" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="675" y="318" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">开始电阻最大 → 电流最小</text>
  <text x="675" y="340" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">避免烧坏灯泡、电表和电源</text>
  <text x="675" y="360" font-size="11" fill="#7c5a30" text-anchor="middle">闭合后再逐渐减小电阻</text>

  <text x="675" y="392" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">滑动变阻器还能改变用电器两端的电压</text>
</g>

<!-- 第三步：电阻箱 -->
<g class="p61-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电阻箱：四个旋钮，示数等于各旋钮示数乘倍数之和</text>

  <rect x="36" y="100" width="520" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻箱：直接读出阻值</text>

  <rect x="80" y="150" width="432" height="196" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2.5"/>

  <text x="140" y="176" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">×1000</text>
  <text x="250" y="176" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">×100</text>
  <text x="360" y="176" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">×10</text>
  <text x="470" y="176" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">×1</text>

  <g class="p61-dial">
    <circle cx="140" cy="232" r="32" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="140" y1="202" x2="140" y2="208"/><line x1="161" y1="211" x2="157" y2="215"/>
      <line x1="170" y1="232" x2="164" y2="232"/><line x1="161" y1="253" x2="157" y2="249"/>
      <line x1="140" y1="262" x2="140" y2="256"/><line x1="119" y1="253" x2="123" y2="249"/>
      <line x1="110" y1="232" x2="116" y2="232"/><line x1="119" y1="211" x2="123" y2="215"/>
    </g>
    <g class="p61-pointer"><line x1="140" y1="232" x2="140" y2="206" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/></g>
    <circle cx="140" cy="232" r="4" fill="#dc2626"/>
    <text x="140" y="302" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  </g>

  <g class="p61-dial p61-dial2">
    <circle cx="250" cy="232" r="32" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="250" y1="202" x2="250" y2="208"/><line x1="271" y1="211" x2="267" y2="215"/>
      <line x1="280" y1="232" x2="274" y2="232"/><line x1="271" y1="253" x2="267" y2="249"/>
      <line x1="250" y1="262" x2="250" y2="256"/><line x1="229" y1="253" x2="233" y2="249"/>
      <line x1="220" y1="232" x2="226" y2="232"/><line x1="229" y1="211" x2="233" y2="215"/>
    </g>
    <line x1="250" y1="232" x2="272" y2="214" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="250" cy="232" r="4" fill="#dc2626"/>
    <text x="250" y="302" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">6</text>
  </g>

  <g class="p61-dial p61-dial3">
    <circle cx="360" cy="232" r="32" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="360" y1="202" x2="360" y2="208"/><line x1="381" y1="211" x2="377" y2="215"/>
      <line x1="390" y1="232" x2="384" y2="232"/><line x1="381" y1="253" x2="377" y2="249"/>
      <line x1="360" y1="262" x2="360" y2="256"/><line x1="339" y1="253" x2="343" y2="249"/>
      <line x1="330" y1="232" x2="336" y2="232"/><line x1="339" y1="211" x2="343" y2="215"/>
    </g>
    <line x1="360" y1="232" x2="360" y2="260" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="360" cy="232" r="4" fill="#dc2626"/>
    <text x="360" y="302" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">0</text>
  </g>

  <g class="p61-dial p61-dial4">
    <circle cx="470" cy="232" r="32" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="470" y1="202" x2="470" y2="208"/><line x1="491" y1="211" x2="487" y2="215"/>
      <line x1="500" y1="232" x2="494" y2="232"/><line x1="491" y1="253" x2="487" y2="249"/>
      <line x1="470" y1="262" x2="470" y2="256"/><line x1="449" y1="253" x2="453" y2="249"/>
      <line x1="440" y1="232" x2="446" y2="232"/><line x1="449" y1="211" x2="453" y2="215"/>
    </g>
    <line x1="470" y1="232" x2="450" y2="210" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="470" cy="232" r="4" fill="#dc2626"/>
    <text x="470" y="302" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">8</text>
  </g>

  <g class="p61-read">
    <text x="296" y="366" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">3×1000 + 6×100 + 0×10 + 8×1 = 3 608 Ω</text>
  </g>
  <text x="296" y="392" font-size="11.5" fill="#64748b" text-anchor="middle">读数 = 各旋钮示数 × 对应倍数，再相加</text>

  <rect x="576" y="100" width="288" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="190" height="28" rx="14" fill="#e8effc"/>
  <text x="691" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两种变阻器对比</text>

  <rect x="596" y="158" width="248" height="28" fill="#e8effc"/>
  <text x="612" y="177" font-size="11" font-weight="800" fill="#1e3a8a">项目</text>
  <text x="720" y="177" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻箱</text>
  <text x="816" y="177" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">滑动变阻器</text>

  <rect x="596" y="186" width="248" height="30" fill="#f8fbff"/>
  <text x="612" y="206" font-size="11" font-weight="700" fill="#334155">能否读数</text>
  <text x="720" y="206" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">能</text>
  <text x="816" y="206" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">不能</text>

  <rect x="596" y="216" width="248" height="30" fill="#ffffff"/>
  <text x="612" y="236" font-size="11" font-weight="700" fill="#334155">连续调节</text>
  <text x="720" y="236" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">不能</text>
  <text x="816" y="236" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">能</text>

  <rect x="596" y="246" width="248" height="30" fill="#f8fbff"/>
  <text x="612" y="266" font-size="11" font-weight="700" fill="#334155">阻值范围</text>
  <text x="720" y="266" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">0~9999 Ω</text>
  <text x="816" y="266" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">按规格</text>

  <rect x="596" y="276" width="248" height="30" fill="#ffffff"/>
  <text x="612" y="296" font-size="11" font-weight="700" fill="#334155">主要作用</text>
  <text x="720" y="296" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">改变阻值</text>
  <text x="816" y="296" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">限流分压</text>

  <rect x="596" y="318" width="248" height="66" rx="10" fill="#e8effc"/>
  <text x="720" y="340" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电阻箱：能读数，不能连续调节</text>
  <text x="720" y="362" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">滑动变阻器：能连续调节，不能读数</text>
  <text x="720" y="380" font-size="11" fill="#64748b" text-anchor="middle">两者都靠改变接入电阻来工作</text>

  <text x="720" y="398" font-size="11" fill="#64748b" text-anchor="middle">电阻箱常用于需要准确阻值的实验</text>
</g>
</svg>
