<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="核力与结合能：核力特点、结合能与比结合能、质量亏损与质能方程">
<style>
[data-scene="ps-122"] .s122-step1,[data-scene="ps-122"] .s122-step2,[data-scene="ps-122"] .s122-step3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-122"].s1 .s122-step1,[data-scene="ps-122"].s2 .s122-step2,[data-scene="ps-122"].s3 .s122-step3{opacity:1;visibility:visible}
@keyframes s122fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s122draw{to{stroke-dashoffset:0}}
@keyframes s122pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s122pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s122flow{to{stroke-dashoffset:-36}}
[data-scene="ps-122"].s1 .s122-nuc{transform-box:fill-box;transform-origin:center;animation:s122pop .5s ease both}
[data-scene="ps-122"].s1 .s122-bond line{stroke-dasharray:5 4;animation:s122flow 1.1s linear infinite}
[data-scene="ps-122"].s1 .s122-range{animation:s122pulse 2s ease-in-out infinite}
[data-scene="ps-122"].s2 .s122-half{animation:s122fade .5s ease both}
[data-scene="ps-122"].s2 .s122-arrow{stroke-dasharray:64;stroke-dashoffset:64;animation:s122draw .7s ease .3s forwards}
[data-scene="ps-122"].s2 .s122-curve{stroke-dasharray:600;stroke-dashoffset:600;animation:s122draw 1.3s ease .3s forwards}
[data-scene="ps-122"].s2 .s122-peak{transform-box:fill-box;transform-origin:center;animation:s122pulse 1.8s ease-in-out infinite}
[data-scene="ps-122"].s3 .s122-card{transform-box:fill-box;transform-origin:center;animation:s122pop .55s ease both}
[data-scene="ps-122"].s3 .s122-card2{animation-delay:.12s}
[data-scene="ps-122"].s3 .s122-formula{animation:s122pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">核力与结合能</text>

<!-- 第一步：核力的特点 -->
<g class="s122-step1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 核力把质子和中子束缚在原子核内</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="210" height="28" rx="14" fill="#e8effc"/>
  <text x="161" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">原子核内的核力</text>

  <text x="296" y="164" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">虚线圆内：核力作用范围约 10⁻¹⁵ m</text>
  <circle class="s122-range" cx="296" cy="252" r="78" fill="none" stroke="#93c5fd" stroke-width="1.8" stroke-dasharray="7 6"/>

  <g class="s122-bond" stroke="#059669" stroke-width="1.7">
    <line x1="296" y1="252" x2="296" y2="226" marker-end="url(#arrGreen)"/>
    <line x1="296" y1="252" x2="296" y2="278" marker-end="url(#arrGreen)"/>
    <line x1="296" y1="252" x2="277" y2="236" marker-end="url(#arrGreen)"/>
    <line x1="296" y1="252" x2="315" y2="236" marker-end="url(#arrGreen)"/>
    <line x1="296" y1="252" x2="277" y2="280" marker-end="url(#arrGreen)"/>
    <line x1="296" y1="252" x2="315" y2="280" marker-end="url(#arrGreen)"/>
  </g>

  <g class="s122-nuc">
    <circle cx="296" cy="252" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="296" y="256" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>

    <circle cx="268" cy="230" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="268" y="234" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>
    <circle cx="324" cy="230" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="324" y="234" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>
    <circle cx="266" cy="258" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="266" y="262" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>
    <circle cx="326" cy="258" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="326" y="262" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>
    <circle cx="268" cy="286" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="268" y="290" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>
    <circle cx="324" cy="286" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="324" y="290" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">p</text>

    <circle cx="296" cy="212" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="296" y="216" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="296" cy="292" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="296" y="296" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="238" cy="244" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="238" y="248" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="354" cy="244" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="354" y="248" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="238" cy="270" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="238" y="274" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
    <circle cx="354" cy="270" r="13" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="354" y="274" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">n</text>
  </g>

  <circle cx="76" cy="348" r="8" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
  <text x="90" y="352" font-size="11.5" font-weight="800" fill="#b91c1c">质子 p</text>
  <circle cx="166" cy="348" r="8" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="180" y="352" font-size="11.5" font-weight="800" fill="#1e40af">中子 n</text>

  <text x="56" y="382" font-size="12" font-weight="800" fill="#334155">p-p、p-n、n-n 之间都存在核力</text>
  <text x="56" y="406" font-size="11.5" fill="#475569">核力与核子是否带电无关</text>
  <text x="56" y="428" font-size="11.5" fill="#475569">饱和性：每个核子只与邻近少数核子作用</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">核力的四个特点</text>

  <rect x="596" y="158" width="248" height="58" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="610" y="182" font-size="12.5" font-weight="900" fill="#b45309">① 强相互作用</text>
  <text x="610" y="203" font-size="11" fill="#92400e">比电磁力强得多，把核子牢牢束缚</text>

  <rect x="596" y="226" width="248" height="58" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="610" y="250" font-size="12.5" font-weight="900" fill="#1e3a8a">② 短程力</text>
  <text x="610" y="271" font-size="11" fill="#475569">作用范围约 10⁻¹⁵ m，稍远即消失</text>

  <rect x="596" y="294" width="248" height="58" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="610" y="318" font-size="12.5" font-weight="900" fill="#047857">③ 与电荷无关</text>
  <text x="610" y="339" font-size="11" fill="#065f46">p-p、p-n、n-n 之间作用相同</text>

  <rect x="596" y="362" width="248" height="58" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="610" y="386" font-size="12.5" font-weight="900" fill="#334155">④ 饱和性</text>
  <text x="610" y="407" font-size="11" fill="#475569">只与邻近少数核子发生作用</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">核力是强相互作用：短程、与电荷无关、具有饱和性，把核子紧密结合成原子核</text>
</g>

<!-- 第二步：结合能和比结合能 -->
<g class="s122-step2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 核子结合成核释放能量，叫结合能</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="230" height="28" rx="14" fill="#e8effc"/>
  <text x="171" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">结合能：吸能还是放能</text>

  <text x="175" y="182" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">自由核子（能量较高）</text>

  <g class="s122-half">
    <circle cx="100" cy="206" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="130" cy="206" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="160" cy="206" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="190" cy="206" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="220" cy="206" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="250" cy="206" r="9" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <line class="s122-arrow" x1="190" y1="226" x2="190" y2="306" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="202" y="270" font-size="11.5" font-weight="800" fill="#047857">结合释放 E_b</text>

  <line class="s122-arrow" x1="150" y1="306" x2="150" y2="226" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <text x="138" y="270" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">分开吸收 E_b</text>

  <g class="s122-half">
    <circle cx="150" cy="326" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="170" cy="320" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="190" cy="326" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="146" cy="344" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="170" cy="344" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="194" cy="344" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="1.2"/>
  </g>
  <text x="170" y="386" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">原子核（能量较低）</text>

  <text x="310" y="202" font-size="16" font-weight="900" fill="#1e3a8a">结合能 E<tspan dy="4" font-size="11">b</tspan></text>
  <text x="310" y="232" font-size="11.5" fill="#334155">核子结合成原子核时释放</text>
  <text x="310" y="256" font-size="11.5" fill="#334155">把原子核完全分开时吸收</text>
  <text x="310" y="280" font-size="11.5" fill="#334155">吸收和释放的能量相等</text>

  <text x="310" y="312" font-size="12" font-weight="900" fill="#1d4ed8">比结合能 = 结合能 ÷ 核子数</text>
  <text x="310" y="338" font-size="11.5" font-weight="800" fill="#334155">比结合能越大，原子核越稳定</text>
  <text x="310" y="368" font-size="11" fill="#64748b">例：氘核结合能约 2.2 MeV</text>
  <text x="310" y="394" font-size="11" fill="#64748b">中等质量核的比结合能最大</text>
  <text x="310" y="420" font-size="11" fill="#64748b">铁核约为 8.8 MeV/核子</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">比结合能曲线</text>

  <line x1="620" y1="350" x2="832" y2="350" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <line x1="620" y1="350" x2="620" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrBlue)"/>
  <text x="612" y="172" font-size="11" font-weight="700" fill="#64748b" text-anchor="end">E/A</text>
  <text x="796" y="372" font-size="11" fill="#64748b" text-anchor="middle">质量数 A</text>

  <line x1="620" y1="202" x2="832" y2="202" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="828" y="194" font-size="11" font-weight="800" fill="#b45309" text-anchor="end">约 8.8 MeV</text>

  <path class="s122-curve" d="M 622 345 C 632 310 642 250 660 228 C 676 210 690 202 704 202 C 728 202 752 214 776 224 C 795 232 812 238 828 242" fill="none" stroke="#dc2626" stroke-width="2.6"/>

  <circle class="s122-peak" cx="704" cy="202" r="4" fill="#dc2626"/>
  <line x1="704" y1="202" x2="704" y2="350" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="648" y="332" font-size="11" fill="#64748b">轻核</text>
  <text x="704" y="332" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">中等核</text>
  <text x="812" y="332" font-size="11" fill="#64748b" text-anchor="end">重核</text>

  <text x="720" y="398" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">比结合能越大越稳定</text>
  <text x="720" y="422" font-size="11" fill="#475569" text-anchor="middle">中等质量核（如铁）最稳定</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">核子结合成核释放结合能，分开需吸收等量能量；比结合能越大，原子核越稳定</text>
</g>

<!-- 第三步：质量亏损与质能方程 -->
<g class="s122-step3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 质量亏损对应释放的核能</text>

  <rect x="36" y="100" width="520" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量亏损：反应前后质量变小</text>

  <text x="296" y="176" font-size="15.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">Δm = Z mₚ + (A−Z) mₙ − M核</text>

  <g class="s122-card">
    <rect x="56" y="196" width="215" height="92" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="70" y="222" font-size="12.5" font-weight="900" fill="#1e3a8a">反应前</text>
    <text x="70" y="248" font-size="11" fill="#475569">Z 个质子 + (A−Z) 个中子</text>
    <text x="70" y="272" font-size="11" fill="#475569">总质量 m₁</text>
  </g>

  <text x="288" y="252" font-size="18" font-weight="900" fill="#1d4ed8" text-anchor="middle">→</text>

  <g class="s122-card s122-card2">
    <rect x="305" y="196" width="215" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="319" y="222" font-size="12.5" font-weight="900" fill="#b45309">反应后</text>
    <text x="319" y="248" font-size="11" fill="#92400e">1 个原子核</text>
    <text x="319" y="272" font-size="11" fill="#92400e">总质量 m₂（更小）</text>
  </g>

  <text x="56" y="322" font-size="14" font-weight="900" fill="#b45309">质量亏损 Δm = m₁ − m₂</text>

  <rect x="56" y="342" width="464" height="68" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.8"/>
  <text class="s122-formula" x="288" y="372" font-size="19" font-weight="900" fill="#047857" text-anchor="middle">ΔE = Δm c²</text>
  <text x="288" y="397" font-size="11.5" fill="#065f46" text-anchor="middle">减少的质量对应释放的核能</text>

  <text x="56" y="430" font-size="11.5" font-weight="800" fill="#334155">质量亏损不是质量消失，而是转化为能量</text>

  <rect x="576" y="100" width="288" height="346" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质能方程 E = mc²</text>

  <text x="720" y="196" font-size="28" font-weight="900" fill="#1e3a8a" text-anchor="middle">E = mc²</text>
  <text x="720" y="222" font-size="11.5" fill="#475569" text-anchor="middle">质量与能量相互联系</text>

  <g class="s122-card">
    <rect x="596" y="242" width="248" height="64" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="610" y="266" font-size="12" font-weight="900" fill="#1e3a8a">1 u 的质量亏损</text>
    <text x="610" y="289" font-size="11" fill="#475569">对应约 931.5 MeV 的能量</text>
  </g>

  <g class="s122-card s122-card2">
    <rect x="596" y="316" width="248" height="64" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="610" y="340" font-size="12" font-weight="900" fill="#b45309">1 MeV = 1.6×10⁻¹³ J</text>
    <text x="610" y="363" font-size="11" fill="#92400e">核能比化学能大得多</text>
  </g>

  <rect x="596" y="390" width="248" height="38" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
  <text x="720" y="414" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">E = mc² 是核能计算的基础</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量亏损 Δm 对应释放的核能 ΔE = Δm c²，1 u 约对应 931.5 MeV</text>
</g>
</svg>
