<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="波的描述：波形图、波长与频率、波速 v 等于波长乘频率">
<style>
[data-scene="ps-74"] .s74-step{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
[data-scene="ps-74"].s1 .s74-step1,[data-scene="ps-74"].s2 .s74-step2,[data-scene="ps-74"].s3 .s74-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s74draw{to{stroke-dashoffset:0}}
@keyframes s74pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s74pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
[data-scene="ps-74"].s1 .s74-wave{stroke-dasharray:900;stroke-dashoffset:900;animation:s74draw 1.5s ease .2s forwards}
[data-scene="ps-74"].s2 .s74-wave2{stroke-dasharray:720;stroke-dashoffset:720;animation:s74draw 1.3s ease .2s forwards}
[data-scene="ps-74"].s2 .s74-src{animation:s74pulse 1.4s ease-in-out infinite}
[data-scene="ps-74"].s2 .s74-lam{stroke-dasharray:220;stroke-dashoffset:220;animation:s74draw .8s ease 1.2s forwards}
[data-scene="ps-74"].s3 .s74-solid{stroke-dasharray:620;stroke-dashoffset:620;animation:s74draw 1.3s ease .2s forwards}
[data-scene="ps-74"].s3 .s74-dash{stroke-dasharray:620;stroke-dashoffset:620;animation:s74draw 1.3s ease .8s forwards}
[data-scene="ps-74"].s3 .s74-card{transform-box:fill-box;transform-origin:center;animation:s74pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">波的描述：波长、频率与波速 v = λf</text>

<!-- 第一步：波形图 -->
<g class="s74-step s74-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">波形图：横轴表示平衡位置，纵轴表示该时刻的位移</text>

  <rect x="55" y="100" width="790" height="320" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="128" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">某一时刻的波形图</text>
  <line x1="110" y1="340" x2="835" y2="340" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="400" x2="110" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="828" y="362" font-size="12" fill="#64748b" text-anchor="end">x</text>
  <text x="92" y="162" font-size="12" fill="#64748b" text-anchor="end">y</text>
  <path class="s74-wave" d="M110 340 Q160 270 210 340 Q260 410 310 340 Q360 270 410 340 Q460 410 510 340 Q560 270 610 340 Q660 410 710 340 Q760 270 810 340" fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="160" y1="275" x2="160" y2="340" stroke="#dc2626" stroke-width="2" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="146" y="314" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="end">A</text>
  <text x="450" y="382" font-size="12" fill="#475569" text-anchor="middle">各质点的位移随平衡位置分布，是一条正弦曲线</text>
  <text x="450" y="402" font-size="11.5" fill="#64748b" text-anchor="middle">它只反映某一时刻介质中各质点的位移情况</text>

  <rect x="70" y="440" width="760" height="44" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="468" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">随时间推移，整个波形沿波的传播方向平移</text>
</g>

<!-- 第二步：波长和频率 -->
<g class="s74-step s74-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">波长是相邻同相质点间的距离；频率由波源决定</text>

  <rect x="50" y="105" width="560" height="290" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="330" y="131" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">波长 λ</text>
  <line x1="75" y1="280" x2="595" y2="280" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="85" y1="300" x2="85" y2="150" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <path class="s74-wave2" d="M90 280 Q140 225 190 280 Q240 335 290 280 Q340 225 390 280 Q440 335 490 280 Q540 225 590 280" fill="none" stroke="#1d4ed8" stroke-width="3.2"/>
  <line x1="140" y1="215" x2="140" y2="305" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="340" y1="215" x2="340" y2="305" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="140" cy="225" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="340" cy="225" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="1.8"/>
  <g stroke="#94a3b8" stroke-width="1.3">
    <line x1="140" y1="330" x2="140" y2="346"/><line x1="340" y1="330" x2="340" y2="346"/>
    <line class="s74-lam" x1="140" y1="340" x2="340" y2="340" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="240" y="328" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">λ</text>
  <text x="240" y="370" font-size="12" fill="#475569" text-anchor="middle">相邻波峰间距 = 一个波长 λ</text>

  <rect x="630" y="105" width="210" height="290" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="735" y="131" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">频率 f</text>
  <g class="s74-src" fill="none" stroke="#dc2626" stroke-width="2">
    <circle cx="735" cy="178" r="13" fill="#fbbf24" stroke="#b45309"/>
    <path d="M715 158 Q700 178 715 198"/>
    <path d="M755 158 Q770 178 755 198"/>
  </g>
  <text x="735" y="222" font-size="11.5" fill="#475569" text-anchor="middle">波源振动频率</text>
  <text x="735" y="246" font-size="11.5" fill="#475569" text-anchor="middle">由波源决定</text>
  <text x="735" y="270" font-size="11.5" fill="#475569" text-anchor="middle">与介质无关</text>
  <line x1="650" y1="290" x2="820" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="735" y="316" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = 1 / f</text>
  <text x="735" y="344" font-size="11.5" fill="#475569" text-anchor="middle">每隔 λ，振动状态重复</text>
  <text x="735" y="366" font-size="11.5" fill="#475569" text-anchor="middle">频率越高，周期越短</text>

  <rect x="70" y="412" width="760" height="72" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="438" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">波长也是振动相位总是相同的两个相邻质点之间的距离</text>
  <text x="450" y="463" font-size="12" fill="#334155" text-anchor="middle">周期 T 与频率 f 互为倒数：T = 1/f</text>
</g>

<!-- 第三步：波速 -->
<g class="s74-step s74-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">波速等于波长乘频率：v = λf = λ/T</text>

  <rect x="50" y="105" width="560" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="330" y="131" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">波形平移与波速</text>
  <line x1="75" y1="280" x2="595" y2="280" stroke="#64748b" stroke-width="1.6"/>
  <line x1="85" y1="300" x2="85" y2="160" stroke="#64748b" stroke-width="1.6"/>
  <path class="s74-solid" d="M80 280 Q160 210 240 280 Q320 350 400 280 Q480 210 560 280" fill="none" stroke="#1d4ed8" stroke-width="3.2"/>
  <path class="s74-dash" d="M80 280 Q160 350 240 280 Q320 210 400 280 Q480 350 560 280" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="9 6"/>
  <line x1="160" y1="205" x2="160" y2="355" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="320" y1="205" x2="320" y2="355" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <circle cx="160" cy="210" r="6" fill="#1d4ed8"/>
  <circle cx="320" cy="210" r="6" fill="#7c3aed"/>
  <line x1="175" y1="180" x2="305" y2="180" stroke="#059669" stroke-width="2.8" marker-end="url(#arrGreen)"/>
  <text x="240" y="168" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">T/2 内前进 λ/2</text>
  <g font-size="11.5" fill="#475569">
    <line x1="420" y1="152" x2="448" y2="152" stroke="#1d4ed8" stroke-width="3"/>
    <text x="454" y="156">t = 0</text>
    <line x1="420" y1="176" x2="448" y2="176" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="8 4"/>
    <text x="454" y="180">t = T/2</text>
  </g>
  <text x="330" y="382" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">一个周期 T 内，波形前进一个波长 λ</text>

  <rect class="s74-card" x="630" y="105" width="210" height="300" rx="14" fill="#ffffff" stroke="#c7d7f5" stroke-width="2"/>
  <text x="735" y="133" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">波速公式</text>
  <text x="735" y="178" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle">v = λ / T</text>
  <text x="735" y="222" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle">v = λ f</text>
  <line x1="650" y1="246" x2="820" y2="246" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="735" y="274" font-size="12" fill="#334155" text-anchor="middle">v 由介质决定</text>
  <text x="735" y="300" font-size="12" fill="#334155" text-anchor="middle">f 由波源决定</text>
  <text x="735" y="326" font-size="12" fill="#334155" text-anchor="middle">λ = v/f，随介质改变</text>
  <text x="735" y="360" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">三量必须对应同一列波</text>
  <text x="735" y="384" font-size="11.5" fill="#64748b" text-anchor="middle">不能跨介质混用</text>

  <rect x="70" y="422" width="760" height="62" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="448" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">换介质时：频率 f 不变，波速 v 改变，波长 λ = v/f 也随之改变</text>
  <text x="450" y="471" font-size="12" fill="#334155" text-anchor="middle">波速由介质决定，频率由波源决定，两者相互独立</text>
</g>
</svg>
