<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电能与电功：电能转化为其他形式的能、W 等于 UIt、电能表读数">
<style>
.p66-s1,.p66-s2,.p66-s3{opacity:0;visibility:hidden}
.p66-s1{opacity:1;visibility:visible}
[data-scene="pj-66"] .p66-s1,[data-scene="pj-66"] .p66-s2,[data-scene="pj-66"] .p66-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-66"].s1 .p66-s1,[data-scene="pj-66"].s2 .p66-s2,[data-scene="pj-66"].s3 .p66-s3{opacity:1;visibility:visible}
@keyframes p66pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p66slide{0%{transform:translateX(-10px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes p66pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p66glow{0%,100%{opacity:.55}50%{opacity:1}}
[data-scene="pj-66"].s1 .p66-row{transform-box:fill-box;transform-origin:left center;animation:p66slide .55s ease both}
[data-scene="pj-66"].s1 .p66-row2{animation-delay:.14s}
[data-scene="pj-66"].s1 .p66-row3{animation-delay:.28s}
[data-scene="pj-66"].s1 .p66-bulb{animation:p66glow 1.8s ease-in-out infinite}
[data-scene="pj-66"].s2 .p66-formula{transform-box:fill-box;transform-origin:center;animation:p66pop .6s ease both}
[data-scene="pj-66"].s2 .p66-chip{transform-box:fill-box;transform-origin:center;animation:p66pop .5s ease both}
[data-scene="pj-66"].s2 .p66-chip2{animation-delay:.12s}
[data-scene="pj-66"].s2 .p66-chip3{animation-delay:.24s}
[data-scene="pj-66"].s3 .p66-meter{transform-box:fill-box;transform-origin:center;animation:p66pop .6s ease both}
[data-scene="pj-66"].s3 .p66-digit{animation:p66pulse 2s ease-in-out infinite}
[data-scene="pj-66"].s3 .p66-result{transform-box:fill-box;transform-origin:center;animation:p66pop .55s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电能 电功：电能转化、W = UIt、电能表读数</text>

<!-- 第一步：电能转化 -->
<g class="p66-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">用电器消耗电能的过程，就是电能转化为其他形式能的过程</text>

  <rect x="36" y="100" width="540" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电能转化</text>

  <g class="p66-row">
    <g class="p66-bulb">
      <circle cx="96" cy="198" r="18" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
      <line x1="88" y1="190" x2="104" y2="206" stroke="#d97706" stroke-width="2"/>
      <line x1="104" y1="190" x2="88" y2="206" stroke="#d97706" stroke-width="2"/>
    </g>
    <text x="140" y="194" font-size="14" font-weight="900" fill="#1e3a8a">电灯</text>
    <text x="140" y="220" font-size="12" font-weight="700" fill="#334155">电能 → 光能 + 内能</text>
    <text x="556" y="201" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">照明</text>
    <line x1="60" y1="240" x2="552" y2="240" stroke="#e2e8f0"/>
  </g>

  <g class="p66-row p66-row2">
    <rect x="78" y="262" width="36" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M114 268 q12 4 0 16" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M86 258 q4 -8 8 0 M96 258 q4 -8 8 0" fill="none" stroke="#f87171" stroke-width="2"/>
    <text x="140" y="272" font-size="14" font-weight="900" fill="#1e3a8a">电热水壶</text>
    <text x="140" y="298" font-size="12" font-weight="700" fill="#334155">电能 → 内能</text>
    <text x="556" y="279" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">烧水</text>
    <line x1="60" y1="322" x2="552" y2="322" stroke="#e2e8f0"/>
  </g>

  <g class="p66-row p66-row3">
    <circle cx="96" cy="360" r="18" fill="#e8effc" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="96" y="366" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">M</text>
    <text x="140" y="356" font-size="14" font-weight="900" fill="#1e3a8a">电动机</text>
    <text x="140" y="382" font-size="12" font-weight="700" fill="#334155">电能 → 机械能</text>
    <text x="556" y="363" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">电风扇</text>
  </g>

  <rect x="596" y="100" width="268" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="616" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="691" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">能量转化</text>

  <text x="730" y="174" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">电能是能量的一种形式</text>
  <text x="730" y="200" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">用电器工作时消耗电能</text>
  <text x="730" y="226" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">把电能转化为其他形式能</text>

  <rect x="616" y="248" width="228" height="80" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="730" y="280" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">电能 → 其他形式能</text>
  <text x="730" y="306" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">消耗多少电能，就转化多少</text>

  <text x="730" y="356" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">电流做了多少功</text>
  <text x="730" y="380" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">就消耗多少电能</text>
  <text x="730" y="400" font-size="11" fill="#64748b" text-anchor="middle">单位：J；生活用 kW·h</text>
</g>

<!-- 第二步：电功 W = UIt -->
<g class="p66-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电功：W = UIt，电流做的功等于电压乘电流乘时间</text>

  <rect x="36" y="100" width="470" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电功公式</text>

  <g class="p66-formula">
    <text x="271" y="198" font-size="36" font-weight="900" fill="#1e3a8a" text-anchor="middle">W = UIt</text>
  </g>
  <text x="271" y="228" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">电功 = 电压 × 电流 × 通电时间</text>

  <g class="p66-chip">
    <rect x="60" y="246" width="130" height="40" rx="9" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="125" y="272" font-size="14" font-weight="900" fill="#047857" text-anchor="middle">W = Pt</text>
  </g>
  <g class="p66-chip p66-chip2">
    <rect x="200" y="246" width="130" height="40" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="265" y="272" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">W = I²Rt</text>
  </g>
  <g class="p66-chip p66-chip3">
    <rect x="340" y="246" width="130" height="40" rx="9" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="405" y="272" font-size="14" font-weight="900" fill="#7e22ce" text-anchor="middle">W = U²t/R</text>
  </g>

  <text x="271" y="316" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">1 J = 1 V × 1 A × 1 s</text>
  <text x="271" y="344" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">W = UIt 是普遍适用的电功公式</text>
  <text x="271" y="368" font-size="11.5" fill="#64748b" text-anchor="middle">后两个变形只适用于纯电阻电路</text>
  <text x="271" y="392" font-size="11.5" fill="#64748b" text-anchor="middle">电流做功的过程就是消耗电能的过程</text>

  <rect x="516" y="100" width="348" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="536" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="611" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">单位与换算</text>

  <rect x="536" y="158" width="308" height="56" rx="10" fill="#e8effc"/>
  <text x="552" y="181" font-size="12.5" font-weight="800" fill="#1e3a8a">焦耳 J</text>
  <text x="552" y="202" font-size="11.5" fill="#334155">国际单位：1 J = 1 V·A·s</text>

  <rect x="536" y="224" width="308" height="56" rx="10" fill="#e6f7f1"/>
  <text x="552" y="247" font-size="12.5" font-weight="800" fill="#047857">千瓦时 kW·h</text>
  <text x="552" y="268" font-size="11.5" fill="#334155">生活单位，俗称“度”</text>

  <rect x="536" y="290" width="308" height="56" rx="10" fill="#fff7ed"/>
  <text x="552" y="313" font-size="13" font-weight="900" fill="#b45309">1 kW·h = 3.6×10⁶ J</text>
  <text x="552" y="334" font-size="11.5" fill="#334155">1 度电 = 1 kW·h</text>

  <text x="690" y="374" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">电能表测的就是消耗的电能</text>
  <text x="690" y="398" font-size="11" fill="#64748b" text-anchor="middle">读数单位通常是 kW·h</text>
</g>

<!-- 第三步：电能表读数 -->
<g class="p66-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电能表：前后两次示数之差，就是这段时间消耗的电能</text>

  <rect x="36" y="100" width="500" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电能表读数</text>

  <g class="p66-meter">
    <rect x="60" y="148" width="450" height="182" rx="14" fill="#f8fbff" stroke="#334155" stroke-width="2.5"/>
    <text x="285" y="174" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">单相电能表</text>

    <text x="78" y="215" font-size="12" font-weight="700" fill="#475569">上月</text>
    <rect x="140" y="190" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="158" y="216" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">0</text>
    <rect x="180" y="190" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="198" y="216" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="220" y="190" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="238" y="216" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">3</text>
    <rect x="260" y="190" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="278" y="216" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">4</text>
    <rect x="300" y="190" width="36" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text class="p66-digit" x="318" y="216" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle">5</text>
    <text x="350" y="216" font-size="11" font-weight="700" fill="#64748b">kW·h</text>

    <text x="78" y="271" font-size="12" font-weight="700" fill="#475569">本月</text>
    <rect x="140" y="246" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="158" y="272" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">0</text>
    <rect x="180" y="246" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="198" y="272" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">2</text>
    <rect x="220" y="246" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="238" y="272" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">8</text>
    <rect x="260" y="246" width="36" height="38" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="278" y="272" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">7</text>
    <rect x="300" y="246" width="36" height="38" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text class="p66-digit" x="318" y="272" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle">5</text>
    <text x="350" y="272" font-size="11" font-weight="700" fill="#64748b">kW·h</text>

    <text x="285" y="314" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">287.5 − 234.5 = 53.0 kW·h</text>
  </g>

  <text x="286" y="358" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">前后两次示数之差 = 这段时间消耗的电能</text>
  <text x="286" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">最后一位是小数位，红色数字表示小数</text>

  <rect x="556" y="100" width="308" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="576" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="651" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">读数方法</text>

  <rect x="576" y="158" width="268" height="42" rx="9" fill="#e8effc"/>
  <text x="592" y="184" font-size="11.5" font-weight="800" fill="#1e3a8a">① 记录月初示数 W1</text>
  <rect x="576" y="206" width="268" height="42" rx="9" fill="#e6f7f1"/>
  <text x="592" y="232" font-size="11.5" font-weight="800" fill="#047857">② 记录月末示数 W2</text>
  <rect x="576" y="254" width="268" height="42" rx="9" fill="#fff7ed"/>
  <text x="592" y="280" font-size="11.5" font-weight="800" fill="#b45309">③ 消耗电能 W = W2 − W1</text>

  <g class="p66-result">
    <rect x="576" y="308" width="268" height="50" rx="10" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="710" y="340" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">W = 53.0 kW·h</text>
  </g>
  <text x="710" y="382" font-size="11" fill="#64748b" text-anchor="middle">换算：53.0 × 3.6×10⁶ J</text>
  <text x="710" y="400" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">≈ 1.9×10⁸ J</text>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电能表测一段时间内消耗的电能；示数之差就是这段时间的电功</text>
</g>
</svg>
