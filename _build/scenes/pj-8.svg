<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="声音的产生与传播：振动发声、真空罩实验、声速与回声">
  <style>
    [data-scene="pj-8"] .p8-step1,[data-scene="pj-8"] .p8-step2,[data-scene="pj-8"] .p8-step3{display:none}
    [data-scene="pj-8"].s1 .p8-step1,[data-scene="pj-8"].s2 .p8-step2,[data-scene="pj-8"].s3 .p8-step3{display:block;animation:p8in .45s ease both}
    @keyframes p8in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes p8flow{to{stroke-dashoffset:-40}}
    @keyframes p8pulse{0%,100%{opacity:.35}50%{opacity:.95}}
    @keyframes p8rise{0%{transform:translateY(4px) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-42px) scale(1.1);opacity:0}}
    [data-scene="pj-8"] .p8-wave{animation:p8pulse 1.6s ease-in-out infinite}
    [data-scene="pj-8"] .p8-air{stroke-dasharray:7 5;animation:p8flow 1.1s linear infinite}
    [data-scene="pj-8"] .p8-echo{stroke-dasharray:12 8;animation:p8flow 1.2s linear infinite}
    [data-scene="pj-8"] .p8-card{transform-box:fill-box;transform-origin:center;animation:popIn .45s ease both}
    [data-scene="pj-8"] .p8-grain{transform-box:fill-box;transform-origin:center;animation:p8rise 1.8s ease-in-out infinite}
    [data-scene="pj-8"] .p8-g2{animation-delay:.25s}
    [data-scene="pj-8"] .p8-g3{animation-delay:.5s}
    [data-scene="pj-8"] .p8-g4{animation-delay:.75s}
    [data-scene="pj-8"] .p8-g5{animation-delay:1s}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="500" width="900" height="120" fill="url(#gBench)"/>
  <line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">声音的产生与传播：振动发声，介质传声</text>

  <!-- 第一步：声音的产生 -->
  <g class="p8-step1" data-zone="1">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">一切发声的物体都在振动；振动停止，发声停止</text>

    <g stroke="#1d4ed8" stroke-width="2.5" fill="none" class="p8-wave">
      <path d="M232 190 Q214 222 232 254"/>
      <path d="M218 180 Q192 222 218 264"/>
      <path d="M204 170 Q170 222 204 274"/>
      <path d="M348 190 Q366 222 348 254"/>
      <path d="M362 180 Q388 222 362 264"/>
      <path d="M376 170 Q410 222 376 274"/>
    </g>
    <path d="M250 195 V255 Q250 292 290 292 Q330 292 330 255 V195" fill="none" stroke="#64748b" stroke-width="13" stroke-linecap="round"/>
    <line x1="290" y1="292" x2="290" y2="345" stroke="#64748b" stroke-width="11" stroke-linecap="round"/>
    <rect x="262" y="345" width="56" height="12" rx="4" fill="#475569"/>
    <text x="290" y="385" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">音叉</text>
    <text x="290" y="408" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">振动 → 发声</text>

    <line x1="745" y1="185" x2="700" y2="252" stroke="#92400e" stroke-width="6" stroke-linecap="round"/>
    <rect x="590" y="270" width="150" height="70" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="665" cy="340" rx="75" ry="12" fill="#d97706"/>
    <ellipse cx="665" cy="270" rx="75" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <g fill="#78350f">
      <circle class="p8-grain" cx="635" cy="252" r="3.5"/>
      <circle class="p8-grain p8-g2" cx="660" cy="246" r="3.5"/>
      <circle class="p8-grain p8-g3" cx="688" cy="252" r="3.5"/>
      <circle class="p8-grain p8-g4" cx="652" cy="238" r="3.5"/>
      <circle class="p8-grain p8-g5" cx="676" cy="240" r="3.5"/>
    </g>
    <text x="665" y="385" font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">鼓</text>
    <text x="665" y="408" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">鼓面振动，纸屑跳动</text>

    <rect x="170" y="432" width="560" height="50" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="450" y="462" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">正在发声的物体叫做声源；振动停止，发声也停止</text>
  </g>

  <!-- 第二步：声音的传播 -->
  <g class="p8-step2" data-zone="2">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">传播需要介质：固体、液体、气体能传声，真空不能</text>

    <g class="p8-card">
      <rect x="60" y="150" width="230" height="240" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="175" y="180" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">抽气观察</text>
      <text x="80" y="212" font-size="12.5" font-weight="700" fill="#334155">① 逐渐抽出空气</text>
      <text x="80" y="240" font-size="12.5" font-weight="700" fill="#334155">② 铃声越来越小</text>
      <text x="80" y="268" font-size="12.5" font-weight="700" fill="#334155">③ 接近真空：听不到</text>
      <line x1="80" y1="288" x2="270" y2="288" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="175" y="318" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">真空不能传声</text>
      <rect x="150" y="340" width="14" height="26" rx="3" fill="#f87171"/>
      <rect x="174" y="350" width="14" height="16" rx="3" fill="#f87171"/>
      <rect x="198" y="358" width="14" height="8" rx="3" fill="#f87171"/>
      <text x="226" y="366" font-size="11" fill="#64748b">音量</text>
    </g>

    <path d="M320 420 V310 Q320 175 450 175 Q580 175 580 310 V420 Z" fill="#eaf4ff" opacity=".55" stroke="#1e3a8a" stroke-width="3"/>
    <path d="M342 300 Q342 205 430 190" fill="none" stroke="#ffffff" stroke-width="5" opacity=".75"/>
    <rect x="285" y="420" width="330" height="20" rx="6" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>

    <g class="p8-wave" stroke="#dc2626" stroke-width="2.5" fill="none">
      <path d="M390 320 Q370 345 390 370"/>
      <path d="M375 306 Q348 345 375 384"/>
      <path d="M360 292 Q326 345 360 398"/>
      <path d="M510 320 Q530 345 510 370"/>
      <path d="M525 306 Q552 345 525 384"/>
      <path d="M540 292 Q574 345 540 398"/>
    </g>
    <circle cx="450" cy="345" r="48" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <path d="M424 303 Q412 290 424 280" fill="none" stroke="#b45309" stroke-width="3"/>
    <path d="M476 303 Q488 290 476 280" fill="none" stroke="#b45309" stroke-width="3"/>
    <g stroke="#92400e" stroke-width="3" stroke-linecap="round">
      <line x1="450" y1="345" x2="450" y2="315"/>
      <line x1="450" y1="345" x2="472" y2="345"/>
      <line x1="432" y1="390" x2="426" y2="402"/><line x1="468" y1="390" x2="474" y2="402"/>
    </g>
    <circle cx="450" cy="345" r="4" fill="#92400e"/>
    <text x="450" y="414" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">闹钟</text>

    <path d="M580 400 H660" fill="none" stroke="#475569" stroke-width="7"/>
    <line class="p8-air" x1="592" y1="400" x2="652" y2="400" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <rect x="660" y="360" width="150" height="85" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <circle cx="735" cy="402" r="22" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="2">
      <line x1="735" y1="384" x2="735" y2="420"/><line x1="717" y1="402" x2="753" y2="402"/>
    </g>
    <text x="735" y="438" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">真空泵</text>
    <text x="735" y="345" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">抽出空气</text>

    <text x="450" y="482" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">听到的铃声随空气减少而变弱，说明声音的传播需要介质</text>
  </g>

  <!-- 第三步：声速与回声 -->
  <g class="p8-step3" data-zone="3">
    <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">声速：固体中最快、液体中次之、气体中最慢</text>

    <g class="p8-card">
      <rect x="600" y="108" width="260" height="62" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
      <text x="730" y="133" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">v固 大于 v液 大于 v气</text>
      <text x="730" y="156" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">15 ℃ 空气中：340 m/s</text>
    </g>

    <line x1="0" y1="430" x2="900" y2="430" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="700,430 700,270 760,205 830,240 870,215 870,430" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="1.5" opacity=".55">
      <line x1="715" y1="300" x2="755" y2="335"/><line x1="780" y1="270" x2="812" y2="310"/>
      <line x1="745" y1="370" x2="790" y2="400"/><line x1="820" y1="270" x2="850" y2="300"/>
    </g>
    <text x="785" y="455" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">山崖</text>

    <circle cx="150" cy="330" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    <path d="M150 344 V400" stroke="#1e3a8a" stroke-width="7" stroke-linecap="round"/>
    <path d="M150 360 L128 386 M150 360 L172 386" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
    <path d="M150 400 L136 430 M150 400 L164 430" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#dc2626" stroke-width="2" fill="none">
      <path d="M168 322 Q178 330 168 338"/>
      <path d="M176 314 Q190 330 176 346"/>
    </g>

    <line class="p8-echo" x1="195" y1="315" x2="690" y2="292" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="430" y="288" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">去 0.5 s</text>
    <line class="p8-echo" x1="690" y1="322" x2="195" y2="350" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
    <text x="430" y="356" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">回 0.5 s</text>

    <circle cx="450" cy="235" r="22" fill="#ffffff" stroke="#1e3a8a" stroke-width="3"/>
    <line x1="450" y1="235" x2="450" y2="220" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="450" y1="235" x2="461" y2="242" stroke="#1e3a8a" stroke-width="2"/>
    <text x="450" y="200" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">共 1 s</text>

    <g class="p8-card">
      <rect x="170" y="440" width="560" height="50" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
      <text x="450" y="459" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">人距山崖的距离（回声测距）</text>
      <text x="450" y="482" font-size="15.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">s = v t / 2 = 340 × 1 ÷ 2 = 170 m</text>
    </g>
  </g>
</svg>
