<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验：探究小车速度随时间变化的规律，打点计时器、纸带数据处理与 v-t 图像">
<style>
[data-scene="ps-8"] .s8-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-8"].s1 .s8-step1,[data-scene="ps-8"].s2 .s8-step2,[data-scene="ps-8"].s3 .s8-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s8draw{to{stroke-dashoffset:0}}
@keyframes s8grow{from{opacity:0}to{opacity:1}}
@keyframes s8pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s8pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s8roll{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
[data-scene="ps-8"].s1 .s8-cart{transform-box:fill-box;transform-origin:center;animation:s8roll 3s ease-in-out infinite}
[data-scene="ps-8"].s1 .s8-tape{stroke-dasharray:210;stroke-dashoffset:210;animation:s8draw 1s ease .2s both}
[data-scene="ps-8"].s2 .s8-dot{transform-box:fill-box;transform-origin:center;animation:s8pop .4s ease both}
[data-scene="ps-8"].s2 .s8-dot2{animation-delay:.08s}
[data-scene="ps-8"].s2 .s8-dot3{animation-delay:.16s}
[data-scene="ps-8"].s2 .s8-dot4{animation-delay:.24s}
[data-scene="ps-8"].s2 .s8-dot5{animation-delay:.32s}
[data-scene="ps-8"].s2 .s8-dot6{animation-delay:.4s}
[data-scene="ps-8"].s2 .s8-dot7{animation-delay:.48s}
[data-scene="ps-8"].s3 .s8-line{stroke-dasharray:600;stroke-dashoffset:600;animation:s8draw 1.1s ease .3s both}
[data-scene="ps-8"].s3 .s8-pt{transform-box:fill-box;transform-origin:center;animation:s8pop .4s ease both}
[data-scene="ps-8"].s3 .s8-tri{stroke-dasharray:220;stroke-dashoffset:220;animation:s8draw .9s ease .9s both}
[data-scene="ps-8"].s3 .s8-pulse{animation:s8pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：探究小车速度随时间变化的规律</text>

<!-- 第一步：实验装置 -->
<g class="s8-step s8-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">实验装置：打点计时器记录小车的运动</text>

  <rect x="560" y="100" width="280" height="140" rx="13" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="560" y="100" width="280" height="7" rx="3.5" fill="#1d4ed8"/>
  <text x="700" y="128" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">打点计时器</text>
  <text x="700" y="156" font-size="12" fill="#334155" text-anchor="middle">使用交流电源，频率 50 Hz</text>
  <text x="700" y="180" font-size="12" fill="#334155" text-anchor="middle">相邻两点时间间隔 T = 0.02 s</text>
  <text x="700" y="204" font-size="12" fill="#334155" text-anchor="middle">每 5 个间隔取一个计数点</text>
  <text x="700" y="228" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">计数点间隔 0.1 s</text>

  <rect x="110" y="300" width="640" height="12" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="690" y="340" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">长木板</text>

  <rect class="s8-tape" x="150" y="292" width="180" height="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <g fill="#b45309">
    <circle cx="162" cy="295" r="1.8"/>
    <circle cx="186" cy="295" r="1.8"/>
    <circle cx="210" cy="295" r="1.8"/>
    <circle cx="234" cy="295" r="1.8"/>
    <circle cx="258" cy="295" r="1.8"/>
    <circle cx="282" cy="295" r="1.8"/>
    <circle cx="306" cy="295" r="1.8"/>
    <circle cx="330" cy="295" r="1.8"/>
  </g>

  <rect x="62" y="252" width="96" height="66" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <circle cx="86" cy="272" r="8" fill="#334155"/>
  <circle cx="110" cy="272" r="8" fill="#334155"/>
  <circle cx="86" cy="272" r="2.5" fill="#94a3b8"/>
  <circle cx="110" cy="272" r="2.5" fill="#94a3b8"/>
  <rect x="76" y="290" width="64" height="12" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="110" y="242" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">打点计时器</text>

  <g class="s8-cart">
    <rect x="350" y="266" width="110" height="34" rx="8" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <circle cx="375" cy="306" r="9" fill="#1e293b"/>
    <circle cx="435" cy="306" r="9" fill="#1e293b"/>
    <circle cx="375" cy="306" r="3" fill="#94a3b8"/>
    <circle cx="435" cy="306" r="3" fill="#94a3b8"/>
    <text x="405" y="252" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">小车</text>
  </g>

  <line x1="470" y1="230" x2="556" y2="230" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="513" y="218" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">运动方向</text>

  <line x1="460" y1="283" x2="734" y2="283" stroke="#64748b" stroke-width="2"/>
  <circle cx="748" cy="283" r="16" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="748" cy="283" r="3.5" fill="#475569"/>
  <line x1="748" y1="299" x2="748" y2="336" stroke="#64748b" stroke-width="2"/>
  <rect x="732" y="336" width="32" height="44" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.6"/>
  <text x="792" y="362" font-size="12" font-weight="800" fill="#475569">重物</text>

  <rect x="60" y="396" width="780" height="76" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.8"/>
  <text x="450" y="424" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">操作顺序：先接通电源，再释放小车</text>
  <text x="450" y="452" font-size="12" fill="#334155" text-anchor="middle">纸带穿过限位孔，细线绕过滑轮并挂上重物，小车靠近打点计时器</text>
</g>

<!-- 第二步：纸带数据处理 -->
<g class="s8-step s8-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">纸带数据处理：用平均速度求瞬时速度</text>

  <rect x="600" y="96" width="250" height="34" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="725" y="118" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">T = 0.1 s（每 5 个间隔取点）</text>

  <rect x="60" y="196" width="780" height="44" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <g fill="#78716c" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="100" y="190">0</text>
    <text x="160" y="190">1</text>
    <text x="225" y="190">2</text>
    <text x="295" y="190">3</text>
    <text x="370" y="190">4</text>
    <text x="450" y="190">5</text>
    <text x="540" y="190">6</text>
  </g>
  <g class="s8-dot"><circle cx="100" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot2"><circle cx="160" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot3"><circle cx="225" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot4"><circle cx="295" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot5"><circle cx="370" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot6"><circle cx="450" cy="218" r="4.2" fill="#44403c"/></g>
  <g class="s8-dot s8-dot7"><circle cx="540" cy="218" r="4.2" fill="#44403c"/></g>
  <text x="690" y="222" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">相邻计数点时间间隔为 0.1 s</text>

  <g stroke="#d97706" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="100" y1="224" x2="100" y2="292"/>
    <line x1="160" y1="224" x2="160" y2="292"/>
    <line x1="225" y1="224" x2="225" y2="292"/>
    <line x1="295" y1="224" x2="295" y2="292"/>
    <line x1="370" y1="224" x2="370" y2="292"/>
    <line x1="450" y1="224" x2="450" y2="292"/>
    <line x1="540" y1="224" x2="540" y2="292"/>
  </g>
  <line x1="100" y1="286" x2="540" y2="286" stroke="#d97706" stroke-width="1.6"/>
  <g stroke="#d97706" stroke-width="1.4">
    <line x1="100" y1="280" x2="100" y2="292"/>
    <line x1="160" y1="280" x2="160" y2="292"/>
    <line x1="225" y1="280" x2="225" y2="292"/>
    <line x1="295" y1="280" x2="295" y2="292"/>
    <line x1="370" y1="280" x2="370" y2="292"/>
    <line x1="450" y1="280" x2="450" y2="292"/>
    <line x1="540" y1="280" x2="540" y2="292"/>
  </g>
  <g font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">
    <text x="130" y="306">x₁</text>
    <text x="192" y="306">x₂</text>
    <text x="260" y="306">x₃</text>
    <text x="332" y="306">x₄</text>
    <text x="410" y="306">x₅</text>
    <text x="495" y="306">x₆</text>
  </g>

  <rect x="60" y="330" width="430" height="154" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="275" y="356" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">求某点的瞬时速度</text>
  <text x="275" y="384" font-size="13" font-weight="900" fill="#6d28d9" text-anchor="middle">v₂ = (x₂ + x₃) / (2T)</text>
  <text x="275" y="410" font-size="12" fill="#334155" text-anchor="middle">用包含该点的一小段平均速度代替</text>
  <text x="275" y="436" font-size="11.5" fill="#334155" text-anchor="middle">例：T = 0.1 s，x₂ = 5.0 cm，x₃ = 6.2 cm</text>
  <text x="275" y="462" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">v₂ ≈ 0.56 m/s</text>

  <rect x="510" y="330" width="370" height="154" rx="14" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="695" y="356" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">测量与计算</text>
  <text x="695" y="384" font-size="12" fill="#334155" text-anchor="middle">用刻度尺测各段距离，读数估读到 0.1 mm</text>
  <text x="695" y="410" font-size="12" fill="#334155" text-anchor="middle">舍去开头过于密集的点</text>
  <text x="695" y="436" font-size="12" fill="#334155" text-anchor="middle">多测几组数据，减小偶然误差</text>
  <text x="695" y="462" font-size="12" fill="#334155" text-anchor="middle">单位统一用 m 和 s</text>
</g>

<!-- 第三步：v-t 图像与斜率 -->
<g class="s8-step s8-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">v-t 图像：倾斜直线的斜率表示加速度</text>

  <line x1="120" y1="420" x2="600" y2="420" stroke="#334155" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <line x1="120" y1="420" x2="120" y2="110" stroke="#334155" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="608" y="444" font-size="12" font-weight="800" fill="#475569">t</text>
  <text x="108" y="116" font-size="12" font-weight="800" fill="#475569">v</text>
  <text x="108" y="438" font-size="11.5" font-weight="700" fill="#64748b">O</text>

  <line class="s8-line" x1="150" y1="400" x2="570" y2="178" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#dc2626" stroke="#ffffff" stroke-width="1.4">
    <g class="s8-pt"><circle cx="180" cy="384" r="5.5"/></g>
    <g class="s8-pt"><circle cx="265" cy="339" r="5.5"/></g>
    <g class="s8-pt"><circle cx="350" cy="294" r="5.5"/></g>
    <g class="s8-pt"><circle cx="435" cy="249" r="5.5"/></g>
    <g class="s8-pt"><circle cx="520" cy="204" r="5.5"/></g>
  </g>

  <path class="s8-tri" d="M265 339 L435 339 L435 249" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="360" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">Δt</text>
  <text x="446" y="300" font-size="12" font-weight="800" fill="#047857">Δv</text>

  <rect x="615" y="110" width="245" height="320" rx="14" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="615" y="110" width="245" height="7" rx="3.5" fill="#1d4ed8"/>
  <text x="737" y="140" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">v-t 图像的特点</text>
  <text x="737" y="174" font-size="11.5" fill="#334155" text-anchor="middle">倾斜直线 → 匀变速直线运动</text>
  <text x="737" y="198" font-size="11.5" fill="#334155" text-anchor="middle">斜率 k = Δv / Δt = a</text>
  <text x="737" y="222" font-size="11.5" fill="#334155" text-anchor="middle">纵轴截距 = 初速度 v₀</text>
  <line x1="635" y1="238" x2="840" y2="238" stroke="#e8eef7" stroke-width="1.4"/>
  <text x="737" y="264" font-size="11.5" fill="#334155" text-anchor="middle">图线与 t 轴围成的面积</text>
  <text x="737" y="288" font-size="11.5" fill="#334155" text-anchor="middle">表示这段时间内的位移</text>
  <text x="737" y="318" font-size="11.5" fill="#334155" text-anchor="middle">斜率越陡，加速度越大</text>
  <text x="737" y="348" font-size="11.5" fill="#334155" text-anchor="middle">斜率为负表示加速度反向</text>
  <text x="737" y="384" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">直线斜率不变，a 不变</text>
  <text x="737" y="408" font-size="11" fill="#64748b" text-anchor="middle">小车做匀变速直线运动</text>

  <g class="s8-pulse">
    <text x="360" y="466" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">直线的斜率就是小车的加速度</text>
  </g>
</g>
</svg>
