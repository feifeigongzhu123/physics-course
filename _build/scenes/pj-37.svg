<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="流体压强与流速：管中流速与压强、机翼升力、站台安全线和两船并行">
<style>
[data-scene="pj-37"] .p37-step1,[data-scene="pj-37"] .p37-step2,[data-scene="pj-37"] .p37-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="pj-37"].s1 .p37-step1,[data-scene="pj-37"].s2 .p37-step2,[data-scene="pj-37"].s3 .p37-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes p37flow{to{stroke-dashoffset:-48}}
@keyframes p37pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p37draw{to{stroke-dashoffset:0}}
@keyframes p37pulse{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="pj-37"].s1 .p37-flow{stroke-dasharray:12 9;animation:p37flow 1s linear infinite}
[data-scene="pj-37"].s1 .p37-liquid{animation:p37pulse 1.8s ease-in-out infinite}
[data-scene="pj-37"].s2 .p37-stream{stroke-dasharray:14 8;animation:p37flow 1.1s linear infinite}
[data-scene="pj-37"].s2 .p37-lift{stroke-dasharray:180;stroke-dashoffset:180;animation:p37draw 1s ease .4s forwards}
[data-scene="pj-37"].s2 .p37-parrow{animation:p37pulse 1.6s ease-in-out infinite}
[data-scene="pj-37"].s3 .p37-pop{transform-box:fill-box;transform-origin:center;animation:p37pop .45s ease both}
[data-scene="pj-37"].s3 .p37-warn{animation:p37pulse 1.4s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">流体压强与流速：流速越大，压强越小</text>

<!-- 第一步：流速与压强的关系 -->
<g class="p37-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">管中窄处流速大，细管中的液柱反而更低</text>

  <path d="M110 230 H320 L420 262 H580 L680 230 H790 V330 H680 L580 298 H420 L320 330 H110 Z" fill="#dbeafe" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>

  <rect x="193" y="140" width="14" height="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect class="p37-liquid" x="195" y="160" width="10" height="70" fill="#38bdf8"/>
  <rect x="493" y="140" width="14" height="122" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect class="p37-liquid" x="495" y="210" width="10" height="52" fill="#38bdf8"/>
  <rect x="693" y="140" width="14" height="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect class="p37-liquid" x="695" y="160" width="10" height="70" fill="#38bdf8"/>
  <text x="200" y="128" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">液柱高</text>
  <text x="500" y="128" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">液柱低</text>
  <text x="700" y="128" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">液柱高</text>

  <line class="p37-flow" x1="130" y1="280" x2="770" y2="280" stroke="#1d4ed8" stroke-width="2.5"/>
  <g stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)" opacity=".85">
    <line x1="150" y1="252" x2="280" y2="252"/>
    <line x1="150" y1="310" x2="280" y2="310"/>
    <line x1="440" y1="280" x2="545" y2="280"/>
    <line x1="620" y1="252" x2="750" y2="252"/>
    <line x1="620" y1="310" x2="750" y2="310"/>
  </g>
  <text x="500" y="255" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">v 大</text>

  <text x="215" y="360" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">宽处：流速小</text>
  <text x="215" y="380" font-size="12" fill="#475569" text-anchor="middle">压强大</text>
  <text x="500" y="360" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">窄处：流速大</text>
  <text x="500" y="380" font-size="12" fill="#475569" text-anchor="middle">压强小</text>
  <text x="715" y="360" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">宽处：流速小</text>
  <text x="715" y="380" font-size="12" fill="#475569" text-anchor="middle">压强大</text>

  <text x="450" y="430" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">流速大的位置压强小，流速小的位置压强大</text>
  <text x="450" y="456" font-size="12" fill="#64748b" text-anchor="middle">液体和气体统称流体，都遵循这一规律</text>
</g>

<!-- 第二步：机翼升力 -->
<g class="p37-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">机翼升力：上表面流速大、压强小，下表面相反</text>

  <g class="p37-stream" fill="none" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrBlue)">
    <path d="M110 196 C340 160 560 168 800 238"/>
    <path d="M110 232 C340 196 560 204 792 266"/>
    <path d="M110 268 C340 232 560 240 775 288"/>
    <path d="M110 358 C350 350 560 346 800 352"/>
    <path d="M110 390 C350 382 560 378 800 386"/>
  </g>

  <path d="M170 315 C290 250 520 245 720 300 C560 330 360 335 170 315 Z" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="430" y="312" font-size="12.5" font-weight="800" fill="#475569" text-anchor="middle">机翼截面</text>

  <g class="p37-parrow" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)">
    <line x1="300" y1="222" x2="300" y2="256"/>
    <line x1="420" y1="205" x2="420" y2="244"/>
    <line x1="540" y1="208" x2="540" y2="250"/>
  </g>
  <rect x="334" y="176" width="172" height="20" rx="6" fill="#f7fbff" opacity=".92"/>
  <text x="420" y="192" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">上表面：v 大，p 小</text>

  <g class="p37-parrow" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)">
    <line x1="360" y1="368" x2="360" y2="322"/>
    <line x1="480" y1="362" x2="480" y2="320"/>
  </g>
  <text x="530" y="374" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">下表面：v 小，p 大</text>

  <line class="p37-lift" x1="640" y1="312" x2="640" y2="160" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="656" y="176" font-size="14" font-weight="900" fill="#b91c1c">升力 F</text>

  <rect x="70" y="404" width="330" height="58" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="235" y="428" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">上表面弯曲，空气路程长</text>
  <text x="235" y="448" font-size="11.5" fill="#475569" text-anchor="middle">流速大 → 压强小</text>
  <rect x="480" y="404" width="360" height="58" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="660" y="428" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">下表面较平，空气路程短</text>
  <text x="660" y="448" font-size="11.5" fill="#475569" text-anchor="middle">流速小 → 压强大</text>
  <text x="450" y="486" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">上下表面的压强差，形成向上的升力</text>
</g>

<!-- 第三步：生活现象 -->
<g class="p37-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">站台安全线与两船并行：都是流速大压强小</text>

  <rect x="60" y="415" width="330" height="55" fill="#e2e8f0"/>
  <rect x="390" y="440" width="50" height="30" fill="#94a3b8"/>
  <line x1="60" y1="415" x2="390" y2="415" stroke="#94a3b8" stroke-width="3"/>
  <text x="130" y="448" font-size="12" font-weight="700" fill="#475569">站台</text>

  <g class="p37-pop">
    <rect x="310" y="250" width="140" height="165" rx="14" fill="#93c5fd" stroke="#1e40af" stroke-width="2.5"/>
    <rect x="326" y="268" width="44" height="34" rx="4" fill="#dbeafe"/>
    <rect x="386" y="268" width="44" height="34" rx="4" fill="#dbeafe"/>
    <rect x="326" y="316" width="104" height="12" rx="4" fill="#bfdbfe"/>
    <text x="380" y="240" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">列车进站</text>
  </g>

  <g>
    <circle cx="200" cy="330" r="11" fill="#1e3a8a"/>
    <line x1="200" y1="341" x2="200" y2="382" stroke="#1e3a8a" stroke-width="5"/>
    <line x1="200" y1="352" x2="184" y2="368" stroke="#1e3a8a" stroke-width="4"/>
    <line x1="200" y1="352" x2="216" y2="368" stroke="#1e3a8a" stroke-width="4"/>
    <line x1="200" y1="382" x2="188" y2="412" stroke="#1e3a8a" stroke-width="4"/>
    <line x1="200" y1="382" x2="212" y2="412" stroke="#1e3a8a" stroke-width="4"/>
  </g>
  <line class="p37-warn" x1="270" y1="300" x2="270" y2="415" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="270" y="445" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">安全线</text>
  <line x1="216" y1="360" x2="298" y2="360" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="252" y="390" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">人被压向列车</text>

  <rect x="460" y="400" width="380" height="70" fill="#bfdbfe" opacity=".75"/>
  <line x1="460" y1="400" x2="840" y2="400" stroke="#60a5fa" stroke-width="3"/>
  <text x="645" y="322" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两船并行</text>
  <polygon points="490,366 590,366 575,400 505,400" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <rect x="516" y="338" width="46" height="28" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <polygon points="700,366 800,366 785,400 715,400" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <rect x="726" y="338" width="46" height="28" rx="4" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
  <line x1="602" y1="380" x2="688" y2="380" stroke="#1d4ed8" stroke-width="3" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="645" y="368" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">中间 v 大、p 小</text>
  <line class="p37-warn" x1="604" y1="424" x2="626" y2="424" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line class="p37-warn" x1="686" y1="424" x2="664" y2="424" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="645" y="452" font-size="11.5" fill="#b91c1c" text-anchor="middle">船相互靠近</text>
  <text x="645" y="475" font-size="11" fill="#64748b" text-anchor="middle">船外侧压强大，把两船压向中间</text>

  <text x="450" y="492" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">流体中流速越大压强越小：站台要站在安全线外，两船不能并排高速行驶</text>
</g>
</svg>
