<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="广播、电视和移动通信：无线电广播的发射与接收、电视信号、手机与基地台">
<style>
.p80-s1,.p80-s2,.p80-s3{opacity:0;visibility:hidden}
.p80-s1{opacity:1;visibility:visible}
[data-scene="pj-80"] .p80-s1,[data-scene="pj-80"] .p80-s2,[data-scene="pj-80"] .p80-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-80"].s1 .p80-s1,[data-scene="pj-80"].s2 .p80-s2,[data-scene="pj-80"].s3 .p80-s3{opacity:1;visibility:visible}
@keyframes p80pop{0%{transform:scale(.84);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p80draw{to{stroke-dashoffset:0}}
@keyframes p80flow{to{stroke-dashoffset:-44}}
@keyframes p80pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes p80slide{0%{transform:translateX(-10px);opacity:0}100%{transform:translateX(0);opacity:1}}
[data-scene="pj-80"].s1 .p80-card{transform-box:fill-box;transform-origin:center;animation:p80pop .5s ease both}
[data-scene="pj-80"].s1 .p80-card2{animation-delay:.08s}
[data-scene="pj-80"].s1 .p80-card3{animation-delay:.16s}
[data-scene="pj-80"].s1 .p80-card4{animation-delay:.24s}
[data-scene="pj-80"].s1 .p80-card5{animation-delay:.32s}
[data-scene="pj-80"].s1 .p80-card6{animation-delay:.4s}
[data-scene="pj-80"].s1 .p80-arrow{stroke-dasharray:8 6;animation:p80flow 1.2s linear infinite}
[data-scene="pj-80"].s1 .p80-tx,[data-scene="pj-80"].s1 .p80-rx{stroke-dasharray:240;stroke-dashoffset:240;animation:p80draw 1s ease both}
[data-scene="pj-80"].s2 .p80-signal{stroke-dasharray:9 7;animation:p80flow 1.1s linear infinite}
[data-scene="pj-80"].s2 .p80-tv{transform-box:fill-box;transform-origin:center;animation:p80pop .55s ease both}
[data-scene="pj-80"].s2 .p80-screen{animation:p80pulse 2.4s ease-in-out infinite}
[data-scene="pj-80"].s2 .p80-chain{transform-box:fill-box;transform-origin:left center;animation:p80slide .5s ease both}
[data-scene="pj-80"].s3 .p80-cell{animation:p80pulse 2.6s ease-in-out infinite}
[data-scene="pj-80"].s3 .p80-cell2{animation-delay:.6s}
[data-scene="pj-80"].s3 .p80-link{stroke-dasharray:7 6;animation:p80flow 1.1s linear infinite}
[data-scene="pj-80"].s3 .p80-phone{transform-box:fill-box;transform-origin:center;animation:p80pop .5s ease both}
[data-scene="pj-80"].s3 .p80-phone2{animation-delay:.12s}
[data-scene="pj-80"].s3 .p80-phone3{animation-delay:.24s}
[data-scene="pj-80"].s3 .p80-wave{animation:p80pulse 1.8s ease-in-out infinite}
</style>
<defs>
  <linearGradient id="p80sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfdbfe"/><stop offset="1" stop-color="#eff6ff"/>
  </linearGradient>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">广播、电视和移动通信：信息怎样飞起来</text>

<!-- 第一步：无线电广播 -->
<g class="p80-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">无线电广播：话筒把声音变成电信号，调制后由天线发射</text>

  <rect x="34" y="104" width="832" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="p80-card">
    <rect x="35" y="130" width="126" height="150" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.8"/>
    <rect x="88" y="148" width="20" height="36" rx="10" fill="#475569"/>
    <path d="M84 172 A14 14 0 0 0 112 172" fill="none" stroke="#475569" stroke-width="2.5"/>
    <line x1="98" y1="186" x2="98" y2="196" stroke="#475569" stroke-width="2.5"/>
    <line x1="88" y1="196" x2="108" y2="196" stroke="#475569" stroke-width="2.5"/>
    <text x="98" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">话筒</text>
    <text x="98" y="244" font-size="11.5" fill="#475569" text-anchor="middle">声信号</text>
    <text x="98" y="261" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">→ 电信号</text>
  </g>

  <g class="p80-card p80-card2">
    <rect x="176" y="130" width="126" height="150" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.8"/>
    <rect x="220" y="152" width="38" height="30" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <path d="M225 167 Q231 157 237 167 T249 167" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="239" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">调制器</text>
    <text x="239" y="244" font-size="11.5" fill="#475569" text-anchor="middle">电信号加载到</text>
    <text x="239" y="261" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">高频电磁波</text>
  </g>

  <g class="p80-card p80-card3">
    <rect x="317" y="130" width="126" height="150" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.8"/>
    <line x1="380" y1="146" x2="380" y2="192" stroke="#475569" stroke-width="3"/>
    <line x1="380" y1="150" x2="366" y2="192" stroke="#475569" stroke-width="2"/>
    <line x1="380" y1="150" x2="394" y2="192" stroke="#475569" stroke-width="2"/>
    <line x1="370" y1="170" x2="390" y2="170" stroke="#475569" stroke-width="1.8"/>
    <line x1="367" y1="182" x2="393" y2="182" stroke="#475569" stroke-width="1.8"/>
    <circle cx="380" cy="146" r="4" fill="#dc2626"/>
    <path d="M390 156 A22 22 0 0 1 390 184" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M397 150 A30 30 0 0 1 397 190" fill="none" stroke="#3b82f6" stroke-width="2" opacity=".6"/>
    <text x="380" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">发射天线</text>
    <text x="380" y="244" font-size="11.5" fill="#475569" text-anchor="middle">向空间发射</text>
    <text x="380" y="261" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">无线电波</text>
  </g>

  <g class="p80-card p80-card4">
    <rect x="458" y="130" width="126" height="150" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
    <g fill="none" stroke="#1d4ed8" stroke-width="2.5">
      <path d="M500 158 A16 16 0 0 1 500 186"/>
      <path d="M510 150 A26 26 0 0 1 510 194"/>
      <path d="M520 142 A36 36 0 0 1 520 202"/>
    </g>
    <text x="521" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">无线电波</text>
    <text x="521" y="244" font-size="11.5" fill="#475569" text-anchor="middle">在空气中传播</text>
    <text x="521" y="261" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">速度等于光速</text>
  </g>

  <g class="p80-card p80-card5">
    <rect x="599" y="130" width="126" height="150" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.8"/>
    <rect x="638" y="156" width="42" height="30" rx="5" fill="#334155"/>
    <circle cx="650" cy="171" r="4" fill="#e2e8f0"/>
    <line x1="650" y1="171" x2="656" y2="179" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="672" y1="160" x2="682" y2="146" stroke="#334155" stroke-width="2"/>
    <text x="662" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">接收调谐</text>
    <text x="662" y="244" font-size="11.5" fill="#475569" text-anchor="middle">选出特定频率</text>
    <text x="662" y="261" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">再解调</text>
  </g>

  <g class="p80-card p80-card6">
    <rect x="740" y="130" width="126" height="150" rx="12" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.8"/>
    <polygon points="790,160 802,160 810,150 810,190 802,180 790,180" fill="#334155"/>
    <path d="M816 162 A18 18 0 0 1 816 178" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M823 154 A26 26 0 0 1 823 186" fill="none" stroke="#475569" stroke-width="2" opacity=".65"/>
    <text x="803" y="222" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">扬声器</text>
    <text x="803" y="244" font-size="11.5" fill="#475569" text-anchor="middle">电信号</text>
    <text x="803" y="261" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">→ 声音</text>
  </g>

  <g class="p80-arrow" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)">
    <line x1="163" y1="200" x2="172" y2="200"/>
    <line x1="304" y1="200" x2="313" y2="200"/>
    <line x1="445" y1="200" x2="454" y2="200"/>
    <line x1="586" y1="200" x2="595" y2="200"/>
    <line x1="727" y1="200" x2="736" y2="200"/>
  </g>

  <rect x="60" y="314" width="370" height="100" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="80" y="340" font-size="12.5" font-weight="800" fill="#1e40af">发射端</text>
  <text x="245" y="366" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">话筒 → 调制 → 天线</text>
  <text x="245" y="390" font-size="11.5" fill="#475569" text-anchor="middle">把声音信号加载到高频电磁波上</text>
  <rect x="470" y="314" width="370" height="100" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="490" y="340" font-size="12.5" font-weight="800" fill="#b45309">接收端</text>
  <text x="655" y="366" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">天线 → 调谐 → 解调 → 扬声器</text>
  <text x="655" y="390" font-size="11.5" fill="#7c5a30" text-anchor="middle">从电磁波中取出声音信号</text>
  <text x="450" y="448" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">无线电广播利用电磁波传递声音信号</text>
</g>

<!-- 第二步：电视 -->
<g class="p80-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电视：图像信号和声音信号一起加载到电磁波上发射</text>

  <rect x="34" y="104" width="832" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="80" y="150" width="96" height="54" rx="8" fill="#334155"/>
  <circle cx="184" cy="177" r="15" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="184" cy="177" r="7" fill="#60a5fa"/>
  <line x1="120" y1="204" x2="102" y2="238" stroke="#475569" stroke-width="3"/>
  <line x1="120" y1="204" x2="138" y2="238" stroke="#475569" stroke-width="3"/>
  <text x="128" y="258" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">摄像机</text>
  <text x="128" y="278" font-size="11.5" fill="#475569" text-anchor="middle">图像 → 电信号</text>

  <rect x="88" y="300" width="18" height="34" rx="9" fill="#475569"/>
  <path d="M84 318 A13 13 0 0 0 110 318" fill="none" stroke="#475569" stroke-width="2.2"/>
  <line x1="97" y1="334" x2="97" y2="342" stroke="#475569" stroke-width="2.2"/>
  <text x="142" y="312" font-size="12.5" font-weight="800" fill="#1e3a8a">话筒</text>
  <text x="142" y="332" font-size="11.5" fill="#475569">声音 → 电信号</text>

  <rect x="270" y="190" width="140" height="110" rx="12" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="340" y="216" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">发射机</text>
  <text x="340" y="242" font-size="11.5" fill="#334155" text-anchor="middle">图像信号</text>
  <text x="340" y="264" font-size="11.5" fill="#334155" text-anchor="middle">声音信号</text>
  <text x="340" y="286" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">加载到电磁波</text>
  <path d="M190 177 Q230 177 268 208" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <path d="M115 300 Q180 300 268 274" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <line x1="450" y1="160" x2="450" y2="330" stroke="#475569" stroke-width="4"/>
  <line x1="450" y1="166" x2="432" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="166" x2="468" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="438" y1="212" x2="462" y2="212" stroke="#475569" stroke-width="1.8"/>
  <line x1="434" y1="258" x2="466" y2="258" stroke="#475569" stroke-width="1.8"/>
  <line x1="430" y1="304" x2="470" y2="304" stroke="#475569" stroke-width="1.8"/>
  <circle cx="450" cy="160" r="5" fill="#dc2626"/>
  <text x="450" y="350" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">电视塔</text>

  <g class="p80-tv">
    <rect x="560" y="146" width="300" height="206" rx="14" fill="#1e293b"/>
    <rect x="578" y="164" width="264" height="142" rx="6" fill="url(#p80sky)"/>
    <g class="p80-screen">
      <circle cx="626" cy="198" r="18" fill="#fbbf24"/>
      <path d="M578 280 L636 230 L680 268 L724 226 L790 288 L842 252 L842 306 L578 306 Z" fill="#86efac"/>
      <path d="M578 292 L646 258 L700 292 L760 262 L842 300 L842 306 L578 306 Z" fill="#4ade80"/>
    </g>
    <g fill="#94a3b8">
      <rect x="800" y="318" width="6" height="16" rx="2"/>
      <rect x="812" y="318" width="6" height="16" rx="2"/>
      <rect x="824" y="318" width="6" height="16" rx="2"/>
    </g>
    <line x1="700" y1="352" x2="700" y2="368" stroke="#475569" stroke-width="4"/>
    <line x1="670" y1="368" x2="730" y2="368" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="710" y="392" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电视机</text>

  <path class="p80-signal" d="M462 168 Q512 166 556 198" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="505" y="156" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">图像信号</text>
  <path class="p80-signal" d="M462 232 Q512 250 556 272" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="505" y="226" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">声音信号</text>

  <text x="450" y="450" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电视用电磁波同时传递图像和声音，信息量比广播更大</text>
</g>

<!-- 第三步：手机与基地台 -->
<g class="p80-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">移动通信：手机既是发射台又是接收台，靠基地台转接</text>

  <rect x="34" y="104" width="832" height="330" rx="16" fill="#f8fbff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="54" y="118" width="246" height="30" rx="15" fill="#e8effc"/>
  <text x="177" y="138" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">手机 = 无线电发射台 + 接收台</text>
  <rect x="600" y="118" width="246" height="30" rx="15" fill="#fff7ed"/>
  <text x="723" y="138" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">基地台：负责转接与覆盖</text>

  <line x1="50" y1="394" x2="850" y2="394" stroke="#94a3b8" stroke-width="2.5"/>

  <ellipse class="p80-cell" cx="260" cy="360" rx="168" ry="72" fill="#dbeafe" opacity=".55" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>
  <ellipse class="p80-cell p80-cell2" cx="640" cy="360" rx="168" ry="72" fill="#dbeafe" opacity=".55" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 7"/>

  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="260" y1="180" x2="232" y2="394"/>
    <line x1="260" y1="180" x2="288" y2="394"/>
    <line x1="260" y1="180" x2="260" y2="394"/>
    <line x1="640" y1="180" x2="612" y2="394"/>
    <line x1="640" y1="180" x2="668" y2="394"/>
    <line x1="640" y1="180" x2="640" y2="394"/>
  </g>
  <g stroke="#64748b" stroke-width="1.6">
    <line x1="241" y1="240" x2="279" y2="240"/><line x1="236" y1="290" x2="284" y2="290"/><line x1="231" y1="340" x2="289" y2="340"/>
    <line x1="621" y1="240" x2="659" y2="240"/><line x1="616" y1="290" x2="664" y2="290"/><line x1="611" y1="340" x2="669" y2="340"/>
  </g>
  <g fill="#1e3a8a">
    <rect x="250" y="196" width="20" height="12" rx="2"/>
    <rect x="630" y="196" width="20" height="12" rx="2"/>
  </g>
  <circle cx="260" cy="180" r="5" fill="#dc2626"/>
  <circle cx="640" cy="180" r="5" fill="#dc2626"/>
  <g fill="none" stroke="#3b82f6" stroke-width="2" opacity=".7">
    <path class="p80-wave" d="M270 186 A20 20 0 0 1 270 214"/>
    <path class="p80-wave" d="M278 178 A30 30 0 0 1 278 222"/>
    <path class="p80-wave" d="M650 186 A20 20 0 0 1 650 214"/>
    <path class="p80-wave" d="M658 178 A30 30 0 0 1 658 222"/>
  </g>
  <text x="260" y="421" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">基地台</text>
  <text x="640" y="421" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">基地台</text>

  <g class="p80-link" stroke="#059669" stroke-width="2.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)">
    <line x1="292" y1="300" x2="608" y2="300"/>
  </g>
  <text x="450" y="290" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">基地台之间转接信号</text>

  <g class="p80-phone">
    <rect x="92" y="330" width="38" height="62" rx="7" fill="#1e293b"/>
    <rect x="97" y="336" width="28" height="44" rx="3" fill="#dbeafe"/>
    <circle cx="111" cy="386" r="2.5" fill="#94a3b8"/>
    <text x="111" y="412" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">手机</text>
  </g>
  <g class="p80-phone p80-phone2">
    <rect x="440" y="330" width="38" height="62" rx="7" fill="#1e293b"/>
    <rect x="445" y="336" width="28" height="44" rx="3" fill="#dbeafe"/>
    <circle cx="459" cy="386" r="2.5" fill="#94a3b8"/>
    <text x="459" y="412" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">手机</text>
  </g>
  <g class="p80-phone p80-phone3">
    <rect x="770" y="330" width="38" height="62" rx="7" fill="#1e293b"/>
    <rect x="775" y="336" width="28" height="44" rx="3" fill="#dbeafe"/>
    <circle cx="789" cy="386" r="2.5" fill="#94a3b8"/>
    <text x="789" y="412" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">手机</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)">
    <path d="M130 342 L226 320" fill="none"/>
    <path d="M478 342 L606 320" fill="none"/>
    <path d="M478 348 L294 330" fill="none" opacity=".45"/>
