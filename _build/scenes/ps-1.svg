<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="平抛运动：水平匀速、竖直自由落体与速度分解">
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="532" width="900" height="88" fill="url(#gBench)"/>
  <line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

  <text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">平抛运动：水平匀速 + 竖直自由落体</text>

  <!-- 抛出点 -->
  <g class="ps1-stand">
    <rect x="46" y="128" width="204" height="16" rx="4" fill="#94a3b8"/>
    <rect x="60" y="144" width="14" height="388" fill="#cbd5e1"/>
    <text x="140" y="170" font-size="13" font-weight="800" fill="#475569" text-anchor="end">抛出点 O</text>
    <text x="150" y="112" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">v₀</text>
  </g>
  <line x1="150" y1="128" x2="188" y2="128" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>

  <!-- 轨迹 -->
  <path class="ps1-path" d="M150 128 L200 130.8 L250 139.2 L300 153.3 L350 173.1 L400 198.5 L450 229.7 L500 266.5 L550 309 L600 357.3 L650 411.2 L700 470.8 L750 532"
    fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="7 6" opacity=".45"/>

  <!-- 第一步：水平方向匀速 -->
  <g class="ps1-h" data-zone="1">
    <g stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
      <line x1="150" y1="114" x2="196" y2="114"/>
      <line x1="270" y1="132" x2="316" y2="132"/>
      <line x1="390" y1="169" x2="436" y2="169"/>
      <line x1="510" y1="252" x2="556" y2="252"/>
      <line x1="630" y1="392" x2="676" y2="392"/>
      <line x1="750" y1="518" x2="796" y2="518"/>
    </g>
    <g fill="#b91c1c" font-size="13" font-weight="800">
      <text x="168" y="104" text-anchor="middle">v₀</text>
      <text x="288" y="122" text-anchor="middle">v₀</text>
      <text x="408" y="159" text-anchor="middle">v₀</text>
      <text x="528" y="242" text-anchor="middle">v₀</text>
      <text x="648" y="382" text-anchor="middle">v₀</text>
      <text x="768" y="508" text-anchor="middle">v₀</text>
    </g>
    <text x="740" y="98" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">水平方向：不受力，匀速直线运动</text>
  </g>

  <!-- 第二步：竖直方向自由落体 -->
  <g class="ps1-v" data-zone="2">
    <line x1="150" y1="128" x2="150" y2="532" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 6"/>
    <g stroke="#059669" stroke-width="1.8" stroke-dasharray="5 5">
      <line x1="150" y1="144.2" x2="270" y2="144.2"/>
      <line x1="150" y1="192.6" x2="390" y2="192.6"/>
      <line x1="150" y1="273.4" x2="510" y2="273.4"/>
      <line x1="150" y1="386.6" x2="630" y2="386.6"/>
    </g>
    <g fill="#059669">
      <circle cx="270" cy="144.2" r="5"/><circle cx="390" cy="192.6" r="5"/>
      <circle cx="510" cy="273.4" r="5"/><circle cx="630" cy="386.6" r="5"/>
      <circle cx="750" cy="532" r="5"/>
    </g>
    <g font-size="12" font-weight="800" fill="#047857" opacity="0">
      <text x="162" y="138">1</text>
      <text x="162" y="184">3</text>
      <text x="162" y="264">5</text>
      <text x="162" y="378">7</text>
      <text x="162" y="520">9</text>
    </g>
    <text x="740" y="98" font-size="13.5" font-weight="800" fill="#047857" text-anchor="middle">竖直方向：初速度为 0，自由落体</text>
    <text x="330" y="512" font-size="12.5" font-weight="700" fill="#047857">连续相等时间内的竖直位移比 1∶3∶5∶7∶9</text>
  </g>

  <!-- 小球运动 -->
  <g class="ps1-ball">
    <circle r="11" fill="#f97316" stroke="#c2410c" stroke-width="2">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M150 128 L200 130.8 L250 139.2 L300 153.3 L350 173.1 L400 198.5 L450 229.7 L500 266.5 L550 309 L600 357.3 L650 411.2 L700 470.8 L750 532"/>
    </circle>
  </g>

  <!-- 第三步：速度分解 -->
  <g class="ps1-decomp" data-zone="3">
    <circle cx="510" cy="273.4" r="6" fill="#334155"/>
    <line x1="510" y1="273.4" x2="602" y2="273.4" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <line x1="510" y1="273.4" x2="510" y2="371.4" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <line x1="510" y1="273.4" x2="602" y2="371.4" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <path d="M552 273.4 A42 42 0 0 1 539.7 309" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="560" y="300" font-size="14" font-weight="900" fill="#7c3aed">θ</text>
    <text x="556" y="260" font-size="13" font-weight="800" fill="#b91c1c">vx = v₀</text>
    <text x="522" y="352" font-size="13" font-weight="800" fill="#047857">vy = gt</text>
    <text x="590" y="380" font-size="13" font-weight="800" fill="#6d28d9">v</text>

    <g>
      <rect x="612" y="92" width="252" height="150" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
      <text x="738" y="118" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">合速度怎么求</text>
      <text x="738" y="148" font-size="13.5" fill="#334155" text-anchor="middle">vx = v₀（不变）</text>
      <text x="738" y="172" font-size="13.5" fill="#334155" text-anchor="middle">vy = gt（越来越大）</text>
      <text x="738" y="198" font-size="13.5" fill="#334155" text-anchor="middle">v = √(vx² + vy²)</text>
      <text x="738" y="224" font-size="13.5" fill="#334155" text-anchor="middle">tanθ = vy / vx</text>
    </g>
  </g>

  <text x="150" y="556" font-size="12" fill="#64748b">地面</text>
</svg>
