<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="向心加速度：方向指向圆心、大小与变加速运动">
<style>
[data-scene="ps-28"] .s28-step1,[data-scene="ps-28"] .s28-step2,[data-scene="ps-28"] .s28-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-28"].s1 .s28-step1,[data-scene="ps-28"].s2 .s28-step2,[data-scene="ps-28"].s3 .s28-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s28draw{to{stroke-dashoffset:0}}
@keyframes s28pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s28spin{to{transform:rotate(360deg)}}
@keyframes s28pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
[data-scene="ps-28"].s1 .s28-orbit{stroke-dasharray:920;stroke-dashoffset:920;animation:s28draw 1.3s ease forwards}
[data-scene="ps-28"].s1 .s28-a{animation:s28pulse 1.7s ease-in-out infinite}
[data-scene="ps-28"].s2 .s28-card,[data-scene="ps-28"].s3 .s28-card{transform-box:fill-box;transform-origin:center;animation:s28pop .45s ease both}
[data-scene="ps-28"].s3 .s28-spin{transform-box:view-box;transform-origin:270px 285px;animation:s28spin 7s linear infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="560" width="900" height="60" fill="url(#gBench)"/>
<line x1="0" y1="560" x2="900" y2="560" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">向心加速度：方向、大小与变加速</text>

<!-- 第一步：方向指向圆心 -->
<g class="s28-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">向心加速度的方向始终指向圆心，描述速度方向变化的快慢</text>

  <circle class="s28-orbit" cx="295" cy="320" r="145" fill="none" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="295" cy="320" r="5" fill="#334155"/>
  <text x="295" y="346" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">O</text>

  <g class="s28-a" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
    <line x1="440" y1="320" x2="400" y2="320"/>
    <line x1="295" y1="175" x2="295" y2="215"/>
    <line x1="150" y1="320" x2="190" y2="320"/>
    <line x1="295" y1="465" x2="295" y2="425"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)">
    <line x1="440" y1="320" x2="440" y2="252"/>
    <line x1="295" y1="175" x2="227" y2="175"/>
    <line x1="150" y1="320" x2="150" y2="388"/>
    <line x1="295" y1="465" x2="363" y2="465"/>
  </g>
  <text x="455" y="264" font-size="13" font-weight="800" fill="#1d4ed8">v</text>
  <text x="392" y="312" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="end">aₙ</text>
  <text x="295" y="515" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">aₙ 与 v 垂直，只改变速度方向，不改变速度大小</text>

  <g class="s28-card">
    <rect x="560" y="110" width="270" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="695" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">向心加速度 aₙ</text>
    <g font-size="13" fill="#334155">
      <text x="590" y="180">· 方向：始终指向圆心</text>
      <text x="590" y="212">· 描述速度方向变化快慢</text>
      <text x="590" y="244">· 与速度方向垂直</text>
      <text x="590" y="276">· 只改变方向，不改大小</text>
      <text x="590" y="308">· 方向时刻改变，是变量</text>
      <text x="590" y="340">· 与速度大小改变快慢无关</text>
    </g>
    <rect x="595" y="365" width="200" height="44" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="695" y="393" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">aₙ ⊥ v</text>
  </g>
</g>

<!-- 第二步：向心加速度的大小 -->
<g class="s28-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">向心加速度的大小，等于线速度平方除以半径</text>

  <g class="s28-card">
    <rect x="70" y="108" width="440" height="255" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="290" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">向心加速度公式</text>
    <text x="100" y="240" font-size="26" font-weight="900" font-style="italic" fill="#1e3a8a">aₙ</text>
    <text x="158" y="238" font-size="22" font-weight="800" fill="#334155">=</text>
    <text x="270" y="205" font-size="25" font-weight="900" fill="#1e3a8a" text-anchor="middle">v²</text>
    <line x1="230" y1="215" x2="310" y2="215" stroke="#334155" stroke-width="2.5"/>
    <text x="270" y="253" font-size="25" font-weight="900" fill="#1e3a8a" text-anchor="middle">r</text>
    <text x="330" y="240" font-size="21" font-weight="800" fill="#1e3a8a">= ω² r</text>
    <text x="290" y="300" font-size="17" font-weight="800" fill="#1e3a8a" text-anchor="middle">= 4π² r / T²</text>
    <text x="290" y="335" font-size="12.5" fill="#64748b" text-anchor="middle">只适用于匀速圆周运动</text>
  </g>

  <g class="s28-card">
    <rect x="530" y="108" width="300" height="255" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="680" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">由公式看关系</text>
    <g font-size="13.5" fill="#334155" text-anchor="middle">
      <text x="680" y="180">v 越大，aₙ 越大（v²）</text>
      <text x="680" y="214">r 越小，aₙ 越大</text>
      <text x="680" y="248">同轴转动 ω 相同，r 越大 aₙ 越大</text>
    </g>
    <rect x="565" y="275" width="230" height="46" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="680" y="304" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">v 加倍 → aₙ 变为 4 倍</text>
  </g>

  <rect x="70" y="390" width="760" height="130" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="420" font-size="13" font-weight="700" fill="#7c5a30" text-anchor="middle">例：自行车车轮半径 r = 0.35 m，轮缘线速度 v = 3.5 m/s</text>
  <text x="450" y="458" font-size="18" font-weight="900" fill="#b45309" text-anchor="middle">aₙ = v²/r = 3.5² ÷ 0.35 m/s² = 35 m/s²</text>
  <text x="450" y="490" font-size="12.5" fill="#7c5a30" text-anchor="middle">约为重力加速度的 3.6 倍，方向指向车轮中心</text>
</g>

<!-- 第三步：变加速运动 -->
<g class="s28-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">aₙ 大小不变、方向时刻改变，所以是变加速运动</text>

  <g class="s28-card">
    <rect x="70" y="108" width="400" height="280" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="270" y="138" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">加速度方向不断变化</text>
    <circle cx="270" cy="285" r="80" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="8 6"/>
    <circle cx="270" cy="285" r="4.5" fill="#334155"/>
    <text x="283" y="302" font-size="12" fill="#475569">O</text>
    <g class="s28-spin" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)">
      <line x1="270" y1="205" x2="270" y2="235"/>
      <line x1="350" y1="285" x2="320" y2="285"/>
      <line x1="270" y1="365" x2="270" y2="335"/>
      <line x1="190" y1="285" x2="220" y2="285"/>
    </g>
    <text x="326" y="272" font-size="13" font-weight="800" fill="#b91c1c">aₙ</text>
    <text x="270" y="378" font-size="11.5" fill="#475569" text-anchor="middle">方向始终沿半径指向圆心</text>
  </g>

  <g class="s28-card">
    <rect x="500" y="108" width="330" height="280" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="138" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">两种运动对比</text>
    <line x1="520" y1="180" x2="810" y2="180" stroke="#cbd5e1" stroke-width="1.5"/>
    <g font-size="11.5" font-weight="800" fill="#475569">
      <text x="525" y="166">比较项</text>
      <text x="625" y="166" text-anchor="middle">匀速圆周</text>
      <text x="762" y="166" text-anchor="middle">匀变速直线</text>
    </g>
    <g font-size="12.5" fill="#334155">
      <text x="525" y="210">速度大小</text><text x="625" y="210" text-anchor="middle">不变</text><text x="762" y="210" text-anchor="middle">改变</text>
      <text x="525" y="243">速度方向</text><text x="625" y="243" text-anchor="middle">时刻改变</text><text x="762" y="243" text-anchor="middle">不变</text>
      <text x="525" y="276">加速度大小</text><text x="625" y="276" text-anchor="middle">不变</text><text x="762" y="276" text-anchor="middle">不变</text>
      <text x="525" y="309">加速度方向</text><text x="625" y="309" text-anchor="middle" fill="#b91c1c" font-weight="800">时刻改变</text><text x="762" y="309" text-anchor="middle">不变</text>
      <text x="525" y="342">运动性质</text><text x="625" y="342" text-anchor="middle" fill="#b91c1c" font-weight="800">变加速</text><text x="762" y="342" text-anchor="middle">匀变速</text>
    </g>
  </g>

  <rect x="70" y="402" width="760" height="122" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="432" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">aₙ 的大小保持不变，但方向时刻指向圆心，始终在改变</text>
  <text x="450" y="466" font-size="13" fill="#334155" text-anchor="middle">加速度是矢量，方向变了加速度就变了</text>
  <text x="450" y="500" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">所以只能说向心加速度大小不变，不能说加速度不变</text>
</g>
</svg>
