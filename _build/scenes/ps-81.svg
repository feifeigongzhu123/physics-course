<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="双缝干涉实验：实验装置、条纹间距公式、测量光的波长">
<style>
[data-scene="ps-81"] .s81-s1,[data-scene="ps-81"] .s81-s2,[data-scene="ps-81"] .s81-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-81"].s1 .s81-s1,[data-scene="ps-81"].s2 .s81-s2,[data-scene="ps-81"].s3 .s81-s3{opacity:1;visibility:visible}
@keyframes s81draw{to{stroke-dashoffset:0}}
@keyframes s81flow{to{stroke-dashoffset:-36}}
@keyframes s81pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s81pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s81blink{0%,100%{opacity:1}50%{opacity:.35}}
[data-scene="ps-81"].s1 .s81-ray{stroke-dasharray:10 7;animation:s81flow 1.2s linear infinite}
[data-scene="ps-81"].s1 .s81-screen{transform-box:fill-box;transform-origin:center;animation:s81pop .6s ease .3s both}
[data-scene="ps-81"].s1 .s81-lamp{animation:s81pulse 2s ease-in-out infinite}
[data-scene="ps-81"].s2 .s81-band{transform-box:fill-box;transform-origin:center;animation:s81pop .5s ease both}
[data-scene="ps-81"].s2 .s81-band2{animation-delay:.08s}
[data-scene="ps-81"].s2 .s81-band3{animation-delay:.16s}
[data-scene="ps-81"].s2 .s81-bracket{opacity:0;animation:s81blink 1.8s ease-in-out .6s infinite}
[data-scene="ps-81"].s3 .s81-mark{animation:s81blink 1.8s ease-in-out infinite}
[data-scene="ps-81"].s3 .s81-mark2{animation-delay:.4s}
[data-scene="ps-81"].s3 .s81-step{transform-box:fill-box;transform-origin:center;animation:s81pop .5s ease both}
[data-scene="ps-81"].s3 .s81-step2{animation-delay:.12s}
[data-scene="ps-81"].s3 .s81-step3{animation-delay:.24s}
[data-scene="ps-81"].s3 .s81-step4{animation-delay:.36s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">双缝干涉实验：用条纹间距测波长</text>

<!-- 第一步：装置 -->
<g class="s81-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">光源 → 滤光片 → 单缝 → 双缝 → 屏：获得两列相干光</text>

  <rect x="36" y="100" width="828" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <line x1="70" y1="310" x2="800" y2="310" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g class="s81-lamp">
    <circle cx="80" cy="310" r="16" fill="#fde047" stroke="#d97706" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="80" y1="286" x2="80" y2="278"/>
      <line x1="80" y1="334" x2="80" y2="342"/>
      <line x1="56" y1="310" x2="48" y2="310"/>
      <line x1="104" y1="310" x2="112" y2="310"/>
    </g>
  </g>
  <text x="80" y="374" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">光源</text>

  <rect x="145" y="280" width="14" height="60" rx="3" fill="#93c5fd" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="152" y="374" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">滤光片</text>

  <rect x="205" y="280" width="10" height="22" fill="#475569"/>
  <rect x="205" y="338" width="10" height="22" fill="#475569"/>
  <text x="210" y="374" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">单缝</text>

  <rect x="270" y="280" width="10" height="18" fill="#475569"/>
  <rect x="270" y="306" width="10" height="12" fill="#475569"/>
  <rect x="270" y="326" width="10" height="14" fill="#475569"/>
  <text x="275" y="374" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">双缝</text>

  <line class="s81-ray" x1="96" y1="310" x2="145" y2="310" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrAmber)"/>
  <line class="s81-ray" x1="159" y1="310" x2="205" y2="310" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrAmber)"/>
  <line class="s81-ray" x1="215" y1="310" x2="270" y2="310" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrAmber)"/>

  <polygon points="276,302 780,238 780,400" fill="#93c5fd" opacity=".22"/>
  <polygon points="276,322 780,238 780,400" fill="#fbbf24" opacity=".18"/>

  <rect x="320" y="250" width="450" height="120" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="545" y="242" font-size="11" fill="#64748b" text-anchor="middle">遮光筒</text>

  <g class="s81-screen">
    <rect x="778" y="220" width="20" height="190" rx="3" fill="#1e293b"/>
    <g fill="#fbbf24">
      <rect x="780" y="230" width="16" height="12"/>
      <rect x="780" y="252" width="16" height="12"/>
      <rect x="780" y="274" width="16" height="12"/>
      <rect x="780" y="296" width="16" height="12"/>
      <rect x="780" y="318" width="16" height="12"/>
      <rect x="780" y="340" width="16" height="12"/>
      <rect x="780" y="362" width="16" height="12"/>
      <rect x="780" y="384" width="16" height="12"/>
    </g>
  </g>
  <text x="788" y="374" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">屏</text>
  <text x="788" y="210" font-size="11" fill="#64748b" text-anchor="middle">干涉条纹</text>

  <text x="450" y="418" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">单缝和双缝相互平行、与遮光筒共轴，保证两缝到屏的距离相等</text>
</g>

<!-- 第二步：条纹间距 -->
<g class="s81-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">相邻亮条纹中心的距离 Δx 与波长、双缝到屏的距离和双缝间距有关</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">屏上的干涉条纹</text>

  <rect x="90" y="160" width="410" height="220" fill="#1e293b"/>
  <g class="s81-band" fill="#fbbf24">
    <rect x="120" y="160" width="26" height="220"/>
    <rect x="180" y="160" width="26" height="220"/>
    <rect x="240" y="160" width="26" height="220"/>
    <rect x="300" y="160" width="26" height="220"/>
    <rect x="360" y="160" width="26" height="220"/>
    <rect x="420" y="160" width="26" height="220"/>
    <rect x="480" y="160" width="26" height="220"/>
  </g>
  <text x="133" y="152" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">亮纹</text>
  <text x="193" y="152" font-size="11" fill="#64748b" text-anchor="middle">暗纹</text>

  <g class="s81-bracket" stroke="#dc2626" stroke-width="2">
    <line x1="253" y1="396" x2="313" y2="396"/>
    <line x1="253" y1="388" x2="253" y2="404"/>
    <line x1="313" y1="388" x2="313" y2="404"/>
  </g>
  <text x="283" y="422" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">Δx</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">条纹间距公式</text>

  <rect x="596" y="158" width="248" height="66" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="192" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">Δx = Lλ / d</text>
  <text x="720" y="212" font-size="11" fill="#475569" text-anchor="middle">相邻亮纹中心之间的距离</text>

  <text x="600" y="254" font-size="11.5" font-weight="700" fill="#334155">L：双缝到屏的距离</text>
  <text x="600" y="280" font-size="11.5" font-weight="700" fill="#334155">d：双缝之间的距离</text>
  <text x="600" y="306" font-size="11.5" font-weight="700" fill="#334155">Δx：相邻亮纹的间距</text>
  <text x="600" y="332" font-size="11.5" font-weight="700" fill="#334155">λ：光的波长</text>

  <rect x="596" y="348" width="248" height="32" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="369" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">λ = dΔx / L</text>
  <text x="600" y="400" font-size="11" fill="#b91c1c">红光波长长 → Δx 大</text>
  <text x="600" y="420" font-size="11" fill="#7c3aed">紫光波长短 → Δx 小</text>
</g>

<!-- 第三步：测波长 -->
<g class="s81-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">测若干条亮纹的总间距，求出 Δx，再代入公式计算波长</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">测量条纹间距</text>

  <rect x="90" y="158" width="410" height="84" fill="#1e293b"/>
  <g fill="#fbbf24">
    <rect x="120" y="178" width="18" height="44"/>
    <rect x="160" y="178" width="18" height="44"/>
    <rect x="200" y="178" width="18" height="44"/>
    <rect x="240" y="178" width="18" height="44"/>
    <rect x="280" y="178" width="18" height="44"/>
    <rect x="320" y="178" width="18" height="44"/>
    <rect x="360" y="178" width="18" height="44"/>
    <rect x="400" y="178" width="18" height="44"/>
    <rect x="440" y="178" width="18" height="44"/>
  </g>

  <line class="s81-mark" x1="160" y1="150" x2="160" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line class="s81-mark s81-mark2" x1="400" y1="150" x2="400" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="160" y="146" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">x₁</text>
  <text x="400" y="146" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">xₙ</text>

  <line x1="80" y1="300" x2="510" y2="300" stroke="#475569" stroke-width="1.5"/>
  <g stroke="#475569" stroke-width="1.2">
    <line x1="100" y1="294" x2="100" y2="306"/>
    <line x1="130" y1="296" x2="130" y2="304"/>
    <line x1="160" y1="292" x2="160" y2="308"/>
    <line x1="190" y1="296" x2="190" y2="304"/>
    <line x1="220" y1="294" x2="220" y2="306"/>
    <line x1="250" y1="296" x2="250" y2="304"/>
    <line x1="280" y1="292" x2="280" y2="308"/>
    <line x1="310" y1="296" x2="310" y2="304"/>
    <line x1="340" y1="294" x2="340" y2="306"/>
    <line x1="370" y1="296" x2="370" y2="304"/>
    <line x1="400" y1="292" x2="400" y2="308"/>
    <line x1="430" y1="296" x2="430" y2="304"/>
    <line x1="460" y1="294" x2="460" y2="306"/>
    <line x1="490" y1="296" x2="490" y2="304"/>
  </g>
  <g class="s81-bracket" stroke="#1d4ed8" stroke-width="2">
    <line x1="160" y1="330" x2="400" y2="330"/>
    <line x1="160" y1="322" x2="160" y2="338"/>
    <line x1="400" y1="322" x2="400" y2="338"/>
  </g>
  <text x="280" y="352" font-size="12.5" font-weight="900" fill="#1e40af" text-anchor="middle">xₙ − x₁</text>

  <text x="280" y="388" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">Δx = (xₙ − x₁) / (n − 1)</text>
  <text x="280" y="414" font-size="11" fill="#64748b" text-anchor="middle">测 n 条亮纹的总间距，除以间隔数，可减小误差</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验步骤</text>

  <g class="s81-step">
    <circle cx="612" cy="174" r="12" fill="#dbeafe"/>
    <text x="612" y="179" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="634" y="179" font-size="11.5" font-weight="700" fill="#334155">安装单缝、双缝</text>
  </g>
  <g class="s81-step s81-step2">
    <circle cx="612" cy="216" r="12" fill="#dbeafe"/>
    <text x="612" y="221" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="634" y="221" font-size="11.5" font-weight="700" fill="#334155">调出清晰的干涉条纹</text>
  </g>
  <g class="s81-step s81-step3">
    <circle cx="612" cy="258" r="12" fill="#dbeafe"/>
    <text x="612" y="263" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="634" y="263" font-size="11.5" font-weight="700" fill="#334155">测多条亮纹的总间距</text>
  </g>
  <g class="s81-step s81-step4">
    <circle cx="612" cy="300" r="12" fill="#dbeafe"/>
    <text x="612" y="305" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
    <text x="634" y="305" font-size="11.5" font-weight="700" fill="#334155">代入 λ = dΔx / L 计算</text>
  </g>

  <rect x="596" y="326" width="248" height="58" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="348" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">多次测量求平均值</text>
  <text x="720" y="368" font-size="11" fill="#92400e" text-anchor="middle">各长度单位统一换算成米</text>
  <text x="720" y="404" font-size="11" fill="#64748b" text-anchor="middle">读数估读到分度值的下一位</text>
</g>

<rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">λ = dΔx / L：测出条纹间距、双缝间距和缝屏距离，就能求波长</text>
</svg>
