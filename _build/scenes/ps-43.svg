<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="静电的防止与利用：静电平衡、静电屏蔽、静电除尘喷涂与防静电">
<style>
[data-scene="ps-43"] .s43-step1,[data-scene="ps-43"] .s43-step2,[data-scene="ps-43"] .s43-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-43"].s1 .s43-step1,[data-scene="ps-43"].s2 .s43-step2,[data-scene="ps-43"].s3 .s43-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s43draw{to{stroke-dashoffset:0}}
@keyframes s43pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s43pulse{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="ps-43"].s1 .s43-fl{stroke-dasharray:120;stroke-dashoffset:120;animation:s43draw .7s ease .2s forwards}
[data-scene="ps-43"].s1 .s43-card{transform-box:fill-box;transform-origin:center;animation:s43pop .5s ease .25s both}
[data-scene="ps-43"].s1 .s43-zero{animation:s43pulse 1.8s ease-in-out infinite}
[data-scene="ps-43"].s2 .s43-fl{stroke-dasharray:90;stroke-dashoffset:90;animation:s43draw .7s ease .2s forwards}
[data-scene="ps-43"].s2 .s43-cage{transform-box:fill-box;transform-origin:center;animation:s43pop .55s ease .2s both}
[data-scene="ps-43"].s2 .s43-coax{transform-box:fill-box;transform-origin:center;animation:s43pop .55s ease .45s both}
[data-scene="ps-43"].s3 .s43-card{transform-box:fill-box;transform-origin:center;animation:s43pop .5s ease .15s both}
[data-scene="ps-43"].s3 .s43-card:nth-of-type(2){animation-delay:.28s}
[data-scene="ps-43"].s3 .s43-card:nth-of-type(3){animation-delay:.41s}
[data-scene="ps-43"].s3 .s43-spark{animation:s43pulse 1.6s ease-in-out infinite}
</style>

<defs>
  <pattern id="s43mesh" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M0 0 L16 16 M16 0 L0 16" stroke="#94a3b8" stroke-width="1.2"/>
  </pattern>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">静电的防止与利用：平衡、屏蔽与应用</text>

<!-- 第一步：静电平衡 -->
<g class="s43-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 静电平衡：导体内部场强为零</text>

  <text x="86" y="168" font-size="11.5" font-weight="800" fill="#1d4ed8">外电场</text>
  <g stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrBlue)">
    <line class="s43-fl" x1="70" y1="180" x2="548" y2="180"/>
    <line class="s43-fl" x1="70" y1="410" x2="548" y2="410"/>
    <line class="s43-fl" x1="70" y1="265" x2="174" y2="265"/>
    <line class="s43-fl" x1="70" y1="315" x2="174" y2="315"/>
    <line class="s43-fl" x1="450" y1="265" x2="554" y2="265"/>
    <line class="s43-fl" x1="450" y1="315" x2="554" y2="315"/>
  </g>

  <rect x="190" y="230" width="240" height="140" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <text x="310" y="206" font-size="12.5" font-weight="800" fill="#475569" text-anchor="middle">处于静电平衡的导体</text>

  <text x="198" y="272" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
  <text x="198" y="322" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
  <text x="422" y="272" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>
  <text x="422" y="322" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>

  <text class="s43-zero" x="310" y="308" font-size="22" font-weight="900" fill="#047857" text-anchor="middle">E内 = 0</text>
  <text x="310" y="336" font-size="11.5" fill="#475569" text-anchor="middle">导体内部处处无电场</text>

  <g class="s43-card">
    <rect x="580" y="110" width="250" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="705" y="144" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">静电平衡</text>
    <line x1="600" y1="160" x2="810" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="12">
      <text x="598" y="190">① 内部场强处处为零</text>
      <text x="598" y="218">② 净电荷分布在外表面</text>
      <text x="598" y="246">③ 表面电场线垂直于表面</text>
      <text x="598" y="274">④ 整个导体是等势体</text>
      <text x="598" y="302">⑤ 导体表面是等势面</text>
    </g>
    <line x1="600" y1="322" x2="810" y2="322" stroke="#e2e8f0" stroke-width="1.5"/>
    <g fill="#334155" font-size="11.5" text-anchor="middle">
      <text x="705" y="350">自由电子在电场力作用下</text>
      <text x="705" y="374">重新分布，直到内部</text>
      <text x="705" y="398">场强处处为零</text>
    </g>
    <text x="705" y="426" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">平衡过程极快</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">达到静电平衡后，导体内部场强为零，净电荷只分布在外表面</text>
</g>

<!-- 第二步：静电屏蔽 -->
<g class="s43-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 静电屏蔽：空腔导体使内部不受外电场影响</text>

  <text x="80" y="226" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">外部电场</text>
  <g stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)">
    <line class="s43-fl" x1="46" y1="254" x2="112" y2="254"/>
    <line class="s43-fl" x1="46" y1="305" x2="112" y2="305"/>
    <line class="s43-fl" x1="46" y1="356" x2="112" y2="356"/>
  </g>

  <g class="s43-cage">
    <rect x="120" y="210" width="200" height="190" rx="6" fill="url(#s43mesh)" stroke="#475569" stroke-width="3"/>
    <rect x="180" y="275" width="80" height="60" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <rect x="192" y="286" width="56" height="24" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="220" y="329" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">仪器</text>
    <text x="220" y="252" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">E内 = 0</text>
  </g>
  <text x="220" y="192" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">金属网罩（空腔导体）</text>
  <text x="220" y="428" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">内部无电场，仪器被保护</text>

  <g class="s43-coax">
    <circle cx="640" cy="300" r="72" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <circle cx="640" cy="300" r="52" fill="none" stroke="#94a3b8" stroke-width="10" stroke-dasharray="6 4"/>
    <circle cx="640" cy="300" r="13" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
    <line x1="728" y1="246" x2="694" y2="272" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="728" y1="324" x2="655" y2="305" stroke="#fca5a5" stroke-width="1.8"/>
  </g>
  <text x="640" y="200" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">屏蔽线缆</text>
  <text x="734" y="252" font-size="12.5" font-weight="800" fill="#475569">金属屏蔽层</text>
  <text x="734" y="330" font-size="12.5" font-weight="800" fill="#b91c1c">芯线（信号）</text>
  <text x="640" y="422" font-size="11.5" fill="#64748b" text-anchor="middle">外部电场被金属层挡在外面</text>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">空腔导体或金属网罩能把外部电场挡在外面，保护内部物体</text>
</g>

<!-- 第三步：应用 -->
<g class="s43-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 应用：利用静电与防止静电</text>

  <g class="s43-card">
    <rect x="70" y="118" width="240" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="190" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">静电除尘</text>
    <rect x="150" y="180" width="70" height="170" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <line x1="185" y1="190" x2="185" y2="340" stroke="#dc2626" stroke-width="2"/>
    <circle cx="166" cy="222" r="3.5" fill="#64748b"/>
    <circle cx="204" cy="258" r="3.5" fill="#64748b"/>
    <circle cx="170" cy="300" r="3.5" fill="#64748b"/>
    <line x1="228" y1="218" x2="190" y2="218" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="228" y1="308" x2="218" y2="308" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="232" y="222" font-size="11" fill="#475569">放电极</text>
    <text x="232" y="312" font-size="11" fill="#475569">集尘极</text>
    <text x="190" y="392" font-size="11.5" fill="#64748b" text-anchor="middle">带电烟尘被吸附到极板</text>
  </g>

  <g class="s43-card">
    <rect x="330" y="118" width="240" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">静电喷涂</text>
    <rect x="350" y="248" width="36" height="20" rx="4" fill="#334155"/>
    <rect x="505" y="195" width="40" height="150" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <g stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrBlue)">
      <line x1="388" y1="258" x2="498" y2="212"/>
      <line x1="388" y1="258" x2="498" y2="258"/>
      <line x1="388" y1="258" x2="498" y2="304"/>
    </g>
    <circle cx="438" cy="235" r="4" fill="#7c3aed"/>
    <circle cx="444" cy="258" r="4" fill="#7c3aed"/>
    <circle cx="438" cy="281" r="4" fill="#7c3aed"/>
    <text x="367" y="292" font-size="11" fill="#475569" text-anchor="middle">喷枪</text>
    <text x="525" y="372" font-size="11" fill="#1d4ed8" text-anchor="middle">工件</text>
    <text x="450" y="398" font-size="11.5" fill="#64748b" text-anchor="middle">涂料微粒带电，被工件吸引</text>
  </g>

  <g class="s43-card">
    <rect x="590" y="118" width="240" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="710" y="150" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">防止静电</text>
    <rect x="640" y="225" width="120" height="55" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="760" y="240" width="42" height="40" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <circle cx="668" cy="288" r="13" fill="#334155"/>
    <circle cx="748" cy="288" r="13" fill="#334155"/>
    <polyline points="640,280 620,310 620,350" fill="none" stroke="#059669" stroke-width="2.5"/>
    <g stroke="#059669" stroke-width="2.5">
      <line x1="600" y1="350" x2="640" y2="350"/>
      <line x1="606" y1="358" x2="634" y2="358"/>
      <line x1="612" y1="366" x2="628" y2="366"/>
    </g>
    <text class="s43-spark" x="700" y="215" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">油罐车</text>
    <text x="646" y="326" font-size="11" font-weight="800" fill="#047857">接地线</text>
    <text x="710" y="398" font-size="11.5" fill="#64748b" text-anchor="middle">导电轮胎、接地线导走电荷</text>
  </g>

  <rect x="70" y="440" width="760" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="464" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">利用静电：让带电微粒定向移动，完成除尘、喷涂、复印</text>
  <text x="450" y="488" font-size="11.5" fill="#1e3a8a" text-anchor="middle">防止静电：及时把积累的电荷导走，避免放电造成事故</text>
</g>
</svg>
