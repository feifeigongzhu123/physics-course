<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="练习使用多用电表：表盘与选择开关、三种测量、欧姆调零与读数">
<style>
[data-scene="ps-52"] .s52-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-52"].s1 .s52-step1,[data-scene="ps-52"].s2 .s52-step2,[data-scene="ps-52"].s3 .s52-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s52draw{to{stroke-dashoffset:0}}
@keyframes s52pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s52rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes s52pulse{0%,100%{opacity:.4}50%{opacity:1}}
[data-scene="ps-52"].s1 .s52-face{animation:s52rise .5s ease both}
[data-scene="ps-52"].s1 .s52-arc{stroke-dasharray:480;stroke-dashoffset:480;animation:s52draw 1s ease .1s both}
[data-scene="ps-52"].s1 .s52-needle{stroke-dasharray:170;stroke-dashoffset:170;animation:s52draw .6s ease .9s both}
[data-scene="ps-52"].s1 .s52-knob{transform-box:fill-box;transform-origin:center;animation:s52pop .5s ease .6s both}
[data-scene="ps-52"].s2 .s52-card{transform-box:fill-box;transform-origin:center;animation:s52pop .45s ease both}
[data-scene="ps-52"].s2 .s52-c1{animation-delay:.05s}
[data-scene="ps-52"].s2 .s52-c2{animation-delay:.17s}
[data-scene="ps-52"].s2 .s52-c3{animation-delay:.29s}
[data-scene="ps-52"].s3 .s52-zero{stroke-dasharray:200;stroke-dashoffset:200;animation:s52draw .8s ease .3s both}
[data-scene="ps-52"].s3 .s52-knob2{animation:s52pulse 1.6s ease-in-out infinite}
[data-scene="ps-52"].s3 .s52-tip{animation:s52rise .5s ease .6s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">多用电表：一只表，测电压、电流和电阻</text>

<!-- 第一步：表盘与选择开关 -->
<g class="s52-step s52-step1" data-zone="1">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 认识表盘和选择开关</text>

  <g class="s52-face">
    <rect x="46" y="100" width="452" height="414" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="120" width="404" height="236" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <path class="s52-arc" d="M125 340 A150 150 0 0 1 425 340" fill="none" stroke="#475569" stroke-width="2.5"/>
    <g stroke="#64748b" stroke-width="2">
      <line x1="125" y1="340" x2="143" y2="340"/>
      <line x1="136.4" y1="282.6" x2="153.0" y2="289.5"/>
      <line x1="168.9" y1="233.9" x2="181.7" y2="246.7"/>
      <line x1="217.6" y1="201.4" x2="224.5" y2="218.0"/>
      <line x1="275" y1="190" x2="275" y2="208"/>
      <line x1="332.4" y1="201.4" x2="325.5" y2="218.0"/>
      <line x1="381.1" y1="233.9" x2="368.3" y2="246.7"/>
      <line x1="413.6" y1="282.6" x2="397.0" y2="289.5"/>
      <line x1="425" y1="340" x2="407" y2="340"/>
    </g>
    <text x="129" y="326" font-size="13" font-weight="800" fill="#334155" text-anchor="start">∞</text>
    <text x="421" y="326" font-size="13" font-weight="800" fill="#334155" text-anchor="end">0</text>

    <line class="s52-needle" x1="275" y1="352" x2="337" y2="236" stroke="#dc2626" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="275" cy="352" r="9" fill="#334155"/>

    <circle cx="102" cy="196" r="11" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <line x1="95" y1="196" x2="109" y2="196" stroke="#64748b" stroke-width="2"/>
    <text x="102" y="176" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">机械调零</text>

    <circle cx="438" cy="196" r="13" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <line x1="438" y1="184" x2="438" y2="192" stroke="#b45309" stroke-width="2"/>
    <text x="438" y="174" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">欧姆调零</text>
  </g>

  <text x="300" y="386" font-size="11.5" fill="#64748b">外圈：电压、电流刻度，左端为 0</text>
  <text x="300" y="408" font-size="11.5" fill="#64748b">内圈：电阻刻度，右端为 0</text>

  <g class="s52-knob">
    <circle cx="250" cy="452" r="36" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="250" y1="452" x2="274" y2="428" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="412" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">Ω</text>
    <text x="198" y="456" font-size="12" font-weight="800" fill="#334155" text-anchor="end">V</text>
    <text x="302" y="456" font-size="12" font-weight="800" fill="#334155" text-anchor="start">mA</text>
    <text x="250" y="506" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">OFF</text>
    <text x="320" y="472" font-size="12" font-weight="700" fill="#64748b" text-anchor="start">选择开关</text>
  </g>

  <g>
    <rect x="516" y="100" width="338" height="124" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="532" y="128" font-size="13.5" font-weight="800" fill="#1e3a8a">使用前：三件事</text>
    <text x="532" y="154" font-size="12" fill="#334155">① 选择开关拨到对应挡位</text>
    <text x="532" y="180" font-size="12" fill="#334155">② 机械调零，指针指左端 0</text>
    <text x="532" y="206" font-size="12" fill="#334155">③ 红表笔插 +，黑表笔插 COM</text>
  </g>

  <g>
    <rect x="516" y="236" width="338" height="124" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="532" y="264" font-size="13.5" font-weight="800" fill="#1e3a8a">读数时</text>
    <text x="532" y="290" font-size="12" fill="#334155">视线正对表盘，避免斜视</text>
    <text x="532" y="316" font-size="12" fill="#334155">先看量程，再读最小分度</text>
    <text x="532" y="342" font-size="12" fill="#334155">欧姆挡读数要乘倍率</text>
  </g>

  <g>
    <rect x="516" y="372" width="338" height="128" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="532" y="400" font-size="13.5" font-weight="800" fill="#1e3a8a">表笔怎么接</text>
    <text x="532" y="426" font-size="12" fill="#334155">红表笔：+ 插孔（接高电势）</text>
    <text x="532" y="452" font-size="12" fill="#334155">黑表笔：COM 插孔</text>
    <text x="532" y="478" font-size="12" fill="#334155">欧姆挡：黑表笔接内部正极</text>
  </g>
</g>

<!-- 第二步：三种测量 -->
<g class="s52-step s52-step2" data-zone="2">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 电压、电流、电阻三种测法</text>

  <g class="s52-card s52-c1">
    <rect x="50" y="112" width="260" height="356" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="86" cy="144" r="16" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <text x="86" y="150" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="112" y="150" font-size="13.5" font-weight="800" fill="#1e3a8a">测电压（V 挡）</text>

    <path d="M100 300 V190 H170 M220 190 H290 V300 H186 M170 300 H100" fill="none" stroke="#334155" stroke-width="3"/>
    <rect x="170" y="180" width="50" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="195" y="172" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">R</text>
    <line x1="170" y1="286" x2="170" y2="314" stroke="#334155" stroke-width="3.5"/>
    <line x1="186" y1="293" x2="186" y2="307" stroke="#334155" stroke-width="3.5"/>
    <circle cx="195" cy="248" r="17" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="195" y="254" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">V</text>
    <path d="M178 248 H150 V190 M212 248 H240 V190" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>

    <line x1="70" y1="312" x2="290" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569">
      <text x="70" y="338">表笔并联在被测部分两端</text>
      <text x="70" y="364">红表笔接高电势端</text>
      <text x="70" y="390">量程要略大于估测值</text>
      <text x="70" y="416">不能带电切换挡位</text>
    </g>
  </g>

  <g class="s52-card s52-c2">
    <rect x="320" y="112" width="260" height="356" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="356" cy="144" r="16" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <text x="356" y="150" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="382" y="150" font-size="13.5" font-weight="800" fill="#1e3a8a">测电流（mA 挡）</text>

    <path d="M100 300 V250 M100 238 V190 H178 M212 190 H290 V300 H225 M175 300 H100" fill="none" stroke="#334155" stroke-width="3"/>
    <line x1="86" y1="238" x2="114" y2="238" stroke="#334155" stroke-width="3.5"/>
    <line x1="93" y1="246" x2="107" y2="246" stroke="#334155" stroke-width="3.5"/>
    <rect x="175" y="290" width="50" height="20" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <circle cx="195" cy="190" r="17" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="195" y="196" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">A</text>

    <line x1="340" y1="312" x2="560" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569">
      <text x="340" y="338">表笔串联接入电路</text>
      <text x="340" y="364">电流从红表笔流入</text>
      <text x="340" y="390">不能并联在电源两端</text>
      <text x="340" y="416">选 mA 挡并注意量程</text>
    </g>
  </g>

  <g class="s52-card s52-c3">
    <rect x="590" y="112" width="260" height="356" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="626" cy="144" r="16" fill="#e8effc" stroke="#1d4ed8" stroke-width="2"/>
    <text x="626" y="150" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="652" y="150" font-size="13.5" font-weight="800" fill="#1e3a8a">测电阻（Ω 挡）</text>

    <circle cx="720" cy="172" r="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="720" y="180" font-size="16" font-weight="900" fill="#1d4ed8" text-anchor="middle">Ω</text>
    <path d="M708 188 L688 222 M732 188 L752 222" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
    <rect x="665" y="222" width="110" height="38" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="720" y="247" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">R</text>
    <text x="720" y="292" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">先断开电源</text>

    <line x1="610" y1="312" x2="830" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
    <g font-size="11.5" fill="#475569">
      <text x="610" y="338">待测电阻要与电源断开</text>
      <text x="610" y="364">读数 = 表盘示数 × 倍率</text>
      <text x="610" y="390">换挡后必须重新调零</text>
      <text x="610" y="416">指针尽量指在中间附近</text>
    </g>
  </g>

  <rect x="50" y="484" width="800" height="40" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="509" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">口诀：测电压并联、测电流串联、测电阻断开；红表笔进、黑表笔出</text>
</g>

<!-- 第三步：欧姆调零与读数 -->
<g class="s52-step s52-step3" data-zone="3">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 欧姆调零与读数</text>

  <g>
    <rect x="50" y="112" width="390" height="232" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="62" y="140" font-size="13.5" font-weight="800" fill="#1e3a8a">欧姆调零：每次换挡都要做</text>

    <circle cx="120" cy="225" r="42" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="120" y="234" font-size="22" font-weight="900" fill="#1d4ed8" text-anchor="middle">Ω</text>
    <path class="s52-zero" d="M148 254 L238 286" fill="none" stroke="#dc2626" stroke-width="3"/>
    <path d="M96 252 L238 286" fill="none" stroke="#334155" stroke-width="3"/>
    <circle cx="238" cy="286" r="4" fill="#334155"/>
    <text x="170" y="268" font-size="11" font-weight="800" fill="#b91c1c">红</text>
    <text x="100" y="274" font-size="11" font-weight="800" fill="#334155">黑</text>

    <g class="s52-knob2">
      <circle cx="340" cy="188" r="26" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
      <line x1="340" y1="162" x2="340" y2="176" stroke="#b45309" stroke-width="3"/>
      <path d="M366 176 A28 28 0 0 1 362 206" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    </g>
    <text x="340" y="232" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">欧姆调零旋钮</text>
    <text x="245" y="320" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">短接两表笔 → 旋转旋钮 → 指针指右端 0</text>
  </g>

  <g>
    <rect x="460" y="112" width="390" height="232" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="472" y="140" font-size="13.5" font-weight="800" fill="#1e3a8a">读数：示数 × 倍率</text>
    <line x1="480" y1="212" x2="816" y2="212" stroke="#64748b" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="522" y1="212" x2="522" y2="222"/>
      <line x1="564" y1="212" x2="564" y2="222"/>
      <line x1="648" y1="212" x2="648" y2="222"/>
      <line x1="690" y1="212" x2="690" y2="222"/>
      <line x1="732" y1="212" x2="732" y2="222"/>
      <line x1="774" y1="212" x2="774" y2="222"/>
    </g>
    <polygon points="598,212 614,212 606,194" fill="#dc2626"/>
    <text x="480" y="238" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">∞</text>
    <text x="816" y="238" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">0</text>
    <text x="648" y="260" font-size="11" fill="#64748b" text-anchor="middle">电阻刻度</text>
    <text x="655" y="292" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">示例：示数 12.0，用 ×100 挡 → 1200 Ω</text>
    <text x="655" y="318" font-size="11.5" fill="#64748b" text-anchor="middle">指针落在中央 1/3 区域最准</text>
  </g>

  <g class="s52-tip">
    <rect x="50" y="356" width="390" height="58" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <circle cx="82" cy="385" r="14" fill="#e8effc"/>
    <text x="82" y="390" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="106" y="390" font-size="12" font-weight="700" fill="#334155">换挡后必须重新欧姆调零</text>

    <rect x="460" y="356" width="390" height="58" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <circle cx="492" cy="385" r="14" fill="#e8effc"/>
    <text x="492" y="390" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="516" y="390" font-size="12" font-weight="700" fill="#334155">偏转太大或太小就换挡</text>

    <rect x="50" y="424" width="390" height="58" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <circle cx="82" cy="453" r="14" fill="#e8effc"/>
    <text x="82" y="458" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="106" y="458" font-size="12" font-weight="700" fill="#334155">手不碰两表笔的金属部分</text>

    <rect x="460" y="424" width="390" height="58" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <circle cx="492" cy="453" r="14" fill="#e8effc"/>
    <text x="492" y="458" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">4</text>
    <text x="516" y="458" font-size="12" font-weight="700" fill="#334155">用完拨 OFF 或交流最高挡</text>
  </g>

  <rect x="50" y="496" width="800" height="32" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="450" y="517" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">欧姆挡内部有电源：黑表笔接内部正极，电流从黑表笔流出</text>
</g>
</svg>
