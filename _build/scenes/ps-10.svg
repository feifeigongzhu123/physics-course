<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="匀变速直线运动的位移与时间关系：位移公式、平均速度、连续相等时间位移差">
<style>
[data-scene="ps-10"] .s10-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-10"].s1 .s10-step1,[data-scene="ps-10"].s2 .s10-step2,[data-scene="ps-10"].s3 .s10-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s10draw{to{stroke-dashoffset:0}}
@keyframes s10grow{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
@keyframes s10area{0%{opacity:0}100%{opacity:.55}}
@keyframes s10pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes s10pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s10flow{to{stroke-dashoffset:-28}}
[data-scene="ps-10"].s1 .s10-line{stroke-dasharray:370;stroke-dashoffset:370;animation:s10draw 1.1s ease .1s both}
[data-scene="ps-10"].s1 .s10-area1{animation:s10area .6s ease .7s both}
[data-scene="ps-10"].s1 .s10-area2{animation:s10area .6s ease .95s both}
[data-scene="ps-10"].s1 .s10-card{animation:s10grow .5s ease .25s both}
[data-scene="ps-10"].s2 .s10-line{stroke-dasharray:380;stroke-dashoffset:380;animation:s10draw 1.1s ease .1s both}
[data-scene="ps-10"].s2 .s10-mid{opacity:0;animation:s10grow .5s ease .9s both}
[data-scene="ps-10"].s2 .s10-dot{animation:s10pulse 1.5s ease-in-out infinite}
[data-scene="ps-10"].s2 .s10-card{animation:s10grow .5s ease .25s both}
[data-scene="ps-10"].s3 .s10-band{animation:s10area .5s ease both}
[data-scene="ps-10"].s3 .s10-b1{animation-delay:.15s}
[data-scene="ps-10"].s3 .s10-b2{animation-delay:.45s}
[data-scene="ps-10"].s3 .s10-b3{animation-delay:.75s}
[data-scene="ps-10"].s3 .s10-dot{transform-box:fill-box;transform-origin:center;animation:s10pop .4s ease both}
[data-scene="ps-10"].s3 .s10-d2{animation-delay:.35s}
[data-scene="ps-10"].s3 .s10-d3{animation-delay:.65s}
[data-scene="ps-10"].s3 .s10-d4{animation-delay:.95s}
[data-scene="ps-10"].s3 .s10-card{transform-box:fill-box;transform-origin:center;animation:s10pop .5s ease 1.1s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">匀变速直线运动：位移与时间的关系</text>

<!-- 第一步：位移公式 -->
<g class="s10-step s10-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">位移 = v-t 图线与时间轴围成的面积</text>

  <line x1="115" y1="455" x2="462" y2="455" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="115" y1="455" x2="115" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="471" y="460" font-size="14" font-weight="800" fill="#475569">t</text>
  <text x="107" y="126" font-size="14" font-weight="800" fill="#475569" text-anchor="end">v</text>
  <text x="98" y="474" font-size="12" font-weight="700" fill="#64748b">O</text>

  <polygon class="s10-area1" points="115,355 410,355 410,455 115,455" fill="#fbbf24" opacity=".55"/>
  <polygon class="s10-area2" points="115,355 410,165 410,355" fill="#10b981" opacity=".55"/>
  <line class="s10-line" x1="115" y1="355" x2="410" y2="165" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="115" y1="355" x2="410" y2="355" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
  <line x1="410" y1="165" x2="410" y2="355" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>

  <text x="250" y="412" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">v₀t</text>
  <text x="347" y="292" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">½at²</text>
  <text x="90" y="352" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">v₀</text>
  <text x="285" y="500" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">图线下的面积就是位移 x</text>

  <g class="s10-card">
    <rect x="550" y="95" width="310" height="245" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="550" y="95" width="310" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="705" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">位移公式</text>
    <text x="705" y="178" font-size="23" font-weight="900" fill="#1d4ed8" text-anchor="middle">x = v₀t + ½at²</text>
    <line x1="572" y1="200" x2="838" y2="200" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="572" y="225" font-size="12.5" fill="#334155">v₀t：匀速部分的位移</text>
    <text x="572" y="250" font-size="12.5" fill="#334155">½at²：速度变化带来的位移</text>
    <text x="572" y="275" font-size="12.5" fill="#334155">x 是位移，不是路程</text>
    <text x="705" y="310" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">公式对加速、减速都适用</text>
  </g>

  <g class="s10-card">
    <rect x="550" y="362" width="310" height="118" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="705" y="389" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个常用特例</text>
    <text x="705" y="415" font-size="12.5" fill="#334155" text-anchor="middle">若 v₀ = 0，则 x = ½at²</text>
    <text x="705" y="440" font-size="12.5" fill="#334155" text-anchor="middle">若 a = 0，则 x = v₀t</text>
    <text x="705" y="465" font-size="11.5" fill="#64748b" text-anchor="middle">代入前先规定正方向，a 取正负</text>
  </g>
</g>

<!-- 第二步：平均速度 -->
<g class="s10-step s10-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">平均速度 = 初末速度的平均值 = 中间时刻的瞬时速度</text>

  <line x1="110" y1="455" x2="455" y2="455" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="455" x2="110" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="464" y="460" font-size="14" font-weight="800" fill="#475569">t</text>
  <text x="102" y="126" font-size="14" font-weight="800" fill="#475569" text-anchor="end">v</text>
  <text x="94" y="474" font-size="12" font-weight="700" fill="#64748b">O</text>

  <polygon points="110,360 410,180 410,455 110,455" fill="#dbeafe" opacity=".55"/>
  <line class="s10-line" x1="110" y1="360" x2="410" y2="180" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line class="s10-mid" x1="110" y1="270" x2="410" y2="270" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line class="s10-mid" x1="260" y1="270" x2="260" y2="455" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>

  <circle class="s10-dot" cx="260" cy="270" r="6.5" fill="#059669"/>
  <text x="98" y="364" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">v₀</text>
  <text x="420" y="184" font-size="13" font-weight="900" fill="#1e40af">v</text>
  <text x="98" y="274" font-size="12" font-weight="800" fill="#047857" text-anchor="end">v(t/2)</text>
  <text x="260" y="476" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">t/2</text>
  <text x="260" y="294" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">中位线长度 = (v₀ + v) / 2</text>

  <g class="s10-card">
    <rect x="550" y="95" width="310" height="250" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="550" y="95" width="310" height="7" rx="3.5" fill="#059669"/>
    <text x="705" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">平均速度</text>
    <text x="705" y="178" font-size="22" font-weight="900" fill="#047857" text-anchor="middle">v̄ = (v₀ + v) / 2</text>
    <line x1="572" y1="200" x2="838" y2="200" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="572" y="225" font-size="12.5" fill="#334155">只适用于匀变速直线运动</text>
    <text x="572" y="250" font-size="12.5" fill="#334155">等于中间时刻的瞬时速度</text>
    <text x="572" y="275" font-size="12.5" fill="#334155">即 v̄ = v(t/2)</text>
    <text x="705" y="310" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">例：v₀ = 2，v = 8，则 v̄ = 5 m/s</text>
    <text x="705" y="333" font-size="11.5" fill="#64748b" text-anchor="middle">非匀变速运动不能这样求</text>
  </g>

  <g class="s10-card">
    <rect x="550" y="367" width="310" height="113" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="705" y="394" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么成立</text>
    <text x="705" y="420" font-size="12" fill="#475569" text-anchor="middle">v-t 图线是直线，图线下的梯形</text>
    <text x="705" y="444" font-size="12" fill="#475569" text-anchor="middle">中位线等于上底与下底和的一半</text>
    <text x="705" y="468" font-size="11.5" fill="#64748b" text-anchor="middle">面积 = 中位线 × 时间</text>
  </g>
</g>

<!-- 第三步：连续相等时间的位移差 -->
<g class="s10-step s10-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">连续相等时间内的位移之差恒定：Δx = aT²</text>

  <line x1="80" y1="300" x2="820" y2="300" stroke="#94a3b8" stroke-width="2.5"/>
  <rect class="s10-band s10-b1" x="100" y="290" width="60" height="20" fill="#bfdbfe"/>
  <rect class="s10-band s10-b2" x="160" y="290" width="180" height="20" fill="#a7f3d0"/>
  <rect class="s10-band s10-b3" x="340" y="290" width="300" height="20" fill="#fde68a"/>

  <g class="s10-dot">
    <circle cx="100" cy="300" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <circle cx="160" cy="300" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  </g>
  <circle class="s10-dot s10-d2" cx="340" cy="300" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <circle class="s10-dot s10-d3" cx="640" cy="300" r="9" fill="#f97316" stroke="#c2410c" stroke-width="2"/>

  <g font-size="12" font-weight="800" fill="#475569" text-anchor="middle">
    <text x="100" y="336">0</text>
    <text x="160" y="336">T</text>
    <text x="340" y="336">2T</text>
    <text x="640" y="336">3T</text>
  </g>
  <g font-size="13" font-weight="900" text-anchor="middle">
    <text x="130" y="276" fill="#1d4ed8">1 m</text>
    <text x="250" y="276" fill="#047857">3 m</text>
    <text x="490" y="276" fill="#b45309">5 m</text>
  </g>

  <g stroke="#dc2626" stroke-width="1.8" fill="none">
    <path d="M100 360 L100 372 L160 372 L160 360"/>
    <path d="M160 360 L160 372 L340 372 L340 360"/>
    <path d="M340 360 L340 372 L640 372 L640 360"/>
  </g>
  <g font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">
    <text x="130" y="392">Δx = 2 m</text>
    <text x="250" y="392">Δx = 2 m</text>
    <text x="490" y="392">Δx = 2 m</text>
  </g>

  <text x="830" y="304" font-size="12" font-weight="800" fill="#475569" text-anchor="end">t</text>
  <text x="780" y="272" font-size="11.5" fill="#64748b" text-anchor="end">设 T = 1 s，a = 2 m/s²，v₀ = 0</text>

  <g class="s10-card">
    <rect x="70" y="412" width="760" height="102" rx="14" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="412" width="760" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="250" y="454" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">Δx = x₂ − x₁ = aT²</text>
    <text x="640" y="450" font-size="16" font-weight="900" fill="#047857" text-anchor="middle">a = Δx / T²</text>
    <text x="450" y="488" font-size="12" fill="#475569" text-anchor="middle">连续相等时间 T 内的位移之差是一个定值，可用来求加速度（逐差法的基础）</text>
  </g>
</g>
</svg>
