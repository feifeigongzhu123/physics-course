<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="安全用电：触电、不高于 36 V 的安全电压、先断电再救人">
<style>
.p72-s1,.p72-s2,.p72-s3{opacity:0;visibility:hidden}
.p72-s1{opacity:1;visibility:visible}
[data-scene="pj-72"] .p72-s1,[data-scene="pj-72"] .p72-s2,[data-scene="pj-72"] .p72-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-72"].s1 .p72-s1,[data-scene="pj-72"].s2 .p72-s2,[data-scene="pj-72"].s3 .p72-s3{opacity:1;visibility:visible}
@keyframes p72flow{to{stroke-dashoffset:-40}}
@keyframes p72pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p72pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p72blink{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="pj-72"].s1 .p72-current{stroke-dasharray:9 7;animation:p72flow 1.2s linear infinite}
[data-scene="pj-72"].s2 .p72-badge{transform-box:fill-box;transform-origin:center;animation:p72pop .6s ease both}
[data-scene="pj-72"].s2 .p72-mark{transform-box:fill-box;transform-origin:center;animation:p72pop .5s ease both}
[data-scene="pj-72"].s2 .p72-mark2{animation-delay:.15s}
[data-scene="pj-72"].s2 .p72-mark3{animation-delay:.3s}
[data-scene="pj-72"].s3 .p72-card{transform-box:fill-box;transform-origin:center;animation:p72pop .55s ease both}
[data-scene="pj-72"].s3 .p72-card2{animation-delay:.12s}
[data-scene="pj-72"].s3 .p72-card3{animation-delay:.24s}
[data-scene="pj-72"].s3 .p72-bolt{animation:p72blink 1.6s ease-in-out infinite}
[data-scene="pj-72"].s3 .p72-off{animation:p72pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">安全用电：触电、安全电压与救护原则</text>

<!-- 第一步：触电 -->
<g class="p72-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">人体是导体，人体成为闭合电路的一部分时，电流通过人体造成触电</text>

  <rect x="36" y="100" width="430" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#fee2e2"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">单线触电</text>

  <line x1="70" y1="160" x2="430" y2="160" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="82" y="150" font-size="11.5" font-weight="700" fill="#b91c1c">火线</text>

  <circle cx="250" cy="220" r="20" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <line x1="250" y1="240" x2="250" y2="320" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M250 262 L200 222 L195 168" fill="none" stroke="#334155" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M250 320 L218 380 M250 320 L282 380" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="195" cy="164" r="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>

  <path class="p72-current" d="M195 164 L200 222 L250 262 L250 320 L282 380" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="330" y="268" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">电流通过人体</text>
  <line x1="300" y1="274" x2="272" y2="286" stroke="#dc2626" stroke-width="1.5"/>

  <line x1="60" y1="380" x2="440" y2="380" stroke="#64748b" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="80" y1="380" x2="70" y2="392"/><line x1="120" y1="380" x2="110" y2="392"/>
    <line x1="160" y1="380" x2="150" y2="392"/><line x1="200" y1="380" x2="190" y2="392"/>
    <line x1="240" y1="380" x2="230" y2="392"/><line x1="280" y1="380" x2="270" y2="392"/>
    <line x1="320" y1="380" x2="310" y2="392"/><line x1="360" y1="380" x2="350" y2="392"/>
    <line x1="400" y1="380" x2="390" y2="392"/>
  </g>
  <text x="251" y="398" font-size="11" fill="#64748b" text-anchor="middle">电流经人体流入大地</text>

  <rect x="486" y="100" width="378" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="506" y="116" width="180" height="28" rx="14" fill="#fee2e2"/>
  <text x="596" y="135" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">双线触电</text>

  <line x1="500" y1="160" x2="850" y2="160" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="500" y1="200" x2="850" y2="200" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <text x="512" y="150" font-size="11.5" font-weight="700" fill="#b91c1c">火线</text>
  <text x="512" y="192" font-size="11.5" font-weight="700" fill="#1e40af">零线</text>

  <circle cx="675" cy="238" r="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <line x1="675" y1="256" x2="675" y2="316" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <path d="M675 276 L625 244 L620 164" fill="none" stroke="#334155" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M675 276 L725 244 L730 204" fill="none" stroke="#334155" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M675 316 L645 360 M675 316 L705 360" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <path class="p72-current" d="M620 164 L625 244 L675 276 L725 244 L730 204" fill="none" stroke="#dc2626" stroke-width="3"/>
  <line x1="500" y1="360" x2="850" y2="360" stroke="#64748b" stroke-width="3"/>

  <text x="675" y="384" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">同时接触火线和零线，电流从一只手流到另一只手</text>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">触电的实质：电流通过人体；电压越高，通过人体的电流越大，越危险</text>
</g>

<!-- 第二步：安全电压 -->
<g class="p72-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">对人体安全的电压不高于 36 V，家庭电路 220 V 远超安全电压</text>

  <rect x="60" y="110" width="780" height="190" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="140" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">安全电压：不高于 36 V</text>

  <rect x="100" y="210" width="120" height="16" rx="8" fill="#86efac"/>
  <rect x="220" y="210" width="260" height="16" fill="#fde047"/>
  <rect x="480" y="210" width="280" height="16" rx="8" fill="#fca5a5"/>

  <g class="p72-mark">
    <line x1="200" y1="204" x2="200" y2="232" stroke="#047857" stroke-width="2.5"/>
    <text x="200" y="196" font-size="12.5" font-weight="900" fill="#047857" text-anchor="middle">36 V</text>
    <text x="200" y="252" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">安全上限</text>
  </g>
  <g class="p72-mark p72-mark2">
    <line x1="440" y1="204" x2="440" y2="232" stroke="#b45309" stroke-width="2.5"/>
    <text x="440" y="196" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">220 V</text>
    <text x="440" y="252" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">家庭电路</text>
  </g>
  <g class="p72-mark p72-mark3">
    <line x1="700" y1="204" x2="700" y2="232" stroke="#b91c1c" stroke-width="2.5"/>
    <text x="700" y="196" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">高压</text>
    <text x="700" y="252" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">远高于安全电压</text>
  </g>

  <text x="450" y="282" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">电压越高，通过人体的电流越大，触电危险越大</text>

  <rect x="60" y="316" width="380" height="142" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="250" y="344" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">36 V 为什么安全</text>
  <text x="250" y="370" font-size="12" fill="#334155" text-anchor="middle">36 V 以下通过人体的电流很小</text>
  <text x="250" y="394" font-size="11.5" fill="#64748b" text-anchor="middle">一般不会造成严重伤害</text>
  <text x="250" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">潮湿环境安全电压更低</text>
  <text x="250" y="442" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">如 24 V、12 V</text>

  <rect x="440" y="316" width="400" height="142" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="640" y="344" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">家庭电路 220 V</text>
  <text x="640" y="370" font-size="12" fill="#334155" text-anchor="middle">远高于 36 V 的安全电压</text>
  <text x="640" y="394" font-size="11.5" fill="#64748b" text-anchor="middle">不要湿手触摸开关、插座</text>
  <text x="640" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">发现漏电要及时断电检修</text>
  <text x="640" y="442" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">不接触带电体，不靠近高压带电体</text>
</g>

<!-- 第三步：安全原则 -->
<g class="p72-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">不接触低压带电体，不靠近高压带电体；有人触电先断电再救人</text>

  <g class="p72-card">
    <rect x="36" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="56" y="116" width="120" height="28" rx="14" fill="#fee2e2"/>
    <text x="116" y="135" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">不接触</text>

    <rect x="126" y="160" width="80" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
    <circle cx="150" cy="190" r="6" fill="#1d4ed8"/>
    <circle cx="182" cy="190" r="6" fill="#dc2626"/>
    <rect x="86" y="206" width="44" height="28" rx="10" fill="#fcd5ce" stroke="#d6a29a" stroke-width="2"/>
    <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <line x1="158" y1="196" x2="174" y2="212"/>
      <line x1="174" y1="196" x2="158" y2="212"/>
    </g>

    <text x="166" y="286" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不接触低压带电体</text>
    <text x="166" y="312" font-size="11" fill="#475569" text-anchor="middle">不用湿手触摸开关、插座</text>
    <text x="166" y="336" font-size="11" fill="#475569" text-anchor="middle">不随意拆卸、安装电器</text>
    <text x="166" y="360" font-size="11" fill="#475569" text-anchor="middle">发现电线破损及时更换</text>
    <text x="166" y="386" font-size="11" fill="#64748b" text-anchor="middle">换灯泡前先断开开关</text>
  </g>

  <g class="p72-card p72-card2">
    <rect x="320" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="340" y="116" width="120" height="28" rx="14" fill="#fff7ed"/>
    <text x="400" y="135" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">不靠近</text>

    <g stroke="#64748b" stroke-width="3" fill="none">
      <line x1="450" y1="158" x2="450" y2="250"/>
      <line x1="424" y1="250" x2="476" y2="250"/>
      <line x1="432" y1="250" x2="446" y2="180"/>
      <line x1="468" y1="250" x2="454" y2="180"/>
      <line x1="430" y1="200" x2="470" y2="200"/>
      <line x1="438" y1="222" x2="462" y2="222"/>
    </g>
    <path class="p72-bolt" d="M452 170 l-10 22 h9 l-6 22" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>

    <line x1="382" y1="272" x2="518" y2="272" stroke="#b91c1c" stroke-width="2"/>
    <polygon points="382,272 392,267 392,277" fill="#b91c1c"/>
    <polygon points="518,272 508,267 508,277" fill="#b91c1c"/>
    <text x="450" y="266" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">保持安全距离</text>

    <text x="450" y="308" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不靠近高压带电体</text>
    <text x="450" y="334" font-size="11" fill="#475569" text-anchor="middle">高压线落地要远离</text>
    <text x="450" y="358" font-size="11" fill="#475569" text-anchor="middle">不爬电杆、不爬变压器台</text>
    <text x="450" y="382" font-size="11" fill="#475569" text-anchor="middle">不在高压线下钓鱼、放风筝</text>
  </g>

  <g class="p72-card p72-card3">
    <rect x="604" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="624" y="116" width="120" height="28" rx="14" fill="#e6f7f1"/>
    <text x="684" y="135" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">先断电</text>

    <circle cx="660" cy="190" r="5" fill="#334155"/>
    <circle cx="740" cy="190" r="5" fill="#334155"/>
    <line x1="660" y1="190" x2="724" y2="170" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <line x1="660" y1="190" x2="640" y2="190" stroke="#334155" stroke-width="4"/>
    <line x1="760" y1="190" x2="740" y2="190" stroke="#334155" stroke-width="4"/>
    <text class="p72-off" x="700" y="160" font-size="12" font-weight="900" fill="#047857" text-anchor="middle">OFF</text>

    <g stroke="#dc2626" stroke-width="2.5" fill="none">
      <line x1="700" y1="206" x2="700" y2="238"/>
      <polygon points="700,244 693,232 707,232" fill="#dc2626" stroke="none"/>
    </g>

    <text x="734" y="276" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">先断电，再救人</text>
    <text x="734" y="302" font-size="11" fill="#475569" text-anchor="middle">拉闸断电或用绝缘物挑开电线</text>
    <text x="734" y="326" font-size="11" fill="#475569" text-anchor="middle">不要直接用手拉触电者</text>
    <text x="734" y="352" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">切断电源后再施救</text>
    <text x="734" y="380" font-size="11" fill="#475569" text-anchor="middle">发生火灾先断电再灭火</text>
  </g>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">安全用电原则：不接触低压带电体，不靠近高压带电体</text>
</g>
</svg>
