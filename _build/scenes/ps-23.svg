<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="曲线运动：速度沿轨迹切线、合力指向凹侧、曲线运动的条件">
<style>
[data-scene="ps-23"] .s23-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-23"].s1 .s23-step1,[data-scene="ps-23"].s2 .s23-step2,[data-scene="ps-23"].s3 .s23-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s23pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s23draw{to{stroke-dashoffset:0}}
@keyframes s23pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s23grow{from{opacity:0}to{opacity:1}}
[data-scene="ps-23"].s1 .s23-track{stroke-dasharray:900;stroke-dashoffset:900;animation:s23draw 1.2s ease .1s both}
[data-scene="ps-23"].s1 .s23-v{animation:s23grow .5s ease .7s both}
[data-scene="ps-23"].s2 .s23-force{animation:s23pop .5s ease .3s both}
[data-scene="ps-23"].s2 .s23-bend{animation:s23pulse 1.6s ease-in-out infinite}
[data-scene="ps-23"].s3 .s23-obj{transform-box:fill-box;transform-origin:center;animation:s23pop .5s ease .2s both}
[data-scene="ps-23"].s3 .s23-card{animation:s23grow .5s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">曲线运动：速度沿切线，合力指向凹侧</text>

<!-- 第一步：速度沿切线 -->
<g class="s23-step s23-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">速度方向：沿轨迹在该点的切线方向</text>

  <path class="s23-track" d="M93 370 A380 380 0 0 1 640 171" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <line x1="93" y1="370" x2="260" y2="171" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="152" y="266" font-size="11.5" fill="#64748b">割线 AB</text>

  <g class="s23-v" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)">
    <line x1="93" y1="370" x2="120" y2="295"/>
    <line x1="260" y1="171" x2="329" y2="131"/>
    <line x1="516" y1="126" x2="595" y2="140"/>
    <line x1="640" y1="171" x2="680" y2="240"/>
  </g>
  <g fill="#b91c1c" font-size="13" font-weight="900">
    <text x="86" y="288" text-anchor="end">vA</text>
    <text x="337" y="124" text-anchor="middle">vB</text>
    <text x="604" y="132">vC</text>
    <text x="690" y="256">vD</text>
  </g>
  <g fill="#334155">
    <circle cx="93" cy="370" r="5.5"/>
    <circle cx="260" cy="171" r="5.5"/>
    <circle cx="516" cy="126" r="5.5"/>
    <circle cx="640" cy="171" r="5.5"/>
  </g>
  <g font-size="12" font-weight="800" fill="#334155">
    <text x="82" y="392">A</text>
    <text x="248" y="162" text-anchor="end">B</text>
    <text x="520" y="116">C</text>
    <text x="650" y="164">D</text>
  </g>

  <text x="450" y="252" font-size="12" fill="#64748b" text-anchor="middle">时间间隔取得越小，割线越接近切线</text>

  <rect x="70" y="398" width="330" height="86" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="235" y="424" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">某点的速度沿切线</text>
  <text x="235" y="448" font-size="11.5" fill="#475569" text-anchor="middle">转伞时水滴沿切线飞出</text>
  <text x="235" y="470" font-size="11.5" fill="#475569" text-anchor="middle">不同位置速度方向不同</text>

  <rect x="430" y="398" width="440" height="86" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="650" y="424" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">速度方向不断改变，所以曲线运动一定是变速运动</text>
  <text x="650" y="448" font-size="11.5" fill="#475569" text-anchor="middle">速度大小可以不变，但方向时刻在变</text>
  <text x="650" y="470" font-size="11.5" fill="#475569" text-anchor="middle">例如匀速圆周运动：速率不变、方向时刻改变</text>
</g>

<!-- 第二步：合力指向凹侧 -->
<g class="s23-step s23-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">合外力方向：总是指向轨迹弯曲的凹侧</text>

  <path d="M93 370 A380 380 0 0 1 640 171" fill="none" stroke="#1d4ed8" stroke-width="4" opacity=".35"/>
  <text x="430" y="316" font-size="13" font-weight="800" fill="#64748b" text-anchor="middle">凹侧</text>
  <text x="430" y="338" font-size="11.5" fill="#94a3b8" text-anchor="middle">轨迹向受力的一侧弯曲</text>

  <g class="s23-force" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)">
    <line x1="93" y1="370" x2="187" y2="404"/>
    <line x1="260" y1="171" x2="310" y2="258"/>
    <line x1="516" y1="126" x2="503" y2="225"/>
    <line x1="640" y1="171" x2="590" y2="258"/>
  </g>
  <g fill="#b91c1c" font-size="13" font-weight="900">
    <text x="180" y="390" text-anchor="end">F</text>
    <text x="318" y="278">F</text>
    <text x="486" y="240" text-anchor="end">F</text>
    <text x="582" y="278" text-anchor="end">F</text>
  </g>

  <line x1="260" y1="171" x2="329" y2="131" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="337" y="124" font-size="13" font-weight="900" fill="#6d28d9">v</text>
  <path d="M286 196 A36 36 0 0 1 301 152" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="302" y="200" font-size="12" font-weight="900" fill="#6d28d9">θ</text>
  <text x="350" y="176" font-size="12" font-weight="800" fill="#6d28d9">F 与 v 不共线</text>

  <rect x="70" y="406" width="360" height="78" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="250" y="430" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">合力指向凹侧，轨迹向合力一侧弯</text>
  <text x="250" y="452" font-size="11.5" fill="#475569" text-anchor="middle">加速度方向与合力方向相同</text>
  <text x="250" y="474" font-size="11.5" fill="#475569" text-anchor="middle">速度方向沿切线、不断改变</text>

  <rect x="456" y="384" width="414" height="108" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="663" y="408" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">对照：如果 F 与 v 在同一直线上</text>
  <line x1="500" y1="446" x2="760" y2="446" stroke="#64748b" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="492" y="452" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="end">v</text>
  <line x1="520" y1="466" x2="700" y2="466" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="512" y="472" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="end">F</text>
  <text x="782" y="452" font-size="11.5" font-weight="800" fill="#1e3a8a">F 与 v 同向：</text>
  <text x="790" y="472" font-size="11.5" fill="#475569">直线加速</text>
  <text x="663" y="484" font-size="11" fill="#64748b" text-anchor="middle">合力与速度共线时，物体做直线运动，不会转弯</text>
</g>

<!-- 第三步：曲线运动的条件 -->
<g class="s23-step s23-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">产生条件：合外力方向与速度方向不在同一直线上</text>

  <g class="s23-obj">
    <circle cx="230" cy="300" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
    <text x="230" y="306" font-size="12" font-weight="900" fill="#7c2d12" text-anchor="middle">m</text>
  </g>
  <line x1="246" y1="300" x2="502" y2="300" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrBlue)"/>
  <text x="516" y="306" font-size="15" font-weight="900" fill="#6d28d9">v</text>
  <line x1="230" y1="300" x2="392" y2="188" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="404" y="184" font-size="15" font-weight="900" fill="#b91c1c">F</text>
  <path d="M276 300 A46 46 0 0 0 264 268" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="280" y="278" font-size="13" font-weight="900" fill="#6d28d9">θ</text>

  <path d="M230 300 C400 300 570 250 780 150" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="8 7" opacity=".8"/>
  <text x="754" y="132" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">轨迹向 F 一侧弯曲</text>
  <circle cx="780" cy="150" r="5" fill="#1d4ed8"/>

  <rect class="s23-card" x="55" y="344" width="246" height="126" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="178" y="374" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">F 与 v 共线</text>
  <line x1="100" y1="400" x2="240" y2="400" stroke="#64748b" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="178" y="426" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">直线运动</text>
  <text x="178" y="448" font-size="11.5" fill="#475569" text-anchor="middle">同向加速，反向减速</text>

  <rect class="s23-card" x="327" y="344" width="246" height="126" rx="13" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="374" font-size="13.5" font-weight="900" fill="#b45309" text-anchor="middle">F 与 v 不共线</text>
  <path d="M376 414 Q430 392 500 406" fill="none" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <line x1="380" y1="414" x2="440" y2="414" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="450" y="430" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">曲线运动</text>
  <text x="450" y="452" font-size="11.5" fill="#7c5a30" text-anchor="middle">轨迹夹在 v 与 F 之间</text>

  <rect class="s23-card" x="599" y="344" width="246" height="126" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="722" y="374" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">曲线运动一定是变速运动</text>
  <text x="722" y="400" font-size="12" fill="#334155" text-anchor="middle">速度方向时刻在改变</text>
  <text x="722" y="424" font-size="12" fill="#334155" text-anchor="middle">速度大小可以不变</text>
  <text x="722" y="450" font-size="11.5" fill="#64748b" text-anchor="middle">如匀速圆周运动</text>
  <text x="722" y="466" font-size="11" fill="#64748b" text-anchor="middle">合力不为零，速度也不为零</text>
</g>
</svg>
