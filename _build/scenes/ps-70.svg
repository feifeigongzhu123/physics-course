<svg class="s70-root" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="单摆：单摆模型、周期公式与等时性">
<style>
[data-scene="ps-70"] .s70-s1,[data-scene="ps-70"] .s70-s2,[data-scene="ps-70"] .s70-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-70"].s1 .s70-s1,[data-scene="ps-70"].s2 .s70-s2,[data-scene="ps-70"].s3 .s70-s3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s70fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s70pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s70draw{to{stroke-dashoffset:0}}
@keyframes s70swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes s70swingA{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes s70swingB{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes s70pulse{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="ps-70"].s1 .s70-arc{stroke-dasharray:120;stroke-dashoffset:120;animation:s70draw 1s ease .3s forwards}
[data-scene="ps-70"].s1 .s70-arrow{stroke-dasharray:80;stroke-dashoffset:80;animation:s70draw .55s ease .6s forwards}
[data-scene="ps-70"].s1 .s70-pop{transform-box:fill-box;transform-origin:center;animation:s70pop .5s ease .2s both}
[data-scene="ps-70"].s1 .s70-f{animation:s70pulse 1.7s ease-in-out infinite}
[data-scene="ps-70"].s2 .s70-pend{transform-box:view-box;transform-origin:260px 140px;animation:s70swing 3.2s ease-in-out infinite}
[data-scene="ps-70"].s2 .s70-pop{transform-box:fill-box;transform-origin:center;animation:s70pop .5s ease .2s both}
[data-scene="ps-70"].s2 .s70-card{transform-box:fill-box;transform-origin:center;animation:s70pop .45s ease both}
[data-scene="ps-70"].s2 .s70-c2{animation-delay:.12s}
[data-scene="ps-70"].s2 .s70-c3{animation-delay:.24s}
[data-scene="ps-70"].s3 .s70-pend1{transform-box:view-box;transform-origin:170px 150px;animation:s70swingA 3.4s ease-in-out infinite}
[data-scene="ps-70"].s3 .s70-pend2{transform-box:view-box;transform-origin:400px 150px;animation:s70swingB 3.4s ease-in-out infinite}
[data-scene="ps-70"].s3 .s70-arc{stroke-dasharray:180;stroke-dashoffset:180;animation:s70draw 1.1s ease .3s forwards}
[data-scene="ps-70"].s3 .s70-arc2{animation-delay:.5s}
[data-scene="ps-70"].s3 .s70-box{transform-box:fill-box;transform-origin:center;animation:s70pop .45s ease both}
[data-scene="ps-70"].s3 .s70-b2{animation-delay:.12s}
[data-scene="ps-70"].s3 .s70-b3{animation-delay:.24s}
[data-scene="ps-70"].s3 .s70-same{animation:s70pulse 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">单摆：小角度下的简谐运动</text>

<!-- 第一步：单摆模型 -->
<g class="s70-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">单摆模型：细线 + 小球，摆角很小时可看作简谐运动</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">单摆的组成</text>

  <line x1="70" y1="144" x2="510" y2="144" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="90" y1="144" x2="76" y2="156"/>
    <line x1="130" y1="144" x2="116" y2="156"/>
    <line x1="170" y1="144" x2="156" y2="156"/>
    <line x1="210" y1="144" x2="196" y2="156"/>
    <line x1="250" y1="144" x2="236" y2="156"/>
    <line x1="290" y1="144" x2="276" y2="156"/>
    <line x1="330" y1="144" x2="316" y2="156"/>
    <line x1="370" y1="144" x2="356" y2="156"/>
    <line x1="410" y1="144" x2="396" y2="156"/>
    <line x1="450" y1="144" x2="436" y2="156"/>
    <line x1="490" y1="144" x2="476" y2="156"/>
  </g>
  <circle cx="290" cy="144" r="5" fill="#334155"/>

  <line x1="290" y1="144" x2="362" y2="337" stroke="#475569" stroke-width="2.5"/>
  <path class="s70-arc" d="M290 350 A210 210 0 0 0 362 337" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="290" y1="144" x2="290" y2="360" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <path d="M290 190 A50 50 0 0 0 307 187" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="308" y="184" font-size="13" font-weight="900" fill="#1e40af">θ</text>
  <text x="338" y="238" font-size="13" font-weight="900" fill="#475569">L</text>

  <g class="s70-pop">
    <circle cx="362" cy="337" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="356" cy="331" r="4" fill="#fde68a"/>
  </g>

  <line class="s70-arrow" x1="362" y1="353" x2="362" y2="404" stroke="#334155" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="372" y="388" font-size="12" font-weight="800" fill="#334155">mg</text>
  <line class="s70-arrow" x1="362" y1="337" x2="337" y2="350" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="314" y="372" font-size="12" font-weight="900" fill="#6d28d9">F</text>
  <line class="s70-f" x1="362" y1="337" x2="350" y2="304" stroke="#059669" stroke-width="2.5" marker-end="url(#arrGreen)"/>
  <text x="330" y="304" font-size="11.5" font-weight="800" fill="#047857">FT</text>

  <text x="296" y="422" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="middle">回复力是重力沿切线方向的分力 mg sinθ</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">单摆模型的条件</text>

  <circle cx="606" cy="174" r="11" fill="#dbeafe"/>
  <text x="606" y="178" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="628" y="178" font-size="12" font-weight="700" fill="#334155">细线不可伸长、质量不计</text>

  <circle cx="606" cy="218" r="11" fill="#dbeafe"/>
  <text x="606" y="222" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="628" y="222" font-size="12" font-weight="700" fill="#334155">球直径远小于线长</text>

  <circle cx="606" cy="262" r="11" fill="#dbeafe"/>
  <text x="606" y="266" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="628" y="266" font-size="12" font-weight="700" fill="#334155">摆角很小（小于 5°）</text>

  <rect x="596" y="290" width="248" height="68" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="720" y="318" font-size="14" font-weight="900" fill="#6d28d9" text-anchor="middle">F = −mg sinθ</text>
  <text x="720" y="342" font-size="11.5" fill="#5b21b6" text-anchor="middle">负号表示力指向平衡位置</text>

  <text x="720" y="392" font-size="11.5" fill="#334155" text-anchor="middle">小角度时 sinθ ≈ θ</text>
  <text x="720" y="414" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F ≈ −(mg/L)x，符合 F = −kx</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">单摆做简谐运动的条件：摆角很小，回复力与位移近似成正比</text>
</g>

<!-- 第二步：单摆的周期 -->
<g class="s70-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">单摆的周期：只与摆长 L 和重力加速度 g 有关</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">摆长是悬点到摆球球心的距离</text>

  <line x1="120" y1="144" x2="420" y2="144" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="140" y1="144" x2="128" y2="156"/>
    <line x1="180" y1="144" x2="168" y2="156"/>
    <line x1="220" y1="144" x2="208" y2="156"/>
    <line x1="260" y1="144" x2="248" y2="156"/>
    <line x1="300" y1="144" x2="288" y2="156"/>
    <line x1="340" y1="144" x2="328" y2="156"/>
    <line x1="380" y1="144" x2="368" y2="156"/>
  </g>
  <circle cx="260" cy="144" r="5" fill="#334155"/>

  <g class="s70-pend">
    <line x1="260" y1="144" x2="260" y2="334" stroke="#475569" stroke-width="2.5"/>
    <circle cx="260" cy="350" r="16" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
    <circle cx="254" cy="344" r="4" fill="#fde68a"/>
  </g>

  <line x1="210" y1="144" x2="210" y2="334" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="204" y1="144" x2="216" y2="144" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="204" y1="334" x2="216" y2="334" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="196" y="246" font-size="12.5" font-weight="900" fill="#1e40af" text-anchor="end">l</text>

  <line x1="310" y1="334" x2="310" y2="350" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="304" y1="334" x2="316" y2="334" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="304" y1="350" x2="316" y2="350" stroke="#dc2626" stroke-width="1.5"/>
  <text x="322" y="348" font-size="11.5" font-weight="800" fill="#b91c1c">r</text>

  <text x="392" y="250" font-size="12.5" font-weight="800" fill="#1e3a8a">L = l + r</text>
  <text x="392" y="274" font-size="11.5" fill="#64748b">悬点到球心</text>

  <rect class="s70-pop" x="56" y="370" width="480" height="52" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="296" y="404" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = 2π√(L/g)</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">周期公式告诉我们</text>

  <g class="s70-card">
    <rect x="596" y="148" width="248" height="58" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="720" y="172" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">T 与 √L 成正比</text>
    <text x="720" y="194" font-size="11.5" fill="#334155" text-anchor="middle">摆长越长，周期越大</text>
  </g>
  <g class="s70-card s70-c2">
    <rect x="596" y="216" width="248" height="58" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="240" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">T 与 √g 成反比</text>
    <text x="720" y="262" font-size="11.5" fill="#334155" text-anchor="middle">重力加速度越大，周期越小</text>
  </g>
  <g class="s70-card s70-c3">
    <rect x="596" y="284" width="248" height="58" rx="11" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="308" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">与摆球质量 m 无关</text>
    <text x="720" y="330" font-size="11.5" fill="#334155" text-anchor="middle">与振幅 A 无关（小角度）</text>
  </g>

  <rect x="596" y="356" width="248" height="60" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="720" y="380" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">注意：摆长不是悬线长</text>
  <text x="720" y="402" font-size="11.5" fill="#92400e" text-anchor="middle">计算时不要漏掉摆球半径</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">单摆周期由摆长 L 和当地重力加速度 g 决定，与摆球质量无关</text>
</g>

<!-- 第三步：小角度与等时性 -->
<g class="s70-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">小角度条件与等时性：摆角小于 5°，周期与振幅无关</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">两个摆长相同的单摆</text>

  <line x1="60" y1="150" x2="500" y2="150" stroke="#475569" stroke-width="4"/>
  <circle cx="170" cy="150" r="4" fill="#334155"/>
  <circle cx="400" cy="150" r="4" fill="#334155"/>

  <path class="s70-arc" d="M170 340 A190 190 0 0 0 190 339" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/>
  <path class="s70-arc s70-arc2" d="M400 340 A190 190 0 0 0 440 336" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/>
  <line x1="170" y1="150" x2="170" y2="344" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <line x1="400" y1="150" x2="400" y2="344" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 5"/>

  <g class="s70-pend1">
    <line x1="170" y1="150" x2="190" y2="339" stroke="#475569" stroke-width="2.5"/>
    <circle cx="190" cy="339" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  </g>
  <g class="s70-pend2">
    <line x1="400" y1="150" x2="440" y2="336" stroke="#475569" stroke-width="2.5"/>
    <circle cx="440" cy="336" r="14" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
  </g>

  <text x="184" y="178" font-size="11" font-weight="800" fill="#1e40af">6°</text>
  <text x="426" y="178" font-size="11" font-weight="800" fill="#1e40af">12°</text>
  <text x="170" y="372" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">摆长 L</text>
  <text x="400" y="372" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">摆长 L</text>

  <text class="s70-same" x="285" y="402" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">周期 T 相同</text>
  <text x="285" y="426" font-size="11.5" fill="#334155" text-anchor="middle">摆长相同、小角度摆动 → 同时到达最低点</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">小角度与等时性</text>

  <g class="s70-box">
    <rect x="596" y="148" width="248" height="82" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="174" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">小角度条件</text>
    <text x="720" y="198" font-size="11.5" fill="#334155" text-anchor="middle">摆角小于 5° 时</text>
    <text x="720" y="218" font-size="11.5" fill="#334155" text-anchor="middle">单摆才近似做简谐运动</text>
  </g>

  <g class="s70-box s70-b2">
    <rect x="596" y="240" width="248" height="82" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="720" y="266" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">单摆的等时性</text>
    <text x="720" y="290" font-size="11.5" fill="#334155" text-anchor="middle">同一地点、同一摆长</text>
    <text x="720" y="310" font-size="11.5" fill="#334155" text-anchor="middle">周期相同，与振幅无关</text>
  </g>

  <g class="s70-box s70-b3">
    <rect x="596" y="332" width="248" height="84" rx="11" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="356" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">摆钟从北京到赤道</text>
    <text x="720" y="378" font-size="11.5" fill="#334155" text-anchor="middle">g 变小，周期变大，摆钟变慢</text>
    <text x="720" y="400" font-size="11.5" fill="#92400e" text-anchor="middle">需要缩短摆长来校准</text>
  </g>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等时性：摆长一定时，小角度摆动的周期与振幅无关，可用来计时</text>
</g>
</svg>
