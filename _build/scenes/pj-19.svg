<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="光的色散：三棱镜分解白光、色光三原色混合、红外线与紫外线应用">
<style>
[data-scene="pj-19"] .p19-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="pj-19"].s1 .p19-step1,
[data-scene="pj-19"].s2 .p19-step2,
[data-scene="pj-19"].s3 .p19-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes p19draw{to{stroke-dashoffset:0}}
@keyframes p19fan{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes p19pop{0%{transform:scale(.72);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p19pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes p19tv{0%,100%{opacity:.82}50%{opacity:1}}
@keyframes p19grow{from{transform:scaleX(.18);opacity:.2}to{transform:scaleX(1);opacity:1}}
[data-scene="pj-19"].s1 .p19-beam{stroke-dasharray:300;stroke-dashoffset:300;animation:p19draw 1s ease .15s forwards}
[data-scene="pj-19"].s1 .p19-prism{transform-box:fill-box;transform-origin:center;animation:p19pop .5s ease both}
[data-scene="pj-19"].s1 .p19-fan line{opacity:0;animation:p19fan .4s ease forwards}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(1){animation-delay:.95s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(2){animation-delay:1.03s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(3){animation-delay:1.11s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(4){animation-delay:1.19s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(5){animation-delay:1.27s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(6){animation-delay:1.35s}
[data-scene="pj-19"].s1 .p19-fan line:nth-of-type(7){animation-delay:1.43s}
[data-scene="pj-19"].s1 .p19-fan text{opacity:0;animation:p19fan .4s ease forwards;animation-delay:1.5s}
[data-scene="pj-19"].s1 .p19-sun{transform-box:fill-box;transform-origin:center;animation:p19pulse 2.6s ease-in-out infinite}
[data-scene="pj-19"].s2 .p19-base{transform-box:fill-box;transform-origin:center;animation:p19pop .55s ease both}
[data-scene="pj-19"].s2 .p19-base:nth-of-type(2){animation-delay:.12s}
[data-scene="pj-19"].s2 .p19-base:nth-of-type(3){animation-delay:.24s}
[data-scene="pj-19"].s2 .p19-tvbar{animation:p19tv 2.2s ease-in-out infinite}
[data-scene="pj-19"].s2 .p19-tvbar:nth-of-type(2){animation-delay:.3s}
[data-scene="pj-19"].s2 .p19-tvbar:nth-of-type(3){animation-delay:.6s}
[data-scene="pj-19"].s2 .p19-white{animation:p19pulse 1.8s ease-in-out infinite}
[data-scene="pj-19"].s3 .p19-bar{transform-box:fill-box;transform-origin:left center;animation:p19grow .8s ease both}
[data-scene="pj-19"].s3 .p19-card{transform-box:fill-box;transform-origin:center;animation:p19pop .5s ease both;animation-delay:.15s}
[data-scene="pj-19"].s3 .p19-card2{animation-delay:.28s}
[data-scene="pj-19"].s3 .p19-uv{animation:p19pulse 1.7s ease-in-out infinite}
[data-scene="pj-19"].s3 .p19-heat{animation:p19pulse 1.5s ease-in-out infinite}
</style>
<defs>
<linearGradient id="p19rainbow" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#dc2626"/><stop offset=".17" stop-color="#ea580c"/><stop offset=".34" stop-color="#eab308"/><stop offset=".5" stop-color="#16a34a"/><stop offset=".67" stop-color="#2563eb"/><stop offset=".84" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/>
</linearGradient>
<linearGradient id="p19ir" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7f1d1d"/><stop offset="1" stop-color="#b91c1c"/>
</linearGradient>
<linearGradient id="p19uv" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c084fc"/>
</linearGradient>
<clipPath id="p19barClip"><rect x="70" y="140" width="760" height="64" rx="12"/></clipPath>
<clipPath id="p19clipR"><circle cx="270" cy="260" r="100"/></clipPath>
<clipPath id="p19clipG"><circle cx="430" cy="260" r="100"/></clipPath>
<clipPath id="p19clipB"><circle cx="350" cy="335" r="100"/></clipPath>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">光的色散：三棱镜、三原色与不可见光</text>

<!-- 第一步：三棱镜分解白光 -->
<g class="p19-step p19-step1" data-zone="1">
  <g class="p19-sun">
    <circle cx="88" cy="288" r="20" fill="#fde047" stroke="#f59e0b" stroke-width="3"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="88" y1="258" x2="88" y2="250"/><line x1="88" y1="326" x2="88" y2="318"/>
      <line x1="58" y1="288" x2="50" y2="288"/><line x1="126" y1="288" x2="118" y2="288"/>
      <line x1="67" y1="267" x2="61" y2="261"/><line x1="115" y1="315" x2="109" y2="309"/>
      <line x1="109" y1="267" x2="115" y2="261"/><line x1="61" y1="315" x2="67" y2="309"/>
    </g>
  </g>
  <text x="88" y="246" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">太阳光</text>

  <line class="p19-beam" x1="120" y1="288" x2="402" y2="288" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
  <line class="p19-beam" x1="120" y1="288" x2="402" y2="288" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <polygon points="376,279 390,288 376,297" fill="#94a3b8"/>
  <text x="166" y="270" font-size="13.5" font-weight="800" fill="#475569">白光（复色光）</text>

  <path class="p19-prism" d="M430 200 L345 468 L555 468 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="404" y1="288" x2="471" y2="288" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <text x="450" y="452" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">三棱镜</text>

  <g class="p19-fan">
    <line x1="471" y1="288" x2="850" y2="300" stroke="#dc2626" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="328" stroke="#ea580c" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="356" stroke="#eab308" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="384" stroke="#16a34a" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="412" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="440" stroke="#4f46e5" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="471" y1="288" x2="850" y2="468" stroke="#9333ea" stroke-width="3.6" stroke-linecap="round"/>
    <g font-size="13" font-weight="800" text-anchor="end">
      <text x="886" y="305" fill="#dc2626">红</text>
      <text x="886" y="333" fill="#ea580c">橙</text>
      <text x="886" y="361" fill="#ca8a04">黄</text>
      <text x="886" y="389" fill="#16a34a">绿</text>
      <text x="886" y="417" fill="#2563eb">蓝</text>
      <text x="886" y="445" fill="#4f46e5">靛</text>
      <text x="886" y="473" fill="#9333ea">紫</text>
    </g>
  </g>

  <rect x="598" y="78" width="264" height="56" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="730" y="102" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">白光 = 七种色光混合</text>
  <text x="730" y="122" font-size="11.5" fill="#64748b" text-anchor="middle">不同色光偏折程度不同</text>
</g>

<!-- 第二步：色光的三原色混合 -->
<g class="p19-step p19-step2" data-zone="2">
  <rect x="55" y="80" width="790" height="390" rx="22" fill="#0f172a" stroke="#1e3a8a" stroke-width="2"/>
  <text x="450" y="116" font-size="16" font-weight="800" fill="#e2e8f0" text-anchor="middle">色光的三原色：红 + 绿 + 蓝</text>

  <g class="p19-rgb">
    <circle class="p19-base" cx="270" cy="260" r="100" fill="#ef4444" opacity=".92"/>
    <circle class="p19-base" cx="430" cy="260" r="100" fill="#22c55e" opacity=".92"/>
    <circle class="p19-base" cx="350" cy="335" r="100" fill="#3b82f6" opacity=".92"/>
    <circle cx="270" cy="260" r="100" fill="#facc15" clip-path="url(#p19clipG)"/>
    <circle cx="270" cy="260" r="100" fill="#ec4899" clip-path="url(#p19clipB)"/>
    <circle cx="430" cy="260" r="100" fill="#22d3ee" clip-path="url(#p19clipB)"/>
    <g clip-path="url(#p19clipG)"><circle cx="270" cy="260" r="100" fill="#ffffff" clip-path="url(#p19clipB)"/></g>
    <circle cx="350" cy="292" r="18" fill="#ffffff"/>
  </g>
  <g font-size="15" font-weight="900">
    <text x="205" y="205" fill="#fecaca">红</text>
    <text x="470" y="205" fill="#bbf7d0">绿</text>
    <text x="350" y="415" fill="#bfdbfe" text-anchor="middle">蓝</text>
  </g>
  <text x="350" y="226" font-size="12.5" font-weight="800" fill="#fef08a" text-anchor="middle">黄</text>
  <text x="288" y="320" font-size="12" font-weight="800" fill="#fbcfe8" text-anchor="middle">品红</text>
  <text x="414" y="320" font-size="12" font-weight="800" fill="#a5f3fc" text-anchor="middle">青</text>
  <text x="350" y="297" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">白</text>

  <g>
    <rect x="610" y="190" width="220" height="130" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="622" y="202" width="196" height="106" rx="5" fill="#0b1220"/>
    <rect class="p19-tvbar" x="632" y="212" width="52" height="86" fill="#ef4444"/>
    <rect class="p19-tvbar" x="684" y="212" width="52" height="86" fill="#22c55e"/>
    <rect class="p19-tvbar" x="736" y="212" width="52" height="86" fill="#3b82f6"/>
    <line x1="710" y1="320" x2="710" y2="344" stroke="#64748b" stroke-width="4"/>
    <rect x="660" y="344" width="100" height="10" rx="4" fill="#475569"/>
    <text x="720" y="180" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle">RGB 发光点</text>
    <text x="720" y="378" font-size="13.5" font-weight="800" fill="#e2e8f0" text-anchor="middle">彩色电视屏幕</text>
    <text x="720" y="400" font-size="11.5" fill="#94a3b8" text-anchor="middle">红、绿、蓝三种色光混合</text>
  </g>

  <text x="450" y="448" font-size="12.5" fill="#cbd5e1" text-anchor="middle">三种色光按不同比例混合，可以产生各种颜色的光</text>
</g>

<!-- 第三步：红外线与紫外线 -->
<g class="p19-step p19-step3" data-zone="3">
  <g class="p19-bar">
    <rect x="70" y="140" width="760" height="64" rx="12" fill="#e2e8f0"/>
    <g clip-path="url(#p19barClip)">
      <rect x="70" y="140" width="180" height="64" fill="url(#p19ir)"/>
      <rect x="250" y="140" width="400" height="64" fill="url(#p19rainbow)"/>
      <rect x="650" y="140" width="180" height="64" fill="url(#p19uv)"/>
    </g>
  </g>
  <g font-size="14" font-weight="800" text-anchor="middle">
    <text x="160" y="128" fill="#b91c1c">红外线</text>
    <text x="450" y="128" fill="#334155">可见光</text>
    <text x="740" y="128" fill="#7c3aed">紫外线</text>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="160" y="236">&gt;760 nm · 不可见</text>
    <text x="450" y="236">400–760 nm</text>
    <text x="740" y="236">&lt;400 nm · 不可见</text>
  </g>

  <g class="p19-card">
    <rect x="55" y="255" width="375" height="200" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="242" y="285" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">红外线 · 热效应强</text>
    <rect x="106" y="315" width="30" height="66" rx="7" fill="#334155"/>
    <circle cx="121" cy="330" r="4" fill="#ef4444"/>
    <rect x="113" y="344" width="16" height="4" rx="2" fill="#94a3b8"/>
    <rect x="113" y="354" width="16" height="4" rx="2" fill="#94a3b8"/>
    <rect x="113" y="364" width="16" height="4" rx="2" fill="#94a3b8"/>
    <text x="121" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">遥控器</text>

    <rect x="229" y="318" width="10" height="50" rx="5" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <circle cx="234" cy="380" r="13" fill="#dc2626"/>
    <g stroke="#b91c1c" stroke-width="1.6">
      <line x1="242" y1="330" x2="250" y2="330"/><line x1="242" y1="340" x2="250" y2="340"/>
      <line x1="242" y1="350" x2="250" y2="350"/>
    </g>
    <text x="234" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">测温</text>

    <g class="p19-heat">
      <rect x="344" y="382" width="42" height="12" rx="4" fill="#f59e0b"/>
      <path d="M352 372 q7 -9 0 -18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <path d="M365 372 q7 -9 0 -18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
      <path d="M378 372 q7 -9 0 -18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="365" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">加热</text>
    <text x="242" y="438" font-size="11.5" fill="#64748b" text-anchor="middle">一切物体都在辐射红外线</text>
  </g>

  <g class="p19-card p19-card2">
    <rect x="470" y="255" width="375" height="200" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="657" y="285" font-size="14" font-weight="800" fill="#6d28d9" text-anchor="middle">紫外线 · 使荧光物质发光</text>
    <rect x="505" y="330" width="52" height="30" rx="4" fill="#bbf7d0" stroke="#059669" stroke-width="2"/>
    <text x="531" y="351" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">100</text>
    <rect x="556" y="322" width="8" height="22" rx="3" fill="#7c3aed"/>
    <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
      <line x1="570" y1="328" x2="582" y2="322"/><line x1="570" y1="336" x2="584" y2="336"/>
    </g>
    <text x="531" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">验钞</text>

    <g class="p19-uv">
      <circle cx="650" cy="348" r="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <circle cx="645" cy="345" r="2" fill="#7c3aed"/><circle cx="655" cy="350" r="2" fill="#7c3aed"/>
      <circle cx="648" cy="355" r="2" fill="#7c3aed"/>
      <g stroke="#7c3aed" stroke-width="2" stroke-linecap="round">
        <line x1="650" y1="324" x2="650" y2="318"/><line x1="668" y1="332" x2="674" y2="327"/>
        <line x1="632" y1="332" x2="626" y2="327"/>
      </g>
    </g>
    <text x="650" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">杀菌</text>

    <g class="p19-uv">
      <rect x="730" y="342" width="58" height="12" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
      <g stroke="#a78bfa" stroke-width="2" stroke-linecap="round">
        <line x1="740" y1="334" x2="738" y2="326"/><line x1="759" y1="334" x2="759" y2="326"/>
        <line x1="778" y1="334" x2="780" y2="326"/>
      </g>
    </g>
    <text x="759" y="404" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">荧光</text>
    <text x="657" y="438" font-size="11.5" fill="#b91c1c" text-anchor="middle">过量紫外线对人体有害</text>
  </g>
</g>
</svg>
