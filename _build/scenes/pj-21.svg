<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="生活中的透镜：照相机、投影仪和放大镜的成像与应用">
<style>
[data-scene="pj-21"] .p21-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="pj-21"].s1 .p21-step1,
[data-scene="pj-21"].s2 .p21-step2,
[data-scene="pj-21"].s3 .p21-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes p21draw{to{stroke-dashoffset:0}}
@keyframes p21pop{0%{transform:scale(.7);opacity:0}72%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p21flash{0%,88%,100%{opacity:0;transform:scale(.6)}92%,96%{opacity:1;transform:scale(1.15)}}
@keyframes p21flow{to{stroke-dashoffset:-60}}
@keyframes p21fade{from{opacity:.12}to{opacity:1}}
@keyframes p21glow{0%,100%{opacity:.45}50%{opacity:.9}}
@keyframes p21pulse{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="pj-21"].s1 .p21-ray{opacity:0;animation:p21fade .8s ease .15s forwards}
[data-scene="pj-21"].s1 .p21-image{transform-box:fill-box;transform-origin:top center;animation:p21pop .5s ease 1.25s both}
[data-scene="pj-21"].s1 .p21-flash{transform-box:fill-box;transform-origin:center;animation:p21flash 3s ease-in-out infinite}
[data-scene="pj-21"].s2 .p21-beam{stroke-dasharray:14 10;animation:p21flow 1s linear infinite}
[data-scene="pj-21"].s2 .p21-screenimg{transform-box:fill-box;transform-origin:center;animation:p21pop .6s ease .9s both}
[data-scene="pj-21"].s2 .p21-lamp{animation:p21glow 1.6s ease-in-out infinite}
[data-scene="pj-21"].s3 .p21-fake{opacity:0;animation:p21fade .9s ease .3s forwards}
[data-scene="pj-21"].s3 .p21-vimg{transform-box:fill-box;transform-origin:bottom center;animation:p21pop .55s ease 1.2s both}
[data-scene="pj-21"].s3 .p21-lens{animation:p21glow 2.4s ease-in-out infinite}
[data-scene="pj-21"].s3 .p21-eye{animation:p21pulse 2.2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">生活中的透镜：照相机、投影仪、放大镜</text>

<!-- 第一步：照相机 -->
<g class="p21-step p21-step1" data-zone="1">
  <line x1="100" y1="300" x2="820" y2="300" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="10 7"/>

  <line x1="150" y1="300" x2="150" y2="190" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="150" y="175" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">物体（远处）</text>

  <rect x="535" y="185" width="230" height="220" rx="18" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <rect x="600" y="158" width="80" height="30" rx="6" fill="#475569"/>
  <circle cx="735" cy="172" r="8" fill="#ef4444"/>
  <text x="650" y="148" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">照相机</text>
  <g class="p21-flash">
    <path d="M760 160 l10 -12 l-2 12 l12 -2 l-12 10 z" fill="#fde047" stroke="#f59e0b" stroke-width="1.5"/>
  </g>

  <rect x="430" y="255" width="105" height="90" rx="12" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <ellipse cx="470" cy="300" rx="10" ry="43" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="2.6"/>
  <text x="470" y="242" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">镜头（凸透镜）</text>

  <g class="p21-ray">
    <line x1="150" y1="190" x2="470" y2="190" stroke="#dc2626" stroke-width="3.2"/>
    <line x1="470" y1="190" x2="660" y2="410" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
    <line x1="150" y1="190" x2="470" y2="300" stroke="#d97706" stroke-width="3.2"/>
    <line x1="470" y1="300" x2="660" y2="365" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrAmber)"/>
  </g>

  <rect x="606" y="240" width="9" height="120" fill="#334155"/>
  <text x="650" y="228" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">胶片 / 传感器</text>

  <g class="p21-image">
    <line x1="607" y1="300" x2="607" y2="348" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
    <text x="690" y="372" font-size="12.5" font-weight="800" fill="#1e40af">倒立、缩小的实像</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6">
    <line x1="150" y1="432" x2="150" y2="446"/><line x1="470" y1="432" x2="470" y2="446"/>
    <line x1="150" y1="440" x2="470" y2="440" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="310" y="464" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">u &gt; 2f</text>

  <g stroke="#475569" stroke-width="5" stroke-linecap="round">
    <line x1="625" y1="405" x2="590" y2="500"/><line x1="690" y1="405" x2="725" y2="500"/>
    <line x1="658" y1="405" x2="658" y2="500"/>
  </g>

  <rect x="500" y="430" width="330" height="36" rx="12" fill="#e8effc"/>
  <text x="665" y="454" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">u &gt; 2f → 倒立、缩小、实像</text>
</g>

<!-- 第二步：投影仪 -->
<g class="p21-step p21-step2" data-zone="2">
  <rect x="565" y="88" width="285" height="142" rx="8" fill="#fffef5" stroke="#94a3b8" stroke-width="3"/>
  <text x="705" y="76" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">屏幕（光屏）</text>
  <g transform="rotate(180 705 168)"><text class="p21-screenimg" x="705" y="210" font-size="86" font-weight="900" fill="#1d4ed8" text-anchor="middle">F</text></g>

  <rect x="80" y="330" width="330" height="170" rx="18" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="92" y="496" width="40" height="10" rx="4" fill="#0f172a"/>
  <rect x="358" y="496" width="40" height="10" rx="4" fill="#0f172a"/>
  <circle class="p21-lamp" cx="145" cy="420" r="30" fill="#fde047" opacity=".3"/>
  <circle cx="145" cy="420" r="15" fill="#fde047" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="145" y="456" font-size="11.5" font-weight="700" fill="#cbd5e1" text-anchor="middle">光源</text>

  <rect x="228" y="368" width="10" height="62" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="245" y="320" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">投影片 f&lt;u&lt;2f</text>
  <text x="115" y="316" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="start">投影仪</text>

  <rect x="318" y="352" width="24" height="96" rx="6" fill="#475569"/>
  <ellipse cx="330" cy="400" rx="12" ry="44" fill="url(#gGlass)" stroke="#fbbf24" stroke-width="3"/>
  <text x="330" y="342" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">镜头</text>

  <path d="M342 382 L342 418 L480 400 Z" fill="#fde047" opacity=".45"/>
  <path d="M470 394 L490 406 L720 225 L680 190 Z" fill="#fde047" opacity=".34"/>
  <line x1="444" y1="358" x2="516" y2="430" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
  <line x1="450" y1="364" x2="510" y2="424" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="480" y1="430" x2="480" y2="500" stroke="#475569" stroke-width="5"/>
  <text x="526" y="472" font-size="12" font-weight="800" fill="#334155">平面镜（45°）</text>

  <g class="p21-beam" fill="none" stroke="#f59e0b" stroke-width="2.6" opacity=".85">
    <polyline points="235,370 330,382 480,400 690,205"/>
    <polyline points="235,430 330,418 480,400 690,205"/>
    <line x1="342" y1="400" x2="478" y2="400"/>
    <line x1="490" y1="400" x2="685" y2="208"/>
  </g>
  <polyline points="330,400 480,400 690,205" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>

  <text x="705" y="262" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">倒立、放大的实像</text>
  <text x="705" y="284" font-size="11.5" fill="#64748b" text-anchor="middle">f &lt; u &lt; 2f，像距 v &gt; 2f</text>
</g>

<!-- 第三步：放大镜 -->
<g class="p21-step p21-step3" data-zone="3">
  <line x1="120" y1="400" x2="800" y2="400" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="10 7"/>
  <path class="p21-lens" d="M560 300 Q530 400 560 500 Q590 400 560 300 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.2"/>
  <text x="612" y="290" font-size="13" font-weight="800" fill="#1e3a8a">放大镜（凸透镜）</text>
  <line x1="608" y1="296" x2="585" y2="320" stroke="#1e3a8a" stroke-width="1.4"/>

  <line x1="460" y1="400" x2="460" y2="330" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <line x1="442" y1="400" x2="478" y2="400" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <text x="440" y="322" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="end">物体</text>

  <g class="p21-ray" style="opacity:1">
    <line x1="460" y1="330" x2="560" y2="330" stroke="#d97706" stroke-width="3.2"/>
    <line x1="560" y1="330" x2="760" y2="430" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrAmber)"/>
    <line x1="460" y1="330" x2="560" y2="400" stroke="#d97706" stroke-width="3.2"/>
    <line x1="560" y1="400" x2="690" y2="491" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrAmber)"/>
  </g>
  <g class="p21-fake" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 6" opacity=".8">
    <line x1="560" y1="330" x2="210" y2="155"/>
    <line x1="560" y1="400" x2="210" y2="155"/>
  </g>

  <g class="p21-vimg">
    <line x1="210" y1="400" x2="210" y2="155" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 6" marker-end="url(#arrBlue)"/>
    <text x="210" y="138" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">虚像（正立、放大）</text>
  </g>

  <circle cx="420" cy="400" r="4.5" fill="#1d4ed8"/>
  <circle cx="700" cy="400" r="4.5" fill="#1d4ed8"/>
  <g font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">
    <text x="420" y="424">F</text><text x="700" y="424">F′</text>
  </g>
  <text x="574" y="390" font-size="12.5" font-weight="800" fill="#1e3a8a">O</text>

  <g stroke="#64748b" stroke-width="1.6">
    <line x1="460" y1="432" x2="460" y2="446"/><line x1="560" y1="432" x2="560" y2="446"/>
    <line x1="460" y1="440" x2="560" y2="440" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="510" y="464" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">u &lt; f</text>

  <g stroke="#64748b" stroke-width="1.6">
    <line x1="420" y1="470" x2="420" y2="484"/><line x1="560" y1="470" x2="560" y2="484"/>
    <line x1="420" y1="478" x2="560" y2="478" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="490" y="497" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">f</text>

  <g class="p21-eye">
    <path d="M710 430 Q740 410 770 430 Q740 450 710 430 Z" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <circle cx="740" cy="430" r="8" fill="#334155"/>
  </g>
  <text x="740" y="468" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">眼睛</text>

  <text x="300" y="486" font-size="12" fill="#64748b" text-anchor="middle">虚像不能用光屏承接</text>
</g>
</svg>
