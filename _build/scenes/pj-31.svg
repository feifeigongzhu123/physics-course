<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="牛顿第一定律：阻力实验、定律表述与惯性">
<style>
[data-scene="pj-31"] .p31-step1,[data-scene="pj-31"] .p31-step2,[data-scene="pj-31"] .p31-step3{display:none}
[data-scene="pj-31"].s1 .p31-step1,[data-scene="pj-31"].s2 .p31-step2,[data-scene="pj-31"].s3 .p31-step3{display:block}
@keyframes p31pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p31in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes p31draw{to{stroke-dashoffset:0}}
@keyframes p31pulse{0%,100%{opacity:.38}50%{opacity:1}}
@keyframes p31roll{0%{transform:translateX(0)}100%{transform:translateX(26px)}}
@keyframes p31lean{from{transform:rotate(0)}to{transform:rotate(14deg)}}
@keyframes p31grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
[data-scene="pj-31"] .p31-card{transform-box:fill-box;transform-origin:center;animation:p31pop .55s ease .1s both}
[data-scene="pj-31"] .p31-note{animation:p31in .55s ease .2s both}
[data-scene="pj-31"].s1 .p31-car1{animation:p31in .4s ease .1s both}
[data-scene="pj-31"].s1 .p31-car2{animation:p31in .4s ease .3s both}
[data-scene="pj-31"].s1 .p31-car3{animation:p31in .4s ease .5s both}
[data-scene="pj-31"].s1 .p31-dist{stroke-dasharray:6 5}
[data-scene="pj-31"].s2 .p31-quote{animation:p31in .6s ease .1s both}
[data-scene="pj-31"].s2 .p31-state{transform-box:fill-box;transform-origin:center;animation:p31pop .5s ease .35s both}
[data-scene="pj-31"].s2 .p31-state2{animation-delay:.5s}
[data-scene="pj-31"].s2 .p31-flow{transform-box:view-box;animation:p31in .5s ease both}
[data-scene="pj-31"].s2 .p31-move{stroke-dasharray:26 10;animation:p31pulse 1.4s linear infinite}
[data-scene="pj-31"].s3 .p31-block{transform-box:view-box;transform-origin:215px 290px;animation:p31lean .9s cubic-bezier(.3,.7,.4,1) .4s forwards}
[data-scene="pj-31"].s3 .p31-bar{transform-box:fill-box;transform-origin:left center;animation:p31grow .8s ease .2s both}
[data-scene="pj-31"].s3 .p31-bar2{transform-box:fill-box;transform-origin:left center;animation:p31grow .8s ease .45s both}
[data-scene="pj-31"].s3 .p31-v{animation:p31pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">牛顿第一定律：实验 + 推理，力不是维持运动的原因</text>

<!-- 第一步：阻力实验 -->
<g class="p31-step1" data-zone="1">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">让小车从同一斜面、同一高度由静止滑下，到达水平面时速度相同</text>
  <text x="70" y="106" font-size="11.5" fill="#64748b">水平面越光滑，阻力越小，小车运动的距离越远</text>

  <!-- 第一行：毛巾 -->
  <g>
    <polygon points="62,170 172,250 62,250" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="62" y1="170" x2="172" y2="170" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="117" y="162" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">同一高度</text>
    <line x1="172" y1="250" x2="850" y2="250" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#d97706" stroke-width="1.6">
      <line x1="186" y1="250" x2="192" y2="257"/><line x1="226" y1="250" x2="232" y2="257"/>
      <line x1="266" y1="250" x2="272" y2="257"/><line x1="306" y1="250" x2="312" y2="257"/>
      <line x1="346" y1="250" x2="352" y2="257"/><line x1="386" y1="250" x2="392" y2="257"/>
      <line x1="426" y1="250" x2="432" y2="257"/><line x1="466" y1="250" x2="472" y2="257"/>
      <line x1="506" y1="250" x2="512" y2="257"/><line x1="546" y1="250" x2="552" y2="257"/>
      <line x1="586" y1="250" x2="592" y2="257"/><line x1="626" y1="250" x2="632" y2="257"/>
      <line x1="666" y1="250" x2="672" y2="257"/><line x1="706" y1="250" x2="712" y2="257"/>
      <line x1="746" y1="250" x2="752" y2="257"/><line x1="786" y1="250" x2="792" y2="257"/>
      <line x1="826" y1="250" x2="832" y2="257"/>
    </g>
    <text x="846" y="270" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="end">毛巾 · 阻力最大</text>
    <g class="p31-car1">
      <rect x="303" y="224" width="34" height="18" rx="4" fill="#e8effc" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="311" cy="244" r="4.5" fill="#334155"/>
      <circle cx="329" cy="244" r="4.5" fill="#334155"/>
    </g>
    <g class="p31-dist" stroke="#1d4ed8" stroke-width="1.6">
      <line x1="172" y1="262" x2="303" y2="262"/>
      <line x1="172" y1="257" x2="172" y2="267"/>
      <line x1="303" y1="257" x2="303" y2="267"/>
    </g>
    <text x="237" y="282" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">s₁ 最短</text>
  </g>

  <!-- 第二行：棉布 -->
  <g>
    <polygon points="62,265 172,345 62,345" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="172" y1="345" x2="850" y2="345" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="176" y1="345" x2="846" y2="345" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="846" y="365" font-size="11.5" font-weight="800" fill="#475569" text-anchor="end">棉布 · 阻力居中</text>
    <g class="p31-car2">
      <rect x="543" y="319" width="34" height="18" rx="4" fill="#e8effc" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="551" cy="339" r="4.5" fill="#334155"/>
      <circle cx="569" cy="339" r="4.5" fill="#334155"/>
    </g>
    <g class="p31-dist" stroke="#1d4ed8" stroke-width="1.6">
      <line x1="172" y1="357" x2="543" y2="357"/>
      <line x1="172" y1="352" x2="172" y2="362"/>
      <line x1="543" y1="352" x2="543" y2="362"/>
    </g>
    <text x="357" y="377" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">s₂ 较长</text>
  </g>

  <!-- 第三行：木板 -->
  <g>
    <polygon points="62,360 172,440 62,440" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.8"/>
    <line x1="172" y1="440" x2="850" y2="440" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <line x1="174" y1="437" x2="848" y2="437" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="846" y="470" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="end">木板 · 阻力最小</text>
    <g class="p31-car3">
      <rect x="753" y="414" width="34" height="18" rx="4" fill="#e8effc" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="761" cy="434" r="4.5" fill="#334155"/>
      <circle cx="779" cy="434" r="4.5" fill="#334155"/>
    </g>
    <g class="p31-dist" stroke="#1d4ed8" stroke-width="1.6">
      <line x1="172" y1="452" x2="753" y2="452"/>
      <line x1="172" y1="447" x2="172" y2="457"/>
      <line x1="753" y1="447" x2="753" y2="457"/>
    </g>
    <text x="462" y="472" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">s₃ 最长</text>
  </g>

  <text x="450" y="492" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">推理：若水平面绝对光滑，小车将永远做匀速直线运动</text>
</g>

<!-- 第二步：牛顿第一定律 -->
<g class="p31-step2" data-zone="2">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">牛顿第一定律：一切物体在没有受到力的作用时，总保持静止或匀速直线运动</text>

  <g class="p31-quote">
    <rect x="80" y="100" width="740" height="130" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="142" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">一切物体在没有受到力的作用时，</text>
    <text x="450" y="172" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">总保持静止状态或匀速直线运动状态。</text>
    <text x="450" y="208" font-size="12" fill="#64748b" text-anchor="middle">—— 牛顿第一定律（也叫惯性定律）</text>
  </g>

  <!-- 两种状态 -->
  <g class="p31-state">
    <rect x="80" y="248" width="350" height="112" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <line x1="100" y1="330" x2="410" y2="330" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="190" cy="312" r="18" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <text x="190" y="316" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">v = 0</text>
    <text x="236" y="292" font-size="12" font-weight="800" fill="#1e3a8a">静止状态</text>
    <text x="236" y="314" font-size="11" fill="#64748b">合力为零 → 保持静止</text>
  </g>
  <g class="p31-state p31-state2">
    <rect x="470" y="248" width="350" height="112" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <line x1="490" y1="330" x2="800" y2="330" stroke="#94a3b8" stroke-width="3"/>
    <circle cx="570" cy="312" r="18" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <line class="p31-move" x1="594" y1="312" x2="682" y2="312" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="628" y="292" font-size="11.5" font-weight="800" fill="#1e40af">v 不变</text>
    <text x="698" y="317" font-size="12" font-weight="800" fill="#1e3a8a">匀速直线运动</text>
  </g>

  <!-- 推理链条 -->
  <g class="p31-flow">
    <rect x="80" y="384" width="200" height="66" rx="12" fill="#e8effc"/>
    <text x="180" y="412" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验：阻力实验</text>
    <text x="180" y="434" font-size="11" fill="#64748b" text-anchor="middle">阻力越小，滑得越远</text>
    <line x1="286" y1="417" x2="326" y2="417" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <rect x="336" y="384" width="200" height="66" rx="12" fill="#fef3c7"/>
    <text x="436" y="412" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">科学推理</text>
    <text x="436" y="434" font-size="11" fill="#7c5a30" text-anchor="middle">若阻力为零呢？</text>
    <line x1="542" y1="417" x2="582" y2="417" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <rect x="592" y="384" width="230" height="66" rx="12" fill="#e6f7f1"/>
    <text x="707" y="412" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">牛顿第一定律</text>
    <text x="707" y="434" font-size="11" fill="#64748b" text-anchor="middle">实验 + 推理共同得出</text>
  </g>

  <g class="p31-note">
    <rect x="80" y="462" width="740" height="28" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="450" y="480" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">不能直接用实验验证（现实中没有完全不受力的物体）；力不是维持运动的原因，而是改变运动状态的原因</text>
  </g>
</g>

<!-- 第三步：惯性 -->
<g class="p31-step3" data-zone="3">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">惯性：物体保持原来运动状态不变的性质，只跟质量有关</text>

  <!-- 刹车前倾 -->
  <line x1="56" y1="360" x2="440" y2="360" stroke="#94a3b8" stroke-width="3"/>
  <g>
    <rect x="95" y="290" width="200" height="45" rx="10" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <circle cx="135" cy="342" r="18" fill="#334155"/>
    <circle cx="135" cy="342" r="7" fill="#cbd5e1"/>
    <circle cx="255" cy="342" r="18" fill="#334155"/>
    <circle cx="255" cy="342" r="7" fill="#cbd5e1"/>
    <text x="195" y="328" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">小车</text>
  </g>

  <rect x="175" y="215" width="40" height="75" rx="5" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <g class="p31-block">
    <rect x="175" y="215" width="40" height="75" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    <text x="195" y="258" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">木块</text>
  </g>

  <g class="p31-v">
    <line x1="318" y1="270" x2="404" y2="270" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="360" y="256" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">v</text>
  </g>
  <line x1="95" y1="312" x2="34" y2="312" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="36" y="334" font-size="11.5" font-weight="800" fill="#b91c1c">刹车</text>

  <text x="245" y="398" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">刹车时木块上部继续前冲 → 木块前倾</text>

  <!-- 惯性大小 -->
  <g class="p31-card">
    <rect x="470" y="100" width="380" height="280" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="660" y="130" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">惯性大小由质量决定</text>
    <text x="490" y="178" font-size="11.5" font-weight="700" fill="#334155">满载卡车 · 质量大</text>
    <rect class="p31-bar" x="610" y="164" width="150" height="18" rx="9" fill="#dc2626"/>
    <text x="770" y="179" font-size="11.5" font-weight="800" fill="#b91c1c">惯性大</text>
    <text x="490" y="238" font-size="11.5" font-weight="700" fill="#334155">自行车 · 质量小</text>
    <rect class="p31-bar2" x="610" y="224" width="62" height="18" rx="9" fill="#1d4ed8"/>
    <text x="682" y="239" font-size="11.5" font-weight="800" fill="#1e40af">惯性小</text>
    <line x1="490" y1="268" x2="830" y2="268" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="660" y="298" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量越大，惯性越大</text>
    <text x="660" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">与速度大小、受力情况无关</text>
    <text x="660" y="348" font-size="11.5" fill="#64748b" text-anchor="middle">同样的速度下，卡车更难停下来</text>
  </g>

  <!-- 三个易错点 -->
  <g class="p31-note">
    <g>
      <rect x="56" y="412" width="250" height="74" rx="12" fill="#e8effc"/>
      <text x="181" y="438" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 一切物体都有惯性</text>
      <text x="181" y="462" font-size="11" fill="#64748b" text-anchor="middle">静止的物体也有惯性</text>
    </g>
    <g>
      <rect x="325" y="412" width="250" height="74" rx="12" fill="#fff7ed"/>
      <text x="450" y="438" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">② 惯性不是力</text>
      <text x="450" y="462" font-size="11" fill="#7c5a30" text-anchor="middle">不能说“受到惯性作用”</text>
    </g>
    <g>
      <rect x="594" y="412" width="250" height="74" rx="12" fill="#e6f7f1"/>
      <text x="719" y="438" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">③ 惯性大小只看质量</text>
      <text x="719" y="462" font-size="11" fill="#64748b" text-anchor="middle">与速度大小无关</text>
    </g>
  </g>
</g>
</svg>
