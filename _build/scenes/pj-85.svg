<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="能源与可持续发展：能源危机与污染、可持续发展、新能源">
<style>
.p85-s1,.p85-s2,.p85-s3{opacity:0;visibility:hidden}
.p85-s1{opacity:1;visibility:visible}
[data-scene="pj-85"] .p85-s1,[data-scene="pj-85"] .p85-s2,[data-scene="pj-85"] .p85-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-85"].s1 .p85-s1,[data-scene="pj-85"].s2 .p85-s2,[data-scene="pj-85"].s3 .p85-s3{opacity:1;visibility:visible}
@keyframes p85draw{to{stroke-dashoffset:0}}
@keyframes p85smoke{0%{transform:translateY(0) scale(.9);opacity:.75}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes p85pop{0%{transform:scale(.84);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p85pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p85tilt{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
[data-scene="pj-85"].s1 .p85-consume{stroke-dasharray:520;stroke-dashoffset:520;animation:p85draw 1.4s ease forwards}
[data-scene="pj-85"].s1 .p85-reserve{stroke-dasharray:460;stroke-dashoffset:460;animation:p85draw 1.4s ease .2s forwards}
[data-scene="pj-85"].s1 .p85-smoke{transform-box:fill-box;transform-origin:center;animation:p85smoke 3s ease-out infinite}
[data-scene="pj-85"].s1 .p85-smoke2{animation-delay:1s}
[data-scene="pj-85"].s1 .p85-smoke3{animation-delay:2s}
[data-scene="pj-85"].s1 .p85-warn{animation:p85pulse 1.6s ease-in-out infinite}
[data-scene="pj-85"].s2 .p85-scale{transform-box:fill-box;transform-origin:center;animation:p85tilt 3.4s ease-in-out infinite}
[data-scene="pj-85"].s2 .p85-def{transform-box:fill-box;transform-origin:center;animation:p85pop .6s ease both}
[data-scene="pj-85"].s2 .p85-chip{transform-box:fill-box;transform-origin:center;animation:p85pop .5s ease both}
[data-scene="pj-85"].s2 .p85-chip2{animation-delay:.1s}
[data-scene="pj-85"].s2 .p85-chip3{animation-delay:.2s}
[data-scene="pj-85"].s3 .p85-card{transform-box:fill-box;transform-origin:center;animation:p85pop .5s ease both}
[data-scene="pj-85"].s3 .p85-card2{animation-delay:.07s}
[data-scene="pj-85"].s3 .p85-card3{animation-delay:.14s}
[data-scene="pj-85"].s3 .p85-card4{animation-delay:.21s}
[data-scene="pj-85"].s3 .p85-card5{animation-delay:.28s}
[data-scene="pj-85"].s3 .p85-sun{animation:p85pulse 2s ease-in-out infinite}
[data-scene="pj-85"].s3 .p85-blade{transform-box:fill-box;transform-origin:center;animation:p85tilt 4s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">能源与可持续发展：既要发展，也要留有余地</text>

<!-- 第一步：能源危机与污染 -->
<g class="p85-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">能源消耗持续增长，化石能源日益减少，环境压力越来越大</text>

  <rect x="34" y="110" width="430" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="54" y="124" width="204" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="143" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">消耗在上升，储量在下降</text>

  <line x1="80" y1="380" x2="440" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="170" x2="80" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <line x1="80" y1="380" x2="72" y2="372" stroke="#94a3b8" stroke-width="2"/>
  <text x="440" y="402" font-size="11" fill="#64748b" text-anchor="end">时间 →</text>
  <text x="70" y="166" font-size="11" fill="#64748b" text-anchor="middle">数量</text>
  <g stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="4 5">
    <line x1="80" y1="330" x2="435" y2="330"/><line x1="80" y1="280" x2="435" y2="280"/>
    <line x1="80" y1="230" x2="435" y2="230"/>
  </g>

  <path class="p85-consume" d="M88 368 C150 360 204 336 258 306 S356 240 420 196" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <path d="M88 368 C150 360 204 336 258 306 S356 240 420 196 L420 380 L88 380 Z" fill="#fecaca" opacity=".3"/>
  <path class="p85-reserve" d="M88 226 C150 232 204 258 258 288 S356 344 420 356" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>
  <circle cx="420" cy="196" r="4.5" fill="#dc2626"/>
  <circle cx="420" cy="356" r="4.5" fill="#1d4ed8"/>
  <text x="408" y="184" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">能源消耗</text>
  <text x="408" y="374" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">化石能源储量</text>
  <text x="250" y="326" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">需求越来越大</text>
  <text x="250" y="282" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">越用越少</text>

  <rect x="480" y="110" width="386" height="310" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="500" y="124" width="184" height="28" rx="14" fill="#fef2f2"/>
  <text x="592" y="143" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">燃烧化石能源的代价</text>

  <line x1="500" y1="390" x2="846" y2="390" stroke="#94a3b8" stroke-width="2"/>
  <rect x="536" y="300" width="180" height="90" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="548" y="270" width="156" height="30" rx="3" fill="#94a3b8"/>
  <rect x="558" y="200" width="26" height="100" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="608" y="170" width="26" height="130" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="658" y="210" width="26" height="90" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#64748b" opacity=".5">
    <rect x="594" y="330" width="22" height="24"/><rect x="628" y="330" width="22" height="24"/>
    <rect x="662" y="330" width="22" height="24"/><rect x="696" y="330" width="22" height="24"/>
  </g>
  <g fill="#cbd5e1">
    <circle class="p85-smoke" cx="571" cy="184" r="18"/>
    <circle class="p85-smoke p85-smoke2" cx="621" cy="152" r="22"/>
    <circle class="p85-smoke p85-smoke3" cx="671" cy="194" r="17"/>
  </g>
  <text x="621" y="156" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">CO₂</text>
  <g class="p85-warn" stroke="#dc2626" stroke-width="2" opacity=".7">
    <path d="M760 300 Q776 286 792 300" fill="none"/>
    <path d="M752 316 Q776 296 800 316" fill="none"/>
  </g>
  <text x="673" y="414" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">废气、粉尘、温室气体</text>
  <text x="500" y="236" font-size="11.5" fill="#475569">工厂排放</text>

  <text x="450" y="450" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">能源危机与环境污染，是全球面临的共同挑战</text>
</g>

<!-- 第二步：可持续发展 -->
<g class="p85-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">可持续发展：既满足当代人的需求，又不损害后代人的需求</text>

  <g class="p85-def">
    <rect x="78" y="112" width="744" height="96" rx="16" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="152" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">既满足当代人的需求，又不损害后代人满足其需求的能力</text>
    <text x="450" y="180" font-size="11.5" fill="#64748b" text-anchor="middle">这就是可持续发展的含义</text>
  </g>

  <g class="p85-scale">
    <line x1="450" y1="282" x2="450" y2="376" stroke="#475569" stroke-width="4"/>
    <polygon points="450,282 438,306 462,306" fill="#1e3a8a"/>
    <line x1="300" y1="282" x2="600" y2="282" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="450" cy="282" r="7" fill="#1e3a8a"/>
    <line x1="320" y1="282" x2="312" y2="330" stroke="#64748b" stroke-width="2"/>
    <line x1="320" y1="282" x2="328" y2="330" stroke="#64748b" stroke-width="2"/>
    <path d="M302 330 Q320 348 338 330" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="580" y1="282" x2="572" y2="330" stroke="#64748b" stroke-width="2"/>
    <line x1="580" y1="282" x2="588" y2="330" stroke="#64748b" stroke-width="2"/>
    <path d="M562 330 Q580 348 598 330" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <rect x="424" y="376" width="52" height="10" rx="5" fill="#475569"/>
    <text x="320" y="362" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">当代人</text>
    <text x="580" y="362" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">后代人</text>
    <text x="450" y="398" font-size="11.5" fill="#64748b" text-anchor="middle">发展不能透支未来</text>
  </g>

  <g class="p85-chip">
    <rect x="90" y="408" width="220" height="38" rx="19" fill="#e8effc"/>
    <text x="200" y="433" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 节约能源</text>
  </g>
  <g class="p85-chip p85-chip2">
    <rect x="340" y="408" width="220" height="38" rx="19" fill="#e8effc"/>
    <text x="450" y="433" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 提高能源利用率</text>
  </g>
  <g class="p85-chip p85-chip3">
    <rect x="590" y="408" width="220" height="38" rx="19" fill="#e8effc"/>
    <text x="700" y="433" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 优化能源结构</text>
  </g>
  <text x="450" y="462" font-size="12" fill="#64748b" text-anchor="middle">节约资源、保护环境，让发展能够持续下去</text>
</g>

<!-- 第三步：新能源 -->
<g class="p85-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">开发新能源：太阳能、风能、水能、地热能、潮汐能</text>

  <g class="p85-card">
    <rect x="48" y="120" width="148" height="230" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#softShadow)"/>
    <circle class="p85-sun" cx="122" cy="186" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="122" y1="152" x2="122" y2="160"/><line x1="122" y1="212" x2="122" y2="220"/>
      <line x1="88" y1="186" x2="96" y2="186"/><line x1="148" y1="186" x2="156" y2="186"/>
    </g>
    <text x="122" y="274" font-size="13.5" font-weight="800" fill="#92400e" text-anchor="middle">太阳能</text>
    <text x="122" y="300" font-size="11.5" fill="#7c5a30" text-anchor="middle">光伏 · 光热</text>
    <text x="122" y="322" font-size="11.5" fill="#7c5a30" text-anchor="middle">清洁可再生</text>
  </g>

  <g class="p85-card p85-card2">
    <rect x="212" y="120" width="148" height="230" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#softShadow)"/>
    <line x1="286" y1="180" x2="286" y2="226" stroke="#475569" stroke-width="4"/>
    <g class="p85-blade" fill="#34d399" stroke="#059669" stroke-width="1.5">
      <path d="M286 180 L278 150 L288 148 Z"/>
      <path d="M286 180 L314 198 L308 206 Z"/>
      <path d="M286 180 L258 198 L264 206 Z"/>
    </g>
    <circle cx="286" cy="180" r="4.5" fill="#065f46"/>
    <text x="286" y="274" font-size="13.5" font-weight="800" fill="#047857" text-anchor="middle">风能</text>
    <text x="286" y="300" font-size="11.5" fill="#065f46" text-anchor="middle">风力发电</text>
    <text x="286" y="322" font-size="11.5" fill="#065f46" text-anchor="middle">清洁可再生</text>
  </g>

  <g class="p85-card p85-card3">
    <rect x="376" y="120" width="148" height="230" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M406 214 L442 214 L456 178 L420 178 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="406" y1="214" x2="456" y2="214" stroke="#1d4ed8" stroke-width="3"/>
    <g stroke="#60a5fa" stroke-width="2">
      <path d="M400 226 Q412 220 424 226 T448 226 T472 226"/>
      <path d="M400 240 Q412 234 424 240 T448 240 T472 240"/>
    </g>
    <text x="450" y="274" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">水能</text>
    <text x="450" y="300" font-size="11.5" fill="#1e3a8a" text-anchor="middle">水力发电</text>
    <text x="450" y="322" font-size="11.5" fill="#1e3a8a" text-anchor="middle">清洁可再生</text>
  </g>

  <g class="p85-card p85-card4">
    <rect x="540" y="120" width="148" height="230" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M560 232 Q614 212 668 232" fill="none" stroke="#a16207" stroke-width="3"/>
    <path d="M560 232 L668 232 L668 250 L560 250 Z" fill="#d6d3d1" stroke="#a8a29e" stroke-width="1.5"/>
    <g stroke="#94a3b8" stroke-width="2">
      <path d="M586 208 Q592 190 602 198" fill="none"/>
      <path d="M614 204 Q622 184 634 194" fill="none"/>
      <path d="M600 190 Q606 172 618 180" fill="none"/>
    </g>
    <line x1="614" y1="232" x2="614" y2="262" stroke="#78716c" stroke-width="3"/>
    <text x="614" y="274" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">地热能</text>
    <text x="614" y="300" font-size="11.5" fill="#7f1d1d" text-anchor="middle">供暖 · 发电</text>
    <text x="614" y="322" font-size="11.5" fill="#7f1d1d" text-anchor="middle">稳定可循环</text>
  </g>

  <g class="p85-card p85-card5">
    <rect x="704" y="120" width="148" height="230" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M752 166 A22 22 0 1 0 752 210 A17 17 0 1 1 752 166 Z" fill="#fde047" stroke="#d97706" stroke-width="1.5"/>
    <g stroke="#0891b2" stroke-width="3" fill="none">
      <path d="M722 214 Q734 204 746 214 T770 214 T794 214"/>
      <path d="M722 232 Q734 222 746 232 T770 232 T794 232"/>
      <path d="M722 250 Q734 240 746 250 T770 250 T794 250"/>
    </g>
    <text x="778" y="274" font-size="13.5" font-weight="800" fill="#0e7490" text-anchor="middle">潮汐能</text>
    <text x="778" y="300" font-size="11.5" fill="#155e75" text-anchor="middle">潮汐发电</text>
    <text x="778" y="322" font-size="11.5" fill="#155e75" text-anchor="middle">清洁可再生</text>
  </g>

  <rect x="60" y="368" width="780" height="54" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="450" y="401" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">减少化石能源依赖 → 保护环境，实现可持续发展</text>
  <text x="450" y="448" font-size="12" fill="#64748b" text-anchor="middle">新能源让能源结构更清洁、更多元</text>
</g>
</svg>
