<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电动机：通电导线受力、换向器、电能转化为机械能">
<style>
.p76-s1,.p76-s2,.p76-s3{opacity:0;visibility:hidden}
.p76-s1{opacity:1;visibility:visible}
[data-scene="pj-76"] .p76-s1,[data-scene="pj-76"] .p76-s2,[data-scene="pj-76"] .p76-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-76"].s1 .p76-s1,[data-scene="pj-76"].s2 .p76-s2,[data-scene="pj-76"].s3 .p76-s3{opacity:1;visibility:visible}
@keyframes p76flow{to{stroke-dashoffset:-42}}
@keyframes p76pop{0%{transform:scale(.8);opacity:0}72%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p76draw{to{stroke-dashoffset:0}}
@keyframes p76glow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes p76spin{to{transform:rotate(360deg)}}
@keyframes p76grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
[data-scene="pj-76"].s1 .p76-field{stroke-dasharray:9 7;animation:p76flow 1.4s linear infinite}
[data-scene="pj-76"].s1 .p76-force{stroke-dasharray:120;stroke-dashoffset:120;animation:p76draw .9s ease .2s forwards}
[data-scene="pj-76"].s1 .p76-cur{transform-box:fill-box;transform-origin:center;animation:p76glow 1.8s ease-in-out infinite}
[data-scene="pj-76"].s2 .p76-coil{transform-box:fill-box;transform-origin:center;animation:p76pop .55s ease both}
[data-scene="pj-76"].s2 .p76-ring{stroke-dasharray:180;stroke-dashoffset:180;animation:p76draw 1s ease .2s forwards}
[data-scene="pj-76"].s2 .p76-rot{animation:p76spin 3.2s linear infinite;transform-box:fill-box;transform-origin:center}
[data-scene="pj-76"].s3 .p76-box{transform-box:fill-box;transform-origin:center;animation:p76pop .55s ease both}
[data-scene="pj-76"].s3 .p76-box2{animation-delay:.15s}
[data-scene="pj-76"].s3 .p76-box3{animation-delay:.3s}
[data-scene="pj-76"].s3 .p76-bar{transform-box:fill-box;transform-origin:left center;animation:p76grow 1.1s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电动机：通电线圈在磁场中受力转动</text>

<!-- 第一步：通电导线受力 -->
<g class="p76-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">通电导线在磁场中受到力的作用</text>

  <rect x="36" y="100" width="560" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="90" y="170" width="80" height="130" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="130" y="245" font-size="28" font-weight="900" fill="#dc2626" text-anchor="middle">N</text>
  <rect x="410" y="170" width="80" height="130" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="245" font-size="28" font-weight="900" fill="#1d4ed8" text-anchor="middle">S</text>

  <g class="p76-field" stroke="#1d4ed8" stroke-width="2.5">
    <line x1="176" y1="196" x2="402" y2="196" marker-end="url(#arrBlue)"/>
    <line x1="176" y1="216" x2="402" y2="216" marker-end="url(#arrBlue)"/>
    <line x1="176" y1="256" x2="402" y2="256" marker-end="url(#arrBlue)"/>
    <line x1="176" y1="276" x2="402" y2="276" marker-end="url(#arrBlue)"/>
  </g>
  <text x="398" y="186" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">磁感线</text>

  <line class="p76-force" x1="290" y1="210" x2="290" y2="136" stroke="#059669" stroke-width="5" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="304" y="158" font-size="14" font-weight="900" fill="#047857">F</text>
  <text x="304" y="178" font-size="11.5" font-weight="700" fill="#047857">受力方向</text>

  <g class="p76-cur">
    <circle cx="290" cy="235" r="21" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <line x1="281" y1="226" x2="299" y2="244" stroke="#dc2626" stroke-width="3"/>
    <line x1="299" y1="226" x2="281" y2="244" stroke="#dc2626" stroke-width="3"/>
  </g>
  <text x="290" y="324" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">电流 ⊗ 垂直纸面向里</text>
  <text x="290" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">导线垂直于纸面放置</text>

  <rect x="616" y="100" width="248" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="636" y="116" width="150" height="30" rx="15" fill="#e8effc"/>
  <text x="711" y="136" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验结论</text>
  <g font-size="12.5" font-weight="700" fill="#334155">
    <text x="650" y="180">① 通电导线在磁场中受力</text>
    <text x="650" y="222">② 力方向与电流方向有关</text>
    <text x="650" y="264">③ 力方向与磁场方向有关</text>
    <text x="650" y="306">④ 电动机由此原理制成</text>
  </g>
  <rect x="636" y="334" width="208" height="72" rx="12" fill="#e6f7f1"/>
  <text x="740" y="360" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">改变电流方向或磁场方向</text>
  <text x="740" y="384" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">导线受力方向随之改变</text>
</g>

<!-- 第二步：换向器 -->
<g class="p76-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">换向器：线圈转过平衡位置时自动改变电流方向</text>

  <rect x="36" y="100" width="406" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="239" y="126" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">状态一：线圈中的电流方向</text>

  <rect x="56" y="170" width="44" height="130" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="78" y="245" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">N</text>
  <rect x="338" y="170" width="44" height="130" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="360" y="245" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">S</text>

  <g class="p76-coil">
    <rect x="150" y="165" width="130" height="130" fill="none" stroke="#b45309" stroke-width="5"/>
    <polygon points="145,205 155,205 150,218" fill="#dc2626"/>
    <polygon points="275,290 285,290 280,277" fill="#dc2626"/>
    <text x="132" y="196" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="end">电流</text>
    <text x="215" y="150" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">线圈</text>
  </g>

  <g class="p76-ring">
    <path d="M190 345 A27 27 0 0 1 244 345" fill="none" stroke="#b45309" stroke-width="7"/>
    <path d="M244 345 A27 27 0 0 1 190 345" fill="none" stroke="#64748b" stroke-width="7"/>
  </g>
  <line x1="217" y1="295" x2="217" y2="318" stroke="#64748b" stroke-width="3"/>
  <rect x="158" y="338" width="26" height="16" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <rect x="248" y="338" width="26" height="16" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <line x1="171" y1="354" x2="171" y2="392" stroke="#334155" stroke-width="3"/>
  <line x1="261" y1="354" x2="261" y2="392" stroke="#334155" stroke-width="3"/>
  <text x="217" y="390" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">换向器</text>
  <text x="150" y="412" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">电刷</text>
  <text x="217" y="416" font-size="11" fill="#64748b" text-anchor="middle">两个半圆环</text>

  <rect x="458" y="100" width="406" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="661" y="126" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">状态二：越过平衡位置后</text>

  <rect x="478" y="170" width="44" height="130" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="245" font-size="20" font-weight="900" fill="#dc2626" text-anchor="middle">N</text>
  <rect x="760" y="170" width="44" height="130" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="782" y="245" font-size="20" font-weight="900" fill="#1d4ed8" text-anchor="middle">S</text>

  <g class="p76-coil">
    <rect x="572" y="165" width="130" height="130" fill="none" stroke="#b45309" stroke-width="5"/>
    <polygon points="567,290 577,290 572,277" fill="#dc2626"/>
    <polygon points="697,205 707,205 702,218" fill="#dc2626"/>
    <text x="710" y="196" font-size="11.5" font-weight="700" fill="#b91c1c">电流已反向</text>
  </g>

  <g class="p76-ring">
    <path d="M612 345 A27 27 0 0 1 666 345" fill="none" stroke="#64748b" stroke-width="7"/>
    <path d="M666 345 A27 27 0 0 1 612 345" fill="none" stroke="#b45309" stroke-width="7"/>
  </g>
  <line x1="639" y1="295" x2="639" y2="318" stroke="#64748b" stroke-width="3"/>
  <rect x="580" y="338" width="26" height="16" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <rect x="670" y="338" width="26" height="16" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <line x1="593" y1="354" x2="593" y2="392" stroke="#334155" stroke-width="3"/>
  <line x1="683" y1="354" x2="683" y2="392" stroke="#334155" stroke-width="3"/>
  <text x="639" y="390" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">换向器</text>
  <text x="639" y="416" font-size="11" fill="#64748b" text-anchor="middle">电流方向改变，线圈继续转动</text>

  <rect x="36" y="444" width="828" height="44" rx="14" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="471" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">换向器每转半圈改变一次电流方向，线圈就能连续转动</text>
</g>

<!-- 第三步：能量转化 -->
<g class="p76-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电动机工作时：电能主要转化为机械能</text>

  <rect x="36" y="100" width="828" height="340" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="p76-box">
    <rect x="90" y="130" width="180" height="70" rx="14" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="180" y="163" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">电能</text>
    <text x="180" y="185" font-size="11" fill="#475569" text-anchor="middle">电源提供</text>
  </g>
  <line x1="278" y1="165" x2="348" y2="165" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrBlue)"/>

  <g class="p76-box p76-box2">
    <rect x="360" y="130" width="180" height="70" rx="14" fill="#fef3c7" stroke="#fdba74" stroke-width="2"/>
    <text x="450" y="163" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">电动机</text>
    <text x="450" y="185" font-size="11" fill="#92400e" text-anchor="middle">通电线圈受力转动</text>
  </g>
  <line x1="548" y1="165" x2="618" y2="165" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrBlue)"/>

  <g class="p76-box p76-box3">
    <rect x="630" y="130" width="180" height="70" rx="14" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="2"/>
    <text x="720" y="163" font-size="17" font-weight="900" fill="#047857" text-anchor="middle">机械能</text>
    <text x="720" y="185" font-size="11" fill="#047857" text-anchor="middle">带动机械工作</text>
  </g>

  <text x="90" y="244" font-size="12.5" font-weight="800" fill="#1e3a8a">能量流向</text>
  <rect x="90" y="254" width="740" height="30" rx="15" fill="#eef2f7"/>
  <rect class="p76-bar" x="90" y="254" width="607" height="30" rx="15" fill="#86efac"/>
  <text x="390" y="275" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">机械能（大部分）</text>
  <text x="772" y="275" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">内能</text>
  <text x="90" y="304" font-size="11.5" fill="#64748b">电动机效率较高，能量损失少；通过改变电流大小可以方便地调节转速</text>

  <g class="p76-box">
    <rect x="90" y="322" width="216" height="96" rx="12" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="198" y="350" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">转速可调</text>
    <text x="198" y="376" font-size="11.5" fill="#475569" text-anchor="middle">改变电流大小</text>
    <text x="198" y="398" font-size="11.5" fill="#475569" text-anchor="middle">就能改变转速</text>
  </g>
  <g class="p76-box p76-box2">
    <rect x="342" y="322" width="216" height="96" rx="12" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="450" y="350" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">效率较高</text>
    <text x="450" y="376" font-size="11.5" fill="#475569" text-anchor="middle">电能大部分转化为</text>
    <text x="450" y="398" font-size="11.5" fill="#475569" text-anchor="middle">有用的机械能</text>
  </g>
  <g class="p76-box p76-box3">
    <rect x="594" y="322" width="216" height="96" rx="12" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="702" y="350" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">应用广泛</text>
    <text x="702" y="376" font-size="11.5" fill="#475569" text-anchor="middle">电风扇、电动车</text>
    <text x="702" y="398" font-size="11.5" fill="#475569" text-anchor="middle">洗衣机、电梯</text>
  </g>

  <rect x="36" y="452" width="828" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="477" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电动机：通电导线在磁场中受力 → 线圈转动 → 输出机械能</text>
</g>
</svg>
