<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="光的反射：入射光线、法线、反射光线与两角相等">
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="48" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">光的反射：入射角等于反射角</text>

  <!-- 平面镜 -->
  <g class="p1-mirror">
    <rect x="110" y="424" width="680" height="12" rx="3" fill="#cbd5e1"/>
    <rect x="110" y="424" width="680" height="4" rx="2" fill="#e2e8f0"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <line x1="130" y1="452" x2="146" y2="436"/><line x1="170" y1="452" x2="186" y2="436"/>
      <line x1="210" y1="452" x2="226" y2="436"/><line x1="250" y1="452" x2="266" y2="436"/>
      <line x1="290" y1="452" x2="306" y2="436"/><line x1="330" y1="452" x2="346" y2="436"/>
      <line x1="370" y1="452" x2="386" y2="436"/><line x1="410" y1="452" x2="426" y2="436"/>
      <line x1="450" y1="452" x2="466" y2="436"/><line x1="490" y1="452" x2="506" y2="436"/>
      <line x1="530" y1="452" x2="546" y2="436"/><line x1="570" y1="452" x2="586" y2="436"/>
      <line x1="610" y1="452" x2="626" y2="436"/><line x1="650" y1="452" x2="666" y2="436"/>
      <line x1="690" y1="452" x2="706" y2="436"/><line x1="730" y1="452" x2="746" y2="436"/>
      <line x1="770" y1="452" x2="786" y2="436"/>
    </g>
    <text x="776" y="464" font-size="14" font-weight="700" fill="#64748b" text-anchor="end">平面镜 M</text>
  </g>

  <!-- 法线 -->
  <g class="p1-normal">
    <line x1="450" y1="430" x2="450" y2="118" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="450" y="104" font-size="15" font-weight="800" fill="#475569" text-anchor="middle">法线 N</text>
    <circle cx="450" cy="430" r="5" fill="#334155"/>
    <text x="466" y="456" font-size="14" font-weight="800" fill="#334155">O</text>
  </g>

  <!-- 入射光线 -->
  <g class="p1-rayA" data-zone="1">
    <line x1="240" y1="170" x2="450" y2="430" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <text x="226" y="152" font-size="15" font-weight="800" fill="#b91c1c" text-anchor="end">入射光线 AO</text>
    <path d="M450 340 A90 90 0 0 0 395.8 358.1" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="401" y="330" font-size="18" font-weight="900" fill="#b91c1c">i</text>
    <text x="357" y="322" font-size="13" font-weight="700" fill="#b91c1c">45°</text>
  </g>

  <!-- 反射光线 -->
  <g class="p1-rayB" data-zone="2">
    <line x1="450" y1="430" x2="660" y2="170" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrBlue)"/>
    <text x="676" y="152" font-size="15" font-weight="800" fill="#1e40af">反射光线 OB</text>
    <path d="M450 340 A90 90 0 0 1 504.2 358.1" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="509" y="330" font-size="18" font-weight="900" fill="#1e40af">r</text>
    <text x="546" y="322" font-size="13" font-weight="700" fill="#1e40af">45°</text>
  </g>

  <!-- 第三步：反射定律总结 -->
  <g class="p1-panel" data-zone="3">
    <rect x="110" y="492" width="680" height="104" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="520" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">反射定律 · 三句话记牢</text>
    <g font-size="13.5" font-weight="700" fill="#334155">
      <rect x="130" y="534" width="196" height="42" rx="10" fill="#e8effc"/>
      <text x="228" y="560" text-anchor="middle">① 三线共面</text>
      <rect x="342" y="534" width="216" height="42" rx="10" fill="#e8effc"/>
      <text x="450" y="560" text-anchor="middle">② 分居法线两侧</text>
      <rect x="574" y="534" width="196" height="42" rx="10" fill="#e8effc"/>
      <text x="672" y="560" text-anchor="middle">③ r = i</text>
    </g>
    <text x="450" y="586" font-size="12" fill="#64748b" text-anchor="middle">镜面反射与漫反射都遵守反射定律 · 光路可逆</text>
  </g>
</svg>
