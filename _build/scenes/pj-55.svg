<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电流和电路：电流方向、电路组成与通路断路短路">
  <style>
    [data-scene="pj-55"] .p55-s1,[data-scene="pj-55"] .p55-s2,[data-scene="pj-55"] .p55-s3{opacity:0;visibility:hidden}
    [data-scene="pj-55"].s1 .p55-s1,[data-scene="pj-55"].s2 .p55-s2,[data-scene="pj-55"].s3 .p55-s3{opacity:1;visibility:visible;animation:p55fade .45s ease both}
    @keyframes p55fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes p55flow{to{stroke-dashoffset:-42}}
    @keyframes p55glow{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes p55danger{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes p55emove{0%{transform:translateX(12px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(-34px);opacity:0}}
    [data-scene="pj-55"] .p55-flow{stroke-dasharray:7 6;animation:p55flow 1.1s linear infinite}
    [data-scene="pj-55"].s1 .p55-glow{animation:p55glow 1.8s ease-in-out infinite}
    [data-scene="pj-55"].s2 .p55-glow{animation:p55glow 1.8s ease-in-out infinite}
    [data-scene="pj-55"].s3 .p55-on .p55-glow{animation:p55glow 1.6s ease-in-out infinite}
    [data-scene="pj-55"].s3 .p55-danger{animation:p55danger 1.2s ease-in-out infinite}
    [data-scene="pj-55"] .p55-e{animation:p55emove 1.7s linear infinite}
    [data-scene="pj-55"] .p55-e2{animation-delay:.35s}
    [data-scene="pj-55"] .p55-e3{animation-delay:.7s}
    [data-scene="pj-55"] .p55-e4{animation-delay:1.05s}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电流和电路：电流方向、电路组成与三种状态</text>

  <!-- 第一步：电流方向 -->
  <g class="p55-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电流：电荷的定向移动形成电流，正电荷移动方向规定为电流方向</text>

    <rect x="36" y="100" width="446" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="60" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">闭合电路中的电流方向</text>

    <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M120 250 L120 190 L230 190"/>
      <path d="M292 190 L380 190 L380 255"/>
      <path d="M380 305 L380 370 L120 370 L120 315"/>
    </g>
    <g class="p55-flow" stroke="#dc2626" stroke-width="2" fill="none" opacity=".75">
      <path d="M120 250 L120 190 L230 190"/>
      <path d="M292 190 L380 190 L380 255"/>
      <path d="M380 305 L380 370 L120 370 L120 315"/>
    </g>

    <line x1="100" y1="252" x2="140" y2="252" stroke="#334155" stroke-width="3"/>
    <line x1="108" y1="265" x2="132" y2="265" stroke="#334155" stroke-width="6"/>
    <text x="146" y="248" font-size="12" font-weight="900" fill="#dc2626">+</text>
    <text x="146" y="275" font-size="12" font-weight="900" fill="#1d4ed8">−</text>
    <text x="96" y="300" font-size="12" font-weight="700" fill="#475569" text-anchor="end">电源</text>

    <circle cx="380" cy="280" r="25" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="362" y1="262" x2="398" y2="298" stroke="#d97706" stroke-width="2.5"/>
    <line x1="398" y1="262" x2="362" y2="298" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p55-glow" cx="380" cy="280" r="32" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="420" y="285" font-size="12" font-weight="700" fill="#475569">灯泡</text>

    <circle cx="230" cy="190" r="4" fill="#475569"/>
    <circle cx="292" cy="190" r="4" fill="#475569"/>
    <line x1="232" y1="190" x2="292" y2="186" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <text x="261" y="166" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">开关</text>

    <g stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
      <line x1="120" y1="235" x2="120" y2="205"/>
      <line x1="330" y1="190" x2="356" y2="190"/>
      <line x1="380" y1="218" x2="380" y2="246"/>
      <line x1="300" y1="370" x2="272" y2="370"/>
    </g>
    <g font-size="13" font-weight="900" fill="#b91c1c">
      <text x="132" y="224">I</text>
      <text x="340" y="180">I</text>
      <text x="392" y="238">I</text>
      <text x="282" y="384">I</text>
    </g>
    <text x="259" y="414" font-size="12" fill="#64748b" text-anchor="middle">电源外部：电流由正极流向负极</text>

    <rect x="500" y="100" width="364" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="682" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">金属导体内部</text>

    <rect x="520" y="176" width="324" height="152" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <g font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">
      <text x="556" y="214">+</text><text x="606" y="214">+</text><text x="656" y="214">+</text>
      <text x="706" y="214">+</text><text x="756" y="214">+</text><text x="806" y="214">+</text>
      <text x="556" y="270">+</text><text x="606" y="270">+</text><text x="656" y="270">+</text>
      <text x="706" y="270">+</text><text x="756" y="270">+</text><text x="806" y="270">+</text>
      <text x="556" y="318">+</text><text x="606" y="318">+</text><text x="656" y="318">+</text>
      <text x="706" y="318">+</text><text x="756" y="318">+</text><text x="806" y="318">+</text>
    </g>

    <g class="p55-e">
      <circle cx="576" cy="240" r="10" fill="#1d4ed8"/><text x="576" y="245" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">−</text>
    </g>
    <g class="p55-e p55-e2">
      <circle cx="636" cy="292" r="10" fill="#1d4ed8"/><text x="636" y="297" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">−</text>
    </g>
    <g class="p55-e p55-e3">
      <circle cx="696" cy="240" r="10" fill="#1d4ed8"/><text x="696" y="245" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">−</text>
    </g>
    <g class="p55-e p55-e4">
      <circle cx="766" cy="292" r="10" fill="#1d4ed8"/><text x="766" y="297" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">−</text>
    </g>

    <line x1="796" y1="162" x2="548" y2="162" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
    <text x="682" y="154" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">自由电子（−）移动方向</text>

    <line x1="542" y1="368" x2="822" y2="368" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="682" y="394" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">电流 I 的方向</text>
    <text x="682" y="424" font-size="11.5" fill="#64748b" text-anchor="middle">电子带负电，移动方向与电流方向相反</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="514" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电流方向的规定</text>
    <g font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <rect x="58" y="528" width="244" height="42" rx="10" fill="#e8effc"/>
      <text x="180" y="555">电荷定向移动形成电流</text>
      <rect x="328" y="528" width="244" height="42" rx="10" fill="#e8effc"/>
      <text x="450" y="555">正电荷移动方向为电流方向</text>
      <rect x="598" y="528" width="244" height="42" rx="10" fill="#e8effc"/>
      <text x="720" y="555">金属中电子移动方向相反</text>
    </g>
  </g>

  <!-- 第二步：电路组成 -->
  <g class="p55-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电路四部分：电源、用电器、开关、导线，缺一不可</text>

    <g>
      <rect x="50" y="104" width="200" height="148" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
      <line x1="105" y1="158" x2="195" y2="158" stroke="#334155" stroke-width="3"/>
      <line x1="120" y1="176" x2="180" y2="176" stroke="#334155" stroke-width="6"/>
      <text x="200" y="152" font-size="12" font-weight="900" fill="#dc2626">+</text>
      <text x="200" y="190" font-size="12" font-weight="900" fill="#1d4ed8">−</text>
      <text x="150" y="214" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电源</text>
      <text x="150" y="234" font-size="11.5" fill="#64748b" text-anchor="middle">提供电能</text>
    </g>

    <g>
      <rect x="270" y="104" width="200" height="148" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
      <circle cx="370" cy="164" r="22" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
      <line x1="354" y1="148" x2="386" y2="180" stroke="#d97706" stroke-width="2.5"/>
      <line x1="386" y1="148" x2="354" y2="180" stroke="#d97706" stroke-width="2.5"/>
      <text x="370" y="214" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">用电器</text>
      <text x="370" y="234" font-size="11.5" fill="#64748b" text-anchor="middle">消耗电能</text>
    </g>

    <g>
      <rect x="490" y="104" width="200" height="148" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
      <circle cx="542" cy="170" r="4" fill="#475569"/>
      <circle cx="604" cy="170" r="4" fill="#475569"/>
      <line x1="544" y1="170" x2="606" y2="158" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <text x="590" y="214" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">开关</text>
      <text x="590" y="234" font-size="11.5" fill="#64748b" text-anchor="middle">控制电路</text>
    </g>

    <g>
      <rect x="710" y="104" width="200" height="148" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" filter="url(#softShadow)"/>
      <path d="M750 170 L790 170 L790 150 L830 150" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
      <circle cx="750" cy="170" r="4" fill="#475569"/>
      <circle cx="830" cy="150" r="4" fill="#475569"/>
      <text x="810" y="214" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">导线</text>
      <text x="810" y="234" font-size="11.5" fill="#64748b" text-anchor="middle">连接各部分</text>
    </g>

    <text x="450" y="292" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">四个部分连成闭合回路，电路中才有电流</text>

    <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M150 355 L150 300 L420 300"/>
      <path d="M480 300 L750 300 L750 355"/>
      <path d="M750 405 L750 430 L150 430 L150 367"/>
    </g>
    <line x1="130" y1="355" x2="170" y2="355" stroke="#334155" stroke-width="3"/>
    <line x1="138" y1="367" x2="162" y2="367" stroke="#334155" stroke-width="6"/>
    <circle cx="750" cy="380" r="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="733" y1="363" x2="767" y2="397" stroke="#d97706" stroke-width="2.5"/>
    <line x1="767" y1="363" x2="733" y2="397" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p55-glow" cx="750" cy="380" r="31" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="420" cy="300" r="4" fill="#475569"/>
    <circle cx="480" cy="300" r="4" fill="#475569"/>
    <line x1="422" y1="300" x2="480" y2="298" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <g class="p55-flow" stroke="#dc2626" stroke-width="2" fill="none" opacity=".7">
      <path d="M150 367 L150 300 L420 300"/>
      <path d="M480 300 L750 300 L750 355"/>
      <path d="M750 405 L750 430 L150 430 L150 355"/>
    </g>

    <g font-size="12" font-weight="700" fill="#475569" text-anchor="middle">
      <text x="150" y="456">电源</text>
      <text x="450" y="456">导线</text>
      <text x="750" y="456">用电器</text>
      <text x="450" y="330" fill="#64748b">开关</text>
    </g>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电路的四部分组成</text>
    <g font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <rect x="58" y="530" width="190" height="40" rx="10" fill="#e8effc"/><text x="153" y="556">电源：提供电能</text>
      <rect x="266" y="530" width="190" height="40" rx="10" fill="#e8effc"/><text x="361" y="556">用电器：消耗电能</text>
      <rect x="474" y="530" width="190" height="40" rx="10" fill="#e8effc"/><text x="569" y="556">开关：控制电路</text>
      <rect x="682" y="530" width="160" height="40" rx="10" fill="#e8effc"/><text x="762" y="556">导线：连接</text>
    </g>
  </g>

  <!-- 第三步：三种状态 -->
  <g class="p55-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">三种状态：通路用电器工作，断路不工作，短路会烧坏电源</text>

    <g class="p55-on">
      <rect x="36" y="100" width="260" height="344" rx="16" fill="#ffffff" stroke="#a7f3d0" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="72" y="114" width="188" height="30" rx="15" fill="#d1fae5"/>
      <text x="166" y="134" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">通路</text>

      <g stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M74 170 L108 170"/><path d="M152 170 L222 170"/>
        <path d="M74 170 L74 330"/><path d="M222 170 L222 240"/>
        <path d="M222 270 L222 330"/><path d="M74 330 L118 330"/>
        <path d="M130 330 L222 330"/>
      </g>
      <line x1="118" y1="314" x2="118" y2="346" stroke="#334155" stroke-width="3"/>
      <line x1="130" y1="320" x2="130" y2="340" stroke="#334155" stroke-width="6"/>
      <text x="112" y="308" font-size="11" font-weight="900" fill="#dc2626">+</text>
      <text x="138" y="308" font-size="11" font-weight="900" fill="#1d4ed8">−</text>

      <circle cx="130" cy="170" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <line x1="114" y1="154" x2="146" y2="186" stroke="#d97706" stroke-width="2.5"/>
      <line x1="146" y1="154" x2="114" y2="186" stroke="#d97706" stroke-width="2.5"/>
      <circle class="p55-glow" cx="130" cy="170" r="30" fill="none" stroke="#fbbf24" stroke-width="3"/>

      <circle cx="222" cy="240" r="4" fill="#475569"/>
      <circle cx="222" cy="270" r="4" fill="#475569"/>
      <line x1="222" y1="240" x2="222" y2="270" stroke="#475569" stroke-width="3.5"/>
      <text x="130" y="380" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">通路</text>
      <text x="130" y="406" font-size="11.5" fill="#334155" text-anchor="middle">处处连通，灯亮工作</text>
    </g>

    <g class="p55-off">
      <rect x="320" y="100" width="260" height="344" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="356" y="114" width="188" height="30" rx="15" fill="#fef3c7"/>
      <text x="450" y="134" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">断路</text>

      <g stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M358 170 L392 170"/><path d="M436 170 L506 170"/>
        <path d="M358 170 L358 330"/><path d="M506 170 L506 240"/>
        <path d="M506 270 L506 330"/><path d="M358 330 L402 330"/>
        <path d="M414 330 L506 330"/>
      </g>
      <line x1="402" y1="314" x2="402" y2="346" stroke="#334155" stroke-width="3"/>
      <line x1="414" y1="320" x2="414" y2="340" stroke="#334155" stroke-width="6"/>
      <text x="396" y="308" font-size="11" font-weight="900" fill="#dc2626">+</text>
      <text x="422" y="308" font-size="11" font-weight="900" fill="#1d4ed8">−</text>

      <circle cx="414" cy="170" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="398" y1="154" x2="430" y2="186" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="430" y1="154" x2="398" y2="186" stroke="#94a3b8" stroke-width="2.5"/>

      <circle cx="506" cy="240" r="4" fill="#475569"/>
      <circle cx="506" cy="270" r="4" fill="#475569"/>
      <line x1="506" y1="270" x2="486" y2="246" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>

      <text x="450" y="380" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">断路</text>
      <text x="450" y="406" font-size="11.5" fill="#334155" text-anchor="middle">某处断开，灯灭不工作</text>
    </g>

    <g class="p55-short">
      <rect x="604" y="100" width="260" height="344" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
      <rect x="640" y="114" width="188" height="30" rx="15" fill="#fee2e2"/>
      <text x="734" y="134" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">短路</text>

      <g stroke="#475569" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M642 170 L676 170"/><path d="M720 170 L790 170"/>
        <path d="M642 170 L642 330"/><path d="M790 170 L790 240"/>
        <path d="M790 270 L790 330"/><path d="M642 330 L686 330"/>
        <path d="M698 330 L790 330"/>
      </g>
      <line x1="686" y1="314" x2="686" y2="346" stroke="#334155" stroke-width="3"/>
      <line x1="698" y1="320" x2="698" y2="340" stroke="#334155" stroke-width="6"/>
      <text x="680" y="308" font-size="11" font-weight="900" fill="#dc2626">+</text>
      <text x="706" y="308" font-size="11" font-weight="900" fill="#1d4ed8">−</text>

      <circle cx="698" cy="170" r="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
      <line x1="682" y1="154" x2="714" y2="186" stroke="#94a3b8" stroke-width="2.5"/>
      <line x1="714" y1="154" x2="682" y2="186" stroke="#94a3b8" stroke-width="2.5"/>

      <circle cx="790" cy="240" r="4" fill="#475569"/>
      <circle cx="790" cy="270" r="4" fill="#475569"/>
      <line x1="790" y1="240" x2="790" y2="270" stroke="#475569" stroke-width="3.5"/>

      <path d="M672 346 L672 374 L712 374 L712 346" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round"/>
      <line x1="672" y1="346" x2="712" y2="346" stroke="#dc2626" stroke-width="5"/>
      <polygon class="p55-danger" points="734,214 760,262 708,262" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
      <text x="734" y="254" font-size="18" font-weight="900" fill="#dc2626" text-anchor="middle">!</text>

      <text x="734" y="380" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">短路</text>
      <text x="734" y="406" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">电流过大，烧坏电源</text>
    </g>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="450" y="516" font-size="14.5" font-weight="900" fill="#b91c1c" text-anchor="middle">短路非常危险：电源两极不经过用电器直接连通</text>
    <text x="450" y="548" font-size="12.5" fill="#7f1d1d" text-anchor="middle">短路时电流很大，会烧坏电源甚至引发火灾，实验中绝对禁止</text>
    <text x="450" y="572" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">连接电路前，开关必须断开</text>
  </g>
</svg>
