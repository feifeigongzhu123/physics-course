<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验测电池电动势和内阻：伏安法电路、U-I 图像截距与斜率、误差分析">
<style>
[data-scene="ps-55"] .s55-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-55"].s1 .s55-step1,[data-scene="ps-55"].s2 .s55-step2,[data-scene="ps-55"].s3 .s55-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s55draw{to{stroke-dashoffset:0}}
@keyframes s55pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s55rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes s55pulse{0%,100%{opacity:.4}50%{opacity:1}}
[data-scene="ps-55"].s1 .s55-loop{stroke-dasharray:1000;stroke-dashoffset:1000;animation:s55draw 1s ease .1s both}
[data-scene="ps-55"].s1 .s55-row{animation:s55rise .4s ease both}
[data-scene="ps-55"].s1 .s55-r1{animation-delay:.2s}
[data-scene="ps-55"].s1 .s55-r2{animation-delay:.3s}
[data-scene="ps-55"].s1 .s55-r3{animation-delay:.4s}
[data-scene="ps-55"].s1 .s55-r4{animation-delay:.5s}
[data-scene="ps-55"].s1 .s55-r5{animation-delay:.6s}
[data-scene="ps-55"].s1 .s55-r6{animation-delay:.7s}
[data-scene="ps-55"].s2 .s55-line{stroke-dasharray:400;stroke-dashoffset:400;animation:s55draw .9s ease .3s both}
[data-scene="ps-55"].s2 .s55-point{transform-box:fill-box;transform-origin:center;animation:s55pop .4s ease both}
[data-scene="ps-55"].s2 .s55-p2{animation-delay:.15s}
[data-scene="ps-55"].s2 .s55-p3{animation-delay:.3s}
[data-scene="ps-55"].s2 .s55-p4{animation-delay:.45s}
[data-scene="ps-55"].s2 .s55-p5{animation-delay:.6s}
[data-scene="ps-55"].s2 .s55-p6{animation-delay:.75s}
[data-scene="ps-55"].s3 .s55-true{stroke-dasharray:320;stroke-dashoffset:320;animation:s55draw .9s ease .2s both}
[data-scene="ps-55"].s3 .s55-meas{stroke-dasharray:320;stroke-dashoffset:320;animation:s55draw .9s ease .7s both}
[data-scene="ps-55"].s3 .s55-card{animation:s55rise .5s ease both}
[data-scene="ps-55"].s3 .s55-c2{animation-delay:.15s}
[data-scene="ps-55"].s3 .s55-glow{animation:s55pulse 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">测电源电动势和内阻：让 U-I 图线说话</text>

<!-- 第一步：伏安法电路与数据 -->
<g class="s55-step s55-step1" data-zone="1">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 伏安法电路与测量数据</text>

  <rect x="46" y="100" width="520" height="370" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <path class="s55-loop" d="M150 160 H218 M262 160 H540 V230 M540 300 V340 H450 M420 340 H150 M150 160 V240 M150 252 V296 M150 322 V340" fill="none" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>
  <line x1="136" y1="240" x2="164" y2="240" stroke="#334155" stroke-width="4"/>
  <line x1="143" y1="252" x2="157" y2="252" stroke="#334155" stroke-width="4"/>
  <rect x="136" y="296" width="28" height="26" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>

  <circle cx="240" cy="160" r="22" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="240" y="168" font-size="17" font-weight="900" fill="#1d4ed8" text-anchor="middle">A</text>
  <circle cx="80" cy="250" r="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="80" y="258" font-size="17" font-weight="900" fill="#1d4ed8" text-anchor="middle">V</text>
  <path d="M80 226 V190 H150 M80 274 V340 H150" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>

  <rect x="528" y="230" width="24" height="70" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <line x1="514" y1="308" x2="566" y2="222" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <line x1="420" y1="340" x2="448" y2="324" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="420" cy="340" r="4" fill="#334155"/>
  <circle cx="450" cy="340" r="4" fill="#334155"/>

  <text x="120" y="300" font-size="12" font-weight="800" fill="#b45309" text-anchor="end">E、r</text>
  <text x="566" y="268" font-size="13" font-weight="800" fill="#92400e" text-anchor="start">R</text>
  <text x="435" y="312" font-size="12" font-weight="800" fill="#64748b" text-anchor="middle">S</text>
  <text x="110" y="460" font-size="11.5" fill="#64748b" text-anchor="middle">电压表测路端电压</text>
  <text x="410" y="460" font-size="11.5" fill="#64748b" text-anchor="middle">电流表测干路电流</text>

  <rect x="580" y="110" width="270" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="596" y="140" font-size="13.5" font-weight="800" fill="#1e3a8a">记录 6 组数据</text>
  <line x1="596" y1="154" x2="834" y2="154" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="648" y="178" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">I / A</text>
  <text x="770" y="178" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">U / V</text>
  <line x1="700" y1="160" x2="700" y2="356" stroke="#e2e8f0" stroke-width="1.5"/>

  <g font-size="12.5" fill="#334155" text-anchor="middle">
    <text class="s55-row s55-r1" x="648" y="206">0.10</text><text class="s55-row s55-r1" x="770" y="206">2.80</text>
    <text class="s55-row s55-r2" x="648" y="234">0.20</text><text class="s55-row s55-r2" x="770" y="234">2.60</text>
    <text class="s55-row s55-r3" x="648" y="262">0.30</text><text class="s55-row s55-r3" x="770" y="262">2.40</text>
    <text class="s55-row s55-r4" x="648" y="290">0.40</text><text class="s55-row s55-r4" x="770" y="290">2.20</text>
    <text class="s55-row s55-r5" x="648" y="318">0.50</text><text class="s55-row s55-r5" x="770" y="318">2.00</text>
    <text class="s55-row s55-r6" x="648" y="346">0.60</text><text class="s55-row s55-r6" x="770" y="346">1.80</text>
  </g>
  <text x="715" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">改变 R，得到不同的 U、I</text>

  <rect x="46" y="492" width="804" height="30" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="512" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表并联在电源两端，电流表串联在干路；滑动变阻器用来改变外电阻</text>
</g>

<!-- 第二步：U-I 图像 -->
<g class="s55-step s55-step2" data-zone="2">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 画 U-I 图线，读截距和斜率</text>

  <rect x="46" y="100" width="540" height="400" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <line x1="110" y1="440" x2="110" y2="130" stroke="#334155" stroke-width="2.5"/>
  <line x1="110" y1="440" x2="540" y2="440" stroke="#334155" stroke-width="2.5"/>
  <text x="94" y="142" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">U/V</text>
  <text x="540" y="462" font-size="13" font-weight="800" fill="#334155" text-anchor="end">I/A</text>
  <text x="94" y="458" font-size="12" fill="#64748b" text-anchor="middle">O</text>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="104" y1="350" x2="110" y2="350"/><line x1="104" y1="260" x2="110" y2="260"/><line x1="104" y1="170" x2="110" y2="170"/>
    <line x1="170" y1="440" x2="170" y2="446"/><line x1="230" y1="440" x2="230" y2="446"/><line x1="290" y1="440" x2="290" y2="446"/>
    <line x1="350" y1="440" x2="350" y2="446"/><line x1="410" y1="440" x2="410" y2="446"/><line x1="470" y1="440" x2="470" y2="446"/>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="98" y="354" text-anchor="end">1.0</text>
    <text x="98" y="264" text-anchor="end">2.0</text>
    <text x="98" y="174" text-anchor="end">3.0</text>
    <text x="170" y="462" text-anchor="middle">0.1</text>
    <text x="230" y="462" text-anchor="middle">0.2</text>
    <text x="290" y="462" text-anchor="middle">0.3</text>
    <text x="350" y="462" text-anchor="middle">0.4</text>
    <text x="410" y="462" text-anchor="middle">0.5</text>
    <text x="470" y="462" text-anchor="middle">0.6</text>
  </g>

  <line class="s55-line" x1="110" y1="170" x2="470" y2="278" stroke="#1d4ed8" stroke-width="3"/>
  <g fill="#dc2626">
    <circle class="s55-point" cx="170" cy="188" r="5"/>
    <circle class="s55-point s55-p2" cx="230" cy="206" r="5"/>
    <circle class="s55-point s55-p3" cx="290" cy="224" r="5"/>
    <circle class="s55-point s55-p4" cx="350" cy="242" r="5"/>
    <circle class="s55-point s55-p5" cx="410" cy="260" r="5"/>
    <circle class="s55-point s55-p6" cx="470" cy="278" r="5"/>
  </g>

  <line x1="290" y1="224" x2="410" y2="224" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="410" y1="224" x2="410" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="350" y="218" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">ΔI = 0.2 A</text>
  <text x="418" y="246" font-size="11" font-weight="700" fill="#64748b" text-anchor="start">ΔU = 0.4 V</text>

  <text x="120" y="158" font-size="12.5" font-weight="800" fill="#1e3a8a">E = 3.0 V</text>
  <circle cx="110" cy="170" r="5" fill="#1d4ed8"/>
  <text x="330" y="330" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">r = |ΔU / ΔI| = 0.4 / 0.2 = 2.0 Ω</text>

  <rect x="600" y="100" width="250" height="400" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="615" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">从图线读两个参数</text>
  <text x="615" y="166" font-size="12" font-weight="800" fill="#1d4ed8">纵轴截距</text>
  <text x="615" y="194" font-size="15" font-weight="900" fill="#1e3a8a">E = 3.0 V</text>
  <line x1="615" y1="212" x2="834" y2="212" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="615" y="240" font-size="12" font-weight="800" fill="#b45309">斜率绝对值</text>
  <text x="615" y="266" font-size="13" font-weight="800" fill="#b45309">r = |ΔU / ΔI|</text>
  <text x="615" y="294" font-size="15" font-weight="900" fill="#b45309">= 2.0 Ω</text>
  <line x1="615" y1="312" x2="834" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="615" y="340" font-size="11.5" fill="#475569">图线向下倾斜</text>
  <text x="615" y="364" font-size="11" fill="#475569">用直线拟合所有数据点</text>
  <text x="615" y="388" font-size="11" fill="#475569">纵轴刻度可以不从 0 开始</text>
  <text x="615" y="412" font-size="11" fill="#475569">斜率取绝对值，r 为正</text>

  <rect x="46" y="506" width="804" height="22" rx="8" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="522" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">纵轴截距是 E，斜率的绝对值是 r；用一条直线拟合，点均匀分布在两侧</text>
</g>

<!-- 第三步：误差 -->
<g class="s55-step s55-step3" data-zone="3">
  <text x="50" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 误差从哪里来</text>

  <rect x="46" y="100" width="430" height="390" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <line x1="110" y1="420" x2="110" y2="150" stroke="#334155" stroke-width="2.2"/>
  <line x1="110" y1="420" x2="440" y2="420" stroke="#334155" stroke-width="2.2"/>
  <text x="96" y="162" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">U</text>
  <text x="440" y="440" font-size="12" font-weight="800" fill="#334155" text-anchor="end">I</text>

  <line class="s55-true" x1="110" y1="174" x2="410" y2="262" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <line class="s55-meas" x1="110" y1="182" x2="410" y2="258" stroke="#1d4ed8" stroke-width="3"/>
  <text x="102" y="171" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="end">E真</text>
  <text x="102" y="192" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="end">E测</text>

  <line x1="120" y1="452" x2="150" y2="452" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="158" y="456" font-size="11.5" fill="#334155">真实图线：E真、r真</text>
  <line x1="120" y1="478" x2="150" y2="478" stroke="#1d4ed8" stroke-width="3"/>
  <text x="158" y="482" font-size="11.5" fill="#334155">测量图线：E测、r测 都偏小</text>

  <g class="s55-card s55-c2">
    <rect x="496" y="296" width="354" height="194" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="512" y="324" font-size="13.5" font-weight="800" fill="#1e3a8a">怎样减小误差</text>
    <text x="512" y="352" font-size="11.5" fill="#475569">· 电压表内阻尽量大</text>
    <text x="512" y="378" font-size="11.5" fill="#475569">· 每次通电时间要短</text>
    <text x="512" y="404" font-size="11.5" fill="#475569">· 至少测 6 组，点分布均匀</text>
    <text x="512" y="430" font-size="11.5" fill="#475569">· 用直线拟合，图像法求 E、r</text>
    <text x="512" y="456" font-size="11.5" fill="#475569">· 电池发热会让内阻变化</text>
    <text x="512" y="480" font-size="11.5" font-weight="800" fill="#b45309">误差方向：E测 &lt; E真，r测 &lt; r真</text>
  </g>

  <g class="s55-card">
    <rect x="496" y="100" width="354" height="180" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="512" y="128" font-size="13.5" font-weight="800" fill="#b91c1c">误差来源：电压表分流</text>
    <text x="512" y="158" font-size="11.5" fill="#475569">电流表只读到通过 R 的电流</text>
    <text x="512" y="182" font-size="11.5" fill="#475569">电池实际输出的电流更大</text>
    <text class="s55-glow" x="512" y="212" font-size="13" font-weight="800" fill="#b91c1c">I总 = I_A + I_V</text>
    <text x="512" y="242" font-size="11.5" fill="#475569">所以测出的电动势和内阻都偏小</text>
  </g>

  <rect x="46" y="502" width="804" height="26" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="450" y="520" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">系统误差来自电压表分流：E测 &lt; E真、r测 &lt; r真，这是电路本身决定的</text>
</g>
</svg>
