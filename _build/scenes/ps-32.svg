<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="万有引力理论的成就：称量地球、发现海王星与双星系统">
<style>
[data-scene="ps-32"] .s32-step1,[data-scene="ps-32"] .s32-step2,[data-scene="ps-32"] .s32-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-32"].s1 .s32-step1,[data-scene="ps-32"].s2 .s32-step2,[data-scene="ps-32"].s3 .s32-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s32draw{to{stroke-dashoffset:0}}
@keyframes s32rot{to{transform:rotate(360deg)}}
@keyframes s32pulse{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.95;transform:scale(1.2)}}
@keyframes s32pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s32rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
[data-scene="ps-32"].s1 .s32-eq{stroke-dasharray:170;stroke-dashoffset:170;animation:s32draw 1.1s ease .25s both}
[data-scene="ps-32"].s1 .s32-obj{transform-box:fill-box;transform-origin:center;animation:s32rise .65s ease both}
[data-scene="ps-32"].s1 .s32-card{transform-box:fill-box;transform-origin:center;animation:s32pop .5s ease .55s both}
[data-scene="ps-32"].s2 .s32-orbit{stroke-dasharray:1400;stroke-dashoffset:1400;animation:s32draw 1.5s ease both}
[data-scene="ps-32"].s2 .s32-nep{transform-box:fill-box;transform-origin:center;animation:s32pulse 2s ease-in-out infinite}
[data-scene="ps-32"].s2 .s32-dev{transform-box:fill-box;transform-origin:center;animation:s32pop .5s ease 1s both}
[data-scene="ps-32"].s3 .s32-star{transform-box:view-box;transform-origin:450px 330px;animation:s32rot 7s linear infinite}
[data-scene="ps-32"].s3 .s32-ring{stroke-dasharray:1100;stroke-dashoffset:1100;animation:s32draw 1.3s ease both}
[data-scene="ps-32"].s3 .s32-chip{transform-box:fill-box;transform-origin:center;animation:s32pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">万有引力理论的成就：称地球、找海王星、看双星</text>

<!-- 第一步：称量地球 -->
<g class="s32-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">地面物体：重力近似等于地球对它的万有引力</text>

  <circle cx="300" cy="380" r="146" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M210 300 q40 -34 82 -12 q34 18 62 4 q30 -14 52 14 q-22 30 -60 26 q-44 -4 -70 20 q-34 26 -66 -8 z" fill="#86efac" opacity=".55"/>
  <path d="M226 410 q34 -20 66 0 q30 18 58 2 q26 -16 46 8 q-20 26 -54 22 q-38 -4 -62 14 q-30 20 -54 -10 z" fill="#86efac" opacity=".45"/>
  <text x="300" y="452" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">地球</text>

  <line class="s32-eq" x1="300" y1="380" x2="197" y2="277" stroke="#1e40af" stroke-width="2.2" stroke-dasharray="7 6"/>
  <text x="224" y="330" font-size="13" font-weight="800" fill="#1e40af">R</text>

  <g class="s32-obj">
    <rect x="278" y="200" width="44" height="32" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="300" y="222" font-size="12" font-weight="800" fill="#7c2d12" text-anchor="middle">m</text>
    <line x1="300" y1="238" x2="300" y2="284" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="314" y="270" font-size="13" font-weight="800" fill="#b91c1c">mg</text>
  </g>
  <text x="300" y="304" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">地表附近 g ≈ 9.8 m/s²</text>

  <g class="s32-card">
    <rect x="500" y="104" width="330" height="206" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="134" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">称量地球：求中心天体质量</text>
    <text x="665" y="166" font-size="13.5" fill="#334155" text-anchor="middle">mg = GMm / R²</text>
    <text x="665" y="208" font-size="27" font-weight="900" font-style="italic" fill="#1e3a8a" text-anchor="middle">M = gR² / G</text>
    <text x="665" y="248" font-size="12.5" fill="#334155" text-anchor="middle">g = 9.8 m/s²，R = 6.4×10⁶ m</text>
    <text x="665" y="280" font-size="13.5" font-weight="900" fill="#b45309" text-anchor="middle">M ≈ 6.0×10²⁴ kg</text>
  </g>

  <rect x="500" y="330" width="330" height="150" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="665" y="358" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">注意适用范围</text>
  <text x="665" y="388" font-size="12" fill="#334155" text-anchor="middle">只能求出“中心天体”的质量</text>
  <text x="665" y="414" font-size="12" fill="#334155" text-anchor="middle">不能求出绕它运行的卫星质量</text>
  <text x="665" y="444" font-size="12" fill="#64748b" text-anchor="middle">忽略地球自转带来的微小影响</text>

  <text x="80" y="576" font-size="12" fill="#64748b">思路：把“称质量”转化成测重力加速度和半径</text>
</g>

<!-- 第二步：发现海王星 -->
<g class="s32-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">天王星轨道有偏差 → 万有引力定律预言未知行星</text>

  <circle cx="190" cy="330" r="46" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
  <circle cx="190" cy="330" r="66" fill="none" stroke="#f59e0b" stroke-width="2" opacity=".35"/>
  <text x="190" y="398" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">太阳</text>

  <circle class="s32-orbit" cx="190" cy="330" r="150" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 7"/>
  <circle class="s32-orbit" cx="190" cy="330" r="212" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 7"/>
  <text x="352" y="196" font-size="12" font-weight="700" fill="#64748b">天王星轨道</text>
  <text x="290" y="146" font-size="12" font-weight="700" fill="#6d28d9">海王星轨道</text>

  <circle cx="276" cy="207" r="9" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="292" y="205" font-size="12" font-weight="800" fill="#475569">天王星</text>

  <circle cx="300" cy="190" r="14" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="280" y1="201" x2="296" y2="193" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="330" y="170" font-size="12" font-weight="800" fill="#b91c1c">计算位置</text>
  <text x="330" y="230" font-size="11.5" fill="#b91c1c">实测与计算差一点</text>

  <g class="s32-nep">
    <circle cx="392" cy="396" r="20" fill="#7c3aed" opacity=".25"/>
    <circle cx="392" cy="396" r="9" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>
  </g>
  <text x="410" y="392" font-size="13" font-weight="800" fill="#5b21b6">海王星</text>
  <text x="398" y="428" font-size="11" fill="#6d28d9">预测位置附近发现</text>

  <g class="s32-dev">
    <rect x="500" y="104" width="330" height="376" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="136" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">“笔尖上发现的行星”</text>
    <g fill="#7c3aed"><circle cx="524" cy="170" r="5"/><circle cx="524" cy="244" r="5"/><circle cx="524" cy="318" r="5"/></g>
    <text x="540" y="174" font-size="12.5" font-weight="700" fill="#334155">观测：天王星轨道偏离计算值</text>
    <text x="540" y="196" font-size="11.5" fill="#64748b">像是被外侧某个天体“拉”偏了</text>
    <text x="540" y="248" font-size="12.5" font-weight="700" fill="#334155">推算：用万有引力定律反推位置</text>
    <text x="540" y="270" font-size="11.5" fill="#64748b">算出未知行星的质量与轨道</text>
    <text x="540" y="322" font-size="12.5" font-weight="700" fill="#334155">验证：在预测位置附近找到海王星</text>
    <text x="540" y="344" font-size="11.5" fill="#64748b">理论不仅能解释现象，还能预言</text>
    <line x1="522" y1="372" x2="808" y2="372" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="665" y="402" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">万有引力理论威力的有力证明</text>
    <text x="665" y="430" font-size="12" fill="#64748b" text-anchor="middle">海王星因此被称为“笔尖上发现的行星”</text>
    <text x="665" y="458" font-size="12" fill="#64748b" text-anchor="middle">后来冥王星也是用类似方法被寻找的</text>
  </g>

  <text x="80" y="576" font-size="12" fill="#64748b">关键：先有理论预言，后有观测证实</text>
</g>

<!-- 第三步：双星系统 -->
<g class="s32-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">双星：绕连线上同一点转动，周期相同、角速度相同</text>

  <line x1="330" y1="330" x2="630" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="450" cy="330" r="6" fill="#334155"/>
  <text x="450" y="362" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">O</text>

  <circle class="s32-ring" cx="450" cy="330" r="100" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 7" opacity=".6"/>
  <circle class="s32-ring" cx="450" cy="330" r="160" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="7 7" opacity=".6"/>

  <g class="s32-star">
    <circle cx="350" cy="330" r="29" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
    <circle cx="610" cy="330" r="17" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <line x1="350" y1="300" x2="350" y2="252" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <line x1="610" y1="360" x2="610" y2="408" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
  </g>

  <text x="350" y="382" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">m₁（大）</text>
  <text x="610" y="306" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">m₂（小）</text>
  <text x="318" y="244" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">v₁</text>
  <text x="632" y="426" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">v₂</text>
  <text x="392" y="314" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">r₁</text>
  <text x="540" y="314" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">r₂</text>

  <text x="450" y="190" font-size="12.5" fill="#334155" text-anchor="middle">两星之间的万有引力分别提供各自的向心力</text>
  <line x1="450" y1="200" x2="450" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="450" y="120" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">L = r₁ + r₂</text>

  <g class="s32-chip">
    <rect x="70" y="430" width="238" height="82" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="189" y="460" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">同周期 · 同角速度</text>
    <text x="189" y="488" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">T₁ = T₂　ω₁ = ω₂</text>
  </g>
  <g class="s32-chip">
    <rect x="330" y="430" width="238" height="82" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="449" y="460" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">半径与质量成反比</text>
    <text x="449" y="488" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">m₁r₁ = m₂r₂</text>
  </g>
  <g class="s32-chip">
    <rect x="590" y="430" width="240" height="82" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="710" y="460" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">质量大的半径小</text>
    <text x="710" y="488" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">r₁ + r₂ = L</text>
  </g>

  <text x="80" y="576" font-size="12" fill="#64748b">双星问题先找圆心 O，再对两颗星分别写向心力</text>
</g>
</svg>
