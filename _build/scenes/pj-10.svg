<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="声的利用：声传递信息与声传递能量">
  <style>
    .p10-s1,.p10-s2,.p10-s3{opacity:0;visibility:hidden}
    .p10-s1{opacity:1;visibility:visible}
    [data-scene="pj-10"] .p10-s1,[data-scene="pj-10"] .p10-s2,[data-scene="pj-10"] .p10-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-10"].s1 .p10-s1,[data-scene="pj-10"].s2 .p10-s2,[data-scene="pj-10"].s3 .p10-s3{opacity:1;visibility:visible}
    @keyframes p10arc{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes p10draw{to{stroke-dashoffset:0}}
    @keyframes p10bub{0%{transform:translateY(8px) scale(.6);opacity:0}25%{opacity:.9}100%{transform:translateY(-55px) scale(1.1);opacity:0}}
    @keyframes p10scan{0%,100%{transform:translateY(0)}50%{transform:translateY(48px)}}
    @keyframes p10shock{0%,100%{opacity:.2}50%{opacity:1}}
    @keyframes p10float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    [data-scene="pj-10"].s1 .p10-ping{animation:p10arc 1.1s ease-in-out infinite}
    [data-scene="pj-10"].s1 .p10-ping:nth-of-type(2){animation-delay:.2s}
    [data-scene="pj-10"].s1 .p10-ping:nth-of-type(3){animation-delay:.4s}
    [data-scene="pj-10"].s1 .p10-scan{animation:p10scan 2s ease-in-out infinite}
    [data-scene="pj-10"].s1 .p10-beam{stroke-dasharray:10 8;animation:p10arc 1.4s ease-in-out infinite}
    [data-scene="pj-10"].s2 .p10-bub{animation:p10bub 1.5s ease-in infinite}
    [data-scene="pj-10"].s2 .p10-shock{animation:p10shock 1.2s ease-in-out infinite}
    [data-scene="pj-10"].s2 .p10-shock:nth-of-type(2){animation-delay:.18s}
    [data-scene="pj-10"].s2 .p10-shock:nth-of-type(3){animation-delay:.36s}
    [data-scene="pj-10"].s3 .p10-float{transform-box:fill-box;transform-origin:center;animation:p10float 2s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">声的利用：传递信息还是传递能量</text>

  <!-- ========== 第一步：声传递信息 ========== -->
  <g class="p10-s1" data-zone="1">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="176" height="30" rx="15" fill="#e8effc"/>
    <text x="144" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 声传递信息</text>

    <!-- 蝙蝠回声定位 -->
    <rect x="52" y="118" width="252" height="286" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="178" y="144" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">蝙蝠 · 回声定位</text>
    <g>
      <path d="M99 194 Q78 172 62 188 Q78 186 82 200 Q90 192 100 202 Z" fill="#334155"/>
      <path d="M111 194 Q132 172 148 188 Q132 186 128 200 Q120 192 110 202 Z" fill="#334155"/>
      <ellipse cx="105" cy="200" rx="8" ry="14" fill="#334155"/>
      <path d="M99 190 L96 178 L104 184 Z M111 190 L114 178 L106 184 Z" fill="#334155"/>
      <circle cx="108" cy="196" r="1.6" fill="#fde68a"/>
    </g>
    <g>
      <ellipse cx="232" cy="166" rx="10" ry="6" fill="#78716c"/>
      <ellipse cx="227" cy="159" rx="9" ry="4" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1" transform="rotate(-25 227 159)"/>
      <ellipse cx="238" cy="159" rx="9" ry="4" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1" transform="rotate(25 238 159)"/>
      <line x1="230" y1="172" x2="226" y2="180" stroke="#78716c" stroke-width="1.5"/>
      <line x1="235" y1="172" x2="239" y2="180" stroke="#78716c" stroke-width="1.5"/>
      <text x="240" y="194" font-size="11" fill="#64748b">昆虫</text>
    </g>
    <path class="p10-ping" d="M122 182 Q166 146 216 158" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path class="p10-ping" d="M120 198 Q170 172 224 174" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path class="p10-ping" d="M122 214 Q168 194 226 190" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 6"/>
    <line x1="228" y1="184" x2="136" y2="224" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrGreen)"/>
    <text x="130" y="252" font-size="11" font-weight="700" fill="#1d4ed8">发出超声波</text>
    <text x="170" y="240" font-size="11" font-weight="700" fill="#047857">回声</text>
    <rect x="64" y="304" width="228" height="82" rx="10" fill="#eef6ff"/>
    <text x="76" y="326" font-size="11.5" fill="#475569">0.1 s 后收到回声</text>
    <text x="76" y="352" font-size="16" font-weight="900" fill="#1d4ed8">距虫约 17 m</text>
    <text x="76" y="374" font-size="11" fill="#64748b">v声 = 340 m/s</text>

    <!-- 声呐测深 -->
    <rect x="324" y="118" width="252" height="286" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="450" y="144" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">声呐 · 探测海深</text>
    <rect x="336" y="176" width="228" height="152" fill="#dbeafe" opacity=".55"/>
    <line x1="336" y1="176" x2="564" y2="176" stroke="#60a5fa" stroke-width="2"/>
    <path d="M336 322 Q380 310 420 322 Q462 334 500 320 Q532 310 564 322 V328 H336 Z" fill="#cbd5e1"/>
    <path d="M372 176 H528 L512 202 H388 Z" fill="#334155"/>
    <rect x="424" y="152" width="52" height="24" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="500" y1="176" x2="500" y2="158" stroke="#334155" stroke-width="2"/>
    <text x="450" y="195" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">声呐</text>
    <polygon points="448,202 392,318 508,318" fill="#60a5fa" opacity=".22"/>
    <line class="p10-beam" x1="448" y1="202" x2="450" y2="318" stroke="#1d4ed8" stroke-width="1.8"/>
    <line x1="540" y1="176" x2="540" y2="322" stroke="#1e40af" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="556" y="252" font-size="12.5" font-weight="800" fill="#1e40af" transform="rotate(-90 556 252)" text-anchor="middle">1500 m</text>
    <text x="348" y="352" font-size="11.5" fill="#475569">超声波往返 2.0 s</text>
    <text x="348" y="380" font-size="15" font-weight="900" fill="#1d4ed8">h = 1500 m</text>

    <!-- B超 -->
    <rect x="596" y="118" width="252" height="286" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="722" y="144" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">B超 · 看体内</text>
    <rect x="636" y="160" width="172" height="118" rx="10" fill="#334155"/>
    <rect x="646" y="170" width="152" height="76" rx="6" fill="#f0f9ff"/>
    <path d="M662 238 Q680 178 730 178 Q780 178 790 238" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="724" cy="206" rx="26" ry="17" fill="#94a3b8" opacity=".5"/>
    <ellipse cx="718" cy="204" rx="10" ry="7" fill="#64748b" opacity=".55"/>
    <line class="p10-scan" x1="650" y1="182" x2="794" y2="182" stroke="#22d3ee" stroke-width="2" opacity=".9"/>
    <text x="722" y="266" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">实时图像</text>
    <line x1="722" y1="278" x2="722" y2="296" stroke="#64748b" stroke-width="3"/>
    <rect x="712" y="296" width="20" height="26" rx="5" fill="#64748b"/>
    <ellipse cx="722" cy="344" rx="62" ry="22" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M700 344 Q722 326 744 344" fill="none" stroke="#d97706" stroke-width="2" opacity=".7"/>
    <text x="752" y="308" font-size="11" fill="#475569">探头</text>
    <text x="610" y="388" font-size="11.5" font-weight="700" fill="#1d4ed8">看清体内结构</text>

    <rect x="52" y="414" width="796" height="36" rx="10" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="450" y="438" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">蝙蝠、声呐、B超：靠声获得信息 → 声传递信息</text>
  </g>

  <!-- ========== 第二步：声传递能量 ========== -->
  <g class="p10-s2" data-zone="2">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <rect x="56" y="80" width="176" height="30" rx="15" fill="#fef3c7"/>
    <text x="144" y="100" font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">② 声传递能量</text>

    <!-- 清洗 -->
    <rect x="52" y="118" width="392" height="286" rx="14" fill="#f8fbff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="248" y="144" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">超声波清洗眼镜</text>
    <rect x="92" y="188" width="310" height="152" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <rect x="98" y="220" width="298" height="114" fill="#bae6fd" opacity=".75"/>
    <g fill="none" stroke="#1e293b" stroke-width="3">
      <circle cx="185" cy="276" r="24"/>
      <circle cx="245" cy="276" r="24"/>
      <line x1="209" y1="276" x2="221" y2="276"/>
      <line x1="161" y1="276" x2="142" y2="266"/>
      <line x1="269" y1="276" x2="288" y2="266"/>
    </g>
    <g fill="#a16207">
      <circle cx="178" cy="270" r="2.6"/><circle cx="192" cy="282" r="2.2"/><circle cx="238" cy="268" r="2.4"/><circle cx="252" cy="282" r="2.6"/>
    </g>
    <rect x="150" y="332" width="194" height="12" rx="5" fill="#64748b"/>
    <text x="248" y="362" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">换能器 · 40 kHz</text>
    <g fill="#7dd3fc">
      <circle class="p10-bub" cx="120" cy="316" r="4"/>
      <circle class="p10-bub" cx="150" cy="308" r="3.2" style="animation-delay:.2s"/>
      <circle class="p10-bub" cx="300" cy="314" r="3.6" style="animation-delay:.35s"/>
      <circle class="p10-bub" cx="330" cy="306" r="4.2" style="animation-delay:.5s"/>
      <circle class="p10-bub" cx="210" cy="312" r="3" style="animation-delay:.65s"/>
      <circle class="p10-bub" cx="272" cy="310" r="3.4" style="animation-delay:.8s"/>
    </g>
    <text x="248" y="390" font-size="12" font-weight="700" fill="#0c4a6e" text-anchor="middle">高频振动把污垢从镜片剥离</text>

    <!-- 碎石 -->
    <rect x="456" y="118" width="392" height="286" rx="14" fill="#fffafa" stroke="#fecaca" stroke-width="1.5"/>
    <text x="652" y="144" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">超声波碎石</text>
    <path d="M540 210 C560 170 740 170 770 214 C790 250 780 340 740 360 C700 380 590 378 552 340 C530 316 524 250 540 210 Z" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <path d="M620 226 C650 206 700 218 704 250 C708 282 668 302 640 286 C614 272 606 244 620 226 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
    <polygon points="666,246 676,240 686,248 684,260 672,264 663,256" fill="#57534e"/>
    <path d="M684 258 L696 266 M664 255 L652 262" stroke="#7f1d1d" stroke-width="2.2"/>
    <text x="642" y="292" font-size="11" font-weight="700" fill="#b91c1c">结石</text>
    <g transform="rotate(-25 768 200)">
      <rect x="754" y="174" width="26" height="48" rx="9" fill="#475569"/>
      <rect x="760" y="168" width="14" height="10" rx="4" fill="#94a3b8"/>
    </g>
    <text x="784" y="180" font-size="11" fill="#475569">探头</text>
    <path class="p10-shock" d="M748 210 Q720 200 700 220" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path class="p10-shock" d="M742 224 Q716 218 698 238" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path class="p10-shock" d="M736 238 Q714 236 696 254" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="652" y="330" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">冲击波聚焦，结石碎裂</text>
    <text x="652" y="390" font-size="12" font-weight="700" fill="#7f1d1d" text-anchor="middle">声使物体发生改变 → 传递能量</text>

    <rect x="52" y="414" width="796" height="36" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="450" y="438" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">超声波使污垢脱落、结石碎裂 → 声传递能量</text>
  </g>

  <!-- ========== 第三步：辨别信息与能量 ========== -->
  <g class="p10-s3" data-zone="3">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="206" height="30" rx="15" fill="#e8effc"/>
    <text x="159" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 怎样辨别信息与能量</text>
    <rect x="56" y="116" width="788" height="40" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="450" y="142" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断关键：声音有没有使物体发生改变？</text>

    <!-- 信息列 -->
    <rect x="56" y="168" width="386" height="200" rx="14" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="249" y="196" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">声传递信息</text>
    <g class="p10-float">
      <circle cx="92" cy="228" r="8" fill="#94a3b8"/><circle cx="106" cy="221" r="11" fill="#94a3b8"/><circle cx="121" cy="228" r="8" fill="#94a3b8"/>
      <polygon points="102,232 110,232 104,244 114,244 98,260 103,246 94,246" fill="#f59e0b"/>
    </g>
    <text x="142" y="238" font-size="12.5" fill="#1e3a8a">雷声预示要下雨</text>
    <g class="p10-float">
      <polygon points="76,270 122,270 116,282 82,282" fill="#334155"/>
      <line x1="98" y1="282" x2="104" y2="300" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/>
    </g>
    <text x="142" y="280" font-size="12.5" fill="#1e3a8a">声呐测出海深</text>
    <g class="p10-float">
      <rect x="80" y="304" width="42" height="28" rx="4" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/>
      <path d="M86 322 q6 -12 12 0 q6 12 12 0" fill="none" stroke="#1d4ed8" stroke-width="1.8"/>
    </g>
    <text x="142" y="322" font-size="12.5" fill="#1e3a8a">B超看到体内</text>
    <text x="249" y="354" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">→ 获得情况、知识</text>

    <!-- 能量列 -->
    <rect x="458" y="168" width="386" height="200" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text x="651" y="196" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">声传递能量</text>
    <g transform="translate(400 0)">
      <g class="p10-float">
        <circle cx="98" cy="226" r="12" fill="none" stroke="#1e293b" stroke-width="2.5"/>
        <circle cx="116" cy="226" r="12" fill="none" stroke="#1e293b" stroke-width="2.5"/>
        <circle cx="104" cy="238" r="2.2" fill="#a16207"/>
        <circle cx="96" cy="214" r="2.4" fill="#7dd3fc"/><circle cx="122" cy="210" r="2" fill="#7dd3fc"/>
      </g>
      <text x="142" y="232" font-size="12.5" fill="#92400e">清洗去掉污垢</text>
      <g class="p10-float">
        <polygon points="96,262 108,256 120,264 117,278 102,280 92,272" fill="#57534e"/>
        <path d="M118 266 L128 272 M96 276 L88 282" stroke="#7f1d1d" stroke-width="2"/>
      </g>
      <text x="142" y="274" font-size="12.5" fill="#92400e">碎石击碎结石</text>
      <g class="p10-float">
        <rect x="88" y="304" width="32" height="30" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
        <path d="M92 304 q-6 -10 2 -16 M104 304 q0 -12 6 -18 M114 304 q6 -8 12 -10" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="142" y="322" font-size="12.5" fill="#92400e">加湿器喷出水雾</text>
    </g>
    <text x="651" y="354" font-size="11.5" font-weight="700" fill="#a16207" text-anchor="middle">→ 使物体发生变化</text>

    <!-- 结论 -->
    <rect x="56" y="382" width="788" height="68" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="450" y="408" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">同样是超声波：用于探测是信息，用于清洗、碎石是能量</text>
    <rect x="140" y="418" width="270" height="26" rx="13" fill="#e8effc"/>
    <text x="275" y="436" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">雷声 · 声呐 · B超 → 信息</text>
    <rect x="490" y="418" width="280" height="26" rx="13" fill="#fef3c7"/>
    <text x="630" y="436" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">清洗 · 碎石 · 加湿 → 能量</text>
  </g>
</svg>
