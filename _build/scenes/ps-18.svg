<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验探究加速度与力、质量的关系：控制变量法、打点计时器实验装置、a-F 与 a-1/m 图像">
<style>
[data-scene="ps-18"] .s18-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-18"].s1 .s18-step1,[data-scene="ps-18"].s2 .s18-step2,[data-scene="ps-18"].s3 .s18-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s18pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s18grow{from{opacity:0}to{opacity:1}}
@keyframes s18slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes s18draw{to{stroke-dashoffset:0}}
@keyframes s18pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s18nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes s18bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
[data-scene="ps-18"].s1 .s18-card{transform-box:fill-box;transform-origin:center;animation:s18pop .5s ease both}
[data-scene="ps-18"].s1 .s18-flow{animation:s18slide .5s ease .18s both}
[data-scene="ps-18"].s2 .s18-timer{animation:s18pulse 1.4s ease-in-out infinite}
[data-scene="ps-18"].s2 .s18-cart{transform-box:fill-box;transform-origin:center;animation:s18nudge 2.2s ease-in-out infinite}
[data-scene="ps-18"].s2 .s18-bucket{transform-box:fill-box;transform-origin:center;animation:s18bob 2.2s ease-in-out infinite}
[data-scene="ps-18"].s3 .s18-gline{stroke-dasharray:420;stroke-dashoffset:420;animation:s18draw 1s ease .2s both}
[data-scene="ps-18"].s3 .s18-axis{animation:s18grow .5s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：探究加速度与力、质量的关系</text>

<!-- 第一步：控制变量法 -->
<g class="s18-step s18-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">控制变量法：一次只改变一个量</text>

  <g class="s18-card">
    <rect x="50" y="110" width="390" height="326" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="126" width="118" height="26" rx="13" fill="#e8effc"/>
    <text x="129" y="144" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">控制变量 ①</text>
    <text x="70" y="184" font-size="16" font-weight="800" fill="#1e3a8a">保持质量 m 不变</text>
    <text x="70" y="208" font-size="12" fill="#475569">只改变拉力 F，看 a 怎样变化</text>

    <circle cx="78" cy="244" r="4" fill="#1d4ed8"/>
    <text x="94" y="249" font-size="12.5" fill="#334155">在砂桶中加减砂，改变 F</text>
    <circle cx="78" cy="282" r="4" fill="#1d4ed8"/>
    <text x="94" y="287" font-size="12.5" fill="#334155">小车质量保持不变</text>
    <circle cx="78" cy="320" r="4" fill="#1d4ed8"/>
    <text x="94" y="325" font-size="12.5" fill="#334155">用打点计时器测出加速度 a</text>

    <rect x="328" y="228" width="84" height="56" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="370" y="264" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">m</text>
    <rect x="362" y="204" width="16" height="13" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
    <path d="M364 204 v-7 a6 6 0 0 1 12 0 v7" fill="none" stroke="#b45309" stroke-width="2"/>
    <line x1="330" y1="304" x2="410" y2="304" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="370" y="322" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F 改变</text>

    <rect x="70" y="348" width="350" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="245" y="376" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">作 a-F 图像（m 一定）</text>
  </g>

  <g class="s18-card">
    <rect x="460" y="110" width="390" height="326" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="126" width="118" height="26" rx="13" fill="#dcfce7"/>
    <text x="539" y="144" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">控制变量 ②</text>
    <text x="480" y="184" font-size="16" font-weight="800" fill="#047857">保持拉力 F 不变</text>
    <text x="480" y="208" font-size="12" fill="#475569">只改变质量 m，看 a 怎样变化</text>

    <circle cx="488" cy="244" r="4" fill="#059669"/>
    <text x="504" y="249" font-size="12.5" fill="#334155">在小车上加砝码，改变 m</text>
    <circle cx="488" cy="282" r="4" fill="#059669"/>
    <text x="504" y="287" font-size="12.5" fill="#334155">砂和砂桶的总重力保持不变</text>
    <circle cx="488" cy="320" r="4" fill="#059669"/>
    <text x="504" y="325" font-size="12.5" fill="#334155">测出对应的加速度 a</text>

    <rect x="738" y="230" width="84" height="50" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <rect x="748" y="220" width="26" height="10" rx="2" fill="#94a3b8"/>
    <rect x="780" y="216" width="26" height="14" rx="2" fill="#94a3b8"/>
    <text x="780" y="264" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">m</text>
    <line x1="740" y1="304" x2="820" y2="304" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="780" y="322" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F 不变</text>

    <rect x="480" y="348" width="350" height="44" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="655" y="376" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">作 a-1/m 图像（F 一定）</text>
  </g>

  <g class="s18-flow">
    <rect x="50" y="452" width="800" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">控制变量法：m 不变研究 a-F，F 不变研究 a 与 1/m 的关系</text>
  </g>
</g>

<!-- 第二步：打点计时器实验装置 -->
<g class="s18-step s18-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">实验装置：打点计时器 + 纸带测加速度</text>

  <line x1="180" y1="360" x2="180" y2="500" stroke="#cbd5e1" stroke-width="7"/>
  <line x1="500" y1="334" x2="500" y2="500" stroke="#cbd5e1" stroke-width="7"/>
  <line x1="110" y1="352" x2="560" y2="322" stroke="#94a3b8" stroke-width="13" stroke-linecap="round"/>
  <line x1="112" y1="347" x2="558" y2="317" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <g class="s18-timer">
    <rect x="74" y="296" width="54" height="44" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <circle cx="92" cy="312" r="4" fill="#dc2626"/>
    <circle cx="111" cy="312" r="4" fill="#64748b"/>
    <line x1="90" y1="328" x2="112" y2="328" stroke="#64748b" stroke-width="2"/>
    <text x="101" y="288" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">打点计时器</text>
  </g>

  <rect x="126" y="318" width="184" height="8" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="204" y="310" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">纸带</text>

  <g class="s18-cart">
    <rect x="300" y="280" width="112" height="50" rx="9" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <rect x="312" y="290" width="88" height="26" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <circle cx="326" cy="332" r="9" fill="#64748b"/>
    <circle cx="388" cy="332" r="9" fill="#64748b"/>
    <text x="356" y="310" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">小车 m</text>
  </g>

  <circle cx="566" cy="320" r="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <polyline points="412,306 558,315 566,320 566,376" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="316" y1="262" x2="384" y2="262" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="400" y="268" font-size="14" font-weight="900" fill="#1d4ed8">a</text>
  <text x="486" y="298" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>

  <g class="s18-bucket">
    <path d="M548 376 L584 376 L578 412 L554 412 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="566" y="398" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">砂</text>
    <text x="566" y="430" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">砂桶</text>
  </g>

  <rect x="612" y="108" width="238" height="340" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="731" y="136" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">关键操作</text>
  <line x1="630" y1="150" x2="832" y2="150" stroke="#e8eef7" stroke-width="1.5"/>
  <text x="630" y="176" font-size="12" fill="#334155">打点计时器：交流 50 Hz</text>
  <text x="630" y="200" font-size="12" fill="#334155">T = 0.02 s</text>
  <text x="630" y="228" font-size="12" fill="#334155">测加速度：Δx = aT²</text>
  <text x="630" y="252" font-size="12" fill="#334155">（逐差法处理纸带）</text>
  <line x1="630" y1="268" x2="832" y2="268" stroke="#e8eef7" stroke-width="1.5"/>
  <text x="630" y="294" font-size="12.5" font-weight="800" fill="#b45309">① 平衡摩擦力</text>
  <text x="630" y="318" font-size="11.5" fill="#475569">不挂砂桶，轻推小车</text>
  <text x="630" y="340" font-size="11.5" fill="#475569">纸带点距均匀即可</text>
  <text x="630" y="366" font-size="12.5" font-weight="800" fill="#b45309">② m砂 ≪ m车</text>
  <text x="630" y="390" font-size="11.5" fill="#475569">此时 F ≈ m砂g</text>
  <text x="630" y="422" font-size="11.5" font-weight="700" fill="#64748b">先接通电源，后放开小车</text>

  <rect x="50" y="452" width="800" height="34" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#7c5a30" text-anchor="middle">用砂和砂桶的总重力近似作为小车受到的拉力：F ≈ m砂g（m砂 ≪ m车）</text>
</g>

<!-- 第三步：图像分析 -->
<g class="s18-step s18-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">图像分析：a-F 与 a-1/m 都是过原点的直线</text>

  <rect x="50" y="112" width="392" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="246" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">a-F 图像</text>
  <g class="s18-axis">
    <line x1="110" y1="392" x2="408" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
    <line x1="110" y1="392" x2="110" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  </g>
  <text x="418" y="398" font-size="12" font-weight="800" fill="#475569">F</text>
  <text x="100" y="156" font-size="12" font-weight="800" fill="#475569" text-anchor="end">a</text>
  <text x="96" y="410" font-size="11.5" fill="#64748b" text-anchor="end">O</text>
  <line x1="220" y1="392" x2="220" y2="290" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="330" y1="392" x2="330" y2="190" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line class="s18-gline" x1="112" y1="390" x2="332" y2="190" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="330" cy="190" r="5" fill="#dc2626"/>
  <text x="306" y="172" font-size="13" font-weight="900" fill="#b91c1c">a ∝ F</text>
  <text x="246" y="424" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">m 一定：图线是过原点的直线</text>

  <rect x="458" y="112" width="392" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="654" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">a-1/m 图像</text>
  <g class="s18-axis">
    <line x1="518" y1="392" x2="816" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
    <line x1="518" y1="392" x2="518" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  </g>
  <text x="824" y="398" font-size="12" font-weight="800" fill="#475569">1/m</text>
  <text x="508" y="156" font-size="12" font-weight="800" fill="#475569" text-anchor="end">a</text>
  <text x="504" y="410" font-size="11.5" fill="#64748b" text-anchor="end">O</text>
  <line x1="630" y1="392" x2="630" y2="296" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="742" y1="392" x2="742" y2="198" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line class="s18-gline" x1="520" y1="390" x2="742" y2="200" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="742" cy="200" r="5" fill="#059669"/>
  <text x="716" y="182" font-size="13" font-weight="900" fill="#047857">a ∝ 1/m</text>
  <text x="654" y="424" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">F 一定：a 与 1/m 成正比</text>

  <rect x="50" y="452" width="800" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">结论：a ∝ F（m 不变）；a ∝ 1/m（F 不变），即 a 与 m 成反比</text>
</g>
</svg>
