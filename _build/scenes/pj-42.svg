<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="功率：起重机与人做功快慢、P等于W除以t等于Fv、功率估测">
<style>
.p42-s1,.p42-s2,.p42-s3{opacity:0;visibility:hidden}
.p42-s1{opacity:1;visibility:visible}
[data-scene="pj-42"] .p42-s1,[data-scene="pj-42"] .p42-s2,[data-scene="pj-42"] .p42-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-42"].s1 .p42-s1,[data-scene="pj-42"].s2 .p42-s2,[data-scene="pj-42"].s3 .p42-s3{opacity:1;visibility:visible}
@keyframes p42bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes p42pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes p42pop{0%{transform:scale(.76);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p42grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes p42flow{to{stroke-dashoffset:-38}}
[data-scene="pj-42"].s1 .p42-load{transform-box:fill-box;transform-origin:center;animation:p42bob 2.6s ease-in-out infinite}
[data-scene="pj-42"].s1 .p42-arrow{animation:p42pulse 1.7s ease-in-out infinite}
[data-scene="pj-42"].s2 .p42-chain{transform-box:fill-box;transform-origin:center;animation:p42pop .5s ease both}
[data-scene="pj-42"].s2 .p42-chain:nth-of-type(2){animation-delay:.14s}
[data-scene="pj-42"].s2 .p42-chain:nth-of-type(3){animation-delay:.28s}
[data-scene="pj-42"].s2 .p42-dash{stroke-dasharray:8 6;animation:p42flow 1.4s linear infinite}
[data-scene="pj-42"].s3 .p42-bar{transform-box:fill-box;transform-origin:left center;animation:p42grow .7s ease both}
[data-scene="pj-42"].s3 .p42-bar:nth-of-type(2){animation-delay:.1s}
[data-scene="pj-42"].s3 .p42-bar:nth-of-type(3){animation-delay:.2s}
[data-scene="pj-42"].s3 .p42-bar:nth-of-type(4){animation-delay:.3s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">功率：比较做功的快慢</text>

<!-- 第一步：做功快慢 -->
<g class="p42-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">做相同的功，用时越短，做功越快，功率越大</text>

  <!-- 人搬砖 -->
  <rect x="36" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="160" height="28" rx="14" fill="#e8effc"/>
  <text x="136" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">人搬砖上楼 · 20 s</text>

  <path d="M60 340 H110 V320 H160 V300 H210 V280 H260 V260 H290 V340 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <circle cx="232" cy="212" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <line x1="232" y1="225" x2="232" y2="262" stroke="#1e3a8a" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="232" y1="262" x2="222" y2="280" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <line x1="232" y1="262" x2="242" y2="280" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <rect x="216" y="236" width="34" height="24" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text x="233" y="253" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">砖</text>

  <text x="356" y="250" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">W = 1200 J</text>
  <text x="356" y="276" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">t = 20 s</text>
  <text x="356" y="314" font-size="19" font-weight="900" fill="#1e3a8a" text-anchor="middle">P = 60 W</text>

  <!-- 起重机 -->
  <rect x="464" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="484" y="116" width="190" height="28" rx="14" fill="#fef3c7"/>
  <text x="579" y="135" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">起重机吊货 · 5 s</text>

  <rect x="512" y="334" width="96" height="10" rx="3" fill="#64748b"/>
  <rect x="544" y="160" width="22" height="178" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <line x1="555" y1="170" x2="804" y2="170" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <line x1="555" y1="140" x2="700" y2="170" stroke="#d97706" stroke-width="2"/>
  <line x1="555" y1="140" x2="804" y2="170" stroke="#d97706" stroke-width="2"/>
  <rect x="530" y="186" width="42" height="26" rx="3" fill="#475569"/>
  <line x1="776" y1="170" x2="776" y2="238" stroke="#475569" stroke-width="2"/>
  <path d="M776 238 v6 h6" fill="none" stroke="#475569" stroke-width="3"/>
  <g class="p42-load">
    <rect x="742" y="244" width="68" height="50" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <text x="776" y="274" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">货物</text>
  </g>

  <text x="664" y="314" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">W = 1200 J，t = 5 s</text>
  <text x="664" y="350" font-size="19" font-weight="900" fill="#b45309" text-anchor="middle">P = 240 W</text>
</g>

<!-- 第二步：功率公式 -->
<g class="p42-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">功率公式：P = W/t，匀速运动时还可写成 P = Fv</text>

  <rect x="36" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="130" height="28" rx="14" fill="#e8effc"/>
  <text x="121" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">公式推导</text>

  <g class="p42-chain">
    <rect x="70" y="156" width="150" height="46" rx="10" fill="#e8effc"/>
    <text x="145" y="185" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">P = W / t</text>
  </g>
  <line x1="145" y1="206" x2="145" y2="234" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g class="p42-chain">
    <rect x="70" y="238" width="300" height="50" rx="10" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="220" y="261" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">W = F s，代入 P = W/t</text>
    <text x="220" y="280" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">得 P = F·(s/t)</text>
  </g>
  <line x1="220" y1="292" x2="220" y2="310" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g class="p42-chain">
    <rect x="130" y="314" width="180" height="50" rx="12" fill="#e8effc"/>
    <text x="220" y="347" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">P = F v</text>
  </g>
  <text x="236" y="382" font-size="11" fill="#64748b" text-anchor="middle">v 是沿力方向的速度</text>

  <rect x="464" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="484" y="116" width="190" height="28" rx="14" fill="#fef3c7"/>
  <text x="579" y="135" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">汽车：功率一定时</text>

  <text x="500" y="166" font-size="12.5" font-weight="800" fill="#334155">低速上坡</text>
  <rect x="500" y="182" width="64" height="30" rx="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="514" cy="214" r="6" fill="#334155"/><circle cx="550" cy="214" r="6" fill="#334155"/>
  <line x1="570" y1="196" x2="690" y2="196" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="700" y="201" font-size="12" font-weight="800" fill="#b91c1c">F 大</text>
  <line class="p42-dash" x1="580" y1="226" x2="646" y2="226" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="656" y="231" font-size="12" font-weight="800" fill="#047857">v 小</text>

  <text x="500" y="270" font-size="12.5" font-weight="800" fill="#334155">高速平路</text>
  <rect x="500" y="286" width="64" height="30" rx="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
  <circle cx="514" cy="318" r="6" fill="#334155"/><circle cx="550" cy="318" r="6" fill="#334155"/>
  <line x1="570" y1="300" x2="620" y2="300" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="630" y="305" font-size="12" font-weight="800" fill="#b91c1c">F 小</text>
  <line class="p42-dash" x1="580" y1="330" x2="706" y2="330" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
  <text x="716" y="335" font-size="12" font-weight="800" fill="#047857">v 大</text>

  <text x="664" y="368" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">P 一定 → F 与 v 成反比</text>
</g>

<!-- 第三步：功率的估测 -->
<g class="p42-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">功率的估测：记住常见功率的数量级，会比较快慢</text>

  <rect x="36" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="170" height="28" rx="14" fill="#e8effc"/>
  <text x="141" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">常见功率（示意）</text>

  <text x="52" y="174" font-size="11.5" font-weight="700" fill="#334155">人骑自行车</text>
  <rect x="150" y="158" width="70" height="22" rx="5" fill="#93c5fd" class="p42-bar"/>
  <text x="228" y="174" font-size="11" font-weight="700" fill="#1e40af">约 70 W</text>

  <text x="52" y="216" font-size="11.5" font-weight="700" fill="#334155">人爬楼</text>
  <rect x="150" y="200" width="100" height="22" rx="5" fill="#60a5fa" class="p42-bar"/>
  <text x="258" y="216" font-size="11" font-weight="700" fill="#1e40af">约 100 W</text>

  <text x="52" y="258" font-size="11.5" font-weight="700" fill="#334155">起重机</text>
  <rect x="150" y="242" width="180" height="22" rx="5" fill="#f59e0b" class="p42-bar"/>
  <text x="338" y="258" font-size="11" font-weight="700" fill="#b45309">数千瓦</text>

  <text x="52" y="300" font-size="11.5" font-weight="700" fill="#334155">小汽车</text>
  <rect x="150" y="284" width="220" height="22" rx="5" fill="#dc2626" class="p42-bar"/>
  <text x="378" y="300" font-size="11" font-weight="700" fill="#b91c1c">上百千瓦</text>

  <text x="236" y="340" font-size="11" fill="#64748b" text-anchor="middle">条形长度仅为示意，不是按比例</text>
  <text x="236" y="368" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">功率越大，单位时间做功越多</text>

  <rect x="464" y="100" width="400" height="290" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="484" y="116" width="190" height="28" rx="14" fill="#fef3c7"/>
  <text x="579" y="135" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">估测：人爬楼的功率</text>

  <text x="664" y="180" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">P = G h / t</text>
  <text x="664" y="214" font-size="12.5" fill="#334155" text-anchor="middle">体重 G = 400 N，楼高 h = 3 m</text>
  <text x="664" y="240" font-size="12.5" fill="#334155" text-anchor="middle">爬楼时间 t = 12 s</text>
  <rect x="544" y="258" width="240" height="44" rx="10" fill="#e8effc"/>
  <text x="664" y="286" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">P = 400×3 / 12 = 100 W</text>
  <text x="664" y="330" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">比较快慢：不能只看做功多少</text>
  <text x="664" y="354" font-size="11.5" fill="#64748b" text-anchor="middle">要看单位时间内做功的多少</text>
  <text x="664" y="378" font-size="11" fill="#64748b" text-anchor="middle">W 相同比 t，t 相同比 W</text>
</g>

<rect x="60" y="412" width="780" height="44" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
<text x="450" y="432" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">P = W / t　·　单位瓦特（W）　·　1 W = 1 J/s</text>
<text x="450" y="450" font-size="11.5" fill="#64748b" text-anchor="middle">做功相同，时间越短，功率越大；时间相同，做功越多，功率越大</text>
</svg>
