<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="相对论时空观：光速不变、时间延缓与长度收缩、适用范围">
<style>
[data-scene="ps-34"] .s34-step1,[data-scene="ps-34"] .s34-step2,[data-scene="ps-34"] .s34-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-34"].s1 .s34-step1,[data-scene="ps-34"].s2 .s34-step2,[data-scene="ps-34"].s3 .s34-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s34flash{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes s34draw{to{stroke-dashoffset:0}}
@keyframes s34pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s34slide{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes s34tick{0%,100%{opacity:.55}50%{opacity:1}}
[data-scene="ps-34"].s1 .s34-ray{stroke-dasharray:150;stroke-dashoffset:150;animation:s34draw .9s ease .2s both}
[data-scene="ps-34"].s1 .s34-bulb{transform-box:fill-box;transform-origin:center;animation:s34flash 1.8s ease-in-out infinite}
[data-scene="ps-34"].s1 .s34-panel{transform-box:fill-box;transform-origin:center;animation:s34pop .5s ease both}
[data-scene="ps-34"].s2 .s34-photon{stroke-dasharray:520;stroke-dashoffset:520;animation:s34draw 1.6s ease .2s both}
[data-scene="ps-34"].s2 .s34-ruler{transform-box:fill-box;transform-origin:left center;animation:s34slide .7s ease .6s both}
[data-scene="ps-34"].s2 .s34-clock{transform-box:fill-box;transform-origin:center;animation:s34tick 2s ease-in-out infinite}
[data-scene="ps-34"].s3 .s34-zone{transform-box:fill-box;transform-origin:center;animation:s34pop .5s ease both}
[data-scene="ps-34"].s3 .s34-ex{transform-box:fill-box;transform-origin:center;animation:s34pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">相对论时空观：光速不变、钟慢尺缩与适用范围</text>

<!-- 第一步：两条基本假设 -->
<g class="s34-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">狭义相对论：相对性原理 + 光速不变原理</text>

  <g class="s34-panel">
    <rect x="70" y="112" width="370" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="255" y="142" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">车厢参考系 S</text>
    <rect x="95" y="158" width="320" height="222" rx="8" fill="#f8fbff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="95" y="372" width="320" height="8" fill="#94a3b8"/>
    <g class="s34-bulb">
      <circle cx="255" cy="196" r="11" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
      <circle cx="255" cy="196" r="22" fill="#fbbf24" opacity=".2"/>
    </g>
    <line class="s34-ray" x1="244" y1="196" x2="106" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
    <line class="s34-ray" x1="266" y1="196" x2="404" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
    <text x="255" y="160" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">真空中光速 c</text>
    <circle cx="255" cy="330" r="13" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <path d="M236 372 q19 -30 38 0 z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="292" y="336" font-size="12" font-weight="700" fill="#334155">观察者</text>
    <text x="255" y="398" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">测得光速 = c</text>
  </g>

  <g class="s34-panel">
    <rect x="460" y="112" width="370" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="645" y="142" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">地面参考系 S′</text>
    <rect x="485" y="158" width="320" height="222" rx="8" fill="#f8fbff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
    <rect x="485" y="372" width="320" height="8" fill="#94a3b8"/>
    <g class="s34-bulb">
      <circle cx="645" cy="196" r="11" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
      <circle cx="645" cy="196" r="22" fill="#fbbf24" opacity=".2"/>
    </g>
    <line class="s34-ray" x1="634" y1="196" x2="496" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
    <line class="s34-ray" x1="656" y1="196" x2="794" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrRed)"/>
    <text x="645" y="160" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">真空中光速 c</text>
    <circle cx="645" cy="330" r="13" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
    <path d="M626 372 q19 -30 38 0 z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="682" y="336" font-size="12" font-weight="700" fill="#334155">观察者</text>
    <text x="645" y="398" font-size="12.5" font-weight="900" fill="#b91c1c" text-anchor="middle">测得光速仍是 c</text>
  </g>

  <rect x="70" y="424" width="760" height="86" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="450" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">相对性原理：所有惯性参考系中物理规律都相同</text>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光速不变原理：任何惯性参考系中真空光速都相同</text>
  <text x="450" y="498" font-size="11.5" fill="#64748b" text-anchor="middle">两条假设是狭义相对论的全部出发点，由此推出钟慢、尺缩等结论</text>

  <text x="80" y="576" font-size="12" fill="#64748b">与日常经验不同：无论光源和观察者怎么运动，测得的光速都不变</text>
</g>

<!-- 第二步：时间延缓与长度收缩 -->
<g class="s34-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">运动着的钟走得慢，沿运动方向的尺子变短</text>

  <rect x="70" y="108" width="370" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="255" y="136" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光钟：时间延缓（钟慢）</text>
  <g class="s34-clock">
    <rect x="110" y="186" width="290" height="10" rx="3" fill="#94a3b8"/>
    <rect x="110" y="358" width="290" height="10" rx="3" fill="#94a3b8"/>
    <line x1="255" y1="196" x2="255" y2="358" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path class="s34-photon" d="M120 358 L200 196 L300 358 L355 196" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <circle cx="120" cy="358" r="5" fill="#dc2626"/>
  </g>
  <text x="255" y="176" font-size="11.5" fill="#64748b" text-anchor="middle">光在上下两面镜子间往返</text>
  <text x="255" y="392" font-size="11.5" fill="#64748b" text-anchor="middle">运动参考系中光走更长的斜线</text>
  <text x="255" y="418" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">Δt = Δt₀ / √(1 − v²/c²)</text>

  <rect x="460" y="108" width="370" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="645" y="136" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">长度收缩（尺缩）</text>
  <g>
    <rect x="500" y="188" width="300" height="26" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <line x1="540" y1="188" x2="540" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="580" y1="188" x2="580" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="620" y1="188" x2="620" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="660" y1="188" x2="660" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="700" y1="188" x2="700" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="740" y1="188" x2="740" y2="214" stroke="#475569" stroke-width="1.5"/>
    <line x1="780" y1="188" x2="780" y2="214" stroke="#475569" stroke-width="1.5"/>
    <text x="650" y="176" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">静止长度 L₀</text>
  </g>
  <g class="s34-ruler">
    <rect x="580" y="292" width="220" height="24" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="620" y1="292" x2="620" y2="316" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="660" y1="292" x2="660" y2="316" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="700" y1="292" x2="700" y2="316" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="740" y1="292" x2="740" y2="316" stroke="#1e40af" stroke-width="1.5"/>
    <line x1="780" y1="292" x2="780" y2="316" stroke="#1e40af" stroke-width="1.5"/>
    <text x="690" y="280" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">运动时测得的 L</text>
  </g>
  <line x1="580" y1="340" x2="800" y2="340" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="690" y="360" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">v 沿尺子方向</text>
  <text x="645" y="394" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">L = L₀√(1 − v²/c²)</text>
  <text x="645" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">只在运动方向收缩，垂直方向不变</text>

  <rect x="70" y="454" width="760" height="56" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="450" y="478" font-size="12" font-weight="700" fill="#7c5a30" text-anchor="middle">v 接近光速时效应才明显，日常生活中 v 远小于 c，根本察觉不到</text>
  <text x="450" y="500" font-size="12" font-weight="700" fill="#7c5a30" text-anchor="middle">钟慢和尺缩都是相对的，各自参考系内的测量都是正常的</text>

  <text x="80" y="576" font-size="12" fill="#64748b">记住两个公式：时间变长、长度变短，因子都是 √(1 − v²/c²)</text>
</g>

<!-- 第三步：适用范围 -->
<g class="s34-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">牛顿力学适用于宏观、低速；接近光速或强引力场要用相对论</text>

  <g class="s34-zone">
    <rect x="90" y="290" width="152" height="18" rx="9" fill="#86efac" stroke="#059669" stroke-width="1.5"/>
    <text x="166" y="280" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">低速：牛顿力学</text>
  </g>
  <g class="s34-zone">
    <rect x="242" y="290" width="570" height="18" rx="9" fill="#fcd34d" stroke="#d97706" stroke-width="1.5"/>
    <text x="530" y="280" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">速度接近光速：必须用相对论</text>
  </g>

  <line x1="90" y1="340" x2="834" y2="340" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="90" y1="340" x2="90" y2="352"/>
    <line x1="240" y1="340" x2="240" y2="352"/>
    <line x1="430" y1="340" x2="430" y2="352"/>
    <line x1="660" y1="340" x2="660" y2="352"/>
    <line x1="810" y1="340" x2="810" y2="352"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="90" y="372">0</text>
    <text x="240" y="372">0.2c</text>
    <text x="430" y="372">0.5c</text>
    <text x="660" y="372">0.9c</text>
    <text x="810" y="372">c</text>
  </g>
  <text x="820" y="328" font-size="12" font-weight="800" fill="#334155" text-anchor="end">速度 v</text>

  <g class="s34-ex">
    <circle cx="112" cy="404" r="5" fill="#059669"/>
    <text x="124" y="408" font-size="11.5" fill="#475569">汽车 100 km/h</text>
    <circle cx="150" cy="428" r="5" fill="#059669"/>
    <text x="162" y="432" font-size="11.5" fill="#475569">卫星 7.9 km/s</text>
  </g>
  <g class="s34-ex">
    <circle cx="785" cy="404" r="5" fill="#7c3aed"/>
    <text x="772" y="408" font-size="11.5" fill="#5b21b6" text-anchor="end">高能电子 0.99c</text>
  </g>

  <g class="s34-ex">
    <circle cx="720" cy="188" r="26" fill="#0f172a"/>
    <circle cx="720" cy="188" r="34" fill="none" stroke="#7c3aed" stroke-width="3" opacity=".65"/>
    <text x="770" y="180" font-size="12.5" font-weight="800" fill="#5b21b6">强引力场</text>
    <text x="770" y="202" font-size="11.5" fill="#6d28d9">需用广义相对论</text>
    <text x="770" y="222" font-size="11.5" fill="#64748b">牛顿引力只是近似</text>
  </g>

  <rect x="70" y="452" width="360" height="76" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="250" y="478" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">宏观、低速运动</text>
  <text x="250" y="502" font-size="12" fill="#334155" text-anchor="middle">牛顿力学结论非常精确</text>
  <text x="250" y="520" font-size="11.5" fill="#64748b" text-anchor="middle">一般力学问题用它就够了</text>

  <rect x="470" y="452" width="360" height="76" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="650" y="478" font-size="12.5" font-weight="800" fill="#5b21b6" text-anchor="middle">接近光速或强引力场</text>
  <text x="650" y="502" font-size="12" fill="#334155" text-anchor="middle">必须用相对论处理</text>
  <text x="650" y="520" font-size="11.5" fill="#64748b" text-anchor="middle">牛顿力学是相对论的低速近似</text>

  <text x="80" y="576" font-size="12" fill="#64748b">判断用哪套理论：看速度是否接近光速、引力是否足够强</text>
</g>
</svg>
