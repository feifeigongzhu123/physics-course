<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="万有引力定律：引力公式、方向与卡文迪什测引力常量">
<style>
[data-scene="ps-31"] .s31-step1,[data-scene="ps-31"] .s31-step2,[data-scene="ps-31"] .s31-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-31"].s1 .s31-step1,[data-scene="ps-31"].s2 .s31-step2,[data-scene="ps-31"].s3 .s31-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s31draw{to{stroke-dashoffset:0}}
@keyframes s31pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s31pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes s31sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
[data-scene="ps-31"].s1 .s31-f{animation:s31pulse 1.8s ease-in-out infinite}
[data-scene="ps-31"].s1 .s31-dim{stroke-dasharray:360;stroke-dashoffset:360;animation:s31draw 1.2s ease forwards}
[data-scene="ps-31"].s3 .s31-beam{stroke-dasharray:230;stroke-dashoffset:230;animation:s31draw 1.3s ease forwards}
[data-scene="ps-31"].s3 .s31-rod{transform-box:fill-box;transform-origin:center;animation:s31sway 3.2s ease-in-out infinite}
[data-scene="ps-31"].s2 .s31-card,[data-scene="ps-31"].s3 .s31-card{transform-box:fill-box;transform-origin:center;animation:s31pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="560" width="900" height="60" fill="url(#gBench)"/>
<line x1="0" y1="560" x2="900" y2="560" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">万有引力定律：引力公式与引力常量</text>

<!-- 第一步：引力公式 -->
<g class="s31-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">任何两个物体都相互吸引，引力大小跟质量乘积成正比、跟距离平方成反比</text>

  <circle cx="280" cy="300" r="55" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
  <circle cx="620" cy="300" r="40" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
  <text x="280" y="306" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">m₁</text>
  <text x="620" y="306" font-size="16" font-weight="900" fill="#92400e" text-anchor="middle">m₂</text>
  <text x="280" y="380" font-size="12" fill="#475569" text-anchor="middle">质量 m₁</text>
  <text x="620" y="366" font-size="12" fill="#475569" text-anchor="middle">质量 m₂</text>

  <line class="s31-dim" x1="280" y1="200" x2="620" y2="200" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <line x1="280" y1="245" x2="280" y2="200" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="620" y1="260" x2="620" y2="200" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="450" y="190" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">r</text>

  <g class="s31-f" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
    <line x1="335" y1="300" x2="420" y2="300"/>
    <line x1="580" y1="300" x2="495" y2="300"/>
  </g>
  <text x="398" y="288" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="503" y="288" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">F′</text>
  <text x="450" y="368" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">大小相等、方向相反，沿两球心的连线</text>

  <rect x="70" y="400" width="760" height="128" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="430" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">万有引力公式</text>
  <text x="260" y="480" font-size="30" font-weight="900" font-style="italic" fill="#1e3a8a">F</text>
  <text x="300" y="478" font-size="24" font-weight="800" fill="#334155">=</text>
  <text x="445" y="455" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">G m₁ m₂</text>
  <line x1="375" y1="466" x2="515" y2="466" stroke="#334155" stroke-width="2.5"/>
  <text x="445" y="500" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">r²</text>
  <text x="540" y="480" font-size="12.5" fill="#475569">G 为引力常量</text>
  <text x="450" y="520" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">G = 6.67×10⁻¹¹ N·m²/kg²</text>
</g>

<!-- 第二步：方向与适用条件 -->
<g class="s31-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">引力方向沿两物体连线，距离指两质点（或两球心）之间的距离</text>

  <g class="s31-card">
    <rect x="70" y="108" width="480" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="310" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">式中的 r 怎样确定</text>

    <circle cx="160" cy="205" r="7" fill="#1d4ed8"/>
    <circle cx="330" cy="205" r="7" fill="#1d4ed8"/>
    <line x1="167" y1="205" x2="323" y2="205" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="245" y="195" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">r</text>
    <text x="370" y="200" font-size="12.5" fill="#334155">质点：两质点之间的距离</text>
    <text x="370" y="222" font-size="11.5" fill="#64748b">质量集中在两点</text>

    <line x1="100" y1="240" x2="520" y2="240" stroke="#e2e8f0" stroke-width="1.2"/>

    <circle cx="160" cy="292" r="24" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="330" cy="292" r="16" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="160" cy="292" r="2.5" fill="#334155"/><circle cx="330" cy="292" r="2.5" fill="#334155"/>
    <line x1="160" y1="292" x2="330" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="245" y="282" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">r</text>
    <text x="370" y="286" font-size="12.5" fill="#334155">均匀球体：两球心间距离</text>
    <text x="370" y="308" font-size="11.5" fill="#64748b">不是两球表面间的距离</text>

    <line x1="100" y1="332" x2="520" y2="332" stroke="#e2e8f0" stroke-width="1.2"/>

    <rect x="100" y="348" width="440" height="52" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="320" y="370" font-size="12" fill="#7c5a30" text-anchor="middle">形状不规则、相距很近时，</text>
    <text x="320" y="390" font-size="12" fill="#7c5a30" text-anchor="middle">不能直接把 r 代入公式</text>
  </g>

  <g class="s31-card">
    <rect x="570" y="108" width="260" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="700" y="140" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">方向与相互性</text>
    <rect x="588" y="176" width="68" height="46" rx="7" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="744" y="176" width="68" height="46" rx="7" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="622" y="205" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">A</text>
    <text x="778" y="205" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">B</text>
    <line x1="660" y1="190" x2="712" y2="190" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <line x1="740" y1="210" x2="688" y2="210" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="686" y="182" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">F</text>
    <text x="714" y="230" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">F′</text>
    <g font-size="12" fill="#334155">
      <text x="592" y="274">方向沿两物体连线</text>
      <text x="592" y="304">是一对作用力与反作用力</text>
      <text x="592" y="334">两力大小相等、方向相反</text>
      <text x="592" y="364">分别作用在两个物体上</text>
    </g>
    <text x="700" y="396" font-size="11.5" fill="#64748b" text-anchor="middle">引力总是相互的，没有单独存在的引力</text>
  </g>

  <rect x="70" y="436" width="760" height="90" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="464" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">r → 0 时 F → ∞ 的结论不成立</text>
  <text x="450" y="490" font-size="12.5" fill="#7c5a30" text-anchor="middle">因为距离很近时物体不能再看成质点，公式已经不再适用</text>
  <text x="450" y="514" font-size="12" fill="#7c5a30" text-anchor="middle">r 是质点间距离；均匀球体取球心间距离</text>
</g>

<!-- 第三步：卡文迪什测 G -->
<g class="s31-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">卡文迪什用扭秤实验，巧妙地测出了引力常量 G</text>

  <rect x="210" y="114" width="80" height="9" rx="4" fill="#64748b"/>
  <line x1="250" y1="123" x2="250" y2="170" stroke="#64748b" stroke-width="6"/>
  <line x1="250" y1="170" x2="250" y2="242" stroke="#94a3b8" stroke-width="2"/>
  <text x="262" y="202" font-size="11.5" font-weight="700" fill="#475569">石英丝</text>
  <rect x="238" y="242" width="24" height="10" rx="2" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
  <text x="294" y="248" font-size="11.5" font-weight="700" fill="#475569">平面镜</text>
  <line x1="250" y1="252" x2="250" y2="310" stroke="#94a3b8" stroke-width="2"/>

  <g class="s31-rod">
    <line x1="165" y1="310" x2="335" y2="310" stroke="#64748b" stroke-width="5"/>
    <circle cx="165" cy="310" r="9" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="335" cy="310" r="9" fill="#3b82f6" stroke="#1e40af" stroke-width="1.5"/>
  </g>
  <circle cx="150" cy="368" r="26" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <circle cx="350" cy="368" r="26" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <line x1="165" y1="320" x2="157" y2="340" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <line x1="335" y1="320" x2="343" y2="340" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="165" y="338" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">小铅球 m</text>
  <text x="150" y="410" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">大铅球 M</text>
  <text x="250" y="432" font-size="12" fill="#64748b" text-anchor="middle">扭秤装置（示意）</text>
  <path d="M222 270 A34 34 0 0 1 278 270" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrBlue)"/>
  <text x="304" y="272" font-size="11.5" font-weight="700" fill="#6d28d9">扭转</text>

  <line class="s31-beam" x1="255" y1="245" x2="450" y2="170" stroke="#eab308" stroke-width="2.5"/>
  <line x1="450" y1="112" x2="450" y2="215" stroke="#475569" stroke-width="3"/>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="450" y1="140" x2="458" y2="140"/>
    <line x1="450" y1="158" x2="458" y2="158"/>
    <line x1="450" y1="176" x2="458" y2="176"/>
    <line x1="450" y1="194" x2="458" y2="194"/>
  </g>
  <text x="458" y="128" font-size="11.5" font-weight="700" fill="#475569">光屏</text>

  <g class="s31-card">
    <rect x="520" y="108" width="310" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="675" y="140" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">卡文迪什扭秤</text>
    <g font-size="12" fill="#334155">
      <text x="540" y="176">两对铅球间的万有引力，</text>
      <text x="540" y="198">使石英丝发生微小扭转</text>
      <text x="540" y="230">平面镜把微小扭转放大为</text>
      <text x="540" y="252">光点的明显移动</text>
      <text x="540" y="286">G = 6.67×10⁻¹¹</text>
      <text x="540" y="308">N·m²/kg²</text>
      <text x="540" y="342">测出 G 后，就可以定量</text>
      <text x="540" y="364">计算天体之间的引力</text>
    </g>
    <text x="675" y="394" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">被称为“称量地球质量的人”</text>
  </g>

  <rect x="70" y="440" width="760" height="90" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="470" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">放大思路：微小引力 → 石英丝扭转 → 镜面反射光点偏移</text>
  <text x="450" y="496" font-size="12" fill="#475569" text-anchor="middle">G 的数值很小，说明一般物体之间的万有引力非常微弱</text>
  <text x="450" y="520" font-size="12" fill="#475569" text-anchor="middle">只有质量巨大的天体之间，引力才比较明显</text>
</g>
</svg>
