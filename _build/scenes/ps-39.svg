<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验验证机械能守恒：打点计时器装置、gh 与 v²/2 的比较、注意事项">
<style>
[data-scene="ps-39"] .s39-step1,[data-scene="ps-39"] .s39-step2,[data-scene="ps-39"] .s39-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-39"].s1 .s39-step1,[data-scene="ps-39"].s2 .s39-step2,[data-scene="ps-39"].s3 .s39-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s39draw{to{stroke-dashoffset:0}}
@keyframes s39pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s39dot{0%{transform:scale(0);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes s39warn{0%,100%{opacity:.55}50%{opacity:1}}
[data-scene="ps-39"].s1 .s39-dot{transform-box:fill-box;transform-origin:center;animation:s39dot .35s ease both}
[data-scene="ps-39"].s1 .s39-dot:nth-of-type(2){animation-delay:.12s}
[data-scene="ps-39"].s1 .s39-dot:nth-of-type(3){animation-delay:.24s}
[data-scene="ps-39"].s1 .s39-dot:nth-of-type(4){animation-delay:.36s}
[data-scene="ps-39"].s1 .s39-dot:nth-of-type(5){animation-delay:.48s}
[data-scene="ps-39"].s1 .s39-dot:nth-of-type(6){animation-delay:.6s}
[data-scene="ps-39"].s1 .s39-card{transform-box:fill-box;transform-origin:center;animation:s39pop .5s ease .3s both}
[data-scene="ps-39"].s2 .s39-h{stroke-dasharray:180;stroke-dashoffset:180;animation:s39draw .8s ease .2s forwards}
[data-scene="ps-39"].s2 .s39-card{transform-box:fill-box;transform-origin:center;animation:s39pop .5s ease .4s both}
[data-scene="ps-39"].s2 .s39-eq{animation:s39warn 1.8s ease-in-out infinite}
[data-scene="ps-39"].s3 .s39-box{transform-box:fill-box;transform-origin:center;animation:s39pop .45s ease both}
[data-scene="ps-39"].s3 .s39-box:nth-of-type(2){animation-delay:.15s}
[data-scene="ps-39"].s3 .s39-box:nth-of-type(3){animation-delay:.3s}
[data-scene="ps-39"].s3 .s39-card{transform-box:fill-box;transform-origin:center;animation:s39pop .5s ease .2s both}
[data-scene="ps-39"].s3 .s39-warn{animation:s39warn 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：验证机械能守恒定律</text>

<!-- 第一步：实验装置 -->
<g class="s39-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 装置：重物自由下落，纸带记录运动</text>

  <rect x="150" y="468" width="210" height="14" rx="4" fill="#94a3b8"/>
  <rect x="170" y="130" width="14" height="338" fill="#cbd5e1"/>
  <rect x="170" y="130" width="180" height="12" rx="3" fill="#94a3b8"/>

  <rect x="250" y="150" width="110" height="66" rx="8" fill="#334155"/>
  <rect x="262" y="160" width="86" height="46" rx="4" fill="#0f172a"/>
  <circle cx="305" cy="183" r="9" fill="#22c55e" opacity=".7"/>
  <text x="305" y="242" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">打点计时器</text>
  <text x="305" y="260" font-size="11" fill="#64748b" text-anchor="middle">使用交流电源</text>

  <rect x="298" y="216" width="14" height="200" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <g class="s39-dots" fill="#334155">
    <circle class="s39-dot" cx="305" cy="230" r="2.6"/>
    <circle class="s39-dot" cx="305" cy="258" r="2.6"/>
    <circle class="s39-dot" cx="305" cy="292" r="2.6"/>
    <circle class="s39-dot" cx="305" cy="334" r="2.6"/>
    <circle class="s39-dot" cx="305" cy="380" r="2.6"/>
    <circle class="s39-dot" cx="305" cy="408" r="2.6"/>
  </g>
  <text x="328" y="300" font-size="12" font-weight="700" fill="#475569">纸带</text>
  <text x="352" y="218" font-size="11" fill="#64748b">限位孔</text>

  <rect x="276" y="416" width="58" height="50" rx="6" fill="#64748b"/>
  <text x="305" y="447" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">重物</text>

  <g class="s39-card">
    <rect x="470" y="110" width="360" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">装置要求</text>
    <text x="494" y="182" font-size="12" fill="#334155">• 计时器竖直固定</text>
    <text x="494" y="212" font-size="12" fill="#334155">• 纸带竖直、平整</text>
    <text x="494" y="242" font-size="12" fill="#334155">• 使用交流电源</text>
    <text x="494" y="272" font-size="12" fill="#334155">• 先接通电源，再释放重物</text>
    <text x="494" y="302" font-size="12" fill="#334155">• 重物质量大一些</text>
    <line x1="494" y1="322" x2="806" y2="322" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="650" y="350" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">减小摩擦造成的误差</text>
    <text x="650" y="376" font-size="11.5" fill="#64748b" text-anchor="middle">纸带要穿过限位孔，保持竖直</text>
    <text x="650" y="400" font-size="11.5" fill="#64748b" text-anchor="middle">接通电源后待打点稳定再释放</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">重物自由下落，纸带上的点记录了它下落的时间和位移</text>
</g>

<!-- 第二步：验证方法 -->
<g class="s39-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 比较 gh 与 v²/2 是否相等</text>

  <rect x="150" y="130" width="16" height="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <g fill="#334155">
    <circle cx="158" cy="170" r="3.5"/>
    <circle cx="158" cy="240" r="3.5"/>
    <circle cx="158" cy="330" r="3.5"/>
  </g>
  <text x="180" y="175" font-size="12" font-weight="800" fill="#1e3a8a">A</text>
  <text x="180" y="245" font-size="12" font-weight="800" fill="#1e3a8a">B</text>
  <text x="180" y="335" font-size="12" font-weight="800" fill="#1e3a8a">C</text>

  <line class="s39-h" x1="120" y1="170" x2="120" y2="240" stroke="#b45309" stroke-width="2" marker-start="url(#arrAmber)" marker-end="url(#arrAmber)"/>
  <text x="108" y="210" font-size="13" font-weight="800" fill="#b45309" text-anchor="end">h₁</text>
  <line class="s39-h" x1="120" y1="240" x2="120" y2="330" stroke="#b45309" stroke-width="2" marker-start="url(#arrAmber)" marker-end="url(#arrAmber)"/>
  <text x="108" y="290" font-size="13" font-weight="800" fill="#b45309" text-anchor="end">h₂</text>
  <text x="250" y="452" font-size="11.5" fill="#64748b">相邻计数点时间间隔 T</text>

  <g class="s39-card">
    <rect x="420" y="110" width="410" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="625" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">验证关系</text>
    <text x="444" y="184" font-size="12.5" fill="#334155">重力势能减少量：ΔEp = mgh</text>
    <text x="444" y="214" font-size="12.5" fill="#334155">动能增加量：ΔEk = ½mv²</text>
    <line x1="444" y1="236" x2="806" y2="236" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="625" y="264" font-size="12" fill="#475569" text-anchor="middle">若机械能守恒：</text>
    <text class="s39-eq" x="625" y="302" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">mgh = ½mv²</text>
    <text x="625" y="338" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">即 gh = v²/2</text>
    <line x1="444" y1="358" x2="806" y2="358" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="625" y="386" font-size="13" fill="#334155" text-anchor="middle">v_B = (h_C − h_A) / (2T)</text>
    <text x="625" y="412" font-size="11" fill="#64748b" text-anchor="middle">用中间时刻的瞬时速度求动能</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">在误差范围内 gh 与 v²/2 相等，就验证了机械能守恒</text>
</g>

<!-- 第三步：注意事项 -->
<g class="s39-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 注意事项：先通电，后释放</text>

  <g class="s39-box">
    <rect x="70" y="126" width="310" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="90" y="158" font-size="13" font-weight="800" fill="#1e3a8a">① 接通电源，打点稳定</text>
    <text x="90" y="182" font-size="11.5" fill="#64748b">让计时器先正常工作</text>
  </g>
  <line x1="225" y1="202" x2="225" y2="228" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g class="s39-box">
    <rect x="70" y="228" width="310" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="90" y="260" font-size="13" font-weight="800" fill="#1e3a8a">② 释放重物，自由下落</text>
    <text x="90" y="284" font-size="11.5" fill="#64748b">纸带上打出一系列点</text>
  </g>
  <line x1="225" y1="304" x2="225" y2="330" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g class="s39-box">
    <rect x="70" y="330" width="310" height="76" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="90" y="362" font-size="13" font-weight="800" fill="#1e3a8a">③ 选点、测距、算速度</text>
    <text x="90" y="386" font-size="11.5" fill="#64748b">比较 mgh 与 ½mv²</text>
  </g>

  <g class="s39-card">
    <rect x="420" y="110" width="410" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="625" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">注意事项</text>
    <text x="444" y="182" font-size="12" fill="#334155">• 重物质量要大，减小阻力影响</text>
    <text x="444" y="214" font-size="12" fill="#334155">• 纸带竖直，减少限位孔摩擦</text>
    <text class="s39-warn" x="444" y="246" font-size="12" font-weight="800" fill="#b91c1c">• 先接通电源，后释放纸带</text>
    <text x="444" y="278" font-size="12" fill="#334155">• 第一个点应是开始下落的点</text>
    <text x="444" y="310" font-size="12" fill="#334155">• 多次实验，取平均值</text>
    <text x="444" y="342" font-size="12" fill="#334155">• 纸带选点间距要适当</text>
    <line x1="444" y1="362" x2="806" y2="362" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="625" y="390" font-size="11.5" fill="#64748b" text-anchor="middle">顺序反了，第一个点可能不是开始下落的点</text>
    <text x="625" y="412" font-size="11.5" fill="#64748b" text-anchor="middle">纸带也可能只打出后半段</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">规范操作、减小摩擦和偶然误差，才能得到可靠结论</text>
</g>
</svg>
