<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="欧姆定律：定律表述、公式与单位、求电流求电压求电阻三类计算">
<style>
.p63-s1,.p63-s2,.p63-s3{opacity:0;visibility:hidden}
.p63-s1{opacity:1;visibility:visible}
[data-scene="pj-63"] .p63-s1,[data-scene="pj-63"] .p63-s2,[data-scene="pj-63"] .p63-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-63"].s1 .p63-s1,[data-scene="pj-63"].s2 .p63-s2,[data-scene="pj-63"].s3 .p63-s3{opacity:1;visibility:visible}
@keyframes p63pop{0%{transform:scale(.8);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p63draw{to{stroke-dashoffset:0}}
@keyframes p63pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes p63slide{0%{transform:translateX(-8px);opacity:0}100%{transform:translateX(0);opacity:1}}
[data-scene="pj-63"].s1 .p63-quote{transform-box:fill-box;transform-origin:center;animation:p63pop .6s ease both}
[data-scene="pj-63"].s1 .p63-rule{stroke-dasharray:360;stroke-dashoffset:360;animation:p63draw 1.2s ease .2s forwards}
[data-scene="pj-63"].s1 .p63-row{transform-box:fill-box;transform-origin:left center;animation:p63slide .55s ease both}
[data-scene="pj-63"].s1 .p63-row2{animation-delay:.15s}
[data-scene="pj-63"].s2 .p63-formula{transform-box:fill-box;transform-origin:center;animation:p63pop .6s ease both}
[data-scene="pj-63"].s2 .p63-unit{transform-box:fill-box;transform-origin:left center;animation:p63slide .5s ease both}
[data-scene="pj-63"].s2 .p63-unit2{animation-delay:.1s}
[data-scene="pj-63"].s2 .p63-unit3{animation-delay:.2s}
[data-scene="pj-63"].s3 .p63-card{transform-box:fill-box;transform-origin:center;animation:p63pop .55s ease both}
[data-scene="pj-63"].s3 .p63-card2{animation-delay:.12s}
[data-scene="pj-63"].s3 .p63-card3{animation-delay:.24s}
[data-scene="pj-63"].s3 .p63-result{animation:p63pulse 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">欧姆定律：I = U / R，一条定律三种用法</text>

<!-- 第一步：定律表述 -->
<g class="p63-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">欧姆定律：电流跟电压成正比，跟电阻成反比</text>

  <rect x="36" y="100" width="520" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">定律内容</text>

  <g class="p63-quote">
    <text x="96" y="184" font-size="18" font-weight="800" fill="#1e3a8a">导体中的电流，跟导体两端的</text>
    <text x="96" y="216" font-size="18" font-weight="800" fill="#1e3a8a">电压成正比，跟导体的电阻</text>
    <text x="96" y="248" font-size="18" font-weight="800" fill="#1e3a8a">成反比。</text>
  </g>
  <text x="524" y="278" font-size="13" font-weight="800" fill="#64748b" text-anchor="end">—— 欧姆定律</text>
  <line class="p63-rule" x1="96" y1="290" x2="500" y2="290" stroke="#bfdbfe" stroke-width="2"/>

  <rect x="60" y="304" width="472" height="86" rx="12" fill="#e8effc"/>
  <text x="296" y="328" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">适用条件：同一导体、同一时刻（温度一定）</text>
  <text x="296" y="352" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">U、I、R 必须对应同一段导体</text>
  <text x="296" y="376" font-size="11.5" fill="#475569" text-anchor="middle">三个量要同时取值，不能张冠李戴</text>

  <rect x="576" y="100" width="288" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="180" height="28" rx="14" fill="#e6f7f1"/>
  <text x="686" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">两个关系</text>

  <g class="p63-row">
    <rect x="596" y="160" width="248" height="72" rx="12" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="720" y="192" font-size="17" font-weight="900" fill="#047857" text-anchor="middle">U 增大 → I 增大</text>
    <text x="720" y="218" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">电阻一定时，I 与 U 成正比</text>
  </g>

  <g class="p63-row p63-row2">
    <rect x="596" y="246" width="248" height="72" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="720" y="278" font-size="17" font-weight="900" fill="#b91c1c" text-anchor="middle">R 增大 → I 减小</text>
    <text x="720" y="304" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">电压一定时，I 与 R 成反比</text>
  </g>

  <text x="720" y="352" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">前提：其他条件保持不变</text>
  <text x="720" y="378" font-size="11" fill="#64748b" text-anchor="middle">研究 I 与 U 时 R 不变</text>
  <text x="720" y="396" font-size="11" fill="#64748b" text-anchor="middle">研究 I 与 R 时 U 不变</text>
</g>

<!-- 第二步：公式与单位 -->
<g class="p63-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">欧姆定律的公式：I = U / R，单位分别为 A、V、Ω</text>

  <rect x="36" y="100" width="430" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="146" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">公式与变形</text>

  <g class="p63-formula">
    <text x="251" y="200" font-size="34" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = U / R</text>
  </g>

  <rect x="70" y="232" width="150" height="52" rx="10" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="145" y="266" font-size="18" font-weight="900" fill="#047857" text-anchor="middle">U = I R</text>
  <rect x="282" y="232" width="150" height="52" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="357" y="266" font-size="18" font-weight="900" fill="#b45309" text-anchor="middle">R = U / I</text>

  <text x="251" y="316" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">已知其中两个量，就可以求第三个量</text>
  <text x="251" y="344" font-size="11.5" fill="#64748b" text-anchor="middle">三个量必须对应同一段导体、同一时刻</text>
  <text x="251" y="368" font-size="11.5" fill="#64748b" text-anchor="middle">代入数据时，单位要统一</text>
  <text x="251" y="392" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">结果要带单位，不能只写数字</text>

  <rect x="486" y="100" width="378" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="506" y="116" width="150" height="28" rx="14" fill="#e8effc"/>
  <text x="581" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">单位</text>

  <g class="p63-unit">
    <rect x="510" y="158" width="330" height="38" rx="9" fill="#f8fbff"/>
    <text x="530" y="183" font-size="12" font-weight="800" fill="#1e3a8a">I　电流</text>
    <text x="816" y="183" font-size="12" font-weight="700" fill="#334155" text-anchor="end">安培（A）</text>
  </g>
  <g class="p63-unit p63-unit2">
    <rect x="510" y="202" width="330" height="38" rx="9" fill="#f8fbff"/>
    <text x="530" y="227" font-size="12" font-weight="800" fill="#1e3a8a">U　电压</text>
    <text x="816" y="227" font-size="12" font-weight="700" fill="#334155" text-anchor="end">伏特（V）</text>
  </g>
  <g class="p63-unit p63-unit3">
    <rect x="510" y="246" width="330" height="38" rx="9" fill="#f8fbff"/>
    <text x="530" y="271" font-size="12" font-weight="800" fill="#1e3a8a">R　电阻</text>
    <text x="816" y="271" font-size="12" font-weight="700" fill="#334155" text-anchor="end">欧姆（Ω）</text>
  </g>

  <rect x="510" y="296" width="330" height="42" rx="9" fill="#e8effc"/>
  <text x="675" y="323" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">1 A = 1 V / 1 Ω</text>

  <text x="675" y="358" font-size="11.5" fill="#64748b" text-anchor="middle">计算前先统一单位：mV、mA、kΩ 要先换算</text>
  <text x="675" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">R = U / I 是测量式，不是决定式</text>
  <text x="675" y="398" font-size="11" fill="#b91c1c" text-anchor="middle">电阻由导体本身决定，与 U、I 无关</text>
</g>

<!-- 第三步：三种计算 -->
<g class="p63-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">欧姆定律的三类计算：求电流、求电压、求电阻</text>

  <g class="p63-card">
    <rect x="36" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="56" y="116" width="150" height="28" rx="14" fill="#e8effc"/>
    <text x="131" y="135" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 求电流</text>

    <text x="166" y="196" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = U / R</text>
    <text x="166" y="238" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">已知 U = 6 V</text>
    <text x="166" y="262" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">R = 12 Ω</text>
    <text x="166" y="296" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">I = 6 V ÷ 12 Ω</text>
    <text x="166" y="322" font-size="16" font-weight="900" fill="#1e40af" text-anchor="middle">= 0.5 A</text>

    <rect class="p63-result" x="72" y="340" width="188" height="38" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="166" y="365" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = 0.5 A</text>
    <text x="166" y="398" font-size="11" fill="#64748b" text-anchor="middle">电流表读数应与计算值一致</text>
  </g>

  <g class="p63-card p63-card2">
    <rect x="320" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="340" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
    <text x="415" y="135" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">② 求电压</text>

    <text x="450" y="196" font-size="22" font-weight="900" fill="#047857" text-anchor="middle">U = I R</text>
    <text x="450" y="238" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">已知 I = 0.4 A</text>
    <text x="450" y="262" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">R = 15 Ω</text>
    <text x="450" y="296" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">U = 0.4 A × 15 Ω</text>
    <text x="450" y="322" font-size="16" font-weight="900" fill="#047857" text-anchor="middle">= 6 V</text>

    <rect class="p63-result" x="356" y="340" width="188" height="38" rx="9" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="450" y="365" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">U = 6 V</text>
    <text x="450" y="398" font-size="11" fill="#64748b" text-anchor="middle">电压表读数应与计算值一致</text>
  </g>

  <g class="p63-card p63-card3">
    <rect x="604" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="624" y="116" width="150" height="28" rx="14" fill="#fff7ed"/>
    <text x="699" y="135" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">③ 求电阻</text>

    <text x="734" y="196" font-size="22" font-weight="900" fill="#b45309" text-anchor="middle">R = U / I</text>
    <text x="734" y="238" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">已知 U = 6 V</text>
    <text x="734" y="262" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">I = 0.3 A</text>
    <text x="734" y="296" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">R = 6 V ÷ 0.3 A</text>
    <text x="734" y="322" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">= 20 Ω</text>

    <rect class="p63-result" x="640" y="340" width="188" height="38" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="734" y="365" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">R = 20 Ω</text>
    <text x="734" y="398" font-size="11" fill="#64748b" text-anchor="middle">伏安法测电阻的原理</text>
  </g>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">解题规范：写公式 → 代数据（带单位）→ 得结果（带单位），三个量必须同体同时</text>
</g>
</svg>
