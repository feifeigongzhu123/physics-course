<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="汽化和液化：沸腾与蒸发、沸点图像、水蒸气遇冷液化">
  <style>
[data-scene="pj-14"] .p14-z1,[data-scene="pj-14"] .p14-z2,[data-scene="pj-14"] .p14-z3{opacity:0;transition:opacity .45s}
[data-scene="pj-14"].s1 .p14-z1,[data-scene="pj-14"].s2 .p14-z2,[data-scene="pj-14"].s3 .p14-z3{opacity:1}
[data-scene="pj-14"].s1 .p14-bub{animation:p14bub 2s ease-in infinite}
[data-scene="pj-14"].s1 .p14-bub:nth-of-type(2){animation-delay:.35s}
[data-scene="pj-14"].s1 .p14-bub:nth-of-type(3){animation-delay:.7s}
[data-scene="pj-14"].s1 .p14-bub:nth-of-type(4){animation-delay:1.05s}
[data-scene="pj-14"].s1 .p14-bub:nth-of-type(5){animation-delay:1.4s}
[data-scene="pj-14"] .p14-steam{transform-box:fill-box;transform-origin:center;animation:p14steam 2.6s ease-in-out infinite}
[data-scene="pj-14"] .p14-steam:nth-of-type(2){animation-delay:.7s}
[data-scene="pj-14"] .p14-steam:nth-of-type(3){animation-delay:1.3s}
[data-scene="pj-14"] .p14-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite}
[data-scene="pj-14"] .p14-evp{animation:p14evp 2.2s ease-in-out infinite}
[data-scene="pj-14"] .p14-evp:nth-of-type(2){animation-delay:.5s}
[data-scene="pj-14"] .p14-evp:nth-of-type(3){animation-delay:1s}
[data-scene="pj-14"].s2 .p14-merc{transform-box:fill-box;transform-origin:50% 100%;animation:p14merc 1.3s ease both}
[data-scene="pj-14"].s2 .p14-curve{stroke-dasharray:420;stroke-dashoffset:420;animation:p14draw 1.4s ease forwards}
[data-scene="pj-14"] .p14-drop{animation:j11drip 2.4s ease-in infinite}
[data-scene="pj-14"] .p14-drop:nth-of-type(2){animation-delay:.5s}
[data-scene="pj-14"] .p14-drop:nth-of-type(3){animation-delay:1s}
[data-scene="pj-14"] .p14-drop:nth-of-type(4){animation-delay:1.5s}
[data-scene="pj-14"].s3 .p14-piston{animation:p14push 2.6s ease-in-out infinite alternate}
@keyframes p14bub{0%{transform:translateY(24px) scale(.55);opacity:0}18%{opacity:.95}100%{transform:translateY(-74px) scale(1.12);opacity:0}}
@keyframes p14steam{0%{transform:translateY(6px) scale(.8);opacity:0}30%{opacity:.9}100%{transform:translateY(-30px) scale(1.3);opacity:0}}
@keyframes p14evp{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
@keyframes p14merc{from{transform:scaleY(.18)}to{transform:scaleY(1)}}
@keyframes p14draw{to{stroke-dashoffset:0}}
@keyframes p14push{from{transform:translateY(0)}to{transform:translateY(34px)}}
  </style>
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">汽化和液化：汽化吸热，液化放热</text>

  <!-- ===== 第 1 步：汽化的两种方式 ===== -->
  <g class="p14-z1" data-zone="1">
    <rect x="40" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="240" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">沸腾：内部和表面同时汽化</text>
    <rect x="116" y="110" width="118" height="26" rx="13" fill="#e8effc"/>
    <text x="175" y="128" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">内部产生气泡</text>
    <rect x="246" y="110" width="118" height="26" rx="13" fill="#e8effc"/>
    <text x="305" y="128" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">上升且变大</text>

    <!-- 烧杯与水 -->
    <path d="M150 170 L150 344 Q150 356 162 356 L318 356 Q330 356 330 344 L330 170" fill="#f9fcff" stroke="#93c5fd" stroke-width="3"/>
    <path d="M154 234 L326 234 L326 344 Q326 350 318 350 L162 350 Q154 350 154 344 Z" fill="#bfe0fb"/>
    <line x1="154" y1="234" x2="326" y2="234" stroke="#60a5fa" stroke-width="2"/>
    <text x="240" y="206" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">气泡在液体内部产生</text>

    <g fill="#ffffff" stroke="#3b82f6" stroke-width="1.8">
      <circle class="p14-bub" cx="196" cy="318" r="5"/>
      <circle class="p14-bub" cx="231" cy="300" r="7"/>
      <circle class="p14-bub" cx="269" cy="284" r="6"/>
      <circle class="p14-bub" cx="294" cy="318" r="4"/>
      <circle class="p14-bub" cx="249" cy="332" r="5"/>
    </g>

    <!-- 白汽 -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <g transform="translate(176,155)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(228,146)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(278,158)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    </g>

    <!-- 石棉网、三脚架、酒精灯 -->
    <rect x="138" y="356" width="204" height="8" rx="2" fill="#cbd5e1"/>
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="168" y1="364" x2="152" y2="444"/>
      <line x1="312" y1="364" x2="328" y2="444"/>
    </g>
    <line x1="152" y1="444" x2="188" y2="444" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="292" y1="444" x2="328" y2="444" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path class="p14-flame" d="M240 364 C 253 381 253 395 240 404 C 227 395 227 381 240 364 Z" fill="#fb923c"/>
    <path d="M240 382 C 246 391 246 398 240 402 C 234 398 234 391 240 382 Z" fill="#fde68a"/>
    <path d="M206 410 L274 410 L282 442 L198 442 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <line x1="240" y1="404" x2="240" y2="410" stroke="#78716c" stroke-width="3"/>
    <text x="352" y="398" font-size="12" font-weight="800" fill="#b45309">吸热</text>

    <!-- 右卡：蒸发 -->
    <rect x="460" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="660" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">蒸发：只在液体表面发生</text>
    <rect x="540" y="110" width="112" height="26" rx="13" fill="#e6f7f1"/>
    <text x="596" y="128" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">任何温度</text>
    <rect x="664" y="110" width="120" height="26" rx="13" fill="#e6f7f1"/>
    <text x="724" y="128" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">吸热 · 致冷</text>

    <!-- 太阳 -->
    <circle cx="800" cy="152" r="21" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="800" y1="120" x2="800" y2="128"/><line x1="800" y1="176" x2="800" y2="184"/>
      <line x1="768" y1="152" x2="776" y2="152"/><line x1="824" y1="152" x2="832" y2="152"/>
      <line x1="777" y1="129" x2="783" y2="135"/><line x1="817" y1="169" x2="823" y2="175"/>
      <line x1="823" y1="129" x2="817" y2="135"/><line x1="783" y1="169" x2="777" y2="175"/>
    </g>
    <text x="800" y="206" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">温度越高越快</text>

    <!-- 蒸发皿 -->
    <ellipse cx="660" cy="340" rx="112" ry="16" fill="#e2ecf9" stroke="#93c5fd" stroke-width="2"/>
    <path d="M548 340 Q660 414 772 340" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <ellipse cx="660" cy="340" rx="100" ry="12" fill="#bfe0fb"/>

    <g stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round">
      <line class="p14-evp" x1="612" y1="322" x2="600" y2="276" marker-end="url(#arrAmber)"/>
      <line class="p14-evp" x1="650" y1="318" x2="648" y2="268" marker-end="url(#arrAmber)"/>
      <line class="p14-evp" x1="692" y1="322" x2="706" y2="278" marker-end="url(#arrAmber)"/>
    </g>
    <text x="660" y="250" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">水分子从液面逸出</text>

    <line x1="552" y1="422" x2="768" y2="422" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="660" y="444" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">表面积越大，蒸发越快</text>
  </g>

  <!-- ===== 第 2 步：沸腾与沸点 ===== -->
  <g class="p14-z2" data-zone="2">
    <rect x="40" y="70" width="430" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="255" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">沸腾：温度达到沸点后保持不变</text>

    <path d="M130 150 L130 318 Q130 330 142 330 L288 330 Q300 330 300 318 L300 150" fill="#f9fcff" stroke="#93c5fd" stroke-width="3"/>
    <path d="M134 208 L296 208 L296 318 Q296 324 288 324 L142 324 Q134 324 134 318 Z" fill="#bfe0fb"/>
    <line x1="134" y1="208" x2="296" y2="208" stroke="#60a5fa" stroke-width="2"/>

    <g fill="#ffffff" stroke="#3b82f6" stroke-width="1.8">
      <circle class="p14-bub" cx="165" cy="300" r="5"/>
      <circle class="p14-bub" cx="205" cy="285" r="7"/>
      <circle class="p14-bub" cx="248" cy="268" r="6"/>
      <circle class="p14-bub" cx="275" cy="304" r="4"/>
      <circle class="p14-bub" cx="222" cy="318" r="5"/>
    </g>

    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <g transform="translate(150,130)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(198,122)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(244,134)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    </g>

    <!-- 温度计 -->
    <g>
      <rect x="230" y="118" width="12" height="194" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <rect class="p14-merc" x="233" y="196" width="6" height="122" fill="#dc2626"/>
      <circle cx="236" cy="318" r="10" fill="#dc2626"/>
      <g stroke="#94a3b8" stroke-width="1.5">
        <line x1="242" y1="180" x2="250" y2="180"/>
        <line x1="242" y1="212" x2="250" y2="212"/>
        <line x1="242" y1="244" x2="250" y2="244"/>
        <line x1="242" y1="276" x2="250" y2="276"/>
      </g>
      <g font-size="11" fill="#64748b" text-anchor="end">
        <text x="228" y="184">110</text>
        <text x="228" y="216">100</text>
        <text x="228" y="248">90</text>
        <text x="228" y="280">80</text>
      </g>
      <circle cx="236" cy="212" r="4" fill="#dc2626"/>
      <line x1="244" y1="212" x2="356" y2="212" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 5"/>
      <text x="362" y="207" font-size="13" font-weight="800" fill="#b91c1c">沸点 100 ℃</text>
    </g>

    <rect x="124" y="330" width="182" height="8" rx="2" fill="#cbd5e1"/>
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
      <line x1="148" y1="338" x2="132" y2="430"/>
      <line x1="284" y1="338" x2="300" y2="430"/>
    </g>
    <line x1="132" y1="430" x2="166" y2="430" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="266" y1="430" x2="300" y2="430" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path class="p14-flame" d="M216 342 C 229 359 229 374 216 382 C 203 374 203 359 216 342 Z" fill="#fb923c"/>
    <path d="M216 360 C 222 369 222 376 216 380 C 210 376 210 369 216 360 Z" fill="#fde68a"/>
    <path d="M186 388 L250 388 L258 420 L178 420 Z" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <line x1="216" y1="382" x2="216" y2="388" stroke="#78716c" stroke-width="3"/>
    <text x="316" y="368" font-size="11.5" font-weight="700" fill="#b45309">继续吸热</text>
    <text x="316" y="388" font-size="11.5" font-weight="700" fill="#b45309">温度不变</text>

    <!-- 右侧温度—时间图像 -->
    <rect x="490" y="70" width="370" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="675" y="99" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">温度—时间图像</text>
    <line x1="540" y1="130" x2="540" y2="372" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <line x1="540" y1="370" x2="812" y2="370" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>
    <g font-size="11" fill="#64748b" text-anchor="end">
      <text x="530" y="254">60</text>
      <text x="530" y="214">80</text>
      <text x="530" y="174">100</text>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="534" y1="250" x2="540" y2="250"/>
      <line x1="534" y1="210" x2="540" y2="210"/>
      <line x1="534" y1="170" x2="540" y2="170"/>
    </g>
    <line x1="540" y1="170" x2="814" y2="170" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text x="808" y="160" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">沸点</text>
    <path class="p14-curve" d="M552 352 C 572 300 592 230 620 172 L764 172" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="620" cy="172" r="4.5" fill="#dc2626"/>
    <circle cx="764" cy="172" r="4.5" fill="#dc2626"/>
    <text x="628" y="158" font-size="11" font-weight="700" fill="#b91c1c">开始沸腾</text>
    <text x="704" y="196" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">继续吸热，温度不变</text>
    <text x="806" y="392" font-size="12" fill="#64748b" text-anchor="end">t/min</text>
    <text x="552" y="120" font-size="12" fill="#64748b">T/℃</text>

    <rect x="510" y="406" width="330" height="34" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
    <text x="675" y="428" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">气压越低，沸点越低 · 高原上水不到 100 ℃</text>
  </g>

  <!-- ===== 第 3 步：液化 ===== -->
  <g class="p14-z3" data-zone="3">
    <rect x="40" y="70" width="460" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="270" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">液化：气体遇冷变成液体，放出热量</text>

    <!-- 烧杯 -->
    <path d="M100 290 L100 408 Q100 420 112 420 L238 420 Q250 420 250 408 L250 290" fill="#f9fcff" stroke="#93c5fd" stroke-width="3"/>
    <path d="M104 342 L246 342 L246 408 Q246 414 238 414 L112 414 Q104 414 104 408 Z" fill="#bfe0fb"/>
    <line x1="104" y1="342" x2="246" y2="342" stroke="#60a5fa" stroke-width="2"/>
    <text x="240" y="406" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="end">热水</text>

    <!-- 上升的水蒸气 -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <g transform="translate(112,258)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(158,240)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
      <g transform="translate(204,254)"><path class="p14-steam" d="M0 10 Q0 3 8 3 Q10 -6 20 -2 Q29 -3 29 6 Q35 8 34 13 L0 13 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    </g>

    <!-- 玻璃盖片与水滴 -->
    <g transform="rotate(-9 200 181)">
      <rect x="115" y="171" width="170" height="12" rx="5" fill="#eaf3fd" stroke="#93c5fd" stroke-width="2"/>
      <line x1="124" y1="174" x2="276" y2="174" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g fill="#60a5fa" opacity=".95">
      <ellipse class="p14-drop" cx="150" cy="190" rx="4" ry="5"/>
      <ellipse class="p14-drop" cx="180" cy="193" rx="4" ry="5"/>
      <ellipse class="p14-drop" cx="212" cy="190" rx="4" ry="5"/>
      <ellipse class="p14-drop" cx="242" cy="194" rx="4" ry="5"/>
    </g>

    <line x1="286" y1="186" x2="316" y2="186" stroke="#93c5fd" stroke-width="1.6"/>
    <text x="322" y="176" font-size="12.5" font-weight="800" fill="#1e40af">白气 = 小水滴</text>
    <text x="322" y="196" font-size="11.5" fill="#64748b">不是水蒸气</text>
    <text x="322" y="222" font-size="11.5" font-weight="800" fill="#b91c1c">遇冷 → 液化放热</text>
    <text x="322" y="252" font-size="11.5" fill="#475569">降低温度可使气体液化</text>
    <text x="270" y="446" font-size="11.5" fill="#64748b" text-anchor="middle">杯口“白气”是水蒸气液化成的小水滴</text>

    <!-- 右卡：压缩体积 -->
    <rect x="520" y="70" width="340" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="690" y="99" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">压缩体积也能使气体液化</text>

    <rect x="560" y="150" width="130" height="172" rx="12" fill="#eef6ff" stroke="#93c5fd" stroke-width="3"/>
    <g fill="#a78bfa">
      <circle cx="588" cy="192" r="4"/><circle cx="618" cy="178" r="4"/>
      <circle cx="650" cy="196" r="4"/><circle cx="678" cy="182" r="4"/>
      <circle cx="602" cy="222" r="4"/><circle cx="656" cy="226" r="4"/>
      <circle cx="684" cy="212" r="4"/>
    </g>
    <g class="p14-piston">
      <rect x="566" y="156" width="118" height="20" rx="8" fill="#94a3b8"/>
      <line x1="625" y1="156" x2="625" y2="132" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
      <rect x="606" y="124" width="38" height="9" rx="4" fill="#64748b"/>
    </g>
    <rect x="566" y="272" width="118" height="44" rx="8" fill="#60a5fa" opacity=".85"/>
    <text x="625" y="300" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">液态</text>
    <line x1="716" y1="118" x2="716" y2="146" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>
    <text x="728" y="136" font-size="11.5" font-weight="800" fill="#b45309">压缩</text>
    <text x="690" y="344" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">常温加压 → 液化石油气</text>

