<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电磁感应现象及应用：产生条件、楞次定律与发电机变压器等应用">
<style>
[data-scene="ps-59"] .s59-s1,[data-scene="ps-59"] .s59-s2,[data-scene="ps-59"] .s59-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-59"].s1 .s59-s1,[data-scene="ps-59"].s2 .s59-s2,[data-scene="ps-59"].s3 .s59-s3{opacity:1;visibility:visible}
@keyframes s59fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s59draw{to{stroke-dashoffset:0}}
@keyframes s59pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s59pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes s59sway{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes s59slide{0%{transform:translateX(-14px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes s59flow{to{stroke-dashoffset:-36}}
[data-scene="ps-59"].s1 .s59-coil{transform-box:fill-box;transform-origin:center;animation:s59pop .5s ease both}
[data-scene="ps-59"].s1 .s59-coil2{animation-delay:.1s}
[data-scene="ps-59"].s1 .s59-coil3{animation-delay:.2s}
[data-scene="ps-59"].s1 .s59-coil4{animation-delay:.3s}
[data-scene="ps-59"].s1 .s59-magnet{animation:s59slide .6s ease .25s both}
[data-scene="ps-59"].s1 .s59-needle{transform-box:fill-box;transform-origin:0 100%;animation:s59sway 2.6s ease-in-out infinite}
[data-scene="ps-59"].s1 .s59-flux{animation:s59pulse 1.9s ease-in-out infinite}
[data-scene="ps-59"].s1 .s59-wire{stroke-dasharray:6 6;animation:s59flow 1.2s linear infinite}
[data-scene="ps-59"].s2 .s59-panel{transform-box:fill-box;transform-origin:center;animation:s59pop .55s ease both}
[data-scene="ps-59"].s2 .s59-panel2{animation-delay:.15s}
[data-scene="ps-59"].s2 .s59-b{stroke-dasharray:90;stroke-dashoffset:90;animation:s59draw .8s ease .4s forwards}
[data-scene="ps-59"].s2 .s59-card{transform-box:fill-box;transform-origin:center;animation:s59pop .55s ease .3s both}
[data-scene="ps-59"].s3 .s59-app{transform-box:fill-box;transform-origin:center;animation:s59pop .5s ease both}
[data-scene="ps-59"].s3 .s59-app2{animation-delay:.12s}
[data-scene="ps-59"].s3 .s59-app3{animation-delay:.24s}
[data-scene="ps-59"].s3 .s59-app4{animation-delay:.36s}
[data-scene="ps-59"].s3 .s59-spin{animation:s59pulse 2.2s ease-in-out infinite}
[data-scene="ps-59"].s3 .s59-heat{animation:s59pulse 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电磁感应现象及应用：磁通量变化产生感应电流</text>

<!-- 第一步：产生条件 -->
<g class="s59-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">产生条件：回路闭合，且穿过回路的磁通量发生变化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">磁体插入线圈，电流计偏转</text>

  <g class="s59-magnet">
    <rect x="80" y="226" width="50" height="48" rx="4" fill="#dc2626"/>
    <rect x="130" y="226" width="50" height="48" rx="4" fill="#1d4ed8"/>
    <text x="105" y="257" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    <text x="155" y="257" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
  </g>
  <line x1="96" y1="208" x2="164" y2="208" stroke="#b45309" stroke-width="2.5" marker-start="url(#arrAmber)" marker-end="url(#arrAmber)"/>
  <text x="130" y="200" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">插入 / 拔出</text>

  <path class="s59-flux" d="M184 238 C214 222 224 222 246 236" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrBlue)"/>

  <ellipse class="s59-coil" cx="256" cy="250" rx="10" ry="58" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s59-coil s59-coil2" cx="276" cy="250" rx="10" ry="58" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s59-coil s59-coil3" cx="296" cy="250" rx="10" ry="58" fill="none" stroke="#b45309" stroke-width="3"/>
  <ellipse class="s59-coil s59-coil4" cx="316" cy="250" rx="10" ry="58" fill="none" stroke="#b45309" stroke-width="3"/>
  <text x="286" y="326" font-size="11.5" font-weight="700" fill="#92400e" text-anchor="middle">线圈</text>

  <path d="M296 192 L440 214" fill="none" stroke="#475569" stroke-width="2.5"/>
  <path d="M296 308 L440 286" fill="none" stroke="#475569" stroke-width="2.5"/>
  <path class="s59-wire" d="M296 192 L440 214" fill="none" stroke="#dc2626" stroke-width="2" opacity=".7"/>
  <path class="s59-wire" d="M296 308 L440 286" fill="none" stroke="#dc2626" stroke-width="2" opacity=".7"/>

  <circle cx="470" cy="250" r="30" fill="#ffffff" stroke="#475569" stroke-width="3"/>
  <text x="470" y="257" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">G</text>
  <g class="s59-needle" transform="translate(470,250)">
    <line x1="0" y1="0" x2="0" y2="-23" stroke="#dc2626" stroke-width="2.5"/>
  </g>
  <text x="470" y="300" font-size="11" fill="#64748b" text-anchor="middle">灵敏电流计</text>

  <text x="286" y="376" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">磁通量变化 → 回路中产生感应电流 → 指针偏转</text>
  <text x="286" y="402" font-size="11.5" fill="#64748b" text-anchor="middle">磁体静止不动时，磁通量不变，没有感应电流</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">感应电流的条件</text>

  <g>
    <circle cx="610" cy="176" r="12" fill="#dbeafe"/>
    <text x="610" y="181" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="632" y="181" font-size="11.5" font-weight="700" fill="#334155">回路必须闭合</text>
  </g>
  <g>
    <circle cx="610" cy="214" r="12" fill="#dbeafe"/>
    <text x="610" y="219" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="632" y="219" font-size="11.5" font-weight="700" fill="#334155">磁通量必须变化</text>
  </g>

  <line x1="594" y1="238" x2="834" y2="238" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="596" y="262" font-size="11.5" font-weight="800" fill="#1e3a8a">磁通量变化的三种方式</text>
  <text x="596" y="286" font-size="11.5" fill="#334155">① 磁场 B 发生变化</text>
  <text x="596" y="310" font-size="11.5" fill="#334155">② 回路面积 S 发生变化</text>
  <text x="596" y="334" font-size="11.5" fill="#334155">③ 回路与磁场的相对位置变化</text>

  <rect x="590" y="354" width="260" height="64" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="376" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电磁感应：磁生电</text>
  <text x="720" y="398" font-size="11" fill="#475569" text-anchor="middle">感应电流大小由磁通量变化快慢决定</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">只要穿过闭合回路的磁通量发生变化，回路中就有感应电流</text>
</g>

<!-- 第二步：楞次定律 -->
<g class="s59-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">楞次定律：感应电流的磁场总要阻碍引起感应电流的磁通量的变化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">磁通量增加与减小</text>

  <g class="s59-panel">
    <rect x="56" y="154" width="228" height="238" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="170" y="180" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">磁通量增加</text>
    <text x="170" y="200" font-size="11" fill="#64748b" text-anchor="middle">磁体靠近线圈</text>
    <rect x="72" y="238" width="38" height="34" rx="3" fill="#dc2626"/>
    <rect x="110" y="238" width="38" height="34" rx="3" fill="#1d4ed8"/>
    <text x="91" y="261" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    <text x="129" y="261" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="156" y1="234" x2="190" y2="234" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>
    <ellipse cx="212" cy="252" rx="8" ry="40" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="228" cy="252" rx="8" ry="40" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <line class="s59-b" x1="190" y1="252" x2="252" y2="252" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="242" y="246" font-size="11" font-weight="800" fill="#6d28d9">B感</text>
    <text x="170" y="336" font-size="11.5" fill="#334155" text-anchor="middle">感应磁场与原磁场反向</text>
    <text x="170" y="360" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">增反</text>
  </g>

  <g class="s59-panel s59-panel2">
    <rect x="308" y="154" width="228" height="238" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="422" y="180" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">磁通量减小</text>
    <text x="422" y="200" font-size="11" fill="#64748b" text-anchor="middle">磁体远离线圈</text>
    <rect x="330" y="238" width="38" height="34" rx="3" fill="#dc2626"/>
    <rect x="368" y="238" width="38" height="34" rx="3" fill="#1d4ed8"/>
    <text x="349" y="261" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
    <text x="387" y="261" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">S</text>
    <line x1="380" y1="234" x2="348" y2="234" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrAmber)"/>
    <ellipse cx="438" cy="252" rx="8" ry="40" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <ellipse cx="454" cy="252" rx="8" ry="40" fill="none" stroke="#b45309" stroke-width="2.5"/>
    <line class="s59-b" x1="480" y1="252" x2="418" y2="252" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="466" y="246" font-size="11" font-weight="800" fill="#6d28d9">B感</text>
    <text x="422" y="336" font-size="11.5" fill="#334155" text-anchor="middle">感应磁场与原磁场同向</text>
    <text x="422" y="360" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">减同</text>
  </g>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">楞次定律</text>

  <text x="720" y="172" font-size="11.5" fill="#334155" text-anchor="middle">感应电流的磁场，总要阻碍</text>
  <text x="720" y="194" font-size="11.5" fill="#334155" text-anchor="middle">磁通量的变化</text>

  <g class="s59-card">
    <rect x="596" y="212" width="248" height="40" rx="10" fill="#e8effc"/>
    <text x="720" y="238" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">增反减同</text>
    <rect x="596" y="260" width="248" height="40" rx="10" fill="#e8effc"/>
    <text x="720" y="286" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">来拒去留</text>
    <rect x="596" y="308" width="248" height="40" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="334" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">阻碍不是阻止</text>
  </g>

  <text x="720" y="376" font-size="11.5" fill="#334155" text-anchor="middle">用于判断感应电流的方向</text>
  <text x="720" y="398" font-size="11.5" fill="#334155" text-anchor="middle">也可判断导体的受力与运动</text>
  <text x="720" y="420" font-size="11" fill="#64748b" text-anchor="middle">磁通量仍会变化，只是被“延缓”</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">楞次定律的本质：感应电流的磁场阻碍磁通量变化，体现能量守恒</text>
</g>

<!-- 第三步：应用 -->
<g class="s59-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电磁感应的应用：发电机、变压器、电磁炉、动圈式话筒</text>

  <g class="s59-app">
    <rect x="36" y="100" width="186" height="250" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="129" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">发电机</text>
    <circle cx="129" cy="196" r="28" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="129" y="204" font-size="18" font-weight="900" fill="#1d4ed8" text-anchor="middle">G</text>
    <path class="s59-spin" d="M166 186 A40 40 0 0 1 166 214" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
    <text x="129" y="262" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">机械能 → 电能</text>
    <text x="129" y="286" font-size="11" fill="#64748b" text-anchor="middle">线圈在磁场中转动</text>
    <text x="129" y="310" font-size="11" fill="#64748b" text-anchor="middle">产生交变电流</text>
    <text x="129" y="334" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">电磁感应</text>
  </g>

  <g class="s59-app s59-app2">
    <rect x="250" y="100" width="186" height="250" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
    <text x="343" y="130" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">变压器</text>
    <rect x="310" y="168" width="8" height="66" fill="#94a3b8"/>
    <rect x="368" y="168" width="8" height="66" fill="#94a3b8"/>
    <g stroke="#b45309" stroke-width="2.5" fill="none">
      <ellipse cx="298" cy="201" rx="9" ry="26"/>
      <ellipse cx="316" cy="201" rx="9" ry="26"/>
      <ellipse cx="370" cy="201" rx="9" ry="26"/>
      <ellipse cx="388" cy="201" rx="9" ry="26"/>
    </g>
    <text x="343" y="262" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">改变交流电压</text>
    <text x="343" y="286" font-size="11" fill="#64748b" text-anchor="middle">原、副线圈磁通量变化</text>
    <text x="343" y="310" font-size="11" fill="#64748b" text-anchor="middle">U₁/U₂ = n₁/n₂</text>
    <text x="343" y="334" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">互感现象</text>
  </g>

  <g class="s59-app s59-app3">
    <rect x="464" y="100" width="186" height="250" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="557" y="130" font-size="13.5" font-weight="800" fill="#047857" text-anchor="middle">电磁炉</text>
    <rect x="522" y="172" width="70" height="14" rx="4" fill="#94a3b8"/>
    <path d="M520 186 L528 222 L586 222 L594 186" fill="none" stroke="#475569" stroke-width="2.5"/>
    <path class="s59-heat" d="M538 230 C530 242 546 250 538 262" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path class="s59-heat" d="M557 230 C549 242 565 250 557 262" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path class="s59-heat" d="M576 230 C568 242 584 250 576 262" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <text x="557" y="290" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">交变磁场产生涡流</text>
    <text x="557" y="314" font-size="11" fill="#64748b" text-anchor="middle">锅底发热，加热食物</text>
    <text x="557" y="338" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">涡流生热</text>
  </g>

  <g class="s59-app s59-app4">
    <rect x="678" y="100" width="186" height="250" rx="14" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" filter="url(#softShadow)"/>
    <text x="771" y="130" font-size="13.5" font-weight="800" fill="#7e22ce" text-anchor="middle">动圈式话筒</text>
    <circle cx="771" cy="196" r="26" fill="#faf5ff" stroke="#7e22ce" stroke-width="2.5"/>
    <line x1="755" y1="196" x2="787" y2="196" stroke="#7e22ce" stroke-width="1.8"/>
    <line x1="771" y1="180" x2="771" y2="212" stroke="#7e22ce" stroke-width="1.8"/>
    <path d="M736 184 C728 196 728 208 736 220" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M726 176 C714 196 714 216 726 236" fill="none" stroke="#94a3b8" stroke-width="2" opacity=".6"/>
    <text x="771" y="262" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">声信号 → 电信号</text>
    <text x="771" y="286" font-size="11" fill="#64748b" text-anchor="middle">膜片带动线圈振动</text>
    <text x="771" y="310" font-size="11" fill="#64748b" text-anchor="middle">线圈切割磁感线</text>
    <text x="771" y="334" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle">电磁感应</text>
  </g>

  <rect x="36" y="366" width="828" height="120" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="450" y="396" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电磁感应推动了电能的广泛使用</text>
  <text x="450" y="424" font-size="12" fill="#334155" text-anchor="middle">发电机把机械能转化为电能，变压器实现远距离高压输电</text>
  <text x="450" y="450" font-size="12" fill="#334155" text-anchor="middle">电磁炉、动圈式话筒、无线充电都利用了电磁感应</text>
  <text x="450" y="474" font-size="11" fill="#64748b" text-anchor="middle">从“磁生电”到电气化时代，电磁感应是重要的基石</text>
</g>
</svg>
