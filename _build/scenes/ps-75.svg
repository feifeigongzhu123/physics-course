<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="波的反射、折射和衍射：反射定律、折射中频率不变、明显衍射的条件">
<style>
[data-scene="ps-75"] .s75-step{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
[data-scene="ps-75"].s1 .s75-step1,[data-scene="ps-75"].s2 .s75-step2,[data-scene="ps-75"].s3 .s75-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s75draw{to{stroke-dashoffset:0}}
@keyframes s75pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes s75pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
[data-scene="ps-75"].s1 .s75-in,[data-scene="ps-75"].s1 .s75-out{stroke-dasharray:380;stroke-dashoffset:380;animation:s75draw 1.1s ease .2s forwards}
[data-scene="ps-75"].s1 .s75-out{animation-delay:.7s}
[data-scene="ps-75"].s1 .s75-wave{animation:s75pulse 1.6s ease-in-out infinite}
[data-scene="ps-75"].s2 .s75-in2,[data-scene="ps-75"].s2 .s75-out2{stroke-dasharray:260;stroke-dashoffset:260;animation:s75draw 1s ease .2s forwards}
[data-scene="ps-75"].s2 .s75-out2{animation-delay:.65s}
[data-scene="ps-75"].s2 .s75-fw{animation:s75pulse 1.7s ease-in-out infinite}
[data-scene="ps-75"].s3 .s75-arc{animation:s75pulse 1.6s ease-in-out infinite}
[data-scene="ps-75"].s3 .s75-arc2{animation-delay:.2s}
[data-scene="ps-75"].s3 .s75-arc3{animation-delay:.4s}
[data-scene="ps-75"].s3 .s75-card{transform-box:fill-box;transform-origin:center;animation:s75pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">波的反射、折射和衍射：方向改变，频率不变</text>

<!-- 第一步：反射 -->
<g class="s75-step s75-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">反射：波返回原介质，反射角等于入射角</text>

  <rect x="55" y="100" width="540" height="340" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="500" y="130" width="24" height="280" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="512" y="122" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">分界面</text>
  <line x1="500" y1="280" x2="80" y2="280" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="92" y="270" font-size="11.5" fill="#64748b">法线</text>

  <line class="s75-in" x1="220" y1="150" x2="494" y2="277" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
  <line class="s75-out" x1="506" y1="283" x2="226" y2="407" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
  <text x="210" y="140" font-size="12.5" font-weight="800" fill="#b91c1c">入射波</text>
  <text x="215" y="430" font-size="12.5" font-weight="800" fill="#047857">反射波</text>

  <path d="M424 280 A76 76 0 0 1 431 248" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M424 280 A76 76 0 0 0 431 312" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="438" y="258" font-size="12.5" font-weight="900" fill="#6d28d9">i</text>
  <text x="438" y="306" font-size="12.5" font-weight="900" fill="#6d28d9">r</text>

  <g class="s75-wave" stroke="#60a5fa" stroke-width="2.4">
    <line x1="290" y1="166" x2="310" y2="209"/>
    <line x1="370" y1="203" x2="390" y2="246"/>
    <line x1="370" y1="314" x2="390" y2="357"/>
    <line x1="290" y1="351" x2="310" y2="394"/>
  </g>

  <rect x="610" y="100" width="240" height="340" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="730" y="128" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">反射定律</text>
  <text x="730" y="164" font-size="14.5" font-weight="900" fill="#6d28d9" text-anchor="middle">反射角 = 入射角</text>
  <line x1="630" y1="184" x2="830" y2="184" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="630" y="212" font-size="12.5" font-weight="700" fill="#334155">频率 f 不变</text>
  <text x="630" y="242" font-size="12.5" font-weight="700" fill="#334155">波长 λ 不变</text>
  <text x="630" y="272" font-size="12.5" font-weight="700" fill="#334155">波速 v 不变</text>
  <text x="630" y="294" font-size="11.5" fill="#64748b">反射波与入射波在同种介质中</text>
  <line x1="630" y1="312" x2="830" y2="312" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="730" y="338" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">应用：回声测距</text>
  <text x="730" y="364" font-size="11.5" fill="#475569" text-anchor="middle">声波遇墙返回形成回声</text>
  <text x="730" y="388" font-size="11.5" fill="#475569" text-anchor="middle">s = vt / 2</text>

  <rect x="70" y="452" width="760" height="36" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="476" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">反射时，波的频率、波长、波速都不发生变化</text>
</g>

<!-- 第二步：折射 -->
<g class="s75-step s75-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">折射：斜射入另一介质时，传播方向改变，频率保持不变</text>

  <rect x="55" y="100" width="550" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="80" y="150" width="500" height="140" fill="#eaf4ff" opacity=".7"/>
  <rect x="80" y="290" width="500" height="130" fill="#cfe3fb" opacity=".55"/>
  <line x1="80" y1="290" x2="580" y2="290" stroke="#60a5fa" stroke-width="2.4"/>
  <text x="110" y="180" font-size="12.5" font-weight="800" fill="#1e40af">介质 1（v1 较大）</text>
  <text x="110" y="332" font-size="12.5" font-weight="800" fill="#1e3a8a">介质 2（v2 较小）</text>
  <line x1="330" y1="130" x2="330" y2="430" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="340" y="142" font-size="11.5" fill="#64748b">法线</text>

  <line class="s75-in2" x1="170" y1="170" x2="324" y2="286" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
  <line class="s75-out2" x1="336" y1="294" x2="410" y2="420" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
  <text x="150" y="158" font-size="12.5" font-weight="800" fill="#b91c1c">入射波</text>
  <text x="420" y="430" font-size="12.5" font-weight="800" fill="#047857">折射波</text>

  <path d="M330 210 A80 80 0 0 0 266 242" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M330 370 A80 80 0 0 0 372 358" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="292" y="228" font-size="12.5" font-weight="900" fill="#6d28d9">i</text>
  <text x="352" y="366" font-size="12.5" font-weight="900" fill="#6d28d9">r</text>

  <g class="s75-fw" stroke="#f59e0b" stroke-width="2.4">
    <line x1="238" y1="252" x2="262" y2="220"/>
    <line x1="206" y1="206" x2="230" y2="174"/>
    <line x1="356" y1="364" x2="384" y2="346"/>
    <line x1="382" y1="402" x2="410" y2="384"/>
  </g>
  <text x="446" y="252" font-size="11.5" fill="#b45309">波长变短</text>

  <rect x="625" y="100" width="225" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="737" y="128" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">折射规律</text>
  <text x="640" y="164" font-size="12" font-weight="700" fill="#334155">f 由波源决定</text>
  <text x="640" y="187" font-size="12" font-weight="800" fill="#047857">→ f 保持不变</text>
  <text x="640" y="221" font-size="12" font-weight="700" fill="#334155">v 由介质决定</text>
  <text x="640" y="244" font-size="12" font-weight="800" fill="#b91c1c">→ v 发生改变</text>
  <text x="640" y="278" font-size="12" font-weight="700" fill="#334155">λ = v / f</text>
  <text x="640" y="301" font-size="12" font-weight="800" fill="#1e40af">→ λ 随之改变</text>
  <line x1="640" y1="318" x2="835" y2="318" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="737" y="344" font-size="11.5" fill="#475569" text-anchor="middle">v1 大于 v2 时</text>
  <text x="737" y="367" font-size="11.5" fill="#475569" text-anchor="middle">折射角小于入射角</text>
  <text x="737" y="394" font-size="11.5" fill="#475569" text-anchor="middle">入射角变化，折射角</text>
  <text x="737" y="415" font-size="11.5" fill="#475569" text-anchor="middle">也按规律变化</text>

  <rect x="70" y="462" width="760" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="484" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">关键：频率由波源决定，进入另一种介质时保持不变</text>
</g>

<!-- 第三步：衍射 -->
<g class="s75-step s75-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">明显衍射条件：障碍物或孔的尺寸与波长相差不多或更小</text>

  <rect class="s75-card" x="50" y="100" width="395" height="340" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="247" y="128" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">明显衍射（d ≈ λ 或更小）</text>
  <rect x="250" y="145" width="14" height="95" fill="#94a3b8" stroke="#64748b" stroke-width="1.4"/>
  <rect x="250" y="320" width="14" height="105" fill="#94a3b8" stroke="#64748b" stroke-width="1.4"/>
  <g stroke="#60a5fa" stroke-width="3" opacity=".8">
    <line x1="90" y1="165" x2="90" y2="405"/>
    <line x1="125" y1="165" x2="125" y2="405"/>
    <line x1="160" y1="165" x2="160" y2="405"/>
    <line x1="195" y1="165" x2="195" y2="405"/>
    <line x1="230" y1="165" x2="230" y2="405"/>
  </g>
  <text x="110" y="152" font-size="11.5" font-weight="700" fill="#1e40af">入射波</text>
  <g fill="none" stroke="#1d4ed8" stroke-width="3">
    <path class="s75-arc" d="M282 237 A50 50 0 0 1 282 323"/>
    <path class="s75-arc s75-arc2" d="M302 202 A90 90 0 0 1 302 358"/>
    <path class="s75-arc s75-arc3" d="M322 167 A130 130 0 0 1 322 393"/>
  </g>
  <text x="336" y="150" font-size="11.5" font-weight="700" fill="#1e40af">衍射波</text>
  <text x="247" y="390" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">孔宽 d ≈ λ</text>
  <text x="247" y="414" font-size="12" fill="#334155" text-anchor="middle">波绕过孔后向各方向扩散</text>

  <rect class="s75-card" x="455" y="100" width="395" height="340" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="652" y="128" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">衍射不明显（d 远大于 λ）</text>
  <rect x="650" y="145" width="14" height="80" fill="#94a3b8" stroke="#64748b" stroke-width="1.4"/>
  <rect x="650" y="335" width="14" height="90" fill="#94a3b8" stroke="#64748b" stroke-width="1.4"/>
  <g stroke="#60a5fa" stroke-width="3" opacity=".8">
    <line x1="480" y1="165" x2="480" y2="405"/>
    <line x1="515" y1="165" x2="515" y2="405"/>
    <line x1="550" y1="165" x2="550" y2="405"/>
    <line x1="585" y1="165" x2="585" y2="405"/>
    <line x1="620" y1="165" x2="620" y2="405"/>
  </g>
  <text x="500" y="152" font-size="11.5" font-weight="700" fill="#1e40af">入射波</text>
  <g stroke="#1d4ed8" stroke-width="3" opacity=".8">
    <line x1="682" y1="232" x2="682" y2="328"/>
    <line x1="722" y1="230" x2="722" y2="330"/>
    <line x1="762" y1="228" x2="762" y2="332"/>
  </g>
  <text x="652" y="390" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">孔宽 d 远大于 λ</text>
  <text x="652" y="414" font-size="12" fill="#334155" text-anchor="middle">波基本沿直线传播，衍射不明显</text>

  <rect x="70" y="452" width="760" height="36" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="476" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">波长越长，衍射越明显：声波容易绕过障碍物，可见光不明显</text>
</g>
</svg>
