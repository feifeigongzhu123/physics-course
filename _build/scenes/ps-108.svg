<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="气体的等压变化和等容变化：盖-吕萨克定律、查理定律与状态方程">
<style>
[data-scene="ps-108"] .s108-s1,[data-scene="ps-108"] .s108-s2,[data-scene="ps-108"] .s108-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-108"].s1 .s108-s1,[data-scene="ps-108"].s2 .s108-s2,[data-scene="ps-108"].s3 .s108-s3{opacity:1;visibility:visible}
@keyframes s108fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s108draw{to{stroke-dashoffset:0}}
@keyframes s108pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s108flow{to{stroke-dashoffset:-30}}
@keyframes s108heat{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
[data-scene="ps-108"].s1 .s108-cylinder{animation:s108fade .5s ease .12s both}
[data-scene="ps-108"].s1 .s108-flame{transform-box:fill-box;transform-origin:center bottom;animation:s108heat 1.3s ease-in-out infinite}
[data-scene="ps-108"].s1 .s108-rise{stroke-dasharray:8 6;animation:s108flow 1.1s linear infinite}
[data-scene="ps-108"].s1 .s108-line{stroke-dasharray:260;stroke-dashoffset:260;animation:s108draw 1.1s ease .35s forwards}
[data-scene="ps-108"].s1 .s108-card{animation:s108fade .5s ease .3s both}
[data-scene="ps-108"].s2 .s108-vessel{animation:s108fade .5s ease .12s both}
[data-scene="ps-108"].s2 .s108-flame{transform-box:fill-box;transform-origin:center bottom;animation:s108heat 1.3s ease-in-out infinite}
[data-scene="ps-108"].s2 .s108-parrow{stroke-dasharray:8 6;animation:s108flow 1.1s linear infinite}
[data-scene="ps-108"].s2 .s108-line{stroke-dasharray:260;stroke-dashoffset:260;animation:s108draw 1.1s ease .35s forwards}
[data-scene="ps-108"].s2 .s108-card{animation:s108fade .5s ease .3s both}
[data-scene="ps-108"].s3 .s108-plot{transform-box:fill-box;transform-origin:center;animation:s108pop .5s ease both}
[data-scene="ps-108"].s3 .s108-plot2{animation-delay:.12s}
[data-scene="ps-108"].s3 .s108-plot3{animation-delay:.24s}
[data-scene="ps-108"].s3 .s108-eq{transform-box:fill-box;transform-origin:center;animation:s108pop .55s ease .4s both}
[data-scene="ps-108"].s3 .s108-card{animation:s108fade .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">等压变化与等容变化：V-T 和 p-T 图像</text>

<!-- 第一步：等压变化，盖-吕萨克定律 -->
<g class="s108-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">等压变化：压强不变，体积与热力学温度成正比</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="240" height="28" rx="14" fill="#e8effc"/>
  <text x="176" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">活塞上放重物，压强保持不变</text>

  <g class="s108-cylinder">
    <line x1="80" y1="170" x2="80" y2="380" stroke="#475569" stroke-width="2.6"/>
    <line x1="200" y1="170" x2="200" y2="380" stroke="#475569" stroke-width="2.6"/>
    <line x1="72" y1="380" x2="208" y2="380" stroke="#475569" stroke-width="3"/>
    <rect x="84" y="272" width="112" height="104" fill="#dbeafe"/>
    <circle cx="104" cy="296" r="3.2" fill="#1d4ed8"/>
    <circle cx="132" cy="320" r="3.2" fill="#1d4ed8"/>
    <circle cx="160" cy="300" r="3.2" fill="#1d4ed8"/>
    <circle cx="180" cy="336" r="3.2" fill="#1d4ed8"/>
    <circle cx="120" cy="352" r="3.2" fill="#1d4ed8"/>
    <circle cx="168" cy="360" r="3.2" fill="#1d4ed8"/>
    <rect x="70" y="258" width="140" height="14" rx="2" fill="#64748b"/>
    <rect x="98" y="228" width="84" height="30" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <text x="140" y="248" font-size="12" font-weight="900" fill="#334155" text-anchor="middle">p</text>
    <text x="245" y="243" font-size="11.5" font-weight="800" fill="#047857">p 不变</text>
  </g>

  <line class="s108-rise" x1="232" y1="252" x2="232" y2="178" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="240" y="212" font-size="11.5" font-weight="800" fill="#1e40af">V 增大</text>

  <g class="s108-flame">
    <path d="M 140 392 C 126 404 124 414 134 424 C 132 412 144 408 146 400 C 152 412 162 406 156 394 Z" fill="#fb923c" stroke="#f97316" stroke-width="1.5"/>
  </g>
  <text x="200" y="418" font-size="11" fill="#b45309">加热升温</text>

  <line x1="330" y1="360" x2="512" y2="360" stroke="#475569" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <line x1="330" y1="360" x2="330" y2="180" stroke="#475569" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="320" y="192" font-size="11.5" font-weight="900" fill="#475569" text-anchor="end">V</text>
  <text x="518" y="366" font-size="11.5" font-weight="900" fill="#475569">T</text>
  <text x="318" y="376" font-size="11" fill="#64748b">O</text>
  <path class="s108-line" d="M 330 360 L 500 196" fill="none" stroke="#1d4ed8" stroke-width="3.4"/>
  <text x="430" y="240" font-size="12" font-weight="900" fill="#1e40af">V ∝ T</text>
  <text x="420" y="386" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">V-T 图像过原点</text>

  <g class="s108-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">盖-吕萨克定律（等压）</text>

    <text x="720" y="188" font-size="23" font-weight="900" fill="#b91c1c" text-anchor="middle">V / T = C</text>
    <text x="720" y="216" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">V₁ / T₁ = V₂ / T₂</text>
    <line x1="596" y1="234" x2="844" y2="234" stroke="#e8eef7" stroke-width="1.5"/>

    <text x="610" y="262" font-size="11.5" fill="#334155">适用：m 一定、p 不变的气体</text>
    <text x="610" y="286" font-size="11.5" fill="#334155">V-T 图像是过原点的直线</text>
    <text x="610" y="310" font-size="11.5" fill="#334155">斜率与压强有关，p 越小斜率越大</text>

    <rect x="596" y="330" width="248" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="354" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">T = t + 273.15 K</text>
    <text x="720" y="376" font-size="11" fill="#92400e" text-anchor="middle">温度必须用热力学温度</text>
    <text x="720" y="412" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等压膨胀：T 升高，V 增大</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">盖-吕萨克定律：压强不变时 V/T 为常量，V-T 图像是过原点的直线</text>
</g>

<!-- 第二步：等容变化，查理定律 -->
<g class="s108-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">等容变化：体积不变，压强与热力学温度成正比</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="240" height="28" rx="14" fill="#e8effc"/>
  <text x="176" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">钢瓶容积固定，气体体积不变</text>

  <g class="s108-vessel">
    <rect x="90" y="205" width="190" height="140" rx="18" fill="#e2e8f0" stroke="#475569" stroke-width="2.6"/>
    <rect x="168" y="182" width="34" height="23" rx="4" fill="#64748b"/>
    <text x="100" y="196" font-size="11.5" font-weight="800" fill="#047857">V 不变</text>

    <line class="s108-parrow" x1="185" y1="275" x2="116" y2="275" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrRed)"/>
    <line class="s108-parrow" x1="185" y1="275" x2="254" y2="275" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrRed)"/>
    <line class="s108-parrow" x1="185" y1="275" x2="185" y2="226" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrRed)"/>
    <line class="s108-parrow" x1="185" y1="275" x2="185" y2="332" stroke="#dc2626" stroke-width="2.6" marker-end="url(#arrRed)"/>
    <text x="185" y="279" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">p</text>

    <line x1="280" y1="250" x2="304" y2="250" stroke="#475569" stroke-width="3"/>
    <circle cx="330" cy="250" r="26" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="330" y1="250" x2="342" y2="234" stroke="#dc2626" stroke-width="2.4"/>
    <circle cx="330" cy="250" r="3" fill="#475569"/>
    <text x="330" y="292" font-size="11" fill="#475569" text-anchor="middle">压强表</text>
  </g>

  <text x="185" y="366" font-size="11" fill="#475569" text-anchor="middle">T 升高 → p 增大</text>

  <g class="s108-flame">
    <path d="M 185 390 C 171 402 169 412 179 422 C 177 410 189 406 191 398 C 197 410 207 404 201 392 Z" fill="#fb923c" stroke="#f97316" stroke-width="1.5"/>
  </g>

  <line x1="390" y1="360" x2="532" y2="360" stroke="#475569" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <line x1="390" y1="360" x2="390" y2="180" stroke="#475569" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="380" y="192" font-size="11.5" font-weight="900" fill="#475569" text-anchor="end">p</text>
  <text x="538" y="366" font-size="11.5" font-weight="900" fill="#475569">T</text>
  <text x="378" y="376" font-size="11" fill="#64748b">O</text>
  <path class="s108-line" d="M 390 360 L 516 196" fill="none" stroke="#dc2626" stroke-width="3.4"/>
  <text x="452" y="236" font-size="12" font-weight="900" fill="#b91c1c">p ∝ T</text>

  <g class="s108-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">查理定律（等容）</text>

    <text x="720" y="188" font-size="23" font-weight="900" fill="#b91c1c" text-anchor="middle">p / T = C</text>
    <text x="720" y="216" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">p₁ / T₁ = p₂ / T₂</text>
    <line x1="596" y1="234" x2="844" y2="234" stroke="#e8eef7" stroke-width="1.5"/>

    <text x="610" y="262" font-size="11.5" fill="#334155">适用：m 一定、V 不变的气体</text>
    <text x="610" y="286" font-size="11.5" fill="#334155">p-T 图像是过原点的直线</text>
    <text x="610" y="310" font-size="11.5" fill="#334155">斜率与体积有关，V 越小斜率越大</text>

    <rect x="596" y="330" width="248" height="60" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="354" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">T = t + 273.15 K</text>
    <text x="720" y="376" font-size="11" fill="#92400e" text-anchor="middle">t 升高，p 并不与 t 成正比</text>
    <text x="720" y="412" font-size="11" fill="#64748b" text-anchor="middle">钢瓶暴晒、夏天胎压升高</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">查理定律：体积不变时 p/T 为常量，p-T 图像是过原点的直线</text>
</g>

<!-- 第三步：三个图像与状态方程 -->
<g class="s108-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">三个实验定律统一为理想气体状态方程</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="s108-eq">
    <text x="296" y="134" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">pV / T = 常量</text>
  </g>

  <g class="s108-plot">
    <text x="126" y="160" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等压：V-T</text>
    <line x1="76" y1="316" x2="186" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <line x1="76" y1="316" x2="76" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <text x="66" y="190" font-size="11" font-weight="900" fill="#475569" text-anchor="end">V</text>
    <text x="192" y="320" font-size="11" font-weight="900" fill="#475569">T</text>
    <path d="M 76 316 L 176 196" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="128" y="342" font-size="11" fill="#475569" text-anchor="middle">过原点</text>
  </g>

  <g class="s108-plot s108-plot2">
    <text x="296" y="160" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等容：p-T</text>
    <line x1="246" y1="316" x2="356" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <line x1="246" y1="316" x2="246" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <text x="236" y="190" font-size="11" font-weight="900" fill="#475569" text-anchor="end">p</text>
    <text x="362" y="320" font-size="11" font-weight="900" fill="#475569">T</text>
    <path d="M 246 316 L 346 196" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="298" y="342" font-size="11" fill="#475569" text-anchor="middle">过原点</text>
  </g>

  <g class="s108-plot s108-plot3">
    <text x="466" y="160" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">等温：p-V</text>
    <line x1="416" y1="316" x2="526" y2="316" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <line x1="416" y1="316" x2="416" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
    <text x="406" y="190" font-size="11" font-weight="900" fill="#475569" text-anchor="end">p</text>
    <text x="532" y="320" font-size="11" font-weight="900" fill="#475569">V</text>
    <path d="M 426 306 C 446 282 466 246 484 220 C 500 198 514 190 522 186" fill="none" stroke="#059669" stroke-width="3"/>
    <text x="468" y="342" font-size="11" fill="#475569" text-anchor="middle">双曲线</text>
  </g>

  <text x="296" y="374" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">等压、等容图线过原点，等温线是双曲线</text>
  <text x="296" y="400" font-size="11.5" fill="#64748b" text-anchor="middle">初、末状态六个量中已知五个，即可求剩下的一个</text>
  <text x="296" y="424" font-size="11" fill="#64748b" text-anchor="middle">注意：只有一定质量的理想气体才适用</text>

  <g class="s108-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">理想气体状态方程</text>

    <text x="720" y="180" font-size="16" font-weight="900" fill="#b91c1c" text-anchor="middle">p₁V₁/T₁ = p₂V₂/T₂</text>
    <line x1="596" y1="196" x2="844" y2="196" stroke="#e8eef7" stroke-width="1.5"/>

    <text x="610" y="224" font-size="12" font-weight="900" fill="#1e3a8a">解题四步</text>
    <text x="610" y="248" font-size="11.5" fill="#334155">① 确定初、末状态的 p、V、T</text>
    <text x="610" y="272" font-size="11.5" fill="#334155">② 温度统一换算为热力学温度</text>
    <text x="610" y="296" font-size="11.5" fill="#334155">③ 代入方程求解未知量</text>
    <text x="610" y="320" font-size="11.5" fill="#334155">④ 检验单位与结果是否合理</text>

    <rect x="596" y="338" width="248" height="66" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="360" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">等温 pV=C · 等压 V/T=C</text>
    <text x="720" y="382" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">等容 p/T=C</text>
    <text x="720" y="426" font-size="11" fill="#64748b" text-anchor="middle">T 必须用开尔文，不能用摄氏度</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">p₁V₁/T₁ = p₂V₂/T₂：温度必须用热力学温度，质量必须一定</text>
</g>
</svg>
