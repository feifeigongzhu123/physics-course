<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="质谱仪与回旋加速器：速度选择器、质谱仪的半径分离、回旋加速器">
<style>
[data-scene="ps-87"] .s87-s1,[data-scene="ps-87"] .s87-s2,[data-scene="ps-87"] .s87-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-87"].s1 .s87-s1,[data-scene="ps-87"].s2 .s87-s2,[data-scene="ps-87"].s3 .s87-s3{opacity:1;visibility:visible}
@keyframes s87draw{to{stroke-dashoffset:0}}
@keyframes s87flow{to{stroke-dashoffset:-32}}
@keyframes s87pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s87pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s87slide{0%{transform:translateX(-10px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes s87spin{to{transform:rotate(360deg)}}
[data-scene="ps-87"].s1 .s87-plate{transform-box:fill-box;transform-origin:center;animation:s87pop .5s ease both}
[data-scene="ps-87"].s1 .s87-plate2{animation-delay:.12s}
[data-scene="ps-87"].s1 .s87-field{animation:s87pulse 2s ease-in-out infinite}
[data-scene="ps-87"].s1 .s87-path{stroke-dasharray:8 7;animation:s87flow 1.3s linear infinite}
[data-scene="ps-87"].s2 .s87-beam{stroke-dasharray:60;stroke-dashoffset:60;animation:s87draw .7s ease both}
[data-scene="ps-87"].s2 .s87-arc{stroke-dasharray:340;stroke-dashoffset:340;animation:s87draw .9s ease .35s forwards}
[data-scene="ps-87"].s2 .s87-arc2{animation-delay:.55s}
[data-scene="ps-87"].s2 .s87-src{transform-box:fill-box;transform-origin:center;animation:s87pop .5s ease both}
[data-scene="ps-87"].s3 .s87-dee{transform-box:fill-box;transform-origin:center;animation:s87pop .55s ease both}
[data-scene="ps-87"].s3 .s87-dee2{animation-delay:.15s}
[data-scene="ps-87"].s3 .s87-spiral{stroke-dasharray:340;stroke-dashoffset:340;animation:s87draw 1.5s ease .4s forwards}
[data-scene="ps-87"].s3 .s87-exit{animation:s87slide .6s ease 1.5s both}
[data-scene="ps-87"].s3 .s87-gap{animation:s87pulse 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">质谱仪与回旋加速器：加速、偏转与分离</text>

<!-- 第一步：速度选择器 -->
<g class="s87-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">速度选择器：电场力与洛伦兹力平衡，只有 v = E/B 的粒子沿直线通过</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">速度选择器内部</text>

  <rect class="s87-plate" x="100" y="190" width="330" height="12" rx="3" fill="#94a3b8"/>
  <rect class="s87-plate s87-plate2" x="100" y="302" width="330" height="12" rx="3" fill="#94a3b8"/>
  <text x="443" y="202" font-size="16" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <text x="443" y="314" font-size="16" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>

  <g class="s87-field" stroke="#d97706" stroke-width="2" fill="none">
    <line x1="130" y1="206" x2="130" y2="298" marker-end="url(#arrAmber)"/>
    <line x1="190" y1="206" x2="190" y2="298" marker-end="url(#arrAmber)"/>
    <line x1="250" y1="206" x2="250" y2="298" marker-end="url(#arrAmber)"/>
    <line x1="310" y1="206" x2="310" y2="298" marker-end="url(#arrAmber)"/>
    <line x1="370" y1="206" x2="370" y2="298" marker-end="url(#arrAmber)"/>
  </g>

  <g stroke="#7c3aed" stroke-width="1.6" fill="#ffffff">
    <circle cx="160" cy="220" r="8"/><circle cx="220" cy="220" r="8"/><circle cx="280" cy="220" r="8"/><circle cx="340" cy="220" r="8"/>
    <circle cx="160" cy="290" r="8"/><circle cx="220" cy="290" r="8"/><circle cx="280" cy="290" r="8"/><circle cx="340" cy="290" r="8"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.6">
    <line x1="155" y1="215" x2="165" y2="225"/><line x1="165" y1="215" x2="155" y2="225"/>
    <line x1="215" y1="215" x2="225" y2="225"/><line x1="225" y1="215" x2="215" y2="225"/>
    <line x1="275" y1="215" x2="285" y2="225"/><line x1="285" y1="215" x2="275" y2="225"/>
    <line x1="335" y1="215" x2="345" y2="225"/><line x1="345" y1="215" x2="335" y2="225"/>
    <line x1="155" y1="285" x2="165" y2="295"/><line x1="165" y1="285" x2="155" y2="295"/>
    <line x1="215" y1="285" x2="225" y2="295"/><line x1="225" y1="285" x2="215" y2="295"/>
    <line x1="275" y1="285" x2="285" y2="295"/><line x1="285" y1="285" x2="275" y2="295"/>
    <line x1="335" y1="285" x2="345" y2="295"/><line x1="345" y1="285" x2="335" y2="295"/>
  </g>

  <line class="s87-path" x1="76" y1="254" x2="446" y2="254" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <circle cx="80" cy="254" r="5" fill="#1d4ed8"/>
  <text x="96" y="242" font-size="12" font-weight="800" fill="#1d4ed8">v</text>

  <line x1="440" y1="216" x2="440" y2="248" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
  <text x="452" y="238" font-size="11" fill="#92400e">E 向下</text>
  <circle cx="466" cy="196" r="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="461" y1="191" x2="471" y2="201" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="471" y1="191" x2="461" y2="201" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="480" y="200" font-size="11" fill="#6d28d9">B 向里</text>

  <text x="286" y="342" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">电场力 qE 向下，洛伦兹力 qvB 向上，两者平衡</text>
  <text x="286" y="370" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">只有 v = E/B 的粒子沿直线射出</text>
  <text x="286" y="398" font-size="11" fill="#64748b" text-anchor="middle">速度偏大或偏小的粒子都会偏向一侧，被挡板吸收</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">速度选择器</text>

  <rect x="596" y="158" width="248" height="68" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="190" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">qE = qvB</text>
  <text x="720" y="212" font-size="11" fill="#475569" text-anchor="middle">E 与 B 相互垂直，v 同时垂直于 E、B</text>

  <text x="600" y="254" font-size="11.5" font-weight="700" fill="#334155">• 只有 v = E/B 的粒子不受偏转</text>
  <text x="600" y="282" font-size="11.5" font-weight="700" fill="#334155">• 与粒子的电荷正负、质量无关</text>
  <text x="600" y="310" font-size="11.5" font-weight="700" fill="#334155">• 常作为质谱仪、加速器的入口</text>

  <rect x="596" y="328" width="248" height="56" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="350" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">筛选依据：速度</text>
  <text x="720" y="372" font-size="11" fill="#92400e" text-anchor="middle">不同速度的粒子被分到两侧</text>

  <text x="720" y="408" font-size="11" fill="#64748b" text-anchor="middle">v 的单位：m/s</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">速度选择器让粒子以相同速度进入分析区，v = E/B 由电场和磁场共同决定</text>
</g>

<!-- 第二步：质谱仪的半径分离 -->
<g class="s87-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">质谱仪：粒子先加速再偏转，半径 r 不同则落点不同</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="270" height="28" rx="14" fill="#e8effc"/>
  <text x="191" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不同质量打在底片不同位置</text>

  <rect class="s87-src" x="282" y="150" width="36" height="18" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="326" y="164" font-size="11" font-weight="700" fill="#334155">离子源</text>

  <rect x="252" y="182" width="42" height="7" rx="2" fill="#94a3b8"/>
  <rect x="306" y="182" width="42" height="7" rx="2" fill="#94a3b8"/>
  <rect x="252" y="204" width="42" height="7" rx="2" fill="#94a3b8"/>
  <rect x="306" y="204" width="42" height="7" rx="2" fill="#94a3b8"/>
  <text x="358" y="190" font-size="11" font-weight="900" fill="#b91c1c">+</text>
  <text x="358" y="212" font-size="11" font-weight="900" fill="#1d4ed8">−</text>
  <text x="232" y="200" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">U</text>

  <line class="s87-beam" x1="300" y1="168" x2="300" y2="236" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="286" y="176" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="end">v</text>

  <rect x="80" y="226" width="212" height="12" fill="#475569"/>
  <rect x="308" y="226" width="212" height="12" fill="#475569"/>
  <text x="92" y="220" font-size="11" font-weight="700" fill="#475569">照相底片</text>

  <rect x="70" y="244" width="460" height="160" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <g stroke="#7c3aed" stroke-width="1.4" fill="#ffffff">
    <circle cx="390" cy="280" r="7"/><circle cx="450" cy="280" r="7"/><circle cx="500" cy="280" r="7"/>
    <circle cx="390" cy="340" r="7"/><circle cx="450" cy="340" r="7"/><circle cx="500" cy="340" r="7"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1.4">
    <line x1="386" y1="276" x2="394" y2="284"/><line x1="394" y1="276" x2="386" y2="284"/>
    <line x1="446" y1="276" x2="454" y2="284"/><line x1="454" y1="276" x2="446" y2="284"/>
    <line x1="496" y1="276" x2="504" y2="284"/><line x1="504" y1="276" x2="496" y2="284"/>
    <line x1="386" y1="336" x2="394" y2="344"/><line x1="394" y1="336" x2="386" y2="344"/>
    <line x1="446" y1="336" x2="454" y2="344"/><line x1="454" y1="336" x2="446" y2="344"/>
    <line x1="496" y1="336" x2="504" y2="344"/><line x1="504" y1="336" x2="496" y2="344"/>
  </g>
  <text x="430" y="380" font-size="11" fill="#6d28d9" text-anchor="middle">B 垂直纸面向里</text>

  <path class="s87-arc" d="M300 238 A55 55 0 0 1 190 238" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <path class="s87-arc s87-arc2" d="M300 238 A85 85 0 0 1 130 238" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="190" cy="238" r="4" fill="#1d4ed8"/>
  <circle cx="130" cy="238" r="4" fill="#dc2626"/>
  <text x="190" y="216" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">m₁</text>
  <text x="130" y="216" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">m₂</text>
  <text x="258" y="302" font-size="11.5" font-weight="800" fill="#1d4ed8">r₁</text>
  <text x="196" y="342" font-size="11.5" font-weight="800" fill="#b91c1c">r₂</text>

  <text x="286" y="424" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">r 越大，粒子质量越大，落点离入口越远</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质谱仪的关系</text>

  <rect x="596" y="156" width="248" height="52" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="189" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">qU = ½mv²</text>

  <rect x="596" y="216" width="248" height="52" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="249" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">r = mv / (qB)</text>

  <rect x="596" y="276" width="248" height="52" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="309" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">q/m = 2U / (B²r²)</text>

  <text x="600" y="354" font-size="11.5" font-weight="700" fill="#334155">同一 U、B 下，r ∝ √m</text>
  <text x="600" y="380" font-size="11.5" font-weight="700" fill="#334155">不同质量 → 不同半径 → 分开</text>
  <text x="600" y="406" font-size="11" fill="#64748b">可测质量、比荷，分析同位素</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质谱仪：先加速后偏转，用半径 r 把不同质量的粒子分开</text>
</g>

<!-- 第三步：回旋加速器 -->
<g class="s87-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">回旋加速器：磁场让粒子回旋，缝隙电场反复加速</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="240" height="28" rx="14" fill="#e8effc"/>
  <text x="176" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个 D 形盒与加速缝隙</text>

  <path class="s87-dee" d="M290 172 A108 108 0 0 0 290 388" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <path class="s87-dee s87-dee2" d="M310 172 A108 108 0 0 1 310 388" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="228" y="286" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">D 形盒</text>
  <text x="384" y="286" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">D 形盒</text>

  <text x="72" y="238" font-size="11" font-weight="700" fill="#6d28d9">B 垂直</text>
  <text x="72" y="256" font-size="11" font-weight="700" fill="#6d28d9">纸面向里</text>

  <path class="s87-spiral" d="M300 384 A20 20 0 0 1 300 344 A30 30 0 0 1 300 284 A42 42 0 0 1 300 200" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <path class="s87-exit" d="M300 200 C330 176 366 158 404 158" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <rect x="424" y="136" width="10" height="60" rx="3" fill="#475569"/>
  <text x="446" y="170" font-size="11.5" font-weight="800" fill="#475569">靶</text>
  <text x="386" y="148" font-size="11" font-weight="700" fill="#b91c1c">引出</text>

  <line class="s87-gap" x1="290" y1="172" x2="290" y2="388" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>
  <line class="s87-gap" x1="310" y1="172" x2="310" y2="388" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="240" y="400" width="120" height="26" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="300" y="418" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">高频交变电压</text>
  <line x1="290" y1="388" x2="290" y2="400" stroke="#fdba74" stroke-width="1.5"/>
  <line x1="310" y1="388" x2="310" y2="400" stroke="#fdba74" stroke-width="1.5"/>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="696" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">回旋加速器</text>

  <rect x="596" y="156" width="248" height="50" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="188" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = 2πm / (qB)</text>

  <rect x="596" y="212" width="248" height="46" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="242" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">f = qB / (2πm)</text>

  <text x="600" y="284" font-size="11.5" font-weight="700" fill="#334155">周期与速度、半径无关</text>
  <text x="600" y="309" font-size="11.5" font-weight="700" fill="#334155">交变电压周期 = 粒子回旋周期</text>

  <rect x="596" y="322" width="248" height="56" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="345" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">Ek = q²B²R² / (2m)</text>
  <text x="720" y="366" font-size="11" fill="#92400e" text-anchor="middle">最大动能由 B、R 决定，与 U 无关</text>

  <text x="600" y="404" font-size="11" fill="#64748b">每过一次缝隙，动能增加 qU</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">回旋加速器：磁场让粒子回旋，缝隙电场反复加速，获得高能粒子</text>
</g>
</svg>
