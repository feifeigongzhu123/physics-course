<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="重力：方向竖直向下、G 等于 mg、重心与规则物体">
<style>
[data-scene="pj-30"] .p30-step1,[data-scene="pj-30"] .p30-step2,[data-scene="pj-30"] .p30-step3{display:none}
[data-scene="pj-30"].s1 .p30-step1,[data-scene="pj-30"].s2 .p30-step2,[data-scene="pj-30"].s3 .p30-step3{display:block}
@keyframes p30pop{0%{transform:scale(.72);opacity:0}72%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p30in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes p30draw{to{stroke-dashoffset:0}}
@keyframes p30pulse{0%,100%{opacity:.38}50%{opacity:1}}
@keyframes p30swing{0%,100%{transform:rotate(-2.4deg)}50%{transform:rotate(2.4deg)}}
@keyframes p30grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes p30glow{0%,100%{opacity:.3}50%{opacity:.7}}
[data-scene="pj-30"] .p30-card{transform-box:fill-box;transform-origin:center;animation:p30pop .55s ease .1s both}
[data-scene="pj-30"] .p30-note{animation:p30in .55s ease .2s both}
[data-scene="pj-30"] .p30-g{animation:p30pulse 1.9s ease-in-out infinite}
[data-scene="pj-30"] .p30-dash{stroke-dasharray:7 5;animation:p30draw 1.2s ease both}
[data-scene="pj-30"].s2 .p30-curve{stroke-dasharray:420;stroke-dashoffset:420;animation:p30draw 1.2s ease .2s forwards}
[data-scene="pj-30"].s2 .p30-pt{transform-box:fill-box;transform-origin:center;animation:p30pop .4s ease both}
[data-scene="pj-30"].s2 .p30-pt:nth-of-type(2){animation-delay:.18s}
[data-scene="pj-30"].s2 .p30-pt:nth-of-type(3){animation-delay:.3s}
[data-scene="pj-30"].s2 .p30-pt:nth-of-type(4){animation-delay:.42s}
[data-scene="pj-30"].s3 .p30-cent{animation:p30glow 2s ease-in-out infinite}
[data-scene="pj-30"].s3 .p30-swing{animation:p30pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">重力：竖直向下，G = mg</text>

<!-- 第一步：重力的方向 -->
<g class="p30-step1" data-zone="1">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">重力的方向总是竖直向下，与物体放在什么面上无关</text>

  <!-- 重垂线 -->
  <rect x="70" y="96" width="330" height="12" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="76" y="108" width="28" height="292" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="78" y1="136" x2="102" y2="112"/>
    <line x1="78" y1="166" x2="102" y2="142"/>
    <line x1="78" y1="196" x2="102" y2="172"/>
    <line x1="78" y1="226" x2="102" y2="202"/>
    <line x1="78" y1="256" x2="102" y2="232"/>
    <line x1="78" y1="286" x2="102" y2="262"/>
    <line x1="78" y1="316" x2="102" y2="292"/>
    <line x1="78" y1="346" x2="102" y2="322"/>
    <line x1="78" y1="376" x2="102" y2="352"/>
  </g>

  <g class="p30-plumb">
    <line x1="196" y1="96" x2="196" y2="330" stroke="#475569" stroke-width="1.6"/>
    <polygon points="188,330 204,330 196,358" fill="#475569"/>
    <line class="p30-g" x1="196" y1="352" x2="196" y2="410" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  </g>
  <text x="208" y="376" font-size="13" font-weight="900" fill="#b91c1c">G</text>
  <text x="212" y="204" font-size="12.5" font-weight="800" fill="#475569">重垂线</text>
  <line x1="104" y1="150" x2="196" y2="150" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="104" y1="330" x2="196" y2="330" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="90" y="422" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">墙</text>
  <text x="236" y="426" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">线与墙面平行 → 墙壁竖直</text>

  <!-- 斜面上的物体 -->
  <polygon points="520,404 850,404 850,240" fill="#e8eef5" stroke="#94a3b8" stroke-width="2"/>
  <text x="796" y="392" font-size="11.5" font-weight="700" fill="#64748b">斜面</text>
  <g transform="rotate(-26.4 690 295)">
    <rect x="660" y="273" width="60" height="44" rx="5" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
  </g>
  <line class="p30-g" x1="690" y1="295" x2="690" y2="382" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="678" y="332" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">G</text>
  <text x="678" y="354" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="end">竖直向下</text>
  <line x1="704" y1="318" x2="735" y2="381" stroke="#1d4ed8" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
  <text x="685" y="132" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">重力方向与斜面无关</text>
  <text x="700" y="428" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">垂直于斜面（错）</text>

  <!-- 三要素 -->
  <g class="p30-note" font-size="12" font-weight="800" fill="#1e3a8a">
    <rect x="60" y="444" width="250" height="40" rx="10" fill="#e8effc"/>
    <text x="185" y="469" text-anchor="middle">施力物体：地球</text>
    <rect x="325" y="444" width="250" height="40" rx="10" fill="#e8effc"/>
    <text x="450" y="469" text-anchor="middle">方向：竖直向下</text>
    <rect x="590" y="444" width="250" height="40" rx="10" fill="#e8effc"/>
    <text x="715" y="469" text-anchor="middle">作用点：重心</text>
  </g>
</g>

<!-- 第二步：重力的大小 -->
<g class="p30-step2" data-zone="2">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">重力的大小跟质量成正比：G = mg，g = 9.8 N/kg</text>

  <!-- G-m 图像 -->
  <g>
    <line x1="120" y1="390" x2="460" y2="390" stroke="#475569" stroke-width="2.4" marker-end="url(#arrBlue)"/>
    <line x1="120" y1="390" x2="120" y2="108" stroke="#475569" stroke-width="2.4" marker-end="url(#arrBlue)"/>
    <line class="p30-curve" x1="120" y1="390" x2="400" y2="123" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#1d4ed8">
      <circle class="p30-pt" cx="190" cy="323" r="4.5"/>
      <circle class="p30-pt" cx="260" cy="257" r="4.5"/>
      <circle class="p30-pt" cx="330" cy="190" r="4.5"/>
      <circle class="p30-pt" cx="400" cy="123" r="4.5"/>
    </g>
    <g font-size="11" fill="#64748b">
      <text x="190" y="408" text-anchor="middle">1</text>
      <text x="260" y="408" text-anchor="middle">2</text>
      <text x="330" y="408" text-anchor="middle">3</text>
      <text x="400" y="408" text-anchor="middle">4</text>
      <text x="112" y="326" text-anchor="end">10</text>
      <text x="112" y="258" text-anchor="end">20</text>
      <text x="112" y="191" text-anchor="end">30</text>
      <text x="112" y="124" text-anchor="end">40</text>
    </g>
    <text x="470" y="396" font-size="11.5" font-weight="700" fill="#475569">m/kg</text>
    <text x="112" y="102" font-size="11.5" font-weight="700" fill="#475569" text-anchor="end">G/N</text>
    <text x="290" y="438" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">过原点的直线：G 与 m 成正比</text>
    <text x="290" y="462" font-size="11.5" fill="#64748b" text-anchor="middle">直线的斜率就是 g，约为 9.8 N/kg</text>
  </g>

  <!-- 公式卡片 -->
  <g class="p30-card">
    <rect x="500" y="104" width="350" height="184" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="675" y="132" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">重力与质量的关系</text>
    <text x="675" y="184" font-size="28" font-weight="900" fill="#1d4ed8" text-anchor="middle">G = m g</text>
    <g font-size="11.5" fill="#475569">
      <text x="530" y="214">G — 重力，单位 N</text>
      <text x="675" y="214">m — 质量，单位 kg</text>
    </g>
    <text x="675" y="240" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">g = 9.8 N/kg，粗略计算取 10 N/kg</text>
    <text x="675" y="268" font-size="11" fill="#64748b" text-anchor="middle">质量不变，重力随位置改变（月球 g 约 1.6 N/kg）</text>
  </g>

  <!-- 算一算 -->
  <g class="p30-note">
    <rect x="500" y="300" width="350" height="188" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="675" y="326" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">算一算（g 取 9.8 N/kg）</text>
    <rect x="516" y="336" width="318" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="675" y="356" font-size="11.5" fill="#334155" text-anchor="middle">50 kg 的人：G = 50 × 9.8 = 490 N</text>
    <rect x="516" y="372" width="318" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="675" y="392" font-size="11.5" fill="#334155" text-anchor="middle">2 kg 的书包：G = 2 × 9.8 = 19.6 N</text>
    <rect x="516" y="408" width="318" height="30" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="675" y="428" font-size="11.5" fill="#334155" text-anchor="middle">50 g 的鸡蛋：G ≈ 0.05 × 10 = 0.5 N</text>
    <text x="675" y="456" font-size="11" fill="#64748b" text-anchor="middle">g 的物理意义：1 kg 的物体重约 9.8 N</text>
    <text x="675" y="474" font-size="11" fill="#64748b" text-anchor="middle">质量是物体的属性，月球上重力变小</text>
  </g>
</g>

<!-- 第三步：重心 -->
<g class="p30-step3" data-zone="3">
  <text x="70" y="84" font-size="13.5" font-weight="800" fill="#1e3a8a">重心：重力的等效作用点，形状规则、质量均匀的物体在几何中心</text>

  <!-- 球 -->
  <g>
    <rect x="48" y="104" width="192" height="196" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="144" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">均匀球体</text>
    <circle cx="144" cy="205" r="44" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="100" y1="205" x2="188" y2="205" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <line x1="144" y1="161" x2="144" y2="249" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
    <circle class="p30-cent" cx="144" cy="205" r="4.5" fill="#dc2626"/>
    <text x="144" y="286" font-size="11.5" fill="#64748b" text-anchor="middle">重心在球心</text>
  </g>

  <!-- 长方体 -->
  <g>
    <rect x="248" y="104" width="192" height="196" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="344" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">均匀长方体</text>
    <rect x="298" y="163" width="92" height="84" rx="3" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <g stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4">
      <line x1="298" y1="163" x2="390" y2="247"/>
      <line x1="390" y1="163" x2="298" y2="247"/>
    </g>
    <circle class="p30-cent" cx="344" cy="205" r="4.5" fill="#dc2626"/>
    <text x="344" y="286" font-size="11.5" fill="#64748b" text-anchor="middle">重心在对角线交点</text>
  </g>

  <!-- 圆环 -->
  <g>
    <rect x="448" y="104" width="192" height="196" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="544" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">均匀圆环</text>
    <circle cx="544" cy="205" r="44" fill="none" stroke="#93c5fd" stroke-width="20"/>
    <circle class="p30-cent" cx="544" cy="205" r="4.5" fill="#dc2626"/>
    <text x="544" y="286" font-size="11.5" fill="#b91c1c" text-anchor="middle">重心在圆心（不在环上）</text>
  </g>

  <!-- 悬挂法 -->
  <g>
    <rect x="648" y="104" width="192" height="196" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="744" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不规则薄板</text>
    <circle cx="744" cy="140" r="3.5" fill="#475569"/>
    <line x1="744" y1="140" x2="744" y2="168" stroke="#475569" stroke-width="1.6"/>
    <polygon points="700,168 786,158 800,224 748,262 694,226" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
    <line class="p30-swing" x1="744" y1="140" x2="744" y2="272" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <circle cx="744" cy="212" r="4.5" fill="#dc2626"/>
    <text x="744" y="286" font-size="11.5" fill="#64748b" text-anchor="middle">悬挂法：重心在悬线上</text>
  </g>

  <!-- 应用 -->
  <g class="p30-note">
    <g>
      <rect x="56" y="318" width="384" height="170" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
      <text x="88" y="344" font-size="13" font-weight="800" fill="#1e3a8a">重心与稳度</text>
      <path d="M84 424 A36 36 0 0 0 156 424 L150 372 Q120 352 90 372 Z" fill="#e8effc" stroke="#1e3a8a" stroke-width="2.5"/>
      <ellipse cx="120" cy="424" rx="36" ry="6" fill="#cbd5e1"/>
      <circle cx="120" cy="410" r="4.5" fill="#dc2626"/>
      <line x1="120" y1="410" x2="120" y2="424" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="182" y="384" font-size="11.5" font-weight="700" fill="#334155">重心越低、支面越大</text>
      <text x="182" y="406" font-size="11.5" font-weight="700" fill="#334155">物体越稳定</text>
      <text x="182" y="432" font-size="11" fill="#64748b">不倒翁底部加重，重心很低</text>
      <text x="182" y="454" font-size="11" fill="#64748b">摔不倒就是因为重心低</text>
    </g>
    <g>
      <rect x="460" y="318" width="384" height="170" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
      <text x="492" y="344" font-size="13" font-weight="800" fill="#047857">重垂线的应用</text>
      <rect x="486" y="360" width="18" height="96" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.6"/>
      <g stroke="#94a3b8" stroke-width="1.3">
        <line x1="486" y1="380" x2="504" y2="362"/>
        <line x1="486" y1="404" x2="504" y2="386"/>
        <line x1="486" y1="428" x2="504" y2="410"/>
        <line x1="486" y1="452" x2="504" y2="434"/>
      </g>
      <line x1="536" y1="356" x2="536" y2="424" stroke="#475569" stroke-width="1.6"/>
      <polygon points="529,424 543,424 536,446" fill="#475569"/>
      <line x1="504" y1="380" x2="536" y2="380" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4"/>
      <text x="578" y="382" font-size="11.5" font-weight="700" fill="#334155">检查墙壁、门框是否竖直</text>
      <text x="578" y="406" font-size="11.5" fill="#64748b">线与墙面平行，墙就是竖直的</text>
      <text x="578" y="432" font-size="11.5" fill="#64748b">重力方向不变，是天然的基准线</text>
      <text x="578" y="456" font-size="11" fill="#64748b">建筑工人常用它校准砌墙</text>
    </g>
  </g>
</g>
</svg>
