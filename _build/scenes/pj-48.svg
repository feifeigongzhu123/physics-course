<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="分子热运动：分子间隙、扩散现象、分子间引力和斥力">
  <style>
    .p48-s1,.p48-s2,.p48-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    .p48-s1{opacity:1;visibility:visible}
    [data-scene="pj-48"] .p48-s1,[data-scene="pj-48"] .p48-s2,[data-scene="pj-48"] .p48-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-48"].s1 .p48-s1,[data-scene="pj-48"].s2 .p48-s2,[data-scene="pj-48"].s3 .p48-s3{opacity:1;visibility:visible}
    @keyframes p48pop{0%{transform:scale(.78);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
    @keyframes p48pulse{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes p48drift{0%{transform:translate(0,0);opacity:.45}50%{opacity:1}100%{transform:translate(10px,-14px);opacity:.45}}
    @keyframes p48fall{0%{transform:translateY(-18px);opacity:0}25%{opacity:1}100%{transform:translateY(52px);opacity:0}}
    @keyframes p48sway{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
    [data-scene="pj-48"].s1 .p48-pop{transform-box:fill-box;transform-origin:center;animation:p48pop .5s ease both}
    [data-scene="pj-48"].s1 .p48-sway{transform-box:fill-box;transform-origin:center;animation:p48sway 2.6s ease-in-out infinite}
    [data-scene="pj-48"].s2 .p48-drop{transform-box:fill-box;transform-origin:center;animation:p48fall 2.4s ease-in infinite}
    [data-scene="pj-48"].s2 .p48-dot{animation:p48drift 3s ease-in-out infinite}
    [data-scene="pj-48"].s2 .p48-dot2{animation:p48drift 3.5s ease-in-out .6s infinite}
    [data-scene="pj-48"].s2 .p48-dot3{animation:p48drift 4s ease-in-out 1.1s infinite}
    [data-scene="pj-48"].s2 .p48-pop{transform-box:fill-box;transform-origin:center;animation:p48pop .5s ease both}
    [data-scene="pj-48"].s3 .p48-pop{transform-box:fill-box;transform-origin:center;animation:p48pop .5s ease both}
    [data-scene="pj-48"].s3 .p48-force{animation:p48pulse 1.8s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">分子热运动：间隙、扩散与分子间作用力</text>

  <!-- 第一步：分子间隙 -->
  <g class="p48-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">分子之间有空隙：不同物质混合后总体积变小</text>

    <rect x="40" y="110" width="400" height="300" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="124" width="150" height="26" rx="13" fill="#e8effc"/>
    <text x="135" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">水与酒精混合</text>

    <rect x="70" y="220" width="70" height="150" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="105" y="205" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">水 50 mL</text>
    <g fill="#3b82f6" opacity=".55">
      <circle cx="88" cy="250" r="4"/><circle cx="112" cy="270" r="4"/><circle cx="124" cy="300" r="4"/>
      <circle cx="92" cy="320" r="4"/><circle cx="116" cy="342" r="4"/><circle cx="100" cy="362" r="4"/>
    </g>

    <rect x="180" y="220" width="70" height="150" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
    <text x="215" y="205" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">酒精 50 mL</text>
    <g fill="#f59e0b" opacity=".7">
      <circle cx="198" cy="240" r="4"/><circle cx="228" cy="258" r="4"/><circle cx="208" cy="286" r="4"/>
      <circle cx="234" cy="316" r="4"/><circle cx="196" cy="336" r="4"/><circle cx="220" cy="358" r="4"/>
    </g>

    <text x="270" y="308" font-size="24" font-weight="900" fill="#475569" text-anchor="middle">+</text>
    <line x1="282" y1="310" x2="306" y2="310" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>

    <rect x="316" y="250" width="80" height="120" rx="6" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="356" y="235" font-size="12" font-weight="800" fill="#5b21b6" text-anchor="middle">混合液</text>
    <text x="356" y="392" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">体积小于 100 mL</text>

    <rect x="460" y="110" width="400" height="300" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="124" width="170" height="26" rx="13" fill="#e8effc"/>
    <text x="565" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">放大看分子</text>

    <rect x="490" y="162" width="340" height="200" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <g class="p48-sway">
      <circle cx="560" cy="220" r="25" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <circle cx="650" cy="255" r="25" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <circle cx="590" cy="315" r="25" fill="#93c5fd" stroke="#1e40af" stroke-width="2"/>
      <circle cx="730" cy="205" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="760" cy="285" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="545" cy="285" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="675" cy="330" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
      <circle cx="705" cy="170" r="14" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
    </g>
    <text x="660" y="388" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">大球和小球之间留有间隙</text>
    <text x="450" y="448" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">混合后总体积变小，说明分子之间存在空隙</text>
  </g>

  <!-- 第二步：扩散 -->
  <g class="p48-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">扩散：不同物质接触时彼此进入对方，分子在不停做无规则运动</text>

    <rect x="40" y="110" width="400" height="300" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="60" y="124" width="140" height="26" rx="13" fill="#e8effc"/>
    <text x="130" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">气体扩散实验</text>

    <rect x="70" y="185" width="90" height="85" rx="6" fill="#e0f2fe" stroke="#64748b" stroke-width="2"/>
    <rect x="70" y="270" width="90" height="85" rx="6" fill="#b45309" stroke="#92400e" stroke-width="2"/>
    <line x1="70" y1="270" x2="160" y2="270" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="115" y="232" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">空气</text>
    <text x="115" y="320" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">二氧化氮</text>

    <line x1="176" y1="280" x2="246" y2="280" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="211" y="266" font-size="11" fill="#64748b" text-anchor="middle">接触</text>

    <rect x="250" y="185" width="90" height="85" rx="6" fill="#c2410c" opacity=".62" stroke="#92400e" stroke-width="2"/>
    <rect x="250" y="270" width="90" height="85" rx="6" fill="#c2410c" opacity=".62" stroke="#92400e" stroke-width="2"/>
    <line x1="250" y1="270" x2="340" y2="270" stroke="#92400e" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="295" y="232" font-size="11.5" font-weight="800" fill="#7c2d12" text-anchor="middle">颜色变浅</text>
    <text x="295" y="320" font-size="11.5" font-weight="800" fill="#7c2d12" text-anchor="middle">颜色变浅</text>
    <text x="211" y="388" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">彼此进入对方</text>

    <rect x="460" y="110" width="400" height="300" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="124" width="140" height="26" rx="13" fill="#e8effc"/>
    <text x="550" y="142" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">墨水扩散</text>

    <path d="M560 190 L560 350 L710 350 L710 190" fill="#bfdbfe" stroke="#64748b" stroke-width="3"/>
    <path d="M560 235 L710 235" stroke="#93c5fd" stroke-width="1.5"/>
    <g class="p48-drop">
      <circle cx="635" cy="180" r="7" fill="#1e3a8a"/>
    </g>
    <g fill="#1e3a8a" opacity=".7">
      <circle class="p48-dot" cx="600" cy="290" r="4"/>
      <circle class="p48-dot2" cx="640" cy="315" r="4"/>
      <circle class="p48-dot3" cx="675" cy="280" r="4"/>
      <circle class="p48-dot2" cx="615" cy="330" r="4"/>
      <circle class="p48-dot3" cx="665" cy="338" r="4"/>
    </g>
    <text x="635" y="380" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">整杯水逐渐变色</text>

    <rect x="760" y="180" width="18" height="130" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="769" cy="318" r="14" fill="#dc2626"/>
    <rect x="763" y="238" width="12" height="72" rx="6" fill="#dc2626"/>
    <text x="769" y="345" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">T</text>
    <text x="450" y="448" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">温度越高，分子运动越剧烈，扩散越快</text>
  </g>

  <!-- 第三步：分子间的作用力 -->
  <g class="p48-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">分子之间同时存在引力和斥力</text>

    <rect x="50" y="110" width="800" height="210" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="320" cy="210" r="48" fill="#93c5fd" stroke="#1e40af" stroke-width="3"/>
    <circle cx="600" cy="210" r="48" fill="#93c5fd" stroke="#1e40af" stroke-width="3"/>
    <text x="320" y="216" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">A</text>
    <text x="600" y="216" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">B</text>

    <line class="p48-force" x1="390" y1="146" x2="440" y2="146" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <line class="p48-force" x1="530" y1="146" x2="480" y2="146" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrGreen)"/>
    <text x="460" y="134" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">引力</text>

    <line class="p48-force" x1="350" y1="276" x2="296" y2="276" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <line class="p48-force" x1="570" y1="276" x2="624" y2="276" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#arrRed)"/>
    <text x="460" y="292" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">斥力</text>

    <line x1="372" y1="200" x2="548" y2="200" stroke="#475569" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <line x1="372" y1="192" x2="372" y2="208" stroke="#475569" stroke-width="2"/>
    <line x1="548" y1="192" x2="548" y2="208" stroke="#475569" stroke-width="2"/>
    <text x="460" y="190" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">r</text>

    <text x="676" y="168" font-size="11.5" font-weight="700" fill="#334155">r = r0：引力 = 斥力</text>
    <text x="676" y="196" font-size="11.5" font-weight="700" fill="#047857">r 变大：引力起主要作用</text>
    <text x="676" y="224" font-size="11.5" font-weight="700" fill="#b91c1c">r 很小：斥力起主要作用</text>
    <text x="676" y="252" font-size="11.5" fill="#64748b">两种力同时存在，都随距离</text>
    <text x="676" y="272" font-size="11.5" fill="#64748b">增大而减小</text>

    <g class="p48-pop">
      <rect x="50" y="345" width="230" height="95" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
      <text x="165" y="370" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">固体：作用力最大</text>
      <g fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.2">
        <circle cx="95" cy="392" r="5"/><circle cx="112" cy="392" r="5"/><circle cx="129" cy="392" r="5"/><circle cx="146" cy="392" r="5"/><circle cx="163" cy="392" r="5"/><circle cx="180" cy="392" r="5"/><circle cx="197" cy="392" r="5"/><circle cx="214" cy="392" r="5"/>
        <circle cx="95" cy="408" r="5"/><circle cx="112" cy="408" r="5"/><circle cx="129" cy="408" r="5"/><circle cx="146" cy="408" r="5"/><circle cx="163" cy="408" r="5"/><circle cx="180" cy="408" r="5"/><circle cx="197" cy="408" r="5"/><circle cx="214" cy="408" r="5"/>
        <circle cx="95" cy="424" r="5"/><circle cx="112" cy="424" r="5"/><circle cx="129" cy="424" r="5"/><circle cx="146" cy="424" r="5"/><circle cx="163" cy="424" r="5"/><circle cx="180" cy="424" r="5"/><circle cx="197" cy="424" r="5"/><circle cx="214" cy="424" r="5"/>
      </g>
    </g>

    <g class="p48-pop">
      <rect x="335" y="345" width="230" height="95" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
      <text x="450" y="370" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">液体：作用力较大</text>
      <g fill="#fbbf24" stroke="#b45309" stroke-width="1.2">
        <circle cx="375" cy="390" r="5"/><circle cx="400" cy="402" r="5"/><circle cx="428" cy="390" r="5"/><circle cx="454" cy="404" r="5"/><circle cx="482" cy="390" r="5"/><circle cx="508" cy="402" r="5"/>
        <circle cx="390" cy="418" r="5"/><circle cx="418" cy="424" r="5"/><circle cx="446" cy="416" r="5"/><circle cx="474" cy="426" r="5"/><circle cx="500" cy="418" r="5"/><circle cx="528" cy="426" r="5"/>
      </g>
    </g>

    <g class="p48-pop">
      <rect x="620" y="345" width="230" height="95" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
      <text x="735" y="370" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">气体：作用力很小</text>
      <g fill="#34d399" stroke="#059669" stroke-width="1.2">
        <circle cx="660" cy="392" r="5"/><circle cx="720" cy="388" r="5"/><circle cx="790" cy="396" r="5"/><circle cx="680" cy="424" r="5"/><circle cx="760" cy="422" r="5"/><circle cx="820" cy="426" r="5"/><circle cx="630" cy="420" r="5"/>
      </g>
    </g>

    <text x="450" y="462" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">分子间距离变化时，引力和斥力都随距离增大而减小</text>
  </g>
</svg>
