<svg class="s68-root" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="简谐运动的描述：弹簧振子、位移时间图像、振幅周期频率与相位">
<style>
[data-scene="ps-68"] .s68-s1,[data-scene="ps-68"] .s68-s2,[data-scene="ps-68"] .s68-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-68"].s1 .s68-s1,[data-scene="ps-68"].s2 .s68-s2,[data-scene="ps-68"].s3 .s68-s3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s68fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes s68pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s68draw{to{stroke-dashoffset:0}}
@keyframes s68osc{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes s68spring{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.19)}}
@keyframes s68pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s68slide{0%,100%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
[data-scene="ps-68"].s1 .s68-curve{stroke-dasharray:820;stroke-dashoffset:820;animation:s68draw 1.6s ease .25s forwards}
[data-scene="ps-68"].s1 .s68-mass{animation:s68osc 2.8s ease-in-out infinite}
[data-scene="ps-68"].s1 .s68-spring{transform-box:view-box;transform-origin:80px 260px;animation:s68spring 2.8s ease-in-out infinite}
[data-scene="ps-68"].s1 .s68-pop{transform-box:fill-box;transform-origin:center;animation:s68pop .5s ease .2s both}
[data-scene="ps-68"].s1 .s68-xarr{stroke-dasharray:90;stroke-dashoffset:90;animation:s68draw .6s ease .5s forwards}
[data-scene="ps-68"].s2 .s68-curve{stroke-dasharray:700;stroke-dashoffset:700;animation:s68draw 1.5s ease .2s forwards}
[data-scene="ps-68"].s2 .s68-amp{animation:s68pulse 1.6s ease-in-out infinite}
[data-scene="ps-68"].s2 .s68-tbr{stroke-dasharray:190;stroke-dashoffset:190;animation:s68draw .8s ease .7s forwards}
[data-scene="ps-68"].s2 .s68-card{transform-box:fill-box;transform-origin:center;animation:s68pop .45s ease both}
[data-scene="ps-68"].s2 .s68-c2{animation-delay:.12s}
[data-scene="ps-68"].s2 .s68-c3{animation-delay:.24s}
[data-scene="ps-68"].s3 .s68-curve{stroke-dasharray:640;stroke-dashoffset:640;animation:s68draw 1.4s ease .2s forwards}
[data-scene="ps-68"].s3 .s68-mark{animation:s68pulse 1.5s ease-in-out infinite}
[data-scene="ps-68"].s3 .s68-mini{animation:s68fade .5s ease both}
[data-scene="ps-68"].s3 .s68-mini2{animation-delay:.2s}
[data-scene="ps-68"].s3 .s68-dot{animation:s68slide 2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">简谐运动的描述：正弦规律、振幅与周期</text>

<!-- 第一步：简谐运动与 x-t 图像 -->
<g class="s68-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">简谐运动：位移随时间按正弦规律变化</text>

  <rect x="36" y="100" width="410" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">弹簧振子模型</text>

  <rect x="64" y="184" width="16" height="152" fill="#cbd5e1"/>
  <g class="s68-spring">
    <path d="M80 260 L94 238 L108 282 L122 238 L136 282 L150 238 L164 282 L178 238 L192 282 L206 238 L220 260"
      fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="s68-mass">
    <rect x="220" y="228" width="64" height="64" rx="9" fill="#f59e0b" stroke="#b45309" stroke-width="2.5"/>
    <text x="252" y="266" font-size="16" font-weight="900" fill="#7c2d12" text-anchor="middle">m</text>
  </g>

  <line x1="252" y1="154" x2="252" y2="344" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7 7"/>
  <text x="252" y="364" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">O</text>
  <line class="s68-xarr" x1="252" y1="190" x2="334" y2="190" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="310" y="178" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">x</text>
  <line x1="288" y1="300" x2="236" y2="300" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="238" y="326" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">F = −kx</text>

  <rect class="s68-pop" x="56" y="382" width="370" height="42" rx="11" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="241" y="410" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">x = A sin(ωt + φ)</text>

  <rect x="466" y="100" width="398" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="665" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">位移—时间图像</text>

  <line x1="520" y1="320" x2="824" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="520" y1="320" x2="520" y2="172" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="830" y="326" font-size="12" fill="#64748b">t</text>
  <text x="500" y="182" font-size="12" fill="#64748b">x</text>
  <text x="506" y="258" font-size="12" font-weight="800" fill="#1e40af">A</text>
  <text x="496" y="396" font-size="12" font-weight="800" fill="#1e40af">−A</text>
  <text x="506" y="344" font-size="11" fill="#94a3b8">O</text>

  <line x1="520" y1="250" x2="820" y2="250" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="520" y1="390" x2="820" y2="390" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <path class="s68-curve" d="M520 320 L535 279 L550 253 L565 253 L580 279 L595 320 L610 361 L625 387 L640 387 L655 361 L670 320 L685 279 L700 253 L715 253 L730 279 L745 320 L760 361 L775 387 L790 387 L805 361 L820 320"
    fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="520" y1="404" x2="520" y2="416"/>
    <line x1="670" y1="404" x2="670" y2="416"/>
    <line x1="520" y1="410" x2="670" y2="410" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="595" y="398" font-size="11.5" font-weight="800" fill="#64748b" text-anchor="middle">T</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">x-t 图像是一条正弦曲线，这是简谐运动最明显的特征</text>
</g>

<!-- 第二步：振幅、周期和频率 -->
<g class="s68-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">振幅 A、周期 T 与频率 f：描述振动的强弱与快慢</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="56" y="132" font-size="13.5" font-weight="800" fill="#1e3a8a">一个全振动的图像</text>

  <line x1="100" y1="330" x2="532" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="100" y1="330" x2="100" y2="196" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="538" y="336" font-size="12" fill="#64748b">t</text>
  <text x="80" y="206" font-size="12" fill="#64748b">x</text>
  <text x="86" y="348" font-size="11" fill="#94a3b8">O</text>

  <line x1="100" y1="250" x2="520" y2="250" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="100" y1="410" x2="520" y2="410" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <path class="s68-curve" d="M100 330 L118 284 L136 254 L154 254 L172 284 L190 330 L208 376 L226 406 L244 406 L262 376 L280 330 L298 284 L316 254 L334 254 L352 284 L370 330 L388 376 L406 406 L424 406 L442 376 L460 330"
    fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round"/>

  <g class="s68-amp">
    <line x1="145" y1="330" x2="145" y2="252" stroke="#dc2626" stroke-width="2.5" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
    <text x="132" y="294" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">A</text>
  </g>

  <g class="s68-tbr" stroke="#94a3b8" stroke-width="1.5">
    <line x1="100" y1="366" x2="100" y2="380"/>
    <line x1="280" y1="366" x2="280" y2="380"/>
    <line x1="100" y1="374" x2="280" y2="374" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="190" y="364" font-size="11.5" font-weight="800" fill="#64748b" text-anchor="middle">T（一次全振动）</text>
  <text x="300" y="414" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">f = 1/T，单位 Hz</text>

  <rect x="576" y="100" width="288" height="100" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="596" y="126" font-size="12.5" font-weight="800" fill="#1e3a8a">振幅 A</text>
  <text x="596" y="150" font-size="11.5" fill="#334155">离开平衡位置的最大距离</text>
  <text x="596" y="172" font-size="11.5" fill="#64748b">标量，表示振动的强弱</text>

  <g class="s68-card s68-c2">
    <rect x="576" y="212" width="288" height="100" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="596" y="238" font-size="12.5" font-weight="800" fill="#92400e">周期 T 与频率 f</text>
    <text x="596" y="262" font-size="11.5" fill="#334155">T：完成一次全振动的时间</text>
    <text x="596" y="284" font-size="11.5" fill="#334155">f：1 s 内完成全振动的次数</text>
    <text x="596" y="304" font-size="11.5" font-weight="800" fill="#b45309">f = 1/T</text>
  </g>

  <g class="s68-card s68-c3">
    <rect x="576" y="324" width="288" height="112" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="596" y="350" font-size="12.5" font-weight="800" fill="#047857">固有周期</text>
    <text x="596" y="374" font-size="11.5" fill="#334155">由振动系统本身决定</text>
    <text x="596" y="396" font-size="11.5" fill="#334155">与振幅大小无关</text>
    <text x="596" y="418" font-size="11.5" font-weight="700" fill="#047857">同一装置，周期不变</text>
  </g>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">振幅看“强弱”，周期和频率看“快慢”，三者从不同角度描述振动</text>
</g>

<!-- 第三步：相位 -->
<g class="s68-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">相位：描述某一时刻的振动状态，相位差反映步调</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <rect x="56" y="116" width="220" height="30" rx="15" fill="#e8effc"/>
  <text x="166" y="136" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">相位决定振动状态</text>
  <text x="470" y="136" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">x = A sin(ωt + φ)</text>

  <line x1="120" y1="300" x2="524" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="120" y1="300" x2="120" y2="214" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="530" y="306" font-size="12" fill="#64748b">t</text>
  <text x="100" y="224" font-size="12" fill="#64748b">x</text>

  <line x1="120" y1="245" x2="500" y2="245" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <line x1="120" y1="355" x2="500" y2="355" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 5"/>
  <path class="s68-curve" d="M120 300 L140 261 L160 245 L180 261 L200 300 L220 339 L240 355 L260 339 L280 300 L300 261 L320 245 L340 261 L360 300 L380 339 L400 355 L420 339 L440 300"
    fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round"/>

  <line x1="160" y1="222" x2="160" y2="356" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 5"/>
  <line x1="240" y1="222" x2="240" y2="356" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 5"/>
  <circle class="s68-mark" cx="160" cy="245" r="5.5" fill="#dc2626"/>
  <circle class="s68-mark" cx="240" cy="355" r="5.5" fill="#dc2626"/>
  <text x="160" y="378" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">t₁（位移最大）</text>
  <text x="250" y="398" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">t₂（反向最大）</text>

  <text x="330" y="424" font-size="12.5" font-weight="800" fill="#334155" text-anchor="middle">相位不同，振动的状态就不同</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="720" y="128" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">同相与反相</text>

  <g class="s68-mini">
    <text x="720" y="154" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">Δφ = 0：步调一致</text>
    <line x1="615" y1="210" x2="818" y2="210" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M615 210 L627 192 L640 186 L652 192 L665 210 L677 228 L690 234 L702 228 L715 210 L727 192 L740 186 L752 192 L765 210 L777 228 L790 234 L802 228 L815 210"
      fill="none" stroke="#dc2626" stroke-width="2.4"/>
    <path d="M615 210 L627 192 L640 186 L652 192 L665 210 L677 228 L690 234 L702 228 L715 210 L727 192 L740 186 L752 192 L765 210 L777 228 L790 234 L802 228 L815 210"
      fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-dasharray="7 6"/>
    <text x="720" y="250" font-size="11" fill="#64748b" text-anchor="middle">两条曲线完全重合</text>
  </g>

  <g class="s68-mini s68-mini2">
    <text x="720" y="286" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">Δφ = π：步调相反</text>
    <line x1="615" y1="350" x2="818" y2="350" stroke="#cbd5e1" stroke-width="1.2"/>
    <path d="M615 350 L627 332 L640 326 L652 332 L665 350 L677 368 L690 374 L702 368 L715 350 L727 332 L740 326 L752 332 L765 350 L777 368 L790 374 L802 368 L815 350"
      fill="none" stroke="#dc2626" stroke-width="2.4"/>
    <path d="M615 350 L627 368 L640 374 L652 368 L665 350 L677 332 L690 326 L702 332 L715 350 L727 368 L740 374 L752 368 L765 350 L777 332 L790 326 L802 332 L815 350"
      fill="none" stroke="#1d4ed8" stroke-width="2.4" stroke-dasharray="7 6"/>
    <text x="720" y="394" font-size="11" fill="#64748b" text-anchor="middle">一个在波峰，另一个在波谷</text>
  </g>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个同频率的简谐运动才能比较相位差：Δφ = φ₂ − φ₁</text>
</g>
</svg>
