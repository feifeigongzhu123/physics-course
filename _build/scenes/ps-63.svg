<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="动量定理：冲量 I 等于 F 乘 t、I 等于动量的变化量、缓冲与打击">
<style>
[data-scene="ps-63"] .s63-step1,[data-scene="ps-63"] .s63-step2,[data-scene="ps-63"] .s63-step3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-63"].s1 .s63-step1,[data-scene="ps-63"].s2 .s63-step2,[data-scene="ps-63"].s3 .s63-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s63draw{to{stroke-dashoffset:0}}
@keyframes s63pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s63slide{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes s63pulse{0%,100%{opacity:.45}50%{opacity:.95}}
[data-scene="ps-63"].s1 .s63-f{stroke-dasharray:140;stroke-dashoffset:140;animation:s63draw .7s ease .3s forwards}
[data-scene="ps-63"].s1 .s63-area{animation:s63pulse 2.2s ease-in-out infinite}
[data-scene="ps-63"].s1 .s63-card{transform-box:fill-box;transform-origin:center;animation:s63pop .5s ease .35s both}
[data-scene="ps-63"].s2 .s63-v{stroke-dasharray:170;stroke-dashoffset:170;animation:s63draw .6s ease .2s forwards}
[data-scene="ps-63"].s2 .s63-v2{animation-delay:.45s}
[data-scene="ps-63"].s2 .s63-card{transform-box:fill-box;transform-origin:center;animation:s63pop .5s ease .3s both}
[data-scene="ps-63"].s2 .s63-bracket{stroke-dasharray:120;stroke-dashoffset:120;animation:s63draw .6s ease .7s forwards}
[data-scene="ps-63"].s3 .s63-card{transform-box:fill-box;transform-origin:center;animation:s63pop .5s ease both}
[data-scene="ps-63"].s3 .s63-card:nth-of-type(2){animation-delay:.15s}
[data-scene="ps-63"].s3 .s63-cushion{animation:s63slide .6s ease .4s both}
[data-scene="ps-63"].s3 .s63-pad{animation:s63pulse 2.4s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">动量定理：冲量 I = Ft 等于动量的变化量</text>

<!-- 第一步：冲量 -->
<g class="s63-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 冲量：I = Ft，力对时间的积累</text>

  <line x1="90" y1="196" x2="380" y2="196" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="110" y="140" width="90" height="54" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="155" y="174" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">m</text>
  <line class="s63-f" x1="208" y1="167" x2="340" y2="167" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="272" y="155" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="272" y="218" font-size="12" fill="#64748b" text-anchor="middle">力 F 持续作用时间 t</text>

  <line x1="140" y1="430" x2="430" y2="430" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="140" y1="430" x2="140" y2="250" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="128" y="292" font-size="12.5" font-weight="800" fill="#475569" text-anchor="end">F</text>
  <text x="438" y="436" font-size="12.5" font-weight="800" fill="#475569">t</text>

  <rect class="s63-area" x="140" y="285" width="180" height="145" fill="#fee2e2" stroke="none"/>
  <line class="s63-f" x1="140" y1="285" x2="320" y2="285" stroke="#dc2626" stroke-width="3"/>
  <line x1="320" y1="285" x2="320" y2="430" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="230" y="368" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">面积 = Ft = I</text>

  <g class="s63-card">
    <rect x="560" y="110" width="310" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">冲量</text>
    <text x="715" y="182" font-size="22" font-weight="900" fill="#b45309" text-anchor="middle">I = F t</text>
    <text x="715" y="218" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">冲量是矢量</text>
    <text x="710" y="246" font-size="12" fill="#334155" text-anchor="middle">方向与力 F 的方向相同</text>
    <text x="710" y="274" font-size="12" fill="#334155" text-anchor="middle">单位：N·s</text>
    <line x1="600" y1="296" x2="830" y2="296" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="715" y="324" font-size="12" fill="#334155" text-anchor="middle">恒力：直接用力乘时间</text>
    <text x="715" y="354" font-size="12" fill="#334155" text-anchor="middle">变力：平均力乘时间</text>
    <text x="715" y="384" font-size="12" fill="#334155" text-anchor="middle">或 F-t 图线与时间轴围成的面积</text>
  </g>

  <rect x="60" y="452" width="800" height="48" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="460" y="481" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">冲量是过程量，是力对时间的积累效果</text>
</g>

<!-- 第二步：I = Δp -->
<g class="s63-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 动量定理：I = Δp</text>

  <text x="80" y="160" font-size="12.5" font-weight="800" fill="#64748b">碰前</text>
  <circle cx="170" cy="200" r="26" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
  <line class="s63-v" x1="202" y1="200" x2="302" y2="200" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="252" y="188" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">v₁</text>
  <text x="170" y="248" font-size="12" fill="#64748b" text-anchor="middle">动量 p₁</text>

  <text x="80" y="310" font-size="12.5" font-weight="800" fill="#64748b">碰后</text>
  <circle cx="170" cy="350" r="26" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
  <line class="s63-v s63-v2" x1="202" y1="350" x2="372" y2="350" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="287" y="338" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">v₂</text>
  <text x="170" y="398" font-size="12" fill="#64748b" text-anchor="middle">动量 p₂</text>

  <line class="s63-bracket" x1="410" y1="226" x2="410" y2="324" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="402" y1="226" x2="418" y2="226" stroke="#94a3b8" stroke-width="2"/>
  <line x1="402" y1="324" x2="418" y2="324" stroke="#94a3b8" stroke-width="2"/>
  <text x="424" y="282" font-size="13" font-weight="800" fill="#475569">t</text>

  <g class="s63-card">
    <rect x="520" y="120" width="350" height="330" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="695" y="152" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">动量定理</text>
    <text x="695" y="194" font-size="18" font-weight="900" fill="#b45309" text-anchor="middle">I = Δp = p₂ − p₁</text>
    <text x="695" y="232" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">F t = m v₂ − m v₁</text>
    <line x1="550" y1="254" x2="840" y2="254" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="695" y="282" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">合外力的冲量等于动量的变化量</text>
    <text x="695" y="312" font-size="12" fill="#334155" text-anchor="middle">适用于恒力、变力</text>
    <text x="695" y="338" font-size="12" fill="#334155" text-anchor="middle">也适用于直线、曲线运动</text>
    <text x="695" y="372" font-size="12" fill="#64748b" text-anchor="middle">矢量式，列式前先规定正方向</text>
    <text x="695" y="406" font-size="11.5" fill="#64748b" text-anchor="middle">F 指物体所受的合外力</text>
  </g>

  <rect x="60" y="462" width="800" height="46" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="460" y="490" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">动量定理把力、作用时间和动量的变化联系了起来</text>
</g>

<!-- 第三步：缓冲与打击 -->
<g class="s63-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 应用：缓冲与打击</text>

  <g class="s63-card">
    <rect x="60" y="112" width="380" height="300" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="250" y="146" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">缓冲：延长作用时间</text>
    <g class="s63-cushion">
      <circle cx="250" cy="178" r="20" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
      <line x1="250" y1="200" x2="250" y2="226" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
      <rect class="s63-pad" x="160" y="230" width="180" height="24" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
      <line x1="306" y1="240" x2="306" y2="206" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
      <text x="322" y="230" font-size="12" font-weight="800" fill="#047857">F 小</text>
    </g>
    <text x="250" y="296" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">Δp 一定：t 越大，F 越小</text>
    <text x="250" y="330" font-size="11.5" fill="#334155" text-anchor="middle">安全气囊 · 跳远沙坑 · 泡沫包装</text>
    <text x="250" y="362" font-size="11.5" fill="#64748b" text-anchor="middle">延长作用时间，减小平均作用力</text>
  </g>

  <g class="s63-card">
    <rect x="460" y="112" width="380" height="300" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="146" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">打击：缩短作用时间</text>
    <line x1="650" y1="140" x2="650" y2="170" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="666" y="158" font-size="12" font-weight="800" fill="#b91c1c">F 大</text>
    <rect x="610" y="172" width="80" height="22" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="688" y="176" width="96" height="12" rx="5" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <line x1="650" y1="194" x2="650" y2="248" stroke="#64748b" stroke-width="4"/>
    <line x1="640" y1="248" x2="660" y2="248" stroke="#64748b" stroke-width="3"/>
    <text x="650" y="296" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">Δp 一定：t 越小，F 越大</text>
    <text x="650" y="330" font-size="11.5" fill="#334155" text-anchor="middle">锤子钉钉子 · 球拍击球</text>
    <text x="650" y="362" font-size="11.5" fill="#64748b" text-anchor="middle">缩短作用时间，获得很大的作用力</text>
  </g>

  <rect x="60" y="440" width="780" height="52" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="466" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">F = Δp / t（平均作用力）</text>
  <text x="450" y="486" font-size="12" fill="#334155" text-anchor="middle">动量的变化量一定时，作用力与作用时间成反比</text>
</g>
</svg>
