<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="磁场对通电导线的作用力：左手定则、安培力 F=BIL、方向与应用">
<style>
[data-scene="ps-84"] .s84-s1,[data-scene="ps-84"] .s84-s2,[data-scene="ps-84"] .s84-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="ps-84"].s1 .s84-s1,[data-scene="ps-84"].s2 .s84-s2,[data-scene="ps-84"].s3 .s84-s3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes s84pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s84pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s84draw{to{stroke-dashoffset:0}}
@keyframes s84blink{0%,100%{opacity:1}50%{opacity:.35}}
[data-scene="ps-84"].s1 .s84-field{animation:s84pulse 3s ease-in-out infinite}
[data-scene="ps-84"].s1 .s84-wire{stroke-dasharray:430;stroke-dashoffset:430;animation:s84draw 1s ease both}
[data-scene="ps-84"].s1 .s84-f{stroke-dasharray:120;stroke-dashoffset:120;animation:s84draw .7s ease .7s both}
[data-scene="ps-84"].s1 .s84-hand{transform-box:fill-box;transform-origin:center;animation:s84pop .55s ease .9s both}
[data-scene="ps-84"].s2 .s84-formula{transform-box:fill-box;transform-origin:center;animation:s84pop .55s ease both}
[data-scene="ps-84"].s2 .s84-f{animation:s84blink 1.8s ease-in-out infinite}
[data-scene="ps-84"].s2 .s84-bracket{stroke-dasharray:250;stroke-dashoffset:250;animation:s84draw .8s ease .5s both}
[data-scene="ps-84"].s3 .s84-app{transform-box:fill-box;transform-origin:center;animation:s84pop .5s ease both}
[data-scene="ps-84"].s3 .s84-a2{animation-delay:.12s}
[data-scene="ps-84"].s3 .s84-a3{animation-delay:.24s}
</style>

<defs>
  <pattern id="s84cross" width="60" height="50" patternUnits="userSpaceOnUse">
    <g stroke="#93c5fd" stroke-width="2" opacity=".8">
      <line x1="26" y1="21" x2="34" y2="29"/>
      <line x1="34" y1="21" x2="26" y2="29"/>
    </g>
  </pattern>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">安培力：磁场对通电导线的作用力</text>

<!-- 第一步：左手定则判断方向 -->
<g class="s84-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">安培力的方向用左手定则判断：磁感线入手心，四指指电流，拇指指 F</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">磁场中的通电导线</text>

  <rect class="s84-field" x="76" y="150" width="464" height="250" fill="url(#s84cross)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="500" y="168" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">B 垂直纸面向里（×）</text>

  <line class="s84-wire" x1="90" y1="300" x2="500" y2="300" stroke="#b45309" stroke-width="7" stroke-linecap="round" marker-end="url(#arrAmber)"/>
  <text x="478" y="286" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">I</text>

  <line class="s84-f" x1="300" y1="294" x2="300" y2="185" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="316" y="210" font-size="13" font-weight="900" fill="#b91c1c">F 安培力</text>

  <text x="296" y="420" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">F 同时垂直于电流 I 和磁场 B</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">左手定则</text>

  <circle cx="612" cy="174" r="11" fill="#dbeafe"/>
  <text x="612" y="178" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
  <text x="634" y="178" font-size="11.5" font-weight="700" fill="#334155">伸开左手，拇指与四指垂直</text>

  <circle cx="612" cy="210" r="11" fill="#dbeafe"/>
  <text x="612" y="214" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
  <text x="634" y="214" font-size="11.5" font-weight="700" fill="#334155">让磁感线垂直穿入手心</text>

  <circle cx="612" cy="246" r="11" fill="#dbeafe"/>
  <text x="612" y="250" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
  <text x="634" y="250" font-size="11.5" font-weight="700" fill="#334155">四指指向电流的方向</text>

  <circle cx="612" cy="282" r="11" fill="#dbeafe"/>
  <text x="612" y="286" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">4</text>
  <text x="634" y="286" font-size="11.5" font-weight="700" fill="#334155">拇指所指就是安培力的方向</text>

  <rect x="596" y="304" width="248" height="38" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="329" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">F⊥I，F⊥B</text>

  <g class="s84-hand" fill="#fde68a" stroke="#b45309" stroke-width="1.8">
    <rect x="624" y="366" width="40" height="36" rx="8"/>
    <rect x="627" y="346" width="7" height="24" rx="3"/>
    <rect x="637" y="342" width="7" height="28" rx="3"/>
    <rect x="647" y="346" width="7" height="24" rx="3"/>
    <rect x="656" y="352" width="7" height="18" rx="3"/>
    <rect x="664" y="374" width="24" height="9" rx="4"/>
  </g>
  <text x="700" y="378" font-size="11" font-weight="700" fill="#475569">拇指与四指垂直</text>
  <text x="700" y="396" font-size="11" font-weight="700" fill="#475569">磁感线穿入手心</text>
  <text x="700" y="414" font-size="11" font-weight="700" fill="#475569">四指指电流方向</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">左手定则：磁感线垂直穿入手心，四指指电流，拇指指安培力方向</text>
</g>

<!-- 第二步：安培力的大小 -->
<g class="s84-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">安培力的大小：B⊥I 时 F=BIL，B∥I 时 F=0</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">导线垂直于磁场</text>

  <rect x="76" y="150" width="464" height="200" fill="url(#s84cross)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="118" y="170" font-size="11.5" font-weight="800" fill="#1e40af">B 垂直纸面向里</text>

  <line x1="100" y1="280" x2="500" y2="280" stroke="#b45309" stroke-width="7" stroke-linecap="round" marker-end="url(#arrAmber)"/>
  <text x="478" y="266" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">I</text>

  <line class="s84-f" x1="300" y1="274" x2="300" y2="190" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="316" y="212" font-size="12.5" font-weight="900" fill="#b91c1c">F</text>

  <g class="s84-bracket" stroke="#1d4ed8" stroke-width="2">
    <line x1="180" y1="318" x2="180" y2="330"/>
    <line x1="420" y1="318" x2="420" y2="330"/>
    <line x1="180" y1="324" x2="420" y2="324"/>
  </g>
  <text x="300" y="348" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">L</text>

  <rect class="s84-formula" x="120" y="368" width="360" height="46" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="300" y="401" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">F = BIL</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">公式与适用条件</text>

  <rect x="596" y="156" width="248" height="56" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="193" font-size="21" font-weight="900" fill="#1e3a8a" text-anchor="middle">F = BIL</text>

  <text x="610" y="242" font-size="11.5" font-weight="700" fill="#334155">B⊥I：安培力最大，F=BIL</text>
  <text x="610" y="270" font-size="11.5" font-weight="700" fill="#334155">B∥I：安培力为零</text>
  <text x="610" y="298" font-size="11.5" font-weight="700" fill="#334155">B 与 I 成 θ 角：F=BIL sinθ</text>
  <text x="610" y="326" font-size="11.5" font-weight="700" fill="#334155">L 为导线在磁场中的有效长度</text>

  <rect x="596" y="346" width="248" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="368" font-size="11" fill="#475569" text-anchor="middle">B：特斯拉(T)　I：安培(A)</text>
  <text x="720" y="388" font-size="11" fill="#475569" text-anchor="middle">L：米(m)　F：牛顿(N)</text>

  <text x="720" y="422" font-size="11" fill="#64748b" text-anchor="middle">I、L 均指导线在磁场中的部分</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F=BIL 适用于 B⊥I；夹角为 θ 时取 F=BIL sinθ，B 与 I 平行时为零</text>
</g>

<!-- 第三步：方向特点与应用 -->
<g class="s84-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">安培力垂直于 I 和 B，电动机、电流表都靠它工作</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="220" height="28" rx="14" fill="#e8effc"/>
  <text x="166" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">安培力的方向特点</text>

  <rect x="76" y="150" width="464" height="230" fill="url(#s84cross)" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="500" y="168" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">B 垂直纸面向里（×）</text>

  <line x1="100" y1="300" x2="500" y2="300" stroke="#b45309" stroke-width="7" stroke-linecap="round" marker-end="url(#arrAmber)"/>
  <text x="478" y="286" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">I</text>
  <line x1="300" y1="294" x2="300" y2="190" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="316" y="212" font-size="13" font-weight="900" fill="#b91c1c">F</text>

  <path d="M300 278 L282 278 L282 300" fill="none" stroke="#1e293b" stroke-width="1.6"/>
  <path d="M300 282 L318 282 L318 300" fill="none" stroke="#1e293b" stroke-width="1.6"/>
  <text x="348" y="270" font-size="11.5" font-weight="800" fill="#334155">F⊥I</text>
  <text x="348" y="330" font-size="11.5" font-weight="800" fill="#334155">F⊥B</text>

  <text x="296" y="420" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">安培力同时垂直于电流方向和磁场方向</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">安培力的应用</text>

  <g class="s84-app">
    <rect x="596" y="156" width="248" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="610" y="180" font-size="12" font-weight="800" fill="#1e3a8a">电动机</text>
    <text x="610" y="202" font-size="11" fill="#475569">通电线圈在磁场中受力转动</text>
    <text x="610" y="222" font-size="11" font-weight="700" fill="#1e40af">电能转化为机械能</text>
  </g>

  <g class="s84-app s84-a2">
    <rect x="596" y="244" width="248" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="610" y="268" font-size="12" font-weight="800" fill="#1e3a8a">磁电式电流表</text>
    <text x="610" y="290" font-size="11" fill="#475569">线圈受安培力带动指针偏转</text>
    <text x="610" y="310" font-size="11" font-weight="700" fill="#1e40af">游丝使指针稳定</text>
  </g>

  <g class="s84-app s84-a3">
    <rect x="596" y="332" width="248" height="76" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="610" y="356" font-size="12" font-weight="800" fill="#1e3a8a">电流天平</text>
    <text x="610" y="378" font-size="11" fill="#475569">利用安培力测量磁感应强度</text>
    <text x="610" y="398" font-size="11" font-weight="700" fill="#1e40af">F=BIL 的实际应用</text>
  </g>

  <text x="720" y="426" font-size="11" fill="#64748b" text-anchor="middle">安培力是电动机工作的基础</text>

  <rect x="36" y="446" width="828" height="44" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">安培力 F 同时垂直于电流 I 和磁场 B，方向由左手定则判断</text>
</g>
</svg>
