<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电压：电压与电源、电压表并联、常见电压值">
  <style>
    [data-scene="pj-58"] .p58-s1,[data-scene="pj-58"] .p58-s2,[data-scene="pj-58"] .p58-s3{opacity:0;visibility:hidden}
    [data-scene="pj-58"].s1 .p58-s1,[data-scene="pj-58"].s2 .p58-s2,[data-scene="pj-58"].s3 .p58-s3{opacity:1;visibility:visible;animation:p58fade .45s ease both}
    @keyframes p58fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes p58flow{to{stroke-dashoffset:-44}}
    @keyframes p58pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes p58spin{to{transform:rotate(360deg)}}
    [data-scene="pj-58"] .p58-flow{stroke-dasharray:8 8;animation:p58flow 1.2s linear infinite}
    [data-scene="pj-58"].s1 .p58-spin{transform-box:view-box;transform-origin:360px 280px;animation:p58spin 6s linear infinite}
    [data-scene="pj-58"].s1 .p58-pulse{animation:p58pulse 1.9s ease-in-out infinite}
    [data-scene="pj-58"].s2 .p58-glow{animation:p58pulse 1.8s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电压：形成电流的原因、电压表与常见电压值</text>

  <!-- 第一步：电压与电源 -->
  <g class="p58-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电压是使电路中形成电流的原因，电源是提供电压的装置</text>

    <rect x="36" y="100" width="430" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="60" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">水路类比：水压差推动水流</text>

    <g fill="none" stroke-linecap="round">
      <path d="M120 250 L120 180 L360 180 L360 250" stroke="#93c5fd" stroke-width="16"/>
      <path d="M360 310 L360 380 L120 380 L120 310" stroke="#93c5fd" stroke-width="16"/>
      <path d="M120 250 L120 180 L360 180 L360 250" stroke="#dbeafe" stroke-width="8"/>
      <path d="M360 310 L360 380 L120 380 L120 310" stroke="#dbeafe" stroke-width="8"/>
    </g>
    <g class="p58-flow" stroke="#0284c7" stroke-width="3" fill="none" opacity=".65">
      <path d="M120 250 L120 180 L360 180 L360 250"/>
      <path d="M360 310 L360 380 L120 380 L120 310"/>
    </g>

    <circle cx="120" cy="280" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M106 292 Q120 306 134 292" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
    <path d="M134 268 Q120 254 106 268" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="120" y="238" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">水泵</text>

    <g class="p58-spin">
      <circle cx="360" cy="280" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
      <g stroke="#b45309" stroke-width="3">
        <line x1="360" y1="254" x2="360" y2="306"/>
        <line x1="334" y1="280" x2="386" y2="280"/>
        <line x1="342" y1="262" x2="378" y2="298"/>
        <line x1="378" y1="262" x2="342" y2="298"/>
      </g>
      <circle cx="360" cy="280" r="5" fill="#92400e"/>
    </g>
    <text x="360" y="238" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">水轮机</text>

    <line x1="200" y1="172" x2="232" y2="172" stroke="#0284c7" stroke-width="3" marker-end="url(#arrBlue)"/>
    <line x1="280" y1="388" x2="248" y2="388" stroke="#0284c7" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="215" y="160" font-size="11.5" font-weight="800" fill="#0369a1" text-anchor="middle">水流</text>
    <text x="240" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">水泵 ≈ 电源　水压 ≈ 电压</text>
    <text x="240" y="446" font-size="11.5" fill="#64748b" text-anchor="middle">水压差使水流动，电压使电荷定向移动</text>

    <rect x="486" y="100" width="378" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="512" y="132" font-size="15" font-weight="800" fill="#1e3a8a">电压 U</text>
    <text x="512" y="172" font-size="12.5" fill="#334155">电压使自由电荷定向移动，形成电流。</text>
    <text x="512" y="196" font-size="12.5" fill="#334155">电源是提供电压的装置。</text>
    <line x1="510" y1="216" x2="840" y2="216" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="512" y="246" font-size="14" font-weight="800" fill="#1e3a8a">单位：伏特（V）</text>
    <text x="512" y="274" font-size="12.5" fill="#334155">1 kV = 1000 V</text>
    <text x="512" y="300" font-size="12.5" fill="#334155">1 V = 1000 mV</text>
    <text x="512" y="326" font-size="12.5" fill="#334155">1 mV = 1000 μV</text>

    <rect x="506" y="344" width="338" height="44" rx="10" fill="#fff7ed"/>
    <text x="675" y="372" font-size="12.5" font-weight="900" fill="#b45309" text-anchor="middle">有电压 + 电路闭合 → 有电流</text>
    <text x="675" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">有电压不一定有电流，电路还要闭合</text>
    <text x="675" y="436" font-size="11.5" fill="#64748b" text-anchor="middle">电源是提供电压的装置</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压是形成电流的原因</text>
    <g font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <rect x="58" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="180" y="556">电源提供电压</text>
      <rect x="328" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="450" y="556">电压使电荷定向移动</text>
      <rect x="598" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="720" y="556">单位：伏特 V</text>
    </g>
  </g>

  <!-- 第二步：电压表并联 -->
  <g class="p58-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电压表要并联在被测电路两端，电流从正接线柱流入、负接线柱流出</text>

    <rect x="36" y="100" width="540" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="60" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">电压表并联在灯泡两端</text>

    <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M90 270 L90 180 L276 180"/>
      <path d="M324 180 L510 180 L510 230"/>
      <path d="M510 260 L510 380 L334 380"/>
      <path d="M266 380 L90 380 L90 283"/>
      <path d="M276 180 L276 305 L266 305"/>
      <path d="M324 180 L324 305 L334 305"/>
    </g>
    <g class="p58-flow" stroke="#dc2626" stroke-width="2" fill="none" opacity=".65">
      <path d="M90 270 L90 180 L276 180"/>
      <path d="M324 180 L510 180 L510 230"/>
      <path d="M510 260 L510 380 L334 380"/>
      <path d="M266 380 L90 380 L90 283"/>
    </g>

    <line x1="70" y1="270" x2="110" y2="270" stroke="#334155" stroke-width="3"/>
    <line x1="78" y1="283" x2="102" y2="283" stroke="#334155" stroke-width="6"/>
    <text x="116" y="266" font-size="12" font-weight="900" fill="#dc2626">+</text>
    <text x="116" y="293" font-size="12" font-weight="900" fill="#1d4ed8">−</text>
    <text x="66" y="320" font-size="12" font-weight="700" fill="#475569" text-anchor="end">电源</text>

    <circle cx="300" cy="180" r="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="283" y1="163" x2="317" y2="197" stroke="#d97706" stroke-width="2.5"/>
    <line x1="317" y1="163" x2="283" y2="197" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p58-glow" cx="300" cy="180" r="31" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <text x="300" y="150" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">灯泡 L</text>

    <circle cx="510" cy="245" r="4" fill="#475569"/>
    <circle cx="510" cy="260" r="4" fill="#475569"/>
    <line x1="510" y1="230" x2="510" y2="260" stroke="#475569" stroke-width="4"/>
    <text x="542" y="248" font-size="12" font-weight="700" fill="#475569">开关</text>

    <circle cx="300" cy="305" r="34" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <text x="300" y="316" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">V</text>
    <text x="262" y="286" font-size="13" font-weight="900" fill="#dc2626">+</text>
    <text x="338" y="286" font-size="13" font-weight="900" fill="#1d4ed8">−</text>
    <text x="300" y="420" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表（并联）</text>

    <g stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
      <line x1="90" y1="252" x2="90" y2="222"/>
      <line x1="440" y1="180" x2="466" y2="180"/>
      <line x1="510" y1="330" x2="510" y2="356"/>
      <line x1="440" y1="380" x2="414" y2="380"/>
    </g>
    <g font-size="12" font-weight="900" fill="#b91c1c">
      <text x="102" y="240">I</text>
      <text x="450" y="170">I</text>
      <text x="522" y="348">I</text>
      <text x="424" y="394">I</text>
    </g>
    <text x="300" y="442" font-size="11.5" fill="#64748b" text-anchor="middle">测灯泡电压：电压表与灯泡并联</text>

    <rect x="596" y="100" width="268" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="730" y="132" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表使用规则</text>
    <g font-size="12.5">
      <circle cx="620" cy="170" r="12" fill="#e8effc"/><text x="620" y="174" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
      <text x="642" y="175" font-weight="800" fill="#334155">并联在被测电路两端</text>
      <text x="642" y="196" font-size="11.5" fill="#64748b">与被测用电器并联</text>

      <circle cx="620" cy="236" r="12" fill="#e8effc"/><text x="620" y="240" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
      <text x="642" y="241" font-weight="800" fill="#334155">正进负出</text>
      <text x="642" y="262" font-size="11.5" fill="#64748b">电流从正接线柱流入</text>

      <circle cx="620" cy="302" r="12" fill="#e8effc"/><text x="620" y="306" font-size="11" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
      <text x="642" y="307" font-weight="800" fill="#334155">量程要合适</text>
      <text x="642" y="328" font-size="11.5" fill="#64748b">被测电压不能超过量程</text>
    </g>
    <rect x="614" y="350" width="232" height="76" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="730" y="378" font-size="12.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">可与电源直接并联</text>
    <text x="730" y="402" font-size="11.5" fill="#334155" text-anchor="middle">此时测的是电源电压</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表与电流表的区别</text>
    <text x="450" y="548" font-size="12.5" fill="#334155" text-anchor="middle">电压表并联在待测用电器两端，可以直接接电源两极测电压</text>
    <text x="450" y="572" font-size="11.5" fill="#64748b" text-anchor="middle">电流表必须串联，绝不能直接接电源两极</text>
  </g>

  <!-- 第三步：常见电压值 -->
  <g class="p58-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">常见电压值：干电池 1.5 V、蓄电池 2 V、安全电压 ≤36 V、家庭电路 220 V</text>

    <rect x="36" y="100" width="200" height="260" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="136" y="132" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">一节干电池</text>
    <rect x="111" y="170" width="50" height="90" rx="7" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="126" y="158" width="20" height="14" rx="3" fill="#94a3b8"/>
    <text x="136" y="205" font-size="18" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>
    <text x="136" y="248" font-size="18" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
    <text x="136" y="300" font-size="24" font-weight="900" fill="#1e3a8a" text-anchor="middle">1.5 V</text>
    <text x="136" y="328" font-size="11.5" fill="#64748b" text-anchor="middle">常用干电池</text>

    <rect x="246" y="100" width="200" height="260" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="346" y="132" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">一节铅蓄电池</text>
    <rect x="301" y="182" width="90" height="70" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <line x1="346" y1="182" x2="346" y2="252" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="311" y="170" width="18" height="14" rx="3" fill="#94a3b8"/>
    <rect x="363" y="170" width="18" height="14" rx="3" fill="#94a3b8"/>
    <text x="320" y="210" font-size="14" font-weight="900" fill="#dc2626" text-anchor="middle">+</text>
    <text x="372" y="210" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
    <text x="346" y="300" font-size="24" font-weight="900" fill="#5b21b6" text-anchor="middle">2 V</text>
    <text x="346" y="328" font-size="11.5" fill="#64748b" text-anchor="middle">单格铅蓄电池</text>

    <rect x="456" y="100" width="200" height="260" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="556" y="132" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">对人体安全电压</text>
    <path d="M556 164 L592 178 L592 218 Q592 244 556 258 Q520 244 520 218 L520 178 Z" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <text x="556" y="222" font-size="22" font-weight="900" fill="#047857" text-anchor="middle">36</text>
    <text x="556" y="300" font-size="24" font-weight="900" fill="#047857" text-anchor="middle">≤ 36 V</text>
    <text x="556" y="328" font-size="11.5" fill="#64748b" text-anchor="middle">不高于 36 V</text>

    <rect x="666" y="100" width="200" height="260" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="766" y="132" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">家庭电路</text>
    <polygon points="766,160 806,192 796,192 796,244 736,244 736,192 726,192" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <path d="M770 200 L754 222 L766 222 L760 240 L780 214 L768 214 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="766" y="300" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">220 V</text>
    <text x="766" y="328" font-size="11.5" fill="#64748b" text-anchor="middle">我国家庭电路</text>

    <rect x="36" y="374" width="828" height="72" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="450" y="404" font-size="13.5" font-weight="900" fill="#b91c1c" text-anchor="middle">36 V 是人体安全电压的上限，家庭电路 220 V 远高于安全电压</text>
    <text x="450" y="430" font-size="12" fill="#7f1d1d" text-anchor="middle">不要直接接触家庭电路的火线，实验时也要注意安全用电</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压单位换算与常见值</text>
    <text x="450" y="548" font-size="12.5" fill="#334155" text-anchor="middle">1 kV = 1000 V　·　1 V = 1000 mV　·　1 mV = 1000 μV</text>
    <text x="450" y="572" font-size="11.5" fill="#64748b" text-anchor="middle">记牢：干电池 1.5 V　蓄电池 2 V　安全电压 ≤36 V　家庭电路 220 V</text>
  </g>
</svg>
