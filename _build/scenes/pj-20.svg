<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="透镜：凸透镜会聚、凹透镜发散、焦点焦距与三条特殊光线">
<style>
[data-scene="pj-20"] .p20-step{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
[data-scene="pj-20"].s1 .p20-step1,
[data-scene="pj-20"].s2 .p20-step2,
[data-scene="pj-20"].s3 .p20-step3{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
@keyframes p20draw{to{stroke-dashoffset:0}}
@keyframes p20pop{0%{transform:scale(.7);opacity:0}75%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p20pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes p20glow{0%,100%{opacity:.85}50%{opacity:1}}
[data-scene="pj-20"].s1 .p20-ray{stroke-dasharray:460;stroke-dashoffset:460;animation:p20draw 1.1s ease forwards}
[data-scene="pj-20"].s1 .p20-lens{animation:p20glow 2.6s ease-in-out infinite}
[data-scene="pj-20"].s1 .p20-focus{transform-box:fill-box;transform-origin:center;animation:p20pulse 1.8s ease-in-out infinite}
[data-scene="pj-20"].s2 .p20-ray{stroke-dasharray:500;stroke-dashoffset:500;animation:p20draw 1.2s ease forwards}
[data-scene="pj-20"].s2 .p20-focus{transform-box:fill-box;transform-origin:center;animation:p20pulse 1.8s ease-in-out infinite}
[data-scene="pj-20"].s2 .p20-bracket{animation:p20pop .5s ease .8s both}
[data-scene="pj-20"].s2 .p20-inset{animation:p20pop .5s ease both}
[data-scene="pj-20"].s2 .p20-insetRay{stroke-dasharray:180;stroke-dashoffset:180;animation:p20draw .9s ease .35s forwards}
[data-scene="pj-20"].s3 .p20-r1 line{stroke-dasharray:700;stroke-dashoffset:700;animation:p20draw 1s ease .1s forwards}
[data-scene="pj-20"].s3 .p20-r2 line{stroke-dasharray:550;stroke-dashoffset:550;animation:p20draw 1s ease .8s forwards}
[data-scene="pj-20"].s3 .p20-r3 line{stroke-dasharray:550;stroke-dashoffset:550;animation:p20draw 1s ease 1.5s forwards}
[data-scene="pj-20"].s3 .p20-image{transform-box:fill-box;transform-origin:bottom center;animation:p20pop .5s ease 2.3s both}
[data-scene="pj-20"].s3 .p20-lead{stroke-dasharray:60;stroke-dashoffset:60;animation:p20draw .5s ease 2.4s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">透镜：会聚与发散 · 焦点 · 三条特殊光线</text>

<!-- 第一步：凸透镜与凹透镜 -->
<g class="p20-step p20-step1" data-zone="1">
  <rect x="40" y="88" width="400" height="380" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="460" y="88" width="400" height="380" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="240" y="118" font-size="15.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">凸透镜（会聚）</text>
  <text x="660" y="118" font-size="15.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">凹透镜（发散）</text>

  <line x1="65" y1="285" x2="425" y2="285" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="9 7"/>
  <line x1="485" y1="285" x2="845" y2="285" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="9 7"/>
  <path class="p20-lens" d="M250 155 Q208 285 250 415 Q292 285 250 155 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.2"/>
  <path class="p20-lens" d="M620 155 L680 155 Q640 285 680 415 L620 415 Q660 285 620 155 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.2"/>

  <g class="p20-ray">
    <line x1="80" y1="205" x2="250" y2="205" stroke="#dc2626" stroke-width="3.2"/>
    <line x1="250" y1="205" x2="420" y2="337" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
    <line x1="80" y1="365" x2="250" y2="365" stroke="#dc2626" stroke-width="3.2"/>
    <line x1="250" y1="365" x2="420" y2="233" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
    <line x1="80" y1="285" x2="420" y2="285" stroke="#dc2626" stroke-width="2.4" opacity=".6"/>
  </g>
  <circle class="p20-focus" cx="365" cy="285" r="5.5" fill="#dc2626"/>
  <text x="365" y="313" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="396" y="360" font-size="12.5" font-weight="800" fill="#1e40af">会聚</text>

  <g class="p20-ray">
    <line x1="485" y1="205" x2="650" y2="205" stroke="#1d4ed8" stroke-width="3.2"/>
    <line x1="650" y1="205" x2="820" y2="125" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arrBlue)"/>
    <line x1="485" y1="365" x2="650" y2="365" stroke="#1d4ed8" stroke-width="3.2"/>
    <line x1="650" y1="365" x2="820" y2="445" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arrBlue)"/>
    <line x1="485" y1="285" x2="820" y2="285" stroke="#1d4ed8" stroke-width="2.4" opacity=".6"/>
    <line x1="650" y1="205" x2="535" y2="285" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7 6" opacity=".7"/>
    <line x1="650" y1="365" x2="535" y2="285" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="7 6" opacity=".7"/>
  </g>
  <circle cx="535" cy="285" r="5.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="520" y="316" font-size="12" font-weight="800" fill="#1e40af" text-anchor="end">虚焦点 F′</text>
  <text x="770" y="240" font-size="12.5" font-weight="800" fill="#1e40af">发散</text>

  <text x="240" y="438" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">中间厚、边缘薄 · 对光会聚</text>
  <text x="240" y="458" font-size="11.5" fill="#64748b" text-anchor="middle">远视镜片是凸透镜</text>
  <text x="660" y="438" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">中间薄、边缘厚 · 对光发散</text>
  <text x="660" y="458" font-size="11.5" fill="#64748b" text-anchor="middle">近视镜片是凹透镜</text>
</g>

<!-- 第二步：焦点和焦距 -->
<g class="p20-step p20-step2" data-zone="2">
  <line x1="60" y1="270" x2="840" y2="270" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="10 7"/>
  <path d="M430 140 Q386 270 430 400 Q474 270 430 140 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.2"/>
  <text x="430" y="128" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">凸透镜</text>

  <g class="p20-ray">
    <line x1="95" y1="200" x2="430" y2="200" stroke="#dc2626" stroke-width="3"/>
    <line x1="430" y1="200" x2="740" y2="347" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <line x1="95" y1="340" x2="430" y2="340" stroke="#dc2626" stroke-width="3"/>
    <line x1="430" y1="340" x2="740" y2="193" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <line x1="95" y1="270" x2="740" y2="270" stroke="#dc2626" stroke-width="2.4" opacity=".65"/>
  </g>
  <text x="120" y="188" font-size="12.5" font-weight="700" fill="#b91c1c">平行光</text>

  <circle class="p20-focus" cx="570" cy="270" r="6" fill="#dc2626"/>
  <circle cx="290" cy="270" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.4"/>
  <g stroke="#1e40af" stroke-width="2">
    <line x1="150" y1="262" x2="150" y2="278"/><line x1="710" y1="262" x2="710" y2="278"/>
  </g>
  <g font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">
    <text x="570" y="296">F</text><text x="290" y="296" fill="#1e40af">F′</text>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="150" y="296">2F</text><text x="710" y="296">2F′</text>
  </g>
  <text x="445" y="292" font-size="12.5" font-weight="800" fill="#1e3a8a">O</text>

  <g class="p20-bracket">
    <line x1="460" y1="330" x2="570" y2="330" stroke="#1d4ed8" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <line x1="430" y1="330" x2="456" y2="330" stroke="#1d4ed8" stroke-width="1.4" stroke-dasharray="2 4" opacity=".55"/>
    <text x="515" y="354" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">f 焦距</text>
  </g>

  <g class="p20-inset">
    <rect x="610" y="85" width="238" height="112" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <path d="M720 105 L750 105 Q730 135 750 165 L720 165 Q740 135 720 105 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="2"/>
    <g class="p20-insetRay">
      <line x1="640" y1="115" x2="720" y2="115" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="720" y1="115" x2="800" y2="100" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="640" y1="155" x2="720" y2="155" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="720" y1="155" x2="800" y2="172" stroke="#1d4ed8" stroke-width="2"/>
      <line x1="720" y1="115" x2="680" y2="135" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <line x1="720" y1="155" x2="680" y2="135" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 4"/>
    </g>
    <circle cx="680" cy="135" r="4" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="729" y="188" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">凹透镜的焦点是虚焦点</text>
  </g>

  <g font-size="12" font-weight="700" fill="#334155">
    <rect x="80" y="414" width="250" height="48" rx="10" fill="#e8effc"/>
    <text x="205" y="444" text-anchor="middle">焦点：平行光会聚点</text>
    <rect x="342" y="414" width="250" height="48" rx="10" fill="#e8effc"/>
    <text x="467" y="444" text-anchor="middle">焦距 f：焦点到光心</text>
    <rect x="604" y="414" width="216" height="48" rx="10" fill="#e8effc"/>
    <text x="712" y="444" text-anchor="middle">f 越小，会聚越强</text>
  </g>
</g>

<!-- 第三步：三条特殊光线 -->
<g class="p20-step p20-step3" data-zone="3">
  <line x1="60" y1="300" x2="840" y2="300" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="10 7"/>
  <path d="M450 175 Q408 300 450 425 Q492 300 450 175 Z" fill="url(#gGlass)" stroke="#1d4ed8" stroke-width="3.2"/>
  <text x="450" y="162" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">凸透镜</text>

  <line x1="170" y1="300" x2="170" y2="200" stroke="#dc2626" stroke-width="5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="170" y="186" font-size="13.5" font-weight="800" fill="#b91c1c" text-anchor="middle">物体 AB</text>

  <g class="p20-r1">
    <line x1="170" y1="200" x2="450" y2="200" stroke="#dc2626" stroke-width="3.2"/>
    <line x1="450" y1="200" x2="770" y2="466" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
  </g>
  <g class="p20-r2">
    <line x1="170" y1="200" x2="450" y2="300" stroke="#d97706" stroke-width="3.2"/>
    <line x1="450" y1="300" x2="770" y2="414" stroke="#d97706" stroke-width="3.2" marker-end="url(#arrAmber)"/>
  </g>
  <g class="p20-r3">
    <line x1="170" y1="200" x2="450" y2="375" stroke="#059669" stroke-width="3.2"/>
    <line x1="450" y1="375" x2="770" y2="375" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
  </g>

  <g class="p20-image">
    <line x1="660" y1="300" x2="660" y2="375" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrBlue)"/>
    <text x="700" y="430" font-size="12.5" font-weight="800" fill="#1e40af">像 A′B′</text>
  </g>

  <circle cx="330" cy="300" r="4.5" fill="#1d4ed8"/>
  <circle cx="570" cy="300" r="4.5" fill="#1d4ed8"/>
  <g font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">
    <text x="330" y="324">F</text><text x="570" y="324">F′</text>
  </g>
  <g stroke="#1e40af" stroke-width="1.8">
    <line x1="210" y1="292" x2="210" y2="308"/><line x1="690" y1="292" x2="690" y2="308"/>
  </g>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <text x="210" y="324">2F</text><text x="690" y="324">2F′</text>
  </g>

  <text x="300" y="186" font-size="12" font-weight="800" fill="#b91c1c">① 平行主光轴 → 过 F′</text>
  <text x="285" y="338" font-size="12" font-weight="800" fill="#b45309">② 过光心，方向不变</text>
  <text x="520" y="452" font-size="12" font-weight="800" fill="#047857">③ 过 F，折射后平行主光轴</text>
  <line class="p20-lead" x1="600" y1="446" x2="600" y2="379" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="92" y="430" width="300" height="40" rx="12" fill="#e8effc"/>
  <text x="242" y="456" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">u &gt; 2f：倒立、缩小、实像</text>
</g>
</svg>
