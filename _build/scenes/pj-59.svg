<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="串并联电压规律：串联总电压等于各部分电压之和，并联各支路电压相等，电压表的连接与读数">
<style>
.p59-s1,.p59-s2,.p59-s3{opacity:0;visibility:hidden}
.p59-s1{opacity:1;visibility:visible}
[data-scene="pj-59"] .p59-s1,[data-scene="pj-59"] .p59-s2,[data-scene="pj-59"] .p59-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-59"].s1 .p59-s1,[data-scene="pj-59"].s2 .p59-s2,[data-scene="pj-59"].s3 .p59-s3{opacity:1;visibility:visible}
@keyframes p59flow{to{stroke-dashoffset:-40}}
@keyframes p59pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes p59pop{0%{transform:scale(.8);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p59swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}}
[data-scene="pj-59"].s1 .p59-flow{stroke-dasharray:11 8;animation:p59flow 1.4s linear infinite}
[data-scene="pj-59"].s1 .p59-eq{transform-box:fill-box;transform-origin:center;animation:p59pop .55s ease both}
[data-scene="pj-59"].s1 .p59-v{animation:p59pulse 1.8s ease-in-out infinite}
[data-scene="pj-59"].s2 .p59-flow2{stroke-dasharray:11 8;animation:p59flow 1.4s linear infinite}
[data-scene="pj-59"].s2 .p59-eq2{transform-box:fill-box;transform-origin:center;animation:p59pop .55s ease both}
[data-scene="pj-59"].s3 .p59-needle{transform-box:view-box;transform-origin:450px 250px;animation:p59swing 2.6s ease-in-out infinite}
[data-scene="pj-59"].s3 .p59-card{transform-box:fill-box;transform-origin:center;animation:p59pop .5s ease both}
[data-scene="pj-59"].s3 .p59-card2{animation-delay:.12s}
[data-scene="pj-59"].s3 .p59-card3{animation-delay:.24s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">串并联电压规律：串联分压，并联等压</text>

<!-- 第一步：串联电压规律 -->
<g class="p59-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">串联电路：总电压等于各部分电压之和</text>

  <rect x="36" y="100" width="430" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="214" height="28" rx="14" fill="#e8effc"/>
  <text x="163" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联：电压表分别测量</text>

  <path d="M80 190 H402 V344 H80 Z" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path class="p59-flow" d="M80 190 H402 V344 H80 Z" fill="none" stroke="#1d4ed8" stroke-width="5" opacity=".9"/>

  <!-- 灯泡 L1 / L2 -->
  <circle cx="160" cy="190" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="150" y1="180" x2="170" y2="200" stroke="#d97706" stroke-width="2"/>
  <line x1="170" y1="180" x2="150" y2="200" stroke="#d97706" stroke-width="2"/>
  <text x="160" y="158" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">L₁</text>
  <circle cx="320" cy="190" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="310" y1="180" x2="330" y2="200" stroke="#d97706" stroke-width="2"/>
  <line x1="330" y1="180" x2="310" y2="200" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="158" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">L₂</text>

  <!-- 电压表 V1 -->
  <line x1="146" y1="210" x2="146" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="146" y1="285" x2="142" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="174" y1="210" x2="174" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="174" y1="285" x2="178" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <g class="p59-v">
    <circle cx="160" cy="285" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="160" y="291" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">V₁</text>
  </g>
  <text x="160" y="236" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">U₁</text>

  <!-- 电压表 V2 -->
  <line x1="306" y1="210" x2="306" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="306" y1="285" x2="302" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="334" y1="210" x2="334" y2="285" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="334" y1="285" x2="338" y2="285" stroke="#1d4ed8" stroke-width="2"/>
  <g class="p59-v">
    <circle cx="320" cy="285" r="18" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="320" y="291" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">V₂</text>
  </g>
  <text x="320" y="236" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">U₂</text>

  <!-- 电源与开关 -->
  <line x1="220" y1="330" x2="220" y2="358" stroke="#334155" stroke-width="4"/>
  <line x1="234" y1="336" x2="234" y2="352" stroke="#334155" stroke-width="4"/>
  <text x="227" y="376" font-size="11" fill="#64748b" text-anchor="middle">电源</text>
  <circle cx="310" cy="344" r="4" fill="#334155"/>
  <circle cx="340" cy="344" r="4" fill="#334155"/>
  <line x1="310" y1="344" x2="338" y2="330" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="325" y="324" font-size="11.5" font-weight="800" fill="#64748b">S</text>

  <text x="250" y="396" font-size="11.5" fill="#64748b" text-anchor="middle">电压表并联在灯泡两端，分别测 U₁、U₂</text>

  <rect x="486" y="100" width="378" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="506" y="116" width="150" height="28" rx="14" fill="#e8effc"/>
  <text x="581" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压关系</text>

  <g class="p59-eq">
    <text x="675" y="186" font-size="25" font-weight="900" fill="#1e3a8a" text-anchor="middle">U总 = U₁ + U₂</text>
  </g>
  <text x="675" y="214" font-size="12" fill="#64748b" text-anchor="middle">串联电路两端的总电压</text>
  <text x="675" y="233" font-size="12" fill="#64748b" text-anchor="middle">等于各部分电压之和</text>

  <rect x="510" y="252" width="100" height="58" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="560" y="273" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">U₁</text>
  <text x="560" y="298" font-size="17" font-weight="900" fill="#92400e" text-anchor="middle">2 V</text>
  <text x="616" y="288" font-size="19" font-weight="900" fill="#64748b" text-anchor="middle">+</text>
  <rect x="622" y="252" width="100" height="58" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="672" y="273" font-size="11.5" font-weight="800" fill="#92400e" text-anchor="middle">U₂</text>
  <text x="672" y="298" font-size="17" font-weight="900" fill="#92400e" text-anchor="middle">4 V</text>
  <text x="730" y="288" font-size="19" font-weight="900" fill="#64748b" text-anchor="middle">=</text>
  <rect x="742" y="252" width="104" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="794" y="273" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">U总</text>
  <text x="794" y="298" font-size="17" font-weight="900" fill="#1e3a8a" text-anchor="middle">6 V</text>

  <text x="675" y="342" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">2 V + 4 V = 6 V</text>
  <text x="675" y="372" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">串联分压：电阻越大，分得的电压越大</text>
  <text x="675" y="394" font-size="11" fill="#64748b" text-anchor="middle">总电压由电源决定，各部分按电阻分配</text>
</g>

<!-- 第二步：并联电压规律 -->
<g class="p59-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">并联电路：各支路两端的电压相等</text>

  <rect x="36" y="100" width="430" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="214" height="28" rx="14" fill="#e6f7f1"/>
  <text x="163" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">并联：电压表测并联电压</text>

  <path d="M80 190 H440 M80 344 H440 M80 190 V344" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
  <path class="p59-flow2" d="M80 190 H440 M80 344 H440 M80 190 V344" fill="none" stroke="#1d4ed8" stroke-width="5" opacity=".9"/>
  <line x1="190" y1="190" x2="190" y2="247" stroke="#334155" stroke-width="4"/>
  <line x1="190" y1="287" x2="190" y2="344" stroke="#334155" stroke-width="4"/>
  <line x1="320" y1="190" x2="320" y2="247" stroke="#334155" stroke-width="4"/>
  <line x1="320" y1="287" x2="320" y2="344" stroke="#334155" stroke-width="4"/>
  <path class="p59-flow2" d="M190 190 V247 M190 287 V344 M320 190 V247 M320 287 V344" fill="none" stroke="#059669" stroke-width="5" opacity=".85"/>

  <circle cx="190" cy="267" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="180" y1="257" x2="200" y2="277" stroke="#d97706" stroke-width="2"/>
  <line x1="200" y1="257" x2="180" y2="277" stroke="#d97706" stroke-width="2"/>
  <text x="158" y="258" font-size="12" font-weight="800" fill="#92400e" text-anchor="end">L₁</text>
  <text x="158" y="286" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="end">U₁</text>
  <circle cx="320" cy="267" r="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <line x1="310" y1="257" x2="330" y2="277" stroke="#d97706" stroke-width="2"/>
  <line x1="330" y1="257" x2="310" y2="277" stroke="#d97706" stroke-width="2"/>
  <text x="288" y="258" font-size="12" font-weight="800" fill="#92400e" text-anchor="end">L₂</text>
  <text x="288" y="286" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="end">U₂</text>

  <!-- 电压表跨接两条支路 -->
  <line x1="440" y1="190" x2="440" y2="247" stroke="#1d4ed8" stroke-width="2.5"/>
  <line x1="440" y1="287" x2="440" y2="344" stroke="#1d4ed8" stroke-width="2.5"/>
  <g class="p59-v">
    <circle cx="440" cy="267" r="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="440" y="273" font-size="12.5" font-weight="900" fill="#1e40af" text-anchor="middle">V</text>
  </g>

  <line x1="210" y1="330" x2="210" y2="358" stroke="#334155" stroke-width="4"/>
  <line x1="224" y1="336" x2="224" y2="352" stroke="#334155" stroke-width="4"/>
  <text x="217" y="376" font-size="11" fill="#64748b" text-anchor="middle">电源</text>
  <circle cx="330" cy="344" r="4" fill="#334155"/>
  <circle cx="360" cy="344" r="4" fill="#334155"/>
  <line x1="330" y1="344" x2="358" y2="330" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <text x="345" y="324" font-size="11.5" font-weight="800" fill="#64748b">S</text>

  <text x="250" y="396" font-size="11.5" fill="#64748b" text-anchor="middle">电压表并联在并联电路两端，示数等于各支路电压</text>

  <rect x="486" y="100" width="378" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="506" y="116" width="150" height="28" rx="14" fill="#e6f7f1"/>
  <text x="581" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">电压关系</text>

  <g class="p59-eq2">
    <text x="675" y="192" font-size="25" font-weight="900" fill="#047857" text-anchor="middle">U₁ = U₂ = U</text>
  </g>
  <text x="675" y="222" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">并联电路各支路两端电压相等</text>

  <rect x="510" y="250" width="330" height="36" rx="10" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="675" y="273" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">L₁ 支路：U₁ = 3 V</text>
  <rect x="510" y="296" width="330" height="36" rx="10" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="1.5"/>
  <text x="675" y="319" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">L₂ 支路：U₂ = 3 V</text>

  <text x="675" y="360" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">并联不分压：支路电压都等于电源电压</text>
  <text x="675" y="386" font-size="11.5" fill="#64748b" text-anchor="middle">支路电阻不同，电压仍然相同</text>
</g>

<!-- 第三步：电压表实验 -->
<g class="p59-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">电压表的使用：并联、选量程、正接线柱流入</text>

  <g class="p59-card">
    <rect x="36" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="56" y="116" width="140" height="28" rx="14" fill="#e8effc"/>
    <text x="126" y="135" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 并联接入</text>

    <line x1="85" y1="233" x2="105" y2="233" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <rect x="105" y="215" width="130" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <line x1="235" y1="233" x2="255" y2="233" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <text x="170" y="204" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">被测电阻 R</text>

    <line x1="120" y1="251" x2="120" y2="305" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="120" y1="305" x2="148" y2="305" stroke="#1d4ed8" stroke-width="2"/>
    <line x1="220" y1="251" x2="220" y2="305" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="220" y1="305" x2="192" y2="305" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="170" cy="305" r="22" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="170" y="311" font-size="13" font-weight="900" fill="#1e40af" text-anchor="middle">V</text>

    <text x="166" y="352" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表与被测用电器并联</text>
    <text x="166" y="378" font-size="11.5" fill="#475569" text-anchor="middle">电流从正接线柱流入</text>
    <text x="166" y="398" font-size="11.5" fill="#475569" text-anchor="middle">从负接线柱流出</text>
  </g>

  <g class="p59-card p59-card2">
    <rect x="320" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="340" y="116" width="140" height="28" rx="14" fill="#fff7ed"/>
    <text x="410" y="135" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">② 选择量程</text>

    <rect x="342" y="150" width="216" height="140" rx="16" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
    <path d="M372 252 A78 78 0 0 1 528 252" fill="none" stroke="#64748b" stroke-width="2"/>
    <line x1="366" y1="252" x2="378" y2="252" stroke="#64748b" stroke-width="2"/>
    <line x1="450" y1="174" x2="450" y2="186" stroke="#64748b" stroke-width="2"/>
    <line x1="522" y1="252" x2="534" y2="252" stroke="#64748b" stroke-width="2"/>
    <text x="372" y="270" font-size="11" fill="#64748b" text-anchor="middle">0</text>
    <text x="528" y="270" font-size="11" fill="#64748b" text-anchor="middle">3</text>
    <g class="p59-needle">
      <line x1="450" y1="252" x2="494" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="450" cy="252" r="4" fill="#dc2626"/>
    </g>
    <text x="450" y="228" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">V</text>

    <text x="450" y="318" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">0~3 V　分度值 0.1 V</text>
    <text x="450" y="342" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">0~15 V　分度值 0.5 V</text>
    <text x="450" y="372" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">先看量程，再看分度值</text>
    <text x="450" y="394" font-size="11" fill="#64748b" text-anchor="middle">不能估读，按分度值读取</text>
  </g>

  <g class="p59-card p59-card3">
    <rect x="604" y="100" width="260" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="624" y="116" width="140" height="28" rx="14" fill="#e6f7f1"/>
    <text x="694" y="135" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">③ 正确读数</text>

    <text x="734" y="208" font-size="34" font-weight="900" fill="#1e3a8a" text-anchor="middle">2.4 V</text>
    <line x1="650" y1="226" x2="818" y2="226" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="638" y="258" font-size="12" font-weight="700" fill="#334155">① 确认所选量程</text>
    <text x="638" y="290" font-size="12" font-weight="700" fill="#334155">② 看清每小格的值</text>
    <text x="638" y="322" font-size="12" font-weight="700" fill="#334155">③ 数格读出电压值</text>
    <text x="638" y="354" font-size="12" font-weight="700" fill="#334155">④ 记录数值并带单位</text>

    <rect x="624" y="368" width="220" height="28" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="734" y="387" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">偏转不足 1/3，换小量程更准</text>
  </g>

  <rect x="60" y="416" width="780" height="40" rx="12" fill="#eef6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="441" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联 U总 = U₁ + U₂；并联 U₁ = U₂ = U；电压表始终与被测部分并联</text>
</g>
</svg>
