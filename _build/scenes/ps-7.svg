<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="加速度：速度变化量、加速度的方向与加减速、加速度与速度的区别">
<style>
[data-scene="ps-7"] .s7-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-7"].s1 .s7-step1,[data-scene="ps-7"].s2 .s7-step2,[data-scene="ps-7"].s3 .s7-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s7grow{from{opacity:0}to{opacity:1}}
@keyframes s7pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s7pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s7drop{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
[data-scene="ps-7"].s1 .s7-carA{animation:s7grow .45s ease .1s both}
[data-scene="ps-7"].s1 .s7-carB{animation:s7grow .45s ease .4s both}
[data-scene="ps-7"].s1 .s7-dv{animation:s7grow .5s ease .8s both}
[data-scene="ps-7"].s2 .s7-acc{animation:s7grow .5s ease .2s both}
[data-scene="ps-7"].s2 .s7-decel{animation:s7grow .5s ease .5s both}
[data-scene="ps-7"].s2 .s7-aArrow{animation:s7pulse 1.6s ease-in-out infinite}
[data-scene="ps-7"].s3 .s7-card1,[data-scene="ps-7"].s3 .s7-card2,[data-scene="ps-7"].s3 .s7-card3{transform-box:fill-box;transform-origin:center;animation:s7pop .45s ease both}
[data-scene="ps-7"].s3 .s7-card2{animation-delay:.12s}
[data-scene="ps-7"].s3 .s7-card3{animation-delay:.24s}
[data-scene="ps-7"].s3 .s7-ball{transform-box:fill-box;transform-origin:center;animation:s7drop 2.2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">速度变化快慢——加速度：矢量与 Δv</text>

<!-- 第一步：速度变化量 -->
<g class="s7-step s7-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">速度变化量 Δv = v₂ − v₁，也是矢量</text>

  <rect x="560" y="98" width="290" height="110" rx="13" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="560" y="98" width="290" height="7" rx="3.5" fill="#7c3aed"/>
  <text x="705" y="128" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">Δv = v₂ − v₁</text>
  <text x="705" y="156" font-size="13" font-weight="800" fill="#6d28d9" text-anchor="middle">= 15 − 5 = 10 m/s</text>
  <text x="705" y="182" font-size="12" fill="#334155" text-anchor="middle">方向：水平向右</text>

  <line x1="90" y1="318" x2="880" y2="318" stroke="#cbd5e1" stroke-width="3"/>

  <g class="s7-carA">
    <rect x="120" y="266" width="126" height="34" rx="9" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <path d="M152 266 L164 248 L206 248 L218 266 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="144" cy="304" r="9" fill="#1e293b"/>
    <circle cx="222" cy="304" r="9" fill="#1e293b"/>
    <line x1="246" y1="236" x2="336" y2="236" stroke="#1d4ed8" stroke-width="3.2" marker-end="url(#arrBlue)"/>
    <text x="291" y="224" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">v₁ = 5 m/s</text>
    <text x="183" y="334" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">原来</text>
  </g>

  <g class="s7-carB">
    <rect x="560" y="266" width="126" height="34" rx="9" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
    <path d="M592 266 L604 248 L646 248 L658 266 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
    <circle cx="584" cy="304" r="9" fill="#1e293b"/>
    <circle cx="662" cy="304" r="9" fill="#1e293b"/>
    <line x1="686" y1="236" x2="856" y2="236" stroke="#dc2626" stroke-width="3.4" marker-end="url(#arrRed)"/>
    <text x="771" y="224" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">v₂ = 15 m/s</text>
    <text x="623" y="334" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">后来</text>
  </g>

  <g class="s7-dv">
    <line x1="200" y1="450" x2="290" y2="450" stroke="#059669" stroke-width="3.2" marker-end="url(#arrGreen)"/>
    <line x1="200" y1="450" x2="470" y2="450" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
    <line x1="290" y1="430" x2="470" y2="430" stroke="#7c3aed" stroke-width="4.5" marker-end="url(#arrBlue)"/>
    <line x1="290" y1="430" x2="290" y2="450" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="470" y1="430" x2="470" y2="450" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="245" y="472" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">v₁</text>
    <text x="335" y="472" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">v₂</text>
    <text x="380" y="418" font-size="12.5" font-weight="800" fill="#6d28d9" text-anchor="middle">Δv = 10 m/s</text>
    <text x="188" y="454" font-size="12" font-weight="800" fill="#475569" text-anchor="end">O</text>
  </g>

  <rect x="560" y="352" width="290" height="110" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="705" y="378" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">矢量减法</text>
  <text x="705" y="404" font-size="11.5" fill="#334155" text-anchor="middle">从 v₁ 的末端指向 v₂ 的末端</text>
  <text x="705" y="428" font-size="11.5" fill="#334155" text-anchor="middle">同一直线上可转化为代数运算</text>
  <text x="705" y="452" font-size="11.5" fill="#475569" text-anchor="middle">Δv 的方向与速度变化的方向相同</text>
</g>

<!-- 第二步：加速度的方向与加减速 -->
<g class="s7-step s7-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">a 的方向与 Δv 同向：与 v 同向加速，反向减速</text>

  <rect x="60" y="112" width="380" height="318" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="60" y="112" width="380" height="8" rx="4" fill="#dc2626"/>
  <g class="s7-acc">
    <text x="250" y="148" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">加速运动</text>
    <text x="250" y="172" font-size="12.5" font-weight="800" fill="#475569" text-anchor="middle">v 与 a 同向</text>
    <rect x="150" y="300" width="160" height="36" rx="9" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <path d="M190 300 L204 282 L256 282 L270 300 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="176" cy="340" r="9" fill="#1e293b"/>
    <circle cx="284" cy="340" r="9" fill="#1e293b"/>
    <line x1="230" y1="250" x2="330" y2="250" stroke="#1d4ed8" stroke-width="3.4" marker-end="url(#arrBlue)"/>
    <text x="342" y="255" font-size="13.5" font-weight="900" fill="#1e3a8a">v</text>
    <line class="s7-aArrow" x1="230" y1="386" x2="330" y2="386" stroke="#dc2626" stroke-width="3.6" marker-end="url(#arrRed)"/>
    <text x="342" y="391" font-size="13.5" font-weight="900" fill="#b91c1c">a</text>
    <text x="250" y="416" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">速度不断增大</text>
  </g>

  <rect x="460" y="112" width="380" height="318" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="460" y="112" width="380" height="8" rx="4" fill="#1d4ed8"/>
  <g class="s7-decel">
    <text x="650" y="148" font-size="15" font-weight="900" fill="#1d4ed8" text-anchor="middle">减速运动</text>
    <text x="650" y="172" font-size="12.5" font-weight="800" fill="#475569" text-anchor="middle">v 与 a 反向</text>
    <rect x="550" y="300" width="160" height="36" rx="9" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <path d="M590 300 L604 282 L656 282 L670 300 Z" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="576" cy="340" r="9" fill="#1e293b"/>
    <circle cx="684" cy="340" r="9" fill="#1e293b"/>
    <line x1="630" y1="250" x2="730" y2="250" stroke="#1d4ed8" stroke-width="3.4" marker-end="url(#arrBlue)"/>
    <text x="742" y="255" font-size="13.5" font-weight="900" fill="#1e3a8a">v</text>
    <line class="s7-aArrow" x1="730" y1="386" x2="630" y2="386" stroke="#dc2626" stroke-width="3.6" marker-end="url(#arrRed)"/>
    <text x="618" y="391" font-size="13.5" font-weight="900" fill="#b91c1c" text-anchor="end">a</text>
    <text x="650" y="416" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">速度不断减小</text>
  </g>

  <rect x="70" y="436" width="760" height="44" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="463" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断加速还是减速，只看 a 与 v 的方向关系，与 a 本身的正负无关</text>
</g>

<!-- 第三步：a 与 v 的区别 -->
<g class="s7-step s7-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">a 与 v 没有必然联系：a 大，v 不一定大</text>

  <g class="s7-card1">
    <rect x="60" y="120" width="250" height="250" rx="15" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="185" y="152" font-size="13.5" font-weight="900" fill="#b91c1c" text-anchor="middle">a 很大，v 很小</text>
    <rect x="150" y="238" width="70" height="24" rx="6" fill="#60a5fa" stroke="#1e40af" stroke-width="1.6"/>
    <circle cx="165" cy="262" r="6" fill="#1e293b"/>
    <circle cx="205" cy="262" r="6" fill="#1e293b"/>
    <line x1="226" y1="228" x2="258" y2="228" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="185" y="308" font-size="12" fill="#334155" text-anchor="middle">汽车启动的瞬间</text>
    <text x="185" y="332" font-size="12" fill="#334155" text-anchor="middle">速度几乎为零</text>
    <text x="185" y="356" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">加速度却可以很大</text>
  </g>

  <g class="s7-card2">
    <rect x="325" y="120" width="250" height="250" rx="15" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="152" font-size="13.5" font-weight="900" fill="#1d4ed8" text-anchor="middle">v 很大，a = 0</text>
    <rect x="412" y="236" width="76" height="26" rx="7" fill="#94a3b8" stroke="#475569" stroke-width="1.6"/>
    <rect x="422" y="242" width="20" height="14" rx="3" fill="#e2e8f0"/>
    <rect x="448" y="242" width="20" height="14" rx="3" fill="#e2e8f0"/>
    <line x1="396" y1="292" x2="504" y2="292" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="450" y="316" font-size="12" fill="#334155" text-anchor="middle">列车以 300 km/h 匀速行驶</text>
    <text x="450" y="340" font-size="12" fill="#334155" text-anchor="middle">速度很大但保持不变</text>
    <text x="450" y="364" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">a = 0</text>
  </g>

  <g class="s7-card3">
    <rect x="590" y="120" width="250" height="250" rx="15" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="152" font-size="13.5" font-weight="900" fill="#6d28d9" text-anchor="middle">v = 0，a ≠ 0</text>
    <line x1="715" y1="180" x2="715" y2="270" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <g class="s7-ball">
      <circle cx="715" cy="204" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="1.8"/>
    </g>
    <line x1="715" y1="226" x2="715" y2="272" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="728" y="250" font-size="13" font-weight="900" fill="#b91c1c">g</text>
    <text x="715" y="308" font-size="12" fill="#334155" text-anchor="middle">竖直上抛到达最高点</text>
    <text x="715" y="332" font-size="12" fill="#334155" text-anchor="middle">速度为零</text>
    <text x="715" y="356" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">加速度仍为 g</text>
  </g>

  <rect x="70" y="400" width="760" height="84" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="426" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">关键区别</text>
  <text x="450" y="450" font-size="12" fill="#334155" text-anchor="middle">v 描述位置变化的快慢，a 描述速度变化的快慢</text>
  <text x="450" y="474" font-size="12" fill="#334155" text-anchor="middle">a 不变的运动叫匀变速直线运动；a 与 v 同向加速、反向减速</text>
</g>
</svg>
