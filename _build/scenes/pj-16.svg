<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="光的直线传播：光源与光线、影子与日食与小孔成像、光速与光年">
  <style>
[data-scene="pj-16"] .p16-z1,[data-scene="pj-16"] .p16-z2,[data-scene="pj-16"] .p16-z3{opacity:0;transition:opacity .45s}
[data-scene="pj-16"].s1 .p16-z1,[data-scene="pj-16"].s2 .p16-z2,[data-scene="pj-16"].s3 .p16-z3{opacity:1}
[data-scene="pj-16"] .p16-flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite}
[data-scene="pj-16"] .p16-ray{stroke-dasharray:320;stroke-dashoffset:320}
[data-scene="pj-16"].s1 .p16-ray{animation:p16draw .9s ease forwards}
[data-scene="pj-16"].s1 .p16-ray:nth-of-type(2){animation-delay:.15s}
[data-scene="pj-16"].s1 .p16-ray:nth-of-type(3){animation-delay:.3s}
[data-scene="pj-16"].s1 .p16-ray:nth-of-type(4){animation-delay:.45s}
[data-scene="pj-16"].s1 .p16-ray:nth-of-type(5){animation-delay:.6s}
[data-scene="pj-16"].s1 .p16-laser{animation:dashFlow 1.2s linear infinite}
[data-scene="pj-16"].s1 .p16-x{animation:popIn .5s ease .35s both}
[data-scene="pj-16"].s2 .p16-cone{animation:popIn .55s ease .15s both}
[data-scene="pj-16"].s2 .p16-img{animation:popIn .55s ease .55s both;transform-box:fill-box;transform-origin:center}
[data-scene="pj-16"].s2 .p16-shadow{animation:softGlow 2.4s ease-in-out infinite}
[data-scene="pj-16"].s3 .p16-beam{animation:dashFlow 1.4s linear infinite}
[data-scene="pj-16"].s3 .p16-big{animation:popIn .55s ease both}
[data-scene="pj-16"].s3 .p16-pill{animation:popIn .5s ease .2s both;transform-box:fill-box;transform-origin:center}
@keyframes p16draw{to{stroke-dashoffset:0}}
  </style>
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">光的直线传播：光源、光线与光速</text>

  <!-- ===== 第 1 步：光源与光线 ===== -->
  <g class="p16-z1" data-zone="1">
    <rect x="40" y="70" width="480" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="280" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">自身能够发光的物体叫光源</text>

    <circle cx="110" cy="160" r="22" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="110" y1="128" x2="110" y2="136"/><line x1="110" y1="184" x2="110" y2="192"/>
      <line x1="78" y1="160" x2="86" y2="160"/><line x1="134" y1="160" x2="142" y2="160"/>
    </g>
    <text x="110" y="212" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">太阳</text>

    <rect x="230" y="160" width="20" height="40" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M240 158 C 246 148 246 142 240 136 C 234 142 234 148 240 158 Z" fill="#fb923c"/>
    <text x="240" y="212" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">蜡烛火焰</text>

    <circle cx="432" cy="166" r="12" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <g stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
      <line x1="427" y1="178" x2="427" y2="196"/>
      <line x1="437" y1="178" x2="437" y2="196"/>
    </g>
    <text x="432" y="212" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">发光二极管</text>

    <line x1="60" y1="234" x2="500" y2="234" stroke="#e2e8f0" stroke-width="2"/>

    <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round">
      <line class="p16-ray" x1="280" y1="282" x2="92" y2="222" marker-end="url(#arrAmber)"/>
      <line class="p16-ray" x1="280" y1="282" x2="164" y2="200" marker-end="url(#arrAmber)"/>
      <line class="p16-ray" x1="280" y1="282" x2="280" y2="184" marker-end="url(#arrAmber)"/>
      <line class="p16-ray" x1="280" y1="282" x2="398" y2="200" marker-end="url(#arrAmber)"/>
      <line class="p16-ray" x1="280" y1="282" x2="470" y2="240" marker-end="url(#arrAmber)"/>
    </g>
    <text x="124" y="252" font-size="11.5" font-weight="800" fill="#b45309">光线</text>

    <rect x="262" y="300" width="36" height="90" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path class="p16-flame" d="M280 298 C 292 282 292 270 280 258 C 268 270 268 282 280 298 Z" fill="#fb923c"/>
    <path d="M280 290 C 286 281 286 273 280 266 C 274 273 274 281 280 290 Z" fill="#fde68a"/>
    <line x1="280" y1="298" x2="280" y2="306" stroke="#78716c" stroke-width="3"/>

    <text x="280" y="430" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">光线是假想的带箭头直线，用来表示光的传播路径</text>
    <text x="280" y="448" font-size="11" fill="#94a3b8" text-anchor="middle">月亮反射太阳光，本身不发光，不是光源</text>

    <!-- 右卡：激光与月亮 -->
    <rect x="540" y="70" width="320" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <circle cx="700" cy="180" r="52" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#b6c2d2">
      <circle cx="680" cy="160" r="8"/><circle cx="716" cy="172" r="6"/>
      <circle cx="694" cy="198" r="9"/><circle cx="724" cy="204" r="4"/>
      <circle cx="672" cy="186" r="5"/>
    </g>
    <g class="p16-x" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
      <line x1="668" y1="148" x2="732" y2="212"/>
      <line x1="732" y1="148" x2="668" y2="212"/>
    </g>
    <text x="700" y="256" font-size="13.5" font-weight="800" fill="#334155" text-anchor="middle">月亮</text>
    <text x="700" y="278" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">反射太阳光，不是光源</text>

    <line x1="560" y1="296" x2="840" y2="296" stroke="#e2e8f0" stroke-width="2"/>

    <rect x="600" y="320" width="200" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#cbd5e1">
      <circle cx="630" cy="342" r="2"/><circle cx="662" cy="358" r="2"/>
      <circle cx="700" cy="338" r="2"/><circle cx="744" cy="352" r="2"/>
      <circle cx="772" cy="336" r="2"/><circle cx="646" cy="380" r="2"/>
      <circle cx="716" cy="382" r="2"/><circle cx="776" cy="380" r="2"/>
    </g>
    <rect x="552" y="343" width="48" height="14" rx="5" fill="#334155"/>
    <line x1="600" y1="350" x2="782" y2="350" stroke="#16a34a" stroke-width="3" class="p16-laser" stroke-dasharray="10 8" marker-end="url(#arrGreen)"/>
    <text x="566" y="334" font-size="11" fill="#64748b" text-anchor="middle">激光</text>
    <text x="700" y="430" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">同种均匀介质中，光沿直线传播</text>
  </g>

  <!-- ===== 第 2 步：直线传播的现象 ===== -->
  <g class="p16-z2" data-zone="2">
    <!-- 影子 -->
    <rect x="40" y="78" width="270" height="340" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="175" y="106" font-size="14.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">影子</text>
    <circle cx="66" cy="160" r="9" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <line x1="75" y1="160" x2="280" y2="287"/>
      <line x1="75" y1="164" x2="280" y2="399"/>
      <line x1="66" y1="160" x2="280" y2="336" stroke-dasharray="5 5"/>
    </g>
    <circle cx="200" cy="270" r="26" fill="#64748b"/>
    <circle cx="192" cy="262" r="8" fill="#94a3b8"/>
    <rect x="280" y="170" width="14" height="245" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <rect class="p16-shadow" x="278" y="284" width="16" height="116" fill="#334155" opacity=".55"/>
    <text x="66" y="146" font-size="11" fill="#64748b" text-anchor="middle">点光源</text>
    <text x="200" y="322" font-size="11" fill="#64748b" text-anchor="middle">不透明物体</text>
    <text x="268" y="262" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">影子</text>
    <text x="175" y="400" font-size="11.5" fill="#475569" text-anchor="middle">光被挡住，屏上出现影子</text>

    <!-- 日食 -->
    <rect x="320" y="78" width="270" height="340" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="455" y="106" font-size="14.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">日食</text>
    <circle cx="365" cy="210" r="24" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
      <line x1="365" y1="180" x2="365" y2="186"/><line x1="365" y1="234" x2="365" y2="240"/>
      <line x1="335" y1="210" x2="341" y2="210"/><line x1="389" y1="210" x2="395" y2="210"/>
    </g>
    <line x1="389" y1="204" x2="520" y2="220" stroke="#fbbf24" stroke-width="2"/>
    <line x1="389" y1="216" x2="520" y2="248" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="452" cy="220" r="14" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <path class="p16-cone" d="M466 214 L522 202 L522 262 L466 226 Z" fill="#334155" opacity=".32"/>
    <circle cx="546" cy="232" r="26" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
    <text x="365" y="258" font-size="11" fill="#64748b" text-anchor="middle">太阳</text>
    <text x="452" y="258" font-size="11" fill="#64748b" text-anchor="middle">月球</text>
    <text x="546" y="284" font-size="11" fill="#64748b" text-anchor="middle">地球</text>
    <text x="455" y="340" font-size="11.5" fill="#475569" text-anchor="middle">月球挡住射向地球的太阳光</text>
    <text x="455" y="398" font-size="11.5" fill="#475569" text-anchor="middle">月食：地球挡住射向月球的光</text>

    <!-- 小孔成像 -->
    <rect x="600" y="78" width="270" height="340" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="735" y="106" font-size="14.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">小孔成像</text>
    <rect x="646" y="296" width="20" height="56" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path class="p16-flame" d="M656 294 C 664 282 664 272 656 264 C 648 272 648 282 656 294 Z" fill="#fb923c"/>
    <rect x="721" y="180" width="10" height="200" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="726" cy="300" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="798" y="168" width="12" height="220" rx="3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/>
    <g stroke="#dc2626" stroke-width="2" fill="none">
      <line x1="656" y1="268" x2="726" y2="300" marker-end="url(#arrRed)"/>
      <line x1="726" y1="300" x2="798" y2="336" marker-end="url(#arrRed)"/>
      <line x1="656" y1="350" x2="726" y2="300" stroke="#1d4ed8" marker-end="url(#arrBlue)"/>
      <line x1="726" y1="300" x2="798" y2="248" stroke="#1d4ed8" marker-end="url(#arrBlue)"/>
    </g>
    <g class="p16-img">
      <rect x="794" y="250" width="12" height="68" rx="3" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
      <path d="M800 318 C 806 326 806 332 800 338 C 794 332 794 326 800 318 Z" fill="#fb923c"/>
    </g>
    <rect x="674" y="288" width="44" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="696" y="303" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">小孔</text>
    <text x="735" y="398" font-size="11.5" fill="#475569" text-anchor="middle">倒立实像，像的形状与孔形状无关</text>
  </g>

  <!-- ===== 第 3 步：光速与光年 ===== -->
  <g class="p16-z3" data-zone="3">
    <rect x="40" y="80" width="420" height="376" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="250" y="110" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">光速：真空中的最快速度</text>

    <text class="p16-big" x="250" y="186" font-size="26" font-weight="900" fill="#1e3a8a" text-anchor="middle">3×10⁸ m/s</text>
    <text x="250" y="222" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">= 3×10⁵ km/s = 30 万千米每秒</text>

    <circle cx="106" cy="340" r="24" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="392" cy="340" r="20" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
    <line class="p16-beam" x1="132" y1="340" x2="368" y2="340" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrAmber)"/>
    <text x="250" y="316" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">日地距离 1.5 亿千米</text>
    <text x="250" y="366" font-size="11.5" fill="#64748b" text-anchor="middle">太阳光到达地球约 500 s</text>
    <text x="106" y="386" font-size="11.5" fill="#64748b" text-anchor="middle">太阳</text>
    <text x="392" y="386" font-size="11.5" fill="#64748b" text-anchor="middle">地球</text>
    <text x="250" y="424" font-size="11.5" fill="#475569" text-anchor="middle">光在空气中的速度十分接近真空中的光速</text>
    <text x="250" y="444" font-size="11" fill="#94a3b8" text-anchor="middle">光在水中、玻璃中传播得更慢</text>

    <rect x="480" y="80" width="380" height="376" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="670" y="110" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">光年：天文学中的长度单位</text>

    <g fill="#fbbf24">
      <path d="M540 140 L544 152 L556 156 L544 160 L540 172 L536 160 L524 156 L536 152 Z"/>
      <path d="M666 122 L670 134 L682 138 L670 142 L666 154 L662 142 L650 138 L662 134 Z"/>
      <path d="M786 146 L790 158 L802 162 L790 166 L786 178 L782 166 L770 162 L782 158 Z"/>
    </g>
    <line class="p16-beam" x1="510" y1="196" x2="830" y2="196" stroke="#d97706" stroke-width="3.5" stroke-dasharray="12 9" marker-end="url(#arrAmber)"/>
    <text x="670" y="228" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">1 光年 ≈ 9.46×10¹² 千米</text>
    <text x="670" y="250" font-size="11.5" fill="#64748b" text-anchor="middle">光在一年内传播的距离</text>

    <g class="p16-pill">
      <rect x="500" y="270" width="340" height="56" rx="14" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.8"/>
      <text x="670" y="294" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">光年是长度单位</text>
      <text x="670" y="314" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">不是时间单位！</text>
    </g>

    <text x="670" y="362" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">北斗七星距我们约 100 光年</text>
    <text x="670" y="386" font-size="11.5" fill="#64748b" text-anchor="middle">我们看到的，是它约 100 年前发出的光</text>
    <text x="670" y="428" font-size="11.5" fill="#475569" text-anchor="middle">光年把时间和距离联系起来：看得越远，看得越早</text>
  </g>
</svg>
