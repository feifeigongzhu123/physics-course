<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="阿基米德原理：溢水杯与小桶实验、F浮等于G排、液体密度和排开体积的影响">
<style>
.p39-s1,.p39-s2,.p39-s3{opacity:0;visibility:hidden}
.p39-s1{opacity:1;visibility:visible}
[data-scene="pj-39"] .p39-s1,[data-scene="pj-39"] .p39-s2,[data-scene="pj-39"] .p39-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-39"].s1 .p39-s1,[data-scene="pj-39"].s2 .p39-s2,[data-scene="pj-39"].s3 .p39-s3{opacity:1;visibility:visible}
@keyframes p39drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes p39rise{0%{transform:translateY(6px) scale(.7);opacity:0}25%{opacity:.9}100%{transform:translateY(-56px) scale(1.1);opacity:0}}
@keyframes p39pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes p39pop{0%{transform:scale(.74);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p39flow{to{stroke-dashoffset:-36}}
[data-scene="pj-39"].s1 .p39-drop,[data-scene="pj-39"].s3 .p39-drop{animation:p39drop 1.7s linear infinite}
[data-scene="pj-39"].s1 .p39-bub,[data-scene="pj-39"].s3 .p39-bub{animation:p39rise 2.3s ease-in infinite}
[data-scene="pj-39"].s1 .p39-arrow{animation:p39pulse 1.6s ease-in-out infinite}
[data-scene="pj-39"].s1 .p39-pop,[data-scene="pj-39"].s2 .p39-pop{transform-box:fill-box;transform-origin:center;animation:p39pop .5s ease both}
[data-scene="pj-39"].s2 .p39-pop:nth-of-type(2){animation-delay:.12s}
[data-scene="pj-39"].s2 .p39-arrow2{animation:p39pulse 1.7s ease-in-out infinite}
[data-scene="pj-39"].s3 .p39-dash{stroke-dasharray:7 6;animation:p39flow 1.4s linear infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">阿基米德原理：浮力等于排开液体所受的重力</text>

<!-- 第一步：原理与溢水杯、小桶 -->
<g class="p39-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">溢水杯 + 小桶：物体排开多少水，小桶就接住多少水</text>

  <!-- 弹簧测力计 -->
  <rect x="150" y="104" width="96" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="198" y="120" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">弹簧测力计</text>
  <text x="198" y="138" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">3.2 N</text>
  <line x1="198" y1="146" x2="198" y2="246" stroke="#475569" stroke-width="2"/>

  <!-- 溢水杯 -->
  <path d="M100 180 L100 356 Q100 380 124 380 L296 380 Q320 380 320 356 L320 180 Z" fill="#f8fbff" stroke="#64748b" stroke-width="3"/>
  <path d="M104 232 H316 V352 Q316 376 292 376 H128 Q104 376 104 352 Z" fill="#dbeafe" opacity=".9"/>
  <line x1="104" y1="232" x2="316" y2="232" stroke="#60a5fa" stroke-width="2"/>
  <path d="M316 208 H344 L362 224 V234 L344 226 H316 Z" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
  <text x="338" y="202" font-size="11" font-weight="700" fill="#0369a1">溢水口</text>

  <!-- 物体 -->
  <rect x="166" y="246" width="64" height="50" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="198" y="277" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">物体</text>
  <line x1="198" y1="180" x2="198" y2="250" stroke="#475569" stroke-width="2" opacity=".65"/>

  <!-- 水滴 -->
  <circle class="p39-drop" cx="356" cy="242" r="4" fill="#60a5fa"/>
  <circle class="p39-drop" cx="356" cy="242" r="4" fill="#60a5fa" style="animation-delay:.55s"/>
  <circle class="p39-drop" cx="356" cy="242" r="4" fill="#60a5fa" style="animation-delay:1.1s"/>

  <!-- 小桶 -->
  <path d="M330 300 H418 L410 368 H338 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <path d="M336 330 H412 L407 364 H341 Z" fill="#bfdbfe"/>
  <path d="M338 300 Q374 270 414 300" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="374" y="388" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">小桶</text>

  <!-- 气泡 -->
  <circle class="p39-bub" cx="276" cy="340" r="3.4" fill="#93c5fd" opacity=".8"/>
  <circle class="p39-bub" cx="292" cy="336" r="2.6" fill="#93c5fd" opacity=".8" style="animation-delay:.7s"/>

  <!-- 力的箭头 -->
  <line class="p39-arrow" x1="176" y1="292" x2="176" y2="232" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <text x="188" y="240" font-size="13" font-weight="800" fill="#1e40af">F浮</text>
  <line class="p39-arrow" x1="220" y1="266" x2="220" y2="326" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="232" y="322" font-size="13" font-weight="800" fill="#b91c1c">G</text>

  <text x="210" y="404" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">溢水杯</text>

  <!-- 原理面板 -->
  <g class="p39-pop">
    <rect x="470" y="104" width="380" height="306" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="490" y="120" width="150" height="28" rx="14" fill="#e8effc"/>
    <text x="565" y="139" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">阿基米德原理</text>
    <text x="490" y="176" font-size="13.5" fill="#334155">浸在液体中的物体，受到</text>
    <text x="490" y="200" font-size="13.5" fill="#334155">液体竖直向上的浮力，</text>
    <text x="490" y="224" font-size="13.5" fill="#334155">浮力的大小等于</text>
    <text x="490" y="248" font-size="14" font-weight="800" fill="#1e3a8a">它排开液体所受的重力。</text>
    <rect x="490" y="264" width="340" height="58" rx="12" fill="#e8effc"/>
    <text x="660" y="302" font-size="26" font-weight="900" fill="#1e3a8a" text-anchor="middle">F浮 = G排</text>
    <text x="660" y="344" font-size="12.5" font-weight="700" fill="#1e40af" text-anchor="middle">G排 = m排g = ρ液 g V排</text>
    <text x="660" y="372" font-size="12" fill="#64748b" text-anchor="middle">阿基米德原理同样适用于气体</text>
    <text x="660" y="394" font-size="11.5" fill="#64748b" text-anchor="middle">浮力的施力物体：液体或气体</text>
  </g>
</g>

<!-- 第二步：公式与影响因素 -->
<g class="p39-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">浮力公式：只由液体密度和排开液体的体积决定</text>
  <text x="450" y="124" font-size="26" font-weight="900" fill="#1e3a8a" text-anchor="middle">F浮 = ρ液 · g · V排</text>

  <!-- 液体密度 -->
  <g class="p39-pop">
    <rect x="50" y="146" width="390" height="256" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="66" y="162" width="150" height="28" rx="14" fill="#e8effc"/>
    <text x="141" y="181" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">液体密度 ρ液</text>

    <!-- 盐水 -->
    <rect x="86" y="214" width="84" height="108" rx="5" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
    <rect x="89" y="238" width="78" height="80" fill="#93c5fd" opacity=".55"/>
    <line x1="89" y1="238" x2="167" y2="238" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="114" y="262" width="28" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="128" y1="258" x2="128" y2="210" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)" class="p39-arrow2"/>
    <text x="128" y="342" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">盐水</text>

    <!-- 水 -->
    <rect x="204" y="214" width="84" height="108" rx="5" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
    <rect x="207" y="238" width="78" height="80" fill="#dbeafe" opacity=".9"/>
    <line x1="207" y1="238" x2="285" y2="238" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="232" y="262" width="28" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="246" y1="258" x2="246" y2="222" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)" class="p39-arrow2"/>
    <text x="246" y="342" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">水</text>

    <!-- 酒精 -->
    <rect x="322" y="214" width="84" height="108" rx="5" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
    <rect x="325" y="238" width="78" height="80" fill="#dbeafe" opacity=".55"/>
    <line x1="325" y1="238" x2="403" y2="238" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="350" y="262" width="28" height="28" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="364" y1="258" x2="364" y2="236" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)" class="p39-arrow2"/>
    <text x="364" y="342" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">酒精</text>

    <text x="245" y="368" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">同一物体、V排 相同 → ρ液 越大，F浮 越大</text>
    <text x="245" y="390" font-size="11" fill="#64748b" text-anchor="middle">ρ盐水 &gt; ρ水 &gt; ρ酒精，浮力箭头依次变短</text>
  </g>

  <!-- 排开体积 -->
  <g class="p39-pop">
    <rect x="460" y="146" width="390" height="256" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="476" y="162" width="150" height="28" rx="14" fill="#e8effc"/>
    <text x="551" y="181" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">排开体积 V排</text>

    <!-- 部分浸入 -->
    <rect x="496" y="210" width="96" height="120" rx="5" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
    <rect x="499" y="238" width="90" height="89" fill="#dbeafe"/>
    <line x1="499" y1="238" x2="589" y2="238" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="530" y="224" width="28" height="42" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="544" y1="220" x2="544" y2="196" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)" class="p39-arrow2"/>
    <text x="544" y="350" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">部分浸入</text>
    <text x="544" y="368" font-size="11" fill="#64748b" text-anchor="middle">V排 小</text>

    <!-- 浸没 -->
    <rect x="640" y="210" width="96" height="120" rx="5" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>
    <rect x="643" y="222" width="90" height="105" fill="#dbeafe"/>
    <line x1="643" y1="222" x2="733" y2="222" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="674" y="246" width="28" height="42" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <line x1="688" y1="242" x2="688" y2="180" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrBlue)" class="p39-arrow2"/>
    <text x="688" y="350" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">浸没</text>
    <text x="688" y="368" font-size="11" fill="#64748b" text-anchor="middle">V排 大</text>

    <text x="655" y="390" font-size="11" fill="#64748b" text-anchor="middle">V排 = 物体浸入液体中的体积，浸没时 V排 = V物</text>
  </g>
</g>

<!-- 第三步：实验验证 -->
<g class="p39-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">实验验证：分别测出 F浮 与 G排，再比较大小</text>

  <!-- 实验装置 -->
  <rect x="170" y="100" width="100" height="42" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="220" y="116" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">弹簧测力计</text>
  <text x="220" y="134" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">F拉 = 3.2 N</text>
  <line x1="220" y1="142" x2="220" y2="240" stroke="#475569" stroke-width="2"/>

  <path d="M120 176 L120 352 Q120 376 144 376 L300 376 Q324 376 324 352 L324 176 Z" fill="#f8fbff" stroke="#64748b" stroke-width="3"/>
  <path d="M124 236 H320 V348 Q320 372 296 372 H148 Q124 372 124 348 Z" fill="#dbeafe" opacity=".9"/>
  <line x1="124" y1="236" x2="320" y2="236" stroke="#60a5fa" stroke-width="2"/>
  <path d="M320 212 H348 L366 228 V238 L348 230 H320 Z" fill="#f8fbff" stroke="#64748b" stroke-width="2"/>

  <rect x="196" y="240" width="48" height="44" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <text x="220" y="267" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">物体</text>
  <line x1="220" y1="176" x2="220" y2="244" stroke="#475569" stroke-width="2" opacity=".65"/>

  <circle class="p39-drop" cx="360" cy="246" r="4" fill="#60a5fa"/>
  <circle class="p39-drop" cx="360" cy="246" r="4" fill="#60a5fa" style="animation-delay:.55s"/>
  <circle class="p39-drop" cx="360" cy="246" r="4" fill="#60a5fa" style="animation-delay:1.1s"/>

  <path d="M332 302 H416 L408 368 H340 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <path d="M338 332 H410 L405 364 H343 Z" fill="#bfdbfe"/>
  <path d="M340 302 Q374 272 412 302" fill="none" stroke="#475569" stroke-width="2"/>

  <circle class="p39-bub" cx="280" cy="338" r="3.2" fill="#93c5fd" opacity=".8"/>
  <circle class="p39-bub" cx="296" cy="334" r="2.6" fill="#93c5fd" opacity=".8" style="animation-delay:.8s"/>

  <text x="222" y="398" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">溢水杯</text>
  <text x="374" y="386" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">小桶</text>

  <!-- 四步数据 -->
  <g class="p39-pop">
    <rect x="460" y="100" width="390" height="312" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="116" width="150" height="28" rx="14" fill="#e8effc"/>
    <text x="555" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">四步测一测</text>

    <text x="484" y="166" font-size="12.5" font-weight="700" fill="#334155">① 测物体重力 G = 4.4 N</text>
    <text x="484" y="202" font-size="12.5" font-weight="700" fill="#334155">② 测空桶重力 G桶 = 1.2 N</text>
    <text x="484" y="238" font-size="12.5" font-weight="700" fill="#334155">③ 浸没时测拉力 F拉 = 3.2 N</text>
    <text x="484" y="274" font-size="12.5" font-weight="700" fill="#334155">④ 测桶和水总重 G总 = 2.4 N</text>

    <line x1="480" y1="292" x2="830" y2="292" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="484" y="318" font-size="12.5" font-weight="800" fill="#1e40af">F浮 = G − F拉 = 4.4 − 3.2 = 1.2 N</text>
    <text x="484" y="344" font-size="12.5" font-weight="800" fill="#047857">G排 = G总 − G桶 = 2.4 − 1.2 = 1.2 N</text>
    <rect x="480" y="358" width="350" height="38" rx="10" fill="#e8effc"/>
    <text x="655" y="384" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">F浮 = G排 = 1.2 N</text>
  </g>

  <rect x="60" y="420" width="780" height="36" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="444" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">换用不同物体、不同液体重复实验，F浮 总等于 G排</text>
</g>
</svg>
