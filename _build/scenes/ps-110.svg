<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="液体：表面张力、浸润与不浸润、毛细现象">
<style>
[data-scene="ps-110"] .s110-s1,[data-scene="ps-110"] .s110-s2,[data-scene="ps-110"] .s110-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-110"].s1 .s110-s1,[data-scene="ps-110"].s2 .s110-s2,[data-scene="ps-110"].s3 .s110-s3{opacity:1;visibility:visible}
@keyframes s110fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s110draw{to{stroke-dashoffset:0}}
@keyframes s110pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s110pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s110shrink{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
[data-scene="ps-110"].s1 .s110-layer{animation:s110pulse 2.2s ease-in-out infinite}
[data-scene="ps-110"].s1 .s110-drop{transform-box:fill-box;transform-origin:center;animation:s110shrink 2.6s ease-in-out infinite}
[data-scene="ps-110"].s1 .s110-g1{animation:s110fade .5s ease .12s both}
[data-scene="ps-110"].s1 .s110-card{animation:s110fade .5s ease .3s both}
[data-scene="ps-110"].s2 .s110-beaker{animation:s110fade .5s ease .12s both}
[data-scene="ps-110"].s2 .s110-beaker2{animation-delay:.3s}
[data-scene="ps-110"].s2 .s110-card{animation:s110fade .5s ease .3s both}
[data-scene="ps-110"].s3 .s110-tube{animation:s110fade .5s ease .12s both}
[data-scene="ps-110"].s3 .s110-tube2{animation-delay:.24s}
[data-scene="ps-110"].s3 .s110-tube3{animation-delay:.36s}
[data-scene="ps-110"].s3 .s110-h{stroke-dasharray:200;stroke-dashoffset:200;animation:s110draw 1s ease .6s forwards}
[data-scene="ps-110"].s3 .s110-card{animation:s110fade .5s ease .3s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">液体：表面张力、浸润与毛细现象</text>

<!-- 第一步：表面张力 -->
<g class="s110-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">液体表面层分子间距较大，分子间表现为引力</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="s110-g1">
    <line x1="70" y1="250" x2="70" y2="405" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="300" y1="250" x2="300" y2="405" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="70" y1="405" x2="300" y2="405" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="60" y1="250" x2="80" y2="250" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="290" y1="250" x2="310" y2="250" stroke="#94a3b8" stroke-width="2.6"/>
    <rect x="74" y="272" width="222" height="129" fill="#dbeafe"/>
    <rect class="s110-layer" x="74" y="272" width="222" height="22" fill="#93c5fd"/>
    <line x1="74" y1="272" x2="296" y2="272" stroke="#1d4ed8" stroke-width="2.6"/>

    <circle cx="95" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="125" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="155" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="185" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="215" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="245" cy="283" r="4" fill="#1d4ed8"/>
    <circle cx="275" cy="283" r="4" fill="#1d4ed8"/>

    <circle cx="100" cy="318" r="4" fill="#60a5fa"/>
    <circle cx="132" cy="338" r="4" fill="#60a5fa"/>
    <circle cx="160" cy="312" r="4" fill="#60a5fa"/>
    <circle cx="192" cy="342" r="4" fill="#60a5fa"/>
    <circle cx="222" cy="320" r="4" fill="#60a5fa"/>
    <circle cx="252" cy="350" r="4" fill="#60a5fa"/>
    <circle cx="276" cy="326" r="4" fill="#60a5fa"/>
    <circle cx="116" cy="368" r="4" fill="#60a5fa"/>
    <circle cx="150" cy="378" r="4" fill="#60a5fa"/>
    <circle cx="186" cy="362" r="4" fill="#60a5fa"/>
    <circle cx="226" cy="382" r="4" fill="#60a5fa"/>
    <circle cx="262" cy="372" r="4" fill="#60a5fa"/>

    <line x1="110" y1="300" x2="110" y2="316" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="170" y1="300" x2="170" y2="316" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="230" y1="300" x2="230" y2="316" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="187" y="263" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">表面层</text>
    <text x="248" y="312" font-size="11" font-weight="800" fill="#b91c1c">分子引力</text>
  </g>

  <g class="s110-drop">
    <circle cx="410" cy="232" r="44" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <line x1="474" y1="232" x2="462" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="454" y1="188" x2="445" y2="197" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="410" y1="168" x2="410" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="366" y1="188" x2="375" y2="197" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="346" y1="232" x2="358" y2="232" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="366" y1="276" x2="375" y2="267" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="410" y1="296" x2="410" y2="284" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="454" y1="276" x2="445" y2="267" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="410" y="320" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">液滴收缩成球形</text>
  </g>

  <line x1="330" y1="350" x2="490" y2="350" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="410" y="372" font-size="11" fill="#475569" text-anchor="middle">硬币、钢针可以浮在水面</text>

  <text x="60" y="404" font-size="11.5" font-weight="700" fill="#334155">表面张力沿液面切线，使液面像绷紧的橡皮膜</text>
  <text x="60" y="428" font-size="11.5" fill="#64748b">相同体积下，球形表面积最小，所以液滴呈球形</text>

  <g class="s110-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">表面张力</text>

    <text x="610" y="170" font-size="12" font-weight="900" fill="#1e3a8a">产生原因</text>
    <text x="610" y="194" font-size="11.5" fill="#334155">表面层分子间距大于平衡距离</text>
    <text x="610" y="218" font-size="11.5" fill="#334155">分子间作用表现为引力</text>

    <rect x="596" y="234" width="248" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="258" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">表面张力沿液面切线</text>
    <text x="720" y="280" font-size="11" fill="#475569" text-anchor="middle">方向使液面收缩</text>

    <text x="610" y="318" font-size="12" font-weight="900" fill="#1e3a8a">效果</text>
    <text x="610" y="342" font-size="11.5" fill="#334155">液面像绷紧的橡皮膜</text>
    <text x="610" y="366" font-size="11.5" fill="#334155">小液滴尽量收缩成球形</text>

    <rect x="596" y="382" width="248" height="42" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="408" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">露珠 · 肥皂泡 · 水黾 · 硬币浮水</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">表面张力沿液面切线方向，使液面收缩，小液滴趋于球形</text>
</g>

<!-- 第二步：浸润和不浸润 -->
<g class="s110-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">附着层分子力决定浸润与否，液面呈凹形或凸形</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">液体与玻璃接触时的液面</text>

  <text x="175" y="166" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">水 + 玻璃：浸润</text>
  <text x="415" y="166" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">水银 + 玻璃：不浸润</text>

  <g class="s110-beaker">
    <line x1="80" y1="190" x2="80" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="270" y1="190" x2="270" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="80" y1="380" x2="270" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <path d="M 84 244 C 108 262 140 268 175 268 C 210 268 242 262 266 244 L 266 376 L 84 376 Z" fill="#bfdbfe"/>
    <path d="M 84 244 C 108 262 140 268 175 268 C 210 268 242 262 266 244" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
    <text x="175" y="340" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">凹液面</text>
  </g>

  <g class="s110-beaker s110-beaker2">
    <line x1="320" y1="190" x2="320" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="510" y1="190" x2="510" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <line x1="320" y1="380" x2="510" y2="380" stroke="#94a3b8" stroke-width="2.6"/>
    <path d="M 324 292 C 348 272 380 266 415 266 C 450 266 482 272 506 292 L 506 376 L 324 376 Z" fill="#cbd5e1"/>
    <path d="M 324 292 C 348 272 380 266 415 266 C 450 266 482 272 506 292" fill="none" stroke="#64748b" stroke-width="2.6"/>
    <text x="415" y="340" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">凸液面</text>
  </g>

  <text x="175" y="404" font-size="11" fill="#334155" text-anchor="middle">附着层扩展，液面沿器壁上升</text>
  <text x="415" y="404" font-size="11" fill="#334155" text-anchor="middle">附着层收缩，液面沿器壁下降</text>
  <text x="290" y="428" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">水浸润玻璃但不浸润蜡，水银不浸润玻璃</text>

  <g class="s110-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">浸润与不浸润</text>

    <text x="610" y="170" font-size="11.5" fill="#334155">附着层：液体与固体接触的薄层</text>

    <rect x="596" y="186" width="248" height="76" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="610" y="210" font-size="12" font-weight="900" fill="#047857">附着层分子引力占优</text>
    <text x="610" y="234" font-size="11" fill="#065f46">液体沿固体表面展开 → 浸润</text>
    <text x="610" y="254" font-size="11" fill="#065f46">液面呈凹形，接触角较小</text>

    <rect x="596" y="274" width="248" height="76" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="610" y="298" font-size="12" font-weight="900" fill="#b45309">液体内部引力占优</text>
    <text x="610" y="322" font-size="11" fill="#92400e">附着层收缩 → 不浸润</text>
    <text x="610" y="342" font-size="11" fill="#92400e">液面呈凸形，接触角较大</text>

    <text x="610" y="374" font-size="11.5" fill="#334155">水浸润玻璃，不浸润蜡</text>
    <text x="610" y="398" font-size="11.5" fill="#334155">水银不浸润玻璃</text>
    <text x="610" y="422" font-size="11" fill="#64748b">应用：防水布料、农药润湿剂</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">浸润液体液面呈凹形，不浸润液体液面呈凸形，由附着层分子力决定</text>
</g>

<!-- 第三步：毛细现象 -->
<g class="s110-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">浸润液体在细管中上升，不浸润液体在细管中下降</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不同粗细的细管插入液体</text>

  <rect x="60" y="330" width="440" height="78" rx="10" fill="#e8f2ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="64" y="350" width="432" height="54" fill="#bfdbfe"/>
  <line x1="64" y1="350" x2="496" y2="350" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="60" y1="350" x2="500" y2="350" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.6"/>

  <g class="s110-tube">
    <line x1="132" y1="170" x2="132" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="150" y1="170" x2="150" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <path d="M 134 200 Q 141 214 148 200 L 148 400 L 134 400 Z" fill="#93c5fd"/>
    <path d="M 134 200 Q 141 214 148 200" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="141" y="160" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">细管</text>
  </g>

  <g class="s110-tube s110-tube2">
    <line x1="212" y1="170" x2="212" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="242" y1="170" x2="242" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <path d="M 214 258 Q 227 272 240 258 L 240 400 L 214 400 Z" fill="#93c5fd"/>
    <path d="M 214 258 Q 227 272 240 258" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <text x="227" y="160" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">粗管</text>
  </g>

  <g class="s110-tube s110-tube3">
    <line x1="360" y1="170" x2="360" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="380" y1="170" x2="380" y2="400" stroke="#94a3b8" stroke-width="2.2"/>
    <path d="M 362 366 Q 370 352 378 366 L 378 400 L 362 400 Z" fill="#cbd5e1"/>
    <path d="M 362 366 Q 370 352 378 366" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="370" y="160" font-size="11" font-weight="800" fill="#334155" text-anchor="middle">水银管</text>
  </g>

  <line class="s110-h" x1="118" y1="200" x2="118" y2="350" stroke="#059669" stroke-width="2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="110" y="278" font-size="11" font-weight="900" fill="#047857" text-anchor="end">h₁</text>
  <line class="s110-h" x1="202" y1="258" x2="202" y2="350" stroke="#059669" stroke-width="2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="196" y="308" font-size="11" font-weight="900" fill="#047857" text-anchor="end">h₂</text>
  <text x="398" y="366" font-size="11" font-weight="800" fill="#b91c1c">下降</text>

  <text x="60" y="426" font-size="11.5" font-weight="800" fill="#334155">管越细，浸润液体上升越高；不浸润液体则下降</text>

  <g class="s110-card">
    <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
    <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">毛细现象</text>

    <text x="610" y="170" font-size="11.5" fill="#334155">浸润液体在细管中上升</text>
    <text x="610" y="194" font-size="11.5" fill="#334155">不浸润液体在细管中下降</text>

    <text x="610" y="224" font-size="12" font-weight="900" fill="#1e3a8a">产生原因</text>
    <text x="610" y="248" font-size="11.5" fill="#334155">表面张力与附着层共同作用</text>
    <text x="610" y="272" font-size="11.5" fill="#334155">管越细，液柱越高（h 越大）</text>

    <text x="610" y="302" font-size="12" font-weight="900" fill="#1e3a8a">生活中的毛细现象</text>
    <text x="610" y="326" font-size="11.5" fill="#334155">毛巾吸汗、粉笔吸墨水</text>
    <text x="610" y="350" font-size="11.5" fill="#334155">土壤保水、植物茎输水</text>

    <rect x="596" y="366" width="248" height="56" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="720" y="390" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">水银在细玻璃管中下降</text>
    <text x="720" y="410" font-size="11" fill="#92400e" text-anchor="middle">液面呈凸形，h 为负</text>
  </g>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">毛细现象：浸润液体上升、不浸润液体下降，管越细效果越明显</text>
</g>
</svg>
