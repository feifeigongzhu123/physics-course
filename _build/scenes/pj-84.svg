<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="太阳能：太阳内部的核聚变、集热与光伏利用、太阳能的优缺点">
<style>
.p84-s1,.p84-s2,.p84-s3{opacity:0;visibility:hidden}
.p84-s1{opacity:1;visibility:visible}
[data-scene="pj-84"] .p84-s1,[data-scene="pj-84"] .p84-s2,[data-scene="pj-84"] .p84-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-84"].s1 .p84-s1,[data-scene="pj-84"].s2 .p84-s2,[data-scene="pj-84"].s3 .p84-s3{opacity:1;visibility:visible}
@keyframes p84pop{0%{transform:scale(.84);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes p84flow{to{stroke-dashoffset:-40}}
@keyframes p84pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes p84spin{to{transform:rotate(360deg)}}
[data-scene="pj-84"].s1 .p84-ray{stroke-dasharray:7 6;animation:p84flow 1.1s linear infinite}
[data-scene="pj-84"].s1 .p84-sun{animation:p84pulse 2.2s ease-in-out infinite}
[data-scene="pj-84"].s1 .p84-card{transform-box:fill-box;transform-origin:center;animation:p84pop .55s ease both}
[data-scene="pj-84"].s2 .p84-water{stroke-dasharray:8 6;animation:p84flow 1.3s linear infinite}
[data-scene="pj-84"].s2 .p84-light{stroke-dasharray:6 6;animation:p84flow .9s linear infinite}
[data-scene="pj-84"].s2 .p84-bulb{animation:p84pulse 1.6s ease-in-out infinite}
[data-scene="pj-84"].s3 .p84-good{transform-box:fill-box;transform-origin:left center;animation:p84pop .5s ease both}
[data-scene="pj-84"].s3 .p84-bad{transform-box:fill-box;transform-origin:left center;animation:p84pop .5s ease .2s both}
[data-scene="pj-84"].s3 .p84-icon{animation:p84pulse 2s ease-in-out infinite}
</style>
<defs>
  <radialGradient id="p84sun" cx=".4" cy=".35" r=".75">
    <stop offset="0" stop-color="#fef08a"/><stop offset=".6" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
  </radialGradient>
</defs>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">太阳能：来自太阳的馈赠</text>

<!-- 第一步：太阳内部的核聚变 -->
<g class="p84-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">太阳内部发生核聚变，释放巨大能量，是地球上许多能量的来源</text>

  <g class="p84-sun">
    <circle cx="250" cy="278" r="118" fill="url(#p84sun)" stroke="#f97316" stroke-width="3"/>
    <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
      <line x1="250" y1="128" x2="250" y2="146"/><line x1="250" y1="410" x2="250" y2="428"/>
      <line x1="100" y1="278" x2="118" y2="278"/><line x1="382" y1="278" x2="400" y2="278"/>
      <line x1="144" y1="172" x2="157" y2="185"/><line x1="343" y1="371" x2="356" y2="384"/>
      <line x1="144" y1="384" x2="157" y2="371"/><line x1="343" y1="185" x2="356" y2="172"/>
    </g>
    <circle cx="250" cy="278" r="34" fill="#fff7ed" opacity=".9"/>
    <text x="250" y="283" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">核聚变</text>
  </g>
  <text x="250" y="438" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">太阳</text>

  <g class="p84-card">
    <rect x="420" y="150" width="286" height="122" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="563" y="178" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">太阳内部的核聚变</text>
    <g font-size="13" font-weight="800" fill="#92400e" text-anchor="middle">
      <text x="563" y="210">4 个氢核 → 1 个氦核 + 能量</text>
    </g>
    <text x="563" y="236" font-size="11.5" fill="#475569" text-anchor="middle">氢核聚变成氦核，质量亏损转化为能量</text>
    <text x="563" y="258" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">太阳每时每刻都在释放巨大能量</text>
  </g>

  <g class="p84-ray" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)">
    <line x1="382" y1="300" x2="656" y2="318"/>
    <line x1="382" y1="330" x2="650" y2="342"/>
    <line x1="382" y1="360" x2="644" y2="366"/>
  </g>
  <text x="520" y="294" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">太阳辐射</text>

  <circle cx="750" cy="370" r="66" fill="#bfdbfe" stroke="#60a5fa" stroke-width="3"/>
  <path d="M706 338 Q736 322 758 338 Q744 356 718 354 Z" fill="#86efac"/>
  <path d="M756 364 Q786 346 806 366 Q790 390 764 386 Z" fill="#86efac"/>
  <text x="750" y="448" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">地球</text>

  <text x="450" y="462" font-size="12" fill="#64748b" text-anchor="middle">煤、石油、风能、水能，从根本上说大多来自太阳能</text>
</g>

<!-- 第二步：集热与光伏 -->
<g class="p84-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">太阳能可以直接转化为内能，也可以转化为电能</text>

  <rect x="34" y="104" width="400" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="54" y="120" width="242" height="28" rx="14" fill="#fff7ed"/>
  <text x="175" y="139" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">太阳能集热：光能 → 内能</text>

  <circle cx="84" cy="176" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
    <line x1="84" y1="142" x2="84" y2="150"/><line x1="84" y1="202" x2="84" y2="210"/>
    <line x1="50" y1="176" x2="58" y2="176"/><line x1="110" y1="176" x2="118" y2="176"/>
    <line x1="60" y1="152" x2="66" y2="158"/><line x1="102" y1="194" x2="108" y2="200"/>
  </g>

  <polygon points="150,326 332,282 352,312 170,356" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <g stroke="#dbeafe" stroke-width="1.4">
    <line x1="165" y1="328" x2="339" y2="288"/><line x1="179" y1="336" x2="345" y2="298"/>
    <line x1="193" y1="344" x2="351" y2="308"/><line x1="207" y1="351" x2="357" y2="318"/>
  </g>
  <rect x="284" y="246" width="92" height="28" rx="14" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="376" cy="260" rx="8" ry="14" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <line x1="318" y1="274" x2="318" y2="292" stroke="#64748b" stroke-width="3"/>
  <line x1="350" y1="268" x2="350" y2="282" stroke="#64748b" stroke-width="3"/>
  <line x1="380" y1="330" x2="380" y2="370" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="384" cy="382" r="4" fill="#60a5fa"/>
  <text x="330" y="238" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">水箱</text>
  <text x="220" y="386" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">集热板</text>
  <text x="200" y="416" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">太阳照射，水变热</text>

  <rect x="470" y="104" width="396" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="490" y="120" width="242" height="28" rx="14" fill="#eef6ff"/>
  <text x="611" y="139" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光伏发电：光能 → 电能</text>

  <circle cx="516" cy="178" r="24" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round">
    <line x1="516" y1="144" x2="516" y2="152"/><line x1="516" y1="204" x2="516" y2="212"/>
    <line x1="482" y1="178" x2="490" y2="178"/><line x1="542" y1="178" x2="550" y2="178"/>
  </g>

  <polygon points="560,292 746,246 776,284 590,330" fill="#1e40af" stroke="#1e3a8a" stroke-width="2"/>
  <g stroke="#93c5fd" stroke-width="1.2">
    <line x1="575" y1="290" x2="753" y2="248"/><line x1="591" y1="300" x2="760" y2="260"/>
    <line x1="607" y1="309" x2="766" y2="272"/><line x1="623" y1="318" x2="772" y2="284"/>
    <line x1="577" y1="266" x2="608" y2="322"/><line x1="618" y1="256" x2="648" y2="312"/>
    <line x1="659" y1="246" x2="688" y2="302"/><line x1="700" y1="236" x2="728" y2="292"/>
  </g>
  <g class="p84-light" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrAmber)">
    <line x1="540" y1="200" x2="606" y2="258"/>
    <line x1="560" y1="188" x2="640" y2="246"/>
  </g>
  <text x="666" y="226" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">太阳能电池板</text>

  <rect x="568" y="354" width="92" height="42" rx="8" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="614" y="371" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">逆变器</text>
  <text x="614" y="387" font-size="11" fill="#475569" text-anchor="middle">直流变交流</text>
  <line x1="650" y1="324" x2="650" y2="352" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="662" y1="375" x2="700" y2="375" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <g class="p84-bulb">
    <circle cx="726" cy="375" r="16" fill="#fde047" stroke="#d97706" stroke-width="2"/>
    <path d="M720 390 L720 400 L732 400 L732 390" fill="#64748b"/>
    <g stroke="#f59e0b" stroke-width="2">
      <line x1="726" y1="350" x2="726" y2="342"/><line x1="705" y1="360" x2="699" y2="354"/>
      <line x1="747" y1="360" x2="753" y2="354"/>
    </g>
  </g>
  <text x="614" y="416" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">太阳能电池把光能直接变成电能</text>

  <text x="450" y="454" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">集热和光伏是太阳能利用的两种主要方式</text>
</g>

<!-- 第三步：太阳能的优缺点 -->
<g class="p84-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">太阳能取之不尽、清洁无污染，但也受天气和昼夜影响</text>

  <g class="p84-good">
    <rect x="50" y="120" width="380" height="278" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="136" width="120" height="30" rx="15" fill="#dcfce7"/>
    <text x="130" y="156" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">优点</text>

    <circle class="p84-icon" cx="92" cy="200" r="12" fill="#22c55e"/>
    <text x="92" y="205" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">∞</text>
    <text x="118" y="196" font-size="13" font-weight="800" fill="#065f46">取之不尽，用之不竭</text>
    <text x="118" y="216" font-size="11.5" fill="#047857">太阳还能稳定发光发热几十亿年</text>

    <circle class="p84-icon" cx="92" cy="258" r="12" fill="#22c55e"/>
    <path d="M86 262 Q92 252 98 262" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="118" y="254" font-size="13" font-weight="800" fill="#065f46">清洁，几乎无污染</text>
    <text x="118" y="274" font-size="11.5" fill="#047857">利用过程不排放废气和粉尘</text>

    <circle class="p84-icon" cx="92" cy="316" r="12" fill="#22c55e"/>
    <text x="92" y="321" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">广</text>
    <text x="118" y="312" font-size="13" font-weight="800" fill="#065f46">分布广，可就地利用</text>
    <text x="118" y="332" font-size="11.5" fill="#047857">屋顶、荒漠、海岛都能安装</text>
  </g>

  <g class="p84-bad">
    <rect x="470" y="120" width="380" height="278" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="490" y="136" width="120" height="30" rx="15" fill="#fef3c7"/>
    <text x="550" y="156" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">缺点</text>

    <circle class="p84-icon" cx="512" cy="200" r="12" fill="#f59e0b"/>
    <path d="M507 197 Q512 190 517 197 Q515 204 512 207 Q509 204 507 197 Z" fill="#ffffff"/>
    <text x="538" y="196" font-size="13" font-weight="800" fill="#92400e">受天气、昼夜影响</text>
    <text x="538" y="216" font-size="11.5" fill="#7c5a30">阴雨天和夜晚发电能力下降</text>

    <circle class="p84-icon" cx="512" cy="258" r="12" fill="#f59e0b"/>
    <g fill="#ffffff">
      <circle cx="507" cy="256" r="2"/><circle cx="512" cy="260" r="2"/><circle cx="517" cy="255" r="2"/>
    </g>
    <text x="538" y="254" font-size="13" font-weight="800" fill="#92400e">能量比较分散</text>
    <text x="538" y="274" font-size="11.5" fill="#7c5a30">需要较大面积才能收集足够能量</text>

    <circle class="p84-icon" cx="512" cy="316" r="12" fill="#f59e0b"/>
    <text x="512" y="321" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">￥</text>
    <text x="538" y="312" font-size="13" font-weight="800" fill="#92400e">储能和成本仍是挑战</text>
    <text x="538" y="332" font-size="11.5" fill="#7c5a30">夜间和阴天要靠储能设备供电</text>
  </g>

  <text x="450" y="438" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">因地制宜，让太阳能与其他能源互补，才能稳定可靠</text>
</g>
</svg>
