<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="动能和动能定理：动能表达式、合外力做功与动能变化、曲线和变力都适用">
<style>
[data-scene="ps-37"] .s37-step1,[data-scene="ps-37"] .s37-step2,[data-scene="ps-37"] .s37-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-37"].s1 .s37-step1,[data-scene="ps-37"].s2 .s37-step2,[data-scene="ps-37"].s3 .s37-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s37draw{to{stroke-dashoffset:0}}
@keyframes s37pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s37glide{0%{transform:translateX(-44px)}100%{transform:translateX(0)}}
@keyframes s37pulse{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="ps-37"].s1 .s37-arrow{stroke-dasharray:150;stroke-dashoffset:150;animation:s37draw .9s ease .15s forwards}
[data-scene="ps-37"].s1 .s37-card{transform-box:fill-box;transform-origin:center;animation:s37pop .5s ease .2s both}
[data-scene="ps-37"].s1 .s37-glow{animation:s37pulse 1.8s ease-in-out infinite}
[data-scene="ps-37"].s2 .s37-move{transform-box:fill-box;transform-origin:center;animation:s37glide 1.1s ease .2s both}
[data-scene="ps-37"].s2 .s37-dim{stroke-dasharray:340;stroke-dashoffset:340;animation:s37draw 1s ease .1s forwards}
[data-scene="ps-37"].s2 .s37-card{transform-box:fill-box;transform-origin:center;animation:s37pop .5s ease .3s both}
[data-scene="ps-37"].s3 .s37-path{stroke-dasharray:720;stroke-dashoffset:720;animation:s37draw 1.3s ease .1s forwards}
[data-scene="ps-37"].s3 .s37-v{stroke-dasharray:110;stroke-dashoffset:110;animation:s37draw .6s ease .8s forwards}
[data-scene="ps-37"].s3 .s37-f{stroke-dasharray:70;stroke-dashoffset:70;animation:s37draw .6s ease 1s forwards}
[data-scene="ps-37"].s3 .s37-card{transform-box:fill-box;transform-origin:center;animation:s37pop .5s ease 1s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">动能和动能定理：功与动能变化的关系</text>

<!-- 第一步：动能 -->
<g class="s37-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 动能：物体由于运动而具有的能量</text>

  <line x1="70" y1="430" x2="560" y2="430" stroke="#cbd5e1" stroke-width="3"/>
  <text x="315" y="452" font-size="11.5" fill="#64748b" text-anchor="middle">水平面</text>

  <g class="s37-glow" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
    <line x1="92" y1="368" x2="130" y2="368"/>
    <line x1="82" y1="392" x2="126" y2="392"/>
    <line x1="94" y1="414" x2="132" y2="414"/>
  </g>

  <rect x="180" y="350" width="120" height="80" rx="10" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="240" y="400" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">m</text>
  <ellipse cx="240" cy="433" rx="66" ry="6" fill="#94a3b8" opacity=".35"/>

  <line class="s37-arrow" x1="302" y1="388" x2="404" y2="388" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="352" y="372" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">v</text>

  <g class="s37-card">
    <rect x="470" y="110" width="360" height="270" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">动能的表达式</text>
    <text x="650" y="194" font-size="23" font-weight="900" fill="#b45309" text-anchor="middle">Ek = ½mv²</text>
    <text x="650" y="230" font-size="12" fill="#334155" text-anchor="middle">m：质量，单位 kg</text>
    <text x="650" y="258" font-size="12" fill="#334155" text-anchor="middle">v：速度，单位 m/s</text>
    <text x="650" y="286" font-size="12" fill="#334155" text-anchor="middle">Ek：动能，单位 J</text>
    <line x1="510" y1="308" x2="790" y2="308" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="650" y="334" font-size="11.5" fill="#64748b" text-anchor="middle">动能是标量，只有大小，没有方向</text>
    <text x="650" y="360" font-size="11.5" fill="#64748b" text-anchor="middle">动能是状态量，对应某一时刻</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量越大、速度越大，动能越大；动能与过程无关</text>
</g>

<!-- 第二步：动能定理 -->
<g class="s37-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 动能定理：合外力做功等于动能变化</text>

  <line x1="70" y1="430" x2="640" y2="430" stroke="#cbd5e1" stroke-width="3"/>

  <rect x="100" y="360" width="80" height="70" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="140" y="402" font-size="15" font-weight="800" fill="#64748b" text-anchor="middle">m</text>
  <text x="140" y="348" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">v₁</text>

  <rect class="s37-move" x="430" y="360" width="80" height="70" rx="9" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="470" y="402" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">m</text>
  <text x="470" y="348" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">v₂</text>

  <line x1="180" y1="326" x2="334" y2="326" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="257" y="312" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">F合</text>

  <line class="s37-dim" x1="140" y1="458" x2="470" y2="458" stroke="#64748b" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="305" y="448" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">位移 l</text>

  <g class="s37-card">
    <rect x="600" y="110" width="230" height="255" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="715" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">动能定理</text>
    <text x="715" y="180" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">W合 = Ek2 − Ek1</text>
    <text x="715" y="208" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">W合 = ½mv₂² − ½mv₁²</text>
    <text x="715" y="242" font-size="12" fill="#334155" text-anchor="middle">W合 为正 → 动能增加</text>
    <text x="715" y="268" font-size="12" fill="#334155" text-anchor="middle">W合 为负 → 动能减少</text>
    <line x1="630" y1="288" x2="800" y2="288" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="715" y="314" font-size="11.5" fill="#64748b" text-anchor="middle">只与初、末动能有关</text>
    <text x="715" y="340" font-size="11.5" fill="#64748b" text-anchor="middle">与过程细节无关</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">合外力做的总功等于末动能减初动能，只比较初、末状态</text>
</g>

<!-- 第三步：曲线与变力 -->
<g class="s37-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 曲线运动、变力做功都适用</text>

  <path class="s37-path" d="M90 430 C 200 330 300 260 430 190 S 540 150 610 130" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="355" r="7" fill="#7c3aed"/>
  <text x="150" y="378" font-size="13" font-weight="800" fill="#6d28d9">A</text>
  <line class="s37-v" x1="172" y1="354" x2="250" y2="311" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="256" y="302" font-size="12.5" font-weight="800" fill="#b91c1c">vA</text>

  <circle cx="500" cy="163" r="7" fill="#7c3aed"/>
  <text x="482" y="152" font-size="13" font-weight="800" fill="#6d28d9">B</text>
  <line class="s37-v" x1="502" y1="163" x2="580" y2="136" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="586" y="130" font-size="12.5" font-weight="800" fill="#b91c1c">vB</text>

  <line class="s37-f" x1="330" y1="236" x2="372" y2="203" stroke="#d97706" stroke-width="3.5" marker-end="url(#arrAmber)"/>
  <text x="336" y="220" font-size="12.5" font-weight="800" fill="#b45309">F</text>
  <text x="352" y="392" font-size="11.5" fill="#6d28d9" text-anchor="middle">轨迹可以是曲线</text>

  <g class="s37-card">
    <rect x="630" y="110" width="200" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="730" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">为什么都适用</text>
    <text x="730" y="180" font-size="12" fill="#334155" text-anchor="middle">恒力、变力</text>
    <text x="730" y="208" font-size="12" fill="#334155" text-anchor="middle">直线、曲线</text>
    <text x="730" y="236" font-size="12" fill="#334155" text-anchor="middle">不涉及时间 t</text>
    <text x="730" y="264" font-size="12" fill="#334155" text-anchor="middle">只看初、末动能</text>
    <line x1="660" y1="286" x2="800" y2="286" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="730" y="314" font-size="11.5" fill="#64748b" text-anchor="middle">多个力时</text>
    <text x="730" y="338" font-size="11.5" fill="#64748b" text-anchor="middle">求各力做功的代数和</text>
    <text x="730" y="362" font-size="11.5" fill="#64748b" text-anchor="middle">注意功的正负号</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">动能定理把功和动能变化直接联系起来，是解决力学问题的通用工具</text>
</g>
</svg>
