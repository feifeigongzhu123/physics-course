<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="库仑定律：点电荷、F 等于 kq1q2 除以 r 平方、方向与适用条件">
<style>
[data-scene="ps-41"] .s41-step1,[data-scene="ps-41"] .s41-step2,[data-scene="ps-41"] .s41-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-41"].s1 .s41-step1,[data-scene="ps-41"].s2 .s41-step2,[data-scene="ps-41"].s3 .s41-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s41draw{to{stroke-dashoffset:0}}
@keyframes s41pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s41pulse{0%,100%{opacity:.6}50%{opacity:1}}
[data-scene="ps-41"].s1 .s41-f{stroke-dasharray:100;stroke-dashoffset:100;animation:s41draw .8s ease .3s forwards}
[data-scene="ps-41"].s1 .s41-dim{stroke-dasharray:270;stroke-dashoffset:270;animation:s41draw 1s ease .1s forwards}
[data-scene="ps-41"].s1 .s41-card{transform-box:fill-box;transform-origin:center;animation:s41pop .5s ease .3s both}
[data-scene="ps-41"].s1 .s41-charge{animation:s41pulse 1.8s ease-in-out infinite}
[data-scene="ps-41"].s2 .s41-f{stroke-dasharray:100;stroke-dashoffset:100;animation:s41draw .7s ease .3s forwards}
[data-scene="ps-41"].s2 .s41-card{transform-box:fill-box;transform-origin:center;animation:s41pop .5s ease .2s both}
[data-scene="ps-41"].s3 .s41-card{transform-box:fill-box;transform-origin:center;animation:s41pop .45s ease both}
[data-scene="ps-41"].s3 .s41-card:nth-of-type(2){animation-delay:.12s}
[data-scene="ps-41"].s3 .s41-card:nth-of-type(3){animation-delay:.24s}
[data-scene="ps-41"].s3 .s41-dim{stroke-dasharray:190;stroke-dashoffset:190;animation:s41draw .9s ease .6s forwards}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">库仑定律：真空中两个静止点电荷的作用力</text>

<!-- 第一步：定律内容 -->
<g class="s41-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 点电荷之间的作用力</text>

  <text x="375" y="170" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">带电体大小远小于它们之间的距离</text>
  <line x1="250" y1="290" x2="500" y2="290" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 5"/>

  <circle class="s41-charge" cx="250" cy="290" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="250" y="300" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <text x="250" y="342" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">q₁</text>

  <circle class="s41-charge" cx="500" cy="290" r="28" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="500" y="300" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <text x="500" y="342" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">q₂</text>

  <line class="s41-f" x1="220" y1="290" x2="148" y2="290" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <line class="s41-f" x1="530" y1="290" x2="602" y2="290" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="178" y="274" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
  <text x="572" y="274" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F′</text>

  <line x1="250" y1="364" x2="250" y2="394" stroke="#64748b" stroke-width="1.5"/>
  <line x1="500" y1="364" x2="500" y2="394" stroke="#64748b" stroke-width="1.5"/>
  <line class="s41-dim" x1="250" y1="390" x2="500" y2="390" stroke="#64748b" stroke-width="2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="375" y="382" font-size="15" font-weight="900" fill="#475569" text-anchor="middle">r</text>
  <text x="375" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">两电荷间的距离</text>

  <g class="s41-card">
    <rect x="620" y="110" width="210" height="280" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="725" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">定律表达式</text>
    <text x="725" y="186" font-size="16" font-weight="900" fill="#b45309" text-anchor="middle">F = kq₁q₂/r²</text>
    <text x="725" y="222" font-size="12" fill="#334155" text-anchor="middle">k = 9.0×10⁹ N·m²/C²</text>
    <text x="725" y="256" font-size="11.5" fill="#334155" text-anchor="middle">q：电荷量大小</text>
    <text x="725" y="280" font-size="11.5" fill="#334155" text-anchor="middle">r：两点电荷间距离</text>
    <text x="725" y="304" font-size="11.5" fill="#334155" text-anchor="middle">F：库仑力，单位 N</text>
    <line x1="650" y1="322" x2="800" y2="322" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="725" y="348" font-size="11.5" fill="#64748b" text-anchor="middle">力沿两电荷的连线</text>
    <text x="725" y="372" font-size="11.5" fill="#64748b" text-anchor="middle">同种相斥，异种相吸</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">真空中两个静止点电荷之间的作用力，沿两电荷的连线</text>
</g>

<!-- 第二步：方向 -->
<g class="s41-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 方向：同种相斥，异种相吸</text>

  <g class="s41-card">
    <rect x="70" y="110" width="360" height="310" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="250" y="146" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">同种电荷：相互排斥</text>
    <circle cx="180" cy="268" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="180" y="277" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
    <circle cx="320" cy="268" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="320" y="277" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
    <line class="s41-f" x1="150" y1="268" x2="92" y2="268" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <line class="s41-f" x1="350" y1="268" x2="408" y2="268" stroke="#b91c1c" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="120" y="252" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
    <text x="380" y="252" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F′</text>
    <text x="250" y="344" font-size="12.5" fill="#334155" text-anchor="middle">力的方向背离对方</text>
    <text x="250" y="372" font-size="11.5" fill="#64748b" text-anchor="middle">沿两电荷的连线向外</text>
  </g>

  <g class="s41-card">
    <rect x="470" y="110" width="360" height="310" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="146" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">异种电荷：相互吸引</text>
    <circle cx="580" cy="268" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="580" y="277" font-size="22" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
    <circle cx="720" cy="268" r="26" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="720" y="277" font-size="22" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
    <line class="s41-f" x1="608" y1="268" x2="648" y2="268" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <line class="s41-f" x1="692" y1="268" x2="652" y2="268" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="626" y="252" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
    <text x="676" y="296" font-size="13" font-weight="900" fill="#1d4ed8" text-anchor="middle">F′</text>
    <text x="650" y="344" font-size="12.5" fill="#334155" text-anchor="middle">力的方向指向对方</text>
    <text x="650" y="372" font-size="11.5" fill="#64748b" text-anchor="middle">沿两电荷的连线向内</text>
  </g>

  <rect x="70" y="452" width="760" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="476" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">两电荷受到的库仑力大小相等、方向相反</text>
  <text x="450" y="498" font-size="12" fill="#1e3a8a" text-anchor="middle">是一对作用力与反作用力</text>
</g>

<!-- 第三步：适用条件 -->
<g class="s41-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 适用条件：真空、点电荷、静止</text>

  <g class="s41-card">
    <rect x="70" y="126" width="240" height="146" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="190" y="172" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">真空</text>
    <text x="190" y="210" font-size="12" fill="#334155" text-anchor="middle">真空中严格成立</text>
    <text x="190" y="236" font-size="11.5" fill="#64748b" text-anchor="middle">空气中近似适用</text>
  </g>

  <g class="s41-card">
    <rect x="330" y="126" width="240" height="146" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="450" y="172" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">点电荷</text>
    <text x="450" y="210" font-size="12" fill="#334155" text-anchor="middle">带电体大小远小于</text>
    <text x="450" y="236" font-size="11.5" fill="#64748b" text-anchor="middle">它们之间的距离</text>
  </g>

  <g class="s41-card">
    <rect x="590" y="126" width="240" height="146" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="710" y="172" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">静止</text>
    <text x="710" y="210" font-size="12" fill="#334155" text-anchor="middle">两个电荷都必须静止</text>
    <text x="710" y="236" font-size="11.5" fill="#64748b" text-anchor="middle">运动电荷还有磁力</text>
  </g>

  <circle cx="170" cy="362" r="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="170" y="373" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <circle cx="280" cy="362" r="38" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="280" y="373" font-size="24" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
  <text x="225" y="428" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">距离太近，不能看成点电荷</text>
  <text x="225" y="450" font-size="11.5" fill="#64748b" text-anchor="middle">库仑定律不适用</text>

  <circle cx="600" cy="362" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="366" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="middle">+</text>
  <circle cx="770" cy="362" r="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="770" y="366" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">−</text>
  <line class="s41-dim" x1="610" y1="362" x2="760" y2="362" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="685" y="352" font-size="13" font-weight="900" fill="#475569" text-anchor="middle">r</text>
  <text x="685" y="428" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">r 远大于带电体尺寸</text>
  <text x="685" y="450" font-size="11.5" fill="#64748b" text-anchor="middle">可以看成点电荷</text>

  <rect x="70" y="468" width="760" height="36" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="491" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">只有真空中的点电荷，库仑定律才严格成立</text>
</g>
</svg>
