<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="运动的合成与分解：小船渡河、速度平行四边形、分运动独立性">
<style>
[data-scene="ps-24"] .s24-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-24"].s1 .s24-step1,[data-scene="ps-24"].s2 .s24-step2,[data-scene="ps-24"].s3 .s24-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s24draw{to{stroke-dashoffset:0}}
@keyframes s24pop{0%{transform:scale(.82);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s24grow{from{opacity:0}to{opacity:1}}
@keyframes s24drift{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
[data-scene="ps-24"].s1 .s24-route{stroke-dasharray:460;stroke-dashoffset:460;animation:s24draw 1.1s ease .2s both}
[data-scene="ps-24"].s1 .s24-boat{transform-box:fill-box;transform-origin:center;animation:s24pop .5s ease .9s both}
[data-scene="ps-24"].s1 .s24-comp{animation:s24grow .5s ease 1.1s both}
[data-scene="ps-24"].s2 .s24-vec{animation:s24grow .5s ease .2s both}
[data-scene="ps-24"].s2 .s24-par{stroke-dasharray:600;stroke-dashoffset:600;animation:s24draw .8s ease .5s both}
[data-scene="ps-24"].s3 .s24-wake{animation:s24drift 2.6s ease-in-out infinite}
[data-scene="ps-24"].s3 .s24-boat{animation:s24grow .6s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">运动的合成与分解：小船渡河模型</text>

<!-- 第一步：小船渡河 -->
<g class="s24-step s24-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">小船渡河：实际航线是合运动，船头划行和流水是分运动</text>

  <rect x="60" y="132" width="780" height="24" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="60" y="438" width="780" height="24" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="60" y="156" width="780" height="282" fill="#dbeafe" opacity=".72"/>
  <text x="76" y="126" font-size="11.5" font-weight="700" fill="#92400e">对岸</text>
  <text x="76" y="478" font-size="11.5" font-weight="700" fill="#92400e">出发岸</text>

  <g stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrBlue)">
    <line x1="90" y1="196" x2="166" y2="196"/>
    <line x1="734" y1="196" x2="810" y2="196"/>
    <line x1="90" y1="394" x2="166" y2="394"/>
    <line x1="734" y1="394" x2="810" y2="394"/>
  </g>
  <text x="830" y="200" font-size="11.5" font-weight="800" fill="#0369a1">水流</text>

  <path class="s24-route" d="M210 424 L610 180" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#arrBlue)"/>
  <line x1="210" y1="424" x2="210" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="210" y1="180" x2="610" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>
  <text x="410" y="170" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">沿河岸漂移 x = v水·t</text>
  <text x="612" y="172" font-size="12" font-weight="800" fill="#6d28d9">实际航线（合运动）</text>

  <g class="s24-boat">
    <polygon points="392,314 438,314 428,330 400,330" fill="#b45309" stroke="#7c2d12" stroke-width="1.5"/>
    <rect x="405" y="296" width="20" height="20" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
    <text x="415" y="348" font-size="11.5" font-weight="800" fill="#7c2d12" text-anchor="middle">船</text>
  </g>
  <g class="s24-comp">
    <line x1="415" y1="294" x2="415" y2="218" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <text x="402" y="228" font-size="12.5" font-weight="900" fill="#047857" text-anchor="end">v船</text>
    <line x1="415" y1="304" x2="510" y2="304" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="512" y="310" font-size="12.5" font-weight="900" fill="#0369a1">v水</text>
    <line x1="415" y1="304" x2="505" y2="245" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="512" y="244" font-size="12.5" font-weight="900" fill="#6d28d9">v合</text>
  </g>

  <line x1="110" y1="180" x2="110" y2="424" stroke="#475569" stroke-width="1.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="120" y="308" font-size="12.5" font-weight="800" fill="#334155">d</text>
  <circle cx="210" cy="424" r="6" fill="#334155"/>
  <text x="196" y="446" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">出发点</text>

  <rect x="664" y="92" width="196" height="58" rx="10" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="762" y="114" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">合运动：实际运动</text>
  <text x="762" y="136" font-size="11.5" fill="#475569" text-anchor="middle">分运动：船划行 + 随水漂</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">渡河时间 t = d / v船（v船 是船头垂直河岸的分速度）</text>
</g>

<!-- 第二步：速度平行四边形 -->
<g class="s24-step s24-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">速度合成：平行四边形定则，对角线表示合速度</text>

  <g class="s24-par" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6">
    <line x1="490" y1="430" x2="490" y2="220"/>
    <line x1="220" y1="220" x2="490" y2="220"/>
  </g>
  <path d="M220 410 L240 410 L240 430" fill="none" stroke="#64748b" stroke-width="1.6"/>
  <path d="M220 360 A70 70 0 0 1 275 387" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="246" y="376" font-size="13" font-weight="900" fill="#6d28d9">θ</text>

  <g class="s24-vec">
    <line x1="220" y1="430" x2="220" y2="220" stroke="#059669" stroke-width="4" marker-end="url(#arrGreen)"/>
    <line x1="220" y1="430" x2="490" y2="430" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
    <line x1="220" y1="430" x2="490" y2="220" stroke="#7c3aed" stroke-width="4.5" marker-end="url(#arrBlue)"/>
  </g>
  <text x="210" y="240" font-size="14" font-weight="900" fill="#047857" text-anchor="end">v船</text>
  <text x="466" y="456" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">v水</text>
  <text x="502" y="212" font-size="14" font-weight="900" fill="#6d28d9">v合</text>
  <circle cx="220" cy="430" r="6" fill="#334155"/>
  <text x="202" y="452" font-size="12" fill="#334155" text-anchor="end">O</text>
  <text x="355" y="342" font-size="12" fill="#64748b" text-anchor="middle">对角线 = 合速度</text>

  <rect x="556" y="106" width="314" height="224" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="713" y="136" font-size="14.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">平行四边形定则</text>
  <text x="712" y="166" font-size="12.5" fill="#334155" text-anchor="middle">以 v船、v水 为邻边作平行四边形</text>
  <text x="712" y="192" font-size="12.5" fill="#334155" text-anchor="middle">从共同起点出发的对角线就是 v合</text>
  <line x1="580" y1="210" x2="846" y2="210" stroke="#e8eef7" stroke-width="1.5"/>
  <text x="713" y="242" font-size="16" font-weight="900" fill="#6d28d9" text-anchor="middle">v合 = √(v船² + v水²)</text>
  <text x="713" y="272" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">tanθ = v水 / v船</text>
  <text x="713" y="302" font-size="11.5" fill="#64748b" text-anchor="middle">两个分速度垂直时，直接用勾股定理</text>
  <text x="713" y="320" font-size="11.5" fill="#64748b" text-anchor="middle">θ 是合速度与船头方向的夹角</text>

  <rect x="70" y="96" width="410" height="102" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="275" y="122" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">位移、速度、加速度都是矢量</text>
  <text x="275" y="146" font-size="12" fill="#475569" text-anchor="middle">它们的合成与分解都遵循平行四边形定则</text>
  <text x="275" y="170" font-size="11.5" fill="#64748b" text-anchor="middle">合运动与分运动经历的时间相同（等时性）</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">合成与分解互为逆过程，解题时按实际效果分解</text>
</g>

<!-- 第三步：分运动的独立性 -->
<g class="s24-step s24-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">分运动独立：渡河时间只由垂直河岸的分速度决定</text>

  <rect x="60" y="132" width="780" height="24" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="60" y="438" width="780" height="24" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="60" y="156" width="780" height="282" fill="#dbeafe" opacity=".72"/>
  <text x="76" y="126" font-size="11.5" font-weight="700" fill="#92400e">对岸</text>
  <text x="76" y="478" font-size="11.5" font-weight="700" fill="#92400e">出发岸</text>

  <line x1="180" y1="424" x2="180" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="180" y1="180" x2="330" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>
  <line x1="180" y1="180" x2="700" y2="180" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 6"/>

  <g class="s24-wake">
    <path d="M180 424 L330 180" fill="none" stroke="#059669" stroke-width="3.5" stroke-dasharray="8 6"/>
  </g>
  <path d="M180 424 L700 180" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-dasharray="8 6"/>
  <circle cx="180" cy="424" r="6" fill="#334155"/>
  <text x="166" y="446" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">同一出发点</text>

  <g class="s24-boat">
    <polygon points="232,314 266,314 258,328 236,328" fill="#b45309" stroke="#7c2d12" stroke-width="1.4"/>
    <line x1="249" y1="306" x2="249" y2="246" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
    <line x1="249" y1="306" x2="306" y2="306" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="250" y="238" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">v船</text>
    <text x="312" y="300" font-size="11.5" font-weight="800" fill="#b91c1c">v水小</text>
  </g>
  <g class="s24-boat">
    <polygon points="392,314 426,314 418,328 396,328" fill="#b45309" stroke="#7c2d12" stroke-width="1.4"/>
    <line x1="409" y1="306" x2="409" y2="246" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
    <line x1="409" y1="306" x2="532" y2="306" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="410" y="238" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">v船</text>
    <text x="540" y="300" font-size="11.5" font-weight="800" fill="#b91c1c">v水大</text>
  </g>
  <text x="255" y="194" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">x漂1</text>
  <text x="515" y="194" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">x漂2</text>

  <text x="450" y="222" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">两条航线的渡河时间相同</text>
  <text x="450" y="268" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">t1 = t2 = d / v船</text>

  <rect x="560" y="338" width="280" height="92" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.8"/>
  <text x="700" y="362" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">分运动互不影响</text>
  <text x="700" y="386" font-size="11.5" fill="#475569" text-anchor="middle">v船 决定渡河时间</text>
  <text x="700" y="408" font-size="11.5" fill="#475569" text-anchor="middle">v水 只决定沿河岸的漂移距离</text>
  <text x="700" y="426" font-size="11" fill="#64748b" text-anchor="middle">x漂 = v水·t</text>

  <rect x="70" y="466" width="760" height="28" rx="9" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
  <text x="450" y="485" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">分运动的独立性：各分运动独立进行；合运动与分运动时间相同（等时性）</text>
</g>
</svg>
