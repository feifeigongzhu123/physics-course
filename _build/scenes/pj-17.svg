<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="平面镜成像：物像对称、玻璃板与两支蜡烛实验、虚像与潜望镜">
  <style>
[data-scene="pj-17"] .p17-z1,[data-scene="pj-17"] .p17-z2,[data-scene="pj-17"] .p17-z3{opacity:0;transition:opacity .45s}
[data-scene="pj-17"].s1 .p17-z1,[data-scene="pj-17"].s2 .p17-z2,[data-scene="pj-17"].s3 .p17-z3{opacity:1}
[data-scene="pj-17"] .p17-img{opacity:0;transition:opacity .5s .1s}
[data-scene="pj-17"].s1 .p17-img{opacity:1}
[data-scene="pj-17"].s1 .p17-connect{stroke-dasharray:280;stroke-dashoffset:280;animation:p17draw 1s ease .2s forwards}
[data-scene="pj-17"].s1 .p17-chip{animation:popIn .5s ease .5s both;transform-box:fill-box;transform-origin:center}
[data-scene="pj-17"] .p17-ray{stroke-dasharray:10 8;animation:dashFlow 1.2s linear infinite}
[data-scene="pj-17"].s2 .p17-b{animation:popIn .5s ease .2s both;transform-box:fill-box;transform-origin:center}
[data-scene="pj-17"].s2 .p17-ring{animation:ringPulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
[data-scene="pj-17"].s2 .p17-img2{animation:p17fade 1s ease .5s both}
[data-scene="pj-17"].s3 .p17-x{animation:popIn .45s ease .4s both;transform-box:fill-box;transform-origin:center}
@keyframes p17draw{to{stroke-dashoffset:0}}
@keyframes p17fade{from{opacity:0}to{opacity:1}}
  </style>
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">平面镜成像：像与物关于镜面对称</text>

  <!-- ===== 第 1 步：物像对称 ===== -->
  <g class="p17-z1" data-zone="1">
    <line x1="460" y1="106" x2="460" y2="438" stroke="#94a3b8" stroke-width="6"/>
    <line x1="460" y1="106" x2="460" y2="438" stroke="#e2e8f0" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="460" y1="140" x2="478" y2="124"/><line x1="460" y1="180" x2="478" y2="164"/>
      <line x1="460" y1="220" x2="478" y2="204"/><line x1="460" y1="260" x2="478" y2="244"/>
      <line x1="460" y1="300" x2="478" y2="284"/><line x1="460" y1="340" x2="478" y2="324"/>
      <line x1="460" y1="380" x2="478" y2="364"/><line x1="460" y1="420" x2="478" y2="404"/>
    </g>
    <text x="486" y="190" font-size="12.5" font-weight="700" fill="#64748b">平面镜</text>

    <!-- 物 -->
    <ellipse cx="320" cy="414" rx="26" ry="6" fill="#cbd5e1"/>
    <rect x="304" y="306" width="32" height="104" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M320 304 C 334 288 334 274 320 260 C 306 274 306 288 320 304 Z" fill="#fb923c"/>
    <path d="M320 296 C 327 286 327 278 320 270 C 313 278 313 286 320 296 Z" fill="#fde68a"/>
    <text x="320" y="246" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">物</text>

    <!-- 像 -->
    <g class="p17-img">
      <ellipse cx="600" cy="414" rx="26" ry="6" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 5"/>
      <rect x="584" y="306" width="32" height="104" rx="4" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 6"/>
      <path d="M600 304 C 614 288 614 274 600 260 C 586 274 586 288 600 304 Z" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="7 6"/>
      <text x="600" y="246" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">虚像</text>
    </g>

    <line class="p17-connect" x1="320" y1="266" x2="600" y2="266" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="460" y="250" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">连线与镜面垂直</text>

    <g class="p17-chip">
      <rect x="350" y="128" width="220" height="32" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
      <text x="460" y="149" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">像与物大小相等</text>
    </g>

    <line x1="322" y1="432" x2="452" y2="432" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <line x1="468" y1="432" x2="598" y2="432" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="387" y="424" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">d</text>
    <text x="533" y="424" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">d</text>
    <text x="460" y="460" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">像距 = 物距 · 像与物到镜面距离相等</text>
  </g>

  <!-- ===== 第 2 步：玻璃板与两支蜡烛 ===== -->
  <g class="p17-z2" data-zone="2">
    <rect x="150" y="92" width="600" height="34" rx="17" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
    <text x="450" y="114" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="middle">用玻璃板代替平面镜：既能成像，又能透光，便于确定像的位置</text>

    <text x="450" y="146" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">玻璃板</text>
    <rect x="446" y="156" width="10" height="244" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" opacity=".9"/>
    <line x1="448" y1="162" x2="448" y2="394" stroke="#ffffff" stroke-width="2" opacity=".8"/>
    <line x1="100" y1="400" x2="800" y2="400" stroke="#cbd5e1" stroke-width="3"/>

    <!-- 蜡烛 A -->
    <rect x="288" y="320" width="24" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M300 318 C 310 306 310 296 300 286 C 290 296 290 306 300 318 Z" fill="#fb923c"/>
    <path d="M300 312 C 305 305 305 300 300 294 C 295 300 295 305 300 312 Z" fill="#fde68a"/>
    <line x1="300" y1="318" x2="300" y2="322" stroke="#78716c" stroke-width="2"/>
    <text x="300" y="272" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">A（点燃）</text>

    <!-- 蜡烛 B 与像 -->
    <g class="p17-b">
      <rect x="588" y="320" width="24" height="80" rx="3" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <line x1="600" y1="320" x2="600" y2="310" stroke="#78716c" stroke-width="2"/>
      <text x="600" y="272" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">B（未点燃）</text>
    </g>
    <path class="p17-img2" d="M600 318 C 610 306 610 296 600 286 C 590 296 590 306 600 318 Z" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
    <circle class="p17-ring" cx="600" cy="302" r="20" fill="none" stroke="#059669" stroke-width="2" opacity=".8"/>
    <text x="630" y="286" font-size="12" font-weight="800" fill="#047857">完全重合</text>
    <line x1="628" y1="290" x2="614" y2="298" stroke="#059669" stroke-width="1.5"/>

    <rect x="120" y="404" width="660" height="14" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <g stroke="#b45309" stroke-width="1.5">
      <line x1="150" y1="404" x2="150" y2="418"/><line x1="180" y1="406" x2="180" y2="418"/>
      <line x1="210" y1="404" x2="210" y2="418"/><line x1="240" y1="406" x2="240" y2="418"/>
      <line x1="270" y1="404" x2="270" y2="418"/><line x1="300" y1="406" x2="300" y2="418"/>
      <line x1="330" y1="404" x2="330" y2="418"/><line x1="360" y1="406" x2="360" y2="418"/>
      <line x1="390" y1="404" x2="390" y2="418"/><line x1="420" y1="406" x2="420" y2="418"/>
      <line x1="480" y1="404" x2="480" y2="418"/><line x1="510" y1="406" x2="510" y2="418"/>
      <line x1="540" y1="404" x2="540" y2="418"/><line x1="570" y1="406" x2="570" y2="418"/>
      <line x1="600" y1="404" x2="600" y2="418"/><line x1="630" y1="406" x2="630" y2="418"/>
      <line x1="660" y1="404" x2="660" y2="418"/><line x1="690" y1="406" x2="690" y2="418"/>
      <line x1="720" y1="404" x2="720" y2="418"/><line x1="750" y1="406" x2="750" y2="418"/>
    </g>
    <text x="792" y="392" font-size="11" fill="#64748b" text-anchor="end">刻度尺</text>

    <line x1="302" y1="438" x2="444" y2="438" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <line x1="456" y1="438" x2="598" y2="438" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
    <text x="373" y="432" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">物距</text>
    <text x="527" y="432" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">像距</text>
    <text x="450" y="462" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">B 与像完全重合，说明像距等于物距、像与物等大</text>
    <text x="126" y="380" font-size="11" font-weight="700" fill="#b45309">玻璃板竖直放置</text>
  </g>

  <!-- ===== 第 3 步：虚像与潜望镜 ===== -->
  <g class="p17-z3" data-zone="3">
    <rect x="40" y="80" width="400" height="376" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="240" y="108" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">虚像：光屏承接不到</text>

    <line x1="300" y1="140" x2="300" y2="400" stroke="#94a3b8" stroke-width="6"/>
    <line x1="300" y1="140" x2="300" y2="400" stroke="#e2e8f0" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.8">
      <line x1="300" y1="170" x2="314" y2="156"/><line x1="300" y1="210" x2="314" y2="196"/>
      <line x1="300" y1="250" x2="314" y2="236"/><line x1="300" y1="290" x2="314" y2="276"/>
      <line x1="300" y1="330" x2="314" y2="316"/><line x1="300" y1="370" x2="314" y2="356"/>
    </g>
    <text x="300" y="132" font-size="11" fill="#64748b" text-anchor="middle">平面镜</text>

    <rect x="188" y="320" width="24" height="80" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M200 318 C 210 306 210 296 200 286 C 190 296 190 306 200 318 Z" fill="#fb923c"/>
    <rect x="388" y="320" width="24" height="80" rx="3" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <path d="M400 318 C 410 306 410 296 400 286 C 390 296 390 306 400 318 Z" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="200" y="248" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">物</text>
    <text x="400" y="248" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">虚像</text>

    <g stroke="#d97706" stroke-width="2" fill="none" class="p17-ray">
      <line x1="200" y1="306" x2="300" y2="300"/>
      <line x1="300" y1="300" x2="148" y2="252" marker-end="url(#arrAmber)"/>
      <line x1="200" y1="306" x2="300" y2="330"/>
      <line x1="300" y1="330" x2="150" y2="382" marker-end="url(#arrAmber)"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5">
      <line x1="300" y1="300" x2="400" y2="306"/>
      <line x1="300" y1="330" x2="400" y2="306"/>
    </g>

    <rect x="420" y="250" width="12" height="140" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="426" y="228" font-size="11" fill="#64748b" text-anchor="middle">光屏</text>
    <g class="p17-x" stroke="#dc2626" stroke-width="2.6" stroke-linecap="round">
      <line x1="418" y1="312" x2="434" y2="328"/>
      <line x1="434" y1="312" x2="418" y2="328"/>
    </g>
    <text x="240" y="436" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">平面镜成正立、等大的虚像，光屏上接不到</text>

    <!-- 潜望镜 -->
    <rect x="470" y="80" width="390" height="376" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="665" y="108" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">潜望镜：两块平面镜改变光路</text>

    <rect x="650" y="150" width="80" height="260" rx="10" fill="#eef6ff" stroke="#64748b" stroke-width="3"/>
    <rect x="644" y="202" width="16" height="36" fill="#ffffff"/>
    <rect x="726" y="348" width="16" height="36" fill="#ffffff"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="654" y1="184" x2="726" y2="256"/>
      <line x1="654" y1="330" x2="726" y2="402"/>
    </g>
    <g stroke="#1d4ed8" stroke-width="2">
      <line x1="658" y1="188" x2="722" y2="252"/>
      <line x1="658" y1="334" x2="722" y2="398"/>
    </g>

    <g stroke="#d97706" stroke-width="3" fill="none" stroke-linecap="round" class="p17-ray" stroke-dasharray="11 8">
      <line x1="566" y1="220" x2="686" y2="220" marker-end="url(#arrAmber)"/>
      <line x1="690" y1="222" x2="690" y2="362" marker-end="url(#arrAmber)"/>
      <line x1="692" y1="366" x2="796" y2="366" marker-end="url(#arrAmber)"/>
    </g>
    <ellipse cx="812" cy="366" rx="14" ry="9" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <circle cx="812" cy="366" r="4" fill="#334155"/>
    <text x="812" y="394" font-size="11" fill="#64748b" text-anchor="middle">眼睛</text>
    <text x="738" y="204" font-size="11" font-weight="700" fill="#1e40af">平面镜</text>
    <text x="738" y="418" font-size="11" font-weight="700" fill="#1e40af">平面镜</text>
    <text x="644" y="296" font-size="11" fill="#64748b" text-anchor="end">光沿镜面反射，转 90°</text>
    <text x="665" y="440" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">平面镜改变光路：穿衣镜、潜望镜、后视镜</text>
  </g>
</svg>
