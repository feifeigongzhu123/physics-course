<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="牛顿第二定律：合外力等于质量乘加速度、加速度方向与合外力相同、瞬时性">
<style>
[data-scene="ps-19"] .s19-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-19"].s1 .s19-step1,[data-scene="ps-19"].s2 .s19-step2,[data-scene="ps-19"].s3 .s19-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s19pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s19grow{from{opacity:0}to{opacity:1}}
@keyframes s19slide{from{transform:translateY(9px);opacity:0}to{transform:none;opacity:1}}
@keyframes s19pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes s19shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
[data-scene="ps-19"].s1 .s19-formula{transform-box:fill-box;transform-origin:center;animation:s19pop .55s ease .15s both}
[data-scene="ps-19"].s1 .s19-force{animation:s19grow .5s ease .5s both}
[data-scene="ps-19"].s2 .s19-case{transform-box:fill-box;transform-origin:center;animation:s19pop .5s ease both}
[data-scene="ps-19"].s2 .s19-acc{animation:s19pulse 1.5s ease-in-out infinite}
[data-scene="ps-19"].s3 .s19-cut{stroke-dasharray:9 8;animation:s19pulse 1.4s ease-in-out infinite}
[data-scene="ps-19"].s3 .s19-after{transform-box:fill-box;transform-origin:center;animation:s19pop .5s ease .3s both}
[data-scene="ps-19"].s3 .s19-zero{animation:s19pulse 1.2s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">牛顿第二定律：F合 = ma</text>

<!-- 第一步：定律与公式 -->
<g class="s19-step s19-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">合外力与加速度同时产生，方向相同</text>

  <line x1="90" y1="326" x2="412" y2="326" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="130" y="252" width="96" height="72" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="178" y="298" font-size="20" font-weight="900" fill="#334155" text-anchor="middle">m</text>
  <line class="s19-force" x1="226" y1="272" x2="408" y2="272" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
  <text x="420" y="278" font-size="15" font-weight="900" fill="#b91c1c">F合</text>
  <line class="s19-force" x1="226" y1="314" x2="408" y2="314" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrBlue)"/>
  <text x="420" y="320" font-size="15" font-weight="900" fill="#1d4ed8">a</text>
  <text x="252" y="368" font-size="13" font-weight="800" fill="#1e3a8a">F合 与 a 同向</text>
  <path d="M232 250 Q262 226 300 226" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="312" y="230" font-size="11.5" fill="#64748b">同一物体</text>

  <g class="s19-formula">
    <rect x="470" y="126" width="382" height="268" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="470" y="126" width="382" height="8" rx="4" fill="#1d4ed8"/>
    <text x="661" y="162" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">牛顿第二定律</text>
    <text x="661" y="214" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle">F合 = ma</text>
    <line x1="500" y1="236" x2="822" y2="236" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="500" y="264" font-size="12.5" fill="#334155">F合：物体所受合外力，单位 N</text>
    <text x="500" y="292" font-size="12.5" fill="#334155">m：物体质量，单位 kg</text>
    <text x="500" y="320" font-size="12.5" fill="#334155">a：加速度，单位 m/s²</text>
    <text x="500" y="354" font-size="12" font-weight="800" fill="#1d4ed8">1 N = 1 kg·m/s²</text>
    <rect x="732" y="338" width="90" height="26" rx="13" fill="#e8effc"/>
    <text x="777" y="356" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">矢量式</text>
  </g>

  <rect x="50" y="452" width="800" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">加速度方向由合外力方向决定，与速度方向无关</text>
</g>

<!-- 第二步：方向关系 -->
<g class="s19-step s19-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">a 与 F合 同向：与 v 同向加速，与 v 反向减速</text>

  <g class="s19-case">
    <rect x="50" y="112" width="390" height="320" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="128" width="84" height="26" rx="13" fill="#dcfce7"/>
    <text x="112" y="146" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">加速</text>
    <text x="70" y="186" font-size="15" font-weight="800" fill="#047857">F合 与 v 同向</text>
    <rect x="100" y="250" width="80" height="62" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="140" y="290" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">m</text>
    <line x1="180" y1="262" x2="330" y2="262" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="342" y="268" font-size="13" font-weight="900" fill="#1d4ed8">v</text>
    <line x1="180" y1="292" x2="330" y2="292" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="342" y="298" font-size="13" font-weight="900" fill="#b91c1c">F合</text>
    <line class="s19-acc" x1="180" y1="322" x2="330" y2="322" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <text x="342" y="328" font-size="13" font-weight="900" fill="#047857">a</text>
    <text x="245" y="386" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">三箭头同向，速度增大</text>
  </g>

  <g class="s19-case">
    <rect x="460" y="112" width="390" height="320" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="480" y="128" width="84" height="26" rx="13" fill="#dbeafe"/>
    <text x="522" y="146" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">减速</text>
    <text x="480" y="186" font-size="15" font-weight="800" fill="#1e40af">F合 与 v 反向</text>
    <rect x="650" y="250" width="80" height="62" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="690" y="290" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">m</text>
    <line x1="730" y1="262" x2="810" y2="262" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="820" y="268" font-size="13" font-weight="900" fill="#1d4ed8">v</text>
    <line x1="650" y1="292" x2="500" y2="292" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="490" y="298" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">F合</text>
    <line class="s19-acc" x1="650" y1="322" x2="500" y2="322" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
    <text x="490" y="328" font-size="13" font-weight="900" fill="#047857" text-anchor="end">a</text>
    <text x="655" y="386" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">a 与 v 反向，速度减小</text>
  </g>

  <rect x="50" y="452" width="800" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">判断加速还是减速看 a 与 v 的方向；a 的方向始终与 F合 相同</text>
</g>

<!-- 第三步：瞬时性 -->
<g class="s19-step s19-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">瞬时性：力一改变，a 立刻改变；v 不能突变</text>

  <rect x="200" y="240" width="84" height="64" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="242" y="280" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">m</text>
  <line x1="200" y1="216" x2="300" y2="216" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="312" y="222" font-size="13" font-weight="900" fill="#1d4ed8">v</text>
  <line x1="284" y1="264" x2="416" y2="264" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="428" y="270" font-size="14" font-weight="900" fill="#b91c1c">F</text>
  <line x1="284" y1="310" x2="410" y2="310" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
  <text x="422" y="316" font-size="14" font-weight="900" fill="#047857">a</text>
  <text x="250" y="338" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">剪断前：F合 ≠ 0，a ≠ 0</text>

  <g class="s19-after">
    <rect x="560" y="240" width="84" height="64" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="602" y="280" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">m</text>
    <line x1="560" y1="216" x2="660" y2="216" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="672" y="222" font-size="13" font-weight="900" fill="#1d4ed8">v 不变</text>
    <text x="644" y="274" font-size="14" font-weight="900" fill="#b91c1c">F = 0</text>
    <text class="s19-zero" x="644" y="316" font-size="14" font-weight="900" fill="#047857">a = 0</text>
  </g>
  <text x="650" y="338" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">剪断瞬间：加速度立即变为 0</text>

  <line class="s19-cut" x1="470" y1="120" x2="470" y2="376" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="470" y="138" font-size="12" font-weight="800" fill="#64748b" text-anchor="middle">剪断细线</text>

  <line x1="110" y1="384" x2="790" y2="384" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="240" cy="384" r="5" fill="#1d4ed8"/>
  <circle cx="600" cy="384" r="5" fill="#dc2626"/>
  <text x="240" y="406" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">剪断前</text>
  <text x="600" y="406" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">剪断瞬间</text>
  <text x="802" y="390" font-size="11.5" fill="#64748b">t</text>

  <rect x="50" y="418" width="800" height="34" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="440" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">F合 与 a 同时存在、同时变化、同时消失；速度 v 的改变需要时间</text>
</g>
</svg>
