<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="受迫振动与共振：阻尼振动、受迫振动的频率、共振曲线与条件">
<style>
[data-scene="ps-72"] .s72-step{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
[data-scene="ps-72"].s1 .s72-step1,[data-scene="ps-72"].s2 .s72-step2,[data-scene="ps-72"].s3 .s72-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s72draw{to{stroke-dashoffset:0}}
@keyframes s72pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s72pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
[data-scene="ps-72"].s1 .s72-damp{stroke-dasharray:780;stroke-dashoffset:780;animation:s72draw 1.4s ease .15s forwards}
[data-scene="ps-72"].s1 .s72-drive{stroke-dasharray:520;stroke-dashoffset:520;animation:s72draw 1.1s ease .6s forwards}
[data-scene="ps-72"].s1 .s72-force,[data-scene="ps-72"].s2 .s72-force{animation:s72pulse 1.4s ease-in-out infinite}
[data-scene="ps-72"].s2 .s72-fcurve{stroke-dasharray:560;stroke-dashoffset:560;animation:s72draw 1.1s ease .15s forwards}
[data-scene="ps-72"].s2 .s72-xcurve{stroke-dasharray:560;stroke-dashoffset:560;animation:s72draw 1.1s ease .55s forwards}
[data-scene="ps-72"].s3 .s72-rescurve{stroke-dasharray:820;stroke-dashoffset:820;animation:s72draw 1.5s ease .15s forwards}
[data-scene="ps-72"].s3 .s72-peak{transform-box:fill-box;transform-origin:center;animation:s72pop .5s ease 1.2s both}
[data-scene="ps-72"].s3 .s72-card{transform-box:fill-box;transform-origin:center;animation:s72pop .45s ease both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">受迫振动 共振：驱动力频率决定振动频率</text>

<!-- 第一步：阻尼振动与周期性驱动力 -->
<g class="s72-step s72-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">阻尼振动会逐渐停下，要维持振动需要周期性驱动力</text>

  <rect x="60" y="106" width="420" height="260" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="270" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">阻尼振动</text>
  <line x1="90" y1="300" x2="458" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="100" y1="330" x2="100" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="452" y="320" font-size="12" fill="#64748b" text-anchor="end">t</text>
  <text x="88" y="145" font-size="12" fill="#64748b" text-anchor="end">x</text>
  <path class="s72-damp" d="M110 300 Q120 278 130 270 Q142 260 154 276 Q166 294 178 310 Q190 326 202 320 Q216 312 228 298 Q240 284 252 282 Q266 280 278 294 Q290 310 302 322 Q314 334 326 328 Q340 322 352 308 Q364 294 376 290 Q390 286 402 298 Q414 310 424 318 Q434 326 442 322" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="270" y="344" font-size="12.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">机械能减少，振幅逐渐减小</text>

  <rect x="500" y="106" width="340" height="260" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="670" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">周期性驱动力</text>
  <rect x="520" y="152" width="10" height="62" fill="#cbd5e1"/>
  <path d="M530 183 L540 168 L550 198 L560 168 L570 198 L580 168 L590 198 L600 168 L610 183" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="610" y="158" width="48" height="50" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="2.4"/>
  <text x="634" y="190" font-size="14" font-weight="900" fill="#7c2d12" text-anchor="middle">m</text>
  <line class="s72-force" x1="718" y1="183" x2="670" y2="183" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
  <text x="724" y="176" font-size="12.5" font-weight="800" fill="#b91c1c">F</text>
  <text x="689" y="214" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">周期性外力</text>

  <line x1="518" y1="292" x2="822" y2="292" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="522" y1="236" x2="522" y2="312" stroke="#94a3b8" stroke-width="1.6"/>
  <path class="s72-drive" d="M522 292 Q552 266 582 292 Q612 318 642 292 Q672 266 702 292 Q732 318 762 292 Q792 266 822 292" fill="none" stroke="#d97706" stroke-width="2.8"/>
  <g stroke="#94a3b8" stroke-width="1.2">
    <line x1="552" y1="316" x2="552" y2="326"/><line x1="672" y1="316" x2="672" y2="326"/>
    <line x1="552" y1="322" x2="672" y2="322" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="612" y="342" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">T驱</text>
  <text x="670" y="358" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">驱动力频率 f驱 由外界决定</text>

  <rect x="70" y="392" width="760" height="84" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="418" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">自由振动与受迫振动</text>
  <text x="450" y="443" font-size="12.5" fill="#334155" text-anchor="middle">自由振动：按固有频率 f固 振动，阻尼使振幅逐渐减小</text>
  <text x="450" y="466" font-size="12.5" fill="#334155" text-anchor="middle">受迫振动：在周期性驱动力作用下，按驱动力频率 f驱 振动</text>
</g>

<!-- 第二步：受迫振动的频率 -->
<g class="s72-step s72-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">受迫振动稳定后：频率等于驱动力频率，与固有频率无关</text>

  <rect x="60" y="106" width="260" height="270" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="190" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">受迫振动</text>
  <rect x="78" y="170" width="10" height="92" fill="#cbd5e1"/>
  <path d="M88 216 L98 201 L108 231 L118 201 L128 231 L138 201 L148 231 L158 201 L168 231 L178 216" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="180" y="192" width="55" height="50" rx="7" fill="#f59e0b" stroke="#b45309" stroke-width="2.4"/>
  <text x="207" y="223" font-size="14" font-weight="900" fill="#7c2d12" text-anchor="middle">m</text>
  <line class="s72-force" x1="290" y1="216" x2="248" y2="216" stroke="#dc2626" stroke-width="3.2" marker-end="url(#arrRed)"/>
  <text x="296" y="209" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="end">F驱</text>
  <line x1="207" y1="150" x2="207" y2="284" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="218" y="296" font-size="11.5" fill="#1e40af">平衡位置</text>
  <text x="190" y="332" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">稳定后频率</text>
  <text x="190" y="356" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">f受迫 = f驱</text>

  <rect x="350" y="106" width="490" height="286" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="595" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">驱动力与振动步调一致</text>
  <line x1="390" y1="310" x2="828" y2="310" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="390" y1="330" x2="390" y2="166" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="824" y="330" font-size="11.5" fill="#64748b" text-anchor="end">t</text>
  <path class="s72-fcurve" d="M400 300 Q440 272 480 300 Q520 328 560 300 Q600 272 640 300 Q680 328 720 300 Q760 272 800 300" fill="none" stroke="#d97706" stroke-width="3"/>
  <path class="s72-xcurve" d="M420 300 Q460 272 500 300 Q540 328 580 300 Q620 272 660 300 Q700 328 740 300 Q780 272 810 300" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="1.2">
    <line x1="440" y1="330" x2="440" y2="342"/><line x1="600" y1="330" x2="600" y2="342"/>
    <line x1="440" y1="338" x2="600" y2="338" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  </g>
  <text x="520" y="358" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">一个周期 T</text>
  <g>
    <line x1="650" y1="156" x2="680" y2="156" stroke="#d97706" stroke-width="3"/>
    <text x="690" y="160" font-size="11.5" font-weight="700" fill="#92400e">驱动力 F</text>
    <line x1="650" y1="178" x2="680" y2="178" stroke="#1d4ed8" stroke-width="3"/>
    <text x="690" y="182" font-size="11.5" font-weight="700" fill="#1e40af">位移 x</text>
  </g>
  <text x="595" y="382" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">瞬态结束后，位移按驱动力频率持续振动</text>

  <rect x="70" y="400" width="760" height="80" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="430" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">f受迫 = f驱（稳定后），与 f固 无关</text>
  <text x="450" y="458" font-size="12.5" fill="#334155" text-anchor="middle">驱动力频率改变时，受迫振动的振幅也随之改变</text>
</g>

<!-- 第三步：共振曲线与条件 -->
<g class="s72-step s72-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">共振：驱动力频率等于或接近固有频率时，振幅最大</text>

  <rect x="50" y="106" width="540" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="320" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">共振曲线</text>
  <line x1="90" y1="400" x2="575" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="420" x2="90" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="566" y="422" font-size="12" fill="#64748b" text-anchor="end">f</text>
  <text x="74" y="158" font-size="12" fill="#64748b" text-anchor="end">A</text>
  <path class="s72-rescurve" d="M100 395 C170 392 230 380 265 350 C300 318 325 235 350 175 C375 235 400 318 435 350 C470 380 520 392 560 397" fill="none" stroke="#1d4ed8" stroke-width="3.4"/>
  <line x1="350" y1="175" x2="350" y2="400" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="7 5"/>
  <circle class="s72-peak" cx="350" cy="175" r="5.5" fill="#dc2626"/>
  <text x="365" y="170" font-size="12" font-weight="800" fill="#b91c1c">振幅最大</text>
  <text x="350" y="422" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">f0（固有频率）</text>
  <rect x="108" y="150" width="178" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="197" y="174" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">条件：f驱 ≈ f固</text>
  <text x="320" y="252" font-size="11.5" fill="#475569" text-anchor="middle">f驱 偏离 f0 越远，振幅越小</text>

  <rect x="610" y="106" width="230" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="725" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">共振的利与害</text>
  <text x="630" y="162" font-size="12.5" font-weight="800" fill="#047857">利用共振</text>
  <text x="630" y="188" font-size="12" fill="#334155">共振筛</text>
  <text x="630" y="212" font-size="12" fill="#334155">声音共鸣器</text>
  <line x1="630" y1="232" x2="820" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="630" y="258" font-size="12.5" font-weight="800" fill="#b91c1c">防止共振</text>
  <text x="630" y="284" font-size="12" fill="#334155">部队过桥便步走</text>
  <text x="630" y="308" font-size="12" fill="#334155">机器避开共振转速</text>
  <text x="630" y="342" font-size="11.5" fill="#475569">共振曲线峰值越高，</text>
  <text x="630" y="362" font-size="11.5" fill="#475569">共振现象越强烈</text>
  <text x="630" y="396" font-size="11.5" fill="#475569">利用还是防止，</text>
  <text x="630" y="416" font-size="11.5" fill="#475569">要看具体场合</text>

  <rect x="70" y="452" width="760" height="36" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="476" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">驱动力频率远离固有频率时，受迫振动的振幅很小</text>
</g>
</svg>
