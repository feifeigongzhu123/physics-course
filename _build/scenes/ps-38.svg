<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="机械能守恒定律：动能与势能、守恒条件、初末状态列式">
<style>
[data-scene="ps-38"] .s38-step1,[data-scene="ps-38"] .s38-step2,[data-scene="ps-38"] .s38-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-38"].s1 .s38-step1,[data-scene="ps-38"].s2 .s38-step2,[data-scene="ps-38"].s3 .s38-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s38draw{to{stroke-dashoffset:0}}
@keyframes s38pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s38grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes s38pulse{0%,100%{opacity:.55}50%{opacity:1}}
[data-scene="ps-38"].s1 .s38-card{transform-box:fill-box;transform-origin:center;animation:s38pop .5s ease .2s both}
[data-scene="ps-38"].s1 .s38-bar{transform-box:fill-box;transform-origin:left center;animation:s38grow .8s ease .35s both}
[data-scene="ps-38"].s1 .s38-ball{animation:s38pulse 1.6s ease-in-out infinite}
[data-scene="ps-38"].s2 .s38-track{stroke-dasharray:360;stroke-dashoffset:360;animation:s38draw 1.1s ease .1s forwards}
[data-scene="ps-38"].s2 .s38-card{transform-box:fill-box;transform-origin:center;animation:s38pop .5s ease .25s both}
[data-scene="ps-38"].s2 .s38-rough{stroke-dasharray:200;stroke-dashoffset:200;animation:s38draw .9s ease .3s forwards}
[data-scene="ps-38"].s3 .s38-path{stroke-dasharray:520;stroke-dashoffset:520;animation:s38draw 1.2s ease .1s forwards}
[data-scene="ps-38"].s3 .s38-h{stroke-dasharray:250;stroke-dashoffset:250;animation:s38draw .8s ease .6s forwards}
[data-scene="ps-38"].s3 .s38-card{transform-box:fill-box;transform-origin:center;animation:s38pop .5s ease .5s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">机械能守恒定律：动能与势能的相互转化</text>

<!-- 第一步：机械能的组成 -->
<g class="s38-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 机械能 = 动能 + 势能</text>

  <line x1="70" y1="430" x2="560" y2="430" stroke="#cbd5e1" stroke-width="3"/>
  <path d="M80 190 Q 250 212 420 430" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle class="s38-ball" cx="110" cy="181" r="16" fill="#f97316" stroke="#c2410c" stroke-width="2"/>

  <line x1="72" y1="181" x2="72" y2="430" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="58" y="320" font-size="15" font-weight="900" fill="#475569" text-anchor="middle">h</text>
  <text x="142" y="196" font-size="12" font-weight="700" fill="#b45309">高处</text>
  <text x="330" y="404" font-size="12" font-weight="700" fill="#475569">低处</text>

  <g class="s38-card">
    <rect x="580" y="110" width="260" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="710" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">机械能</text>
    <text x="710" y="182" font-size="17" font-weight="900" fill="#b45309" text-anchor="middle">E = Ek + Ep</text>

    <text x="604" y="228" font-size="12" font-weight="800" fill="#b45309">Ek</text>
    <rect x="636" y="212" width="160" height="16" rx="8" fill="#f1f5f9"/>
    <rect class="s38-bar" x="636" y="212" width="96" height="16" rx="8" fill="#f97316"/>

    <text x="604" y="268" font-size="12" font-weight="800" fill="#1e40af">Ep</text>
    <rect x="636" y="252" width="160" height="16" rx="8" fill="#f1f5f9"/>
    <rect class="s38-bar" x="636" y="252" width="64" height="16" rx="8" fill="#1d4ed8"/>

    <text x="604" y="308" font-size="12" font-weight="800" fill="#047857">E</text>
    <rect x="636" y="292" width="160" height="16" rx="8" fill="#f1f5f9"/>
    <rect class="s38-bar" x="636" y="292" width="160" height="16" rx="8" fill="#059669"/>

    <line x1="610" y1="326" x2="810" y2="326" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="710" y="350" font-size="11.5" fill="#64748b" text-anchor="middle">动能与势能可以相互转化</text>
    <text x="710" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">势能包括重力势能和弹性势能</text>
    <text x="710" y="398" font-size="11.5" fill="#64748b" text-anchor="middle">机械能是状态量</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">机械能是动能、重力势能和弹性势能的总和</text>
</g>

<!-- 第二步：守恒条件 -->
<g class="s38-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 守恒条件：只有重力或弹力做功</text>

  <g class="s38-card">
    <rect x="70" y="110" width="360" height="330" rx="14" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="250" y="142" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">满足条件 → 机械能守恒</text>
    <circle cx="380" cy="176" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="182" font-size="17" font-weight="900" fill="#15803d" text-anchor="middle">✓</text>

    <path class="s38-track" d="M110 214 Q 230 220 390 300" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="132" cy="220" r="15" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <text x="250" y="190" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">光滑轨道</text>

    <text x="94" y="330" font-size="12" fill="#334155">• 只有重力做功</text>
    <text x="94" y="358" font-size="12" fill="#334155">• 只有弹力做功</text>
    <text x="94" y="386" font-size="12" fill="#334155">• 其他力做功的代数和为零</text>
  </g>

  <g class="s38-card">
    <rect x="470" y="110" width="360" height="330" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <text x="650" y="142" font-size="14" font-weight="800" fill="#b91c1c" text-anchor="middle">不满足 → 机械能不守恒</text>
    <circle cx="780" cy="176" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="780" y="182" font-size="17" font-weight="900" fill="#b91c1c" text-anchor="middle">✕</text>

    <line class="s38-rough" x1="500" y1="300" x2="700" y2="300" stroke="#64748b" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="2">
      <line x1="508" y1="300" x2="516" y2="312"/>
      <line x1="530" y1="300" x2="538" y2="312"/>
      <line x1="552" y1="300" x2="560" y2="312"/>
      <line x1="574" y1="300" x2="582" y2="312"/>
      <line x1="596" y1="300" x2="604" y2="312"/>
      <line x1="618" y1="300" x2="626" y2="312"/>
      <line x1="640" y1="300" x2="648" y2="312"/>
    </g>
    <rect x="560" y="244" width="70" height="56" rx="7" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <line x1="560" y1="286" x2="512" y2="286" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="524" y="276" font-size="12" font-weight="800" fill="#b91c1c">f</text>
    <text x="600" y="330" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">粗糙表面</text>

    <text x="494" y="358" font-size="12" fill="#334155">• 摩擦力做负功</text>
    <text x="494" y="386" font-size="12" fill="#334155">• 空气阻力做负功</text>
    <text x="494" y="414" font-size="12" fill="#334155">• 机械能转化为内能</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#b45309" text-anchor="middle">判断关键：除重力、弹力外，还有没有其他力做功</text>
</g>

<!-- 第三步：初末状态列式 -->
<g class="s38-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 选零势能面，列初末状态方程</text>

  <line x1="60" y1="430" x2="560" y2="430" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="540" y="418" font-size="12" font-weight="700" fill="#475569" text-anchor="end">零势能面</text>

  <path class="s38-path" d="M90 180 C 180 220 300 330 430 430" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <circle cx="105" cy="181" r="15" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="86" y="160" font-size="13" font-weight="800" fill="#b45309">状态 1</text>
  <line class="s38-h" x1="105" y1="181" x2="105" y2="430" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="90" y="330" font-size="14" font-weight="900" fill="#475569" text-anchor="end">h₁</text>
  <line x1="120" y1="195" x2="178" y2="224" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="184" y="222" font-size="12.5" font-weight="800" fill="#b91c1c">v₁</text>

  <circle cx="420" cy="415" r="15" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
  <text x="440" y="397" font-size="13" font-weight="800" fill="#b45309">状态 2</text>
  <line x1="420" y1="415" x2="420" y2="430" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="438" y="426" font-size="14" font-weight="900" fill="#475569">h₂</text>
  <line x1="436" y1="421" x2="506" y2="428" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="512" y="422" font-size="12.5" font-weight="800" fill="#b91c1c">v₂</text>

  <g class="s38-card">
    <rect x="570" y="110" width="270" height="310" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="705" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">列式步骤</text>
    <text x="600" y="180" font-size="12.5" fill="#334155">① 选好零势能面</text>
    <text x="600" y="212" font-size="12.5" fill="#334155">② 确定初状态：h₁、v₁</text>
    <text x="600" y="244" font-size="12.5" fill="#334155">③ 确定末状态：h₂、v₂</text>
    <line x1="600" y1="266" x2="810" y2="266" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="705" y="300" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">½mv₁² + mgh₁</text>
    <text x="705" y="332" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">= ½mv₂² + mgh₂</text>
    <text x="705" y="366" font-size="11.5" fill="#64748b" text-anchor="middle">初状态机械能 = 末状态机械能</text>
    <text x="705" y="390" font-size="11.5" fill="#64748b" text-anchor="middle">同一零势能面下比较</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">也可写成 ΔEk = −ΔEp：动能增加量等于势能减少量</text>
</g>
</svg>
