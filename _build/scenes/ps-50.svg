<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="实验：导体电阻率的测量，螺旋测微器与游标卡尺读数、伏安法测电阻、ρ 等于 RS 除以 L">
<style>
[data-scene="ps-50"] .s50-step1,[data-scene="ps-50"] .s50-step2,[data-scene="ps-50"] .s50-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-50"].s1 .s50-step1,[data-scene="ps-50"].s2 .s50-step2,[data-scene="ps-50"].s3 .s50-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s50flow{to{stroke-dashoffset:-40}}
@keyframes s50pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s50slide{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@keyframes s50glow{0%,100%{opacity:.5}50%{opacity:1}}
[data-scene="ps-50"].s1 .s50-card{transform-box:fill-box;transform-origin:center;animation:s50pop .5s ease both}
[data-scene="ps-50"].s1 .s50-thimble{transform-box:fill-box;transform-origin:center;animation:s50slide 2.4s ease-in-out infinite}
[data-scene="ps-50"].s1 .s50-wire{animation:s50glow 1.8s ease-in-out infinite}
[data-scene="ps-50"].s2 .s50-card{transform-box:fill-box;transform-origin:center;animation:s50pop .5s ease both}
[data-scene="ps-50"].s2 .s50-flow{stroke-dasharray:10 10;animation:s50flow 1.4s linear infinite}
[data-scene="ps-50"].s3 .s50-card1{transform-box:fill-box;transform-origin:center;animation:s50pop .45s ease both}
[data-scene="ps-50"].s3 .s50-card2{transform-box:fill-box;transform-origin:center;animation:s50pop .45s ease .12s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">实验：导体电阻率的测量 —— 测直径、测电阻、算 ρ</text>

<!-- 第一步：测直径 -->
<g class="s50-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 测直径：螺旋测微器与游标卡尺</text>

  <g class="s50-card">
    <rect x="40" y="104" width="500" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="290" y="130" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">螺旋测微器（估读到 0.001 mm）</text>

    <path d="M120 170 H82 Q50 170 50 202 V318 Q50 350 82 350 H120" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <rect x="120" y="236" width="36" height="44" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <rect class="s50-wire" x="156" y="253" width="50" height="10" rx="2" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
    <rect x="206" y="250" width="100" height="16" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="306" y="238" width="130" height="48" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <g stroke="#64748b" stroke-width="1.2">
      <line x1="320" y1="238" x2="320" y2="252"/><line x1="338" y1="238" x2="338" y2="252"/>
      <line x1="356" y1="238" x2="356" y2="252"/><line x1="374" y1="238" x2="374" y2="252"/>
      <line x1="392" y1="238" x2="392" y2="252"/><line x1="410" y1="238" x2="410" y2="252"/>
      <line x1="428" y1="238" x2="428" y2="252"/>
    </g>
    <line x1="306" y1="258" x2="436" y2="258" stroke="#475569" stroke-width="1.5"/>
    <rect class="s50-thimble" x="436" y="230" width="60" height="64" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <g stroke="#475569" stroke-width="1.3">
      <line x1="446" y1="236" x2="452" y2="246"/><line x1="460" y1="236" x2="466" y2="246"/>
      <line x1="474" y1="236" x2="480" y2="246"/><line x1="488" y1="236" x2="494" y2="246"/>
    </g>
    <text x="466" y="282" font-size="11" font-weight="800" fill="#c2410c" text-anchor="middle">20</text>
    <rect x="496" y="250" width="30" height="24" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>

    <text x="138" y="228" font-size="11" fill="#64748b" text-anchor="middle">测砧</text>
    <text x="181" y="290" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">金属丝 d</text>
    <text x="371" y="230" font-size="11" fill="#64748b" text-anchor="middle">固定刻度</text>
    <text x="466" y="220" font-size="11" fill="#c2410c" text-anchor="middle">可动刻度</text>
    <text x="256" y="300" font-size="11" fill="#64748b" text-anchor="middle">测微螺杆</text>
    <text x="511" y="296" font-size="11" fill="#64748b" text-anchor="middle">微调旋钮</text>

    <rect x="68" y="366" width="444" height="74" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="290" y="390" font-size="11.5" fill="#1e3a8a" text-anchor="middle">读数 = 固定刻度 + 可动刻度 × 0.01 mm</text>
    <text x="290" y="417" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">= 0.5 mm + 20.0×0.01 mm = 0.700 mm</text>
  </g>

  <g class="s50-card">
    <rect x="560" y="104" width="300" height="170" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="710" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">游标卡尺（20 分度）</text>
    <rect x="580" y="150" width="260" height="24" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <g stroke="#64748b" stroke-width="1.1">
      <line x1="592" y1="150" x2="592" y2="160"/><line x1="612" y1="150" x2="612" y2="160"/>
      <line x1="632" y1="150" x2="632" y2="160"/><line x1="652" y1="150" x2="652" y2="160"/>
      <line x1="672" y1="150" x2="672" y2="160"/><line x1="692" y1="150" x2="692" y2="160"/>
      <line x1="712" y1="150" x2="712" y2="160"/><line x1="732" y1="150" x2="732" y2="160"/>
      <line x1="752" y1="150" x2="752" y2="160"/><line x1="772" y1="150" x2="772" y2="160"/>
      <line x1="792" y1="150" x2="792" y2="160"/><line x1="812" y1="150" x2="812" y2="160"/>
      <line x1="832" y1="150" x2="832" y2="160"/>
    </g>
    <rect x="620" y="176" width="150" height="16" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <g stroke="#1d4ed8" stroke-width="1.1">
      <line x1="620" y1="192" x2="620" y2="184"/><line x1="632" y1="192" x2="632" y2="184"/>
      <line x1="644" y1="192" x2="644" y2="184"/><line x1="656" y1="192" x2="656" y2="184"/>
      <line x1="668" y1="192" x2="668" y2="184"/><line x1="680" y1="192" x2="680" y2="184"/>
      <line x1="692" y1="192" x2="692" y2="184"/><line x1="704" y1="192" x2="704" y2="184"/>
      <line x1="716" y1="192" x2="716" y2="184"/><line x1="728" y1="192" x2="728" y2="184"/>
      <line x1="740" y1="192" x2="740" y2="184"/><line x1="752" y1="192" x2="752" y2="184"/>
      <line x1="764" y1="192" x2="764" y2="184"/>
    </g>
    <text x="590" y="146" font-size="11" fill="#64748b">主尺</text>
    <text x="628" y="210" font-size="11" font-weight="800" fill="#1d4ed8">游标尺</text>
    <text x="710" y="238" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">精确度 0.05 mm，不估读</text>
    <text x="710" y="260" font-size="11" fill="#64748b" text-anchor="middle">看哪条刻线与主尺对齐</text>
  </g>

  <g class="s50-card">
    <rect x="560" y="288" width="300" height="166" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="710" y="314" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">读数与测量要点</text>
    <text x="580" y="342" font-size="11" fill="#334155">① 螺旋测微器估读到 0.001 mm</text>
    <text x="580" y="368" font-size="11" fill="#334155">② 金属丝不同位置测 3 次</text>
    <text x="580" y="394" font-size="11" fill="#334155">③ 游标卡尺 20 分度：0.05 mm</text>
    <text x="580" y="420" font-size="11" fill="#334155">④ 测量前看清量程和分度值</text>
    <text x="580" y="444" font-size="11" fill="#64748b">⑤ 记录数据要带单位</text>
  </g>

  <rect x="40" y="468" width="820" height="40" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="450" y="493" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">直径 d 很小，测量误差会被平方放大：必须多测几次取平均值</text>

  <text x="80" y="576" font-size="12" fill="#64748b">长度用刻度尺测量；直径用螺旋测微器；电阻用伏安法测量</text>
</g>

<!-- 第二步：伏安法 -->
<g class="s50-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 伏安法测金属丝的电阻</text>

  <g class="s50-card">
    <rect x="40" y="104" width="560" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="320" y="130" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">伏安法测电阻的电路</text>

    <path class="s50-flow" d="M90 170 H550 V380 H90 Z" fill="none" stroke="#1d4ed8" stroke-width="7" opacity=".16"/>
    <path d="M90 170 H150 M194 170 H320 M400 170 H550 V380 H90 V170" fill="none" stroke="#334155" stroke-width="4" stroke-linejoin="round"/>
    <line x1="150" y1="170" x2="188" y2="154" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="170" r="4" fill="#334155"/>
    <circle cx="194" cy="170" r="4" fill="#334155"/>
    <text x="166" y="148" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">S</text>

    <rect x="320" y="158" width="80" height="24" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="360" y="146" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">待测 R</text>

    <path d="M320 170 V252 H338 M382 252 H400 V170" fill="none" stroke="#334155" stroke-width="2.5"/>
    <circle cx="360" cy="252" r="22" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="360" y="258" font-size="12" font-weight="900" fill="#1d4ed8" text-anchor="middle">V</text>

    <circle cx="550" cy="280" r="22" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
    <text x="550" y="286" font-size="12" font-weight="900" fill="#b45309" text-anchor="middle">A</text>

    <rect x="350" y="368" width="100" height="24" rx="4" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
    <line x1="380" y1="356" x2="420" y2="404" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="400" y="360" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">R₀</text>

    <line x1="200" y1="362" x2="200" y2="398" stroke="#334155" stroke-width="5"/>
    <line x1="216" y1="368" x2="216" y2="392" stroke="#334155" stroke-width="5"/>
    <text x="200" y="424" font-size="11.5" fill="#64748b" text-anchor="middle">电源</text>
    <text x="400" y="430" font-size="11" fill="#64748b" text-anchor="middle">滑动变阻器</text>

    <polygon points="280,164 292,170 280,176" fill="#1d4ed8"/>
    <polygon points="544,330 550,342 556,330" fill="#1d4ed8"/>
    <polygon points="480,374 468,380 480,386" fill="#1d4ed8"/>
    <polygon points="84,260 90,248 96,260" fill="#1d4ed8"/>
  </g>

  <g class="s50-card">
    <rect x="620" y="104" width="240" height="350" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="740" y="132" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">内接还是外接</text>
    <text x="740" y="164" font-size="12" fill="#334155" text-anchor="middle">小电阻：电流表外接</text>
    <text x="740" y="190" font-size="12" fill="#334155" text-anchor="middle">大电阻：电流表内接</text>
    <text x="740" y="218" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">口诀：大内偏大</text>
    <text x="740" y="240" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">小外偏小</text>
    <line x1="650" y1="258" x2="830" y2="258" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="740" y="282" font-size="11.5" fill="#334155" text-anchor="middle">外接：电压表分流</text>
    <text x="740" y="304" font-size="11.5" fill="#334155" text-anchor="middle">测得的 R 偏小</text>
    <text x="740" y="330" font-size="11.5" fill="#334155" text-anchor="middle">内接：电流表分压</text>
    <text x="740" y="352" font-size="11.5" fill="#334155" text-anchor="middle">测得的 R 偏大</text>
    <line x1="650" y1="370" x2="830" y2="370" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="740" y="396" font-size="11.5" fill="#334155" text-anchor="middle">变阻器：限流、分压</text>
    <text x="740" y="428" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">R = U/I</text>
  </g>

  <rect x="40" y="468" width="820" height="40" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="493" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电压表测 U，电流表测 I，R = U/I；注意电表内阻带来的系统误差</text>

  <text x="80" y="576" font-size="12" fill="#64748b">小电阻用外接，大电阻用内接；滑动变阻器可用限流或分压接法</text>
</g>

<!-- 第三步：数据处理 -->
<g class="s50-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 数据处理：ρ = RS/L</text>

  <g class="s50-card1">
    <rect x="150" y="96" width="600" height="80" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="132" font-size="20" font-weight="900" fill="#b45309" text-anchor="middle">ρ = RS/L = πd²U/(4IL)</text>
    <text x="450" y="160" font-size="11.5" fill="#64748b" text-anchor="middle">S = πd²/4，d 为金属丝的直径</text>
  </g>

  <g class="s50-card2">
    <rect x="60" y="196" width="540" height="210" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="60" y="196" width="540" height="32" rx="12" fill="#eef2f7"/>
    <rect x="60" y="216" width="540" height="12" fill="#eef2f7"/>
    <g font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <text x="100" y="218">次数</text>
      <text x="200" y="218">L/m</text>
      <text x="320" y="218">d/mm</text>
      <text x="425" y="218">R/Ω</text>
      <text x="535" y="218">ρ/(Ω·m)</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1.2">
      <line x1="140" y1="196" x2="140" y2="406"/>
      <line x1="260" y1="196" x2="260" y2="406"/>
      <line x1="380" y1="196" x2="380" y2="406"/>
      <line x1="470" y1="196" x2="470" y2="406"/>
      <line x1="60" y1="270" x2="600" y2="270"/>
      <line x1="60" y1="312" x2="600" y2="312"/>
      <line x1="60" y1="354" x2="600" y2="354"/>
    </g>
    <g font-size="11.5" fill="#334155" text-anchor="middle">
      <text x="100" y="252">1</text>
      <text x="200" y="252">0.600</text>
      <text x="320" y="252">0.700</text>
      <text x="425" y="252">5.2</text>
      <text x="535" y="252">3.3×10⁻⁶</text>
      <text x="100" y="294">2</text>
      <text x="200" y="294">0.600</text>
      <text x="320" y="294">0.700</text>
      <text x="425" y="294">5.3</text>
      <text x="535" y="294">3.4×10⁻⁶</text>
      <text x="100" y="336">3</text>
      <text x="200" y="336">0.600</text>
      <text x="320" y="336">0.700</text>
      <text x="425" y="336">5.1</text>
      <text x="535" y="336">3.2×10⁻⁶</text>
    </g>
    <g font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <text x="100" y="386">平均</text>
      <text x="200" y="386">0.600</text>
      <text x="320" y="386">0.700</text>
      <text x="425" y="386">5.2</text>
      <text x="535" y="386">3.3×10⁻⁶</text>
    </g>
    <text x="330" y="426" font-size="11" fill="#64748b" text-anchor="middle">取平均值作为测量结果（表中数据为示例）</text>
  </g>

  <g class="s50-card2">
    <rect x="620" y="196" width="240" height="210" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="740" y="222" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">处理步骤</text>
    <text x="640" y="252" font-size="11" fill="#334155">① d 在不同位置测 3 次</text>
    <text x="640" y="278" font-size="11" fill="#334155">② 求平均 d，算 S = πd²/4</text>
    <text x="640" y="304" font-size="11" fill="#334155">③ R 用伏安法测量</text>
    <text x="640" y="330" font-size="11" fill="#334155">④ 代入 ρ = RS/L</text>
    <text x="640" y="356" font-size="11" fill="#334155">⑤ 可用 U–I 图线斜率求 R</text>
    <text x="640" y="382" font-size="11" fill="#334155">⑥ 多次测量减小偶然误差</text>
  </g>

  <rect x="60" y="424" width="800" height="58" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="460" y="448" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">直径 d 的误差在 S = πd²/4 中被平方放大</text>
  <text x="460" y="470" font-size="11.5" fill="#7c5a30" text-anchor="middle">所以 d 要多测几次，取平均值再代入计算</text>

  <text x="80" y="576" font-size="12" fill="#64748b">实验原理：ρ = RS/L；长度用刻度尺，直径用螺旋测微器，电阻用伏安法</text>
</g>
</svg>
