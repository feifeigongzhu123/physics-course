<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="氢原子光谱与玻尔模型：线状谱、能级与跃迁、hν 等于能级差">
<defs>
  <linearGradient id="s118rainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset=".25" stop-color="#3b82f6"/>
    <stop offset=".5" stop-color="#22c55e"/>
    <stop offset=".72" stop-color="#facc15"/>
    <stop offset="1" stop-color="#ef4444"/>
  </linearGradient>
</defs>
<style>
[data-scene="ps-118"] .s118-step1,[data-scene="ps-118"] .s118-step2,[data-scene="ps-118"] .s118-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-118"].s1 .s118-step1,[data-scene="ps-118"].s2 .s118-step2,[data-scene="ps-118"].s3 .s118-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s118fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes s118pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s118grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes s118pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes s118draw{to{stroke-dashoffset:0}}
[data-scene="ps-118"].s1 .s118-spec{transform-box:fill-box;transform-origin:left center;animation:s118grow .8s ease .2s both}
[data-scene="ps-118"].s1 .s118-line{opacity:0;animation:s118fade .4s ease forwards}
[data-scene="ps-118"].s1 .s118-l1{animation-delay:.6s}
[data-scene="ps-118"].s1 .s118-l2{animation-delay:.75s}
[data-scene="ps-118"].s1 .s118-l3{animation-delay:.9s}
[data-scene="ps-118"].s1 .s118-l4{animation-delay:1.05s}
[data-scene="ps-118"].s1 .s118-card{transform-box:fill-box;transform-origin:center;animation:s118pop .5s ease .4s both}
[data-scene="ps-118"].s2 .s118-lvl{transform-box:fill-box;transform-origin:left center;animation:s118grow .6s ease both}
[data-scene="ps-118"].s2 .s118-lvl2{animation-delay:.15s}
[data-scene="ps-118"].s2 .s118-lvl3{animation-delay:.3s}
[data-scene="ps-118"].s2 .s118-lvl4{animation-delay:.45s}
[data-scene="ps-118"].s2 .s118-arrow{opacity:0;animation:s118fade .45s ease both}
[data-scene="ps-118"].s2 .s118-a1{animation-delay:.75s}
[data-scene="ps-118"].s2 .s118-a2{animation-delay:.9s}
[data-scene="ps-118"].s2 .s118-a3{animation-delay:1.05s}
[data-scene="ps-118"].s2 .s118-card{transform-box:fill-box;transform-origin:center;animation:s118pop .5s ease .3s both}
[data-scene="ps-118"].s3 .s118-eq{transform-box:fill-box;transform-origin:center;animation:s118pop .55s ease .2s both}
[data-scene="ps-118"].s3 .s118-level{transform-box:fill-box;transform-origin:left center;animation:s118grow .6s ease .2s both}
[data-scene="ps-118"].s3 .s118-photon{stroke-dasharray:260;stroke-dashoffset:260;animation:s118draw .8s ease .8s forwards}
[data-scene="ps-118"].s3 .s118-card{transform-box:fill-box;transform-origin:center;animation:s118pop .5s ease .3s both}
[data-scene="ps-118"].s3 .s118-up{animation:s118pulse 1.6s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">氢原子光谱与玻尔模型</text>

<!-- 第一步：线状光谱 -->
<g class="s118-step1" data-zone="1">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 1 步 · 氢原子光谱是分立的线状谱</text>

  <text x="90" y="136" font-size="12.5" font-weight="800" fill="#475569">连续谱（如白炽灯）</text>
  <g class="s118-spec">
    <rect x="90" y="148" width="720" height="46" rx="6" fill="url(#s118rainbow)"/>
  </g>
  <text x="90" y="222" font-size="12.5" font-weight="800" fill="#475569">线状谱（氢原子）</text>
  <rect x="90" y="234" width="720" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <g class="s118-line s118-l1">
    <line x1="250" y1="242" x2="250" y2="290" stroke="#ef4444" stroke-width="5"/>
    <text x="250" y="322" font-size="11" fill="#64748b" text-anchor="middle">656 nm</text>
    <text x="250" y="338" font-size="11" fill="#b91c1c" text-anchor="middle">红</text>
  </g>
  <g class="s118-line s118-l2">
    <line x1="385" y1="242" x2="385" y2="290" stroke="#22d3ee" stroke-width="5"/>
    <text x="385" y="322" font-size="11" fill="#64748b" text-anchor="middle">486 nm</text>
    <text x="385" y="338" font-size="11" fill="#0e7490" text-anchor="middle">青</text>
  </g>
  <g class="s118-line s118-l3">
    <line x1="470" y1="242" x2="470" y2="290" stroke="#3b82f6" stroke-width="5"/>
    <text x="470" y="322" font-size="11" fill="#64748b" text-anchor="middle">434 nm</text>
    <text x="470" y="338" font-size="11" fill="#1d4ed8" text-anchor="middle">蓝</text>
  </g>
  <g class="s118-line s118-l4">
    <line x1="545" y1="242" x2="545" y2="290" stroke="#a855f7" stroke-width="5"/>
    <text x="545" y="322" font-size="11" fill="#64748b" text-anchor="middle">410 nm</text>
    <text x="545" y="338" font-size="11" fill="#7c3aed" text-anchor="middle">紫</text>
  </g>
  <text x="620" y="270" font-size="12" fill="#e2e8f0">可见光区的巴尔末系</text>

  <g class="s118-card">
    <rect x="90" y="362" width="720" height="84" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="110" y="390" font-size="12.5" fill="#334155">每种元素都有自己特有的谱线，谱线位置由原子内部结构决定。</text>
    <text x="110" y="416" font-size="12.5" fill="#334155">利用线状谱可以鉴别元素，这种方法叫光谱分析。</text>
    <text x="110" y="438" font-size="11.5" font-weight="800" fill="#b45309">分立谱线说明原子能量不能连续变化。</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">氢原子光谱是线状谱，经典电磁理论无法解释</text>
</g>

<!-- 第二步：能级与定态 -->
<g class="s118-step2" data-zone="2">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 2 步 · 玻尔模型：分立的能级与定态</text>

  <line x1="110" y1="430" x2="110" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="96" y="142" font-size="12" font-weight="800" fill="#475569" text-anchor="end">E</text>

  <g class="s118-lvl">
    <line x1="120" y1="410" x2="250" y2="410" stroke="#dc2626" stroke-width="3"/>
    <text x="262" y="414" font-size="11" fill="#334155">n=1   −13.6 eV</text>
  </g>
  <g class="s118-lvl s118-lvl2">
    <line x1="120" y1="340" x2="250" y2="340" stroke="#d97706" stroke-width="3"/>
    <text x="262" y="344" font-size="11" fill="#334155">n=2   −3.40 eV</text>
  </g>
  <g class="s118-lvl s118-lvl3">
    <line x1="120" y1="290" x2="250" y2="290" stroke="#2563eb" stroke-width="3"/>
    <text x="262" y="294" font-size="11" fill="#334155">n=3   −1.51 eV</text>
  </g>
  <g class="s118-lvl s118-lvl4">
    <line x1="120" y1="250" x2="250" y2="250" stroke="#7c3aed" stroke-width="3"/>
    <text x="262" y="254" font-size="11" fill="#334155">n=4   −0.85 eV</text>
  </g>

  <line class="s118-arrow s118-a1" x1="212" y1="260" x2="212" y2="330" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s118-arrow s118-a2" x1="234" y1="300" x2="234" y2="330" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line class="s118-arrow s118-a3" x1="212" y1="350" x2="212" y2="400" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="190" y="312" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">放出光子</text>

  <text x="120" y="444" font-size="11.5" fill="#64748b">能量越低越稳定，n=1 为基态</text>

  <g class="s118-card">
    <rect x="470" y="110" width="370" height="336" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="655" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">玻尔的三点假设</text>
    <circle cx="492" cy="176" r="10" fill="#dbeafe"/>
    <text x="492" y="180" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">1</text>
    <text x="510" y="174" font-size="12" font-weight="800" fill="#334155">定态假设</text>
    <text x="510" y="194" font-size="11.5" fill="#475569">电子只能在分立的轨道上运动，</text>
    <text x="510" y="212" font-size="11.5" fill="#475569">每个轨道对应确定的能量</text>

    <circle cx="492" cy="246" r="10" fill="#dbeafe"/>
    <text x="492" y="250" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">2</text>
    <text x="510" y="244" font-size="12" font-weight="800" fill="#334155">定态不辐射</text>
    <text x="510" y="264" font-size="11.5" fill="#475569">电子在定态轨道上运动时，</text>
    <text x="510" y="282" font-size="11.5" fill="#475569">不向外辐射能量</text>

    <circle cx="492" cy="316" r="10" fill="#dbeafe"/>
    <text x="492" y="320" font-size="11" font-weight="900" fill="#1d4ed8" text-anchor="middle">3</text>
    <text x="510" y="314" font-size="12" font-weight="800" fill="#334155">跃迁假设</text>
    <text x="510" y="334" font-size="11.5" fill="#475569">在不同定态间跃迁时，才辐射</text>
    <text x="510" y="352" font-size="11.5" fill="#475569">或吸收一定频率的光子</text>

    <line x1="490" y1="370" x2="820" y2="370" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="655" y="396" font-size="12" fill="#334155" text-anchor="middle">原子能量只能取分立值</text>
    <text x="655" y="420" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">这些分立的能量值叫能级</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">定态不辐射，只有在跃迁时才辐射或吸收光子</text>
</g>

<!-- 第三步：hν = E2 - E1 -->
<g class="s118-step3" data-zone="3">
  <text x="70" y="84" font-size="14" font-weight="800" fill="#1e3a8a">第 3 步 · 跃迁时 hν = E₂ − E₁</text>

  <text class="s118-eq" x="90" y="168" font-size="30" font-weight="900" fill="#1e3a8a">hν = E₂ − E₁</text>
  <text x="90" y="192" font-size="11.5" fill="#64748b">光子能量等于两能级之差</text>

  <g class="s118-level">
    <line x1="120" y1="250" x2="380" y2="250" stroke="#d97706" stroke-width="3"/>
    <text x="128" y="238" font-size="12" font-weight="800" fill="#b45309">E₂（激发态）</text>
    <line x1="120" y1="360" x2="380" y2="360" stroke="#dc2626" stroke-width="3"/>
    <text x="128" y="348" font-size="12" font-weight="800" fill="#b91c1c">E₁（基态）</text>
  </g>

  <circle cx="250" cy="250" r="10" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <line x1="250" y1="264" x2="250" y2="350" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="264" y="314" font-size="11.5" font-weight="700" fill="#b91c1c">电子跃迁</text>

  <path class="s118-photon" d="M 320 305 q 10 -18 20 0 q 10 18 20 0 q 10 -18 20 0 q 10 18 20 0 q 10 -18 20 0 q 10 18 20 0" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="400" y="288" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">光子 hν</text>

  <rect x="70" y="392" width="410" height="58" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="86" y="416" font-size="11.5" font-weight="800" fill="#92400e">例：氢原子 n=2 → n=1</text>
  <text x="86" y="438" font-size="12" fill="#78350f">hν = −3.40 − (−13.6) = 10.2 eV</text>

  <g class="s118-card">
    <rect x="510" y="110" width="330" height="342" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="675" y="142" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">能量关系</text>
    <text x="530" y="178" font-size="12" font-weight="800" fill="#b91c1c">辐射光子：高能级 → 低能级</text>
    <text x="530" y="204" font-size="13" font-weight="900" fill="#1e3a8a">hν = E₂ − E₁</text>
    <text x="530" y="228" font-size="11.5" fill="#475569">放出的光子带走能级差</text>
    <line x1="530" y1="246" x2="820" y2="246" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="274" font-size="12" font-weight="800" fill="#047857">吸收光子：低能级 → 高能级</text>
    <text x="530" y="300" font-size="11.5" fill="#475569">吸收的光子能量必须恰好</text>
    <text x="530" y="320" font-size="11.5" fill="#475569">等于两能级之差</text>
    <line x1="530" y1="338" x2="820" y2="338" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="530" y="366" font-size="12" fill="#334155">ν = （E₂ − E₁）/ h</text>
    <text x="530" y="392" font-size="11.5" fill="#334155">能级差越大，光子频率越高</text>
    <text x="530" y="416" font-size="11.5" fill="#334155">对应谱线波长越短</text>
    <text x="675" y="440" font-size="11" fill="#64748b" text-anchor="middle">10.2 eV 的光子属于紫外线</text>
  </g>

  <rect x="70" y="470" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="494" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">辐射或吸收的光子能量等于两能级之差</text>
</g>
</svg>
