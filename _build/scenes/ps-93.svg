<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="交变电流的描述：峰值与有效值、周期与频率、T与f的关系">
<style>
[data-scene="ps-93"] .s93-s1,[data-scene="ps-93"] .s93-s2,[data-scene="ps-93"] .s93-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-93"].s1 .s93-s1,[data-scene="ps-93"].s2 .s93-s2,[data-scene="ps-93"].s3 .s93-s3{opacity:1;visibility:visible}
@keyframes s93fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s93draw{to{stroke-dashoffset:0}}
@keyframes s93pop{0%{transform:scale(.86);opacity:0}70%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s93pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s93flow{to{stroke-dashoffset:-36}}
[data-scene="ps-93"].s1 .s93-curve{stroke-dasharray:620;stroke-dashoffset:620;animation:s93draw 1.4s ease .2s forwards}
[data-scene="ps-93"].s1 .s93-line{animation:s93fade .5s ease .9s both}
[data-scene="ps-93"].s1 .s93-card{transform-box:fill-box;transform-origin:center;animation:s93pop .55s ease .4s both}
[data-scene="ps-93"].s2 .s93-bracket{animation:s93fade .5s ease .7s both}
[data-scene="ps-93"].s2 .s93-pulse{animation:s93pulse 1.6s ease-in-out infinite}
[data-scene="ps-93"].s2 .s93-card{transform-box:fill-box;transform-origin:center;animation:s93pop .5s ease both}
[data-scene="ps-93"].s2 .s93-card2{animation-delay:.15s}
[data-scene="ps-93"].s3 .s93-wave{stroke-dasharray:8 6;animation:s93flow 1.2s linear infinite}
[data-scene="ps-93"].s3 .s93-pop{transform-box:fill-box;transform-origin:center;animation:s93pop .55s ease both}
[data-scene="ps-93"].s3 .s93-pop2{animation-delay:.15s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">交变电流的描述：峰值、有效值与周期频率</text>

<!-- 第一步：峰值和有效值 -->
<g class="s93-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">峰值是交流电的最大值，有效值按电流的热效应来规定</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">交流电的峰值与有效值</text>

  <line x1="110" y1="350" x2="110" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="268" x2="522" y2="268" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="100" y="160" font-size="12" font-weight="900" fill="#1e3a8a">u</text>
  <text x="520" y="290" font-size="11.5" font-weight="800" fill="#475569">t</text>

  <path class="s93-curve" d="M110 268 C127 206 183 206 200 268 C217 330 273 330 290 268 C307 206 363 206 380 268 C397 330 453 330 470 268" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <g class="s93-line">
    <line x1="110" y1="198" x2="500" y2="198" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="506" y="202" font-size="11.5" font-weight="800" fill="#b91c1c">Uₘ</text>
    <line x1="110" y1="338" x2="500" y2="338" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="500" y="342" font-size="11.5" font-weight="800" fill="#b91c1c">−Uₘ</text>
    <line x1="110" y1="218" x2="500" y2="218" stroke="#059669" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="506" y="222" font-size="11.5" font-weight="800" fill="#047857">U</text>
  </g>

  <text x="296" y="372" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">峰值 Uₘ：电压能达到的最大值</text>
  <text x="296" y="396" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">有效值 U：与直流电热效应等效的数值</text>
  <text x="296" y="420" font-size="11" fill="#64748b" text-anchor="middle">正弦式交流电：U 约为 Uₘ 的 0.707 倍</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">有效值的定义</text>

  <text x="598" y="176" font-size="11.5" font-weight="700" fill="#334155">让交流电和直流电分别通过</text>
  <text x="598" y="200" font-size="11.5" font-weight="700" fill="#334155">相同阻值的电阻，在相同时间</text>
  <text x="598" y="224" font-size="11.5" font-weight="700" fill="#334155">内产生相等的热量，这个直流</text>
  <text x="598" y="248" font-size="11.5" font-weight="700" fill="#334155">电的数值就是有效值。</text>

  <rect class="s93-card" x="596" y="266" width="248" height="58" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="292" font-size="20" font-weight="900" fill="#1e3a8a" text-anchor="middle">U = Uₘ / √2</text>
  <text x="720" y="314" font-size="11" fill="#475569" text-anchor="middle">≈ 0.707 Uₘ（仅正弦式）</text>

  <text x="598" y="350" font-size="11.5" font-weight="700" fill="#334155">同理：I = Iₘ / √2</text>
  <text x="598" y="376" font-size="11.5" fill="#b45309">非正弦式交流电不能套用此式</text>
  <text x="598" y="400" font-size="11.5" fill="#64748b">有效值由热效应定义，是等效值</text>
  <text x="598" y="424" font-size="11" fill="#64748b">计算电热、电功率必须用有效值</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">正弦式交流电：U = Uₘ/√2，I = Iₘ/√2，有效值按热效应定义</text>
</g>

<!-- 第二步：周期和频率 -->
<g class="s93-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">周期是完成一次周期性变化的时间，频率是每秒变化的次数</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="236" height="28" rx="14" fill="#e8effc"/>
  <text x="174" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">周期 T 在图像上的表示</text>

  <line x1="110" y1="330" x2="110" y2="150" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="250" x2="522" y2="250" stroke="#475569" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="100" y="160" font-size="12" font-weight="900" fill="#1e3a8a">i</text>
  <text x="520" y="272" font-size="11.5" font-weight="800" fill="#475569">t</text>

  <path class="s93-curve" d="M110 250 C127 188 183 188 200 250 C217 312 273 312 290 250 C307 188 363 188 380 250 C397 312 453 312 470 250" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <g class="s93-bracket" stroke="#dc2626" stroke-width="2">
    <line x1="110" y1="330" x2="290" y2="330"/>
    <line x1="110" y1="322" x2="110" y2="338"/>
    <line x1="290" y1="322" x2="290" y2="338"/>
  </g>
  <text x="200" y="356" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="middle">T</text>
  <text class="s93-pulse" x="200" y="382" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">完成一次周期性变化</text>

  <line x1="110" y1="250" x2="110" y2="300" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="290" y1="250" x2="290" y2="300" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="470" y1="250" x2="470" y2="300" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="110" y="316" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">0</text>
  <text x="290" y="316" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">T</text>
  <text x="470" y="316" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">2T</text>

  <text x="296" y="410" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">周期 T 越小，频率 f 越高，电流变化越快</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">周期与频率</text>

  <g class="s93-card">
    <rect x="596" y="158" width="248" height="56" rx="10" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="608" y="180" font-size="11.5" font-weight="800" fill="#1e3a8a">周期 T</text>
    <text x="608" y="202" font-size="11" fill="#475569">完成一次变化的时间，单位 s</text>
  </g>
  <g class="s93-card s93-card2">
    <rect x="596" y="224" width="248" height="56" rx="10" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="608" y="246" font-size="11.5" font-weight="800" fill="#1e3a8a">频率 f</text>
    <text x="608" y="268" font-size="11" fill="#475569">1 s 内变化的次数，单位 Hz</text>
  </g>

  <rect x="596" y="292" width="248" height="42" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="320" font-size="18" font-weight="900" fill="#1e3a8a" text-anchor="middle">T = 1 / f</text>

  <text x="598" y="356" font-size="11.5" font-weight="700" fill="#b45309">我国民用交流电：f = 50 Hz</text>
  <text x="598" y="380" font-size="11.5" font-weight="700" fill="#334155">则 T = 0.02 s，1 s 内 50 个周期</text>
  <text x="598" y="404" font-size="11.5" font-weight="700" fill="#dc2626">电流方向每秒改变 100 次</text>
  <text x="598" y="426" font-size="11" fill="#64748b">一个周期内方向改变两次</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">周期和频率互为倒数；我国交流电 f = 50 Hz，T = 0.02 s</text>
</g>

<!-- 第三步：T 与 f 的关系及有效值应用 -->
<g class="s93-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">T 与 f 互为倒数：频率越高，周期越短，变化越快</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">不同频率的交流电图像</text>

  <text x="70" y="168" font-size="11.5" font-weight="800" fill="#b45309">f 小 → T 长 → 变化慢</text>
  <line x1="110" y1="240" x2="110" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="210" x2="510" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path class="s93-wave" d="M110 210 C150 178 190 178 230 210 C270 242 310 242 350 210 C390 178 430 178 470 210" fill="none" stroke="#b45309" stroke-width="2.6"/>
  <text x="296" y="250" font-size="11" fill="#92400e" text-anchor="middle">周期长，频率低</text>

  <text x="70" y="294" font-size="11.5" font-weight="800" fill="#1d4ed8">f 大 → T 短 → 变化快</text>
  <line x1="110" y1="376" x2="110" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="90" y1="344" x2="510" y2="344" stroke="#475569" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <path class="s93-wave" d="M110 344 C130 316 150 316 170 344 C190 372 210 372 230 344 C250 316 270 316 290 344 C310 372 330 372 350 344 C370 316 390 316 410 344 C430 372 450 372 470 344" fill="none" stroke="#1d4ed8" stroke-width="2.6"/>
  <text x="296" y="386" font-size="11" fill="#1e40af" text-anchor="middle">周期短，频率高</text>

  <text x="296" y="416" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">相同时间内，频率越高，周期性变化次数越多</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="196" height="28" rx="14" fill="#e8effc"/>
  <text x="694" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">换算与有效值应用</text>

  <g class="s93-pop">
    <rect x="596" y="158" width="248" height="44" rx="9" fill="#e8effc"/>
    <text x="720" y="186" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">f = 1/T　　T = 1/f</text>
  </g>

  <text x="598" y="226" font-size="11.5" font-weight="700" fill="#334155">50 Hz ↔ 0.02 s</text>
  <text x="598" y="250" font-size="11.5" font-weight="700" fill="#334155">100 Hz ↔ 0.01 s</text>
  <text x="598" y="274" font-size="11.5" font-weight="700" fill="#334155">25 Hz ↔ 0.04 s</text>

  <g class="s93-pop s93-pop2">
    <rect x="596" y="288" width="248" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="608" y="310" font-size="11.5" font-weight="800" fill="#047857">有效值用在哪里？</text>
    <text x="608" y="332" font-size="11" fill="#065f46">电表示数、铭牌额定值</text>
    <text x="608" y="352" font-size="11" fill="#065f46">电热、电功率的计算</text>
  </g>

  <rect x="596" y="374" width="248" height="44" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="392" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">电容器耐压要看峰值</text>
  <text x="720" y="410" font-size="11" fill="#92400e" text-anchor="middle">电压超过峰值可能击穿</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">T 与 f 互为倒数；电表示数和功率计算用有效值，耐压用峰值</text>
</g>
</svg>
