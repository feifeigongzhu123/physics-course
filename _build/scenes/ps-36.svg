<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="重力势能：Ep 等于 mgh、相对性与重力做功和路径无关">
<style>
[data-scene="ps-36"] .s36-step1,[data-scene="ps-36"] .s36-step2,[data-scene="ps-36"] .s36-step3{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-36"].s1 .s36-step1,[data-scene="ps-36"].s2 .s36-step2,[data-scene="ps-36"].s3 .s36-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s36draw{to{stroke-dashoffset:0}}
@keyframes s36pop{0%{transform:scale(.86);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes s36rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes s36grow{from{transform:scaleY(.2);opacity:.4}to{transform:scaleY(1);opacity:1}}
@keyframes s36glow{0%,100%{opacity:.35}50%{opacity:.85}}
[data-scene="ps-36"].s1 .s36-obj{transform-box:fill-box;transform-origin:center;animation:s36rise .7s ease both}
[data-scene="ps-36"].s1 .s36-h{stroke-dasharray:200;stroke-dashoffset:200;animation:s36draw 1s ease .3s both}
[data-scene="ps-36"].s1 .s36-bar{transform-box:fill-box;transform-origin:center bottom;animation:s36grow .8s ease .5s both}
[data-scene="ps-36"].s1 .s36-card{transform-box:fill-box;transform-origin:center;animation:s36pop .5s ease .6s both}
[data-scene="ps-36"].s2 .s36-plane{stroke-dasharray:700;stroke-dashoffset:700;animation:s36draw 1.2s ease both}
[data-scene="ps-36"].s2 .s36-val{transform-box:fill-box;transform-origin:center;animation:s36pop .45s ease both}
[data-scene="ps-36"].s2 .s36-table{transform-box:fill-box;transform-origin:center;animation:s36pop .5s ease .2s both}
[data-scene="ps-36"].s3 .s36-path{stroke-dasharray:700;stroke-dashoffset:700;animation:s36draw 1.5s ease both}
[data-scene="ps-36"].s3 .s36-path2{stroke-dasharray:700;stroke-dashoffset:700;animation:s36draw 1.5s ease .35s both}
[data-scene="ps-36"].s3 .s36-path3{stroke-dasharray:700;stroke-dashoffset:700;animation:s36draw 1.5s ease .7s both}
[data-scene="ps-36"].s3 .s36-card{transform-box:fill-box;transform-origin:center;animation:s36pop .5s ease 1s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">重力势能：Ep = mgh、相对性与重力做功</text>

<!-- 第一步：重力势能的大小 -->
<g class="s36-step1" data-zone="1">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">物体由于被举高而具有的能量：Ep = mgh</text>

  <line x1="70" y1="470" x2="470" y2="470" stroke="#94a3b8" stroke-width="3.5"/>
  <text x="90" y="494" font-size="12" fill="#64748b">地面</text>

  <g class="s36-obj">
    <rect x="255" y="250" width="96" height="66" rx="7" fill="#60a5fa" stroke="#1e40af" stroke-width="2.5"/>
    <text x="303" y="290" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">m</text>
    <line x1="303" y1="330" x2="303" y2="378" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
    <text x="316" y="360" font-size="13" font-weight="800" fill="#b91c1c">mg</text>
  </g>

  <line class="s36-h" x1="190" y1="316" x2="190" y2="466" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="168" y="400" font-size="14" font-weight="900" fill="#6d28d9">h</text>
  <text x="303" y="228" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">举高 h</text>

  <g class="s36-bar">
    <rect x="398" y="366" width="36" height="104" rx="5" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="398" y="424" width="36" height="46" rx="5" fill="#7c3aed"/>
  </g>
  <text x="416" y="352" font-size="11.5" font-weight="800" fill="#6d28d9" text-anchor="middle">Ep</text>

  <g class="s36-card">
    <rect x="500" y="104" width="330" height="272" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="665" y="134" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">重力势能公式</text>
    <text x="665" y="184" font-size="30" font-weight="900" font-style="italic" fill="#1e3a8a" text-anchor="middle">Ep = mgh</text>
    <g font-size="12" fill="#334155" text-anchor="middle">
      <text x="665" y="214">m：物体质量（kg）</text>
      <text x="665" y="238">g：重力加速度（m/s²）</text>
      <text x="665" y="262">h：相对零势能面的高度（m）</text>
    </g>
    <line x1="524" y1="280" x2="806" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="665" y="308" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">单位：焦耳（J），1 J = 1 kg·m²/s²</text>
    <text x="665" y="334" font-size="12" fill="#334155" text-anchor="middle">重力势能是标量，只有大小没有方向</text>
    <text x="665" y="358" font-size="12" fill="#64748b" text-anchor="middle">是地球与物体组成的系统共有的能量</text>
  </g>

  <rect x="500" y="392" width="330" height="96" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="665" y="420" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">质量越大、位置越高</text>
  <text x="665" y="444" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">重力势能就越大</text>
  <text x="665" y="470" font-size="11.5" fill="#64748b" text-anchor="middle">同一高度，质量翻倍，Ep 也翻倍</text>

  <text x="80" y="576" font-size="12" fill="#64748b">重力势能由质量、重力加速度和高度共同决定</text>
</g>

<!-- 第二步：重力势能的相对性 -->
<g class="s36-step2" data-zone="2">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">Ep 具有相对性：零势能面选得不同，数值就不同</text>

  <line class="s36-plane" x1="110" y1="206" x2="700" y2="206" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="9 6"/>
  <text x="706" y="210" font-size="12" font-weight="800" fill="#6d28d9">楼顶（零势能面 C）</text>

  <line class="s36-plane" x1="110" y1="490" x2="700" y2="490" stroke="#94a3b8" stroke-width="3"/>
  <text x="706" y="494" font-size="12" font-weight="800" fill="#475569">地面（零势能面 A）</text>

  <g class="s36-table">
    <rect x="286" y="330" width="300" height="14" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <rect x="306" y="344" width="14" height="146" fill="#d6a35c"/>
    <rect x="552" y="344" width="14" height="146" fill="#d6a35c"/>
    <text x="436" y="366" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">桌面（零势能面 B）</text>
  </g>

  <g class="s36-obj">
    <rect x="396" y="272" width="80" height="58" rx="6" fill="#60a5fa" stroke="#1e40af" stroke-width="2.5"/>
    <text x="436" y="308" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">m</text>
  </g>

  <line x1="240" y1="272" x2="240" y2="330" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="226" y="300" font-size="11.5" font-weight="800" fill="#6d28d9" text-anchor="end">h</text>
  <line x1="240" y1="330" x2="240" y2="490" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="6 4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>

  <g class="s36-val">
    <text x="706" y="242" font-size="12" font-weight="800" fill="#b91c1c">以楼顶为零：Ep 为负值</text>
    <text x="706" y="266" font-size="11.5" fill="#b91c1c">Ep = −mg(H − h)</text>
    <text x="706" y="322" font-size="12" font-weight="800" fill="#047857">以桌面为零：Ep = 0</text>
    <text x="706" y="346" font-size="11.5" fill="#047857">物体就在零势能面上</text>
    <text x="706" y="446" font-size="12" font-weight="800" fill="#1d4ed8">以地面为零：Ep 为正值</text>
    <text x="706" y="470" font-size="11.5" fill="#1d4ed8">Ep = mgh，通常这样选</text>
  </g>

  <rect x="70" y="500" width="760" height="26" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="450" y="519" font-size="11.5" font-weight="700" fill="#7c5a30" text-anchor="middle">数值随零势能面改变，但两点之间重力势能的变化量 ΔEp 是确定的</text>

  <text x="80" y="576" font-size="12" fill="#64748b">比较重力势能大小时，必须先说明是相对哪个零势能面</text>
</g>

<!-- 第三步：重力做功与路径无关 -->
<g class="s36-step3" data-zone="3">
  <text x="70" y="86" font-size="14" font-weight="800" fill="#1e3a8a">重力做功只跟初末位置的高度差有关，与路径无关</text>

  <line x1="200" y1="180" x2="600" y2="180" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <line x1="200" y1="470" x2="600" y2="470" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="6 5"/>

  <path class="s36-path" d="M240 180 L560 470" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path class="s36-path2" d="M240 180 H400 V300 H520 V470 H560" fill="none" stroke="#d97706" stroke-width="2.8"/>
  <path class="s36-path3" d="M240 180 C 360 200, 470 380, 560 470" fill="none" stroke="#7c3aed" stroke-width="2.8"/>

  <g class="s36-obj">
    <rect x="222" y="160" width="36" height="28" rx="5" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <text x="240" y="180" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  </g>
  <g class="s36-obj">
    <rect x="542" y="462" width="36" height="28" rx="5" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>
    <text x="560" y="482" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">B</text>
  </g>

  <line x1="170" y1="180" x2="170" y2="470" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="7 5" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="156" y="330" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="end">h</text>
  <text x="176" y="150" font-size="11.5" fill="#64748b">高</text>
  <text x="176" y="496" font-size="11.5" fill="#64748b">低</text>

  <text x="366" y="170" font-size="12" font-weight="800" fill="#1d4ed8">路径1</text>
  <text x="430" y="296" font-size="12" font-weight="800" fill="#b45309">路径2</text>
  <text x="404" y="414" font-size="12" font-weight="800" fill="#6d28d9">路径3</text>

  <g class="s36-card">
    <rect x="632" y="112" width="198" height="358" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="731" y="142" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">重力做功</text>
    <text x="731" y="180" font-size="19" font-weight="900" font-style="italic" fill="#1e3a8a" text-anchor="middle">W_G = mgh</text>
    <text x="731" y="208" font-size="11.5" fill="#64748b" text-anchor="middle">h 为初末高度差</text>
    <line x1="654" y1="224" x2="808" y2="224" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="731" y="250" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">三种路径做功相同</text>
    <text x="731" y="274" font-size="11.5" fill="#334155" text-anchor="middle">只由高度差决定</text>
    <line x1="654" y1="290" x2="808" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="731" y="316" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">做正功：Ep 减少</text>
    <text x="731" y="338" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">做负功：Ep 增加</text>
    <line x1="654" y1="354" x2="808" y2="354" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="731" y="382" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">W_G = −ΔEp</text>
    <text x="731" y="406" font-size="11.5" fill="#64748b" text-anchor="middle">重力是保守力</text>
    <text x="731" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">才能定义重力势能</text>
  </g>

  <rect x="70" y="500" width="540" height="26" rx="8" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="340" y="519" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">只要初末位置相同，沿哪条路径走，重力做功都一样</text>

  <text x="80" y="576" font-size="12" fill="#64748b">注意区分：重力做功看高度差，路程长短不影响结果</text>
</g>
</svg>
