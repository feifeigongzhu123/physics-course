<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="家庭电路：进户线、电能表、总开关、火线零线地线、开关接火线与试电笔">
<style>
.p70-s1,.p70-s2,.p70-s3{opacity:0;visibility:hidden}
.p70-s1{opacity:1;visibility:visible}
[data-scene="pj-70"] .p70-s1,[data-scene="pj-70"] .p70-s2,[data-scene="pj-70"] .p70-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-70"].s1 .p70-s1,[data-scene="pj-70"].s2 .p70-s2,[data-scene="pj-70"].s3 .p70-s3{opacity:1;visibility:visible}
@keyframes p70pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p70slide{0%{transform:translateX(-10px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes p70glow{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes p70dash{to{stroke-dashoffset:-30}}
[data-scene="pj-70"].s1 .p70-box{transform-box:fill-box;transform-origin:center;animation:p70pop .5s ease both}
[data-scene="pj-70"].s1 .p70-box2{animation-delay:.12s}
[data-scene="pj-70"].s1 .p70-box3{animation-delay:.24s}
[data-scene="pj-70"].s1 .p70-box4{animation-delay:.36s}
[data-scene="pj-70"].s1 .p70-box5{animation-delay:.48s}
[data-scene="pj-70"].s2 .p70-wire{stroke-dasharray:8 6;animation:p70dash 1.4s linear infinite}
[data-scene="pj-70"].s2 .p70-lamp{transform-box:fill-box;transform-origin:center;animation:p70pop .6s ease both}
[data-scene="pj-70"].s2 .p70-socket{transform-box:fill-box;transform-origin:center;animation:p70pop .55s ease .15s both}
[data-scene="pj-70"].s3 .p70-pen{transform-box:fill-box;transform-origin:left center;animation:p70slide .6s ease both}
[data-scene="pj-70"].s3 .p70-neon{animation:p70glow 1.5s ease-in-out infinite}
[data-scene="pj-70"].s3 .p70-rule{transform-box:fill-box;transform-origin:left center;animation:p70slide .5s ease both}
[data-scene="pj-70"].s3 .p70-rule2{animation-delay:.12s}
[data-scene="pj-70"].s3 .p70-rule3{animation-delay:.24s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">家庭电路：进户线、电能表、总开关与安全连接</text>

<!-- 第一步：家庭电路的组成 -->
<g class="p70-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">家庭电路由进户线、电能表、总开关、保险装置、用电器等组成</text>

  <g class="p70-box">
    <rect x="40" y="116" width="128" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="104" y="142" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">进户线</text>
    <text x="104" y="161" font-size="11" fill="#64748b" text-anchor="middle">火线 + 零线</text>
  </g>
  <g class="p70-box p70-box2">
    <rect x="190" y="116" width="128" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="254" y="142" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">电能表</text>
    <text x="254" y="161" font-size="11" fill="#64748b" text-anchor="middle">计量消耗电能</text>
  </g>
  <g class="p70-box p70-box3">
    <rect x="340" y="116" width="128" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="404" y="142" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">总开关</text>
    <text x="404" y="161" font-size="11" fill="#64748b" text-anchor="middle">控制整个电路</text>
  </g>
  <g class="p70-box p70-box4">
    <rect x="490" y="116" width="128" height="56" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
    <text x="554" y="142" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">保险装置</text>
    <text x="554" y="161" font-size="11" fill="#64748b" text-anchor="middle">电流过大时切断</text>
  </g>
  <g class="p70-box p70-box5">
    <rect x="640" y="116" width="220" height="56" rx="12" fill="#e6f7f1" stroke="#a7f3d0" stroke-width="2"/>
    <text x="750" y="142" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">用电器 · 插座 · 开关</text>
    <text x="750" y="161" font-size="11" fill="#64748b" text-anchor="middle">消耗电能，并联接入电路</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2.5" fill="none">
    <line x1="168" y1="144" x2="188" y2="144" marker-end="url(#arrBlue)"/>
    <line x1="318" y1="144" x2="338" y2="144" marker-end="url(#arrBlue)"/>
    <line x1="468" y1="144" x2="488" y2="144" marker-end="url(#arrBlue)"/>
    <line x1="618" y1="144" x2="638" y2="144" marker-end="url(#arrBlue)"/>
  </g>

  <rect x="60" y="200" width="780" height="190" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="80" y="228" font-size="13" font-weight="800" fill="#1e3a8a">进户线与电压</text>

  <line x1="110" y1="270" x2="810" y2="270" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="310" x2="810" y2="310" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
  <line x1="110" y1="350" x2="810" y2="350" stroke="#059669" stroke-width="3" stroke-dasharray="10 7" stroke-linecap="round"/>

  <text x="118" y="261" font-size="11.5" font-weight="800" fill="#b91c1c">L 火线</text>
  <text x="118" y="301" font-size="11.5" font-weight="800" fill="#1e40af">N 零线</text>
  <text x="118" y="341" font-size="11.5" font-weight="800" fill="#047857">PE 地线</text>

  <line x1="170" y1="272" x2="170" y2="308" stroke="#dc2626" stroke-width="2"/>
  <polygon points="170,268 165,278 175,278" fill="#dc2626"/>
  <polygon points="170,312 165,302 175,302" fill="#dc2626"/>
  <text x="182" y="296" font-size="12.5" font-weight="900" fill="#b91c1c">220 V</text>

  <text x="790" y="261" font-size="11" fill="#64748b" text-anchor="end">火线与零线之间</text>
  <text x="790" y="301" font-size="11" fill="#64748b" text-anchor="end">零线正常时不带电</text>
  <text x="790" y="341" font-size="11" fill="#64748b" text-anchor="end">地线与大地相连</text>

  <text x="450" y="380" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">家庭电路各用电器并联，开关与它控制的用电器串联</text>
</g>

<!-- 第二步：开关、螺口灯泡与三孔插座 -->
<g class="p70-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">开关接在火线与用电器之间；螺口灯泡螺旋套接零线；三孔插座接地</text>

  <rect x="36" y="100" width="420" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">开关与螺口灯泡</text>

  <path d="M70 160 H250" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <circle cx="250" cy="160" r="4" fill="#dc2626"/>
  <circle cx="282" cy="160" r="4" fill="#dc2626"/>
  <line x1="250" y1="160" x2="280" y2="142" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M282 160 H300 V226" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <text x="266" y="128" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">开关接火线</text>

  <g class="p70-lamp">
    <rect x="276" y="226" width="48" height="34" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <line x1="280" y1="236" x2="321" y2="236" stroke="#64748b" stroke-width="1.5"/>
    <line x1="280" y1="246" x2="321" y2="246" stroke="#64748b" stroke-width="1.5"/>
    <line x1="280" y1="256" x2="321" y2="256" stroke="#64748b" stroke-width="1.5"/>
    <rect x="288" y="260" width="24" height="14" fill="#94a3b8"/>
    <circle cx="300" cy="314" r="42" fill="#fef9c3" stroke="#eab308" stroke-width="3"/>
    <path d="M284 304 q8 -14 16 0 q8 14 16 0" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#facc15" stroke-width="2.5" stroke-linecap="round">
      <line x1="252" y1="292" x2="238" y2="284"/>
      <line x1="348" y1="292" x2="362" y2="284"/>
      <line x1="252" y1="338" x2="238" y2="346"/>
      <line x1="348" y1="338" x2="362" y2="346"/>
    </g>
  </g>

  <path d="M70 380 H240 V256 H276" fill="none" stroke="#1d4ed8" stroke-width="3.5"/>
  <text x="150" y="366" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">零线接螺旋套</text>

  <text x="246" y="400" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">螺口灯泡：中心接火线，螺旋套接零线</text>

  <rect x="476" y="100" width="388" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="496" y="116" width="200" height="28" rx="14" fill="#e6f7f1"/>
  <text x="596" y="135" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">三孔插座</text>

  <g class="p70-socket">
    <rect x="580" y="150" width="180" height="170" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <rect x="660" y="176" width="20" height="10" rx="3" fill="#059669"/>
    <text x="722" y="186" font-size="11" font-weight="800" fill="#047857">接地</text>
    <circle cx="620" cy="260" r="8" fill="#1d4ed8"/>
    <text x="606" y="265" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">零</text>
    <circle cx="720" cy="260" r="8" fill="#dc2626"/>
    <text x="734" y="265" font-size="11.5" font-weight="800" fill="#b91c1c">火</text>
  </g>

  <path d="M670 188 V336" fill="none" stroke="#059669" stroke-width="3"/>
  <path d="M620 268 V336" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <path d="M720 268 V336" fill="none" stroke="#dc2626" stroke-width="3"/>

  <text x="670" y="358" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">左零右火上接地</text>
  <text x="670" y="382" font-size="11.5" fill="#64748b" text-anchor="middle">接地线防止漏电，保护人身安全</text>
</g>

<!-- 第三步：试电笔 -->
<g class="p70-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">试电笔辨别火线与零线：手触笔尾金属体，笔尖接触导线</text>

  <rect x="36" y="100" width="420" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="200" height="28" rx="14" fill="#e8effc"/>
  <text x="156" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">试电笔的结构</text>

  <g class="p70-pen">
    <polygon points="70,230 100,221 100,239" fill="#94a3b8"/>
    <rect x="100" y="226" width="80" height="8" fill="#94a3b8"/>
    <rect x="180" y="212" width="140" height="36" rx="18" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M196 230 l6 -8 l6 16 l6 -16 l6 16 l6 -16 l6 8" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
    <rect class="p70-neon" x="250" y="220" width="40" height="20" rx="10" fill="#fca5a5" stroke="#ef4444" stroke-width="2"/>
    <path d="M294 230 l6 -8 l6 16 l6 -16 l6 16 l6 -8" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="320" y="218" width="36" height="24" rx="6" fill="#94a3b8"/>
    <rect x="356" y="206" width="56" height="48" rx="16" fill="#fcd5ce" stroke="#d6a29a" stroke-width="2"/>
    <line x1="366" y1="222" x2="402" y2="222" stroke="#d6a29a" stroke-width="1.5"/>
    <line x1="366" y1="238" x2="402" y2="238" stroke="#d6a29a" stroke-width="1.5"/>
  </g>

  <text x="100" y="202" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">笔尖金属体</text>
  <text x="270" y="206" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">氖管</text>
  <text x="384" y="190" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">手接触笔尾金属体</text>

  <line x1="60" y1="322" x2="420" y2="322" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <text x="240" y="310" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">接触火线 → 氖管发光</text>
  <line x1="60" y1="368" x2="420" y2="368" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <text x="240" y="358" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">接触零线 → 氖管不发光</text>
  <text x="240" y="396" font-size="11" fill="#64748b" text-anchor="middle">发光的是火线，不发光的是零线或地线</text>

  <rect x="476" y="100" width="388" height="304" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="496" y="116" width="180" height="28" rx="14" fill="#e8effc"/>
  <text x="586" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">使用要点</text>

  <g class="p70-rule">
    <rect x="496" y="152" width="348" height="52" rx="10" fill="#f8fbff"/>
    <circle cx="516" cy="178" r="12" fill="#e8effc"/>
    <text x="516" y="183" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">1</text>
    <text x="538" y="174" font-size="12" font-weight="800" fill="#1e3a8a">手接触笔尾金属体</text>
    <text x="538" y="194" font-size="11" fill="#64748b">否则氖管不亮，无法判断</text>
  </g>
  <g class="p70-rule p70-rule2">
    <rect x="496" y="208" width="348" height="52" rx="10" fill="#f8fbff"/>
    <circle cx="516" cy="234" r="12" fill="#e8effc"/>
    <text x="516" y="239" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">2</text>
    <text x="538" y="230" font-size="12" font-weight="800" fill="#1e3a8a">笔尖接触待测导线</text>
    <text x="538" y="250" font-size="11" fill="#64748b">氖管发光的是火线</text>
  </g>
  <g class="p70-rule p70-rule3">
    <rect x="496" y="264" width="348" height="52" rx="10" fill="#f8fbff"/>
    <circle cx="516" cy="290" r="12" fill="#e8effc"/>
    <text x="516" y="295" font-size="12" font-weight="900" fill="#1e3a8a" text-anchor="middle">3</text>
    <text x="538" y="286" font-size="12" font-weight="800" fill="#1e3a8a">氖管不亮的是零线</text>
    <text x="538" y="306" font-size="11" fill="#64748b">手不能接触笔尖金属体</text>
  </g>

  <rect x="496" y="330" width="348" height="62" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="670" y="352" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">注意：手不能接触笔尖金属体</text>
  <text x="670" y="374" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">否则可能发生触电事故</text>
</g>
</svg>
