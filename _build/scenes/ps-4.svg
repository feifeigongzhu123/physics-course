<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="质点与参考系：看成质点的条件、参考系的选择、一维坐标系">
<style>
[data-scene="ps-4"] .s4-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-4"].s1 .s4-step1,[data-scene="ps-4"].s2 .s4-step2,[data-scene="ps-4"].s3 .s4-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s4draw{to{stroke-dashoffset:0}}
@keyframes s4slide{0%,100%{transform:translateX(0)}50%{transform:translateX(52px)}}
@keyframes s4pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes s4pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
[data-scene="ps-4"].s1 .s4-route{stroke-dasharray:760;stroke-dashoffset:760;animation:s4draw 1.3s ease .1s both}
[data-scene="ps-4"].s1 .s4-bus{transform-box:fill-box;transform-origin:center;animation:s4slide 3.4s ease-in-out infinite}
[data-scene="ps-4"].s2 .s4-tree{animation:s4pulse 2s ease-in-out infinite}
[data-scene="ps-4"].s3 .s4-dx{animation:s4pop .5s ease .2s both}
[data-scene="ps-4"].s3 .s4-point{transform-box:fill-box;transform-origin:center;animation:s4pop .5s ease both}
[data-scene="ps-4"].s3 .s4-point2{animation-delay:.15s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">质点 参考系：把物体理想化，选好参考系</text>

<!-- 第一步：看成质点的条件 -->
<g class="s4-step s4-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">看成质点的条件：形状和大小对所研究问题影响很小</text>

  <line class="s4-route" x1="90" y1="330" x2="810" y2="330" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <circle cx="96" cy="330" r="6" fill="#1d4ed8"/>
  <text x="96" y="358" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">北京</text>
  <circle cx="804" cy="330" r="6" fill="#dc2626"/>
  <text x="804" y="358" font-size="12.5" font-weight="800" fill="#b91c1c" text-anchor="middle">上海</text>

  <g class="s4-bus">
    <rect x="170" y="284" width="126" height="46" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <rect x="181" y="293" width="34" height="22" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.2"/>
    <rect x="222" y="293" width="34" height="22" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.2"/>
    <rect x="264" y="293" width="24" height="22" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="198" cy="334" r="9" fill="#334155"/>
    <circle cx="270" cy="334" r="9" fill="#334155"/>
    <circle cx="198" cy="334" r="3" fill="#94a3b8"/>
    <circle cx="270" cy="334" r="3" fill="#94a3b8"/>
  </g>
  <text x="540" y="312" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">全程约 1 200 km</text>

  <line x1="170" y1="366" x2="296" y2="366" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="170" y1="360" x2="170" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="296" y1="360" x2="296" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="233" y="386" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle">车长 4 m</text>

  <rect x="70" y="396" width="350" height="84" rx="13" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
  <text x="245" y="420" font-size="13.5" font-weight="900" fill="#047857" text-anchor="middle">可以看成质点</text>
  <text x="245" y="444" font-size="12" fill="#334155" text-anchor="middle">研究列车跑完全程的时间</text>
  <text x="245" y="466" font-size="12" fill="#334155" text-anchor="middle">研究地球绕太阳的公转</text>

  <rect x="455" y="396" width="350" height="84" rx="13" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
  <text x="630" y="420" font-size="13.5" font-weight="900" fill="#b91c1c" text-anchor="middle">不能看成质点</text>
  <text x="630" y="444" font-size="12" fill="#334155" text-anchor="middle">研究列车通过桥的时间</text>
  <text x="630" y="466" font-size="12" fill="#334155" text-anchor="middle">研究运动员的转体动作</text>
</g>

<!-- 第二步：参考系 -->
<g class="s4-step s4-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">参考系：选择不同，对同一运动的描述可能不同</text>

  <rect x="50" y="352" width="800" height="26" rx="5" fill="#e2e8f0"/>
  <line x1="50" y1="365" x2="850" y2="365" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="12 10"/>

  <g class="s4-bus2">
    <rect x="330" y="270" width="210" height="82" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2.5"/>
    <rect x="346" y="284" width="70" height="34" rx="5" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.4"/>
    <rect x="426" y="284" width="70" height="34" rx="5" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.4"/>
    <rect x="505" y="284" width="22" height="48" rx="4" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
    <circle cx="372" cy="356" r="13" fill="#334155"/>
    <circle cx="498" cy="356" r="13" fill="#334155"/>
    <circle cx="372" cy="356" r="5" fill="#94a3b8"/>
    <circle cx="498" cy="356" r="5" fill="#94a3b8"/>
  </g>
  <text x="435" y="250" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">车（选它为参考系）</text>
  <line x1="560" y1="300" x2="648" y2="300" stroke="#dc2626" stroke-width="3.5" marker-end="url(#arrRed)"/>
  <text x="658" y="305" font-size="13" font-weight="900" fill="#b91c1c">v</text>

  <g>
    <circle cx="130" cy="312" r="9" fill="#fbbf24" stroke="#b45309" stroke-width="1.6"/>
    <line x1="130" y1="321" x2="130" y2="352" stroke="#1e40af" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="329" x2="115" y2="345" stroke="#1e40af" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="130" y1="329" x2="145" y2="345" stroke="#1e40af" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="130" y1="352" x2="121" y2="365" stroke="#1e40af" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="130" y1="352" x2="139" y2="365" stroke="#1e40af" stroke-width="3.6" stroke-linecap="round"/>
  </g>
  <text x="130" y="292" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">地面观察者</text>

  <g class="s4-tree">
    <rect x="694" y="300" width="10" height="52" fill="#92400e"/>
    <circle cx="699" cy="282" r="26" fill="#86efac" stroke="#059669" stroke-width="1.6"/>
    <rect x="776" y="300" width="10" height="52" fill="#92400e"/>
    <circle cx="781" cy="278" r="28" fill="#86efac" stroke="#059669" stroke-width="1.6"/>
  </g>
  <line x1="790" y1="232" x2="714" y2="232" stroke="#1d4ed8" stroke-width="2.6" stroke-dasharray="6 5" marker-end="url(#arrBlue)"/>
  <text x="750" y="218" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">树相对车向后运动</text>

  <rect x="60" y="404" width="370" height="80" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="245" y="428" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">选地面为参考系</text>
  <text x="245" y="452" font-size="12" fill="#334155" text-anchor="middle">车向前运动，树静止，人随车前进</text>
  <text x="245" y="474" font-size="11.5" fill="#64748b" text-anchor="middle">同一运动，描述结果与所选参考系有关</text>

  <rect x="470" y="404" width="370" height="80" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="655" y="428" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">选车为参考系</text>
  <text x="655" y="452" font-size="12" fill="#334155" text-anchor="middle">车静止，车内的人静止</text>
  <text x="655" y="474" font-size="11.5" fill="#475569" text-anchor="middle">地面和树木相对车向后运动</text>
</g>

<!-- 第三步：坐标系 -->
<g class="s4-step s4-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">一维坐标系：定量描述位置和位置变化</text>

  <line x1="60" y1="300" x2="830" y2="300" stroke="#334155" stroke-width="2.6" marker-end="url(#arrBlue)"/>
  <g stroke="#64748b" stroke-width="1.8">
    <line x1="60" y1="294" x2="60" y2="306"/>
    <line x1="160" y1="294" x2="160" y2="306"/>
    <line x1="260" y1="294" x2="260" y2="306"/>
    <line x1="360" y1="294" x2="360" y2="306"/>
    <line x1="460" y1="294" x2="460" y2="306"/>
    <line x1="560" y1="294" x2="560" y2="306"/>
    <line x1="660" y1="294" x2="660" y2="306"/>
    <line x1="760" y1="294" x2="760" y2="306"/>
  </g>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="60" y="326">-1</text>
    <text x="160" y="326">0</text>
    <text x="260" y="326">1</text>
    <text x="360" y="326">2</text>
    <text x="460" y="326">3</text>
    <text x="560" y="326">4</text>
    <text x="660" y="326">5</text>
    <text x="760" y="326">6</text>
  </g>
  <text x="160" y="282" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">O</text>
  <text x="812" y="282" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="end">正方向</text>

  <line x1="260" y1="228" x2="560" y2="228" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrBlue)"/>
  <line x1="260" y1="236" x2="260" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="560" y1="236" x2="560" y2="292" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g class="s4-dx">
    <text x="410" y="212" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Δx = x₂ − x₁ = 3 m</text>
  </g>

  <g class="s4-point"><circle cx="260" cy="300" r="7" fill="#1d4ed8"/></g>
  <g class="s4-point s4-point2"><circle cx="560" cy="300" r="7" fill="#dc2626"/></g>
  <text x="274" y="282" font-size="12.5" font-weight="900" fill="#1e40af">A</text>
  <text x="574" y="282" font-size="12.5" font-weight="900" fill="#b91c1c">B</text>
  <text x="260" y="352" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">x₁ = 1 m</text>
  <text x="560" y="352" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">x₂ = 4 m</text>

  <rect x="70" y="380" width="360" height="100" rx="13" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="250" y="404" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">坐标系三要素</text>
  <text x="250" y="428" font-size="12" fill="#334155" text-anchor="middle">原点、正方向、单位长度</text>
  <text x="250" y="450" font-size="12" fill="#334155" text-anchor="middle">取 O 为原点，向右为正方向</text>
  <text x="250" y="472" font-size="11.5" fill="#64748b" text-anchor="middle">每个小格代表 1 m</text>

  <rect x="470" y="380" width="360" height="100" rx="13" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="650" y="404" font-size="13.5" font-weight="900" fill="#1e3a8a" text-anchor="middle">位置与位置变化</text>
  <text x="650" y="428" font-size="12" fill="#334155" text-anchor="middle">位置由坐标表示：x₁ = 1 m，x₂ = 4 m</text>
  <text x="650" y="450" font-size="12" fill="#334155" text-anchor="middle">位置变化 Δx = x₂ − x₁ = 3 m</text>
  <text x="650" y="472" font-size="11.5" fill="#475569" text-anchor="middle">O 点左侧的坐标为负值</text>
</g>
</svg>
