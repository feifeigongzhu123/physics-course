<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="电话：话筒把声音变成电流，听筒把电流还原成声音，交换机连接通话">
<style>
.p78-s1,.p78-s2,.p78-s3{opacity:0;visibility:hidden}
.p78-s1{opacity:1;visibility:visible}
[data-scene="pj-78"] .p78-s1,[data-scene="pj-78"] .p78-s2,[data-scene="pj-78"] .p78-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-78"].s1 .p78-s1,[data-scene="pj-78"].s2 .p78-s2,[data-scene="pj-78"].s3 .p78-s3{opacity:1;visibility:visible}
@keyframes p78flow{to{stroke-dashoffset:-36}}
@keyframes p78pop{0%{transform:scale(.82);opacity:0}72%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes p78sound{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes p78slide{0%{transform:translateX(-8px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes p78vib{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
[data-scene="pj-78"].s1 .p78-flow{stroke-dasharray:10 8;animation:p78flow 1.2s linear infinite}
[data-scene="pj-78"].s1 .p78-sound{animation:p78sound 1.8s ease-in-out infinite}
[data-scene="pj-78"].s1 .p78-dots{animation:p78sound 2.4s ease-in-out infinite}
[data-scene="pj-78"].s1 .p78-step{transform-box:fill-box;transform-origin:left center;animation:p78slide .5s ease both}
[data-scene="pj-78"].s1 .p78-step2{animation-delay:.1s}
[data-scene="pj-78"].s1 .p78-step3{animation-delay:.2s}
[data-scene="pj-78"].s1 .p78-step4{animation-delay:.3s}
[data-scene="pj-78"].s1 .p78-step5{animation-delay:.4s}
[data-scene="pj-78"].s2 .p78-flow{stroke-dasharray:10 8;animation:p78flow 1.2s linear infinite}
[data-scene="pj-78"].s2 .p78-dia{transform-box:fill-box;transform-origin:center;animation:p78vib .9s ease-in-out infinite}
[data-scene="pj-78"].s2 .p78-sound{animation:p78sound 1.6s ease-in-out infinite}
[data-scene="pj-78"].s2 .p78-coil{animation:p78sound 1.4s ease-in-out infinite}
[data-scene="pj-78"].s2 .p78-row{transform-box:fill-box;transform-origin:left center;animation:p78slide .5s ease both}
[data-scene="pj-78"].s2 .p78-row2{animation-delay:.12s}
[data-scene="pj-78"].s2 .p78-row3{animation-delay:.24s}
[data-scene="pj-78"].s2 .p78-row4{animation-delay:.36s}
[data-scene="pj-78"].s3 .p78-phone{transform-box:fill-box;transform-origin:center;animation:p78pop .55s ease both}
[data-scene="pj-78"].s3 .p78-phone2{animation-delay:.2s}
[data-scene="pj-78"].s3 .p78-exch{transform-box:fill-box;transform-origin:center;animation:p78pop .6s ease .1s both}
[data-scene="pj-78"].s3 .p78-link{stroke-dasharray:10 8;animation:p78flow 1.2s linear infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">电话：话筒变电流，听筒还原声</text>

<!-- 第一步：话筒 -->
<g class="p78-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">话筒：把声音信号转化为变化的电流</text>

  <rect x="36" y="100" width="560" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="p78-sound" fill="none" stroke="#1d4ed8" stroke-width="2.5">
    <path d="M62 205 Q92 250 62 295"/>
    <path d="M82 195 Q117 250 82 305"/>
    <path d="M102 185 Q142 250 102 315"/>
  </g>
  <text x="84" y="168" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">声波</text>

  <rect x="150" y="145" width="300" height="210" rx="20" fill="#f8fbff" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="190" y1="170" x2="190" y2="330" stroke="#475569" stroke-width="6"/>
  <rect x="215" y="180" width="120" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <g class="p78-dots" fill="#94a3b8">
    <circle cx="240" cy="205" r="4"/><circle cx="270" cy="205" r="4"/><circle cx="300" cy="205" r="4"/>
    <circle cx="240" cy="235" r="4"/><circle cx="270" cy="235" r="4"/><circle cx="300" cy="235" r="4"/>
    <circle cx="240" cy="265" r="4"/><circle cx="270" cy="265" r="4"/><circle cx="300" cy="265" r="4"/>
    <circle cx="240" cy="295" r="4"/><circle cx="270" cy="295" r="4"/><circle cx="300" cy="295" r="4"/>
  </g>

  <text x="190" y="132" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">膜片</text>
  <text x="275" y="342" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">碳粒</text>

  <path class="p78-flow" d="M335 205 H520" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M335 295 H390 V390 H426" fill="none" stroke="#334155" stroke-width="3.5"/>
  <line x1="426" y1="372" x2="426" y2="408" stroke="#334155" stroke-width="3.5"/>
  <line x1="440" y1="378" x2="440" y2="402" stroke="#334155" stroke-width="3.5"/>
  <path d="M440 390 H520" fill="none" stroke="#334155" stroke-width="3.5"/>
  <text x="433" y="424" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">电源</text>
  <text x="430" y="190" font-size="11.5" font-weight="800" fill="#b91c1c">变化的电流</text>
  <text x="300" y="132" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">话筒</text>

  <rect x="616" y="100" width="248" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="740" y="132" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">声 → 电</text>

  <g class="p78-step">
    <rect x="636" y="148" width="208" height="40" rx="10" fill="#e8effc"/>
    <text x="740" y="174" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">声波使膜片振动</text>
  </g>
  <g class="p78-step p78-step2">
    <rect x="636" y="196" width="208" height="40" rx="10" fill="#e8effc"/>
    <text x="740" y="222" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">碳粒松紧发生变化</text>
  </g>
  <g class="p78-step p78-step3">
    <rect x="636" y="244" width="208" height="40" rx="10" fill="#e8effc"/>
    <text x="740" y="270" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">碳粒电阻随之变化</text>
  </g>
  <g class="p78-step p78-step4">
    <rect x="636" y="292" width="208" height="40" rx="10" fill="#fff7ed"/>
    <text x="740" y="318" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">电路电流随之变化</text>
  </g>
  <g class="p78-step p78-step5">
    <rect x="636" y="340" width="208" height="40" rx="10" fill="#e6f7f1"/>
    <text x="740" y="366" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">声信号变成电信号</text>
  </g>

  <text x="740" y="410" font-size="11.5" fill="#64748b" text-anchor="middle">电流的变化规律跟声音一致</text>
</g>

<!-- 第二步：听筒 -->
<g class="p78-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">听筒：把变化的电流还原成声音</text>

  <rect x="36" y="100" width="560" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="p78-sound" fill="none" stroke="#1d4ed8" stroke-width="2.5">
    <path d="M66 205 Q96 250 66 295"/>
    <path d="M86 195 Q121 250 86 305"/>
    <path d="M106 185 Q146 250 106 315"/>
  </g>
  <text x="88" y="168" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">声音</text>

  <rect x="150" y="145" width="300" height="210" rx="20" fill="#f8fbff" stroke="#94a3b8" stroke-width="2.5"/>
  <line class="p78-dia" x1="185" y1="165" x2="185" y2="335" stroke="#475569" stroke-width="6"/>
  <text x="185" y="132" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">膜片</text>

  <g class="p78-coil" fill="none" stroke="#b45309" stroke-width="4">
    <ellipse cx="245" cy="250" rx="16" ry="50"/>
    <ellipse cx="262" cy="250" rx="16" ry="50"/>
  </g>
  <rect x="290" y="205" width="65" height="90" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="322" y="256" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">永磁体</text>

  <path class="p78-flow" d="M520 250 H355" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="454" y="236" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">变化的电流</text>
  <text x="245" y="346" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">线圈</text>
  <text x="300" y="132" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">听筒</text>

  <rect x="616" y="100" width="248" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="740" y="132" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">电 → 声</text>

  <g class="p78-row">
    <rect x="636" y="152" width="208" height="56" rx="10" fill="#e8effc"/>
    <text x="740" y="176" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电流强弱变化</text>
    <text x="740" y="196" font-size="11" fill="#475569" text-anchor="middle">通过线圈的电流不断变化</text>
  </g>
  <g class="p78-row p78-row2">
    <rect x="636" y="220" width="208" height="56" rx="10" fill="#e8effc"/>
    <text x="740" y="244" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">线圈受力变化</text>
    <text x="740" y="264" font-size="11" fill="#475569" text-anchor="middle">线圈在磁场中受力振动</text>
  </g>
  <g class="p78-row p78-row3">
    <rect x="636" y="288" width="208" height="56" rx="10" fill="#fff7ed"/>
    <text x="740" y="312" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">膜片跟着振动</text>
    <text x="740" y="332" font-size="11" fill="#92400e" text-anchor="middle">振动频率与电流变化一致</text>
  </g>
  <g class="p78-row p78-row4">
    <rect x="636" y="356" width="208" height="46" rx="10" fill="#e6f7f1"/>
    <text x="740" y="384" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">发出原来的声音</text>
  </g>
</g>

<!-- 第三步：电话交换 -->
<g class="p78-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">两部电话通过电话交换机连接</text>

  <rect x="36" y="100" width="828" height="330" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>

  <g class="p78-phone">
    <rect x="70" y="300" width="130" height="34" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="128" y="280" width="14" height="22" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="78" y="232" width="114" height="26" rx="13" fill="#475569"/>
    <circle cx="90" cy="245" r="9" fill="#334155"/>
    <circle cx="180" cy="245" r="9" fill="#334155"/>
    <text x="135" y="362" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电话甲</text>
  </g>

  <g class="p78-phone p78-phone2">
    <rect x="700" y="300" width="130" height="34" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="758" y="280" width="14" height="22" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="708" y="232" width="114" height="26" rx="13" fill="#475569"/>
    <circle cx="720" cy="245" r="9" fill="#334155"/>
    <circle cx="810" cy="245" r="9" fill="#334155"/>
    <text x="765" y="362" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电话乙</text>
  </g>

  <g class="p78-exch">
    <rect x="355" y="150" width="190" height="170" rx="16" fill="#f8fbff" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="450" y="180" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">电话交换机</text>
    <circle cx="450" cy="240" r="24" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <g stroke="#1d4ed8" stroke-width="2.5">
      <line x1="450" y1="214" x2="450" y2="266"/>
      <line x1="424" y1="240" x2="476" y2="240"/>
      <line x1="432" y1="222" x2="468" y2="258"/>
      <line x1="468" y1="222" x2="432" y2="258"/>
    </g>
    <circle cx="450" cy="240" r="6" fill="#1d4ed8"/>
    <text x="450" y="294" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">自动接续通话</text>
  </g>

  <path class="p78-link" d="M200 262 C260 250 300 230 355 222" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <path class="p78-link" d="M355 278 C300 290 265 310 200 318" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>
  <path class="p78-link" d="M700 262 C640 250 600 230 545 222" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <path class="p78-link" d="M545 278 C600 290 635 310 700 318" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrGreen)"/>

  <text x="450" y="356" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">现代电话网络还能传输</text>
  <g font-size="11.5" font-weight="800">
    <rect x="340" y="368" width="90" height="32" rx="16" fill="#e8effc"/>
    <text x="385" y="389" fill="#1e3a8a" text-anchor="middle">语音</text>
    <rect x="440" y="368" width="90" height="32" rx="16" fill="#e6f7f1"/>
    <text x="485" y="389" fill="#047857" text-anchor="middle">图像</text>
    <rect x="540" y="368" width="90" height="32" rx="16" fill="#fff7ed"/>
    <text x="585" y="389" fill="#b45309" text-anchor="middle">数据</text>
  </g>

  <text x="450" y="422" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">声音 → 变化的电流 → 交换机 → 变化的电流 → 声音</text>
</g>
</svg>
