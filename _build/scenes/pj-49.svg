<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="内能：分子动能与势能、做功和热传递改变内能、温度与内能">
<style>
.p49-s1,.p49-s2,.p49-s3{opacity:0;visibility:hidden}
.p49-s1{opacity:1;visibility:visible}
[data-scene="pj-49"] .p49-s1,[data-scene="pj-49"] .p49-s2,[data-scene="pj-49"] .p49-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="pj-49"].s1 .p49-s1,[data-scene="pj-49"].s2 .p49-s2,[data-scene="pj-49"].s3 .p49-s3{opacity:1;visibility:visible}
@keyframes p49drift{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-6px)}50%{transform:translate(-6px,4px)}75%{transform:translate(4px,5px)}}
@keyframes p49pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes p49flow{to{stroke-dashoffset:-42}}
@keyframes p49draw{to{stroke-dashoffset:0}}
@keyframes p49pop{0%{transform:scale(.82);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
[data-scene="pj-49"].s1 .p49-mol{transform-box:fill-box;transform-origin:center;animation:p49drift 3.2s ease-in-out infinite}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(2){animation-delay:-.6s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(3){animation-delay:-1.2s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(4){animation-delay:-1.8s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(5){animation-delay:-2.4s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(6){animation-delay:-3s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(7){animation-delay:-1.5s}
[data-scene="pj-49"].s1 .p49-mol:nth-of-type(8){animation-delay:-2.1s}
[data-scene="pj-49"].s1 .p49-soft{animation:p49pulse 2.4s ease-in-out infinite}
[data-scene="pj-49"].s2 .p49-arrow{stroke-dasharray:9 7;animation:p49flow 1.1s linear infinite}
[data-scene="pj-49"].s3 .p49-curve{stroke-dasharray:460;stroke-dashoffset:460;animation:p49draw 1.4s ease forwards}
[data-scene="pj-49"].s3 .p49-card{transform-box:fill-box;transform-origin:center;animation:p49pop .55s ease both}
[data-scene="pj-49"].s3 .p49-cardB{animation-delay:.15s}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="470" width="900" height="150" fill="url(#gBench)"/>
<line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">内能：分子动能与分子势能的总和</text>

<!-- 第一步：分子动能与分子势能 -->
<g class="p49-s1" data-zone="1">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="196" height="30" rx="15" fill="#dbeafe"/>
  <text x="154" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 分子动能与分子势能</text>

  <rect x="52" y="120" width="398" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="251" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">分子在不停地做无规则运动</text>
  <rect x="80" y="162" width="342" height="144" rx="12" fill="#f8fbff" stroke="#93c5fd" stroke-width="2.5"/>

  <circle class="p49-mol" cx="112" cy="196" r="7" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="158" cy="248" r="8" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="212" cy="190" r="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="262" cy="252" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="310" cy="204" r="8" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="358" cy="250" r="6" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="190" cy="286" r="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle class="p49-mol" cx="326" cy="286" r="7" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>

  <rect x="80" y="318" width="150" height="26" rx="8" fill="#dbeafe"/>
  <text x="155" y="336" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">分子动能</text>
  <text x="244" y="336" font-size="11.5" fill="#475569">分子热运动具有的能</text>
  <rect x="80" y="352" width="150" height="26" rx="8" fill="#dbeafe"/>
  <text x="155" y="370" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">分子势能</text>
  <text x="244" y="370" font-size="11.5" fill="#475569">分子间作用力具有的能</text>
  <text x="251" y="392" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">温度越高，分子运动越剧烈</text>

  <rect x="466" y="120" width="382" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="657" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">内能的组成</text>
  <rect class="p49-soft" x="579" y="154" width="156" height="52" rx="16" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <rect x="583" y="158" width="148" height="44" rx="12" fill="#1d4ed8"/>
  <text x="657" y="186" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">内能 E</text>

  <path d="M657 202 V214 M561 214 H753 M561 214 V226 M753 214 V226" fill="none" stroke="#93c5fd" stroke-width="2"/>
  <rect x="486" y="228" width="150" height="70" rx="10" fill="#e8effc"/>
  <text x="561" y="258" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">分子动能</text>
  <text x="561" y="282" font-size="11.5" fill="#475569" text-anchor="middle">分子热运动</text>
  <rect x="678" y="228" width="150" height="70" rx="10" fill="#e8effc"/>
  <text x="753" y="258" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">分子势能</text>
  <text x="753" y="282" font-size="11.5" fill="#475569" text-anchor="middle">分子间作用力</text>

  <text x="657" y="326" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">一切物体，无论温度高低，都有内能</text>
  <rect x="527" y="342" width="260" height="30" rx="15" fill="#fef3c7"/>
  <text x="657" y="362" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">0 ℃ 的冰也具有内能</text>
  <text x="657" y="390" font-size="12" fill="#475569" text-anchor="middle">内能的单位：焦耳（J）</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#eef6ff"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">内能 = 所有分子动能 + 分子势能 · 单位是焦耳（J）</text>
</g>

<!-- 第二步：做功与热传递 -->
<g class="p49-s2" data-zone="2">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="216" height="30" rx="15" fill="#dbeafe"/>
  <text x="164" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 改变内能的两种方式</text>

  <rect x="52" y="120" width="398" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="251" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">做功：内能与其他能相互转化</text>

  <rect x="86" y="170" width="180" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="112" cy="202" r="3.5" fill="#60a5fa"/>
  <circle cx="138" cy="190" r="3.5" fill="#60a5fa"/>
  <circle cx="168" cy="214" r="3.5" fill="#60a5fa"/>
  <circle cx="196" cy="196" r="3.5" fill="#60a5fa"/>
  <circle cx="222" cy="212" r="3.5" fill="#60a5fa"/>
  <rect x="246" y="180" width="12" height="44" rx="3" fill="#64748b"/>
  <rect x="258" y="192" width="44" height="8" fill="#94a3b8"/>
  <line class="p49-arrow" x1="326" y1="196" x2="286" y2="196" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="302" y="182" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">压缩</text>
  <text x="251" y="262" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">压缩气体：机械能 → 内能，内能增大</text>

  <rect x="86" y="284" width="180" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="118" cy="316" r="3.5" fill="#60a5fa"/>
  <circle cx="146" cy="304" r="3.5" fill="#60a5fa"/>
  <circle cx="176" cy="328" r="3.5" fill="#60a5fa"/>
  <rect x="200" y="294" width="12" height="44" rx="3" fill="#64748b"/>
  <rect x="212" y="306" width="40" height="8" fill="#94a3b8"/>
  <line class="p49-arrow" x1="150" y1="316" x2="192" y2="316" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>
  <text x="272" y="290" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">膨胀</text>
  <text x="251" y="376" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">气体膨胀做功：内能 → 机械能，内能减小</text>
  <text x="251" y="394" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">摩擦生热也是机械能转化为内能</text>

  <rect x="466" y="120" width="382" height="278" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
  <text x="657" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热传递：内能的转移</text>

  <rect x="490" y="162" width="86" height="66" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="533" y="190" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">高温物体</text>
  <text x="533" y="212" font-size="11" fill="#b91c1c" text-anchor="middle">放热</text>
  <rect x="650" y="162" width="86" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="693" y="190" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">低温物体</text>
  <text x="693" y="212" font-size="11" fill="#1e40af" text-anchor="middle">吸热</text>
  <path class="p49-arrow" d="M578 196 C604 170 622 170 648 196" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="613" y="236" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">热量 Q</text>

  <line x1="486" y1="250" x2="828" y2="250" stroke="#dbe6f2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="500" y="266" width="90" height="70" rx="6" fill="#f8fbff" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="506" y="300" width="78" height="30" fill="#bfdbfe"/>
  <text x="545" y="321" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">水</text>
  <path d="M526 352 q8 -15 16 0 q-8 7 -16 0 Z" fill="#f97316"/>
  <path d="M546 352 q9 -18 18 0 q-9 7 -18 0 Z" fill="#fbbf24"/>
  <path d="M568 352 q8 -15 16 0 q-8 7 -16 0 Z" fill="#f97316"/>
  <text x="614" y="292" font-size="11.5" font-weight="700" fill="#334155">水吸收热量，</text>
  <text x="614" y="314" font-size="11.5" font-weight="700" fill="#334155">内能增大，温度升高</text>
  <text x="657" y="386" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">热传递：高温 → 低温，直到温度相同</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#f0fdf4"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">做功是转化，热传递是转移，两种方式改变内能的效果相同</text>
</g>

<!-- 第三步：温度与内能 -->
<g class="p49-s3" data-zone="3">
  <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <rect x="56" y="80" width="160" height="30" rx="15" fill="#dbeafe"/>
  <text x="136" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 温度与内能</text>

  <rect x="52" y="120" width="420" height="278" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="262" y="146" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">同一物体：温度升高，内能增大</text>
  <line x1="110" y1="374" x2="110" y2="170" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="374" x2="440" y2="374" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="118" y="182" font-size="11.5" font-weight="700" fill="#334155">内能 E</text>
  <text x="430" y="394" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">温度 T</text>
  <path class="p49-curve" d="M120 358 C180 330 260 280 420 190" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="300" r="4.5" fill="#1d4ed8"/>
  <text x="300" y="240" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">E 随 T 升高而增大</text>
  <text x="262" y="392" font-size="11.5" fill="#475569" text-anchor="middle">温度是分子平均动能的标志</text>

  <text x="670" y="146" font-size="13.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两个易错点</text>
  <rect class="p49-card" x="510" y="160" width="320" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="526" y="184" font-size="12.5" font-weight="800" fill="#1e40af">① 内能增大，温度不一定升高</text>
  <text x="526" y="208" font-size="11.5" fill="#334155">晶体熔化时吸热，内能增大，</text>
  <text x="526" y="228" font-size="11.5" fill="#334155">但温度保持在熔点不变</text>
  <rect class="p49-card p49-cardB" x="510" y="276" width="320" height="104" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="526" y="300" font-size="12.5" font-weight="800" fill="#92400e">② 热量是过程量</text>
  <text x="526" y="324" font-size="11.5" fill="#334155">只能说“吸收热量 / 放出热量”，</text>
  <text x="526" y="344" font-size="11.5" fill="#334155">不能说“物体含有热量”</text>

  <rect x="52" y="420" width="796" height="28" rx="8" fill="#fffbeb"/>
  <text x="450" y="439" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">温度升高，内能一定增大；内能增大，温度不一定升高</text>
</g>
</svg>
