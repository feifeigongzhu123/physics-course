<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="常见传感器：光敏电阻、热敏电阻、霍尔元件和电容式传感器的工作原理与应用">
<style>
[data-scene="ps-101"] .s101-s1,[data-scene="ps-101"] .s101-s2,[data-scene="ps-101"] .s101-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
[data-scene="ps-101"].s1 .s101-s1,[data-scene="ps-101"].s2 .s101-s2,[data-scene="ps-101"].s3 .s101-s3{opacity:1;visibility:visible}
@keyframes s101fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes s101draw{to{stroke-dashoffset:0}}
@keyframes s101pop{0%{transform:scale(.9);opacity:0}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes s101pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s101flow{to{stroke-dashoffset:-36}}
[data-scene="ps-101"].s1 .s101-curve{stroke-dasharray:600;stroke-dashoffset:600;animation:s101draw 1.4s ease .2s forwards}
[data-scene="ps-101"].s1 .s101-card{transform-box:fill-box;transform-origin:center;animation:s101pop .55s ease .35s both}
[data-scene="ps-101"].s1 .s101-arrow{stroke-dasharray:8 7;animation:s101flow 1s linear infinite}
[data-scene="ps-101"].s2 .s101-curve{stroke-dasharray:600;stroke-dashoffset:600;animation:s101draw 1.4s ease .2s forwards}
[data-scene="ps-101"].s2 .s101-curve2{stroke-dasharray:600;stroke-dashoffset:600;animation:s101draw 1.4s ease .5s forwards}
[data-scene="ps-101"].s2 .s101-card{transform-box:fill-box;transform-origin:center;animation:s101pop .55s ease .4s both}
[data-scene="ps-101"].s2 .s101-legend{animation:s101fade .5s ease .6s both}
[data-scene="ps-101"].s3 .s101-hall{transform-box:fill-box;transform-origin:center;animation:s101pop .55s ease .2s both}
[data-scene="ps-101"].s3 .s101-card{transform-box:fill-box;transform-origin:center;animation:s101pop .55s ease .35s both}
[data-scene="ps-101"].s3 .s101-arrow{stroke-dasharray:8 7;animation:s101flow 1s linear infinite}
[data-scene="ps-101"].s3 .s101-volt{animation:s101pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">常见传感器：光敏、热敏、霍尔与电容式</text>

<!-- 第一步：光敏电阻 -->
<g class="s101-s1" data-zone="1">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">光敏电阻：光照越强，半导体中的载流子越多，电阻越小</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光敏电阻（光 → 电阻）</text>

  <line x1="110" y1="170" x2="110" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="360" x2="500" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="92" y="182" font-size="12" font-weight="900" fill="#475569">R</text>
  <text x="305" y="386" font-size="11" fill="#64748b" text-anchor="middle">光照强度 →</text>
  <text x="122" y="350" font-size="11" fill="#64748b">弱</text>
  <text x="482" y="350" font-size="11" fill="#64748b">强</text>

  <path class="s101-curve" d="M 130 195 C 190 210 250 268 340 310 C 400 332 450 338 490 342" fill="none" stroke="#dc2626" stroke-width="3"/>
  <text x="230" y="232" font-size="11" font-weight="800" fill="#b91c1c">光照弱，R 大</text>
  <text x="380" y="298" font-size="11" font-weight="800" fill="#b91c1c">光照强，R 小</text>

  <text x="296" y="404" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">光照增强 → 载流子增多 → 导电能力增强</text>
  <text x="296" y="426" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">所以光敏电阻的阻值明显减小</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">原理与应用</text>

  <rect x="596" y="160" width="248" height="60" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="720" y="188" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">光强 ↑ → R ↓</text>
  <text x="720" y="208" font-size="11" fill="#475569" text-anchor="middle">光照越强，电阻越小</text>

  <text x="610" y="252" font-size="11.5" fill="#334155">半导体受光照产生载流子</text>
  <text x="610" y="278" font-size="11.5" fill="#334155">载流子增多，导电能力增强</text>
  <text x="610" y="304" font-size="11.5" fill="#334155">光照减弱，电阻又变大</text>

  <rect x="596" y="322" width="248" height="50" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="720" y="344" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">光控开关 · 自动计数</text>
  <text x="720" y="364" font-size="11" fill="#92400e" text-anchor="middle">路灯天黑自动点亮</text>

  <text x="720" y="394" font-size="11" fill="#64748b" text-anchor="middle">亮电阻小、暗电阻大</text>
  <text x="720" y="420" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">是重要的光敏元件</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">光敏电阻把光照强弱转换成电阻大小，可用于光控开关和自动计数</text>
</g>

<!-- 第二步：热敏电阻和金属热电阻 -->
<g class="s101-s2" data-zone="2">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">热敏电阻与金属热电阻：温度变化引起电阻变化</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">温度 → 电阻</text>

  <line x1="110" y1="170" x2="110" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <line x1="110" y1="360" x2="500" y2="360" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="92" y="182" font-size="12" font-weight="900" fill="#475569">R</text>
  <text x="470" y="386" font-size="11" fill="#64748b" text-anchor="middle">温度 T →</text>

  <path class="s101-curve" d="M 130 210 C 190 215 260 260 330 300 C 390 330 450 340 490 344" fill="none" stroke="#dc2626" stroke-width="3"/>
  <path class="s101-curve2" d="M 130 340 C 200 335 280 318 350 290 C 410 265 460 235 490 210" fill="none" stroke="#1d4ed8" stroke-width="3"/>

  <g class="s101-legend">
    <rect x="316" y="156" width="224" height="58" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="326" y1="176" x2="354" y2="176" stroke="#dc2626" stroke-width="3"/>
    <text x="362" y="180" font-size="11" font-weight="800" fill="#b91c1c">热敏电阻：R 随 T 减小</text>
    <line x1="326" y1="198" x2="354" y2="198" stroke="#1d4ed8" stroke-width="3"/>
    <text x="362" y="202" font-size="11" font-weight="800" fill="#1e40af">金属热电阻：R 随 T 增大</text>
  </g>

  <text x="296" y="404" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">热敏电阻：温度升高，阻值减小，灵敏度高</text>
  <text x="296" y="426" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">金属热电阻：温度升高，阻值增大，性能稳定</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">两种元件的比较</text>

  <g class="s101-card">
    <rect x="596" y="160" width="248" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="610" y="184" font-size="12" font-weight="900" fill="#b45309">热敏电阻（半导体）</text>
    <text x="610" y="208" font-size="11.5" font-weight="800" fill="#92400e">温度 ↑ → 电阻 ↓</text>
    <text x="610" y="232" font-size="11" fill="#92400e">灵敏度高，适合温度控制</text>

    <rect x="596" y="262" width="248" height="92" rx="10" fill="#e8effc" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="610" y="286" font-size="12" font-weight="900" fill="#1e3a8a">金属热电阻</text>
    <text x="610" y="310" font-size="11.5" font-weight="800" fill="#1e40af">温度 ↑ → 电阻 ↑</text>
    <text x="610" y="334" font-size="11" fill="#475569">线性好、稳定，适合精确测温</text>

    <rect x="596" y="364" width="248" height="48" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="720" y="386" font-size="11.5" font-weight="800" fill="#047857" text-anchor="middle">温度计 · 温控器 · 电饭煲</text>
    <text x="720" y="405" font-size="11" fill="#065f46" text-anchor="middle">把温度变化转换为电阻变化</text>
  </g>

  <text x="720" y="428" font-size="11" fill="#64748b" text-anchor="middle">测温范围宽、响应快</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">热敏电阻和金属热电阻都把温度变化转换成电阻变化，用于测温与控温</text>
</g>

<!-- 第三步：霍尔元件和电容式传感器 -->
<g class="s101-s3" data-zone="3">
  <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">霍尔元件把磁感应强度转换成电压，电容式传感器把位移转换成电容</text>

  <rect x="36" y="100" width="520" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="56" y="116" width="250" height="28" rx="14" fill="#e8effc"/>
  <text x="181" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">霍尔元件（磁 → 电压）</text>

  <text x="240" y="182" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">B 垂直纸面向里 ⊗</text>

  <g class="s101-hall">
    <rect x="150" y="196" width="180" height="100" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="240" y="214" font-size="12" font-weight="900" fill="#b91c1c" text-anchor="middle">+   +   +</text>
    <text x="240" y="290" font-size="12" font-weight="900" fill="#1e40af" text-anchor="middle">−   −   −</text>
  </g>

  <line x1="100" y1="236" x2="148" y2="236" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <line x1="332" y1="236" x2="380" y2="236" stroke="#1d4ed8" stroke-width="2.4" marker-end="url(#arrBlue)"/>
  <text x="118" y="226" font-size="12" font-weight="900" fill="#1d4ed8">I</text>
  <text x="362" y="226" font-size="12" font-weight="900" fill="#1d4ed8">I</text>

  <g class="s101-hall">
    <circle cx="190" cy="266" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="185" y1="261" x2="195" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="195" y1="261" x2="185" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="240" cy="266" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="235" y1="261" x2="245" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="245" y1="261" x2="235" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="290" cy="266" r="7" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="285" y1="261" x2="295" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
    <line x1="295" y1="261" x2="285" y2="271" stroke="#1d4ed8" stroke-width="1.5"/>
  </g>

  <text class="s101-volt" x="348" y="272" font-size="12" font-weight="900" fill="#b91c1c">U_H</text>
  <text x="296" y="336" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">U_H = k · IB / d</text>
  <text x="296" y="370" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">磁感应强度 B 越大，霍尔电压越大</text>
  <text x="296" y="396" font-size="11" fill="#475569" text-anchor="middle">可测磁感应强度、转速和位置</text>
  <text x="296" y="420" font-size="11" fill="#64748b" text-anchor="middle">用于车速表、无刷电机、计数装置</text>

  <rect x="576" y="100" width="288" height="336" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="596" y="116" width="248" height="28" rx="14" fill="#e8effc"/>
  <text x="720" y="135" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">电容式传感器（位移 → 电容）</text>

  <line x1="600" y1="225" x2="640" y2="225" stroke="#475569" stroke-width="2"/>
  <line x1="716" y1="225" x2="760" y2="225" stroke="#475569" stroke-width="2"/>
  <rect x="640" y="180" width="12" height="90" rx="2" fill="#64748b"/>
  <rect x="704" y="180" width="12" height="90" rx="2" fill="#1d4ed8"/>
  <line class="s101-arrow" x1="716" y1="164" x2="760" y2="164" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="750" y="156" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="end">位移 x</text>
  <text x="678" y="238" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">d</text>

  <text x="720" y="300" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">C = εS / (4πkd)</text>
  <text x="720" y="326" font-size="11" fill="#334155" text-anchor="middle">d 变化 → C 变化 → 电信号</text>

  <line x1="596" y1="344" x2="844" y2="344" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="720" y="368" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">力传感器：应变片受力变形</text>
  <text x="720" y="390" font-size="11" fill="#475569" text-anchor="middle">电阻改变，测出力的大小</text>
  <text x="720" y="414" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">应用：位移、压力、液位测量</text>

  <rect x="36" y="446" width="828" height="46" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="475" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">霍尔元件测磁场，电容式传感器测位移，力传感器测力的大小</text>
</g>
</svg>
