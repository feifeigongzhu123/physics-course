<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="串并联电路中电流的规律：串联相等、并联求和与实验探究">
  <style>
    [data-scene="pj-57"] .p57-s1,[data-scene="pj-57"] .p57-s2,[data-scene="pj-57"] .p57-s3{opacity:0;visibility:hidden}
    [data-scene="pj-57"].s1 .p57-s1,[data-scene="pj-57"].s2 .p57-s2,[data-scene="pj-57"].s3 .p57-s3{opacity:1;visibility:visible;animation:p57fade .45s ease both}
    @keyframes p57fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes p57flow{to{stroke-dashoffset:-42}}
    @keyframes p57glow{0%,100%{opacity:.5}50%{opacity:1}}
    [data-scene="pj-57"] .p57-flow{stroke-dasharray:7 6;animation:p57flow 1.1s linear infinite}
    [data-scene="pj-57"].s1 .p57-glow{animation:p57glow 1.8s ease-in-out infinite}
    [data-scene="pj-57"].s2 .p57-glow{animation:p57glow 1.8s ease-in-out infinite}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>

  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">串、并联电路中电流的规律：处处相等与干路求和</text>

  <!-- 第一步：串联电路 -->
  <g class="p57-s1" data-zone="1">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">串联电路：只有一条电流路径，电流处处相等 I = I₁ = I₂</text>

    <rect x="36" y="100" width="540" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="60" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">两个灯泡串联</text>

    <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M80 255 L80 175 L206 175"/>
      <path d="M254 175 L346 175"/>
      <path d="M394 175 L500 175 L500 375"/>
      <path d="M500 375 L317 375"/>
      <path d="M263 375 L80 375 L80 268"/>
    </g>
    <g class="p57-flow" stroke="#dc2626" stroke-width="2" fill="none" opacity=".72">
      <path d="M80 255 L80 175 L206 175"/>
      <path d="M254 175 L346 175"/>
      <path d="M394 175 L500 175 L500 375"/>
      <path d="M500 375 L317 375"/>
      <path d="M263 375 L80 375 L80 268"/>
    </g>

    <line x1="60" y1="255" x2="100" y2="255" stroke="#334155" stroke-width="3"/>
    <line x1="68" y1="268" x2="92" y2="268" stroke="#334155" stroke-width="6"/>
    <text x="106" y="251" font-size="12" font-weight="900" fill="#dc2626">+</text>
    <text x="106" y="278" font-size="12" font-weight="900" fill="#1d4ed8">−</text>
    <text x="58" y="300" font-size="12" font-weight="700" fill="#475569" text-anchor="end">电源</text>

    <circle cx="230" cy="175" r="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="213" y1="158" x2="247" y2="192" stroke="#d97706" stroke-width="2.5"/>
    <line x1="247" y1="158" x2="213" y2="192" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p57-glow" cx="230" cy="175" r="31" fill="none" stroke="#fbbf24" stroke-width="3"/>

    <circle cx="370" cy="175" r="24" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="353" y1="158" x2="387" y2="192" stroke="#d97706" stroke-width="2.5"/>
    <line x1="387" y1="158" x2="353" y2="192" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p57-glow" cx="370" cy="175" r="31" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <g font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">
      <text x="230" y="218">L₁</text>
      <text x="370" y="218">L₂</text>
    </g>

    <circle cx="290" cy="375" r="27" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <text x="290" y="384" font-size="19" font-weight="900" fill="#b91c1c" text-anchor="middle">A</text>
    <text x="290" y="424" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">电流表</text>

    <g stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)">
      <line x1="80" y1="238" x2="80" y2="208"/>
      <line x1="140" y1="175" x2="166" y2="175"/>
      <line x1="300" y1="175" x2="326" y2="175"/>
      <line x1="500" y1="218" x2="500" y2="244"/>
      <line x1="430" y1="375" x2="402" y2="375"/>
    </g>
    <g font-size="11.5" font-weight="900" fill="#b91c1c" text-anchor="middle">
      <text x="150" y="164">0.3 A</text>
      <text x="300" y="164">0.3 A</text>
      <text x="430" y="398">0.3 A</text>
    </g>

    <rect x="596" y="100" width="268" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="730" y="132" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联电流规律</text>
    <text x="730" y="194" font-size="23" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = I₁ = I₂</text>
    <g font-size="12.5" fill="#334155">
      <rect x="616" y="226" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="250" text-anchor="middle">I₁ = 0.3 A</text>
      <rect x="616" y="274" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="298" text-anchor="middle">I₂ = 0.3 A</text>
      <rect x="616" y="322" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="346" text-anchor="middle">I = 0.3 A</text>
    </g>
    <text x="730" y="392" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">电流处处相等</text>
    <text x="730" y="416" font-size="11.5" fill="#64748b" text-anchor="middle">与用电器位置、规格无关</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联电路只有一条电流路径</text>
    <g font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <rect x="58" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="180" y="556">电流只有一条路径</text>
      <rect x="328" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="450" y="556">各点电流都相等</text>
      <rect x="598" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="720" y="556">I = I₁ = I₂</text>
    </g>
  </g>

  <!-- 第二步：并联电路 -->
  <g class="p57-s2" data-zone="2">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">并联电路：干路电流等于各支路电流之和 I = I₁ + I₂</text>

    <rect x="36" y="100" width="540" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="60" y="130" font-size="13.5" font-weight="800" fill="#1e3a8a">两个灯泡并联</text>

    <g stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M90 250 L90 170 L220 170"/>
      <path d="M220 170 L220 320"/>
      <path d="M220 220 L254 220"/>
      <path d="M286 220 L334 220"/>
      <path d="M386 220 L420 220"/>
      <path d="M220 320 L254 320"/>
      <path d="M286 320 L334 320"/>
      <path d="M386 320 L420 320"/>
      <path d="M420 170 L420 320"/>
      <path d="M420 170 L520 170 L520 400"/>
      <path d="M520 400 L354 400"/>
      <path d="M306 400 L90 400 L90 263"/>
    </g>
    <g class="p57-flow" stroke="#dc2626" stroke-width="2" fill="none" opacity=".68">
      <path d="M90 250 L90 170 L220 170"/>
      <path d="M220 220 L254 220"/>
      <path d="M286 220 L334 220"/>
      <path d="M386 220 L420 220"/>
      <path d="M220 320 L254 320"/>
      <path d="M286 320 L334 320"/>
      <path d="M386 320 L420 320"/>
      <path d="M420 170 L520 170 L520 400"/>
      <path d="M520 400 L354 400"/>
      <path d="M306 400 L90 400 L90 263"/>
    </g>

    <line x1="70" y1="250" x2="110" y2="250" stroke="#334155" stroke-width="3"/>
    <line x1="78" y1="263" x2="102" y2="263" stroke="#334155" stroke-width="6"/>
    <text x="116" y="246" font-size="12" font-weight="900" fill="#dc2626">+</text>
    <text x="116" y="273" font-size="12" font-weight="900" fill="#1d4ed8">−</text>
    <text x="68" y="295" font-size="12" font-weight="700" fill="#475569" text-anchor="end">电源</text>

    <circle cx="270" cy="220" r="19" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="270" y="227" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">A₁</text>
    <circle cx="360" cy="220" r="21" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="345" y1="205" x2="375" y2="235" stroke="#d97706" stroke-width="2.5"/>
    <line x1="375" y1="205" x2="345" y2="235" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p57-glow" cx="360" cy="220" r="27" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

    <circle cx="270" cy="320" r="19" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="270" y="327" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">A₂</text>
    <circle cx="360" cy="320" r="21" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <line x1="345" y1="305" x2="375" y2="335" stroke="#d97706" stroke-width="2.5"/>
    <line x1="375" y1="305" x2="345" y2="335" stroke="#d97706" stroke-width="2.5"/>
    <circle class="p57-glow" cx="360" cy="320" r="27" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

    <circle cx="330" cy="400" r="24" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <text x="330" y="408" font-size="17" font-weight="900" fill="#b91c1c" text-anchor="middle">A</text>

    <g font-size="11.5" font-weight="800" text-anchor="middle">
      <text x="270" y="190" fill="#b91c1c">0.2 A</text>
      <text x="360" y="190" fill="#92400e">L₁</text>
      <text x="270" y="290" fill="#b91c1c">0.3 A</text>
      <text x="360" y="290" fill="#92400e">L₂</text>
      <text x="330" y="438" fill="#b91c1c">0.5 A（干路）</text>
    </g>

    <g stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrRed)">
      <line x1="120" y1="170" x2="146" y2="170"/>
      <line x1="232" y1="220" x2="246" y2="220"/>
      <line x1="232" y1="320" x2="246" y2="320"/>
      <line x1="520" y1="220" x2="520" y2="246"/>
      <line x1="470" y1="400" x2="444" y2="400"/>
    </g>

    <rect x="596" y="100" width="268" height="350" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="730" y="132" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">并联电流规律</text>
    <text x="730" y="194" font-size="22" font-weight="900" fill="#1e3a8a" text-anchor="middle">I = I₁ + I₂</text>
    <g font-size="12.5" fill="#334155">
      <rect x="616" y="226" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="250" text-anchor="middle">干路 I = 0.5 A</text>
      <rect x="616" y="274" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="298" text-anchor="middle">支路 I₁ = 0.2 A</text>
      <rect x="616" y="322" width="228" height="38" rx="10" fill="#e8effc"/>
      <text x="730" y="346" text-anchor="middle">支路 I₂ = 0.3 A</text>
    </g>
    <text x="730" y="392" font-size="13" font-weight="900" fill="#b45309" text-anchor="middle">0.5 = 0.2 + 0.3</text>
    <text x="730" y="416" font-size="11.5" fill="#64748b" text-anchor="middle">干路电流最大，支路电流由电阻决定</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">并联电路的分流关系</text>
    <g font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">
      <rect x="58" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="180" y="556">干路电流等于支路之和</text>
      <rect x="328" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="450" y="556">I = I₁ + I₂</text>
      <rect x="598" y="530" width="244" height="40" rx="10" fill="#e8effc"/><text x="720" y="556">干路电流最大</text>
    </g>
  </g>

  <!-- 第三步：实验探究 -->
  <g class="p57-s3" data-zone="3">
    <text x="60" y="84" font-size="14" font-weight="800" fill="#1e3a8a">实验探究：多点测量、更换灯泡、多次实验，避免偶然性</text>

    <rect x="36" y="100" width="270" height="340" rx="16" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <text x="171" y="132" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联实验</text>
    <g font-size="12" font-weight="800" fill="#475569" text-anchor="middle">
      <text x="70" y="166" text-anchor="start">实验</text>
      <text x="145" y="166">I_A</text>
      <text x="205" y="166">I_B</text>
      <text x="265" y="166">I_C</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1.2">
      <line x1="56" y1="176" x2="286" y2="176"/>
      <line x1="56" y1="220" x2="286" y2="220"/>
      <line x1="56" y1="260" x2="286" y2="260"/>
      <line x1="56" y1="300" x2="286" y2="300"/>
    </g>
    <g font-size="12" fill="#334155" text-anchor="middle">
      <text x="70" y="204" text-anchor="start">1</text><text x="145" y="204">0.20 A</text><text x="205" y="204">0.20 A</text><text x="265" y="204">0.20 A</text>
      <text x="70" y="244" text-anchor="start">2</text><text x="145" y="244">0.30 A</text><text x="205" y="244">0.30 A</text><text x="265" y="244">0.30 A</text>
      <text x="70" y="284" text-anchor="start">3</text><text x="145" y="284">0.24 A</text><text x="205" y="284">0.24 A</text><text x="265" y="284">0.24 A</text>
    </g>
    <rect x="56" y="316" width="230" height="42" rx="10" fill="#e8effc"/>
    <text x="171" y="342" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">I_A = I_B = I_C</text>
    <text x="171" y="390" font-size="11.5" fill="#64748b" text-anchor="middle">换不同灯泡，结论仍成立</text>
    <text x="171" y="414" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">串联：电流处处相等</text>

    <rect x="320" y="100" width="270" height="340" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="2" filter="url(#softShadow)"/>
    <text x="455" y="132" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">并联实验</text>
    <g font-size="12" font-weight="800" fill="#475569" text-anchor="middle">
      <text x="354" y="166" text-anchor="start">实验</text>
      <text x="420" y="166">I₁</text>
      <text x="475" y="166">I₂</text>
      <text x="537" y="166">I干</text>
    </g>
    <g stroke="#e2e8f0" stroke-width="1.2">
      <line x1="340" y1="176" x2="570" y2="176"/>
      <line x1="340" y1="220" x2="570" y2="220"/>
      <line x1="340" y1="260" x2="570" y2="260"/>
      <line x1="340" y1="300" x2="570" y2="300"/>
    </g>
    <g font-size="12" fill="#334155" text-anchor="middle">
      <text x="354" y="204" text-anchor="start">1</text><text x="420" y="204">0.20 A</text><text x="475" y="204">0.30 A</text><text x="537" y="204">0.50 A</text>
      <text x="354" y="244" text-anchor="start">2</text><text x="420" y="244">0.24 A</text><text x="475" y="244">0.36 A</text><text x="537" y="244">0.60 A</text>
      <text x="354" y="284" text-anchor="start">3</text><text x="420" y="284">0.30 A</text><text x="475" y="284">0.30 A</text><text x="537" y="284">0.60 A</text>
    </g>
    <rect x="340" y="316" width="230" height="42" rx="10" fill="#fef3c7"/>
    <text x="455" y="342" font-size="13" font-weight="900" fill="#92400e" text-anchor="middle">I干 = I₁ + I₂</text>
    <text x="455" y="390" font-size="11.5" fill="#64748b" text-anchor="middle">换不同灯泡，结论仍成立</text>
    <text x="455" y="414" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">并联：干路等于支路之和</text>

    <rect x="610" y="100" width="254" height="340" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <text x="737" y="132" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验要点</text>
    <g font-size="12" fill="#334155">
      <circle cx="634" cy="170" r="11" fill="#d1fae5"/><text x="634" y="174" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">1</text>
      <text x="654" y="175" font-weight="700">电流表串联接入各点</text>
      <circle cx="634" cy="212" r="11" fill="#d1fae5"/><text x="634" y="216" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">2</text>
      <text x="654" y="217" font-weight="700">换用不同规格的灯泡</text>
      <circle cx="634" cy="254" r="11" fill="#d1fae5"/><text x="634" y="258" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">3</text>
      <text x="654" y="259" font-weight="700">多次测量，记录数据</text>
      <circle cx="634" cy="296" r="11" fill="#d1fae5"/><text x="634" y="300" font-size="11" font-weight="900" fill="#047857" text-anchor="middle">4</text>
      <text x="654" y="301" font-weight="700">分析数据，归纳规律</text>
    </g>
    <rect x="626" y="330" width="222" height="76" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="737" y="358" font-size="12.5" font-weight="900" fill="#047857" text-anchor="middle">多次实验，避免偶然性</text>
    <text x="737" y="382" font-size="11.5" fill="#065f46" text-anchor="middle">使结论具有普遍性</text>

    <rect x="36" y="486" width="828" height="100" rx="16" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
    <text x="450" y="516" font-size="14.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">实验结论</text>
    <text x="450" y="548" font-size="12.5" fill="#334155" text-anchor="middle">串联：I = I₁ = I₂（处处相等）　·　并联：I = I₁ + I₂（干路等于支路之和）</text>
    <text x="450" y="572" font-size="11.5" fill="#64748b" text-anchor="middle">更换不同规格的灯泡多次实验，结论才具有普遍性</text>
  </g>
</svg>
