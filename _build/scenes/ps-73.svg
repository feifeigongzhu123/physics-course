<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="波的形成：介质质点依次振动、横波与纵波、波传播振动形式和能量">
<style>
[data-scene="ps-73"] .s73-step{opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
[data-scene="ps-73"].s1 .s73-step1,[data-scene="ps-73"].s2 .s73-step2,[data-scene="ps-73"].s3 .s73-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s73draw{to{stroke-dashoffset:0}}
@keyframes s73pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes s73flow{to{stroke-dashoffset:-36}}
@keyframes s73pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
[data-scene="ps-73"].s1 .s73-rope{stroke-dasharray:1000;stroke-dashoffset:1000;animation:s73draw 1.5s ease .2s forwards}
[data-scene="ps-73"].s1 .s73-dot{animation:s73pulse 1.6s ease-in-out infinite}
[data-scene="ps-73"].s1 .s73-marrow{animation:s73pulse 1.6s ease-in-out infinite}
[data-scene="ps-73"].s2 .s73-rope2{stroke-dasharray:620;stroke-dashoffset:620;animation:s73draw 1.2s ease .2s forwards}
[data-scene="ps-73"].s2 .s73-coil{animation:s73pop .4s ease both;transform-box:fill-box;transform-origin:center}
[data-scene="ps-73"].s2 .s73-coil2{animation-delay:.08s}
[data-scene="ps-73"].s2 .s73-coil3{animation-delay:.16s}
[data-scene="ps-73"].s2 .s73-coil4{animation-delay:.24s}
[data-scene="ps-73"].s2 .s73-vib{animation:s73pulse 1.5s ease-in-out infinite}
[data-scene="ps-73"].s3 .s73-snap{animation:s73pop .5s ease both}
[data-scene="ps-73"].s3 .s73-snap2{animation:s73pop .5s ease .18s both}
[data-scene="ps-73"].s3 .s73-snap3{animation:s73pop .5s ease .36s both}
[data-scene="ps-73"].s3 .s73-mflow{stroke-dasharray:8 6;animation:s73flow 1s linear infinite}
[data-scene="ps-73"].s3 .s73-mdot{animation:s73pulse 1.8s ease-in-out infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="500" width="900" height="120" fill="url(#gBench)"/>
<line x1="0" y1="500" x2="900" y2="500" stroke="#cfd9e8" stroke-width="2"/>

<text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">波的形成：振动在介质中依次向外传播</text>

<!-- 第一步：介质质点依次振动 -->
<g class="s73-step s73-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">波源振动带动相邻质点，相邻质点再带动更远的质点</text>

  <rect x="55" y="100" width="790" height="272" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <line x1="90" y1="250" x2="820" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="806" y="270" font-size="11.5" fill="#64748b" text-anchor="end">平衡位置</text>

  <path class="s73-rope" d="M120 250 Q165 198 210 250 Q255 302 300 250 Q345 198 390 250 Q435 302 480 250 Q525 198 570 250 Q615 302 660 250 Q705 198 750 250 Q795 302 840 250" fill="none" stroke="#1d4ed8" stroke-width="3.4" stroke-linecap="round"/>

  <line class="s73-marrow" x1="300" y1="142" x2="620" y2="142" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="460" y="130" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">波的传播方向 v</text>

  <circle cx="105" cy="250" r="13" fill="#fbbf24" stroke="#b45309" stroke-width="2.2"/>
  <line x1="86" y1="226" x2="86" y2="274" stroke="#dc2626" stroke-width="2.4" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="105" y="292" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">波源</text>
  <text x="105" y="312" font-size="11" fill="#64748b" text-anchor="middle">上下振动</text>

  <g fill="#1e40af" class="s73-dot">
    <circle cx="165" cy="200" r="5.5"/><circle cx="255" cy="300" r="5.5"/>
    <circle cx="345" cy="200" r="5.5"/><circle cx="435" cy="300" r="5.5"/>
    <circle cx="615" cy="300" r="5.5"/><circle cx="705" cy="200" r="5.5"/>
  </g>
  <line class="s73-marrow" x1="165" y1="216" x2="165" y2="244" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>
  <line class="s73-marrow" x1="255" y1="284" x2="255" y2="256" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrRed)"/>

  <line x1="525" y1="198" x2="525" y2="302" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle cx="525" cy="200" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="540" y="194" font-size="11.5" font-weight="800" fill="#b91c1c">质点 M 不向右迁移</text>

  <text x="450" y="338" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">相邻质点相位依次落后，振动形式和能量向右传开</text>
  <text x="450" y="360" font-size="12" fill="#475569" text-anchor="middle">质点只在平衡位置附近上下振动，并不随波迁移</text>

  <rect x="70" y="390" width="360" height="86" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="250" y="416" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">形成机械波的两个条件</text>
  <text x="250" y="442" font-size="12.5" fill="#334155" text-anchor="middle">① 要有波源　② 要有介质</text>
  <text x="250" y="464" font-size="11.5" fill="#64748b" text-anchor="middle">真空不能传播机械波</text>

  <rect x="470" y="390" width="360" height="86" rx="12" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
  <text x="650" y="416" font-size="13" font-weight="900" fill="#1e3a8a" text-anchor="middle">机械振动在介质中的传播</text>
  <text x="650" y="442" font-size="12.5" fill="#334155" text-anchor="middle">传播的是振动形式和能量</text>
  <text x="650" y="464" font-size="11.5" fill="#64748b" text-anchor="middle">不是把质点搬到远处</text>
</g>

<!-- 第二步：横波和纵波 -->
<g class="s73-step s73-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">横波：振动方向垂直传播方向；纵波：两者在同一直线上</text>

  <rect x="50" y="105" width="390" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="245" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">横波（绳波）</text>
  <line x1="75" y1="260" x2="418" y2="260" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path class="s73-rope2" d="M80 260 Q120 215 160 260 Q200 305 240 260 Q280 215 320 260 Q360 305 400 260" fill="none" stroke="#1d4ed8" stroke-width="3.2" stroke-linecap="round"/>
  <text x="120" y="203" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">波峰</text>
  <text x="200" y="326" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">波谷</text>
  <line class="s73-vib" x1="280" y1="214" x2="280" y2="306" stroke="#dc2626" stroke-width="2.6" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="292" y="218" font-size="11.5" font-weight="700" fill="#b91c1c">振动方向</text>
  <line x1="120" y1="352" x2="260" y2="352" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arrBlue)"/>
  <text x="190" y="372" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">传播方向</text>
  <text x="245" y="406" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">振动 ⊥ 传播</text>

  <rect x="460" y="105" width="390" height="330" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="655" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">纵波（声波）</text>
  <g stroke="#1d4ed8" stroke-linecap="round">
    <g class="s73-coil"><line x1="490" y1="215" x2="490" y2="285" stroke-width="3.4"/><line x1="500" y1="215" x2="500" y2="285" stroke-width="3.4"/><line x1="510" y1="215" x2="510" y2="285" stroke-width="3.4"/><line x1="520" y1="215" x2="520" y2="285" stroke-width="3.4"/></g>
    <g class="s73-coil s73-coil2"><line x1="530" y1="215" x2="530" y2="285" stroke-width="3.4"/><line x1="540" y1="215" x2="540" y2="285" stroke-width="3.4"/><line x1="550" y1="215" x2="550" y2="285" stroke-width="3.4"/></g>
    <g class="s73-coil s73-coil3"><line x1="575" y1="215" x2="575" y2="285" stroke-width="3.4"/><line x1="600" y1="215" x2="600" y2="285" stroke-width="3.4"/><line x1="625" y1="215" x2="625" y2="285" stroke-width="3.4"/><line x1="650" y1="215" x2="650" y2="285" stroke-width="3.4"/></g>
    <g class="s73-coil s73-coil4"><line x1="675" y1="215" x2="675" y2="285" stroke-width="3.4"/><line x1="685" y1="215" x2="685" y2="285" stroke-width="3.4"/><line x1="695" y1="215" x2="695" y2="285" stroke-width="3.4"/><line x1="705" y1="215" x2="705" y2="285" stroke-width="3.4"/><line x1="715" y1="215" x2="715" y2="285" stroke-width="3.4"/><line x1="725" y1="215" x2="725" y2="285" stroke-width="3.4"/><line x1="735" y1="215" x2="735" y2="285" stroke-width="3.4"/></g>
    <g class="s73-coil s73-coil4"><line x1="760" y1="215" x2="760" y2="285" stroke-width="3.4"/><line x1="785" y1="215" x2="785" y2="285" stroke-width="3.4"/><line x1="810" y1="215" x2="810" y2="285" stroke-width="3.4"/></g>
  </g>
  <text x="520" y="202" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">密部</text>
  <text x="612" y="202" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">疏部</text>
  <line x1="560" y1="236" x2="560" y2="268" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="660" y1="236" x2="660" y2="268" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="520" y1="312" x2="720" y2="312" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arrBlue)"/>
  <text x="620" y="304" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">传播方向</text>
  <line class="s73-vib" x1="700" y1="342" x2="770" y2="342" stroke="#dc2626" stroke-width="2.6" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="735" y="362" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">振动方向</text>
  <text x="655" y="406" font-size="15" font-weight="900" fill="#1e3a8a" text-anchor="middle">振动 ∥ 传播</text>

  <rect x="70" y="450" width="760" height="38" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.6"/>
  <text x="450" y="474" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">横波有波峰和波谷，纵波有密部和疏部</text>
</g>

<!-- 第三步：波传播振动形式和能量 -->
<g class="s73-step s73-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">波传播的是振动形式和能量，不是介质中的质点</text>

  <rect x="50" y="105" width="500" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <defs>
    <clipPath id="s73clip"><rect x="65" y="135" width="475" height="220"/></clipPath>
  </defs>
  <text x="300" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">波形随时间向右平移</text>
  <g clip-path="url(#s73clip)">
    <line x1="75" y1="270" x2="540" y2="270" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
    <path class="s73-snap" d="M80 270 Q125 222 170 270 Q215 318 260 270 Q305 222 350 270 Q395 318 440 270 Q485 222 530 270 Q575 318 620 270" fill="none" stroke="#1d4ed8" stroke-width="3.2"/>
    <path class="s73-snap2" d="M125 270 Q170 222 215 270 Q260 318 305 270 Q350 222 395 270 Q440 318 485 270 Q530 222 575 270 Q620 318 665 270" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 6"/>
    <path class="s73-snap3" d="M170 270 Q215 222 260 270 Q305 318 350 270 Q395 222 440 270 Q485 318 530 270 Q575 222 620 270 Q665 318 710 270" fill="none" stroke="#059669" stroke-width="2.6" stroke-dasharray="3 5"/>
  </g>
  <line x1="350" y1="215" x2="350" y2="305" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <circle class="s73-mdot" cx="350" cy="222" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <circle cx="350" cy="294" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="350" cy="270" r="5.5" fill="#059669" stroke="#ffffff" stroke-width="1.6"/>
  <text x="350" y="342" font-size="11.5" font-weight="800" fill="#b91c1c" text-anchor="middle">质点 M 只上下振动</text>
  <line class="s73-mflow" x1="180" y1="160" x2="330" y2="160" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arrBlue)"/>
  <text x="255" y="148" font-size="11.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">波形右移</text>
  <g font-size="11" fill="#475569">
    <line x1="390" y1="150" x2="415" y2="150" stroke="#1d4ed8" stroke-width="3"/>
    <text x="420" y="154">t</text>
    <line x1="390" y1="170" x2="415" y2="170" stroke="#7c3aed" stroke-width="3" stroke-dasharray="7 4"/>
    <text x="420" y="174">t + Δt</text>
    <line x1="390" y1="190" x2="415" y2="190" stroke="#059669" stroke-width="2.6" stroke-dasharray="3 4"/>
    <text x="420" y="194">t + 2Δt</text>
  </g>

  <rect x="570" y="105" width="280" height="300" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="2" filter="url(#softShadow)"/>
  <text x="710" y="132" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">传播的是什么</text>
  <g>
    <circle cx="603" cy="170" r="7" fill="#059669"/><text x="622" y="175" font-size="12.5" font-weight="700" fill="#334155">振动形式（波形）</text>
    <circle cx="603" cy="212" r="7" fill="#059669"/><text x="622" y="217" font-size="12.5" font-weight="700" fill="#334155">能量</text>
    <circle cx="603" cy="254" r="7" fill="#059669"/><text x="622" y="259" font-size="12.5" font-weight="700" fill="#334155">信息（声音、信号）</text>
    <circle cx="603" cy="296" r="7" fill="#dc2626"/><text x="622" y="301" font-size="12.5" font-weight="700" fill="#b91c1c">质点（不迁移）</text>
  </g>
  <line x1="590" y1="320" x2="830" y2="320" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="710" y="346" font-size="11.5" fill="#475569" text-anchor="middle">波速由介质决定</text>
  <text x="710" y="368" font-size="11.5" fill="#475569" text-anchor="middle">频率由波源决定</text>
  <text x="710" y="390" font-size="11.5" fill="#475569" text-anchor="middle">质点不随波迁移</text>

  <rect x="70" y="420" width="760" height="60" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="450" y="445" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">波源振动 → 相邻质点依次振动 → 振动形式与能量向外传播</text>
  <text x="450" y="467" font-size="12" fill="#334155" text-anchor="middle">介质质点只在平衡位置附近振动，并不随波迁移</text>
</g>
</svg>
