<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="升华和凝华：樟脑丸与干冰升华、霜与雾凇凝华、初末态判断">
  <style>
[data-scene="pj-15"] .p15-z1,[data-scene="pj-15"] .p15-z2,[data-scene="pj-15"] .p15-z3{opacity:0;transition:opacity .45s}
[data-scene="pj-15"].s1 .p15-z1,[data-scene="pj-15"].s2 .p15-z2,[data-scene="pj-15"].s3 .p15-z3{opacity:1}
[data-scene="pj-15"] .p15-arrow{stroke-dasharray:9 7}
[data-scene="pj-15"].s1 .p15-arrow{animation:dashFlow 1.1s linear infinite}
[data-scene="pj-15"].s1 .p15-ball{transform-box:fill-box;transform-origin:center;animation:p15shrink 3.2s ease-in-out infinite alternate}
[data-scene="pj-15"].s1 .p15-ball:nth-of-type(2){animation-delay:.4s}
[data-scene="pj-15"].s1 .p15-ball:nth-of-type(3){animation-delay:.8s}
[data-scene="pj-15"] .p15-fog{animation:p15fog 4s ease-in-out infinite alternate}
[data-scene="pj-15"] .p15-fog:nth-of-type(2){animation-delay:-1.3s}
[data-scene="pj-15"] .p15-fog:nth-of-type(3){animation-delay:-2.4s}
[data-scene="pj-15"].s2 .p15-frost{animation:p15frost 2.4s ease-in-out infinite}
[data-scene="pj-15"].s2 .p15-frost:nth-of-type(2){animation-delay:.8s}
[data-scene="pj-15"] .p15-snow{animation:p15snow 3.4s linear infinite}
[data-scene="pj-15"] .p15-snow:nth-of-type(2){animation-delay:1.1s}
[data-scene="pj-15"] .p15-snow:nth-of-type(3){animation-delay:2.2s}
[data-scene="pj-15"].s3 .p15-flow{animation:dashFlow 1s linear infinite}
[data-scene="pj-15"].s3 .p15-ex{animation:popIn .5s ease both}
[data-scene="pj-15"].s3 .p15-ex:nth-of-type(2){animation-delay:.12s}
[data-scene="pj-15"].s3 .p15-ex:nth-of-type(3){animation-delay:.24s}
@keyframes p15snow{0%{transform:translateY(-10px);opacity:0}25%{opacity:1}100%{transform:translateY(46px);opacity:0}}
@keyframes p15fog{from{transform:translate(-10px,0);opacity:.55}to{transform:translate(10px,4px);opacity:.95}}
@keyframes p15frost{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes p15shrink{from{transform:scale(1)}to{transform:scale(.72)}}
  </style>
  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">升华和凝华：固气直接变化，一吸一放</text>

  <!-- ===== 第 1 步：升华 ===== -->
  <g class="p15-z1" data-zone="1">
    <rect x="40" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="240" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">升华：固态直接变成气态</text>

    <rect x="142" y="140" width="160" height="16" rx="5" fill="#cbd5e1"/>
    <rect x="214" y="130" width="16" height="12" rx="4" fill="#94a3b8"/>
    <rect x="120" y="156" width="200" height="214" rx="18" fill="#f9fcff" stroke="#93c5fd" stroke-width="3"/>
    <text x="220" y="186" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">樟脑丸（固态）</text>

    <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round">
      <line class="p15-arrow" x1="176" y1="304" x2="176" y2="228" marker-end="url(#arrBlue)"/>
      <line class="p15-arrow" x1="226" y1="298" x2="226" y2="220" marker-end="url(#arrBlue)"/>
      <line class="p15-arrow" x1="282" y1="306" x2="282" y2="232" marker-end="url(#arrBlue)"/>
    </g>
    <text x="306" y="252" font-size="11.5" font-weight="800" fill="#b45309">吸热</text>

    <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2">
      <circle class="p15-ball" cx="162" cy="336" r="13"/>
      <circle class="p15-ball" cx="200" cy="346" r="10"/>
      <circle class="p15-ball" cx="240" cy="334" r="15"/>
      <circle class="p15-ball" cx="276" cy="348" r="9"/>
      <circle class="p15-ball" cx="302" cy="332" r="11"/>
    </g>
    <circle cx="240" cy="328" r="27" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="150" y="376" font-size="11.5" fill="#64748b">虚线：原来大小</text>

    <text x="240" y="400" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">固态 → 气态 · 吸热</text>
    <text x="240" y="424" font-size="11.5" fill="#64748b" text-anchor="middle">樟脑丸变小、冰冻衣服变干、干冰变气体</text>
    <text x="240" y="444" font-size="11" fill="#94a3b8" text-anchor="middle">固态分子直接进入空气</text>

    <!-- 右卡：干冰 -->
    <rect x="460" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="660" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">干冰升华：大量吸热，周围变冷</text>

    <path d="M566 232 L566 378 Q566 394 582 394 L738 394 Q754 394 754 378 L754 232" fill="#f9fcff" stroke="#93c5fd" stroke-width="3"/>
    <path d="M576 378 Q580 348 600 344 Q604 326 626 328 Q636 312 658 322 Q676 312 690 328 Q712 324 718 344 Q738 350 744 378 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <g font-size="11.5" font-weight="700" fill="#334155">
      <text x="660" y="370" text-anchor="middle">干冰 固态 CO₂</text>
    </g>

    <g stroke="#1d4ed8" stroke-width="3" fill="none" stroke-linecap="round">
      <line class="p15-arrow" x1="612" y1="312" x2="612" y2="262" marker-end="url(#arrBlue)"/>
      <line class="p15-arrow" x1="660" y1="304" x2="660" y2="254" marker-end="url(#arrBlue)"/>
      <line class="p15-arrow" x1="708" y1="312" x2="708" y2="262" marker-end="url(#arrBlue)"/>
    </g>
    <text x="660" y="238" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">CO₂ 气体</text>

    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5">
      <ellipse class="p15-fog" cx="560" cy="404" rx="26" ry="12"/>
      <ellipse class="p15-fog" cx="530" cy="428" rx="34" ry="13"/>
      <ellipse class="p15-fog" cx="572" cy="440" rx="28" ry="11"/>
    </g>
    <text x="760" y="240" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="end">升华吸热</text>
    <text x="700" y="420" font-size="11.5" fill="#64748b" text-anchor="middle">白雾是水蒸气遇冷液化成的小水滴</text>
    <text x="700" y="442" font-size="11.5" fill="#64748b" text-anchor="middle">CO₂ 比空气重，白雾下沉</text>
  </g>

  <!-- ===== 第 2 步：凝华 ===== -->
  <g class="p15-z2" data-zone="2">
    <rect x="40" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="240" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">凝华：水蒸气直接变成冰晶</text>

    <rect x="80" y="116" width="300" height="288" rx="10" fill="#94a3b8"/>
    <rect x="92" y="128" width="276" height="264" rx="4" fill="#dbeafe"/>
    <line x1="230" y1="128" x2="230" y2="392" stroke="#94a3b8" stroke-width="8"/>
    <line x1="92" y1="262" x2="368" y2="262" stroke="#94a3b8" stroke-width="8"/>

    <g class="p15-frost" fill="none" stroke="#eff6ff" stroke-width="4" stroke-linecap="round">
      <path d="M96 386 C 126 348 146 318 172 296"/>
      <path d="M120 358 C 132 344 136 330 134 316"/>
      <path d="M146 330 C 160 320 168 308 166 294"/>
      <path d="M364 386 C 334 348 316 318 290 296"/>
      <path d="M340 358 C 328 344 324 330 326 316"/>
      <path d="M314 330 C 300 320 292 308 294 294"/>
      <path d="M96 132 C 128 168 148 190 176 206"/>
      <path d="M132 156 C 146 156 158 150 164 142"/>
      <path d="M364 132 C 332 168 312 190 284 206"/>
    </g>
    <g class="p15-frost" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5">
      <circle cx="176" cy="296" r="5"/><circle cx="290" cy="296" r="5"/>
      <circle cx="176" cy="206" r="5"/><circle cx="284" cy="206" r="5"/>
      <circle cx="134" cy="316" r="4"/><circle cx="326" cy="316" r="4"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#7c2d12">
      <text x="120" y="152">室外</text>
      <text x="340" y="382" text-anchor="end">室内</text>
    </g>
    <text x="240" y="426" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">冰花：气态 → 固态 · 放热</text>
    <text x="240" y="446" font-size="11" fill="#94a3b8" text-anchor="middle">水蒸气在冷玻璃内表面直接结冰晶</text>

    <!-- 右卡：雾凇与霜 -->
    <rect x="460" y="70" width="400" height="386" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="660" y="99" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">霜、雾凇：气态直接变固态</text>

    <path d="M470 402 H850 V456 H470 Z" fill="#f1f5f9"/>
    <path d="M470 402 H850" stroke="#e2e8f0" stroke-width="3"/>
    <g stroke="#78716c" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M648 402 L648 196"/>
      <path d="M648 300 L706 254"/>
      <path d="M648 250 L594 214"/>
      <path d="M706 254 L734 232"/>
      <path d="M594 214 L574 196"/>
    </g>
    <g class="p15-ice" stroke="#cfe6fb" stroke-width="8" stroke-linecap="round" fill="none" opacity=".95">
      <path d="M648 396 L648 200"/>
      <path d="M648 300 L706 254"/>
      <path d="M648 250 L594 214"/>
      <path d="M706 254 L734 232"/>
      <path d="M594 214 L574 196"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M648 390 L648 206"/>
      <path d="M648 300 L702 256"/>
      <path d="M648 250 L598 216"/>
      <path d="M706 254 L730 234"/>
      <path d="M594 214 L578 198"/>
    </g>
    <g stroke="#bfdbfe" stroke-width="1.8" stroke-linecap="round">
      <line x1="648" y1="196" x2="648" y2="184"/>
      <line x1="642" y1="190" x2="654" y2="190"/>
      <line x1="706" y1="254" x2="716" y2="244"/>
      <line x1="594" y1="214" x2="584" y2="206"/>
      <line x1="734" y1="232" x2="742" y2="224"/>
    </g>
    <g fill="#e0f2fe" stroke="#93c5fd" stroke-width="1.2">
      <circle cx="648" cy="200" r="5"/><circle cx="706" cy="254" r="4.5"/>
      <circle cx="594" cy="214" r="4.5"/><circle cx="734" cy="232" r="4"/>
      <circle cx="574" cy="196" r="4"/><circle cx="648" cy="300" r="4"/>
    </g>

    <g class="p15-snow" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round">
      <line x1="520" y1="150" x2="520" y2="162"/><line x1="515" y1="153" x2="525" y2="159"/><line x1="525" y1="153" x2="515" y2="159"/>
      <line x1="760" y1="130" x2="760" y2="142"/><line x1="755" y1="133" x2="765" y2="139"/><line x1="765" y1="133" x2="755" y2="139"/>
      <line x1="700" y1="160" x2="700" y2="172"/><line x1="695" y1="163" x2="705" y2="169"/><line x1="705" y1="163" x2="695" y2="169"/>
    </g>

    <rect x="786" y="204" width="14" height="120" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="793" cy="334" r="11" fill="#dc2626"/>
    <rect x="789" y="296" width="8" height="38" fill="#dc2626"/>
    <text x="793" y="192" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">-10 ℃</text>
    <text x="758" y="222" font-size="11" fill="#64748b" text-anchor="end">气温骤降</text>

    <text x="660" y="432" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">霜、雾凇：气态 → 固态 · 放热</text>
  </g>

  <!-- ===== 第 3 步：判断 ===== -->
  <g class="p15-z3" data-zone="3">
    <rect x="50" y="72" width="800" height="384" rx="20" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <text x="450" y="102" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">判断物态变化：只看初态和末态</text>

    <rect x="196" y="170" width="144" height="66" rx="12" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
    <text x="268" y="210" font-size="17" font-weight="900" fill="#334155" text-anchor="middle">固态</text>
    <rect x="560" y="170" width="144" height="66" rx="12" fill="#e8effc" stroke="#93c5fd" stroke-width="2"/>
    <text x="632" y="210" font-size="17" font-weight="900" fill="#1e40af" text-anchor="middle">气态</text>

    <path class="p15-flow" d="M344 186 C 404 126 504 126 556 184" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrBlue)"/>
    <text x="450" y="130" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">升华（吸热）</text>
    <path class="p15-flow" d="M556 224 C 500 282 400 282 344 226" fill="none" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="10 8" marker-end="url(#arrRed)"/>
    <text x="450" y="290" font-size="13" font-weight="800" fill="#b91c1c" text-anchor="middle">凝华（放热）</text>

    <rect x="402" y="184" width="100" height="42" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="452" y="212" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">液态</text>
    <g stroke="#dc2626" stroke-width="3" stroke-linecap="round">
      <line x1="434" y1="190" x2="470" y2="222"/>
      <line x1="470" y1="190" x2="434" y2="222"/>
    </g>
    <text x="452" y="250" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">中间不出现液态</text>

    <g class="p15-ex">
      <rect x="78" y="300" width="240" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="112" cy="332" r="11" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="112" cy="332" r="18" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="140" y="336" font-size="13" font-weight="800" fill="#334155">樟脑丸变小</text>
      <text x="102" y="368" font-size="11.5" fill="#475569">固态 → 气态</text>
      <text x="102" y="390" font-size="12" font-weight="800" fill="#1e40af">升华 · 吸热</text>
    </g>
    <g class="p15-ex">
      <rect x="330" y="300" width="240" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
        <line x1="366" y1="320" x2="366" y2="344"/>
        <line x1="354" y1="326" x2="378" y2="338"/>
        <line x1="378" y1="326" x2="354" y2="338"/>
      </g>
      <text x="394" y="336" font-size="13" font-weight="800" fill="#334155">霜、雾凇</text>
      <text x="354" y="368" font-size="11.5" fill="#475569">气态 → 固态</text>
      <text x="354" y="390" font-size="12" font-weight="800" fill="#b91c1c">凝华 · 放热</text>
    </g>
    <g class="p15-ex">
      <rect x="582" y="300" width="240" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <path d="M604 326 Q604 312 618 312 Q622 300 636 304 Q650 300 654 312 Q668 312 668 326 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <g stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
        <line x1="614" y1="332" x2="614" y2="340"/>
        <line x1="626" y1="332" x2="626" y2="340"/>
        <line x1="638" y1="332" x2="638" y2="340"/>
      </g>
      <text x="682" y="336" font-size="13" font-weight="800" fill="#334155">干冰降雨</text>
      <text x="606" y="368" font-size="11.5" fill="#475569">干冰升华吸热</text>
      <text x="606" y="390" font-size="12" font-weight="800" fill="#1e40af">使水蒸气凝华成冰晶</text>
    </g>

    <text x="450" y="434" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">先找初态，再找末态：固态与气态之间直接转化，就是升华或凝华</text>
  </g>
</svg>
