<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="熔化和凝固：冰熔化实验、晶体与非晶体曲线、凝固放热">
  <style>
    .p13-s1,.p13-s2,.p13-s3{opacity:0;visibility:hidden}
    .p13-s1{opacity:1;visibility:visible}
    [data-scene="pj-13"] .p13-s1,[data-scene="pj-13"] .p13-s2,[data-scene="pj-13"] .p13-s3{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    [data-scene="pj-13"].s1 .p13-s1,[data-scene="pj-13"].s2 .p13-s2,[data-scene="pj-13"].s3 .p13-s3{opacity:1;visibility:visible}
    @keyframes p13draw{to{stroke-dashoffset:0}}
    @keyframes p13flame{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.16) scaleX(.92)}}
    @keyframes p13flake{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes p13rise{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
    [data-scene="pj-13"].s1 .p13-flame{transform-box:fill-box;transform-origin:center bottom;animation:p13flame .6s ease-in-out infinite}
    [data-scene="pj-13"].s1 .p13-flake{animation:p13flake 1.8s ease-in-out infinite}
    [data-scene="pj-13"].s2 .p13-curve{stroke-dasharray:900;stroke-dashoffset:900;animation:p13draw 1.4s ease forwards}
    [data-scene="pj-13"].s2 .p13-curve:nth-of-type(2){animation-delay:.3s}
    [data-scene="pj-13"].s3 .p13-curve{stroke-dasharray:620;stroke-dashoffset:620;animation:p13draw 1.3s ease forwards}
    [data-scene="pj-13"].s3 .p13-curve:nth-of-type(2){animation-delay:.35s}
  </style>

  <rect width="900" height="620" fill="url(#gBg)"/>
  <rect width="900" height="620" fill="url(#dotsPat)"/>
  <rect y="470" width="900" height="150" fill="url(#gBench)"/>
  <line x1="0" y1="470" x2="900" y2="470" stroke="#cfd9e8" stroke-width="2"/>
  <text x="450" y="46" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">熔化和凝固：吸热熔化，放热凝固</text>

  <!-- ========== 第一步：熔化与凝固 ========== -->
  <g class="p13-s1" data-zone="1">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="176" height="30" rx="15" fill="#dbeafe"/>
    <text x="144" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">① 熔化与凝固</text>

    <!-- 熔化 -->
    <rect x="52" y="88" width="360" height="330" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="232" y="118" font-size="14" font-weight="800" fill="#1d4ed8" text-anchor="middle">熔化：固态 → 液态，吸热</text>
    <path d="M128 170 V310 H272 V170" fill="#ffffff" opacity=".55" stroke="#93c5fd" stroke-width="3"/>
    <rect x="134" y="232" width="132" height="72" fill="#bfdbfe"/>
    <rect x="146" y="188" width="32" height="28" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(-8 162 202)"/>
    <rect x="184" y="182" width="36" height="30" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(6 202 197)"/>
    <rect x="222" y="198" width="28" height="24" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(-6 236 210)"/>
    <rect x="190" y="126" width="16" height="176" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="198" cy="292" r="11" fill="#fee2e2" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="198" cy="292" r="8" fill="#ef4444"/>
    <rect x="193" y="214" width="10" height="70" rx="5" fill="#ef4444"/>
    <text x="150" y="214" font-size="12" font-weight="800" fill="#0369a1">冰</text>
    <text x="150" y="280" font-size="12" font-weight="800" fill="#1d4ed8">水</text>
    <line x1="100" y1="326" x2="100" y2="246" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
    <text x="88" y="304" font-size="12" font-weight="800" fill="#b91c1c" transform="rotate(-90 88 304)" text-anchor="middle">吸热</text>
    <g class="p13-flame" fill="#f97316">
      <path d="M154 340 q10 -22 20 0 q-10 8 -20 0 Z"/>
      <path d="M180 340 q12 -28 24 0 q-12 9 -24 0 Z" fill="#fbbf24"/>
      <path d="M208 340 q10 -22 20 0 q-10 8 -20 0 Z"/>
    </g>
    <rect x="146" y="338" width="106" height="9" rx="4" fill="#64748b"/>
    <text x="232" y="362" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">0 ℃ 的冰化成水，温度不变</text>
    <text x="232" y="382" font-size="12.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">固 → 液 · 吸热</text>

    <!-- 凝固 -->
    <rect x="488" y="88" width="360" height="330" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="668" y="118" font-size="14" font-weight="800" fill="#0f766e" text-anchor="middle">凝固：液态 → 固态，放热</text>
    <rect x="540" y="228" width="180" height="78" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2.5"/>
    <rect x="546" y="246" width="168" height="54" fill="#bfdbfe"/>
    <rect x="566" y="252" width="34" height="24" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(-8 583 264)"/>
    <rect x="612" y="258" width="30" height="22" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(7 627 269)"/>
    <rect x="654" y="250" width="34" height="24" rx="5" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2" transform="rotate(-5 671 262)"/>
    <text x="552" y="298" font-size="12" font-weight="800" fill="#0369a1">水</text>
    <text x="640" y="222" font-size="12" font-weight="800" fill="#1e40af">冰</text>
    <line x1="724" y1="236" x2="796" y2="202" stroke="#d97706" stroke-width="3" marker-end="url(#arrAmber)"/>
    <text x="790" y="228" font-size="12" font-weight="800" fill="#b45309" text-anchor="end">放热</text>
    <g class="p13-flake" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
      <g transform="translate(524,200)">
        <line x1="-7" y1="0" x2="7" y2="0"/><line x1="-3.5" y1="-6" x2="3.5" y2="6"/><line x1="-3.5" y1="6" x2="3.5" y2="-6"/>
      </g>
      <g transform="translate(742,184)">
        <line x1="-7" y1="0" x2="7" y2="0"/><line x1="-3.5" y1="-6" x2="3.5" y2="6"/><line x1="-3.5" y1="6" x2="3.5" y2="-6"/>
      </g>
      <g transform="translate(798,286)">
        <line x1="-7" y1="0" x2="7" y2="0"/><line x1="-3.5" y1="-6" x2="3.5" y2="6"/><line x1="-3.5" y1="6" x2="3.5" y2="-6"/>
      </g>
    </g>
    <text x="668" y="346" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">0 ℃ 的水结冰，温度不变</text>
    <text x="668" y="382" font-size="12.5" font-weight="800" fill="#0f766e" text-anchor="middle">液 → 固 · 放热</text>

    <rect x="52" y="430" width="796" height="22" rx="8" fill="#f0fdf4"/>
    <text x="450" y="446" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">熔化吸热，凝固放热，两个过程互为相反</text>
  </g>

  <!-- ========== 第二步：晶体与非晶体 ========== -->
  <g class="p13-s2" data-zone="2">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="186" height="30" rx="15" fill="#e8effc"/>
    <text x="149" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">② 晶体与非晶体</text>

    <!-- 坐标轴 -->
    <line x1="100" y1="400" x2="630" y2="400" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <line x1="100" y1="400" x2="100" y2="120" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="110" y="128" font-size="12.5" font-weight="700" fill="#334155">温度 T/℃</text>
    <text x="616" y="418" font-size="12.5" font-weight="700" fill="#334155" text-anchor="end">时间 t/min</text>
    <line x1="100" y1="315" x2="620" y2="315" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="88" y="319" font-size="12.5" font-weight="800" fill="#334155" text-anchor="end">0 ℃</text>

    <!-- 曲线 -->
    <path class="p13-curve" d="M100 392 C150 388 200 350 250 315 L470 315 C520 315 560 265 612 190" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
    <path class="p13-curve" d="M100 392 C180 378 250 350 320 315 C420 272 500 245 612 195" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="0"/>

    <line x1="250" y1="300" x2="470" y2="300" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="250" y1="295" x2="250" y2="305" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="470" y1="295" x2="470" y2="305" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="360" y="292" font-size="11.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">温度不变 · 有熔点</text>

    <circle cx="250" cy="315" r="4" fill="#1d4ed8"/>
    <circle cx="470" cy="315" r="4" fill="#1d4ed8"/>
    <text x="500" y="352" font-size="12.5" font-weight="800" fill="#1d4ed8">晶体（冰）</text>
    <line x1="498" y1="340" x2="486" y2="322" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="468" y="206" font-size="12.5" font-weight="800" fill="#b45309" text-anchor="middle">非晶体（石蜡）</text>
    <line x1="486" y1="214" x2="506" y2="244" stroke="#d97706" stroke-width="1.5"/>

    <!-- 说明 -->
    <rect x="656" y="88" width="192" height="330" rx="14" fill="#f8fbff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="676" y="118" font-size="14" font-weight="800" fill="#1e3a8a">关键区别</text>
    <rect x="672" y="132" width="160" height="84" rx="10" fill="#e8effc"/>
    <text x="752" y="156" font-size="14" font-weight="900" fill="#1d4ed8" text-anchor="middle">晶体</text>
    <text x="752" y="178" font-size="12" fill="#1e3a8a" text-anchor="middle">有固定熔点</text>
    <text x="752" y="200" font-size="11.5" fill="#475569" text-anchor="middle">冰 0 ℃ · 萘 80 ℃</text>
    <rect x="672" y="226" width="160" height="72" rx="10" fill="#fef3c7"/>
    <text x="752" y="250" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">非晶体</text>
    <text x="752" y="272" font-size="12" fill="#92400e" text-anchor="middle">没有固定熔点</text>
    <text x="752" y="290" font-size="11.5" fill="#78716c" text-anchor="middle">石蜡 · 玻璃</text>
    <rect x="672" y="310" width="160" height="92" rx="10" fill="#f0fdf4"/>
    <text x="752" y="334" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">晶体熔化条件</text>
    <text x="752" y="358" font-size="11.5" fill="#065f46" text-anchor="middle">① 温度达到熔点</text>
    <text x="752" y="380" font-size="11.5" fill="#065f46" text-anchor="middle">② 继续吸热</text>

    <rect x="52" y="426" width="796" height="26" rx="8" fill="#eef6ff"/>
    <text x="450" y="444" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">晶体熔化时吸热但温度不变；非晶体边吸热边升温</text>
  </g>

  <!-- ========== 第三步：熔化曲线与凝固曲线 ========== -->
  <g class="p13-s3" data-zone="3">
    <rect x="36" y="64" width="828" height="394" rx="18" fill="#ffffff" stroke="#dbe6f2" stroke-width="2"/>
    <rect x="56" y="80" width="186" height="30" rx="15" fill="#e8effc"/>
    <text x="149" y="100" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">③ 熔化曲线与凝固曲线</text>

    <!-- 熔化曲线 -->
    <text x="245" y="116" font-size="13.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">冰的熔化曲线（吸热）</text>
    <line x1="110" y1="360" x2="390" y2="360" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <line x1="110" y1="360" x2="110" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="118" y="132" font-size="11.5" font-weight="700" fill="#334155">T/℃</text>
    <text x="384" y="380" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">t</text>
    <line x1="110" y1="270" x2="390" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="98" y="274" font-size="12" font-weight="800" fill="#334155" text-anchor="end">0 ℃</text>
    <path class="p13-curve" d="M110 350 C135 344 160 305 185 270 L280 270 C305 270 330 235 378 165" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="185" cy="270" r="3.5" fill="#1d4ed8"/><circle cx="280" cy="270" r="3.5" fill="#1d4ed8"/>
    <text x="104" y="354" font-size="12" font-weight="900" fill="#1e40af">A</text>
    <text x="176" y="260" font-size="12" font-weight="900" fill="#1e40af">B</text>
    <text x="286" y="260" font-size="12" font-weight="900" fill="#1e40af">C</text>
    <text x="380" y="158" font-size="12" font-weight="900" fill="#1e40af">D</text>
    <text x="138" y="306" font-size="11" font-weight="700" fill="#1e40af">AB 固态升温</text>
    <text x="232" y="252" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">BC 固液共存</text>
    <text x="330" y="214" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">CD 液态升温</text>
    <line x1="212" y1="300" x2="212" y2="276" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <line x1="250" y1="300" x2="250" y2="276" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
    <text x="232" y="316" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">吸热，温度不变</text>
    <text x="245" y="396" font-size="11.5" fill="#475569" text-anchor="middle">BC 段温度保持 0 ℃</text>

    <!-- 凝固曲线 -->
    <text x="655" y="116" font-size="13.5" font-weight="800" fill="#b45309" text-anchor="middle">冰的凝固曲线（放热）</text>
    <line x1="520" y1="360" x2="800" y2="360" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <line x1="520" y1="360" x2="520" y2="140" stroke="#334155" stroke-width="2.5" marker-end="url(#arrBlue)"/>
    <text x="528" y="132" font-size="11.5" font-weight="700" fill="#334155">T/℃</text>
    <text x="794" y="380" font-size="11.5" font-weight="700" fill="#334155" text-anchor="end">t</text>
    <line x1="520" y1="270" x2="800" y2="270" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="508" y="274" font-size="12" font-weight="800" fill="#334155" text-anchor="end">0 ℃</text>
    <path class="p13-curve" d="M520 170 C550 200 570 240 590 270 L690 270 C710 300 735 330 782 350" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="590" cy="270" r="3.5" fill="#d97706"/><circle cx="690" cy="270" r="3.5" fill="#d97706"/>
    <text x="514" y="166" font-size="12" font-weight="900" fill="#b45309">A</text>
    <text x="582" y="260" font-size="12" font-weight="900" fill="#b45309">B</text>
    <text x="696" y="260" font-size="12" font-weight="900" fill="#b45309">C</text>
    <text x="784" y="344" font-size="12" font-weight="900" fill="#b45309">D</text>
    <text x="548" y="180" font-size="11" font-weight="700" fill="#b45309">液态降温</text>
    <line x1="566" y1="186" x2="558" y2="212" stroke="#d97706" stroke-width="1.2"/>
    <text x="640" y="252" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">固液共存</text>
    <text x="736" y="310" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">固态降温</text>
    <line x1="620" y1="290" x2="620" y2="316" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <line x1="660" y1="290" x2="660" y2="316" stroke="#d97706" stroke-width="2" marker-end="url(#arrAmber)"/>
    <text x="640" y="336" font-size="11" font-weight="800" fill="#b45309" text-anchor="middle">放热，温度不变</text>
    <text x="655" y="396" font-size="11.5" fill="#475569" text-anchor="middle">凝固点也是 0 ℃</text>

    <rect x="52" y="420" width="796" height="30" rx="8" fill="#fffbeb"/>
    <text x="450" y="440" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">同一晶体：熔点 = 凝固点；熔化吸热、凝固放热，温度都不变</text>
  </g>
</svg>
