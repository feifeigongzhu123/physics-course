<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="匀变速直线运动的速度与时间关系：速度公式、v-t 图像、公式应用">
<style>
[data-scene="ps-9"] .s9-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-9"].s1 .s9-step1,[data-scene="ps-9"].s2 .s9-step2,[data-scene="ps-9"].s3 .s9-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s9draw{to{stroke-dashoffset:0}}
@keyframes s9grow{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
@keyframes s9fade{0%{opacity:0}100%{opacity:.5}}
@keyframes s9pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s9pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
@keyframes s9flow{to{stroke-dashoffset:-30}}
[data-scene="ps-9"].s1 .s9-vel1{animation:s9grow .5s ease .1s both}
[data-scene="ps-9"].s1 .s9-vel2{animation:s9grow .5s ease .35s both}
[data-scene="ps-9"].s1 .s9-vel3{animation:s9grow .5s ease .6s both}
[data-scene="ps-9"].s1 .s9-acc{animation:s9pulse 1.6s ease-in-out infinite}
[data-scene="ps-9"].s1 .s9-card{animation:s9grow .5s ease .2s both}
[data-scene="ps-9"].s2 .s9-line{stroke-dasharray:380;stroke-dashoffset:380;animation:s9draw 1.1s ease .15s both}
[data-scene="ps-9"].s2 .s9-area{opacity:0;animation:s9fade .6s ease .75s both}
[data-scene="ps-9"].s2 .s9-tri{opacity:0;animation:s9grow .5s ease 1.1s both}
[data-scene="ps-9"].s2 .s9-dot{animation:s9pulse 1.5s ease-in-out infinite}
[data-scene="ps-9"].s3 .s9-card{transform-box:fill-box;transform-origin:center;animation:s9pop .5s ease both}
[data-scene="ps-9"].s3 .s9-card2{animation-delay:.15s}
[data-scene="ps-9"].s3 .s9-pos{stroke-dasharray:14 9;animation:s9flow 1.2s linear infinite}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">匀变速直线运动：速度与时间的关系</text>

<!-- 第一步：速度公式 -->
<g class="s9-step s9-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">速度均匀变化：每经过相同时间，速度改变量相同</text>

  <line x1="60" y1="318" x2="540" y2="318" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="60" y1="318" x2="540" y2="318" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="14 12"/>

  <g class="s9-vel1">
    <circle cx="100" cy="302" r="16" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="120" y1="302" x2="173" y2="302" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="148" y="282" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">v₀ = 2 m/s</text>
    <text x="100" y="348" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">t = 0</text>
  </g>
  <g class="s9-vel2">
    <circle cx="240" cy="302" r="16" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="260" y1="302" x2="363" y2="302" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="312" y="282" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">v = 4 m/s</text>
    <text x="240" y="348" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">t = 1 s</text>
  </g>
  <g class="s9-vel3">
    <circle cx="380" cy="302" r="16" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="400" y1="302" x2="553" y2="302" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="477" y="282" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">v = 6 m/s</text>
    <text x="380" y="348" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">t = 2 s</text>
  </g>

  <g class="s9-acc">
    <rect x="70" y="380" width="430" height="60" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="90" y="406" font-size="15" font-weight="900" fill="#1e3a8a">a = 2 m/s²</text>
    <text x="90" y="428" font-size="12.5" fill="#334155">每经过 1 s，速度增加 2 m/s（方向不变）</text>
  </g>

  <g class="s9-card">
    <rect x="570" y="95" width="290" height="250" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="570" y="95" width="290" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="715" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">速度公式</text>
    <text x="715" y="176" font-size="24" font-weight="900" fill="#1d4ed8" text-anchor="middle">v = v₀ + a t</text>
    <line x1="592" y1="198" x2="838" y2="198" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="592" y="222" font-size="12.5" fill="#334155">v₀：初速度</text>
    <text x="592" y="247" font-size="12.5" fill="#334155">a：加速度（恒定）</text>
    <text x="592" y="272" font-size="12.5" fill="#334155">t：经历的时间</text>
    <text x="592" y="297" font-size="12.5" fill="#334155">v：t 时刻的瞬时速度</text>
    <text x="715" y="328" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">速度随时间均匀变化</text>
  </g>

  <g class="s9-card">
    <rect x="570" y="365" width="290" height="115" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="715" y="392" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">匀变速直线运动的特点</text>
    <text x="715" y="418" font-size="12" fill="#475569" text-anchor="middle">加速度 a 的大小、方向都不变</text>
    <text x="715" y="443" font-size="12" fill="#475569" text-anchor="middle">v-t 图线是一条倾斜直线</text>
    <text x="715" y="467" font-size="11.5" fill="#64748b" text-anchor="middle">加速与减速都适用，a 可取正负</text>
  </g>
</g>

<!-- 第二步：v-t 图像 -->
<g class="s9-step s9-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">v-t 图像：纵轴截距是 v₀，斜率是加速度 a</text>

  <line x1="120" y1="455" x2="475" y2="455" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="120" y1="455" x2="120" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="484" y="460" font-size="14" font-weight="800" fill="#475569">t</text>
  <text x="112" y="126" font-size="14" font-weight="800" fill="#475569" text-anchor="end">v</text>

  <polygon class="s9-area" points="120,355 420,155 420,455 120,455" fill="#dbeafe"/>
  <line class="s9-line" x1="120" y1="355" x2="420" y2="155" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

  <g class="s9-tri">
    <line x1="120" y1="355" x2="300" y2="355" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="300" y1="355" x2="300" y2="235" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="210" y="378" font-size="12.5" font-weight="800" fill="#64748b" text-anchor="middle">Δt</text>
    <text x="312" y="302" font-size="12.5" font-weight="800" fill="#64748b">Δv</text>
    <text x="350" y="214" font-size="13" font-weight="800" fill="#b91c1c">a = Δv / Δt</text>
  </g>

  <circle class="s9-dot" cx="120" cy="355" r="6" fill="#dc2626"/>
  <text x="108" y="352" font-size="13" font-weight="900" fill="#b91c1c" text-anchor="end">v₀</text>
  <text x="132" y="338" font-size="11.5" font-weight="700" fill="#b45309">截距 = 初速度</text>
  <text x="388" y="252" font-size="12" font-weight="800" fill="#1d4ed8">斜率 = a</text>
  <text x="270" y="430" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">面积 = 位移</text>
  <text x="103" y="474" font-size="12" font-weight="700" fill="#64748b">O</text>

  <rect x="560" y="95" width="300" height="390" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
  <rect x="560" y="95" width="300" height="7" rx="3.5" fill="#1d4ed8"/>
  <text x="710" y="130" font-size="14" font-weight="900" fill="#1e3a8a" text-anchor="middle">v-t 图像怎么看</text>
  <g font-size="12.5" fill="#334155">
    <rect x="584" y="158" width="10" height="10" rx="2" fill="#dc2626"/>
    <text x="604" y="168">纵轴截距 = 初速度 v₀</text>
    <rect x="584" y="192" width="10" height="10" rx="2" fill="#1d4ed8"/>
    <text x="604" y="202">斜率 = 加速度 a</text>
    <rect x="584" y="226" width="10" height="10" rx="2" fill="#059669"/>
    <text x="604" y="236">倾斜直线 → 匀变速</text>
    <rect x="584" y="260" width="10" height="10" rx="2" fill="#d97706"/>
    <text x="604" y="270">面积 = 位移</text>
  </g>
  <rect x="580" y="292" width="260" height="166" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="710" y="317" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle">斜率的正负</text>
  <text x="710" y="342" font-size="12" fill="#475569" text-anchor="middle">斜率为正：a 与 v 同向，加速</text>
  <text x="710" y="366" font-size="12" fill="#475569" text-anchor="middle">斜率为负：a 与 v 反向，减速</text>
  <text x="710" y="390" font-size="12" fill="#475569" text-anchor="middle">斜率不变：加速度保持不变</text>
  <text x="710" y="414" font-size="11.5" fill="#64748b" text-anchor="middle">图线越陡，速度变化越快</text>
  <text x="710" y="440" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">截距与斜率都有物理意义</text>
</g>

<!-- 第三步：公式应用 -->
<g class="s9-step s9-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">应用：先规定正方向，再把已知量代入 v = v₀ + a t</text>

  <g class="s9-card">
    <rect x="70" y="95" width="370" height="178" rx="14" fill="#ffffff" stroke="#bfdbfe" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="70" y="95" width="7" height="178" rx="3.5" fill="#1d4ed8"/>
    <text x="94" y="123" font-size="14" font-weight="900" fill="#1e3a8a">例 1：加速</text>
    <text x="94" y="150" font-size="12" fill="#475569">已知 v₀ = 2 m/s，a = 1.5 m/s²，t = 4 s</text>
    <text x="94" y="180" font-size="13" font-weight="700" fill="#334155">v = v₀ + a t</text>
    <text x="94" y="212" font-size="16" font-weight="900" fill="#1d4ed8">v = 2 + 1.5 × 4 = 8 m/s</text>
    <text x="94" y="242" font-size="11.5" fill="#64748b">a 与 v₀ 同向，速度增大</text>
    <line x1="330" y1="140" x2="390" y2="200" stroke="#93c5fd" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <g class="s9-card s9-card2">
    <rect x="470" y="95" width="380" height="178" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="470" y="95" width="7" height="178" rx="3.5" fill="#dc2626"/>
    <text x="494" y="123" font-size="14" font-weight="900" fill="#b91c1c">例 2：减速（刹车）</text>
    <text x="494" y="150" font-size="12" fill="#475569">已知 v₀ = 10 m/s，a = −2 m/s²，t = 3 s</text>
    <text x="494" y="180" font-size="13" font-weight="700" fill="#334155">v = v₀ + a t</text>
    <text x="494" y="212" font-size="16" font-weight="900" fill="#b91c1c">v = 10 + (−2) × 3 = 4 m/s</text>
    <text x="494" y="242" font-size="11.5" fill="#64748b">a 与 v₀ 反向，速度减小</text>
    <line x1="730" y1="140" x2="790" y2="200" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <g class="s9-card">
    <rect x="70" y="295" width="780" height="62" rx="12" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.5"/>
    <line class="s9-pos" x1="100" y1="322" x2="820" y2="322" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
    <text x="450" y="313" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">规定正方向</text>
    <text x="450" y="345" font-size="12" fill="#334155" text-anchor="middle">与正方向相同的量取正，相反的量取负</text>
  </g>

  <g class="s9-card s9-card2">
    <rect x="70" y="378" width="780" height="120" rx="14" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="94" y="405" font-size="13" font-weight="900" fill="#1e3a8a">代入前注意三件事</text>
    <text x="94" y="432" font-size="12.5" fill="#334155">1. 单位统一为 m/s、m/s²、s，再代入计算。</text>
    <text x="94" y="458" font-size="12.5" fill="#334155">2. v 为负，表示末速度方向与正方向相反，不是“速度变小”。</text>
    <text x="94" y="484" font-size="12.5" fill="#334155">3. 刹车类问题：先判断物体何时停止，再代入公式。</text>
  </g>
</g>
</svg>
