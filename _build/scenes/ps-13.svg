<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="摩擦力：静摩擦力、滑动摩擦力、最大静摩擦力">
<style>
[data-scene="ps-13"] .s13-step{opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s}
[data-scene="ps-13"].s1 .s13-step1,[data-scene="ps-13"].s2 .s13-step2,[data-scene="ps-13"].s3 .s13-step3{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s}
@keyframes s13draw{to{stroke-dashoffset:0}}
@keyframes s13grow{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
@keyframes s13pop{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes s13pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes s13flow{to{stroke-dashoffset:-28}}
[data-scene="ps-13"].s1 .s13-f{animation:s13grow .5s ease .15s both}
[data-scene="ps-13"].s1 .s13-f2{animation-delay:.45s}
[data-scene="ps-13"].s1 .s13-trend{stroke-dasharray:10 7;animation:s13flow 1.2s linear infinite}
[data-scene="ps-13"].s1 .s13-card{animation:s13grow .5s ease .3s both}
[data-scene="ps-13"].s1 .s13-pulse{animation:s13pulse 1.6s ease-in-out infinite}
[data-scene="ps-13"].s2 .s13-block{animation:s13grow .5s ease .1s both}
[data-scene="ps-13"].s2 .s13-f{opacity:0;animation:s13grow .5s ease .4s both}
[data-scene="ps-13"].s2 .s13-card{animation:s13grow .5s ease .25s both}
[data-scene="ps-13"].s2 .s13-card2{animation-delay:.45s}
[data-scene="ps-13"].s2 .s13-v{stroke-dasharray:14 8;animation:s13flow 1s linear infinite}
[data-scene="ps-13"].s3 .s13-line{stroke-dasharray:320;stroke-dashoffset:320;animation:s13draw 1.1s ease .15s both}
[data-scene="ps-13"].s3 .s13-guide{opacity:0;animation:s13grow .5s ease 1s both}
[data-scene="ps-13"].s3 .s13-card{animation:s13grow .5s ease .3s both}
[data-scene="ps-13"].s3 .s13-tag{transform-box:fill-box;transform-origin:center;animation:s13pop .5s ease 1.1s both}
</style>

<rect width="900" height="620" fill="url(#gBg)"/>
<rect width="900" height="620" fill="url(#dotsPat)"/>
<rect y="532" width="900" height="88" fill="url(#gBench)"/>
<line x1="0" y1="532" x2="900" y2="532" stroke="#cbd5e1" stroke-width="2.5"/>

<text x="450" y="44" font-size="19" font-weight="800" fill="#1d4ed8" text-anchor="middle">摩擦力：静摩擦、滑动摩擦与最大静摩擦</text>

<!-- 第一步：静摩擦力 -->
<g class="s13-step s13-step1" data-zone="1">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">静摩擦力：有相对运动趋势，但没有相对运动</text>

  <line x1="60" y1="450" x2="530" y2="450" stroke="#64748b" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="75" y1="450" x2="60" y2="466"/><line x1="115" y1="450" x2="100" y2="466"/>
    <line x1="155" y1="450" x2="140" y2="466"/><line x1="195" y1="450" x2="180" y2="466"/>
    <line x1="235" y1="450" x2="220" y2="466"/><line x1="275" y1="450" x2="260" y2="466"/>
    <line x1="315" y1="450" x2="300" y2="466"/><line x1="355" y1="450" x2="340" y2="466"/>
    <line x1="395" y1="450" x2="380" y2="466"/><line x1="435" y1="450" x2="420" y2="466"/>
    <line x1="475" y1="450" x2="460" y2="466"/><line x1="515" y1="450" x2="500" y2="466"/>
  </g>

  <rect x="190" y="350" width="170" height="100" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
  <text x="275" y="392" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">物块静止</text>
  <text x="275" y="416" font-size="11.5" fill="#64748b" text-anchor="middle">没有相对运动</text>

  <g class="s13-f">
    <line x1="372" y1="382" x2="500" y2="382" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="438" y="366" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">F</text>
    <text x="438" y="406" font-size="11" fill="#b91c1c" text-anchor="middle">外力</text>
  </g>
  <g class="s13-f s13-f2">
    <line x1="190" y1="430" x2="80" y2="430" stroke="#059669" stroke-width="4" marker-end="url(#arrGreen)"/>
    <text x="135" y="418" font-size="15" font-weight="900" fill="#047857" text-anchor="middle">f</text>
    <text x="135" y="448" font-size="11" fill="#047857" text-anchor="middle">静摩擦</text>
  </g>

  <line class="s13-trend" x1="230" y1="326" x2="360" y2="326" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <text x="295" y="312" font-size="11.5" font-weight="800" fill="#b45309" text-anchor="middle">相对运动趋势</text>

  <g class="s13-pulse">
    <rect x="70" y="478" width="450" height="34" rx="10" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="295" y="500" font-size="12.5" font-weight="800" fill="#047857" text-anchor="middle">F 与 f 二力平衡：f = F，方向相反</text>
  </g>

  <g class="s13-card">
    <rect x="550" y="95" width="320" height="380" rx="16" fill="#ffffff" stroke="#bbf7d0" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="550" y="95" width="320" height="7" rx="3.5" fill="#059669"/>
    <text x="710" y="130" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">静摩擦力</text>
    <text x="572" y="160" font-size="12" font-weight="800" fill="#047857">产生条件</text>
    <text x="572" y="184" font-size="11.5" fill="#334155">① 两物体接触且相互挤压</text>
    <text x="572" y="206" font-size="11.5" fill="#334155">② 接触面粗糙</text>
    <text x="572" y="228" font-size="11.5" fill="#334155">③ 有相对运动趋势，但没有相对运动</text>
    <line x1="572" y1="244" x2="848" y2="244" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="572" y="270" font-size="12" font-weight="800" fill="#047857">方向</text>
    <text x="572" y="294" font-size="11.5" fill="#334155">与相对运动趋势方向相反</text>
    <text x="572" y="322" font-size="12" font-weight="800" fill="#047857">大小</text>
    <text x="572" y="346" font-size="11.5" fill="#334155">随外力变化，由平衡条件决定</text>
    <text x="710" y="380" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">0 ≤ f ≤ fmax</text>
    <text x="710" y="406" font-size="11.5" fill="#64748b" text-anchor="middle">静摩擦力不是定值</text>
    <text x="710" y="432" font-size="11.5" fill="#64748b" text-anchor="middle">推力增大，静摩擦力也增大</text>
    <text x="710" y="458" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">物体仍静止时，f 与 F 等大反向</text>
  </g>
</g>

<!-- 第二步：滑动摩擦力 -->
<g class="s13-step s13-step2" data-zone="2">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">滑动摩擦力：f = μN，方向与相对运动方向相反</text>

  <line x1="60" y1="450" x2="530" y2="450" stroke="#64748b" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="1.6">
    <line x1="75" y1="450" x2="60" y2="466"/><line x1="115" y1="450" x2="100" y2="466"/>
    <line x1="155" y1="450" x2="140" y2="466"/><line x1="195" y1="450" x2="180" y2="466"/>
    <line x1="235" y1="450" x2="220" y2="466"/><line x1="275" y1="450" x2="260" y2="466"/>
    <line x1="315" y1="450" x2="300" y2="466"/><line x1="355" y1="450" x2="340" y2="466"/>
    <line x1="395" y1="450" x2="380" y2="466"/><line x1="435" y1="450" x2="420" y2="466"/>
    <line x1="475" y1="450" x2="460" y2="466"/><line x1="515" y1="450" x2="500" y2="466"/>
  </g>

  <g class="s13-block">
    <rect x="180" y="350" width="180" height="100" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/>
    <text x="270" y="392" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">物块</text>
    <text x="270" y="416" font-size="11.5" fill="#64748b" text-anchor="middle">相对地面向右运动</text>
  </g>

  <g class="s13-f">
    <line class="s13-v" x1="360" y1="326" x2="490" y2="326" stroke="#1d4ed8" stroke-width="3.5" marker-end="url(#arrBlue)"/>
    <text x="425" y="312" font-size="14" font-weight="900" fill="#1e40af" text-anchor="middle">v</text>
  </g>
  <g class="s13-f">
    <line x1="180" y1="428" x2="70" y2="428" stroke="#dc2626" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="125" y="414" font-size="15" font-weight="900" fill="#b91c1c" text-anchor="middle">f</text>
  </g>
  <line x1="410" y1="450" x2="410" y2="342" stroke="#059669" stroke-width="3.5" marker-end="url(#arrGreen)"/>
  <text x="424" y="364" font-size="14" font-weight="900" fill="#047857">N</text>
  <line x1="450" y1="342" x2="450" y2="450" stroke="#7c3aed" stroke-width="3.5" marker-end="url(#arrBlue)"/>
  <text x="464" y="440" font-size="14" font-weight="900" fill="#6d28d9">G</text>

  <text x="295" y="490" font-size="11.5" fill="#64748b" text-anchor="middle">水平面上：N = mg，与接触面积无关</text>

  <g class="s13-card">
    <rect x="550" y="95" width="320" height="230" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="550" y="95" width="320" height="7" rx="3.5" fill="#dc2626"/>
    <text x="710" y="130" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">滑动摩擦力</text>
    <text x="710" y="176" font-size="24" font-weight="900" fill="#b91c1c" text-anchor="middle">f = μ N</text>
    <text x="572" y="206" font-size="11.5" fill="#334155">μ：动摩擦因数，无单位</text>
    <text x="572" y="230" font-size="11.5" fill="#334155">由接触面材料和粗糙程度决定</text>
    <text x="572" y="254" font-size="11.5" fill="#334155">N：接触面间的正压力</text>
    <text x="572" y="278" font-size="11.5" fill="#334155">方向：与相对运动方向相反</text>
    <text x="710" y="306" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">与接触面积、相对速度大小无关（近似）</text>
  </g>

  <g class="s13-card s13-card2">
    <rect x="550" y="345" width="320" height="130" rx="14" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.5"/>
    <text x="710" y="371" font-size="12.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">算一算</text>
    <text x="572" y="396" font-size="12" fill="#334155">m = 5 kg，μ = 0.4，g = 10 N/kg</text>
    <text x="572" y="420" font-size="12" fill="#334155">N = mg = 50 N</text>
    <text x="572" y="446" font-size="14" font-weight="900" fill="#b91c1c">f = μN = 0.4 × 50 = 20 N</text>
    <text x="710" y="466" font-size="11" fill="#64748b" text-anchor="middle">f 的方向与 v 相反</text>
  </g>
</g>

<!-- 第三步：最大静摩擦力 -->
<g class="s13-step s13-step3" data-zone="3">
  <text x="70" y="82" font-size="14" font-weight="800" fill="#1e3a8a">静摩擦有最大值，超过后物体开始滑动</text>

  <line x1="130" y1="465" x2="500" y2="465" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="130" y1="465" x2="130" y2="112" stroke="#475569" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="510" y="470" font-size="13" font-weight="800" fill="#475569">F</text>
  <text x="120" y="126" font-size="13" font-weight="800" fill="#475569" text-anchor="end">f</text>
  <text x="114" y="482" font-size="11.5" font-weight="700" fill="#64748b">O</text>

  <line class="s13-line" x1="130" y1="465" x2="340" y2="255" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <line class="s13-line" x1="340" y1="255" x2="360" y2="273" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line class="s13-line" x1="360" y1="273" x2="480" y2="273" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <circle cx="340" cy="255" r="6" fill="#059669"/>
  <circle cx="360" cy="273" r="5.5" fill="#dc2626"/>
  <text x="328" y="240" font-size="12.5" font-weight="900" fill="#047857" text-anchor="end">fmax</text>
  <text x="474" y="258" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="end">f滑 = μN</text>
  <text x="235" y="330" font-size="12.5" font-weight="800" fill="#047857">f = F（静摩擦）</text>

  <g class="s13-guide">
    <line x1="340" y1="255" x2="340" y2="465" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <text x="346" y="490" font-size="11.5" font-weight="800" fill="#64748b">开始滑动</text>
  </g>

  <g class="s13-tag">
    <rect x="373" y="300" width="120" height="28" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
    <text x="433" y="319" font-size="11" font-weight="800" fill="#7c5a30" text-anchor="middle">fmax 略大于 f滑</text>
  </g>

  <g class="s13-card">
    <rect x="540" y="95" width="330" height="360" rx="16" fill="#ffffff" stroke="#c7d7f5" stroke-width="2" filter="url(#softShadow)"/>
    <rect x="540" y="95" width="330" height="7" rx="3.5" fill="#1d4ed8"/>
    <text x="705" y="130" font-size="16" font-weight="900" fill="#1e3a8a" text-anchor="middle">最大静摩擦力</text>
    <text x="562" y="164" font-size="12" font-weight="800" fill="#047857">静摩擦力的变化</text>
    <text x="562" y="190" font-size="11.5" fill="#334155">外力 F 增大，静摩擦力 f 也增大</text>
    <text x="562" y="214" font-size="11.5" fill="#334155">物体仍静止时，始终有 f = F</text>
    <text x="562" y="238" font-size="11.5" fill="#334155">f 增大到 fmax 时，物体即将滑动</text>
    <line x1="562" y1="254" x2="848" y2="254" stroke="#e8eef7" stroke-width="1.5"/>
    <text x="705" y="284" font-size="14" font-weight="900" fill="#b91c1c" text-anchor="middle">fmax 略大于 f滑</text>
    <text x="705" y="310" font-size="12" fill="#475569" text-anchor="middle">最大静摩擦力由接触面性质决定</text>
    <text x="705" y="336" font-size="12" fill="#475569" text-anchor="middle">通常近似认为 fmax ≈ f滑</text>
    <rect x="560" y="356" width="290" height="80" rx="10" fill="#e8effc" stroke="#bfdbfe" stroke-width="1.4"/>
    <text x="705" y="380" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">推力超过 fmax 后</text>
    <text x="705" y="403" font-size="11.5" fill="#475569" text-anchor="middle">物体开始滑动，摩擦力变为滑动摩擦</text>
    <text x="705" y="424" font-size="11" fill="#64748b" text-anchor="middle">此时 f = μN，与推力大小无关</text>
  </g>

  <rect x="70" y="500" width="440" height="28" rx="8" fill="#f8fafc" stroke="#dbe6f2" stroke-width="1.3"/>
  <text x="290" y="519" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">静摩擦：0 ≤ f ≤ fmax　　滑动摩擦：f = μN</text>
</g>
</svg>
